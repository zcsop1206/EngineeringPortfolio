m areas, and the loss rate fell 64 percent between 2015 to 2017 and 2020 to 2022; WRI credits fire law enforcement, peat restoration and the moratorium, with wetter weather, lower palm oil prices and corporate pledges also in the mix. At sea, Hilborn's 2020 study of stocks making up half the world's catch finds assessed, managed stocks increasing on average, while regions with weak management harvest at three times the rate and hold half the abundance. The illegal loggers and the pirate fishers are individuals; the thing that stops them is a ranger, a satellite and a port inspection, which is policy (CL2).","if_they_push":"Fragile is still the lever. When enforcement was funded, Amazon clearing fell by about four fifths; when it was dismantled, clearing rose. Both halves show the forest tracks the policy, not the chainsaw crew's conscience. Ask what individual action stops a logging crew in Kalimantan or a trawler at night.","comeback":"Brazil's enforcement lasted only while one government funded it and collapsed in four years; a lever that fragile is our point, not yours.","weak":false,"tags":["illegal logging","indonesia","brazil","amazon","enforcement","corruption","iuu fishing","quotas","interpol","unep","moratorium","fishing","deforestation","compliance","f1","cl2"],"phrasings":["Indonesia banned forest clearing and the forests kept falling, so what did the law do?","Most tropical logging is illegal, so policy clearly isn't working.","Fishing quotas exist everywhere and one in five fish is still caught illegally.","Laws are only as good as the people who follow them.","You can pass any law you like, enforcement on the ground is what matters."],"frames":["F1","CL2"],"uses":["OW12"],"notes":"Checker re-fetched all five rebuttal sources and the D+C and UN pages. The gov.uk page has only the 22 percent; the country-level falls (Indonesia, Brazilian Amazon) were not on it, so they are out of the detail and the deny route. Eco-Business also credits palm oil prices, rain and corporate pledges, now stated. The 50 to 90 percent and 30 to 100 billion figures are on D+C, not the UNEP PDF. Hilborn's co-authors include fisheries agency staff. The old if_they_push did not answer the fragility comeback; it now does. No duplicate in the corpus; GL01 (Nepal) is the nearest.","sources":[{"title":"Report shows success in fight against illegal logging (Chatham House 2010)","publisher":"UK Government (DFID news)","year":2010,"url":"https://www.gov.uk/government/news/report-shows-success-in-fight-against-illegal-logging","finding":"Fetched. Global production of illegal timber 'has fallen by 22% since 2002', attributed to international effort on forest governance. No country figures on the page; Indonesia and Cameroon appear only as countries DFID supports and the Brazilian Amazon is not mentioned.","verified":true},{"title":"Indonesia Is Reducing Deforestation, but Problem Areas Remain","publisher":"World Resources Institute","year":2019,"url":"https://www.wri.org/insights/indonesia-reducing-deforestation-problem-areas-remain","finding":"Fetched. Global Forest Watch found a 40 percent decrease in primary forest loss in 2018 versus the 2002 to 2016 average; 45 percent drop inside moratorium areas; credits law enforcement against fires and clearing, restoration of 2.4 million hectares of peatland under a 2016 regulation, and the moratorium; also wetter weather.","verified":true},{"title":"Explainer: Why deforestation has hit a historic low in Indonesia","publisher":"Eco-Business","year":2023,"url":"https://www.eco-business.com/news/explainer-why-deforestation-has-hit-a-historic-low-in-indonesia/","finding":"Fetched. Primary forest loss rate fell 64 percent between 2015 to 2017 and 2020 to 2022; moratorium introduced 2011, permanent 2019, about 66 million hectares; credits fire control and stricter permitting, and also La Nina rainfall, falling palm oil prices and corporate no-deforestation pledges.","verified":true},{"title":"Fisheries management is good for fish (summary of Hilborn et al., PNAS 2020)","publisher":"University of Cape Town, Faculty of Science","year":2020,"url":"https://science.uct.ac.za/node/3703","finding":"Fetched. 882 assessed stocks representing 50 percent of global catch; on average abundance is increasing and at management targets; regions with less-developed management harvest at three times the rate and hold half the abundance.","verified":true},{"title":"Port State Measures Agreement","publisher":"FAO","year":2025,"url":"https://www.fao.org/port-state-measures/en/","finding":"Fetched. 'The first binding international agreement to specifically target' IUU fishing; entered into force June 2016; aims to prevent IUU vessels using ports and landing catches.","verified":true}],"their_sources":[{"title":"Report: illegal deforestation (summary of UNEP/INTERPOL 'Green Carbon, Black Trade')","publisher":"D+C Development and Cooperation","year":2012,"url":"https://dandc.eu/en/article/report-illegal-deforestation-unep-and-interpol","finding":"Fetched. 15 to 30 percent of globally traded wood is produced illegally; in key tropical countries the share reaches 50 to 90 percent; global illegal logging worth an estimated 30 to 100 billion dollars.","verified":true},{"title":"Green Carbon, Black Trade: Illegal Logging, Tax Fraud and Laundering in the World's Tropical Forests","publisher":"UNEP and INTERPOL (GRID-Arendal catalogue)","year":2012,"url":"https://beta.grida.no/product/8022","finding":"Fetched the catalogue page: report dated 27 September 2012, UNEP and INTERPOL. The page itself does not show the percentages; the full PDF was too large to fetch.","verified":"partial"},{"title":"International Day for the Fight against IUU Fishing","publisher":"United Nations","year":2025,"url":"https://www.un.org/en/node/73598","finding":"Fetched. 'It is estimated that 1 in every 5 fish caught comes from IUU fishing'; IUU fishing 'catches millions of tonnes of fish every year'. The 11 to 26 million tonnes and 10 to 23 billion dollar figures appear in search summaries attributed to FAO, not on this page.","verified":"partial"}],"routes":[{"type":"deny","say":"It is not standing still. Chatham House measured global illegal timber production down 22 percent after 2002, after a decade of governance work by governments."},{"type":"turn","say":"The illegal loggers and pirate fishers are individuals. Their example is individual action wrecking the environment, and the thing that reduced it was enforcement."},{"type":"outweigh","say":"Concede the gap. Then measure what closed it: Brazil's enforcement plan cut Amazon clearing about 84 percent in eight years. No consumer campaign has a number like that."},{"type":"reframe","say":"A law without a budget is half a policy. Where the enforcement half was funded, Brazil, Indonesia and managed fisheries all show measured declines."}]},{"id":"PF02","side":"for","kind":"argument","angle":"policy failures","strength":4,"title":"Policy offshores emissions, it does not cut them","claim":"Rich countries' emission cuts are partly an accounting trick: the factories moved to Asia. Peters and colleagues in PNAS found net emission transfers from developing to developed countries rose from 0.4 to 1.6 billion tonnes a year between 1990 and 2008, more than the Kyoto reductions. The UK's territorial emissions are down by about half, but its consumption footprint is only 29 percent below its 2007 peak and imports are now 53 percent of it. Policy relocates emissions; what people buy decides them.","say":"The latest major review finds no evidence that climate policy caused leakage, partly because industry was shielded. Shielding is a policy choice, and the UK's consumption footprint is still down 29 percent from its peak.","detail":"Grubb and colleagues' 2022 review in the Annual Review of Environment and Resources states that 'studies find no evidence that climate policies lead to carbon leakage', adding that this is partly because key industrial sectors were shielded, and that aggregate emission transfers from developing to developed countries peaked around 2006 and have declined since. The transfers Peters measured grew with the globalisation of manufacturing in the 1990s, before any carbon market existed, so they are not policy flight. Even on the consumption measure the UK is down 29 percent from its 2007 peak, and the fall is driven by policy on the grid and industry (M5, OW07). Shielding was a policy choice and its replacement is also policy: the EU's carbon border adjustment entered its definitive, paying regime on 1 January 2026 covering cement, steel, aluminium, fertilisers, electricity and hydrogen. No shopper can price the carbon in imported steel; a border tariff can (F2).","if_they_push":"Shielding heavy industry was a policy decision, and the border adjustment replaces it from 2026. If consumption is the true measure, that measure is falling too, and individuals have no way to act on it: you cannot audit the steel in a fridge. Only a border carbon price reaches embodied imports.","comeback":"Grubb's own abstract says there was no leakage partly because governments shielded heavy industry, so policy was weakened to avoid it; and the factories still moved, whatever moved them.","weak":false,"tags":["carbon leakage","offshoring","imports","consumption emissions","footprint","china","trade","peters","kyoto","uk","territorial","cbam","outsourcing","embodied carbon","f2","f1"],"phrasings":["Britain didn't cut emissions, it exported them to China.","Consumption-based emissions barely fell, the factories just moved.","Carbon pricing just pushes industry offshore, that's leakage.","The Kyoto cuts were smaller than the emissions hidden in imports.","Territorial accounting is a fiction; what matters is what we consume."],"frames":["F2","F1"],"uses":["OW07","M5"],"notes":"Checker re-fetched LSE (Grubb abstract), Defra (699 Mt, 29 percent below the 2007 peak of 984, imports 53 percent), the CBAM page (definitive regime 1 January 2026, six sectors) and Phys.org (0.4 to 1.6 Gt). The old say quoted 'no evidence' without the shielding clause, which a sharp opponent would read out; the say now carries the caveat and turns it. The abstract says 'shielding of key industrial sectors', not 'free allowances', so the comeback is reworded. Their 'territorial emissions down about half' was not checked. Duplicates GL10 (rich countries exported their pollution) and overlaps TC07; keep this as the leakage-evidence card.","sources":[{"title":"Carbon Leakage, Consumption, and Trade (Grubb et al., Annual Review of Environment and Resources 47)","publisher":"LSE Grantham Research Institute (abstract page)","year":2022,"url":"https://www.lse.ac.uk/granthaminstitute/publication/carbon-leakage-consumption-and-trade/","finding":"Fetched. Abstract: 'Studies find no evidence that climate policies lead to carbon leakage', a result 'partly due to shielding of key industrial sectors, which is incompatible with deep decarbonization'; emission transfers from developing to developed countries 'peaked around 2006' and declined since. The abstract says shielding, not free allowances.","verified":true},{"title":"Carbon footprint for the UK and England to 2023","publisher":"Defra, UK Government","year":2026,"url":"https://www.gov.uk/government/statistics/uks-carbon-footprint/carbon-footprint-for-the-uk-and-england-to-2023","finding":"Fetched. 699 MtCO2e in 2023, about 29 percent below the 2007 peak of 984.","verified":true},{"title":"Carbon Border Adjustment Mechanism","publisher":"European Commission, DG TAXUD","year":2026,"url":"https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism_en","finding":"Fetched. CBAM is 'the EU's tool to address carbon leakage'; transitional phase 2023 to 2025; 'applies in its definitive regime from 1 January 2026' with purchase and surrender of certificates; covers cement, iron and steel, aluminium, fertilisers, electricity and hydrogen.","verified":true}],"their_sources":[{"title":"Nation's reduction in CO2 outpaced by emissions from imported goods (Peters et al., PNAS 2011)","publisher":"Phys.org (reporting PNAS)","year":2011,"url":"https://phys.org/news/2011-04-nation-reduction-co2-outpaced-country.html","finding":"Fetched. Net emission transfers from developing to developed countries rose from 0.4 Gt CO2 in 1990 to 1.6 Gt in 2008, which 'exceeds the Kyoto Protocol emission reductions'; developed countries claimed collective reductions of almost 2 percent over the period. Lead author Glen Peters, CICERO.","verified":true},{"title":"Carbon footprint for the UK and England to 2023","publisher":"Defra, UK Government","year":2026,"url":"https://www.gov.uk/government/statistics/uks-carbon-footprint/carbon-footprint-for-the-uk-and-england-to-2023","finding":"Fetched. UK consumption footprint 699 MtCO2e in 2023, down 4 percent on 2022; peak 984 MtCO2e in 2007, 'a decrease of around 29% from its peak'; 15 percent below 1996; imported emissions 53 percent of the 2023 total, up from 31 percent in 1996.","verified":true}],"routes":[{"type":"deny","say":"The best 2022 review of the literature finds no evidence that climate policies cause leakage. Trade transfers peaked around 2006 and have declined since."},{"type":"reframe","say":"Those transfers rose through the 1990s before any carbon price existed. That is globalisation of manufacturing, not policy driving factories out."},{"type":"outweigh","say":"Take their measure. The UK consumption footprint is down 29 percent from its peak, and the border carbon adjustment now prices imports. Both are policy."},{"type":"turn","say":"If emissions hide in imports, only a government can tax them at the border. A consumer cannot audit the carbon in a fridge; the EU's CBAM does."}]},{"id":"PF03","side":"for","kind":"argument","angle":"policy failures","strength":4,"title":"UN carbon credits were mostly paper","claim":"The Kyoto Protocol's flagship instrument, the Clean Development Mechanism, mostly produced paper cuts. A 2016 study for the European Commission by the Oko-Institut found 85 percent of projects and 73 percent of the credit supply had a low likelihood of being additional, and only 2 percent a high likelihood. In 2023 researchers in Science found about 94 percent of rainforest credits from the largest certifier did not represent real reductions. Governments designed and accepted these credits; the real cuts are made by people who actually change what they do.","say":"Those are offset markets, the very tool individuals use to buy their way out. A cap with no offsets did the cutting: the US acid rain cap cut power-plant sulfur 96 percent.","detail":"The Oko-Institut study is a regulator auditing its own instrument: the Commission commissioned it, and the EU then refused to accept international credits for ETS compliance after 2020. A credit mechanism and a cap are different things. The Acid Rain Program and its successor rules cut power-plant SO2 by 96 percent (OW04), and the EU carbon market, even with low prices, avoided about 1.2 billion tonnes between 2008 and 2016 (OW07). Verra's credits are the voluntary market sold to individuals and companies, so the Science study is evidence against the For side's offset lever, not against regulation. The thing that catches a fake credit is a study and a rule change, not a consumer reading a certificate (F1).","if_they_push":"Yes, the EU let in about a billion tonnes of those credits in its second phase, then shut them out after 2020. A regulator can audit and ban a credit class; a shopper reading a certificate cannot. The 2023 study is why the voluntary market individuals use is being rewritten.","comeback":"The EU ETS itself accepted over a billion tonnes of those credits in phase 2, so the cap you praise was partly paper too.","weak":false,"tags":["cdm","clean development mechanism","offsets","credits","kyoto","verra","redd","oko-institut","additionality","phantom credits","carbon market","greenwashing","science 2023","f1"],"phrasings":["The UN's own carbon market was 85 percent junk.","Most CDM credits never cut a tonne.","94 percent of Verra's rainforest offsets were worthless.","Carbon markets are a government scheme that lets polluters buy paper.","If the UN mechanism was fake, why trust government policy at all?"],"frames":["F1"],"uses":["OW04","OW07"],"notes":"Checker re-fetched the Oko-Institut PDF text (85, 73, 2, 7 percent; prepared for DG CLIMA), Mongabay (6.1 percent additional, about 94 percent not real, 26 sites) and the Commission credits page (no international credits after 2020; 1.058 billion tonnes used in phase 2). The Guardian page could not be fetched. The phase 2 credit use is the honest exposure and the old if_they_push did not answer it; it now does. Bayer and Aklin's 1.2 Gt (OW07) is net of that. Duplicates MK14 (carbon offsets let individuals fix it) in the corpus; keep this as the policy-failure framing of the same evidence.","sources":[{"title":"Use of international credits","publisher":"European Commission, DG CLIMA","year":2025,"url":"https://climate.ec.europa.eu/eu-action/eu-emissions-trading-system-eu-ets/use-international-credits_en","finding":"Fetched. The EU 'does not currently envisage continuing the use of international credits for EU ETS compliance after 2020'; participants used 1.058 billion tonnes of international credits in phase 2 (2008 to 2012).","verified":true},{"title":"How additional is the Clean Development Mechanism?","publisher":"Oko-Institut for DG CLIMA","year":2016,"url":"https://climate.ec.europa.eu/system/files/2017-04/clean_dev_mechanism_en.pdf","finding":"Fetched PDF. Study prepared for DG CLIMA (reference CLIMA.B.3/SER/2013/0026r), so the audit was commissioned by the regulator.","verified":true}],"their_sources":[{"title":"How additional is the Clean Development Mechanism?","publisher":"Oko-Institut, INFRAS and SEI for DG CLIMA, European Commission","year":2016,"url":"https://climate.ec.europa.eu/system/files/2017-04/clean_dev_mechanism_en.pdf","finding":"PDF text: '85% of the projects covered in this analysis and 73% of the potential 2013-2020 Certified Emissions Reduction (CER) supply have a low likelihood that emission reductions are additional and are not over-estimated. Only 2% of the projects and 7% of potential CER supply have a high likelihood'. 'Study prepared for DG CLIMA'. Re-fetched.","verified":true},{"title":"REDD+ projects falling far short of claimed carbon cuts, study finds (West et al., Science, August 2023)","publisher":"Mongabay","year":2023,"url":"https://news.mongabay.com/2023/08/redd-projects-falling-far-short-of-claimed-carbon-cuts-study-finds/","finding":"Fetched. 26 REDD+ sites examined, 18 analysed; only 6.1 percent of credits tied to additional reductions; about 68 percent from projects that did not significantly reduce deforestation; 'about 94% of the credits don't represent real reductions'. Verra called the methods flawed.","verified":true},{"title":"Revealed: more than 90% of rainforest carbon offsets by biggest certifier are worthless","publisher":"The Guardian","year":2023,"url":"https://www.theguardian.com/environment/2023/jan/18/revealed-forest-carbon-offsets-biggest-provider-worthless-verra-aoe","finding":"Could not fetch (site blocked to the tool). Search summaries say the joint Guardian, Die Zeit and SourceMaterial investigation put 94 percent of Verra rainforest credits as phantom.","verified":false}],"routes":[{"type":"reframe","say":"Offsets are the individual's instrument, buy a credit and keep flying. The policy instrument is a cap, and the capped systems delivered measured cuts."},{"type":"turn","say":"The Commission commissioned that study and then shut CDM credits out of its market after 2020. Policy audits itself and corrects. A consumer buying offsets cannot."},{"type":"outweigh","say":"Set the credits aside. The acid rain cap cut sulfur 96 percent and the EU carbon market avoided 1.2 billion tonnes. Those are caps, not offsets."},{"type":"fallacy","say":"They judge the whole category by its weakest instrument. One failed mechanism does not indict the caps, standards and bans that produced every measured cut we cited."}]},{"id":"PF04","side":"for","kind":"argument","angle":"policy failures","strength":3,"title":"Policy's fixes became the next problem","claim":"Policy keeps solving one problem by creating another. A 2022 PNAS study found corn ethanol under the US Renewable Fuel Standard likely at least 24 percent more carbon-intensive than gasoline after 6.9 million acres were ploughed. Europe taxed diesel lower and pushed diesel to about 55 percent of new cars in 2011, with the smog to match. The CFC replacements that policy blessed, HFCs, turned out to be powerful greenhouse gases needing a new treaty in 2016. People who simply drove less never made any of those mistakes.","say":"Each of those was fixed by another policy. Kigali's HFC phase-down alone is projected to avoid up to half a degree of warming this century. No consumer boycott rewrote a refrigerant standard.","detail":"UNEP projects the 2016 Kigali Amendment will cut global HFC use 80 to 85 percent by 2047 and prevent up to 0.5 degrees of warming by 2100, under the same treaty that removed 99 percent of ozone-depleting substances (M2). Diesel fell from 35.9 percent of new EU cars in 2018 to 11.9 percent in 2024 after Euro 6 enforcement, the Dieselgate recalls and city low emission zones (OW11). Corn ethanol is a live policy fight; the 24 percent is a modelled estimate that reversed EPA's own 2010 estimate of a 20 percent saving, and either way it is Congress and EPA who set the mandate and can unset it. The pattern they describe is a lever that measured its own error and moved a whole market back, which is exactly the capacity individuals lack (F2). Consumers bought diesel cars because policy priced them; they followed the menu.","if_they_push":"Slow correction beats no correction. People driving less never removed one HFC from a fridge; a 198-party treaty is doing it and is on course to avoid a measurable slice of warming. Net of its mistakes, policy is still the only ledger with degrees on it.","comeback":"A lever that takes thirty years to fix its own mistake has less net impact than people who never made the mistake.","weak":false,"tags":["perverse incentives","ethanol","corn","renewable fuel standard","diesel","dieselisation","fuel tax","hfc","kigali","cfc","unintended consequences","biofuel","nox","lark","f2"],"phrasings":["Corn ethanol is worse than gasoline and the government mandated it.","Europe's diesel tax gave us the diesel smog crisis.","The CFC replacements turned out to be super greenhouse gases.","Every policy fix creates the next problem.","Governments pick technologies and get it wrong."],"frames":["F2"],"uses":["M2","OW11"],"notes":"Checker re-fetched UNEP Kigali (2016; 80 to 85 percent by 2047; up to 0.5 degrees by 2100), both ACEA pages (35.9 percent in 2018; 11.9 percent in 2024), the Wisconsin release (24 percent or more; 6.9 million acres; EPA's 20 to 21 percent) and the Montreal Protocol page. The 55 percent 2011 diesel peak stays partial (ICCT 403). The old deny route said USDA contested the 24 percent, which no one read, so the USDA claim is removed from the route and the detail. The old if_they_push did not answer the 'thirty years to fix' comeback; it now does. Attributing the diesel fall to policy rather than reputational damage is partly inference. Overlaps PL09 (EU biofuel mandates and palm oil) and B4 (Dieselgate); keep as the general perverse-incentive card.","sources":[{"title":"The Kigali Amendment to the Montreal Protocol: HFC phase-down","publisher":"UNEP Ozone Secretariat","year":2025,"url":"https://ozone.unep.org/node/16905","finding":"Fetched. 'Adopted in 2016'; global HFC use to fall 80 to 85 percent by 2047; full implementation could 'prevent up to 0.5°C of global warming' by 2100, about 1 degree when combined with efficiency gains.","verified":true},{"title":"New car registrations: +0.8% in 2024; battery-electric 13.6% market share","publisher":"ACEA","year":2025,"url":"https://www.acea.auto/pc-registrations/new-car-registrations-0-8-in-2024-battery-electric-13-6-market-shar","finding":"Fetched. Full-year 2024 EU shares: petrol 33.3 percent, hybrid 30.9, battery-electric 13.6, diesel 'declined to 11.9%'.","verified":true},{"title":"Fuel types of new cars: fourth quarter 2018","publisher":"ACEA","year":2019,"url":"https://www.acea.auto/?p=3371","finding":"Fetched. Diesel 35.9 percent of new EU cars in 2018.","verified":true}],"their_sources":[{"title":"US corn-based ethanol worse for the climate than gasoline, study finds (Lark et al., PNAS 2022)","publisher":"ScienceDaily (University of Wisconsin release)","year":2022,"url":"https://www.sciencedaily.com/releases/2022/02/220214154840.htm","finding":"Fetched. Corn ethanol under the RFS has emissions 'at least as high as those from the equivalent amount of gasoline and possibly higher, likely by 24% or more'; corn cultivation grew 8.7 percent, 6.9 million acres, 2008 to 2016; EPA's 2010 analysis had estimated 20 to 21 percent lower emissions.","verified":true},{"title":"Fuel types of new cars: diesel -23.6%, electric +33.1% in fourth quarter of 2018","publisher":"ACEA","year":2019,"url":"https://www.acea.auto/?p=3371","finding":"Fetched. Diesel 35.9 percent of new EU cars in 2018; Q4 share fell from 41.2 to 34.1 percent year on year. The 55 percent 2011 peak is from an ICCT briefing found in search; the ICCT page returned 403.","verified":"partial"},{"title":"The Montreal Protocol","publisher":"UNEP Ozone Secretariat","year":2025,"url":"https://ozone.unep.org/treaties/montreal-protocol","finding":"Fetched. HFCs were used 'as replacements for a batch of ozone-depleting substances' and 'are known to be powerful greenhouse gases'; the Kigali Amendment of 2016 phases them down.","verified":true}],"routes":[{"type":"turn","say":"Every correction they skipped was a policy: Kigali for HFCs, Euro 6 and low emission zones for diesel. A lever that moves markets both ways is still the lever."},{"type":"outweigh","say":"Kigali's HFC phase-down is projected to avoid up to half a degree by 2100. Name one lifestyle estimate that is measured in degrees."},{"type":"deny","say":"Europe's diesel share has fallen to about 12 percent of new cars from over a third in 2018. Their diesel example is a decade out of date."},{"type":"reframe","say":"Europeans bought diesels because tax policy made them cheap. That is consumers following the menu policy wrote, which is our case, not theirs."}]},{"id":"PF05","side":"for","kind":"argument","angle":"policy failures","strength":3,"title":"Government process is the bottleneck","claim":"The clean build-out is stuck in government paperwork. The White House's own council found the average environmental impact statement takes 4.5 years, median 3.5, across 1,276 statements from 2010 to 2018. Nearly 2,600 gigawatts of mostly solar, wind and storage were waiting in US grid connection queues at the end of 2023, and only 14 percent of the capacity requested between 2000 and 2018 had been built. Homeowners putting solar on a roof do not wait for an impact statement.","say":"Look at what is in that queue: clean power that state mandates and federal credits called into being. Berkeley Lab tied most US renewable generation growth this century to state standards.","detail":"Berkeley Lab's 2016 status report attributed 60 percent of US renewable generation growth since 2000 to state renewable portfolio standards in 29 states plus DC; later editions say roughly half. The 2,600 gigawatts exist because policy made them worth proposing. Delay is a design fault that policy is already correcting: the Fiscal Responsibility Act of June 2023 set a two-year limit on impact statements, one year on assessments and 150-page caps. Nobody disputes that a rooftop helps, but the queue is utility-scale wind, solar and storage that no household can build or connect, and a transmission line is a government permit by definition (F2, CL1). Their complaint is a request for better government, which is our side of the motion.","if_they_push":"Permitting reform is a policy argument. If the bottleneck is a review, the fix is a statute, and Congress passed one in 2023. They are arguing for more effective policy, not for individuals.","comeback":"A pipeline that is 86 percent unbuilt is a policy failure by your own numbers; the government created demand it cannot connect.","weak":false,"tags":["nepa","permitting","environmental review","interconnection queue","transmission","delay","litigation","red tape","bureaucracy","berkeley lab","ceq","grid","rooftop solar","f2","cl1"],"phrasings":["Government review takes five years before a wind farm can even start.","There are 2,600 gigawatts stuck in the grid queue because of regulators.","NEPA is blocking the renewables it was supposed to protect.","Permitting is the real bottleneck, not people's willingness.","A homeowner installs solar in a week; the government takes a decade."],"frames":["F2","CL1"],"uses":["OW14","M1"],"notes":"Checker re-fetched the CEQ PDF text (1,276 EISs, 4.5 years average, 3.5 median), Canary Media (nearly 2,600 GW; 14 percent built), the 2016 Berkeley Lab release (60 percent of generation growth, 57 percent of capacity, 29 states plus DC) and ICF (3 June 2023; one and two year limits; 75, 150 and 300 pages). The say no longer carries '60 percent' because the 2016 figure is 'since 2000' as of that report and later editions say roughly half; 'most' is safe on either. Whether the 2023 time limits shortened reviews is not verified. Overlaps PL13 (governments are too slow); keep as the permitting version.","sources":[{"title":"Berkeley Lab report: state renewables portfolio standards account for most renewable growth since 2000","publisher":"ScienceDaily (Lawrence Berkeley National Laboratory release)","year":2016,"url":"https://sciencedaily.com/releases/2016/04/160406124310.htm","finding":"Fetched. RPS requirements account for 60 percent of US renewable electricity generation growth since 2000 and 57 percent of capacity growth; RPS policies in 29 states plus Washington DC. Later LBNL editions (2019) say 'roughly half', per search.","verified":true},{"title":"New amendments to NEPA in the Fiscal Responsibility Act of 2023","publisher":"ICF","year":2023,"url":"https://www.icf.com/insights/environment/new-nepa-amendments-fiscal-responsibility-act-2023","finding":"Fetched. Signed 3 June 2023; one year for an environmental assessment, two years for an EIS; page limits 75 for an EA, 150 for an EIS, 300 for extraordinary complexity.","verified":true}],"their_sources":[{"title":"Environmental Impact Statement Timelines (2010-2018)","publisher":"Council on Environmental Quality","year":2020,"url":"https://nepa.gov/sites/default/files/documents/CEQ_EIS_Timeline_Report_2020-6-12.pdf","finding":"Fetched PDF. Based on 1,276 EISs with final notices 2010 to 2018; average completion time NOI to ROD 'was 4.5 years' and 'the median was 3.5 years'; quartiles 2.2 and 6.0 years.","verified":true},{"title":"The growing clean energy backlog in five charts (Berkeley Lab 'Queued Up' 2024)","publisher":"Canary Media","year":2024,"url":"https://www.canarymedia.com/articles/transmission/the-growing-clean-energy-backlog-in-five-charts","finding":"Fetched. 'Nearly 2,600 gigawatts' of proposed projects in interconnection queues as of December 2023, roughly twice existing US generating capacity; 'only 14 percent of the generation capacity' requested 2000 to 2018 was online by end 2023; the vast majority is wind, solar and storage. The 95 percent zero-carbon share is from search summaries of the LBNL report, which returned 403.","verified":true}],"routes":[{"type":"turn","say":"The queue is the policy working: state standards and tax credits created 2,600 gigawatts of proposals. The backlog is demand that policy made."},{"type":"reframe","say":"Their fix is permitting reform, which is a statute. Congress passed one in 2023 with two-year review limits. Asking for better government concedes the motion."},{"type":"outweigh","say":"Slow is not small. Ontario's coal phase-out took about a decade and removed 27 megatonnes a year. No number of rooftops shut Nanticoke."},{"type":"fallacy","say":"They treat slow as ineffective. A four-year review ahead of a forty-year plant is not what decides emissions; the standard that requires the plant is."}]},{"id":"PF06","side":"for","kind":"argument","angle":"policy failures","strength":2,"title":"Captured policy calls gas green","claim":"Policy gets captured and then launders the problem. In July 2022 the European Parliament voted 328 to 278 to let fossil gas and nuclear be labelled sustainable in the EU taxonomy after lobbying by France and gas-dependent states, and when Austria sued, the General Court dismissed the case in September 2025. Informed individuals know gas is not green; the policy machine decided otherwise.","say":"The taxonomy is a label for investors, not an emissions law. The laws that cut emissions are working: EU net emissions have fallen by more than a third since 1990.","detail":"The taxonomy decides what a fund may call green; it does not set a cap, a price or a standard. The instruments that do are measured: the EU carbon market avoided about 1.2 billion tonnes from 2008 to 2016 (OW07), and the EEA reports EU net greenhouse gas emissions 36 percent below 1990 in 2023, a further 2.5 percent fall in 2024, and 47 percent projected by 2030 under current policies. The vote itself was close, the inclusion is conditional and time-limited, and the court ruled only that the Commission acted within its powers. The lobbying they describe is proof of where the power sits: nobody spends millions capturing a lever that does not move anything (CL2).","if_they_push":"Capture is an argument for rules on lobbying and for disclosure, both policy. On the offshoring point, the consumption measure also fell and the reviews find no evidence policy caused leakage (PF02). And note who the taxonomy misleads: individual investors, which shows individuals rely on the state's label to act at all.","comeback":"The 36 percent fall includes deindustrialisation and offshoring, which is the leakage point, not a policy triumph.","weak":false,"tags":["taxonomy","greenwash","greenwashing","gas","nuclear","lobbying","capture","european parliament","austria","general court","sustainable finance","label","regulatory capture","cl2"],"phrasings":["The EU literally voted to call gas sustainable.","Lobbyists captured the taxonomy and the court waved it through.","Government policy is greenwash with a legal stamp.","If Brussels calls gas green, why trust policy at all?","Policy gets captured by whoever lobbies hardest."],"frames":["CL2"],"uses":["OW07"],"notes":"Checker re-fetched the Parliament release (278 for, 328 against, 33 abstentions, 353 needed; 'time-limited and dependent on specific conditions') and the EEA indicator (36 percent below 1990 in 2023; 2.5 percent further in 2024; 47 and 54 percent projected). The court outcome is verified on a law-firm summary with no judgment date; say 'at first instance'. The gas thresholds were not verified. The old if_they_push did not answer the offshoring comeback; it now points to PF02. No duplicate in the corpus.","sources":[{"title":"Total net greenhouse gas emission trends and projections in Europe","publisher":"European Environment Agency","year":2025,"url":"https://www.eea.europa.eu/en/analysis/indicators/total-greenhouse-gas-emission-trends/","finding":"Fetched. 'Net greenhouse gas (GHG) emissions in the European Union fell by 36% between 1990 and 2023'; preliminary 2.5 percent further drop in 2024; 47 percent projected by 2030 under current policies, 54 percent with planned measures, against the 55 percent target.","verified":true},{"title":"Taxonomy: MEPs do not object to inclusion of gas and nuclear activities","publisher":"European Parliament","year":2022,"url":"https://www.europarl.europa.eu/news/en/press-room/20220701IPR34365/taxonomy-meps-do-not-object-to-inclusion-of-gas-and-nuclear-activities","finding":"Fetched. Inclusion is 'time-limited and dependent on specific conditions and transparency requirements'; vote 328 to 278 with 33 abstentions.","verified":true}],"their_sources":[{"title":"Taxonomy: MEPs do not object to inclusion of gas and nuclear activities","publisher":"European Parliament","year":2022,"url":"https://www.europarl.europa.eu/news/en/press-room/20220701IPR34365/taxonomy-meps-do-not-object-to-inclusion-of-gas-and-nuclear-activities","finding":"Fetched. 278 MEPs for the objection, 328 against, 33 abstentions; 353 needed to veto; gas and nuclear classed as transitional activities under conditions 'time-limited and dependent on specific conditions and transparency requirements'; applies from 1 January 2023.","verified":true},{"title":"General Court upholds European Commission's approach to nuclear and gas in Taxonomy Regulation (T-625/22)","publisher":"Proskauer","year":2025,"url":"https://www.proskauer.com/blog/general-court-upholds-european-commissions-approach-to-nuclear-and-gas-in-taxonomy-regulation","finding":"Fetched. The General Court dismissed Austria's challenge (T-625/22); the Commission could treat nuclear and gas as transitional activities under conditions and did not exceed its powers. The page gives no judgment date; its own date is 12 September 2025. The Curia pages returned 404 to the writer.","verified":"partial"}],"routes":[{"type":"reframe","say":"A taxonomy is a label for fund managers. The emissions laws, the carbon market and the coal exits, are where the cuts come from, and they are measured."},{"type":"turn","say":"Nobody lobbies a lever that does not move. The fight over the taxonomy proves policy is where the power sits."},{"type":"outweigh","say":"Whatever the label says, EU net emissions are down 36 percent since 1990 and the carbon market avoided 1.2 billion tonnes. That is policy's record."},{"type":"deny","say":"Gas was admitted only as a transitional activity, under emission conditions and with an end date. That is not a blank green stamp."}]},{"id":"PF07","side":"for","kind":"argument","angle":"policy failures","strength":4,"title":"Governments are the biggest polluters","claim":"Government is not the solution to fossil fuels, it is the owner. The Carbon Majors database traces 33 percent of tracked emissions since 1854 to state-owned companies and 36 percent to nation-states themselves, against 31 percent for investor-owned firms. Saudi Aramco is the largest state-owned emitter and China's coal production the largest national entry. Coal India dug 773.6 million tonnes in 2023-24. Asking government policy to fix this is asking the arsonist to run the fire brigade; the pressure for change has to come from people.","say":"Their numbers locate the lever. If states own two thirds of emissions, only state decisions turn them off. Where they did, Ontario and Britain, coal went to zero. No boycott reaches a state mine.","detail":"Their numbers decide the motion. An actor that owns or directs two thirds of historical emissions has more impact on the environment than any individual by construction; the motion asks about impact, not virtue. It also shows what consumer choice cannot reach: no boycott touches Coal India's 773 million tonnes, but a policy on India's power mix does, as China's 2013 air plan showed when it cut PM2.5 by 42 percent by closing and converting state-owned plants (OW10). Where the state chose to pull the lever the other way, coal went to zero: Ontario's electricity emissions fell from 32.9 to 5.4 megatonnes (M1) and Britain closed its last coal plant in 2024 (M5). This is why FR08 says the supply side is governed by policy: the owner of the mine decides whether it stays open.","if_they_push":"They will say the state only acted because people pressed it. Then the pressure is a vote and a campaign, and its impact arrives as the closure order; that is F3. Point to M1, M5 and OW10: every one is a state acting on generation it owned or licensed. The owner of the coal is the only actor that can leave it in the ground.","comeback":"Impact in the motion means impact for the environment, not against it, and the state closed coal only because citizens forced it. People made the arsonist act.","weak":false,"tags":["state-owned","carbon majors","saudi aramco","coal india","gazprom","nation states","government polluter","soe","fossil reserves","influencemap","china coal","ownership","arsonist","cl2","fr08"],"phrasings":["Governments own most of the world's fossil fuels, so they are the problem.","Saudi Aramco and Coal India are state companies; government is the polluter.","Two thirds of emissions trace to states and state firms.","You can't ask the arsonist to put out the fire.","Government policy is what dug the coal in the first place."],"frames":["CL2","FR08"],"uses":["M1","M5","OW10"],"notes":"Checker re-fetched Carbon Majors (31, 33, 36 percent; Saudi Aramco, Gazprom, NIOC; China coal, former Soviet Union), the AQLI page (42.3 percent, now verified) and the Coal India report (773.6 Mt). The old say rested on reading 'impact' as magnitude ('largest lever by definition'), which the For side's comeback calls a word game and a judge may agree. The say now leads with benefit: state ownership means only state decisions can turn the mines off, and where they did, coal went to zero. The turn route keeps the definitional point as a secondary line. Coal India's ownership share was not verified; say 'state-owned' only. Duplicates FR08 (Carbon Majors) on our own side; this card answers the For use of the same database.","sources":[{"title":"The Carbon Majors Database: Launch Report","publisher":"InfluenceMap","year":2024,"url":"https://carbonmajors.org/briefing/The-Carbon-Majors-Database-26913","finding":"Fetched. State-owned companies 33 percent plus nation-states 36 percent equals 69 percent of tracked emissions, about two thirds.","verified":true},{"title":"China's National Air Quality Action Plan 2013","publisher":"Air Quality Life Index, EPIC, University of Chicago","year":2023,"url":"https://aqli.epic.uchicago.edu/post/china-national-air-quality-action-plan-2013","finding":"Fetched by the checker: population-weighted PM2.5 down 42.3 percent 2013 to 2021; 2.2 years of life expectancy if sustained.","verified":true}],"their_sources":[{"title":"The Carbon Majors Database: Launch Report","publisher":"InfluenceMap","year":2024,"url":"https://carbonmajors.org/briefing/The-Carbon-Majors-Database-26913","finding":"Fetched. Investor-owned companies 31 percent of tracked emissions 1854 to 2022 (440 GtCO2e), state-owned companies 33 percent (465 GtCO2e), nation-states 36 percent (516 GtCO2e); largest state-owned contributors Saudi Aramco, Gazprom, National Iranian Oil Company; largest nation-state entries China coal and the former Soviet Union. Coal India not named on the page.","verified":true},{"title":"Coal India's output grows 10 pc to 773.6 MT in FY'24","publisher":"The Week (PTI)","year":2024,"url":"https://www.theweek.in/wire-updates/business/2024/04/01/ccm1-biz-coal-india-output.html","finding":"Fetched. Coal India produced 773.6 million tonnes in fiscal 2023-24, 10 percent growth on the previous year. Ownership share not stated on the page; Coal India's site lists a Government of India company registration.","verified":true}],"routes":[{"type":"turn","say":"Two thirds of emissions in state hands means state decisions are the largest lever on the planet. Their statistic is our motion."},{"type":"reframe","say":"The motion asks which has more impact, not which is more virtuous. An owner of two thirds of the problem has more impact than any individual by construction."},{"type":"outweigh","say":"Where states pulled the lever the other way, coal went to zero: Ontario's power emissions fell from 32.9 to 5.4 megatonnes. No boycott touches a state mine."},{"type":"fallacy","say":"They slide from 'governments own the mines' to 'policy cannot help'. Opening a mine is a policy choice and so is closing it. The lever is the same."}]},{"id":"PF08","side":"for","kind":"argument","angle":"policy failures","strength":4,"title":"COVID: people cut emissions 17 percent","claim":"In spring 2020 people stopped flying, commuting and shopping, and daily global CO2 fell 17 percent by early April, the largest drop ever recorded, with 2020 down about 2 billion tonnes. No climate policy in thirty years has done anything close. When individuals change behaviour, emissions move at a speed no law has matched.","say":"That was not a choice. Le Quere's team measured government confinement policies in 69 countries and said the drop would be temporary. Emissions hit a record high the next year.","detail":"The study behind the 17 percent built a confinement index from government lockdown orders in 69 countries covering 97 percent of emissions; the behaviour was mandated. Its lead author said the decreases were likely temporary 'as they do not reflect structural changes in the economic, transport, or energy systems'. The IEA then recorded a 6 percent rebound in 2021, almost 2.1 gigatonnes, to 36.3 gigatonnes, the highest annual level ever. That is the clean experiment on behaviour without structure: it reverts the moment the order lifts. Where structure was changed by policy in the same years, the cut held: Britain's coal power went to zero in 2024 and has not come back (M5). The lesson of 2020 is F6: individual actions happen inside conditions government sets.","if_they_push":"Even where people stayed home before the order, they went back the day the order lifted, and the rebound to a record shows behaviour without structure does not hold. And if complying with a lockdown counts as individual action, so does complying with a carbon tax or a coal ban, and every policy win we cited becomes theirs. Make them choose (F3).","comeback":"Mobility fell before mandates in many places, Sweden never locked down, and the rebound happened because governments reopened, so behaviour led and policy followed.","weak":false,"tags":["covid","pandemic","lockdown","2020","17 percent","behaviour change","le quere","natural experiment","rebound","flying","commuting","iea","record emissions 2021","confinement","f3","f6","f1"],"phrasings":["COVID proved it: people stayed home and emissions fell 17 percent.","The biggest emissions drop in history came from behaviour, not a treaty.","2020 showed what happens when individuals actually change.","No policy has ever cut emissions like people did in April 2020.","Behaviour change moves faster than any law."],"frames":["F3","F6","F1"],"uses":["M5","OW07"],"notes":"Checker re-fetched the UEA release on EurekAlert (17 percent on 7 April; 69 countries; 97 percent of CO2; 4 to 7 percent for the year; 'do not reflect structural changes'), the IEA 2021 review (6 percent, 2.1 Gt, 36.3 Gt, highest ever) and the UEA 'record lows' page (about 2 billion tonnes). The Nature page redirects to a login. The claim that mobility fell before mandates and the Sweden point were not checked; the if_they_push now answers them without conceding a number. No duplicate in the corpus; GL07 (setsuden) is the nearest.","sources":[{"title":"COVID-19 crisis causes 17 percent drop in global carbon emissions","publisher":"EurekAlert (University of East Anglia release)","year":2020,"url":"https://www.eurekalert.org/news-releases/482080","finding":"Fetched. Confinement policies analysed for 69 countries; Le Quere: decreases are likely temporary 'as they do not reflect structural changes in the economic, transport, or energy systems'.","verified":true},{"title":"Global Energy Review: CO2 Emissions in 2021","publisher":"IEA","year":2022,"url":"https://www.iea.org/reports/global-energy-review-co2-emissions-in-2021-2","finding":"Fetched. Emissions rose about 6 percent in 2021, almost 2.1 Gt, to 36.3 Gt, 'their highest ever annual level'.","verified":true}],"their_sources":[{"title":"COVID-19 crisis causes 17 percent drop in global carbon emissions (Le Quere et al., Nature Climate Change 2020)","publisher":"EurekAlert (University of East Anglia release)","year":2020,"url":"https://www.eurekalert.org/news-releases/482080","finding":"Fetched. Daily emissions fell 17 percent at the peak of confinement on 7 April 2020 versus 2019; 2020 annual projected 4 to 7 percent lower; the team analysed confinement policies in 69 countries covering 97 percent of global CO2.","verified":true},{"title":"Record lows","publisher":"University of East Anglia","year":2021,"url":"https://www.uea.ac.uk/research/explore/record-lows","finding":"Fetched. 'The 2020 lockdowns led to a record drop in global fossil carbon emissions' of about 2 billion tonnes; peak daily fall 17 million tonnes.","verified":true}],"routes":[{"type":"deny","say":"It was not voluntary. The study measured government confinement orders in 69 countries. People stayed home because the law said so."},{"type":"turn","say":"The rebound is the finding. Emissions hit a record high in 2021. Behaviour without structure reverts; the structure is policy."},{"type":"reframe","say":"If obeying a lockdown is individual action, so is obeying a coal ban. Then every policy win is theirs too and the motion means nothing."},{"type":"outweigh","say":"The 2020 dip lasted months. Britain's coal exit, a policy, took the grid from 40 percent coal to zero and it stayed there."}]},{"id":"PF09","side":"for","kind":"argument","angle":"policy failures","strength":2,"title":"Recycling policy shipped the waste to China","claim":"Municipal recycling was a fiction kept alive by exports. China took 45 percent of the world's exported plastic waste since 1992, then banned imports under its 2017 National Sword policy, and an estimated 111 million tonnes have to go somewhere else by 2030. Cities quietly landfilled or burned what people had carefully sorted. The only reliable part of the chain was the individual who refused the plastic in the first place.","say":"Sorting tracks the rule. Where deposit laws exist about nine bottles in ten come back. The export loophole was the sham, and the EU is now banning plastic waste exports to non-OECD countries.","detail":"National Sword is a policy with planetary reach: a single rule in Beijing is projected to displace 111 million tonnes by 2030. The sorting they praise happens where law makes it happen. Reloop's 2024 fact sheet puts the median return rate in European deposit systems at 91 percent, Germany at 98 and Norway at 92 in 2023; Oregon doubled its deposit to ten cents in 2017 and its return rate climbed every year after, to 90.5 percent in 2023. Ireland's bag levy cut bag use about 90 percent in a year when appeals to conscience had not (OW15). The EU is closing the export loophole itself: plastic waste exports to non-OECD countries are banned from 21 November 2026. Behaviour tracks the deposit value, which is F2 in miniature.","if_they_push":"Refusing plastic is fine, and Irish shoppers refused bags only after a 15 cent levy. Deposits cover bottles and the levy covered bags: each time the rule arrived, the habit followed, and sorting rates rise with the deposit and fall without it. Re-routing waste is not reducing it, which is why the EU export ban matters.","comeback":"National Sword's impact was to dump plastic on Malaysia and into landfills; re-routing waste is not reducing it, and deposits cover bottles, not the plastic economy.","weak":false,"tags":["recycling","national sword","china","plastic waste","exports","landfill","municipal","blue bin","sorting","waste trade","brooks","deposit return","zero waste","f2"],"phrasings":["Your blue bin was going to China and now it goes to landfill.","Recycling programmes were a lie propped up by exports.","China's ban exposed municipal recycling as a sham.","The only recycling that works is not buying the plastic.","Policy sorted the waste onto a ship, people actually reduce it."],"frames":["F2"],"uses":["OW15"],"notes":"Checker re-fetched the Reloop PDF text (91 median, Germany 98, Norway 92, Oregon 73 in 2017 rising to 90.5 in 2023), the Commission waste shipments page (ban from 21 November 2026) and the Brooks abstract on PMC (45 percent; 111 million tonnes, a projection). The old detail and reframe route said Oregon went 'from 73 to 90.5' after doubling; the page says 73 was the end-2017 rate after the April 2017 doubling, and gives no pre-2017 rate, so both are corrected. The old say led with 'one decision re-routed the world's waste, that is the scale', which reads impact as harm; the say now leads with deposits and the export ban. Reloop is an industry-adjacent group and return-rate definitions vary. Plastics are small for climate, so keep this a behaviour-versus-rule example. The landfilling-after-2018 claim is theirs, unverified. Overlaps FP13 (recycling and bags add up) and TC11 (Toronto contamination); keep as the China-ban version.","sources":[{"title":"Deposit return systems: how they perform (fact sheet, May 2024)","publisher":"Reloop Platform","year":2024,"url":"https://reloopplatform.org/wp-content/uploads/2023/05/RELOOP_Factsheet_Performance_May2024_Web.pdf","finding":"PDF text: 'the median return rate for European DRS is 91%', 'with Germany leading at an impressive 98%' (2023); Norway 'overall return rate of 92% for 2023'; Oregon doubled its deposit to 10 cents in April 2017 and the return rate rose 'to 73% by the end of 2017', 81 percent in 2018, 86 percent in 2019 and 'rebounded to 90.5% in 2023'. The pre-2017 Oregon rate is not on the page.","verified":true},{"title":"Waste shipments","publisher":"European Commission, DG Environment","year":2025,"url":"https://environment.ec.europa.eu/topics/waste-and-recycling/waste-shipments_en","finding":"Fetched. Timeline: 'Plastic waste exports to non-OECD countries banned', 21 November 2026.","verified":true},{"title":"The Chinese import ban and its impact on global plastic waste trade","publisher":"PubMed Central","year":2018,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6010324/","finding":"Fetched. 111 million tonnes displaced by 2030 by one national policy.","verified":true}],"their_sources":[{"title":"The Chinese import ban and its impact on global plastic waste trade (Brooks, Wang and Jambeck, Science Advances)","publisher":"PubMed Central","year":2018,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6010324/","finding":"Fetched. China 'has imported a cumulative 45% of plastic waste since 1992'; 'an estimated 111 million metric tons of plastic waste will be displaced with the new Chinese policy by 2030'; policy announced 2017, modelled as imports stopping end 2017.","verified":true}],"routes":[{"type":"turn","say":"A single rule in Beijing displaced 111 million tonnes of waste. If that is failure, it is failure at a scale no individual approaches."},{"type":"outweigh","say":"Where deposit laws exist, about nine bottles in ten come back. Germany returns 98 percent. Sorting happens where a rule pays for it."},{"type":"reframe","say":"Oregon doubled its deposit and its return rate climbed year on year to over ninety percent. The careful sorter they praise is responding to a price a legislature set."},{"type":"fallacy","say":"They judge policy by the worst collection schemes and credit individuals for sorting that only occurs where law provides the bin and the deposit."}]},{"id":"PF10","side":"for","kind":"argument","angle":"policy failures","strength":1,"title":"The 100 billion that never arrived","claim":"At Copenhagen in 2009 rich governments promised 100 billion dollars a year in climate finance by 2020. They missed it. Oxfam's audit of 2020 found that of 83.3 billion reported, the real value was at most 24.5 billion and more than half of what the poorest countries got was loans. Government promises are the least reliable instrument in climate.","say":"Late, and then delivered: the OECD counts 115.9 billion dollars provided and mobilised in the year the target was finally met. All the world's climate philanthropy is a small fraction of that.","detail":"The OECD's 2024 assessment puts climate finance provided and mobilised by developed countries at 115.9 billion dollars in 2022, a 30 percent rise on the year before and the first year over the target, two years late. Oxfam's lower figure is a grant-equivalent recalculation that discounts loans, and even on Oxfam's number, 24.5 billion in public money exceeds everything private philanthropy gives: ClimateWorks counts foundation funding for climate mitigation at about 6 billion dollars in 2024, with all climate giving around 2.1 percent of philanthropy. The loan share is a design fight worth having; it is a fight about how government money is structured, which concedes where the money comes from (CL1).","if_they_push":"Take Oxfam's number. Twenty-four billion in grant-equivalent public money is still about four times all foundation funding for climate mitigation in a year. The loan share is a fight about how government money is structured, and no individual mechanism moves that much across borders.","comeback":"Oxfam says the real value is a quarter of what is reported and most of it is loans the poor repay; counting loans at face value is an accounting trick.","weak":false,"tags":["100 billion","climate finance","copenhagen","pledge","oxfam","oecd","loans","broken promise","aid","cop","developing countries","shadow report","cl1"],"phrasings":["They promised 100 billion a year and never paid it.","Oxfam found the real climate finance was a quarter of what was reported.","Most of the climate aid is loans the poorest have to repay.","Government pledges are worthless; look at Copenhagen.","Rich countries broke their biggest climate promise."],"frames":["CL1"],"uses":["OP3"],"notes":"Checker re-fetched Clean Energy Wire (115.9 billion in 2022, up 30 percent; loans quote), ClimateWorks (6 billion foundation mitigation funding in 2024; 2.1 percent of giving) and the Oxfam release (at most 24.5 billion of 83.3; more than half to the poorest as loans). The OECD page itself was not loaded. The say now carries one number (the old one had two) and 'rounding error' is softened to 'small fraction' (6 against 115.9). The 'four times' route compares public grant-equivalent to foundation mitigation funding only; say 'foundation funding' aloud. The old if_they_push did not answer the Oxfam loans comeback; it now does. No duplicate in the corpus.","sources":[{"title":"Developed countries reach 100 bln annual climate finance target two years late (OECD)","publisher":"Clean Energy Wire","year":2024,"url":"https://www.cleanenergywire.org/news/developed-countries-reach-100-bln-annual-climate-finance-target-two-years-late-oecd","finding":"Fetched. 'In 2022, developed countries provided and mobilised 115.9 billion U.S. dollars', a 30 percent increase on the year before. The OECD press release itself returned 403.","verified":true},{"title":"Giving to climate change mitigation has doubled since 2020, but critical gaps persist","publisher":"ClimateWorks Foundation","year":2025,"url":"https://www.climateworks.org/blog/giving-to-climate-change-mitigation-has-doubled-since-2020-but-critical-gaps-persist/","finding":"Fetched. Foundation funding for climate change mitigation reached 6 billion dollars in 2024; overall climate giving about 2.1 percent of total philanthropic giving.","verified":true}],"their_sources":[{"title":"Climate Finance Shadow Report 2023 (press release)","publisher":"Oxfam International","year":2023,"url":"https://www.oxfam.org/en/node/22631","finding":"Fetched. Of 83.3 billion dollars reported for 2020, Oxfam estimates 'the real value of their spending was at most 24.5 billion' (range 21 to 24.5 billion); 'more than half of all climate finance going to the world's poorest countries is now coming as loans'.","verified":true},{"title":"Developed countries reach 100 bln annual climate finance target two years late","publisher":"Clean Energy Wire (reporting OECD)","year":2024,"url":"https://www.cleanenergywire.org/news/developed-countries-reach-100-bln-annual-climate-finance-target-two-years-late-oecd","finding":"Fetched. The 100 billion was 'originally promised already for 2020' and missed in 2020 and 2021; Oxfam's Jan Kowalzig: 'Most of it is provided as loans'.","verified":true}],"routes":[{"type":"deny","say":"The pledge was met in 2022: 115.9 billion dollars provided and mobilised, according to the OECD. Two years late is not never."},{"type":"outweigh","say":"Even Oxfam's discounted figure, 24.5 billion, is about four times all foundation funding for climate mitigation in a year. Government is still the only actor at that scale."},{"type":"reframe","say":"A late promise is still a government instrument. Their alternative has no equivalent: no individual mechanism moves a hundred billion dollars a year across borders."},{"type":"fallacy","say":"They count a delay as a zero. A target hit two years late is a slow policy, not evidence that individuals could have raised the money instead."}]},{"id":"BH01","side":"for","kind":"argument","angle":"norms and ethics","strength":4,"title":"Social-norm nudges beat mandates","claim":"People change when they see what their neighbours do, not when they are ordered to. Opower's home energy reports, which compare a household's use with its neighbours', cut electricity use by about 2 percent across 600,000 households, an effect equal to an 11 to 20 percent price rise, and the programme has since saved 44 terawatt-hours. In a hotel, a card saying most guests reuse their towels lifted reuse from 35 to 44 percent. Nolan and colleagues showed the norm message changed behaviour most even though people rated it least motivating. Norms move people without a single law.","say":"Two percent per household. That is the Opower effect, and utilities buy it to meet efficiency targets that regulators set. Ontario's coal ban removed most of its power-sector emissions. Policy did that.","detail":"Allcott's own abstract gives 2.0 percent per household. Allcott and Rogers write that utilities hire Opower primarily because the savings help them comply with state regulations requiring energy conservation; 26 states and DC have binding efficiency resource standards. The 44 TWh is cumulative since 2009 across 44.6 million households, about one percent of a single year of US generation (4,430 TWh in 2025), and that one percent counts gas savings against electric generation, so it flatters their total. The nudge is a tool a regulated utility uses to meet a target a regulator set (F2, FR10). The measured policy wins are of a different order: Ontario 32.9 to 5.4 Mt (M1), UK coal 40 percent to zero (M5). When the reports stop the effect decays 10 to 20 percent a year, so even this needs a standing programme.","if_they_push":"We agree norms work at the margin, and that they are cheap. Cheap is why a utility picks this tool to hit a savings target a regulator set. Here it was 70 utilities under efficiency mandates, not neighbours talking over a fence.","comeback":"Two percent across 44 million homes at 2 cents a kilowatt-hour is cheaper than any power plant. Cheap, scalable, voluntary: that is impact.","weak":false,"tags":["opower","home energy reports","neighbours","social norms","nudge","allcott","cialdini","towels","hotel","nolan","descriptive norm","peer comparison","behaviour change","mandates","no law needed","f1","f2","fr10"],"phrasings":["Opower cut energy use just by telling people what their neighbours used","the hotel towel study shows norms beat appeals and rules","people copy each other, that is how change really spreads","nudges work better than mandates","Cialdini showed social proof changes behaviour without any regulation"],"frames":["F1","F2","FR10"],"uses":["M1","M5","OW15"],"notes":"Checker re-fetched every rebuttal source: Allcott 2011 abstract (2.0 percent, 600,000, 11 to 20 percent price), Allcott and Rogers PDF text (quote on state regulations, 70 utilities, 2.15 cents), AER abstract (10 to 20 percent decay), ACEEE (26 states plus DC), EIA (4.43 trillion kWh, 2025), Oracle (44.23 TWh electric and gas, 44.6 million households; fetched by curl after the fetch tool got 403). The 'one percent of one year' is arithmetic (44.23 / 4,430) and compares electric plus gas savings against electric generation; that mix inflates their share, so it is safe for us, and the deny route now says so. The 84 percent for Ontario is arithmetic from M1 (32.9 to 5.4). Comeback is cost; the answer is that cost-effectiveness is the utility's reason to use this tool to meet a mandated target. No duplicate in the corpus; nearest are C1 (tipping point) and B7 (policy follows people).","sources":[{"title":"The Short-Run and Long-Run Effects of Behavioral Interventions (working paper)","publisher":"Allcott and Rogers, NBER / ourenergypolicy.org copy","year":2012,"url":"https://www.ourenergypolicy.org/wp-content/uploads/2012/10/Allcott-and-Rogers-2012-The-Short-Run-and-Long-Run-Effects-of-Behavioral-Interventions.pdf","finding":"PDF text: Opower at 70 utilities, 8.4 million households in treatment and control; 'Utilities hire Opower to implement the intervention primarily because the resulting energy savings help to comply with state regulations requiring energy conservation'; 2.15 cents per kWh conserved.","verified":true},{"title":"The Short-Run and Long-Run Effects of Behavioral Interventions: Experimental Evidence from Energy Conservation","publisher":"American Economic Review 104(10)","year":2014,"url":"https://www.aeaweb.org/articles?id=10.1257/aer.104.10.3003","finding":"Abstract: effects decay at 10 to 20 percent per year once reports are discontinued after two years.","verified":true},{"title":"Energy Efficiency Resource Standards","publisher":"ACEEE","year":2025,"url":"https://www.aceee.org/topic/eers","finding":"EERS sets long-term energy savings targets utilities or program administrators must meet; 26 states plus DC (report summary; the topic page says 'more than 25 states').","verified":true},{"title":"Electricity in the United States","publisher":"US Energy Information Administration","year":2026,"url":"https://www.eia.gov/energyexplained/electricity/electricity-in-the-us.php","finding":"Total US utility-scale generation in 2025 about 4.43 trillion kWh (4,430 TWh). Re-fetched.","verified":true},{"title":"Utilities Achieve Large-Scale Customer Engagement and Results with Oracle","publisher":"Oracle","year":2026,"url":"https://www.oracle.com/news/announcement/utilities-achieve-large-scale-customer-engagement-and-results-with-oracle-2026-04-13/","finding":"44.23 TWh cumulative electric and gas savings since 2009; 44.6 million households.","verified":true}],"their_sources":[{"title":"Social norms and energy conservation","publisher":"Journal of Public Economics 95 (Allcott)","year":2011,"url":"https://ideas.repec.org/a/eee/pubeco/v95y2011i9-10p1082-1095.html","finding":"Abstract: randomized field experiments with about 600,000 households; the average program reduces energy consumption by 2.0 percent, equivalent to a short-run electricity price increase of 11 to 20 percent; cost effectiveness compares favourably to traditional conservation programs.","verified":true},{"title":"Utilities Achieve Large-Scale Customer Engagement and Results with Oracle","publisher":"Oracle (press release, 13 April 2026)","year":2026,"url":"https://www.oracle.com/news/announcement/utilities-achieve-large-scale-customer-engagement-and-results-with-oracle-2026-04-13/","finding":"Since 2009 and through March 2026: 44.6 million households enrolled; 'Total energy savings (electric and gas) of 44.23TWh'. Re-fetched Nov 2026 (plain curl; the fetch tool got 403).","verified":true},{"title":"A Room with a Viewpoint: Using Social Norms to Motivate Environmental Conservation in Hotels","publisher":"Journal of Consumer Research 35 (Goldstein, Cialdini, Griskevicius)","year":2008,"url":"https://carlsonschool-d8.prd.umn.edu/sites/carlsonschool.umn.edu/files/2018-10/118359.pdf","finding":"Experiment 1: descriptive norm card 44.1 percent towel reuse vs 35.1 percent for the standard environmental message (N = 433). Experiment 2: same-room norm 49.3 percent vs 42.8 percent for other norm conditions (N = 1,318).","verified":true},{"title":"Normative social influence is underdetected","publisher":"Personality and Social Psychology Bulletin 34 (Nolan, Schultz, Cialdini, Goldstein, Griskevicius)","year":2008,"url":"https://www.cbsm.com/articles/32583-normative-social-influence-is-underdetected","finding":"Abstract: 810 Californians; descriptive norms predicted conservation best though rated least important; in a field experiment the normative message produced the greatest behaviour change though rated least motivating.","verified":true}],"routes":[{"type":"outweigh","say":"Concede it. Ontario's coal ban cut the province's electricity emissions by more than eighty percent. One rule did what no neighbour comparison could."},{"type":"turn","say":"Allcott and Rogers say utilities hire Opower to comply with state conservation regulations. Their best nudge exists because a regulator demanded savings."},{"type":"reframe","say":"A letter from a regulated utility to 44 million customers is a programme, not an individual act. The individual only reads it."},{"type":"deny","say":"Their headline savings are cumulative since 2009 and, even counting gas, come to about one percent of a single year of US electricity. Large sounding, small in fact."}]},{"id":"BH02","side":"for","kind":"argument","angle":"norms and ethics","strength":3,"title":"Smoking fell because norms shifted first","claim":"US adult smoking fell from 42.4 percent in 1965 to 11.6 percent in 2022. Christakis and Fowler's Framingham study showed quitting spread person to person: a spouse quitting cut your odds of smoking by 67 percent, a friend by 36 percent, and whole clusters quit together. Indoor smoking became shameful long before most bans; the bans only ratified a norm people had already built. Environmental behaviour will go the same way: norms first, policy trailing.","say":"Their own trend had policy inside it. Levy's California model finds prevalence fell about twice as far with tobacco policies as without them, and most of that policy effect was tax. Norms followed the price.","detail":"Levy and colleagues (Health Policy, 2007) model California 1988 to 2004: adult prevalence fell 41 percent with the policies against 21.8 percent in the no-policy scenario, so policy roughly doubled the fall, and of the policy effect over 60 percent came from price increases, over 25 percent from media campaigns and about 10 percent from clean indoor air laws. The WHO's tax page calls excise increases the single most effective and cost-effective measure. Christakis and Fowler describe how quitting spread, not why it started. Nyborg's Science paper frames norms as something policy can support. Treat this as the smoking version of F2: policy set the price and the places, people then copied each other.","if_they_push":"The no-policy half of Levy's model is not a norm-only world; it already contains the federal rules in place before 1988. And if norms alone did it, smoking would have fallen the same everywhere. It fell fastest where taxes and smoke-free laws were strongest.","comeback":"Levy's own no-policy scenario still cuts smoking by over a fifth. That baseline fall is the norm shift, and it is a model of one state.","weak":false,"tags":["smoking","tobacco","norms shifted","christakis","fowler","framingham","bans ratified","social contagion","quitting","stigma","analogy","policy trailed","cigarettes","taboo","f1","f2","fr10"],"phrasings":["smoking became uncool before it became illegal","people quit because their friends quit, not because of a law","the smoking bans just ratified what people already believed","norms changed first and policy followed","look at smoking, that was a social shift not a government one"],"frames":["F1","F2","FR10"],"uses":["OW15","OW03"],"notes":"Checker re-fetched Levy on PMC, WHO, CDC and the Stockholm page. The old say ('over sixty percent of the policy-driven decline') answered a weaker claim: it decomposed the policy effect without saying how big policy was against the trend, and Levy's no-policy scenario still shows a 21.8 percent fall, which the For side can call norms. The say now uses the 41 versus 21.8 comparison (about twice as far), which meets the claim head on. The 'over 95 percent' in the deny route is 60 + 25 + 10 from the summary, arithmetic, and is a share of the policy effect only. The Norway-ban detail for Nyborg is not on the Stockholm page; the For source stays partial and the turn route should be said as 'press coverage of Nyborg'. The Christakis abstract was read on PMC, not at the NEJM link, which returns 403. The 1964 Surgeon General report was not fetched, so give no dates. No duplicate in the corpus.","sources":[{"title":"The role of public policies in reducing smoking prevalence in California: results from the California Tobacco Policy Simulation Model","publisher":"Health Policy (Levy, Hyland, Higbee, Remer, Compton), PMC copy","year":2007,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2743269","finding":"Summary: policies reduced adult prevalence about 25 percent beyond the 1988 baseline by 2004 (results say 24 percent); prevalence fell 41 percent from 1988 to 2004 with the policies versus 21.8 percent in the no-policy scenario, so about twice as far. Of the policy effect, price over 60 percent (59 in results), media over 25 percent (28), clean indoor air laws 10 percent (11), youth access 2 percent. The results note part of the price effect is the 1998 national price rise after the tobacco settlement.","verified":true},{"title":"Raising taxes on tobacco","publisher":"World Health Organization","year":2025,"url":"https://www.who.int/activities/raising-taxes-on-tobacco","finding":"Tobacco excise tax increases are 'the single most effective and cost-effective measure for reducing tobacco use'; young and low-income people respond most to price.","verified":true},{"title":"Notes from the Field: Tobacco Product Use Among Adults, United States, 2017 to 2023","publisher":"CDC MMWR 74","year":2025,"url":"https://www.cdc.gov/mmwr/volumes/74/wr/mm7407a3.htm","finding":"42.4 percent in 1965 to 11.6 percent in 2022; the report recommends price increases, smoke-free policies, media campaigns and cessation support.","verified":true},{"title":"Social norms as solutions","publisher":"Stockholm Resilience Centre summary of Nyborg et al., Science","year":2016,"url":"https://www.stockholmresilience.org/publications/publications/2016-10-28-social-norms-as-solutions.html","finding":"'If conditions are right, policy can support social norm changes'; the paper asks whether policy can create tipping points and push the system past them.","verified":true}],"their_sources":[{"title":"Notes from the Field: Tobacco Product Use Among Adults, United States, 2017 to 2023","publisher":"CDC MMWR 74","year":2025,"url":"https://www.cdc.gov/mmwr/volumes/74/wr/mm7407a3.htm","finding":"Cigarette smoking among US adults declined from 42.4 percent in 1965 to 11.6 percent in 2022.","verified":true},{"title":"The collective dynamics of smoking in a large social network","publisher":"New England Journal of Medicine 358 (Christakis and Fowler)","year":2008,"url":"https://doi.org/10.1056/NEJMsa0706154","finding":"Abstract (read on PMC, PMC2822344; the NEJM page returns 403): 12,067 people, 1971 to 2003; spouse quitting cut a person's chance of smoking 67 percent, sibling 25, friend 36, coworker in small firms 34; 'whole clusters of connected smokers convert to nonsmokers together'.","verified":true},{"title":"Social norms as solutions","publisher":"Science 354 (Nyborg et al.)","year":2016,"url":"https://www.stockholmresilience.org/publications/publications/2016-10-28-social-norms-as-solutions.html","finding":"Abstract: informal institutions such as social norms matter where formal ones cannot enforce; asks whether policy can create or push past a tipping point. Press coverage uses Norway's indoor smoking ban as the example of a norm that stuck.","verified":"partial"}],"routes":[{"type":"deny","say":"Levy's California model gives price, media campaigns and clean-air laws over 95 percent of the policy-driven fall. Tax, government advertising, bans. Not fashion."},{"type":"turn","say":"Press coverage of Nyborg's Science paper uses Norway's smoking ban as a case where a law created the norm. Their analogy is our mechanism."},{"type":"reframe","say":"Christakis shows how quitting spread between friends. It does not show why anyone started quitting. Price and the Surgeon General did that."},{"type":"outweigh","say":"Even granting contagion, the WHO calls tobacco tax the single most effective measure. The norm rode on the price."}]},{"id":"BH03","side":"for","kind":"argument","angle":"norms and ethics","strength":2,"title":"You cannot outsource virtue to government","claim":"Kant's test is to act only on a maxim you could will as universal law. The maxim 'I will wait for government to fix it' fails: universalised, nothing ever happens, because government is also waiting for a mandate. Moral consistency means doing the thing yourself first. A person who demands a carbon tax while flying monthly has outsourced their conscience. Individual action is where responsibility actually sits, so it is where impact begins.","say":"The motion is about impact, not virtue. A clean conscience cuts no tonnes. And the philosopher who studied this hardest concluded the individual's real duty is to make governments act.","detail":"Kant's test is about what one may permissibly do; the motion asks which lever changes the environment more. Those are different questions and the switch between them is an equivocation (F1, F3). Nobody on our side says wait: we say act where the measured effect is largest, and every measured success in our set is a policy (FR10, M1 to M5). Sinnott-Armstrong's 2005 chapter, the standard text on this exact question, argues that individual emissions are neither necessary nor sufficient for the harm, so the moral obligation that survives is to get governments to carry out theirs. Kingston and Sinnott-Armstrong (2018) review every objection, including that private emitting undermines political duties, and find none establishes a requirement. Run the Kantian test the other way: universalise 'I will act alone and never organise' and no grid, treaty or standard ever gets built.","if_they_push":"We are not against personal virtue. We are saying the rubric asks us to compare impact, and a universalised maxim is still a scenario, not a measurement.","comeback":"Sinnott-Armstrong is one philosopher and widely rebutted. And a movement that waits for government is not a movement. Policy came from people who acted first.","weak":false,"tags":["kant","categorical imperative","universal law","virtue","moral consistency","outsource","responsibility","hypocrisy","wait for government","conscience","ethics","duty","personal responsibility","f1","f3","fr10"],"phrasings":["if everyone waited for the government nothing would ever happen","you cannot outsource your conscience to a politician","what if everyone acted on your maxim","it is immoral to demand of others what you will not do yourself","change starts with you"],"frames":["F1","F3","FR10"],"uses":["M2","M1"],"notes":"Checker re-fetched SEP (Kant formula), the Hettinger summary (no obligation to avoid wasteful driving; obligation to get governments to act), the Duke record (citation only, still partial) and the Springer abstract for Kingston 2018. No number on the card, so no softening needed. Be careful not to sound as if we say individuals have no duty
