one number and added the voluntary-versus-mandate contrast, which answers the comeback. Added that the saving was 23.9 percent against 25 and that the voluntary-call figure is unverified. Corrected detail after verification: 'reached about 9 percent by January 2015 (SWRCB, per search summaries; sources differ)' -> 'was running near 7 percent in January 2015 per an AP follow-up of state figures, and the Board's own survey showed a 1 percent rise in May 2014 (sources differ; do not quote 9 percent)'.","sources":[{"title":"California water conservation: 25 percent mandate results","publisher":"California State Water Resources Control Board","year":2016,"url":"https://www.waterboards.ca.gov/press_room/press_releases/2015/pr060215_water_conservation.pdf","finding":"About 1.19 maf saved June 2015 to Feb 2016, 96% of the 1.24 maf goal; 23.9% cumulative vs 25% mandate. Confirmed via several news reports of the April 2016 Board announcement; PDF not opened.","verified":true},{"title":"California voluntary 2014 conservation call vs 2015 mandate","publisher":"SWRCB figures via news summaries","year":2015,"url":"https://www.waterboards.ca.gov/conservation/docs/factsheet/assessing_compliance.pdf","finding":"State report: June 2015 to Feb 2016 cumulative savings 23.9% vs 25% mandate; about 1.19 million acre-feet against 1.24 million goal = 96%. Voluntary 2014 call: about 7% in January 2015 per AP; 8.8% or 9% not found.","verified":"partial","note":"Cited SWRCB PDF 404; fact sheet PDF unreadable (compressed). WebSearch excerpts give 96%, 1.19, 1.24, 23.9% and the Feb 29 2016 end date, but one WaterWorld piece ties 23.9% to June 2015 to March 2016, so the period is not fully pinned. $500/day fines approved July 15 2014 confirmed by NPR/KPBS/CSM."}],"their_sources":[{"title":"California water conservation: 25 percent mandate results","publisher":"California State Water Resources Control Board (press releases 2015-2016)","year":2016,"url":"https://www.waterboards.ca.gov/press_room/press_releases/2015/pr060215_water_conservation.pdf","finding":"Savings of about 1.19 million acre-feet June 2015 to Feb 2016, 96% of the 1.24 maf goal; savings varied month to month (December 2015 saw 18.3% vs the 25% target). Figures confirmed via search summary; PDF not opened.","verified":true},{"title":"One drop at a time: California surpasses water conservation target","publisher":"Christian Science Monitor","year":2015,"url":"https://csmonitor.com/Environment/2015/0730/One-drop-at-a-time-California-surpasses-water-conservation-target","finding":"June 2015 use fell 27%, above the target, showing household response drives the outcome.","verified":true},{"title":"Speed-limit and recycling-participation compliance data","publisher":"not sourced","year":2026,"url":"","finding":"No verified statistic found for speed-limit non-compliance or recycling participation rates; keep the argument conceptual and do not quote a number.","verified":false}]},{"id":"FP06","side":"for","kind":"argument","angle":"consumption","strength":4,"title":"A behavioural wedge needs no new law","claim":"Dietz et al. found that 17 household actions, using only interventions that already worked and no new regulation, could cut US household direct emissions by about 20%, 123 million tonnes of carbon per year by year 10, equal to about 7.4% of national emissions. That is bigger than most single federal climate programs, achieved purely through household behaviour.","say":"Dietz's own abstract says the interventions behind that 7.4 percent 'typically combine several policy tools and strong social marketing'. It is also a potential, not a measured result.","detail":"Dietz et al. estimate 123 Mt carbon a year by year 10, about 20 percent of household direct emissions and 7.4 percent of US emissions, as a 'reasonably achievable potential' based on interventions that 'typically combine several policy tools and strong social marketing' (abstract, fetched). The abstract does not say the programs needed no regulation; that was the For side's gloss, so do not repeat it. So the wedge is what programs could achieve at national scale; it is not a claim that households would do it unprompted (F1).","if_they_push":"Then compare like with like: show us a US year in which household actions were measured delivering 7.4 percent. Ontario's coal phase-out was measured at about 27.5 Mt a year (M1); the Clean Air Act's 78 percent (M3) is a different pollutant but the same kind of evidence (F1).","comeback":"Dietz's wedge shows household action alone is worth 7.4 percent of US emissions, more than most single climate programs.","weak":false,"tags":["behavioral wedge","dietz","household actions","7.4 percent","123 million tonnes","us emissions","no regulation","habits","efficiency behaviour","adoption","stern","f1"],"phrasings":["you don't need Congress to cut 7% of US emissions","household actions alone are a fifth of household emissions","the behavioural wedge is bigger than most laws"],"frames":["F1"],"uses":["M3"],"notes":"Dietz quotes verified from the fetched abstract. Removed unsupported 'none needed new regulation' and 'delivered through utilities, incentives and campaigns'; made if_they_push compare like with like since the Clean Air Act covers other pollutants.","sources":[{"title":"Household actions can provide a behavioral wedge to rapidly reduce US carbon emissions","publisher":"PNAS (Dietz et al.)","year":2009,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2767367/","finding":"Abstract (fetched): 123 Mt carbon/yr in year 10, about 20% of household direct emissions, 7.4% of national; based on interventions that 'typically combine several policy tools and strong social marketing'; a 'reasonably achievable potential'.","verified":true}],"their_sources":[{"title":"Household actions can provide a behavioral wedge to rapidly reduce US carbon emissions","publisher":"PNAS (Dietz, Gardner, Gilligan, Stern, Vandenbergh)","year":2009,"url":"https://pmc.ncbi.nlm.nih.gov/articles/2767367/","finding":"National implementation could save an estimated 123 Mt carbon per year in year 10: about 20% of household direct emissions, 7.4% of national emissions, with little loss of well-being. Confirmed via search of abstract; paper not opened (PNAS 403).","verified":true}]},{"id":"FP07","side":"for","kind":"argument","angle":"consumption","strength":3,"title":"Household food waste is 60% of all waste","claim":"UNEP's Food Waste Index says the world wasted about 1.05 billion tonnes of food in 2022 and households were responsible for 631 million tonnes, 60%, averaging 79 kg per person. Food loss and waste is responsible for roughly 8 to 10% of global greenhouse gas emissions, and the single biggest slice is in your fridge.","say":"Fair fact. But that counts tonnes of food wasted, not emissions avoided, and the emissions figure they quote covers the whole chain. Ask what has measurably cut household waste, and by what.","detail":"UNEP's Food Waste Index 2024: 1.05 billion tonnes wasted in 2022, households 631 Mt (60 percent), food service 290 Mt, retail 131 Mt. The 8 to 10 percent emissions figure is for all food loss and waste, farm to fork. Do not claim the household share of those emissions is small: waste at the fridge carries all upstream emissions, so it could be large; the figure is not broken out here. We concede households waste a lot; whether packaging, date labels and collection rules shape that is our argument (F2), and we have no measured figure on it.","if_they_push":"Waste mass is not measured avoided emissions: ask what reduction has been realised and by what, and compare with a regulation that has been (F1, M1).","comeback":"Household waste is 60 percent of the tonnes and sits at the end of the chain, so each tonne carries the whole upstream footprint, and only households can stop binning food.","weak":true,"tags":["food waste","households","unep","631 million tonnes","60 percent","79 kg","fridge","8 to 10 percent","wasting food","consumer","supply chain","f1","f2"],"phrasings":["households waste 60% of all food","wasted food is 8 to 10% of emissions","stop binning food and you've cut emissions"],"frames":["F1","F2"],"uses":[],"notes":"Dropped the two-number say and the claim that the household share of emissions is smaller than 8 to 10 percent (misleading, since late-stage waste carries upstream emissions). Weak because we concede the fact and have no measured policy example on food waste.","sources":[{"title":"Food Waste Index Report 2024","publisher":"UNEP / WRAP","year":2024,"url":"https://www.unep.org/resources/publication/food-waste-index-report-2024","finding":"2022: 1.05 bn t wasted; households 631 Mt (60%), food service 290 Mt, retail 131 Mt. Confirmed via search summaries.","verified":true},{"title":"Food Waste Index 2024 key messages","publisher":"UNEP","year":2024,"url":"https://wedocs.unep.org/bitstream/handle/20.500.11822/45275/Food-Waste-Index-2024-key-messages.pdf","finding":"Food loss and waste generates an estimated 8-10% of global GHG emissions (whole chain).","verified":true}],"their_sources":[{"title":"Food Waste Index Report 2024","publisher":"UNEP / WRAP","year":2024,"url":"https://www.unep.org/resources/publication/food-waste-index-report-2024","finding":"2022: 1.05 bn t wasted (19% of food available); households 631 Mt (60%), food service 290 Mt, retail 131 Mt; 79 kg per capita. Confirmed via search summaries; UNEP page itself returned 403 on fetch.","verified":true},{"title":"Food Waste Index 2024 key messages","publisher":"UNEP","year":2024,"url":"https://wedocs.unep.org/bitstream/handle/20.500.11822/45275/Food-Waste-Index-2024-key-messages.pdf","finding":"Food loss and waste generates an estimated 8-10% of global GHG emissions (summary figure; report coverage says up to 10%).","verified":true}]},{"id":"FP08","side":"for","kind":"argument","angle":"consumption","strength":3,"title":"Rebound effects hit policy, not choices","claim":"Efficiency regulation makes energy cheaper to use, and people spend the savings on more consumption. Sorrell, Gatersleben and Druckman show rebounds can erode a large share of expected savings from efficiency, whereas a person who simply uses less of something, skips the flight or the second car, has no rebound on that behaviour. Sufficiency beats efficiency mandates.","say":"Their own source cuts the other way. Sorrell and colleagues review rebound and spillovers from behaviour change and conclude sufficiency actions have limited effect. Rebound is a reason to design the policy well, not to skip it.","detail":"Sorrell, Gatersleben and Druckman (2020) title their paper 'The limits of energy sufficiency': rebounds and negative spillovers also follow voluntary behavioural change, because savings in money, moral credit and time get spent elsewhere, and the authors find sufficiency actions have only a very limited effect on aggregate energy use. A skipped flight can fund another purchase. Do not deny that efficiency rules rebound too (the For side is right); concede it and move to net outcomes: rebound is a known risk that policy can price in, for instance with a carbon price that covers the substitute. We confirmed the direction from abstract mirrors, not exact rebound magnitudes.","if_they_push":"Both policy and personal choices have rebounds; the realized measure is net emissions, and the measured net falls are policy ones (M1, M5).","comeback":"Rebound hits efficiency mandates too, and skipping a flight has no rebound on that flight, so sufficiency still beats efficiency rules.","weak":false,"tags":["rebound","jevons","efficiency","sufficiency","policy fails","spending savings","moral licensing","fuel economy","behaviour change","sorrell","cheaper energy","f1"],"phrasings":["efficiency standards just make you drive more","Jevons paradox kills fuel economy rules","if you don't buy it there's nothing to rebound"],"frames":["F1"],"uses":["M1","M5"],"notes":"Corrected the DOI (erss.2020, not 2019) and added the paper's own conclusion on limited aggregate effect. Added a note to concede that efficiency rules also rebound and argue on net outcomes.","sources":[{"title":"The limits of energy sufficiency: A review of the evidence for rebound effects and negative spillovers from behavioural change","publisher":"Energy Research & Social Science (Sorrell et al.)","year":2020,"url":"https://doi.org/10.1016/j.erss.2020.101439","finding":"Reviews rebound and spillover from behavioural change; authors conclude sufficiency has only a very limited effect on aggregate energy use and emissions. DOI corrected to erss.2020.101439. Confirmed from abstract mirrors (CUSP, CREDS); full text not read.","verified":true}],"their_sources":[{"title":"The limits of energy sufficiency: A review of the evidence for rebound effects and negative spillovers from behavioural change","publisher":"Energy Research & Social Science (Sorrell, Gatersleben, Druckman)","year":2020,"url":"https://doi.org/10.1016/j.erss.2020.101439","finding":"Rebounds from sufficiency can also be large (indirect rebounds up to 14-300% in a Swedish study, per a slide deck). Cuts both ways: this paper actually argues sufficiency actions have limited aggregate effect, so the opponent can cite the same source. Abstract confirmed via search only.","verified":true}]},{"id":"FP09","side":"for","kind":"argument","angle":"consumption","strength":3,"title":"EVs and heat pumps cut lifetime emissions","claim":"A medium EV bought in Europe in 2021 emits 66 to 69% less over its lifetime than a petrol car even with battery production, and a 59-region study found EVs and heat pumps beat petrol cars and fossil boilers in 53 of 59 regions. Buying them is something a household can do in a week, and it locks in the cut for 15 years.","say":"Same EV, different result: ICCT finds a medium EV cuts lifetime emissions by about two thirds in Europe but far less in India. The buyer's choice is identical; the grid, largely set by policy, decides.","detail":"ICCT's 2021 study compares medium cars registered in 2021 over their lifetimes: 66 to 69 percent lower in Europe, 60 to 68 in the US, 37 to 45 in China, 19 to 34 in India. The spread tracks grid carbon intensity, which a buyer mostly cannot choose. Norway's 88.9 percent EV share of new cars in 2024 came with VAT and registration-tax exemptions (OW09), and European heat-pump sales fell 22 percent in 2024 (EHPA, 19 countries) after support changes (A3), so these purchases follow incentives. 'A week to buy' is true only inside a menu policy built (F2). Concede the EV still cuts emissions in India.","if_they_push":"Yes, an EV cuts emissions everywhere; the size of the cut is set by the grid, and the choice exists only where someone built chargers and made it affordable. Norway's EV share followed tax exemptions, not conscience (F2).","comeback":"Even in India the EV cuts emissions by 19 to 34 percent, so the buyer's choice cuts emissions on any grid without waiting for a law.","weak":false,"tags":["electric vehicle","ev","heat pump","home energy","lifecycle","66 to 69 percent","73 percent","boiler","knobloch","icct","buy","retrofit","lock in","f2"],"phrasings":["an EV cuts two thirds of emissions over its life","switch to a heat pump and be done","I can go electric tomorrow without waiting for a law"],"frames":["F2"],"uses":["OW09","FR04","A3"],"notes":"Said numbers cut to none in say (two ranges before). Rewrote if_they_push to concede the EV still helps everywhere, which answers the comeback; added EHPA 22 percent scope. ICCT figures confirmed only from secondary reports.","sources":[{"title":"A global comparison of the life-cycle GHG emissions of combustion engine and electric passenger cars","publisher":"ICCT (Bieker)","year":2021,"url":"https://theicct.org/publication/a-global-comparison-of-the-life-cycle-greenhouse-gas-emissions-of-combustion-engine-and-electric-passenger-cars/","finding":"BEV lifetime emissions 66-69% lower in Europe, 60-68% US, 37-45% China, 19-34% India versus gasoline, medium cars registered 2021. Figures match several secondary reports (Electrek, Autocar Pro, ZEMO); ICCT white paper itself not fetched.","verified":true},{"title":"Norway achieves 89 per cent EV share in 2024","publisher":"electrive (citing OFV)","year":2025,"url":"https://www.electrive.com/2025/01/02/norway-achieves-89-per-cent-ev-share-in-2024","finding":"88.9% of 128,691 new registrations were electric.","verified":true}],"their_sources":[{"title":"A global comparison of the life-cycle greenhouse gas emissions of combustion engine and electric passenger cars","publisher":"ICCT","year":2021,"url":"https://theicct.org/publication/a-global-comparison-of-the-life-cycle-greenhouse-gas-emissions-of-combustion-engine-and-electric-passenger-cars/","finding":"Europe, cars registered 2021: medium BEV lifetime emissions 66-69% lower than gasoline equivalent. URL not fetched; figure confirmed via secondary summary and later update citing 73%.","verified":false},{"title":"Net emission reductions from electric cars and heat pumps in 59 world regions over time","publisher":"Nature Sustainability (Knobloch et al.)","year":2020,"url":"https://doi.org/10.1038/s41893-020-0488-7","finding":"Life-cycle emissions of EVs and heat pumps are lower than new petrol cars and fossil boilers in 53 of 59 regions. Confirmed via search summary only.","verified":true}]},{"id":"FP10","side":"for","kind":"argument","angle":"consumption","strength":3,"title":"Frequent flyers are 1% of people, half of aviation","claim":"Only about 11% of the world flew in 2018 and at most 1% account for more than half of passenger aviation CO2. Aviation is largely outside binding policy agreements, so a small number of flyers deciding to stay on the ground has more effect than treaties that do not cover it.","say":"Agreed, and it argues for policy. A tiny group driving most flying emissions is exactly what a frequent-flyer levy reaches. Gossling's own paper says aviation is mostly outside policy agreements.","detail":"Gossling and Humpe estimate that at most 1 percent of the population likely accounts for more than half of passenger aviation emissions, with 11 percent flying in 2018 (confirmed from the abstract and Lund University release). The authors also note a large share of aviation emissions is not covered by policy agreements. A gap in policy is not evidence that individuals are a better lever, only that the lever has not been pulled. Appeals to flight shame have to persuade the 1 percent; a price or limit simply applies.","if_they_push":"A concentrated problem is the easiest one for a rule to reach, and the hardest for voluntary restraint, which only works on the willing. And 'outside policy' means policy has not tried yet, not that it cannot (F1).","comeback":"Aviation has stayed outside binding agreements for decades, so the only lever that exists today is those few people choosing to stay on the ground.","weak":false,"tags":["flying","aviation","frequent flyers","1 percent","half of emissions","gossling","private jets","flight shame","11 percent flew","not covered by policy","f1"],"phrasings":["1% of people cause half of flying emissions","just don't fly","aviation isn't regulated, individuals are the only lever"],"frames":["F1"],"uses":[],"notes":"Removed numbers from say (had 'one percent' and 'over half'). Gossling figures confirmed from several summaries and wording is hedged ('at most', 'likely'). Added 'has not tried yet' to if_they_push to meet the decades-of-no-policy comeback.","sources":[{"title":"The global scale, distribution and growth of aviation: Implications for climate change","publisher":"Global Environmental Change (Gossling & Humpe)","year":2020,"url":"https://doi.org/10.1016/j.gloenvcha.2020.102194","finding":"At most 1% of people likely account for more than half of passenger-aviation CO2 (2018); a large share of aviation emissions is outside policy agreements. Hedged ('likely', 'at most') in the authors' wording.","verified":true}],"their_sources":[{"title":"The global scale, distribution and growth of aviation: Implications for climate change","publisher":"Global Environmental Change (Gössling & Humpe)","year":2020,"url":"https://doi.org/10.1016/j.gloenvcha.2020.102194","finding":"At most 1% of the population likely accounts for more than half of passenger air travel emissions; 11% flew in 2018, at most 4% internationally; a large share of aviation emissions is outside policy agreements. Confirmed via abstract summary.","verified":true}]},{"id":"FP11","side":"for","kind":"argument","angle":"consumption","strength":2,"title":"Having one fewer child saves 58.6 tonnes","claim":"Wynes and Nicholas estimate that one fewer child in a developed country saves about 58.6 tCO2e per year, over 70 times a plant-based diet's 0.8 t. Reproductive choice is the single largest individual lever on lifetime emissions.","say":"That 58.6 tonnes is a multi-generation attribution, and a published comment argues it counts future generations' emissions more than once. We do not rest a motion on contested accounting.","detail":"Wynes and Nicholas's abstract gives 58.6 tCO2e per year for one fewer child in a developed country. Van Basshuysen and Brandstedt (ERL 2018) argue the attribution relies on multiple counting of future generations' emissions and excludes net-zero scenarios; per search summaries, Wynes and Nicholas replied that attribution has methodological problems and called for more research. A second comment (Pedersen and Lam) exists but we did not read it, so do not describe its content. Even a favourable reading attributes decades of future choices to a parent, which is a model, not a measured reduction (F1). Under a decarbonising grid those future emissions shrink, and grids are policy.","if_they_push":"Their strongest number is also their least accountable, and the authors accepted the attribution is contested. Even halved, it is a projection about people not yet born, not a measured reduction (F1).","comeback":"Even with the contested accounting trimmed, a child's lifetime emissions dwarf every other personal choice, and that choice is entirely the parent's.","weak":false,"tags":["fewer children","58.6 tonnes","family size","reproduction","carbon legacy","population","murtaugh schlax","wynes","largest lever","procreation","f1"],"phrasings":["one fewer child is 58 tonnes a year","the biggest thing you can do is not have a kid","per-year number looks huge but it's a multi-generation total"],"frames":["F1"],"uses":["FR07"],"notes":"Removed 'spread over one lifetime' (unsupported) and the claim about what Pedersen and Lam argued (not read). Kept multiple-counting critique, which the comment's abstract states.","sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://doi.org/10.1088/1748-9326/aa7541","finding":"Abstract: car-free 2.4 tCO2e/yr, one transatlantic return flight 1.6, plant-based diet 0.8, one fewer child 58.6 (developed-country average). Discussion proposes policies such as a food carbon tax and compact urban growth for structural barriers.","verified":true},{"title":"Comment on 'The climate mitigation gap'","publisher":"Environmental Research Letters (van Basshuysen & Brandstedt)","year":2018,"url":"https://ui.adsabs.harvard.edu/abs/2018ERL....13f9501V/abstract","finding":"Abstract: the authors argue the child figure relies on multiple counting of future generations' emissions and excludes net-zero emission scenarios. Abstract confirmed via search; full text not read.","verified":true}],"their_sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://doi.org/10.1088/1748-9326/aa7541","finding":"Abstract (fetched): one fewer child reduces about 58.6 tCO2e per year (developed-country average).","verified":true},{"title":"Critiques: second comment on the climate mitigation gap (Pedersen & Lam) and BYU critique","publisher":"Environmental Research Letters / Leuphana","year":2018,"url":"https://fis.leuphana.de/en/publications/second-comment-on-the-climate-mitigation-gap-education-and-govern/","finding":"Critics say the 58.6 t figure is a multi-generation total spread over one lifetime, attributes distant future emissions to the parent, and ignores collective action; a 2018 corrigendum followed. Expect this rebuttal; weakest FOR argument. Full text of comments not retrieved.","verified":true}]},{"id":"FP12","side":"for","kind":"argument","angle":"consumption","strength":2,"title":"Fast fashion is a consumer choice","claim":"Clothing production has roughly doubled since 2000 while the average garment is worn far less, and less than 1% of used clothing is recycled into new clothing. Buying less and wearing longer is entirely in the shopper's hands and no law has stopped the trend.","say":"Production doubled while shoppers were free to buy less, and it went the wrong way. Nobody shows a measured cut from buying less. What bends a curve is a standard or a price.","detail":"The Ellen MacArthur Foundation report says clothing production roughly doubled between 2000 and 2015 while garment utilisation fell (36 percent, per secondary reports), and under 1 percent of clothing is recycled into new clothes (closed-loop). Rising incomes, falling prices and a business model built on volume drove that as much as shopper choice, so do not blame shoppers alone. They offer no realised reduction, only what wearing garments longer could do (F1). We could not confirm the CO2 tonnage figure, so we do not quote it.","if_they_push":"If buying less worked we would see it in the production curve; what bends curves is a standard or a price (M5). Concede it is a hard case for us: no fashion-specific policy result is shown here.","comeback":"A doubling of clothing production is individual action having enormous impact; the resolution asks which has more impact, not which is better.","weak":true,"tags":["fast fashion","clothing","textiles","overconsumption","wear longer","buy less","ellen macarthur","less than 1 percent recycled","second hand","garment","f1"],"phrasings":["don't buy clothes you don't need","fast fashion is worth 1.2 billion tonnes","just wear it longer"],"frames":["F1"],"uses":["M5"],"notes":"Removed the awkward 'no tonnes of fashion cut are shown' line and the one-sided blame of shoppers. Weak because the doubling arguably proves their point about impact and we have no fashion policy measured result; concede quickly and move on.","sources":[{"title":"A New Textiles Economy: Redesigning fashion's future","publisher":"Ellen MacArthur Foundation","year":2017,"url":"https://emf.org/a-new-textiles-economy","finding":"Clothing production roughly doubled 2000-2015; utilisation down 36% vs 15 years earlier; under 1% recycled into new clothes (closed-loop). Confirmed via secondary reports (Adweek, Business Insider); report itself not fetched. The 1.2 bn t CO2e figure remains unconfirmed.","verified":true}],"their_sources":[{"title":"A New Textiles Economy: Redesigning fashion's future","publisher":"Ellen MacArthur Foundation","year":2017,"url":"https://emf.org/a-new-textiles-economy","finding":"Report found clothing production doubled in 15 years while use per garment fell, less than 1% recycled into new clothes, a truck of textiles landfilled or burned every second. The specific 1.2 bn t CO2e and 36% utilisation figures were not confirmed here; do not quote them.","verified":false}]},{"id":"FP13","side":"for","kind":"argument","angle":"consumption","strength":2,"title":"recycling and bags add up","claim":"Millions of people sorting their waste and carrying reusable bags create the demand signal that justifies municipal recycling and plastic-bag programs. Small acts also build the social norm that makes bigger action possible, so personal habits are the foundation, not a distraction.","say":"Their own source ranks comprehensive recycling well below the big actions. And where bag habits really changed, in Ireland, a levy did it, not conscience.","detail":"Wynes and Nicholas's abstract says comprehensive recycling is four times less effective than a plant-based diet and changing lightbulbs eight times less (abstract fetched). Ireland's 2002 levy took per-capita bag use from an estimated 328 to 21 (Irish government figures via Wicklow Council; an estimate, and use later crept back to about 31 and the levy was raised in 2007), which shows a price holds a habit only if it is kept up (OW15). Norms are real, but a norm that never becomes a rule cuts no tonnes (F3).","if_they_push":"Bags are tiny for climate; the point is that where a habit changed overnight, a price did it (OW15).","comeback":"Bag levies barely touch emissions, so Ireland proves nothing about climate, and norms from small habits are what let politicians pass the big rules.","weak":false,"tags":["recycling","reusable bags","plastic bags","small actions","social norms","habits","waste sorting","everyday","cumulative","gateway","signalling","f1","f3"],"phrasings":["every bit counts","if everyone recycled it would add up","small habits lead to big change"],"frames":["F1","F3"],"uses":["OW15"],"notes":"Said now has no numbers (previously three). Confirmed the recycling ratio from the fetched abstract and added that Ireland's 328-to-21 is an estimate that partly rebounded.","sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://doi.org/10.1088/1748-9326/aa7541","finding":"Abstract (fetched): comprehensive recycling four times less effective than a plant-based diet; changing lightbulbs eight times less. Authors recommend policy such as a food carbon tax and compact urban growth for structural barriers.","verified":true},{"title":"Plastic Bag Levy","publisher":"Wicklow County Council","year":2023,"url":"https://wicklow.ie/Living/Services/Environment/Recycling-Waste-Management/Recycling-Reduction-Reuse/Plastic-Bag-Levy","finding":"Per capita use fell overnight from an estimated 328 to 21 bags after the March 2002 levy (Irish government estimate). Later reports: rose to about 31 by 2007, levy raised that year.","verified":true}],"their_sources":[{"title":"The climate mitigation gap (comprehensive recycling comparison)","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://doi.org/10.1088/1748-9326/aa7541","finding":"Opponent's best evidence: this same paper ranks comprehensive recycling about four times less effective than a plant-based diet and lightbulb changes about eight times less; the weak arguments are small by the For side's own source. Ratios from search summary of the paper.","verified":true}]},{"id":"PL01","side":"for","kind":"argument","angle":"policy fragility","strength":5,"title":"Paris pledges leave a huge implementation gap","claim":"After a decade of Paris, governments' own pledges still land at 2.3 to 2.5 C if fully delivered, and current policies at up to 2.8 C; UNEP says the 2025 round of new pledges barely moved the needle, and most countries are not even on track for their 2030 targets. Policy is a promise; emissions are what individuals and firms actually do.","say":"The gap is policy that is too weak, not proof that individuals could have closed it. Climate Action Tracker has current policies about a degree lower than in 2015, and that movement is government action.","detail":"UNEP 2025 puts current policies at up to 2.8 C and full NDC delivery at 2.3 to 2.5 C. Climate Action Tracker (our OW17) had its current-policies projection at 3.6 C in 2015 and about 2.6 C now, roughly a degree lower, and credits the Paris Agreement; CAT says its latest 0.1 C step was mostly a methodology change for China, so use the 2015 to 2025 comparison, not the yearly one. The For side's own source measures the distance between what governments have done and what they promised; nothing in it measures what households could have done. Concede the gap, turn it: it is the size of the job policy has not finished.","if_they_push":"Do not lean on the 3.1 to 2.8 drop: UNEP says 0.1 C of it is methodology and the US withdrawal cancels another 0.1 C. If they say a projection is not a measurement, agree, and move to measured cases (M1, M5); F1 applies to their scenarios and to ours. A record-high year indicts their lever too (B6).","comeback":"Your degree of progress is a model projection, and a decade after Paris emissions are still at record highs, so policy has under-delivered.","weak":false,"tags":["paris","ndc","unep","emissions gap","2.8 degrees","pledges","implementation gap","overshoot","promises","1.5","f1","f2"],"phrasings":["But the Paris targets are improving, the projection fell from 3.1 to 2.8 C.","The gap shows we need stronger policy, not less policy.","Pledges aren't the same as policy; actual regulations bind."],"frames":["F1","F2"],"uses":["OW17"],"notes":"CAT 3.6 to 2.6 C confirmed on its release. Fixed if_they_push, which said UNEP credits the drop to methodology and US withdrawal; UNEP says methodology adds 0.1 C of improvement and US withdrawal cancels 0.1 C. Added the point that a projection is a scenario, which F1 would also bar us from leaning on.","sources":[{"title":"UNEP Emissions Gap Report 2025: Off target (PBL summary)","publisher":"UNEP via PBL","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Current policies up to 2.8 C (3.1 C in the 2024 report); full NDCs 2.3-2.5 C; new pledges barely moved the outlook.","verified":true},{"title":"Global Update COP30 release","publisher":"Climate Action Tracker","year":2025,"url":"https://climateactiontracker.org/press/release-global-update-2025/","finding":"Current-policies projection 3.6 C in 2015, 2.6 C now (via ours.json OW17).","verified":true}],"their_sources":[{"title":"Emissions Gap Report 2025: Off target (summary by PBL)","publisher":"UNEP via PBL Netherlands Environmental Assessment Agency","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Full NDC implementation gives 2.3-2.5 C this century; current policies up to 2.8 C; only 0.1 C of the improvement from methodology and 0.1 C from US withdrawal, otherwise new NDCs barely changed the outlook.","verified":true},{"title":"UNEP Emissions Gap Report 2025 press statement","publisher":"UNEP","year":2025,"url":"https://www.unep.org/en/news-and-stories/statements/emissions-gap-report-2025-executive-director-press-statement","finding":"Official UNEP statement on the 2025 report (page returned 403 to the fetch tool; content cross-checked via search summaries of UNEP report: only 60 Parties covering 63% of emissions had submitted new 2035 NDCs by 30 Sept 2025).","verified":false}]},{"id":"PL04","side":"for","kind":"argument","angle":"policy fragility","strength":4,"title":"Kyoto: binding treaty, rising emissions, Canada walked","claim":"Kyoto bound Canada to 6 percent below 1990 levels by 2012. By 2010 Canada's emissions were about 17.5 percent above 1990, and in December 2011 Canada became the first country to formally withdraw rather than pay penalties. The strongest international treaty ever signed was ignored by the people it was meant to bind.","say":"Canada missed because it never delivered the policy, then walked out. That is policy absent, not policy failing. Every party that stayed in ended compliant, though much of that was Soviet-era surplus.","detail":"Concede the Canada facts: 17.5 percent above 1990 against a promise of 6 percent below, and formal withdrawal in December 2011. Canada failed because it did not deliver the policy, which is policy absent, not evidence that policy is weak. I4CE's final-data study finds all Annex B parties ended in compliance once flexibility mechanisms are counted, but only nine of 36 fully participating countries beat their targets domestically; surplus Soviet-era allowances ('hot air') and land-use accounting explain much of the overachievement. UNFCCC's headline of 22.6 percent below 1990 against about 5 percent promised is dominated by the post-Soviet collapse and could not be opened, so do not say it aloud.","if_they_push":"Concede the hot-air caveat openly: only nine of 36 met their targets from domestic cuts, the rest used credits, sinks and trading. Then hold the narrow claim: the US never ratified and Canada left, so the failure was participation, a political choice, not proof that binding rules cannot move emissions. Pivot to measured cases where the rule bound and held (M1, M2).","comeback":"Kyoto was binding on paper, riddled with loopholes, the US never joined, Canada ignored it, and most of the compliance was Soviet hot air.","weak":true,"tags":["kyoto","canada","withdrawal","2011","binding","treaty","oil sands","17 percent","1990","durban","enforcement","f1"],"phrasings":["Kyoto's EU parties largely met their targets.","Canada's failure is one country, not proof policy fails.","Emissions fell 6.5 percent from 2005 by 2010."],"frames":["F1"],"uses":[],"notes":"Removed the 22.6 percent claim from say: it is unverified and misleading without the hot-air context. Fixed if_they_push, which said 27 of 36 met targets domestically; I4CE says only nine did and the rest used flexibility mechanisms. Best available but Kyoto is a poor example for us.","sources":[{"title":"Developed Countries Enter Final Phase of Kyoto Protocol 1st Period","publisher":"UNFCCC","year":2015,"url":"https://unfccc.int/news/developed-countries-enter-final-phase-of-kyoto-protocol-1st-period","finding":"UNFCCC page fetched but gives no percentages; the 22.6% figure appears nowhere in searches.","verified":false,"note":"Page returns a fragment only; search found no 22.6%. Collective target was at least 5% below 1990 for 2008 to 2012. Card already says do not say it aloud; keep that."},{"title":"Compliance of Parties with the Kyoto Protocol in the first period (2008-2012)","publisher":"I4CE (Shishlov, Morel, Bellassen)","year":2016,"url":"https://i4ce.org/?p=13508","finding":"Only nine of 36 fully participating countries exceeded their commitment domestically; after flexibility mechanisms all were in compliance; surplus allowances and land use explain much of the overachievement. Seen via search summary.","verified":true},{"title":"Canada cuts CO2 emissions, but misses target","publisher":"Phys.org (AFP)","year":2012,"url":"https://phys.org/news/2012-04-canada-co2-emissions.html","finding":"Canada 17.5 percent above 1990 (692 Mt in 2010) against a 6 percent cut promise.","verified":true}],"their_sources":[{"title":"Canada cuts CO2 emissions, but misses target","publisher":"Phys.org (AFP)","year":2012,"url":"https://phys.org/news/2012-04-canada-co2-emissions.html","finding":"Emissions 17.5 percent above 1990 levels (692 Mt in 2010) against a Kyoto commitment of 6 percent below 1990 by 2012.","verified":true},{"title":"Canada quits Kyoto climate protocol","publisher":"Al Jazeera","year":2011,"url":"https://www.aljazeera.com/news/2011/12/13/canada-quits-kyoto-climate-protocol","finding":"Environment Minister Peter Kent announced Canada's withdrawal on 12 Dec 2011; first country to formally withdraw (not fetched directly; confirmed via search results).","verified":false}]},{"id":"PL06","side":"for","kind":"argument","angle":"movements","strength":4,"title":"Individuals sue and force governments to act","claim":"Policy itself changed because individuals went to court. Urgenda, a citizens' foundation, won at the Dutch Supreme Court in December 2019 forcing a 25 percent cut by end of 2020; Montana youth won Held v. Montana, upheld 6-1 on 18 December 2024; and the ECHR Grand Chamber held on 9 April 2024 that Switzerland violated its duties after a group of older women sued. Citizens are the enforcement mechanism for government policy.","say":"A court order is government acting, so the impact is policy's. Urgenda won an order against the Dutch state; the remedy was state policy. In KlimaSeniorinnen the association won and the four individual applicants were thrown out.","detail":"Urgenda is a foundation, not an individual, and the Dutch Supreme Court (20 December 2019) ordered the state to cut at least 25 percent below 1990 by the end of 2020, leaving the measures to the state (IDEA). In KlimaSeniorinnen (9 April 2024) the Grand Chamber found Switzerland violated Article 8 and Article 6(1), the latter on access to court; the association had standing and the four individual applicants were inadmissible for lack of victim status. Held v. Montana, 18 December 2024, 6 to 1 (Justice Rice dissenting on standing), struck down a statutory bar on considering greenhouse gases in permitting, which is a rule changing a rule and does not itself cut a tonne. Litigation is the route; the output is a policy (F3).","if_they_push":"If they say individuals brought the cases: yes, and what changed the environment was the order on the state, so the tonnes are policy's (F3). The successful litigants were organisations; the private individuals lost on standing in Europe. A lawsuit that wins is a mechanism for making governments act; citizens enforcing policy is our side of the motion.","comeback":"A lawsuit is one citizen forcing a whole government to act, the clearest case of individual action beating policy.","weak":false,"tags":["urgenda","held v montana","klimaseniorinnen","echr","litigation","youth","courts","citizens","supreme court","25 percent","human rights","standing","f3"],"phrasings":["A court order is government action; that is policy winning.","Held applies only to Montana's permitting statute and does not cut emissions directly.","Urgenda was a foundation, and the four KlimaSeniorinnen individuals lost."],"frames":["F3"],"uses":[],"notes":"All three case facts confirmed (Urgenda 25 percent; Held 6-1 on 18 Dec 2024; KlimaSeniorinnen individuals inadmissible, association standing). Added dates, the Article 6 detail and the dissent; if_they_push now answers the 'individuals brought the case' comeback.","sources":[{"title":"Urgenda Foundation v. State of the Netherlands (Supreme Court, 2019)","publisher":"International IDEA","year":2019,"url":"https://www.idea.int/cases/urgenda-foundation-v-state-netherlands-supreme-court-2019","finding":"Dutch Supreme Court: at least 25 percent below 1990 by 31 Dec 2020; measures left to the state.","verified":true},{"title":"KlimaSeniorinnen v Switzerland (ECtHR Grand Chamber, 2024)","publisher":"International IDEA","year":2024,"url":"https://www.idea.int/cases/klimaseniorinnen-v-switzerland-european-court-human-rights-2024","finding":"Association had standing; the four individual applicants were inadmissible; Article 8 violated.","verified":true},{"title":"Montana Supreme Court holds state constitution includes protections against climate change (Held v. Montana)","publisher":"Jones Day","year":2025,"url":"https://www.jonesday.com/de/insights/2025/03/montana-supreme-court-holds-state-constitution-includes-protections-against-climate-change","finding":"18 Dec 2024, 6-1: MEPA bar on considering greenhouse gases violated the clean and healthful environment right.","verified":true}],"their_sources":[{"title":"Urgenda Foundation v. State of the Netherlands (Supreme Court, 2019)","publisher":"International IDEA","year":2019,"url":"https://www.idea.int/cases/urgenda-foundation-v-state-netherlands-supreme-court-2019","finding":"Dutch Supreme Court held Articles 2 and 8 ECHR require at least 25 percent cut below 1990 by 31 Dec 2020; measures left to the state.","verified":true},{"title":"Montana Supreme Court holds state constitution includes protections against climate change (Held v. Montana)","publisher":"Jones Day","year":2025,"url":"https://www.jonesday.com/de/insights/2025/03/montana-supreme-court-holds-state-constitution-includes-protections-against-climate-change","finding":"On 18 Dec 2024 Montana Supreme Court, 6-1, held MEPA's bar on considering greenhouse gases violated the right to a clean and healthful environment.","verified":true},{"title":"KlimaSeniorinnen v Switzerland (ECtHR Grand Chamber, 2024)","publisher":"International IDEA","year":2024,"url":"https://www.idea.int/cases/klimaseniorinnen-v-switzerland-european-court-human-rights-2024","finding":"Grand Chamber, 9 Apr 2024: Switzerland violated Article 8 and Article 6(1); the association had standing, the four individual applicants were inadmissible.","verified":true}]},{"id":"PL07","side":"for","kind":"argument","angle":"policy fragility","strength":4,"title":"Governments subsidise the problem: $7 trillion","claim":"The IMF counts $7 trillion in fossil fuel subsidies in 2022, 7.1 percent of global GDP; for 2024 it is $0.73 trillion explicit plus $6.7 trillion implicit. Even if you debate the implicit part, governments actively underwrite emissions, so policy cannot be the net force for the environment.","say":"Subsidies are policy, so reform is the lever. And per the IMF, most of that 7 trillion dollars is unpriced harm, not payments, which a carbon price fixes. That is the policy fight we are asking for.","detail":"The IMF's 2022 figure of about 7 trillion dollars (7.1 percent of GDP) is 18 percent explicit subsidies; for 2024 it is 0.73 trillion explicit and 6.7 trillion implicit. Implicit means undercharging: environmental and health costs left unpriced plus fuel taxes below the standard consumption-tax rate, which is a missing policy, not a payment. Concede that governments do subsidise fossil fuel, and turn it: when explicit subsidies end, no household has to act, and where carbon was priced, emissions fell (UK coal M5; EU ETS about 1.2 billion tonnes, OW07). Capture shows policy matters enough to lobby for.","if_they_push":"Subsidy reform is exactly the policy lever; nobody on their side can point to a consumer campaign that removed a subsidy.","comeback":"Governments spend trillions making the problem worse, so policy is a net negative and reform is only hypothetical.","weak":false,"tags":["subsidies","imf","fossil fuel","7 trillion","implicit","explicit","capture","lobbying","gdp","externalities","undercharging","f2"],"phrasings":["Implicit subsidies are unpriced externalities, not government payments.","Only explicit subsidies, about $0.7 trillion, are real money.","Subsidy reform is exactly the policy lever we propose."],"frames":["F2"],"uses":["M5","OW07"],"notes":"IMF figures confirmed: about 7 trillion in 2022 with 18 percent explicit; 2024 split 0.73 trillion explicit and 6.7 trillion implicit. Clarified in detail that implicit includes undercharged consumption tax, not only harm. The 2022 and 2024 totals come from different IMF updates, so never mix them in one sentence.","sources":[{"title":"IMF Fossil Fuel Subsidies Data: 2023 Update","publisher":"International Monetary Fund","year":2023,"url":"https://www.imf.org/en/Publications/WP/Issues/2023/08/22/IMF-Fossil-Fuel-Subsidies-Data-2023-Update-537281","finding":"About 7 trillion dollars in 2022, 7.1 percent of GDP; explicit subsidies 18 percent of the total.","verified":true},{"title":"IMF Energy Subsidies topic page","publisher":"International Monetary Fund","year":2025,"url":"https://www.imf.org/en/Topics/climate-change/energy-subsidies","finding":"2024: explicit 0.73 trillion, implicit 6.7 trillion.","verified":true}],"their_sources":[{"title":"IMF Fossil Fuel Subsidies Data: 2023 Update","publisher":"International Monetary Fund","year":2023,"url":"https://www.imf.org/en/Publications/WP/Issues/2023/08/22/IMF-Fossil-Fuel-Subsidies-Data-2023-Update-537281","finding":"Fossil fuel subsidies about $7 trillion in 2022, 7.1 percent of global GDP; explicit subsidies were 18 percent of the total.","verified":true},{"title":"IMF Energy Subsidies topic page","publisher":"International Monetary Fund","year":2025,"url":"https://www.imf.org/en/Topics/climate-change/energy-subsidies","finding":"In 2024 explicit subsidies were $0.73 trillion (0.6 percent of GDP) and implicit $6.7 trillion (5.8 percent of GDP).","verified":true}]},{"id":"PL09","side":"for","kind":"argument","angle":"policy fragility","strength":3,"title":"EU biofuel mandates drove palm oil deforestation","claim":"The EU's renewable fuel mandates pushed palm oil into diesel: 51 percent of the palm oil Europe uses went into biodiesel, and a 2016 Commission-commissioned study (Globiom) found palm biodiesel has about three times the climate impact of fossil diesel once land-use change is counted. A policy meant to cut emissions raised them.","say":"True, and policy corrected it: the EU's RED II phases high-risk palm biodiesel out by 2030. A bad rule fixed by a rule shows policy is the lever, and no household could have unpicked palm oil from diesel.","detail":"Their own Transport and Environment source says 51 percent of Europe's palm oil goes into biodiesel and that the Commission's Globiom study found palm biodiesel about three times fossil diesel's climate impact once land-use change is counted. The same source reports RED II phases high-ILUC fuels to zero by 2030. T&E is an advocacy group relaying a Commission modelling study; concede that and still note that the finding came from a policy review that changed the policy. One mandate that backfired is design failure, and policy has the means to correct it.","if_they_push":"Ask them for the individual-action example that corrected itself at the scale of a continent's fuel market.","comeback":"Policy created the palm-oil demand in the first place and took years to notice, which is exactly why policy can't be trusted as the lever.","weak":false,"tags":["biofuels","palm oil","eu","deforestation","iluc","renewable energy directive","perverse","mandate","globiom","soy","unintended consequences","f2"],"phrasings":["The EU then fixed it via RED II, so policy corrected itself.","T&E is an NGO; Globiom is a modelling result.","One bad mandate does not make all policy bad."],"frames":["F2"],"uses":[],"notes":"51 percent, Globiom 3x and RED II phase-out to zero by 2030 all match the T&E page as reported. Understated and self-contained; no change beyond the check.","sources":[{"title":"Palm oil and soy oil for biofuels linked to high rates of deforestation","publisher":"Transport & Environment","year":2019,"url":"https://www.transportenvironment.org/articles/palm-oil-and-soy-oil-biofuels-linked-high-rates-deforestation-new-study","finding":"51 percent of Europe's palm oil goes to biodiesel; Globiom 2016 about 3x fossil diesel; RED II phases high-ILUC fuels to zero by 2030.","verified":true}],"their_sources":[{"title":"Palm oil and soy oil for biofuels linked to high rates of deforestation","publisher":"Transport & Environment","year":2019,"url":"https://www.transportenvironment.org/articles/palm-oil-and-soy-oil-biofuels-linked-high-rates-deforestation-new-study","finding":"51 percent of palm oil used in Europe goes into biodiesel; Globiom 2016: palm biodiesel about 3x fossil diesel impact; RED II phases high-ILUC fuels to 0 percent by 2030. Advocacy group, relays the Commission's Globiom study.","verified":true}]},{"id":"PL10","side":"for","kind":"argument","angle":"policy fragility","strength":3,"title":"Germany's nuclear exit pushed coal up","claim":"Germany's post-Fukushima nuclear phase-out, a politically popular policy, was mainly replaced by coal and imports. Jarvis, Deschenes and Jha estimate a social cost of 3 to 8 billion euros a year, mostly from air-pollution mortality. Policy driven by public fear, not outcomes, raised emissions and killed people.","say":"A bad policy still moved a national grid and measurable deaths, and no household choice moves a grid. Policy is the lever in both directions: Germany shows the cost of pulling it badly, Ontario the benefit of pulling it well.","detail":"Jarvis, Deschenes and Jha estimate a social cost of 3 to 8 billion euros a year in the published 2022 version (the 2019 working paper said 12 billion dollars), mostly from air-pollution mortality, because lost nuclear output was replaced mainly by coal and net imports. Concede the facts. The point is the size: a single political decision changed national electricity supply and its health outcomes. We do not claim every policy is wise; we claim policy is the lever, in both directions. Ontario shows the good direction: coal out and smog days down (M1, OW05).","if_they_push":"The counterfactual is contested, but it shows design, not that individuals could do better; ask what individual action moved a grid by that much. If they say public fear drove it, that is F3: the fear became emissions only through a law.","comeback":"The phase-out followed public fear after Fukushima, so individuals drove it, and it made emissions and deaths worse.","weak":true,"tags":["germany","nuclear","phase-out","coal","energiewende","fukushima","mortality","jarvis","air pollution","social cost","unintended","f2","f1"],"phrasings":["Germany's renewables share rose; this was one policy and has since been reversed by the market.","The study's counterfactual is contested.","This shows policy needs to be well designed, not that individuals do better."],"frames":["F2","F1"],"uses":["M1","OW05"],"notes":"Rewrote say, which wrongly spoke of a national fleet and began with a concession. The cost figure is the 2022 published range of 3 to 8 billion euros; the earlier 12 billion was dollars from a working paper. Weak because the argument concedes policy killed people and a judge may read 'impact' as net benefit.","sources":[{"title":"The Private and External Costs of Germany's Nuclear Phase-Out","publisher":"Journal of the European Economic Association 20(3):1311-1346 (Jarvis, Deschenes, Jha)","year":2022,"url":"https://econpapers.repec.org/RePEc:oup:jeurec:v:20:y:2022:i:3:p:1311-1346.","finding":"Social cost 3-8 billion euros a year, mostly mortality from local air pollution; lost nuclear output replaced mainly by coal and net imports.","verified":true}],"their_sources":[{"title":"The Private and External Costs of Germany's Nuclear Phase-Out","publisher":"Journal of the European Economic Association 20(3): 1311-1346","year":2022,"url":"https://econpapers.repec.org/RePEc:oup:jeurec:v:20:y:2022:i:3:p:1311-1346.","finding":"Social cost 3 to 8 billion euros per year, mostly mortality from local air pollution; lost nuclear output offset mainly by coal and net imports. DOI 10.1093/jeea/jvac007.","verified":true}]},{"id":"PL12","side":"for","kind":"argument","angle":"policy fragility","strength":2,"title":"Efficiency policy backfires through rebound","claim":"Efficiency standards promise savings, but cheaper energy services invite more use; the idea goes back to Jevons in 1865. The result is that engineered savings are partly eaten, which is why the individual choice to consume less matters more than the efficiency mandate.","say":"Rebound is partial, not backfire. The standard review, Gillingham, Rapson and Wagner, finds little support for backfire, so efficiency standards still save energy. And a household that cuts its bill rebounds too.","detail":"The review says backfire is theoretically possible but not supported by the evidence, and treats rebound as partial; macro rebound is more uncertain. A rebound of even 30 percent leaves 70 percent of the savings. Households rebound too: money saved on fuel is spent on something else, and voluntary cuts have no mechanism to hold them. The authors' blog summary puts the plausible upper bound of total rebound near 60 percent; that is not confirmed in the paper text, so do not say the figure aloud.","if_they_push":"If rebound is the problem, the fix is a price on carbon, which is policy.","comeback":"Even at 30 percent rebound you lose a third of the savings, while a personal cut in consumption has no such leak.","weak":false,"tags":["jevons","rebound","efficiency","backfire","energy standards","consumption","sufficiency","rebound effect","paradox","appliances","f1"],"phrasings":["Gillingham et al. say backfire is not supported by evidence.","Rebound of 30 percent still leaves 70 percent savings.","Individuals rebound too, when they save on fuel and fly more."],"frames":["F1"],"uses":[],"notes":"Removed the 60 percent number from say because it was confirmed only in a blog summary, and removed the 2020 CO2 example (a lockdown, i.e. policy) and an unsupported welfare line. Replaced 'their own source' with 'the standard review'.","sources":[{"title":"The Rebound Effect and Energy Efficiency Policy","publisher":"Review of Environmental Economics and Policy 10(1):68-88 (Gillingham, Rapson, Wagner)","year":2016,"url":"https://econpapers.repec.org/RePEc:oup:renvpo:v:10:y:2016:i:1:p:68-88.","finding":"Abstract: existing research provides little support for the so-called backfire hypothesis; macro rebound understanding is limited.","verified":true,"note":"Fetched the RePEc abstract; no rebound percentage given, so the 60% bound stays unverified (card already says not to say it)."},{"title":"Global Carbon Project analysis of the 2020 emissions fall","publisher":"Carbon Brief","year":2020,"url":"https://www.carbonbrief.org/global-carbon-project-coronavirus-causes-record-fall-in-fossil-fuel-emissions-in-2020/","finding":"Fossil CO2 projected to fall about 7% in 2020 (2.4 GtCO2); Le Quere: surface transport cuts were 'not a structural decrease, but forced changes in behaviour'.","verified":true,"note":"Fetched Carbon Brief page. It was a projection at the time (Dec 2020)."}],"their_sources":[{"title":"The Rebound Effect and Energy Efficiency Policy","publisher":"Review of Environmental Economics and Policy 10(1): 68-88 (Gillingham, Rapson, Wagner)","year":2016,"url":"https://econpapers.repec.org/RePEc:oup:renvpo:v:10:y:2016:i:1:p:68-88.","finding":"Concedes rebound exists (macro rebound plausibly up to about 60 percent) but evidence does not support full backfire. Weakens this argument: honest framing is partial rebound, not Jevons backfire.","verified":false}]},{"id":"PL13","side":"for","kind":"argument","angle":"policy fragility","strength":2,"title":"Governments are too slow for the carbon budget","claim":"The carbon budget is measured in a few years while legislation is measured in electoral cycles and treaty rounds. UNEP shows the world heading for overshoot of 1.5 C within the next decade; individuals can change today.","say":"Individuals are slow too. Policy switched the UK grid from 39 percent coal to none, by price and by phase-out date. Overshoot is a reason for faster policy, not for less.","detail":"UNEP says warming will exceed 1.5 C, very likely within the next decade; that is an argument about pace. Policy delivered coal phase-outs at grid scale: the UK in twelve years (M5, OW06), Ontario from 32.9 Mt to 5.4 Mt in nine (M1). Voluntary adoption takes longer: a household acts only when it can afford and access the option. Speed is not impact, but the fast cuts in our measured examples are legislated.","if_they_push":"Ask which individual action moved national emissions faster than a ban or a price; none of their examples is measured at that scale. Twelve years for a grid is slow against a carbon budget, so concede that and answer: the remedy is faster policy.","comeback":"Twelve years to retire one grid is slower than the carbon budget allows, while a household can switch its heating this winter.","weak":false,"tags":["too slow","speed","timing","carbon budget","overshoot","election cycle","urgency","bureaucracy","1.5","individuals act now","f1","f2"],"phrasings":["Individuals are slow too; adoption of EVs took a decade.","Policy can switch whole grids in one decision.","Speed is not impact."],"frames":["F1","F2"],"uses":["M1","M5","OW06"],"notes":"Cut the say to one number; removed 'in one decision' (the UK phase-out took twelve years) and narrowed the 'only measured fast cuts' claim to our own examples. Euronews and Ontario figures check out.","sources":[{"title":"UK closes its last coal power plant","publisher":"Euronews","year":2024,"url":"https://www.euronews.com/green/2024/09/30/uk-closes-last-coal-power-plant-after-142-years","finding":"Coal 39 percent of UK generation in 2012; last plant closed 30 Sept 2024.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG 32.9 Mt (2005) to 5.4 Mt (2014).","verified":true},{"title":"UNEP Emissions Gap Report 2025 (PBL summary)","publisher":"UNEP via PBL","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Warming will exceed 1.5 C, very likely within the next decade.","verified":true}],"their_sources":[{"title":"Emissions Gap Report 2025 (summary by PBL)","publisher":"UNEP via PBL","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Policy trajectory still up to 2.8 C; overshoot of 1.5 C expected (overshoot claim from search summary).","verified":true}]},{"id":"PL14","side":"for","kind":"argument","angle":"policy fragility","strength":1,"title":"Politicians promise and then dilute","claim":"Politicians campaign on climate and govern on re-election: targets are set for 2050, long after the term ends, and are routinely weakened once costs show up. Individuals who actually bear costs follow through because the choice is theirs.","say":"Dilution is a reason to make the law bind, not to drop it. Where policy was strongest, emissions tended to fall most, in Le Quere's study of developed economies.","detail":"The For side's only evidence is Canada's Kyoto miss, which their own file calls an anecdote. Le Quere et al. (2019) studied 18 developed economies and associated the largest declines with the countries that had the most energy and climate policies; those countries were selected for already falling emissions, so it is an association, not a clean test, and the paper was not opened. Individuals also fail their stated intentions, and unlike a statute, a personal pledge has no enforcement. Dilution after costs show up is the argument for constraints that bind, such as ban dates and legislated phase-outs (M1, M2).","if_they_push":"Concede that politicians dilute targets; the remedy is binding law, and the For side offers no equivalent mechanism for personal pledges. Do not claim causation from Le Quere; say 'tended to'.","comeback":"Those 18 countries were picked because emissions fell, and policy correlating with falls doesn't show policy caused them.","weak":true,"tags":["politicians lie","promises","greenwash","short-termism","targets 2050","re-election","dilute","credibility","trust","net zero","f1","f3"],"phrasings":["That is anecdote, not evidence about all governments.","Individuals say they care and don't act either (attitude-behaviour gap).","Weak governments are a reason to vote better, which is policy."],"frames":["F1","F3"],"uses":["M1","M2"],"notes":"Dropped 'vote better, which is policy again' from the lead because it invites 'voting is individual action', and dropped the number 18 since the source is unverified. Selection and causation are the real weakness; low-strength item.","sources":[{"title":"Drivers of declining CO2 emissions in 18 developed economies","publisher":"Nature Climate Change (Le Quere et al.)","year":2019,"url":"https://www.pbl.nl/en/publications/drivers-of-declining-co2-emissions-in-18-developed-economies","finding":"18 developed economies cut CO2 2005 to 2015; renewable and efficiency policies linked to emissions reductions; summaries say largest declines where most energy and climate policies.","verified":"partial","note":"Nature page blocked (login redirect). PBL abstract confirms 18 economies and the policy association; the largest-declines-with-most-policies line comes from Future Earth and phys.org summaries. Association only."},{"title":"Canada cuts CO2 emissions, but misses target","publisher":"Phys.org (AFP)","year":2012,"url":"https://phys.org/news/2012-04-canada-co2-emissions.html","finding":"Kyoto promise 6 percent below 1990, delivered 17.5 percent above; an anecdote.","verified":true}],"their_sources":[{"title":"Canada cuts CO2 emissions, but misses target","publisher":"Phys.org (AFP)","year":2012,"url":"https://phys.org/news/2012-04-canada-co2-emissions.html","finding":"Illustrates promise-vs-delivery: committed to -6 percent vs 1990, delivered +17.5 percent. Anecdote, not systematic evidence of lying.","verified":true}]},{"id":"MK02","side":"for","kind":"argument","angle":"markets","strength":4,"title":"Pakistan's households out-built its government","claim":"Pakistan imported about 17 GW of solar panels in 2024, double 2023, and Ember says it happened without sweeping government mandates or international green finance: households and farmers simply did the arithmetic on grid prices. By 2025 about 18% of Pakistani households had solar and 61% of agricultural tubewells were solar.","say":"Households did the buying, yes. But Ember's own report lists a generous net-metering policy and a tax regime that kept import costs low among the drivers. They answered prices and rules that policy had set.","detail":"Ember's Pakistan report names a generous net-metering policy that rewarded early adopters and a tax regime that kept import costs low among the drivers, alongside rising grid prices. Industry was pushed by IMF-mandated levies on gas for captive power, and solar tubewells grew through a mix of private forces and government schemes, with subsidies and lending. When Pakistan moved to net billing, Ember says the advantage fell and adopters turn toward batteries. Expect the hard push: only about 300,000 connections are net-metered (NEPRA figure from a search summary, unverified) while tens of gigawatts were imported, much of it behind the meter or off-grid, so net metering alone does not explain the surge. Our answer is that the grid price people were escaping, the treatment of imports and the levies are all government instruments. We have not verified the actual duty or sales-tax rates. Panels were also cheap partly because of demand policy elsewhere (OW14), though the attribution is debated. Households chose from a menu that tariffs, taxes and levies wrote.","if_they_push":"Most of it was not net-metered, they will say. Fine: the grid price people were escaping is a regulated price, and import taxes and levies are policy too. The household was the channel; the cause was a set of rules.","comeback":"Most of Pakistan's solar is not net-metered and went in because grid power got too expensive, so households acted on arithmetic, not on a government programme.","weak":true,"tags":["pakistan","solar","rooftop","17 gw","ember","households","no mandate","grid prices","tubewells","bottom-up","imports","f2"],"phrasings":["Pakistan's boom was a reaction to government-set grid tariffs and a favourable import tax regime and net metering, so it is policy.","Chinese customs data is an upper bound; official capacity figures are far lower, so how much was actually installed?"],"frames":["F2"],"uses":["OW14"],"notes":"Facts hold against the fetched Ember page, but net metering covers only a small share of installs, so I removed the implication that it explains the surge and added the grid-price and levy answer. A judge may still see this as households responding to prices.","sources":[{"title":"The solarisation of Pakistan's energy economy","publisher":"Ember","year":2026,"url":"https://ember-energy.org/latest-insights/the-solarisation-of-pakistans-energy-economy/","finding":"Fetched this session: lists a generous net-metering policy that rewarded early adopters and a tax regime that kept import costs low; rising grid prices; IMF-mandated levies on gas for captive power; solar tubewells grew via private forces and government schemes; net billing has reduced the net-metering advantage. Gives no duty or tax rates. 18% of households (7 of 40 million), 61% of tubewells.","verified":true},{"title":"Renewable Power Generation Costs in 2020","publisher":"IRENA","year":2021,"url":"https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2021/Jun/IRENA_Power_Generation_Costs_2020.pdf","finding":"Utility-scale solar PV cost down 85% 2010 to 2020. IRENA does not itself credit Germany's tariff; the link is from learning-curve literature, so it is hedged in detail.","verified":true}],"their_sources":[{"title":"Global Electricity Review 2025: The Big Picture","publisher":"Ember","year":2025,"url":"https://ember-energy.org/latest-insights/global-electricity-review-2025/the-big-picture/","finding":"Fetched: Pakistan imported 17 GW of solar panels in 2024, double the prior year; one of the world's largest new solar markets; rooftop installs soared as homes and businesses sought cheaper power.","verified":true},{"title":"The solarisation of Pakistan's energy economy","publisher":"Ember","year":2026,"url":"https://ember-energy.org/latest-insights/the-solarisation-of-pakistans-energy-economy/","finding":"Fetched: 18% of Pakistani households have solar; residential 44% of FY25 deployment; solar tubewells 61% of tubewells by 2025; 47 GW cumulative exports to Pakistan by June 2025. Also notes generous net metering and a tax regime that kept import costs low, so government policy was not absent.","verified":true}]},{"id":"MK03","side":"for","kind":"argument","angle":"markets","strength":4,"title":"Early adopters pushed solar and batteries down the curve","claim":"Solar module prices fell about 20 percent with every doubling of cumulative capacity, from $106 per watt in 1976 to $0.38 in 2019, a 99.6 percent drop; lithium-ion cells fell from about $9,200 per kWh in 1991 to about $78 in 2024, roughly 19 percent per doubling. Every doubling was bought by individuals and firms who paid more than the technology was worth; their purchases are what moved the curve for everyone after them.","say":"The curve is real. But policy bought much of the volume: Germany's feed-in tariff guaranteed solar buyers a return, and Nemet finds experience alone only weakly explains the main cost drivers. Early adopters bought a guarantee.","detail":"We accept OWID's 20 percent per doubling. The question is who paid for the doublings. Germany's 2000 feed-in tariff guaranteed grid access, priority dispatch and a fixed 20-year tariff, and Germany had roughly five times Japan's PV capacity in 2010 (OW14; that ratio is from memory of IEA PVPS data and not fetched, so keep it out of the speech). Nemet's 2006 abstract says learning from experience only weakly explains plant size, module efficiency and silicon cost, and points to demand and industry structure; his data end before the EEG had effect, so it supports the point about demand, not about Germany. IRENA records an 85 percent fall in utility-scale solar cost 2010 to 2020 and does not itself credit Germany, so we say helped, not caused. Concede that the first decades, 1976 to 2000, ran largely on research funding, space and off-grid buyers, not feed-in tariffs. Early adopters in the large markets were buying into a guaranteed return, not paying a premium on principle.","if_they_push":"Once policy had pulled the price down, individuals rode the curve, as in Pakistan. Riding a curve that policy built is the menu point, not individual impact.","comeback":"Subsidies helped, but the 99.6 percent drop came from buyers choosing panels in market after market, including unsubsidised ones like Pakistan, and from Chinese firms competing on price.","weak":true,"tags":["wright's law","learning curve","solar","batteries","lithium-ion","early adopters","cost decline","20 percent","doubling","demand pull","plant-based milk","f2"],"phrasings":["Subsidies in Germany, Japan and China created that early demand, not consumer virtue.","Learning curves are driven by manufacturing scale and R&D funding, much of it state-backed."],"frames":["F2"],"uses":["OW14"],"notes":"Softened 'policy bought the volume' to 'much of', limited Nemet to the drivers he studied, and flagged that the 1976-2000 doublings predate the EEG. Replaced the if_they_push, which merely restated our point. Best available but a judge may split the credit.","sources":[{"title":"Why did solar panel prices fall so much? (Learning curve)","publisher":"Our World in Data","year":2024,"url":"https://ourworldindata.org/learning-curve","finding":"Solar PV learning rate 20% per doubling; module price $106 to $0.38 per watt (1976 to 2019).","verified":true},{"title":"Beyond the learning curve: factors influencing cost reductions in photovoltaics","publisher":"Energy Policy 34(17) (Nemet)","year":2006,"url":"https://econpapers.repec.org/RePEc:eee:enepol:v:34:y:2006:i:17:p:3218-3232","finding":"Abstract: learning from experience only weakly explains change in plant size, module efficiency and silicon cost; points to technical barriers, industry structure and characteristics of demand. Covers the period before the 2000 EEG took effect; Germany/Japan detail not checked.","verified":true},{"title":"Renewable Power Generation Costs in 2020","publisher":"IRENA","year":2021,"url":"https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2021/Jun/IRENA_Power_Generation_Costs_2020.pdf","finding":"Utility-scale solar PV cost down 85% 2010 to 2020. IRENA does not itself credit Germany's tariff; the link is from learning-curve literature.","verified":true},{"title":"German Renewable Energy Sources Act","publisher":"Wikipedia","year":2024,"url":"https://en.wikipedia.org/wiki/German_Renewable_Energy_Sources_Act","finding":"EEG in force 1 April 2000; guaranteed connection, priority dispatch, 20-year tariff.","verified":true}],"their_sources":[{"title":"Why did solar panel prices fall so much? (Learning curve)","publisher":"Our World in Data","year":2024,"url":"https://ourworldindata.org/learning-curve","finding":"Fetched: solar PV learning rate 20% per doubling; module price fell from $106 to $0.38 per watt, a 99.6% decline (1976 to 2019 data).","verified":true},{"title":"Battery price decline","publisher":"Our World in Data","year":2025,"url":"https://ourworldindata.org/battery-price-decline","finding":"Fetched: lithium-ion cell price about $9,200/kWh in 1991 to about $78 in 2024; about 19% fall per doubling of cumulative production since 1998.","verified":true},{"title":"US retail sales of plant-based milk by numbers","publisher":"AgFunder News (GFI data)","year":2024,"url":"https://agfundernews.com/us-retail-sales-of-plant-based-milk-by-numbers-coconut-is-up-almond-is-down-soy-and-oat-are-flat","finding":"Per search summary: plant-based milk was almost 15% of US retail milk dollar sales in 2023 (GFI/SPINS). Page not fetched.","verified":false}]},{"id":"MK04","side":"for","kind":"argument","angle":"markets","strength":3,"title":"Australians put solar on millions of roofs","claim":"Australian households have installed over 4.5 million rooftop solar systems, around 31 GW, and added 247,000 more already in 2026; rooftop PV is a leading contributor to the grid, with solar at 18 percent of national electricity in 2024, up from 7 percent in 2019. That is millions of separate household decisions, each paid for by the household, now larger than any single power station program.","say":"Millions of households, yes. But Australia's federal Small-scale Renewable Energy Scheme cuts the upfront price of every eligible system through tradeable certificates. The scheme set the price they responded to.","detail":"The Clean Energy Regulator counts 4,562,198 small-scale installations, about 30.9 GW, and Ember has solar at 18 percent of Australian electricity in 2024 (that figure covers all solar, not only rooftop). The same regulator runs the SRES, whose tradeable certificates lower the upfront price of small solar systems; owners usually assign them to an installer for a discount or delayed payment. The regulator's page gives no discount size, so do not quote the roughly 30 percent that Wikipedia reports. Same pattern as California, where the peer effects were measured inside a rebate program (B2). On share of homes: a search summary suggests roughly one in three to two in five households now, so do not argue the old 20 percent figure. Households chose; the scheme wrote the price.","if_they_push":"We concede the number of roofs. A rebate that makes a roof pay back is policy producing the tonnes; take it away and the menu changes.","comeback":"The subsidy existed, but 4.5 million households chose to act on it, and Australians installed far more than the scheme required; markets moved faster than any mandate.","weak":false,"tags":["australia","rooftop solar","households","4.5 million","31 gw","installations","behind the meter","solar share","18 percent","clean energy regulator","bottom-up","f2"],"phrasings":["Australian rooftop solar is driven by the federal Small-scale Renewable Energy Scheme and state feed-in tariffs; it is a policy success.","You said over 30 percent of homes; the regulator's own table gives about 20 percent of all dwellings."],"frames":["F2"],"uses":[],"notes":"Removed the unsupported 30 percent discount and the awkward 'each was paid to by' phrasing; say now has no number. Also noted the 'over 30 percent of homes' dispute should not be argued from the old 20 percent figure.","sources":[{"title":"Postcode data for small-scale installations","publisher":"Clean Energy Regulator (Australia)","year":2026,"url":"https://cer.gov.au/RET/Forms-and-resources/Postcode-data-for-small-scale-installations","finding":"As at 30 Sep 2026, 4,562,198 small-scale solar PV installations, about 30.9 GW.","verified":true},{"title":"What is the Small-scale Renewable Energy Scheme?","publisher":"Clean Energy Regulator (Australia)","year":2024,"url":"https://www.cleanenergyregulator.gov.au/node/2291","finding":"SRES gives tradeable certificates that lower the purchase price of small solar systems, heat pumps and solar water heaters. Re-fetched this session: system owners often assign certificates to an agent for a discount or delayed cash payment; page states no discount percentage and no share of homes.","verified":true},{"title":"Small-scale Renewable Energy Scheme","publisher":"Wikipedia (citing the Clean Energy Regulator)","year":2026,"url":"https://en.wikipedia.org/wiki/Small-scale_Renewable_Energy_Scheme","finding":"Wikipedia: 'The Clean Energy Regulator estimates this discount reduces installation costs by approximately 30%.'","verified":true,"note":"Fetched Wikipedia; confirms the source finding. The regulator's own page was not re-opened; the card rightly avoids quoting it."},{"title":"Global Electricity Review 2025: The Big Picture","publisher":"Ember","year":2025,"url":"https://ember-energy.org/latest-insights/global-electricity-review-2025/the-big-picture/","finding":"Australia solar share 18% in 2024, up from 7% in 2019.","verified":true},{"title":"Peer Effects in the Diffusion of Solar Photovoltaic Panels","publisher":"Marketing Science (Bollinger & Gillingham)","year":2012,"url":"https://doi.org/10.1287/mksc.1120.0727","finding":"Not opened: INFORMS page returned 403.","verified":false,"note":"DOI redirects to pubsonline.informs.org which blocked access; no mirror tried. Peer-effect finding remains unverified here."}],"their_sources":[{"title":"Postcode data for small-scale installations","publisher":"Clean Energy Regulator (Australia)","year":2026,"url":"https://cer.gov.au/RET/Forms-and-resources/Postcode-data-for-small-scale-installations","finding":"Fetched: as at 30 Sep 2026, 4,562,198 small-scale solar PV installations totalling about 30.9 GW. The page does not give a percent of dwellings, so the '30% of homes' claim is not confirmed here."
