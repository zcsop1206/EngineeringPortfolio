ion dollars, over a hundred times the Earth Fund's grants to date (OW18).","comeback":"Your two trillion is private capital chasing returns, not government. And Beyond Coal's lawyers enforced rules the state left idle; without private money the law sat there.","weak":false,"tags":["philanthropy","bezos","earth fund","bloomberg","beyond coal","billionaire","donor","foundation","gates","charity","private money","coal plants retired","sierra club","chequebook","f3","f5","f1"],"phrasings":["Bloomberg's money shut down two-thirds of America's coal plants. No law did that.","Bezos put 10 billion dollars into the climate. That is one individual.","Philanthropists move faster and further than governments.","Private donors are doing what Congress will not.","One billionaire outspent the EPA on coal."],"frames":["F3","F5","F1"],"uses":["CL2","OW14","OW18","M5"],"notes":"Re-fetched 8 Nov 2026: Bezos Earth Fund (10 billion committed, 2.4 billion granted, 371 grants), Canary Media 1 December 2025 (390 plants, 50 million dollar launch gift, 60,000 deaths claim is the campaign's own, Oklahoma Supreme Court win in 2018 after which OG&E upgraded anyway, Minnesota Xcel, 94 percent of new capacity), EIA (ageing fleet, gas and renewables, 11.0 GW a year), EPA MATS (16 February 2012, over 25 MW, 2026 partial repeal), ClimateWorks 22 June 2026 (2.1 percent, 6 billion, 2.2 trillion in 2025), IEA (3 trillion, 2 trillion clean) and Wikipedia IRA (391 billion CBO/JCT; the same page also gives 783 billion, unreconciled) all confirmed. Bloomberg Philanthropies returns 403, so the campaign's own count comes from Canary Media. Whether the 6 billion covers foundations only is not stated. Cite CBO as 'roughly 400 billion'. The for_comeback is now the private-capital point, which hits the say line's two trillion directly; if_they_push answers it with OW14 and OW18. Adjacent existing cards: MK13 (entrepreneurs beat governments) and MK10 (divestment).","sources":[{"title":"Can the war on coal be won?","publisher":"Canary Media","year":2025,"url":"https://www.canarymedia.com/articles/clean-energy/can-the-war-on-coal-be-won","finding":"Fetched. Beyond Coal lawyers argued retirements on ratepayer-cost grounds before the Oklahoma commission and won at the Oklahoma Supreme Court in 2018; worked with Minnesota regulators on Xcel's plan; wind, solar and batteries were 94 percent of new US capacity in 2024.","verified":true},{"title":"Coal-fired generating capacity retirements (Today in Energy)","publisher":"US Energy Information Administration","year":2022,"url":"https://www.eia.gov/todayinenergy/detail.php?id=50838","finding":"Fetched, 11 January 2022. Retirements attributed to the ageing fleet and 'increasing competition from natural gas and renewables'; 11.0 GW a year retired 2015 to 2020.","verified":true},{"title":"Mercury and Air Toxics Standards","publisher":"US EPA","year":2025,"url":"https://www.epa.gov/stationary-sources-air-pollution/mercury-and-air-toxics-standards","finding":"Fetched. Final MATS announced 16 February 2012 for coal- and oil-fired units over 25 MW; 2024 amendments partly repealed February 2026.","verified":true},{"title":"Bezos Earth Fund","publisher":"Bezos Earth Fund","year":2026,"url":"https://www.bezosearthfund.org/","finding":"Fetched. 2.4 billion dollars granted of 10 billion committed.","verified":true},{"title":"Giving to climate change mitigation has doubled since 2020, but critical gaps persist","publisher":"ClimateWorks Foundation","year":2026,"url":"https://www.climateworks.org/blog/giving-to-climate-change-mitigation-has-doubled-since-2020-but-critical-gaps-persist/","finding":"Fetched, 22 June 2026. Climate giving reached about 2.1 percent of total philanthropic giving in 2024; mitigation funding about 6 billion dollars; the post itself cites 2.2 trillion dollars of clean energy investment in 2025.","verified":true},{"title":"World Energy Investment 2024: Overview and key findings","publisher":"International Energy Agency","year":2024,"url":"https://www.iea.org/reports/world-energy-investment-2024/overview-and-key-findings","finding":"Fetched. Global energy investment above 3 trillion dollars in 2024, with 2 trillion going to clean energy technologies and infrastructure.","verified":true},{"title":"Inflation Reduction Act","publisher":"Wikipedia (citing CBO and JCT)","year":2025,"url":"https://en.wikipedia.org/wiki/Inflation_Reduction_Act","finding":"Fetched. CBO/JCT score of 391 billion dollars for energy and climate provisions; later estimates higher.","verified":true}],"their_sources":[{"title":"Bezos Earth Fund","publisher":"Bezos Earth Fund","year":2026,"url":"https://www.bezosearthfund.org/","finding":"Fetched. 10 billion dollars committed; about 2.4 billion granted across 371 grants.","verified":true},{"title":"Can the war on coal be won?","publisher":"Canary Media","year":2025,"url":"https://www.canarymedia.com/articles/clean-energy/can-the-war-on-coal-be-won","finding":"Fetched, 1 December 2025. Utilities have retired or committed to retire 390 coal plants, leaving under a third of the original fleet; Bloomberg gave 50 million dollars to launch Beyond Coal; campaign claims over 60,000 premature deaths avoided.","verified":true},{"title":"Beyond Coal","publisher":"Bloomberg Philanthropies","year":2025,"url":"https://www.bloomberg.org/environment/moving-beyond-carbon/beyond-coal/","finding":"Page returned 403. Search excerpts of Bloomberg releases give '318 of 530' (2020) and later '381 of 530, 72 percent'; not seen on a fetched page.","verified":false}],"routes":[{"type":"reframe","say":"Beyond Coal retires plants by winning at utility commissions and in court. A billionaire funding regulatory proceedings is policy with a private sponsor."},{"type":"outweigh","say":"Grant every grant. Climate philanthropy is about two percent of giving; clean energy investment, steered by mandates and credits, is two trillion dollars a year."},{"type":"deny","say":"EIA credits coal retirements to an ageing fleet and cheap gas and renewables; the 2012 mercury standards hit the same plants. The campaign counts plants that would have closed anyway."},{"type":"fallacy","say":"Claiming credit for 390 closures is not proof of causing them. Coal was losing to gas on price at the same time."}]},{"id":"GL01","side":"for","kind":"argument","angle":"communities","strength":4,"title":"Nepal's villages doubled the forest, not the state","claim":"Where the state is weak, communities act. Nepal's forest cover almost doubled from 26 percent in 1992 to 45 percent in 2016 after villagers took over degraded national forest; over 22,000 community forest groups now manage 2.3 million hectares. A Nature Sustainability study found community management cut deforestation 37 percent relative to similar areas. Chipko began the same way in 1973, with village women hugging trees to stop contractors.","say":"Nepal's forests came back after the 1993 Forest Act let rangers hand national forest to community groups. The communities did the work; the law gave them the forest and the right to keep it.","detail":"NASA's own account of the regrowth names the 1993 legislation that allowed forest rangers to hand over national forests to community forest groups; the groups are legal bodies created under that Act, so by our definitions they are neither individuals nor an absence of government (F5, F2). Oldekop's 37 percent is a relative reduction measured inside Nepal, under a programme the state created, so it compares one policy design, devolution, with another. Chipko's measured outcome was also a policy: in 1980 Indira Gandhi's government banned commercial felling in the Himalayan forests for fifteen years. For scale, Brazil's enforcement plan cut Amazon clearing 84 percent in eight years (OW12). The pattern is F3: people asked, and what changed the forest was a rule.","if_they_push":"A weak state is still the state that signs the handover. Nepal's villagers had been living beside those forests for generations; the cover doubled only after the law changed who held them.","comeback":"The law only got out of the way. The planting, patrolling and sanctions were done by villagers for free, and that is where the forest came from.","weak":false,"tags":["nepal","community forestry","forest user groups","chipko","gaura devi","reni","weak state","global south","forest cover doubled","village","bottom-up","himalaya","oldekop","nasa","f2","f3","f5"],"phrasings":["Nepal doubled its forest cover and it was villagers, not the government, who did it.","In poor countries the state cannot act, so communities protect the forest themselves.","Chipko was women hugging trees. No minister did that.","Twenty-two thousand community forest groups in Nepal manage a third of the country's forest.","Community forestry cut deforestation by 37 percent in Nepal."],"frames":["F2","F3","F5"],"uses":["OW12"],"notes":"Re-fetched 8 Nov 2026: NASA confirms 26 to 45 percent (1992 to 2016), the 1993 act letting rangers hand over national forests, over 22,000 groups, nearly 2.3 million hectares, 3 million households, Devithan 12 to 92 percent, regrowth mainly natural regeneration. Manchester confirms 37 and 4.3 percent, 18,000 forests, 1.36 million households and 13 percent of world forests, but does not state the comparison group, so that rebuttal source is partial and the detail is softened. Wikipedia confirms 1973, Reni 1974, and the 1980 fifteen-year ban; no 1,000 metre threshold, do not use it. Two routes were both 'reframe'; the Chipko route is now a deny. Baseline varies by source (a Nepali outlet gives about 29 percent in the 1990s). A judge may accept that devolution is policy but still credit the villagers with the labour, so lead with the handover and concede the labour. Adjacent existing card: MK07 (Ostrom, local users govern commons).","sources":[{"title":"How Nepal Regenerated Its Forests","publisher":"NASA Earth Observatory","year":2022,"url":"https://science.nasa.gov/earth/earth-observatory/how-nepal-regenerated-its-forests-150937/","finding":"The 1993 legislation allowed Nepal's forest rangers to hand over national forests to community forest groups; regrowth was mainly natural regeneration after communities began managing.","verified":true},{"title":"Chipko movement","publisher":"Wikipedia","year":2025,"url":"https://en.wikipedia.org/wiki/Chipko_movement","finding":"Re-fetched. 'A ban on felling of trees in the Himalayan regions for fifteen years in 1980' under Indira Gandhi, to last until the green cover was fully restored. No altitude threshold on the page.","verified":true},{"title":"New research shows community forest management reduces both deforestation and poverty","publisher":"University of Manchester (Oldekop et al.)","year":2019,"url":"https://www.manchester.ac.uk/about/news/new-research-shows-community-forest-management-reduces-both-deforestation-and-poverty/","finding":"Re-fetched. 37 percent relative reduction in deforestation, 4.3 percent in poverty, more than 18,000 community forests, 1.36 million households, and 'local communities now legally manage approximately 13% of the world's forests'. The page does not describe the comparison group or say who promoted the programmes.","verified":"partial"}],"their_sources":[{"title":"How Nepal Regenerated Its Forests","publisher":"NASA Earth Observatory","year":2022,"url":"https://science.nasa.gov/earth/earth-observatory/how-nepal-regenerated-its-forests-150937/","finding":"Forest cover almost doubled from 26 percent to 45 percent between 1992 and 2016; community forests occupy nearly 2.3 million hectares managed by over 22,000 groups comprising 3 million households; the Devithan forest went from 12 to 92 percent cover.","verified":true},{"title":"New research shows community forest management reduces both deforestation and poverty","publisher":"University of Manchester (Oldekop et al., Nature Sustainability)","year":2019,"url":"https://www.manchester.ac.uk/about/news/new-research-shows-community-forest-management-reduces-both-deforestation-and-poverty/","finding":"Community forest management led to a 37 percent relative reduction in deforestation and 4.3 percent relative reduction in poverty, across 18,000 community forests and census data on 1.36 million households.","verified":true},{"title":"Chipko movement","publisher":"Wikipedia","year":2025,"url":"https://en.wikipedia.org/wiki/Chipko_movement","finding":"The movement started in 1973; in 1974 Gaura Devi led 27 women to confront loggers at Reni and they hugged the trees; the contractors left after four days.","verified":true}],"routes":[{"type":"reframe","say":"The community forest user group is a creature of Nepal's 1993 Forest Act. A legal body managing state land under a government plan is policy, not individual action."},{"type":"turn","say":"Their best example says a forest doubles when the law hands it to the people who live there. That is a policy result, and it argues for better policy."},{"type":"outweigh","say":"Nepal is real. So is Brazil: enforcement, satellites and embargoes cut Amazon clearing 84 percent in eight years, over an area many times Nepal's forest."},{"type":"deny","say":"Chipko did not end with women in the forest. It ended with a fifteen-year government felling ban in 1980. The decision that kept the trees was the state's."}]},{"id":"GL02","side":"for","kind":"argument","angle":"communities","strength":4,"title":"Indigenous peoples protect 80 percent of biodiversity","claim":"Indigenous peoples are about 6 percent of the world's population yet protect 80 percent of its remaining biodiversity. Garnett and colleagues found Indigenous peoples hold or manage more than a quarter of the world's land, overlapping 40 percent of protected areas, and two thirds of that land is essentially natural. Communities, not ministries, keep the forests standing.","say":"The 80 percent figure has no basis; a Nature comment traced it to misquoted sources. What measurably protects Indigenous forest is a legal title, and only the state issues titles.","detail":"Fernandez-Llamazares and co-authors wrote in Nature in September 2024 that there is no basis for the 80 percent claim; it was cited about 350 times without a source that supports it. Concede the real finding: Indigenous peoples hold or manage more than a quarter of the land and two thirds of it is essentially natural (Garnett 2018). Then ask what protects it. In the Peruvian Amazon, Blackman and colleagues found that awarding formal title to Indigenous communities cut clearing by more than three quarters and disturbance by two thirds in the two years around titling. Title is a government act; Garnett's own authors say recognising rights and institutions is essential. The stewardship is theirs; the protection that holds against loggers is the law behind it (F2, F6). Brazil's enforcement plan is the same lesson at national scale (OW12).","if_they_push":"If they say the communities were protecting the forest long before any title: yes, and the title is what stopped outsiders cutting it. Stewardship without legal recognition is what protected areas were imposed over, as Garnett's authors note.","comeback":"Drop the 80 percent and the point stands: a quarter of the planet stays natural because communities live there, and titles only recognise what they already do.","weak":false,"tags":["indigenous","80 percent","biodiversity","garnett","quarter of land","stewardship","first nations","amazon","land rights","protected areas","traditional knowledge","nature 2024","f2","f6"],"phrasings":["Indigenous peoples are five percent of the population and protect eighty percent of biodiversity.","Indigenous lands hold more biodiversity than government parks.","A quarter of the world's land is managed by Indigenous communities and it is the healthiest land there is.","Governments put parks on top of Indigenous land; the Indigenous people were already protecting it.","Community stewardship beats protected areas."],"frames":["F2","F6"],"uses":["OW12"],"notes":"Re-fetched 8 Nov 2026: Phys.org confirms nearly 350 uses, 186 in peer-reviewed journals, most attributed to a 2008 World Bank report, 'impossible to estimate a percentage of something that cannot be quantified', and that Indigenous peoples 'play central roles'. Mongabay confirms more than a quarter of land, 38 million square kilometres, 87 countries, 40 percent of protected areas, two thirds essentially natural, rights 'essential'. World Bank confirms 476.6 million and 6.2 percent and does not state the 80 percent claim. PMC confirms Blackman's effects and window. The deny route called the Nature piece a 'correction'; it is a Comment, now worded so. The 'Indigenous representatives' among the authors was not on the fetched page and is removed. Blackman's analysis sample is 51 communities titled after 2001 and the authors say the effect is short-term and context specific; say 'in the two years around titling', never 'permanently'. Attack the statistic, not the stewardship, or the judge turns. No close duplicate; MK08 (private land trusts) is adjacent.","sources":[{"title":"For decades, we've been told 80% of the world's biodiversity is found on Indigenous lands, but it's wrong","publisher":"Phys.org / The Conversation (Fernandez-Llamazares et al., Nature 633, 32-35)","year":2024,"url":"https://phys.org/news/2024-09-decades-weve-told-world-biodiversity.amp","finding":"The figure is wrong; its sources are misquoted or poorly summarised and biodiversity in its true sense cannot be counted; the authors still say Indigenous peoples play central roles in protecting biodiversity.","verified":true},{"title":"Titling indigenous communities protects forests in the Peruvian Amazon","publisher":"PNAS 114(16) (Blackman, Corral, Lima, Asner), via PubMed Central","year":2017,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5402456","finding":"Re-fetched. Titling 'reduces clearing by more than three-quarters' and 'forest disturbance by roughly two-thirds' over 'a 2-y window spanning the year title is awarded and the year afterward'; more than 1,200 communities titled since the mid-1970s, with 51 titled after 2001 in the analysis; data 2000 to 2005, so effects shown 'at least in the short term'; no instrument, so confounding not fully controlled.","verified":true},{"title":"Indigenous peoples control one-quarter of world's land surface","publisher":"Mongabay (Garnett et al.)","year":2018,"url":"https://news.mongabay.com/2018/07/indigenous-peoples-control-one-quarter-of-worlds-land-surface-two-thirds-of-that-land-is-essentially-natural/","finding":"Authors describe recognising Indigenous rights to land as essential; protected areas have been imposed over Indigenous lands without consent.","verified":true}],"their_sources":[{"title":"Indigenous peoples control one-quarter of world's land surface, two-thirds of that land is essentially natural","publisher":"Mongabay (reporting Garnett et al., Nature Sustainability)","year":2018,"url":"https://news.mongabay.com/2018/07/indigenous-peoples-control-one-quarter-of-worlds-land-surface-two-thirds-of-that-land-is-essentially-natural/","finding":"Indigenous peoples have ownership, use or management rights over more than a quarter of the world's land, close to 38 million square kilometres across 87 countries, overlapping about 40 percent of terrestrial protected areas; about two thirds of Indigenous lands are essentially natural.","verified":true},{"title":"Indigenous Peoples","publisher":"World Bank","year":2025,"url":"https://www.worldbank.org/en/topic/indigenouspeoples","finding":"An estimated 476.6 million Indigenous Peoples, 6.2 percent of the global population; they manage or hold tenure rights to roughly one fifth of the world's surface area and own or manage one third of global ecosystems. The page does not state the 80 percent biodiversity claim.","verified":true},{"title":"For decades, we've been told 80% of the world's biodiversity is found on Indigenous lands, but it's wrong","publisher":"Phys.org / The Conversation (Fernandez-Llamazares et al., Nature)","year":2024,"url":"https://phys.org/news/2024-09-decades-weve-told-world-biodiversity.amp","finding":"The 80 percent figure was used nearly 350 times in public documents, 186 of them in peer-reviewed journals, most often attributed to a 2008 World Bank report. This is the source of the claim's spread, which the For side will have picked up.","verified":true}],"routes":[{"type":"deny","say":"A 2024 Nature comment found the 80 percent figure has no source and that biodiversity cannot be divided into countable units. Their headline number is a citation error."},{"type":"reframe","say":"A quarter of the land, two thirds of it natural: real. The thing that keeps it natural against loggers is legal title and recognised rights, which only states grant."},{"type":"outweigh","say":"In Peru, a state title cut clearing by three quarters in two years. Stewardship was already there; the policy is what changed the measured outcome."},{"type":"fallacy","say":"Living on healthy land is not the same as causing it to be healthy. Much of that land is remote; the claim mistakes where biodiversity is for what protects it."}]},{"id":"GL03","side":"for","kind":"argument","angle":"communities","strength":3,"title":"Waste pickers recycle more than city systems","claim":"Informal waste pickers do the recycling that governments fail to do. In Brazil, catadores handle 89 percent of the municipal waste returned to industry as raw material. Cairo's Zabbaleen recycle up to 80 percent of what they collect, against 20 to 25 percent for Western companies, and the foreign firms Cairo hired in 2003 were only required to recycle 20 percent. In India the informal sector does about 80 percent of plastic collection. Poor individuals, not policy, close the loop.","say":"Pickers handle most of what Brazil recycles, but Brazil recycles only about 4 percent of what it could. Where a deposit law exists, nearly every container comes back. The rule sets the rate.","detail":"Their numbers are shares of a small pile. The Conversation's own article says only 4 percent of what could be recycled in Brazil actually is, against about 16 percent in comparable countries. Germany's mandatory deposit, decided in 2003 and nationwide from 2006, produces a return rate above 96 percent and about 20 billion containers a year. The Zabbaleen case cuts our way too: the collapse came when a government decision in 2003 handed collection to firms obliged to recycle only 20 percent, and the 2009 pig cull was a ministry order. Policy wrote both the good and the bad outcome. Brazil's 2010 national waste law is reported to bring picker cooperatives into municipal collection (the law page itself did not load), which is the state building the menu (F2). Ireland's bag levy cut bag use about 90 percent in a year (OW15): a price does what conscience and poverty together did not.","if_they_push":"If they say the 4 percent is the government's failure, not the pickers': agreed, and that concedes the rate is set by policy, which is the motion. If they say pickers would do more left alone: Cairo left the Zabbaleen alone for decades and still signed the 2003 contracts. Scale came from deposit laws, producer responsibility and collection contracts, all policy.","comeback":"The 4 percent is the government's failure, not the pickers'. Every tonne that is recycled in Brazil went through a picker's hands; the state contributed the landfill.","weak":false,"tags":["waste pickers","catadores","zabbaleen","cairo","brazil","india","ragpickers","recycling","informal sector","plastic","landfill","circular economy","kabadiwala","global south","f2","f1"],"phrasings":["Brazil's catadores are responsible for ninety percent of what the country recycles.","Cairo's garbage people recycle eighty percent; Western companies manage twenty.","India's ragpickers collect most of the plastic that gets recycled.","Informal waste pickers do more for recycling than any municipal programme.","When Cairo hired multinationals the recycling rate went down."],"frames":["F2","F1"],"uses":["OW15"],"notes":"Re-fetched 8 Nov 2026: The Conversation confirms 89 percent, 35,700 in cooperatives, up to 500,000 informal, 'only 4% of what could be recycled actually is' (Abrelpe) and 16 percent for Chile, Argentina, South Africa and Turkey. Wikipedia Zabbaleen confirms up to 80 percent, 20 to 25 percent for Western firms, 50 million dollar contracts to three multinationals required to recycle 20 percent, 50,000 to 70,000 people, Agriculture Ministry pig cull April 2009, trash piling up after. India Water Portal confirms 80 percent and over 10,000 pickers per city. DPG confirms more than 96 percent, about 20 billion containers, 2003 and 1 May 2006. The UNEP law page returns 403. The old say said '4 percent of its waste'; the source says 4 percent of what could be recycled, now corrected. 'Sixty years' in if_they_push was unsourced and is now 'decades'. TOMRA's 98 percent is a vendor figure; use DPG's 96. A judge may see the deposit comparison as rich country versus poor country rather than policy versus individuals. Adjacent existing card: PF09 (recycling policy shipped the waste to China).","sources":[{"title":"In Brazil, the future of environmental sustainability needs a strong ally: collectors of recyclable materials","publisher":"The Conversation","year":2023,"url":"https://theconversation.com/in-brazil-the-future-of-environmental-sustainability-needs-a-strong-ally-collectors-of-recyclable-materials-200379","finding":"In Brazil only 4 percent of what could be recycled actually is, citing Abrelpe; Chile, Argentina, South Africa and Turkey average 16 percent.","verified":true},{"title":"Twenty years of the German one-way deposit system: a success story","publisher":"DPG Deutsche Pfandsystem GmbH","year":2023,"url":"https://dpg-pfandsystem.de/en/the-one-way-deposit-system/useful-information/press-releases/twenty-years-of-the-german-one-way-deposit-system-a-success-story.html","finding":"A return rate of more than 96 percent; around 20 billion containers returned every year; mandatory deposit introduced 2003, take-back obligation from 1 May 2006.","verified":true},{"title":"Zabbaleen","publisher":"Wikipedia (citing Fahmi and Sutton; Slackman, NYT 2009)","year":2025,"url":"https://en.wikipedia.org/wiki/Zabbaleen","finding":"In 2003 Cairo awarded contracts to three multinationals required to recycle only 20 percent; the Agriculture Ministry ordered the pig cull in April 2009 and trash piled up in Cairo's streets afterwards.","verified":true},{"title":"Law No. 12.305, National Policy on Solid Waste Management","publisher":"UNEP Law and Environment Assistance Platform (FAOLEX)","year":2010,"url":"https://leap.unep.org/en/countries/br/national-legislation/law-no-12305-national-policy-solid-waste-management","finding":"Search summaries say the law mandates the social and economic inclusion of waste pickers through cooperatives and names them priority partners in selective collection; the page itself returned 403 and was not read.","verified":false}],"their_sources":[{"title":"In Brazil, the future of environmental sustainability needs a strong ally: collectors of recyclable materials","publisher":"The Conversation","year":2023,"url":"https://theconversation.com/in-brazil-the-future-of-environmental-sustainability-needs-a-strong-ally-collectors-of-recyclable-materials-200379","finding":"Collectors are responsible for 89 percent of municipal solid waste returned to industries as raw material; 35,700 collectors are in cooperatives and as many as 500,000 work informally.","verified":true},{"title":"Zabbaleen","publisher":"Wikipedia (citing Fahmi and Sutton 2006, 2010)","year":2025,"url":"https://en.wikipedia.org/wiki/Zabbaleen","finding":"The Zabbaleen recycle up to 80 percent of the waste they collect; most Western garbage companies recycle about 20 to 25 percent; in 2003 Cairo awarded 50 million dollar contracts to three multinationals required to recycle only 20 percent; population 50,000 to 70,000.","verified":true},{"title":"Waste pickers in India's informal sector contribute up to 80% of plastic waste collection","publisher":"India Water Portal (Alliance to End Plastic Waste report)","year":2023,"url":"https://www.indiawaterportal.org/articles/waste-pickers-indias-informal-sector-contribute-80-plastic-waste-collection","finding":"In India 80 percent of plastic collection relies on the informal sector, with an average of over 10,000 waste pickers per city.","verified":true}],"routes":[{"type":"deny","say":"Eighty-nine percent of Brazil's recycling is 89 percent of the 4 percent that gets recycled at all. The measured outcome is a country that recycles almost nothing."},{"type":"outweigh","say":"Germany's deposit law brings back more than 96 percent of single-use containers, 20 billion a year. No informal system anywhere reaches that."},{"type":"turn","say":"Cairo shows policy's power both ways: a 2003 contract and a 2009 pig cull wrecked a working system. If a ministry can break it, a ministry can build it."},{"type":"reframe","say":"Pickers sort what reaches them. Whether a bottle is worth picking is set by deposits, producer fees and landfill rules, which is policy."}]},{"id":"GL04","side":"for","kind":"argument","angle":"communities","strength":3,"title":"One person planted a forest","claim":"Jadav Payeng planted a 550 hectare forest on a bare Brahmaputra sandbar by himself over thirty years; it now holds tigers, rhinos and a visiting elephant herd. Wangari Maathai's Green Belt Movement has planted more than 51 million trees in Kenya and trained 30,000 women. Charlie Burrell and Isabella Tree turned the failing 3,500 acre Knepp farm into Britain's best known rewilding site. Individuals plant forests; governments hold conferences.","say":"Payeng's forest began as a Golaghat forestry department plantation that was later abandoned. Maathai took her movement into parliament and a ministry. Knepp draws stewardship payments. Each one leaned on the state.","detail":"Wikipedia's Molai forest entry records a 200 hectare planting on the site by the social forestry division of Golaghat district, abandoned in 1983, after which Payeng tended the forest alone; the page calls him a forestry worker and does not say he was hired for the scheme. Maathai founded the Green Belt Movement in 1977 as an organisation, not a lone act (F5), then won a parliamentary seat in December 2002 and served as Assistant Minister for Environment from January 2003 to November 2005: her own route to impact ran through the state (F3). Knepp received Countryside Stewardship funding in 2001 and Higher Level Stewardship in 2010; Rewilding Britain describes those payments as the more substantial part of its farm income. Honour the people, then show the measured scale: Brazil's enforcement plan cut Amazon clearing by 84 percent, from 27,772 to 4,571 square kilometres (OW12), and Ontario shut every coal plant (M1).","if_they_push":"If they say the state abandoned Payeng's plantation and he saved it: agreed, he did, and 550 hectares in thirty years is the ceiling of one pair of hands. Nepal's law turned over 2.3 million hectares (GL01).","comeback":"The department walked away and one man stayed for thirty years. The subsidy did not plant Knepp's oaks; a family's decision did. Policy was the background, people were the cause.","weak":false,"tags":["jadav payeng","molai forest","forest man","wangari maathai","green belt movement","51 million trees","knepp","rewilding","isabella tree","tree planting","one person","assam","kenya","reforestation","f5","f3","f1"],"phrasings":["One man in Assam planted a forest bigger than Central Park, alone.","Wangari Maathai's women planted fifty-one million trees.","Knepp was a bankrupt farm until one family rewilded it, no government plan.","Individuals plant trees. Governments plant announcements.","The Forest Man of India did more than the forest department."],"frames":["F5","F3","F1"],"uses":["OW12","M1"],"notes":"Re-fetched 8 Nov 2026: Jadav Payeng page (1,360 acres or 550 ha, planting from 1979, Padma Shri 2015, authorities aware in 2008, no mention of Golaghat); Molai forest page (200 hectare Golaghat social forestry planting abandoned in 1983, forest 'single-handedly attended to by Payeng for 30 years', no labourer detail); Green Belt Movement (1977, 51 million trees, 30,000 women; page flagged for weak citations); Maathai (Tetu 27 December 2002 with 98 percent, Assistant Minister January 2003 to November 2005); Knepp (3,500 acres, 1983, Countryside Stewardship 2001, letter December 2002, HLS 2010); Rewilding Britain (subsidies, 'more substantially' Countryside Stewardship, tourism about 800,000 pounds). Removed from the detail: the Uhuru Park and Karura Forest fights (not on the fetched page) and a wrong area comparison (550 ha is about 2 square miles, not one). The deny route no longer says he was 'part of that scheme' in 1979; the page only supports the abandoned planting. Knepp's annual payment is not public; say 'substantial'. A judge who admires Payeng may dislike the deny route; the outweigh route is safer. Adjacent existing card: MK08 (private land trusts outrun parks agencies).","sources":[{"title":"Molai forest","publisher":"Wikipedia","year":2025,"url":"https://en.wikipedia.org/wiki/Molai_forest","finding":"After an initial 200 hectare planting by the social forestry division of Golaghat district was abandoned in 1983, the forest was single-handedly attended to by Payeng for 30 years; it now covers about 550 hectares.","verified":true},{"title":"Wangari Maathai","publisher":"Wikipedia","year":2025,"url":"https://en.wikipedia.org/wiki/Wangar%C4%A9_Maathai","finding":"Won the Tetu seat on 27 December 2002 with about 98 percent of the vote; appointed Assistant Minister for Environment and Natural Resources in January 2003 and served until November 2005; founded the Green Belt Movement in 1977.","verified":true},{"title":"Case study: Knepp Estate","publisher":"Rewilding Britain","year":2021,"url":"https://rewildingbritain.org.uk/blog/case-study-knepp-estate","finding":"Some farm income comes from subsidies including the Basic Payment Scheme and, more substantially, Countryside Stewardship (previously Higher Level Stewardship); nature tourism turns over about 800,000 pounds a year.","verified":true},{"title":"Background","publisher":"Knepp Estate","year":2024,"url":"https://knepp.co.uk/background","finding":"In 2001 Knepp received Countryside Stewardship funding to restore the Repton park; in 2010 the Knepp Wildland project received Higher Level Stewardship funding.","verified":true}],"their_sources":[{"title":"Jadav Payeng","publisher":"Wikipedia","year":2025,"url":"https://en.wikipedia.org/wiki/Jadav_Payeng","finding":"The Molai forest near Kokilamukh, Jorhat, encompasses about 1,360 acres (550 ha); he began planting on the sandbar in 1979; Padma Shri in 2015; authorities learned of the forest in 2008.","verified":true},{"title":"Green Belt Movement","publisher":"Wikipedia","year":2025,"url":"https://en.wikipedia.org/wiki/Green_Belt_Movement","finding":"Since Wangari Maathai started the movement in 1977, more than 51 million trees have been planted and more than 30,000 women trained in forestry.","verified":true},{"title":"Background","publisher":"Knepp Estate","year":2024,"url":"https://knepp.co.uk/background","finding":"Charlie Burrell took over the 3,500 acre estate in 1983; in December 2002 he sent a Letter of Intent for rewilding to Natural England; astonishing wildlife successes followed.","verified":true}],"routes":[{"type":"deny","say":"Payeng did not start from bare sand alone: Golaghat's social forestry division planted 200 hectares on the site, abandoned it in 1983, and he tended what the state had begun."},{"type":"reframe","say":"Maathai became an Assistant Minister for Environment. Knepp is paid by Countryside Stewardship. The movement and the estate both ran on policy."},{"type":"outweigh","say":"Honour the 550 hectares. Brazil's enforcement plan protected millions: clearing fell from 27,772 to 4,571 square kilometres in eight years."},{"type":"fallacy","say":"One remarkable person proves that it is possible, not that it is typical. The motion asks what has more impact overall, not what makes a better documentary."}]},{"id":"GL05","side":"for","kind":"argument","angle":"communities","strength":4,"title":"Environmentalism itself began with individuals","claim":"Every environmental law traces back to a person. Rachel Carson's Silent Spring in 1962 sold half a million copies and started the modern movement. John Muir's writing gave America its national parks. On the first Earth Day in 1970, 20 million Americans, one in ten, took to the streets, and within the year Congress created the EPA and passed the Clean Air Act. Policy is downstream of individuals.","say":"Carson wrote a book; the EPA banned DDT in 1972. Earth Day marched; Congress created the EPA and passed the Clean Air Act. Their founders asked for policy, and policy is what cleaned the air.","detail":"This is F3 in its purest form. Silent Spring did not remove a gram of DDT from a river; EPA's Administrator cancelled all remaining crop uses on 14 June 1972, effective 31 December, after a court order in January 1971 forced the agency to act. The bald eagle went from 417 nesting pairs in 1963 to more than 71,000 after the ban and decades of legal protection (OW16). Earth Day's own organisers measure its success in laws: the EPA, the Clean Air Act, then the Clean Water Act and Endangered Species Act. Those laws cut the six main pollutants 78 percent while GDP grew (M3, OP1) and return more than 30 dollars of benefit per dollar of cost (OW02). The Montreal Protocol finished what consumer boycotts started (M2). The movement's founders are proof that individuals matter as the input; the motion asks about impact on the environment, and every tonne they are proud of was delivered by a statute (F1, F6).","if_they_push":"If they say none of those laws would exist without the people: agreed, and none of the people would have cut a tonne without the laws. The marchers' demand was policy because they knew where the impact lived.","comeback":"Policy is the tool and people are the hand. Without Carson and the marchers the EPA never exists, so the impact belongs to the individuals who forced it.","weak":false,"tags":["rachel carson","silent spring","ddt","john muir","earth day","1970","20 million","gaylord nelson","epa created","clean air act","founders","movement","history","origins","downstream","f3","f1","f6"],"phrasings":["Rachel Carson wrote a book and the EPA banned DDT.","Earth Day 1970 put twenty million people in the street and the EPA existed by December.","Every environmental law started with an individual who refused to be quiet.","John Muir gave us Yosemite.","Policy follows people; the whole movement proves it."],"frames":["F3","F1","F6"],"uses":["OW16","M3","OP1","OW02","M2"],"notes":"Re-fetched 8 Nov 2026: EARTHDAY.ORG confirms 20 million, 10 percent, the EPA and Clean Air Act (also the National Environmental Education Act and OSH Act) by end of 1970, and Silent Spring 'more than 500,000 copies in 24 countries'. EPA Earth Day snapshot confirms Gaylord Nelson, 20 million, December 1970 and 'no legal or regulatory mechanisms to protect our environment'. EPA DDT history confirms 14 June 1972 cancellation effective 31 December 1972, the grounds, and the January 1971 court order after the EDF suit. Silent Spring's exact sales vary by source. John Muir and the parks are not verified; avoid specifics on Muir. The 78 percent and eagle figures rest on M3, OP1 and OW16. The For side can say the EPA page itself credits Earth Day, so lean on F3 rather than denying the causal chain. Duplicates existing card TC08 (Earth Day 1970 created the EPA) and overlaps CV05 on Carson; keep for the DDT and Earth Day detail.","sources":[{"title":"DDT Regulatory History: A Brief Survey (to 1975)","publisher":"US EPA (archive)","year":1975,"url":"https://www.epa.gov/archive/epa/aboutepa/ddt-regulatory-history-brief-survey-1975.html","finding":"On June 14, 1972 the Administrator announced the final cancellation of all remaining crop uses of DDT, effective December 31, 1972, based on persistence, transport, biomagnification and toxicological effects; a January 1971 court order after an Environmental Defense Fund suit required EPA to issue cancellation notices.","verified":true},{"title":"EPA History: Earth Day","publisher":"US EPA (archived snapshot)","year":2025,"url":"https://19january2025snapshot.epa.gov/history/epa-history-earth-day","finding":"Before 1970 there were no legal or regulatory mechanisms to protect the environment; in December 1970 Congress authorised the creation of the EPA.","verified":true},{"title":"The History of Earth Day","publisher":"EARTHDAY.ORG","year":2024,"url":"https://www.earthday.org/about/the-history-of-earth-day/","finding":"The organisers list the EPA, Clean Air Act, Clean Water Act, Endangered Species Act and other statutes as what the first Earth Day led to.","verified":true}],"their_sources":[{"title":"The History of Earth Day","publisher":"EARTHDAY.ORG","year":2024,"url":"https://www.earthday.org/about/the-history-of-earth-day/","finding":"Earth Day inspired 20 million Americans, 10 percent of the population; by the end of 1970 it led to the creation of the EPA and laws including the Clean Air Act; Silent Spring sold more than 500,000 copies in 24 countries.","verified":true},{"title":"EPA History: Earth Day","publisher":"US EPA (archived snapshot)","year":2025,"url":"https://19january2025snapshot.epa.gov/history/epa-history-earth-day","finding":"Senator Gaylord Nelson created Earth Day in spring 1970; twenty million Americans demonstrated; in December 1970 Congress authorised the creation of a new federal agency, the EPA.","verified":true},{"title":"DDT Regulatory History: A Brief Survey (to 1975)","publisher":"US EPA (archive)","year":1975,"url":"https://www.epa.gov/archive/epa/aboutepa/ddt-regulatory-history-brief-survey-1975.html","finding":"The publication of Rachel Carson's Silent Spring in 1962 stimulated widespread public concern over DDT.","verified":true}],"routes":[{"type":"turn","say":"What did 20 million people on Earth Day ask for? An agency and a law. They got the EPA and the Clean Air Act, and those cut pollutants 78 percent."},{"type":"reframe","say":"Carson's book is the cause of a ban; the ban is the cause of the eagles. The motion asks about impact on the environment, and that step is policy."},{"type":"fallacy","say":"Tracing a law back to a person does not make the person the impact. By that logic the inventor of the pen caused every treaty."},{"type":"outweigh","say":"Concede the founders. Measure the result: six pollutants down 78 percent since 1970, bald eagles from 417 pairs to over 71,000. Statutes did that."}]},{"id":"GL06","side":"for","kind":"argument","angle":"communities","strength":4,"title":"Cape Town's residents halved their water use","claim":"Facing Day Zero in 2018, Cape Town's four million residents cut daily water use from 1.2 billion litres to about 500 million, more than half, in three years. Richer and middle-income suburbs cut 58 and 59 percent. People showered in buckets, shared tips on WhatsApp and shamed their neighbours. The taps stayed on because of individual behaviour, not a desalination plant.","say":"Cape Town's use fell under the city's toughest restrictions: a 50 litre per person cap, punitive tariffs, pressure cuts at the mains and devices on heavy users. Residents complied with rules the city wrote.","detail":"Level 6B took effect on 1 February 2018 and limited each person to 50 litres a day, with a collective target of 450 million litres; the City put a tariff to Council charging exponentially higher rates above 6,000 litres a month, taking a 6,000 litre bill from about R28 to about R146. The City had cut network pressure for over a decade and had fitted about 250,000 water management devices; under 6B the devices were fitted to households above 10,500 litres a month. Professor Neil Armitage of UCT attributes the fall since 2015 largely to pressure reductions, and the number of households using over 20,000 litres a month fell from over 100,000 in December 2016 to about 20,000 a year later: the heaviest users were engineered down, not shamed down. The residents' effort was real and we should say so; the ceiling, the price and the pressure were the City's (F2, F6). Compare Ireland's levy, which cut bag use about 90 percent (OW15): a price changes behaviour faster than conscience.","if_they_push":"If they say the last year's drop came from fear, not rules: the fear had a number on it, 50 litres, and a date, and both were the City's; the heavy users fell from over 100,000 households to about 20,000 under device installs and rising restriction levels before 6B. Compliance is what policy produces when it sets a cap, a price and a device on the meter.","comeback":"Pressure management and tariffs existed before 2017 and use was still 1.2 billion litres. The last year's 400 million litre drop came when people got scared, which is individual.","weak":false,"tags":["cape town","day zero","water","drought","halved","50 litres","south africa","conservation","behaviour change","crisis","showers","buckets","restrictions","tariffs","f2","f6"],"phrasings":["Cape Town halved its water use because people changed their habits.","Day Zero never came because four million individuals cut back.","No infrastructure saved Cape Town; buckets in the shower did.","Residents went from 1.2 billion litres a day to 500 million.","When people see a crisis they act faster than any government."],"frames":["F2","F6"],"uses":["OW15"],"notes":"Re-fetched 8 Nov 2026: GroundUp confirms 1.2 billion litres (February 2015) to 511 million (12 March 2018), about 400 million litres of the 689 million drop between February 2017 and 2018, pressure reduction for over a decade, about 250,000 devices since 2007, devices under 6B only above 10,500 litres, Armitage crediting pressure management, heavy users over 100,000 (December 2016) to about 20,000 (December 2017), and the City crediting demand management and 'the collective will of Capetonians'. SAnews confirms 1 February 2018, 50 litres, 150 days, 450 million, R28.44 to R145.98 as a proposal before Council; the detail no longer says Council 'approved' it. The H2Open paper returns 403, so no source splits the saving between measures; do not claim a percentage for pressure management. GroundUp itself supports their comeback that about 400 million litres of the drop came in the final year; if_they_push now answers that with the 50 litre cap and the heavy-user count. Adjacent existing card: FP05 (policy fails unless people comply).","sources":[{"title":"Cape residents limited to 50 litres of water","publisher":"South African Government News Agency (SAnews)","year":2018,"url":"https://www.sanews.gov.za/index.php/node/37579","finding":"Re-fetched. Level 6B from 1 February 2018, 50 litres per person per day for 150 days, collective target 450 million litres a day; proposed punitive tariff taking a 6,000 litre bill from R28.44 to R145.98, with Council to vote that week. The 10,500 litre device threshold is not on this page; it is on GroundUp.","verified":true},{"title":"How Cape Town more than halved its water usage","publisher":"GroundUp","year":2018,"url":"https://groundup.news/article/how-cape-town-more-halved-its-water-usage/","finding":"Pressure reduction began more than a decade earlier; about 250,000 water management devices installed since 2007; Armitage attributes the drop since 2015 largely to pressure reductions and says the City's work drove the 1999 to 2015 decline; households over 20,000 litres a month fell from over 100,000 in December 2016 to almost 20,000 a year later; level 5, 6 and 7 restriction tariffs approved by Council.","verified":true}],"their_sources":[{"title":"How Cape Town more than halved its water usage","publisher":"GroundUp","year":2018,"url":"https://groundup.news/article/how-cape-town-more-halved-its-water-usage/","finding":"Daily consumption fell from 1.2 billion litres in February 2015 to 511 million litres on 12 March 2018, a drop of 689 million litres a day, which the City credits to demand management and the collective will of Capetonians.","verified":true},{"title":"How different Cape Town residential suburbs helped avert Day Zero","publisher":"H2Open Journal 3(1) (Ouweneel, Winter, Carden)","year":2020,"url":"https://iwa.silverchair.com/h2open/article/3/1/118/74682/How-different-Cape-Town-residential-suburbs-helped","finding":"Search summary: city demand fell from a summer peak of 1.2 billion litres a day to under 500 million; lower, middle and higher income suburbs cut demand 32, 59 and 58 percent. The page returned 403 and was not read.","verified":false}],"routes":[{"type":"reframe","say":"Fifty litres a person, a punitive tariff above 6,000 litres, pressure cut at the mains, devices on heavy users: that is a municipal policy package, and residents lived inside it."},{"type":"deny","say":"Armitage attributes the drop largely to pressure management. Heavy users fell from over 100,000 households to about 20,000 because the city engineered the flow, not because of buckets."},{"type":"turn","say":"Their example shows what happens when government sets a hard cap and a price: four million people change in weeks. That is the strongest case for policy in the round."},{"type":"fallacy","say":"They count the residents' hands and forget the rule that moved them. Behaviour under a legal cap and a punitive price is policy's effect, not its rival."}]},{"id":"GL07","side":"for","kind":"argument","angle":"communities","strength":3,"title":"Setsuden and victory gardens: people conserve when asked","claim":"After Fukushima, Japan asked people to save power and Tokyo's summer peak fell about 18 percent in 2011 with no blackouts: offices in short sleeves, escalators off, air conditioning at 28 degrees. In the Second World War 20 million American victory gardens grew about 40 percent of the country's fresh vegetables. Ask people, and they deliver more than any regulation.","say":"Japan's big savers were under a legal order with fines. Large users cut peak demand 29 percent; households, who were only asked, cut far less and many missed their peak targets.","detail":"From 1 July 2011 the government invoked Article 27 of the Electricity Business Act, the first use in decades, requiring every customer with a contract of 500 kW or more in the TEPCO and Tohoku areas to cut peak use at least 15 percent, with fines reported at about 12,000 dollars per breach. GEPR's breakdown of TEPCO's 18 percent peak reduction: large users under the order cut 29 percent, small users 19 percent and households 6 percent, and Japan for Sustainability reports many households failed to meet their targets during peak hours. Setsuden also carried a cost we already hold: Werfel's survey of 14,000 Japanese found that people who reported saving energy were about 13 percent less likely to support a carbon tax (FR02). The victory gardens were a government programme: the National WWII Museum says the USDA designed the campaign, Secretary Claude Wickard convened the agencies, and the 1942 rationing order drove people to their lawns. Both examples are governments mobilising people under rules (F2, F3), and the gardens are a food story, not an environmental one.","if_they_push":"If they say the mandate covered only big firms and the rest was goodwill: the order covered the users whose cut was largest. Households, the only purely voluntary group, cut 6 percent and many missed their peak-hour targets.","comeback":"Households were never ordered and still cut 6 percent, and the 20 million gardens were planted by families, not by the USDA. Mobilisation works because individuals answer.","weak":false,"tags":["setsuden","japan","fukushima","2011","peak demand","power saving","cool biz","victory gardens","wwii","20 million gardens","40 percent","conservation","voluntary","ask people","wartime","f2","f3","f1"],"phrasings":["Japan cut peak electricity demand by almost a fifth just by asking people to save.","Setsuden: no blackouts in Tokyo in 2011 because everyone turned things off.","Victory gardens grew forty percent of America's vegetables in the war.","Twenty million families planted gardens without a law telling them to.","When people are asked, they conserve more than regulation ever achieves."],"frames":["F2","F3","F1"],"uses":["FR02"],"notes":"Re-fetched 8 Nov 2026: GEPR confirms 18 percent total, 29 large users, 19 small users, 6 households, Article 27, and the later attribution to production adjustments, shifted hours and private generation. Industrial Info confirms 1 July 2011, at least 15 percent, 500 kW, fines of at least 12,000 dollars, no mandatory measures on households. Japan for Sustainability confirms the Article 27 dates (ended 9 and 22 September 2011) and that many households missed peak-hour targets while areas met kWh targets. WWII Museum confirms USDA design, Wickard, May 1942 rationing, 42 percent in 1943. HISTORY.com confirms 20 million gardens, 8 million tons, more than 40 percent. Corrected: the old say called the whole saving 'a legal order', but small users (19 percent) were outside it; 'two thirds of the saving' and 'faded within a few years' in if_they_push were unsourced and are removed; the turn route called Werfel 'Japan's own researchers', now 'a study of 14,000 Japanese' (FR02, whose primary source is partial); two routes were both 'reframe', the victory garden one is now a fallacy route. Peak-demand percentages differ slightly by source; say 'about'. Adjacent existing cards: FP05 (policy fails unless people comply), PF08 (COVID cut emissions 17 percent).","sources":[{"title":"From 2011 Emergency Power Savings to 2012 Sustainable Power Savings","publisher":"Global Energy Policy Research (GEPR)","year":2012,"url":"https://www.gepr.org/en/contents/20120423-01","finding":"Restriction on large users declared under Article 27 of the Electricity Business Act; TEPCO peak cut 18 percent in total, large users 29, small users 19, households 6; a later study attributes the cuts to production adjustments, shifting hours and private generation.","verified":true},{"title":"Japan Begins Mandatory Power Cuts to Avoid Electricity Shortages","publisher":"Industrial Info Resources","year":2011,"url":"https://www.industrialinfo.com/news/article/japan-begins-mandatory-power-cuts-to-avoid-electricity-shortages--182251","finding":"From July 1, 2011 a mandatory reduction of at least 15 percent applied to any entity using 500 kW or more in the TEPCO and Tohoku areas, with fines of at least 12,000 dollars per incidence; no mandatory measures applied to households.","verified":true},{"title":"Results of Electricity-Saving Efforts in Summer 2011","publisher":"Japan for Sustainability","year":2012,"url":"https://japanfs.org/en/news/archives/news_id031565.html","finding":"Article 27 'Restriction on Use of Electricity' enacted July 1, 2011 for users of 500 kW or more, in force until September 9 (Tohoku) and September 22 (TEPCO); many households failed to meet the peak-hour targets, though the areas met overall kWh targets.","verified":true},{"title":"Victory Gardens in World War II","publisher":"The National WWII Museum","year":2023,"url":"https://www.nationalww2museum.org/war/articles/victory-gardens-world-war-ii","finding":"The USDA designed the Victory Garden campaign to address food and labour shortages; Secretary of Agriculture Claude Wickard convened federal agencies; rationing from May 1942 prompted the gardening; USDA data said 42 percent of produce in 1943 came from victory gardens.","verified":true}],"their_sources":[{"title":"From 2011 Emergency Power Savings to 2012 Sustainable Power Savings","publisher":"Global Energy Policy Research (GEPR)","year":2012,"url":"https://www.gepr.org/en/contents/20120423-01","finding":"In TEPCO's area in summer 2011 peak demand fell 18 percent in total: large-scale users cut 29 percent, small-scale users 19 percent and households 6 percent; Tohoku's large users exceeded the 15 percent target.","verified":true},{"title":"America's Patriotic Victory Gardens","publisher":"HISTORY.com","year":2023,"url":"https://www.history.com/articles/americas-patriotic-victory-gardens","finding":"By 1944 an estimated 20 million victory gardens produced roughly 8 million tons of food, more than 40 percent of all the fresh fruits and vegetables consumed in the United States.","verified":true}],"routes":[{"type":"deny","say":"Households, the voluntary part, cut 6 percent. Large users under a legal order with fines cut 29 percent. The voluntary story is the small slice of their own number."},{"type":"reframe","say":"Article 27 of the Electricity Business Act, invoked 1 July 2011: a statutory restriction with penalties. Setsuden was a government order with a friendly name."},{"type":"turn","say":"A study of 14,000 Japanese found that people who saved energy after Fukushima were less likely to back a carbon tax. The voluntary effort crowded out the policy that would outlast it."},{"type":"fallacy","say":"They cite a USDA-designed campaign under wartime rationing as proof that people act unasked. The example contradicts the premise, and the gardens were about food, not the environment."}]},{"id":"GL08","side":"for","kind":"argument","angle":"communities","strength":3,"title":"Africans bought their own solar, pay-as-you-go","claim":"Across Africa, households electrified themselves. M-KOPA, which began financing solar home systems in Kenya in 2011, now has 10 million customers in five countries. GOGLA members sold more than 10 million off-grid solar kits in 2025, pay-as-you-go sales rose nearly 50 percent, and off-grid solar now reaches about 150 million people. Families paid from their own wages and remittances for power the grid never brought.","say":"M-KOPA is a company, not an individual, by our definitions. GOGLA's own report says growth concentrated where governments subsidised it. When Kenya taxed solar in 2020, the industry begged for its exemption back.","detail":"Under F5 a financed product from a firm with 600 million dollars of revenue is a market, not an individual act; the household is a customer choosing from a menu (F2). GOGLA's 2026 market report says growth has been concentrated in markets supported by subsidies and results-based financing, dominated by a few large companies, and warns about the sector once external financial support is withdrawn. Kenya had exempted solar equipment from VAT; when the Finance Act 2020 removed the exemption, prices rose and the industry argued for its reinstatement in the 2021 Finance Bill: the market moved with the tax line. Meanwhile the state did the heavy lifting on access: Kenya's Last Mile Connectivity Project, launched with African Development Bank support, cut the connection fee from 35,000 to 15,000 shillings, and national access rose from 53 percent in 2016 to 75 percent by early 2021. Grid policy is the reason an M-KOPA panel is a stopgap rather than the end state (FR04). Panels were also cheap because of demand policy elsewhere (OW14).","if_they_push":"If they say the customer still paid with her own money: she paid a price set by import duty, VAT and a subsidised distributor, for a product whose cost fell under German and Chinese policy. Her choice was real; the menu was policy's.","comeback":"Subsidies went to the companies; the customer still chose to spend scarce money on a panel over a grid that never came. Ten million households decided; no ministry did.","weak":false,"tags":["m-kopa","pay as you go","paygo","off-grid solar","africa","kenya","gogla","solar home system","remittances","electrification","mobile money","self-financed","energy access","d.light","f5","f2"],"phrasings":["M-KOPA has ten million customers; the grid never came, so people bought solar themselves.","Africans electrified their own homes with pay-as-you-go panels and mobile money.","Ten million off-grid solar kits sold last year, no government programme needed.","Remittances, not ministries, lit up rural Kenya.","Off-grid solar reaches 150 million people and it is all private."],"frames":["F5","F2"],"uses":["FR04","OW14"],"notes":"Re-fetched 8 Nov 2026: TechTrends confirms 10 million customers in Kenya, Nigeria, Ghana, Uganda and South Africa, 2011 start in solar, smartphones from 2020, 600 million dollars revenue. SolarQuarter confirms more than 10 million kits, PAYGo up nearly 50 percent, nearly 150 million people, 11 million new, and the subsidy-concentration and sustainability language. The Star confirms 53 percent (2016) to 75 percent (early 2021), 13.5 billion shillings in 2017, AfDB, 35,000 to 15,000 shillings, 2.3 million households (2013) to 6.2 million. Business Daily is partial: the 2020 VAT removal and 2021 bill are on the page, the 2014 exemption and 14 percent rate are not, so the say and detail no longer date the exemption. The 2013 access baseline varies from 26 to 40 percent across sources; avoid it. Most of M-KOPA's recent customers bought phones, not solar, which weakens their example further but is a jab. Adjacent existing cards: MK02 (Pakistan's households out-built its government), MK04 (Australian rooftops), MK03.","sources":[{"title":"GOGLA members achieve record 10 million off-grid solar kit sales in 2025","publisher":"SolarQuarter (reporting GOGLA)","year":2026,"url":"https://solarquarter.com/2026/06/09/gogla-members-achieve-record-10-million-off-grid-solar-kit-sales-in-2025-expanding-energy-access-worldwide-report/","finding":"Growth has been concentrated in markets supported by subsidies and is dominated by a small number of large companies; supported by government subsidies, results-based financing programmes and consumer finance; concern about sustainability once external financial support is reduced or withdrawn.","verified":true},{"title":"Last Mile project pushes Kenya's electricity connectivity to 75 per cent","publisher":"The Star (Kenya)","year":2022,"url":"https://www.the-star.co.ke/news/2022-05-23-last-mile-project-pushes-kenyas-electricity-connectivity-to-75-per-cent","finding":"Total access 75 percent as of early 2021, up from 53 percent in 2016; the government with African Development Bank support launched the 13.5 billion shilling project in 2017; connection cost cut from 35,000 to 15,000 shillings; households connected rose from 2.3 million to 6.2 million.","verified":true},{"title":"VAT exemptions on solar key to universal electrification","publisher":"Business Daily Africa","year":2021,"url":"https://www.businessdailyafrica.com/bd/opinion-analysis/ideas-debate/vat-exemptions-on-solar-key-to-universal-electrification-3436842","finding":"Re-fetched. 'The Government introduced VAT on energy products in the Finance Act, 2020', targeting clean cooking, off-grid solar and mini-grids; 'passed on to customers in the form of higher prices'; the Finance Bill 2021 proposed reinstating the exemptions. The page refers to earlier exemptions without a date and gives no rate; the 2014 Act and the 14 percent rate are not on it. Opinion piece by an off-grid advocate.","verified":"partial"},{"title":"M-KOPA reaches 10 million customers","publisher":"TechTrends Kenya","year":2026,"url":"https://techtrendske.co.ke/2026/10/08/m-kopa-10-million-customers-africa-2/","finding":"Most recent growth is smartphone financing since 2020, not solar; 600 million dollars revenue.","verified":true}],"their_sources":[{"title":"M-KOPA reaches 10 million customers as its solar financing roots give way to a broader African fintech business","publisher":"TechTrends Kenya","year":2026,"url":"https://techtrendske.co.ke/2026/10/08/m-kopa-10-million-customers-africa-2/","finding":"M-KOPA reached 10 million customers across Kenya, Nigeria, Ghana, Uganda and South Africa; began operations in 2011 financing solar systems; moved into smartphone financing in 2020; revenue of 600 million dollars in FY2025.","verified":true},{"title":"GOGLA members achieve record 10 million off-grid solar kit sales in 2025","publisher":"SolarQuarter (reporting GOGLA's Global Off-Grid Solar Market Report)","year":2026,"url":"https://solarquarter.com/2026/06/09/gogla-members-achieve-record-10-million-off-grid-solar-kit-sales-in-2025-expanding-energy-access-worldwide-report/","finding":"GOGLA-affiliated companies sold more than 10 million kits in 2025; PAYGo sales rose nearly 50 percent; members provide energy access to nearly 150 million people; 11 million more gained access in 2025.","verified":true}],"routes":[{"type":"reframe","say":"M-KOPA is a 600 million dollar company. Under the definitions set in our opening, a firm selling financed panels is not individual action; it is a market inside policy."},{"type":"deny","say":"GOGLA's own report says growth concentrated in markets supported by government subsidies and results-based financing and worries what happens when that support stops."},{"type":"outweigh","say":"Kenya's grid programme took access from 53 percent in 2016 to 75 percent in five years by cutting the connection fee. That is the larger number, and it is policy."},{"type":"turn","say":"When Kenya removed the solar VAT exemption in 2020, prices jumped and the industry begged for the policy back. The market lives or dies on the tax code."}]},{"id":"GL09","side":"for","kind":"argument","angle":"communities","strength":2,"title":"Laudato Si' moved a billion consciences","claim":"In 2015 Pope Francis published Laudato Si', addressed to every person on the planet, and the share of American Catholics who said global warming is happening rose ten points within months. Faith communities reach people no regulation can: a sermon changes what a billion people think is right, and behaviour follows belief.","say":"The Annenberg study found that awareness of the encyclical was not associated with more concern, and conservatives who knew of it cared less. A sermon moves attitudes at best, and attitudes are not tonnes.","detail":"Li, Hilgard, Scheufele, Winneg and Jamieson surveyed about 1,380 Americans before and after the encyclical for Climatic Change in 2016: awareness of Laudato Si' was not associated with an increase in concern; liberals who knew of it were more concerned and conservatives who knew of it were less concerned than those who did not. The Yale study the For side cites shows a ten-point rise among Catholics in saying warming is happening, over a period that also included the Pope's US visit, and later reviews describe the effect as small and possibly temporary (not fetched here). Even taken at face value, belief is an input (F1): no Yale survey measures an emission. The motion asks about impact on the environment, and the measured cuts in this round came from standards and prices (M3, OW09, OW15). Religion and policy are not rivals; the Pope's letter asked governments to act, which is F3 again.","if_they_push":"If they say belief precedes every policy: fine, then the impact arrives through the policy, which is our side of the motion. If they say believers changed their own consumption, ask for the measurement; there is none.","comeback":"Two studies, two results, and even the sceptical one found liberals moved. Opinion is upstream of every vote and purchase, so moving consciences is the deepest lever.","weak":false,"tags":["laudato si","pope francis","faith","religion","church","catholic","francis effect","moral","encyclical","conscience","congregation","mosque","interfaith","values","f1","f3"],"phrasings":["The Pope did more for climate opinion in one encyclical than a decade of policy.","Faith communities change what people believe, and behaviour follows belief.","After Laudato Si' American Catholics' belief in warming jumped ten points.","A billion Catholics heard that caring for creation is a duty.","Religion reaches the people policy cannot."],"frames":["F1","F3"],"uses":["M3","OW15"],"notes":"Re-fetched 8 Nov 2026: Yale confirms 64 to 74 percent among Catholics, 62 to 66 overall, 34 to 42 on the moral question, 35 percent influenced, and that the October wave followed the Pope's US visit. Annenberg confirms 1,381 and 1,374 interviews, no association between awareness and concern, aware liberals more concerned and aware conservatives less. The 1.3 billion Catholics figure is on neither page; avoid it. The Landrum and Vasquez 2020 review is from a search summary and not fetched; the detail now says 'later reviews' without a date. Weak For card; one route is enough in the room. No close duplicate; BH01 and BH03 (norms and virtue) are adjacent.","sources":[{"title":"Pope's encyclical did not rally broad support for climate change","publisher":"Annenberg Public Policy Center (Li et al., Climatic Change)","year":2016,"url":"https://www.annenbergpublicpolicycenter.org/popes-encyclical-did-not-rally-broad-support-for-climate-change/","finding":"Phone surveys of 1,381 and 1,374 Americans before and after release; awareness of the encyclical was not associated with an increase in public concern; aware liberals were more concerned and aware conservatives less concerned than their unaware peers.","verified":true},{"title":"The Francis Effect","publisher":"Yale Program on Climate Change Communication","year":2015,"url":"https://climatecommunication.yale.edu/publications/the-francis-effect/","finding":"The comparison is March versus October 2015 and spans the Pope's US visit; changes among all Americans were 4 to 6 points.","verified":true}],"their_sources":[{"title":"The Francis Effect: How Pope Francis Changed the Conversation about Global Warming","publisher":"Yale Program on Climate Change Communication / George Mason University","year":2015,"url":"https://climatecommunication.yale.edu/publications/the-francis-effect/","finding":"Between March and October 2015 the share of American Catholics saying global warming is happening rose from 64 to 74 percent (Americans overall 62 to 66); seeing it as a moral issue rose from 34 to 42 percent among Catholics; 35 percent of Catholics said the Pope influenced their views.","verified":true}],"routes":[{"type":"deny","say":"The peer-reviewed study found no overall rise in concern from the encyclical and a backlash among conservatives. The ten-point figure is one survey spanning a papal visit."},{"type":"reframe","say":"Laudato Si' is a letter asking governments to act. If it worked, the tonnes arrive through the policies it called for, which is policy's impact."},{"type":"fallacy","say":"They have measured a belief and called it an impact. Nobody has shown a tonne of carbon that moved because a survey answer changed."}]},{"id":"GL10","side":"for","kind":"argument","angle":"communities","strength":2,"title":"Rich countries exported their pollution, only consumption counts","claim":"The Global North's policy wins are an accounting trick. Britain cut territorial emissions by half since 1996, but more than half its carbon footprint is now embedded in imports, up from 31 percent. Factories moved to China; the goods still arrive. Policy moves emissions across a border; only an individual who consumes less removes them from the planet.","say":"Britain's footprint with imports counted has fallen too, down 29 percent from its peak. Offshoring means consumption rising while territory falls. Both fell. And leakage is fixed by policy: a border carbon adjustment.","detail":"Defra's consumption-based accounts count the emissions embedded in everything Britons buy wherever it was made. That footprint peaked at 984 million tonnes in 2007 and was 29 percent lower in 2023; per person it is down 37 percent from the 2004 peak, to 10 tonnes. Our World in Data states the test: offshoring is when territorial emissions fall while consumption emissions rise. In Britain both fell. Since 1996 the footprint fell 15 percent against 50 for territorial emissions, so imported emissions did rise over that span; the honest claim is that consumption fell as well, not that nothing moved abroad. On leakage itself, a 2026 systematic review in Climate Policy finds modelling studies predict positive leakage but ex-post evidence is mixed, with leakage found through investment relocation and electricity trade, not a wholesale export of industry. The EU carbon market cut covered emissions by about 1.2 billion tonnes (OW07) and the EU's answer to leakage, the carbon border adjustment, is itself a policy. The consumer did not stop the leak; the regulator did (F2, FR10).","if_they_push":"If they say consumption is what individuals control: Defra's listed reason for the footprint falling is cleaner production of the goods, not less buying, and the power behind those goods got cleaner by policy, Britain's coal exit (M5) and China's air plan (OW10). If they press 15 against 50 since 1996: both measured, both falling, and no individual-action campaign anywhere has a national number like either.","comeback":"You have conceded consumption is the honest measure, and consumption is what individuals control. Since 1996 your footprint fell 15 percent against 50 at home; the gap is our imports.","weak":true,"tags":["carbon leakage","offshoring","consumption-based","imports","embedded emissions","accounting trick","china","global north","footprint","territorial","outsourced emissions","trade","cbam","f1","f2"],"phrasings":["Britain did not cut its emissions, it moved them to China.","Half the UK's footprint is now imported, so the policy cuts are fake.","Carbon leakage means regulation just relocates the factory.","Only consuming less actually removes emissions; policy shuffles them across borders.","The Global North exported its pollution and called it progress."],"frames":["F1","F2"],"uses":["OW07","FR10","M5","OW10"],"notes":"Re-fetched 8 Nov 2026: Defra confirms the 984 Mt peak in 2007, about 29 percent lower in 2023, per person 16 to 10 tonnes (37 percent from 2004), imports 31 to 53 percent of the footprint 1996 to 2023, territorial down 50 percent and footprint down 15 percent since 1996. Defra does not attribute the fall to decarbonised manufacturing abroad; it lists decarbonisation of the products consumed as one possible, unquantified reason and puts the territorial-footprint gap down to a shift to services and more imports. White Rose abstract confirms the leakage review. Our World in Data carries the offshoring test sentence, so that rebuttal source is now true. Set to weak: the arithmetic since 1996 (footprint minus 15, territorial minus 50, import share 31 to 53) means imported emissions rose in absolute terms over that span, so the For side's 1996 framing is largely right and our 29 percent is measured from the 2007 peak, which they can call a chosen baseline (FL12). The old fallacy route claimed domestic emissions 'fell faster than imports', which the Defra numbers contradict; it is replaced. Our defence is that consumption fell too, that cleaner production abroad is also policy (OW10, OW14), and that leakage's fix is a policy. Imported emissions carry more uncertainty; say 'about 29 percent'. Duplicates existing cards PF02 (policy offshores emissions) and TC07 (one fifth of the US footprint is overseas).","sources":[{"title":"Carbon footprint for the UK and England to 2023","publisher":"Defra","year":2025,"url":"https://www.gov.uk/government/statistics/uks-carbon-footprint/carbon-footprint-for-the-uk-and-england-to-2023","finding":"The UK's carbon footprint peaked at 984 MtCO2e in 2007 and was around 29 percent lower in 2023; per capita consumption emissions fell 37 percent from a 2004 peak of 16 tonnes to 10 tonnes; imports are 53 percent of the footprint, up from 31 percent in 1996.","verified":true},{"title":"Carbon leakage in emissions trading systems: a systematic review and meta-analysis of ex-ante and ex-post evidence","publisher":"Climate Policy (Chen, Di Gregorio and Paavola), White Rose eprints","year":2026,"url":"https://eprints.whiterose.ac.uk/id/eprint/237953/","finding":"Ex-ante modelling studies generally report positive leakage rates, lower with broader coverage and anti-leakage measures; ex-post studies find leakage through channels such as US interstate electricity trade and investment relocation in the EU ETS and China pilots; findings on goods trade are mixed.","verified":true},{"title":"CO2 emissions embedded in trade","publisher":"Our World in Data","year":2024,"url":"https://ourworldindata.org/consumption-based-co2","finding":"Re-fetched. 'If only territorial emissions were falling whilst consumption-based emissions were rising, this would suggest it was offshoring emissions elsewhere'; and 'many countries have become much richer while achieving a reduction of emissions' on the consumption measure.","verified":true}],"their_sources":[{"title":"Carbon footprint for the UK and England to 2023","publisher":"Department for Environment, Food and Rural Affairs (Defra)","year":2025,"url":"https://www.gov.uk/government/statistics/uks-carbon-footprint/carbon-footprint-for-the-uk-and-england-to-2023","finding":"Since 1996 territorial emissions fell 50 percent while the consumption footprint fell 15 percent; imported emissions rose from 31 percent of the footprint in 1996 to 53 percent in 2023.","verified":true},{"title":"CO2 emissions embedded in trade (consumption-based emissions)","publisher":"Our World in Data","year":2024,"url":"https://ourworldindata.org/consumption-based-co2","finding":"Most of Western Europe and the Americas are net importers of emissions, most of Eastern Europe and Asia net exporters; offshoring would show as territorial emissions falling while consumption emissions rise.","verified":"partial"}],"routes":[{"type":"deny","say":"Britain's consumption footprint, imports included, is down 29 percent from its 2007 peak. Offshoring would show consumption rising while territory fell. It did not."},{"type":"reframe","say":"Leakage is a design flaw in one policy, and the fix, a border carbon adjustment, is another policy. Nobody fixes leakage by buying less at home."},{"type":"outweigh","say":"Even on consumption accounting the UK is down 29 percent and the EU market avoided 1.2 billion tonnes. Name one individual-consumption campaign with a national figure."},{"type":"fallacy","say":"They offer two options, cut at home or move abroad. The third is what happened: consumption emissions fell as well, more slowly. A smaller fall is not a leak."}]},{"id":"PF01","side":"for","kind":"argument","angle":"policy failures","strength":4,"title":"Bans on paper: illegal logging and fishing","claim":"Indonesia has had a forest moratorium since 2011 and Brazil a Forest Code for decades, yet UNEP and INTERPOL estimate that 50 to 90 percent of logging in key tropical countries is illegal, worth 30 to 100 billion dollars a year. At sea, one fish in five is caught illegally despite quotas. A law that is not obeyed has no impact; what happens on the ground is decided by the people holding the chainsaws and the nets.","say":"Illegality measures the gap between a law and its enforcement, not the uselessness of law. Brazil's enforcement plan cut Amazon deforestation about 84 percent, and clearing rose again when enforcement was dismantled.","detail":"Where enforcement arrived, the numbers moved. Brazil's PPCDAm took Legal Amazon deforestation from 27,772 square kilometres in 2004 to 4,571 in 2012 using satellite alerts, embargoes and credit restrictions (OW12). Chatham House found global illegal timber production fell 22 percent after 2002 following a decade of governance effort. Indonesia's primary forest loss fell 40 percent in 2018 against its 2002 to 2016 average, 45 percent inside moratoriu
