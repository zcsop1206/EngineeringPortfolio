ter a state plan built on satellite monitoring (OW12), and bald eagles went from 417 nesting pairs in 1963 to over 71,000 after the DDT ban and decades of legal protection, though the counting method changed (OW16).","if_they_push":"If birders' records feed government decisions, the impact is realised through the decision, which is F3 again.","comeback":"Policy cannot protect what has not been counted, and it was volunteer bird counts that revealed the DDT declines in the first place.","weak":false,"tags":["ebird","inaturalist","citizen science","gbif","biodiversity data","volunteers","monitoring","conservation","observations","cornell","evidence base","f1","f3"],"phrasings":["Counting birds is not cutting emissions; data without regulation changes nothing.","Citizen data feeds government protected-area decisions, so policy still does the work."],"frames":["F1","F3"],"uses":["OW12","OW16"],"notes":"Say contains no number and concedes the 40 percent eBird figure. Added that the eagle count mixes methods and credits law as well as the DDT ban. The eBird figure itself is search-summary only. Corrected detail after verification: 'eBird is reported to make up more than 40 percent of GBIF biodiversity records; accepted, though only a search summary supports it.' -> 'eBird is the largest single dataset in GBIF (about 561 million of roughly 1.3 billion occurrences in 2019, our own arithmetic, about 43 percent); we have no publisher statement of the share.'.","sources":[{"title":"eBird 2019 - Year in review","publisher":"Cornell Lab of Ornithology (eBird)","year":2019,"url":"https://ebird.org/canada/news/ebird-2019-year-in-review","finding":"Not found: no source states eBird is more than 40% of GBIF. GBIF news: 2019 eBird 561M occurrences vs about 1.3bn in GBIF (about 43%, our arithmetic).","verified":false,"note":"eBird page behind a bot check. Card already hedges; safer wording given."},{"title":"PPCDAm and Amazon deforestation 2004-2012 (INPE data)","publisher":"Climate Policy Initiative / INPE","year":2021,"url":"https://www.climatepolicyinitiative.org/id/?p=34486","finding":"Legal Amazon deforestation fell from 27,772 km2 (2004) to 4,571 km2 (2012). Commodity prices also played a part (West & Fearnside 2021).","verified":true}],"their_sources":[{"title":"eBird 2019 - Year in review","publisher":"Cornell Lab of Ornithology (eBird)","year":2019,"url":"https://ebird.org/canada/news/ebird-2019-year-in-review","finding":"Per search summary: eBird contributions make up more than 40% of GBIF biodiversity data. Page not fetched; I could not verify per-year observation counts or any iNaturalist totals.","verified":false}],"routes":[{"type":"reframe","say":"Counting birds is an input. What changes the environment is the protected-area decision or the rule that uses the data, and that is policy (F3)."},{"type":"outweigh","say":"Grant the data. After the DDT ban and decades of legal protection, bald eagles went from a few hundred nesting pairs to tens of thousands (OW16)."},{"type":"turn","say":"If volunteer counts revealed the DDT declines, what saved the eagles was the ban that followed. Their example ends in a regulation (OW16)."},{"type":"fallacy","say":"Policy cannot protect what has not been counted, but counting protects nothing. A necessary input is being credited with the outcome."}]},{"id":"MK12","side":"for","kind":"argument","angle":"markets","strength":2,"title":"Germans own the energy transition themselves","claim":"Bürgerenergie, citizen-owned energy, meant that about 51 percent of Germany's renewable capacity in 2010 was owned by farmers and private individuals, and roughly a third of installed capacity was still privately owned in 2019, with solar PV about 48 percent privately owned. Germany's transition was financed on kitchen tables and in village co-operatives, not by utilities.","say":"Citizens invested because the EEG law guaranteed fixed payments. Clean Energy Wire reports their share then fell to about a third as the system moved to auctions. The law, not kitchen tables, set the terms.","detail":"The EEG took effect on 1 April 2000 with grid access, priority dispatch and a 20-year tariff (OW14). Clean Energy Wire reports citizen-generated energy fell to about a third by 2021 as payments expired and the 2014 reform replaced tariffs with auctions. Aurora argues industry professionalisation also squeezed small players, so the cause is mixed; we say the policy built it and the policy change coincided with the decline. Citizen ownership is who held the asset, which says nothing about why the asset was built.","if_they_push":"Ownership by citizens is a financing detail; the guaranteed return is the reason there was anything to own.","comeback":"The law offered a return to everyone, but it was farmers and families who took it up and built the capacity, and the state would not have built it by itself.","weak":false,"tags":["germany","burgerenergie","citizen energy","cooperatives","community energy","energiewende","51 percent","private owners","farmers","solar","trend research","f2"],"phrasings":["The Energiewende was built on the EEG feed-in tariff, a law; citizens only invested because the law guaranteed returns.","Your own sources show the citizen share falling to a third as big investors took over."],"frames":["F2"],"uses":["OW14"],"notes":"Clean Energy Wire and EEG sources are verified and support the say; the one number (about a third) is backed. The detail already hedges that professionalisation also squeezed small players. Left unchanged.","sources":[{"title":"Share of citizen energy projects declines as funding runs out and big investors take over","publisher":"Clean Energy Wire","year":2021,"url":"https://www.cleanenergywire.org/news/share-citizen-energy-projects-decline-funding-runs-out-and-big-investors-take-over","finding":"Citizen-generated share fell to about a third by early 2021; EEG's 20-year fixed payments underpinned early citizen projects and began expiring; 2014 reform moved from feed-in tariffs to auctions; Aurora argues industry professionalisation is also a cause.","verified":true},{"title":"German Renewable Energy Sources Act","publisher":"Wikipedia","year":2024,"url":"https://en.wikipedia.org/wiki/German_Renewable_Energy_Sources_Act","finding":"EEG in force 1 April 2000; guaranteed connection, priority dispatch, 20-year tariff.","verified":true}],"their_sources":[{"title":"Share of private individuals involved in renewables production falls in Germany","publisher":"Clean Energy Wire","year":2021,"url":"https://www.cleanenergywire.org/news/share-private-individuals-involved-renewables-production-falls-germany","finding":"Per search summary: trend:research for AEE found almost one third of capacity privately owned in 2019; solar PV about 48%; share is falling. Page not fetched.","verified":false},{"title":"Citizens own half of German renewables","publisher":"Energy Transition (Heinrich Boell Foundation)","year":2013,"url":"https://energytransition.org/2013/10/citizens-own-half-of-german-renewables/","finding":"Per search summary: about 51% of >50,000 MW owned by farmers and individuals in 2010; the article itself questions how Bürgerenergie is defined. Page not fetched.","verified":false}],"routes":[{"type":"reframe","say":"Citizens invested because the EEG guaranteed grid access, priority dispatch and a fixed twenty-year payment. Ownership is who held the asset, not why it was built (OW14)."},{"type":"turn","say":"When the reform replaced tariffs with auctions, the citizen share fell to about a third. Kitchen tables followed the law in both directions."},{"type":"fallacy","say":"Financing is not causing. Who owned the panels says nothing about what made panels worth owning, and that was a guaranteed return written in law."}]},{"id":"MK13","side":"for","kind":"argument","angle":"markets","strength":1,"title":"Entrepreneurs like Musk beat governments","claim":"One company, Tesla, did more to move the global car industry toward electric than any single national EV programme, and SpaceX-style private risk-taking shows individual founders can out-deliver agencies. The argument is that individual ambition, not committees, produces step changes.","say":"Tesla grew on a $465 million Department of Energy loan and on regulatory credits that rules created. China's purchase-tax exemption built the biggest EV market, not one firm. Tesla worked inside policy, not above it.","detail":"The loan came through the DOE's Advanced Technology Vehicle Manufacturing program and was repaid in May 2013; an analyst noted then that Tesla also receives state regulatory credits. We concede Tesla repaid early and was a real innovator. Do not say Tesla still gets federal purchase tax credits: the US 7,500 dollar credit ended on 30 September 2025. The remaining claim, that Musk did more than any national programme, is an assertion with no source in their file, and IEA's EV Outlook does not attribute the market to one person. China's NEV purchase-tax exemption has run through 2025 and is extended to 2027 at half the cap. Expect: Tesla still held about 59 percent of US EV sales in Q4 2025 after the credit ended (search summary).","if_they_push":"Even granting Tesla led, it led in markets that loans, credits and mandates created, and a loan repaid is still a loan that was offered first.","comeback":"Governments gave loans to many firms, but only Tesla turned one into a mass-market electric car, and it kept selling after the US credit ended.","weak":false,"tags":["musk","tesla","entrepreneur","founder","innovation","ev","private sector","step change","disruption","individual","great man","f2"],"phrasings":["Tesla relied on a $465 million DOE loan, zero-emission vehicle credits and EV tax credits.","BYD and Chinese state policy, not Tesla, account for most EVs."],"frames":["F2"],"uses":["OW09"],"notes":"Removed 'still gets tax credits', which is stale since the federal credit ended in September 2025, and substituted regulatory credits. Added the repaid-loan and post-credit sales pushback. Weak ground for the side but the remaining claim is genuinely unsourced.","sources":[{"title":"Tesla pays back $465M DOE loan, Musk says 'I hope we did you proud'","publisher":"Autoblog","year":2013,"url":"https://www.autoblog.com/2013/05/22/tesla-pays-back-465m-doe-loan-early/","finding":"$465 million loan awarded in 2010 under the DOE Advanced Technology Vehicle Manufacturing program, repaid in May 2013; an analyst notes Tesla still receives tax credits and state regulatory credits.","verified":true},{"title":"China Extends NEV Tax Reduction and Exemption Policy to 2027","publisher":"China Briefing","year":2025,"url":"https://china-briefing.com/news/china-extends-nev-tax-reduction-and-exemption-policy-to-2027","finding":"China's NEV purchase-tax exemption extended to end of 2027 (full exemption capped per vehicle through 2025, halved 2026 to 2027).","verified":true},{"title":"Global EV Outlook 2025: Executive summary","publisher":"International Energy Agency","year":2025,"url":"https://www.iea.org/reports/global-ev-outlook-2025/executive-summary","finding":"Electric car sales 'exceeded 17 million globally in 2024', share above 20%.","verified":true,"note":"Fetched IEA page. It does not attribute the market to one firm; the China incentive claim is not on this page."}],"their_sources":[{"title":"Global EV Outlook 2025: Executive summary","publisher":"International Energy Agency","year":2025,"url":"https://www.iea.org/reports/global-ev-outlook-2025/executive-summary","finding":"Shows scale of the EV market (17 million sales in 2024) but does not attribute it to any individual; the 'Musk did more than governments' claim is an unverified assertion, and Tesla received US loans and tax credits.","verified":false}],"routes":[{"type":"deny","say":"Tesla grew on a 465 million dollar Department of Energy loan and on regulatory credits that rules created. It worked inside policy, not above it."},{"type":"reframe","say":"Tesla is a company, not an individual, by the definitions set in the opening. A corporation's success is not individual action (F5)."},{"type":"outweigh","say":"Grant Tesla's innovation. China's purchase-tax exemption, extended to 2027, built the world's biggest electric-car market; no single firm did that."},{"type":"fallacy","say":"Their file offers no source for the claim that a founder did more than any national programme. The IEA attributes the market to no individual."}]},{"id":"MK14","side":"for","kind":"argument","angle":"markets","strength":1,"title":"Carbon offsets let individuals fix it","claim":"Voluntary carbon markets let any individual pay to fund a tonne of avoided emissions today, without waiting for legislation. Even critics accept the principle that private payments can finance conservation; the live question is quality control, which the market can fix with better standards.","say":"Even the best study of these credits cuts against them. West et al. in Science found most expected credits came from projects that barely reduced deforestation. Capped compliance markets, set by law, do work.","detail":"West and colleagues studied 18 REDD+ projects in five countries and found about 68 percent of the 89 million credits expected by 2020 came from projects that barely reduced deforestation, if at all, with only about 6 percent tied to additional reductions in press coverage. Verra and Mitchard's group dispute the method and the comparison sites, which we should say before they do. We could not confirm the claim that credits were about three times overstated, so do not say it. A buyer who pays for a credit that avoids nothing keeps emitting. Contrast the EU Emissions Trading System, a capped market set by law, which a PNAS study found avoided about 1.2 billion tonnes of CO2 from 2008 to 2016 (OW07). This study covers avoided-deforestation credits only, not every offset.","if_they_push":"Better standards means a regulator setting and auditing them, so the fix they want is policy. Verra's private standard is exactly what West audited.","comeback":"West covers one kind of forest credit, Verra disputes the method, and a market with better standards and verification can fix the quality problem without a government.","weak":false,"tags":["carbon offsets","voluntary carbon market","redd+","verra","credits","personal footprint","flying","individual choice","quality","baselines","additionality","f1","f2"],"phrasings":["Peer-reviewed work shows most REDD+ offsets do not represent real reductions.","Offsets are the moral hazard version of individual action: pay and keep emitting."],"frames":["F1","F2"],"uses":["OW07"],"notes":"The old say called West 'their own source', but it is the file's pre-emption source, not one they would cite; reworded to 'the best study'. Replaced 'not additive' with the real concept and cut the number to keep the speech under one. 68 percent and 89 million are verified in summaries, not the paper.","sources":[{"title":"Action needed to make carbon offsets from forest conservation work for climate change mitigation (West et al.)","publisher":"Science 381","year":2023,"url":"https://efi.int/publications/action-needed-make-carbon-offsets-forest-conservation-work-climate-change-mitigation","finding":"Confirmed by several search summaries: 18 REDD+ projects with usable baselines in five countries; of the 89 million credits expected in 2020, about 68% came from projects that barely reduced deforestation, if at all; about 6% (5.4 million) linked to additional reductions; Verra and Mitchard et al. dispute the method. The 'three times' figure was not found.","verified":true},{"title":"The European Union emissions trading system reduced CO2 emissions despite low prices","publisher":"PNAS 117(16) (Bayer & Aklin)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7183178","finding":"About 1.2 billion tons CO2 avoided 2008 to 2016 (3.8%). (ours.json OW07)","verified":true}],"their_sources":[{"title":"Action needed to make carbon offsets from forest conservation work for climate change mitigation (West et al.)","publisher":"Science","year":2023,"url":"https://efi.int/publications/action-needed-make-carbon-offsets-forest-conservation-work-climate-change-mitigation","finding":"Per search summary (Science 381, 873-877, doi:10.1126/science.ade3535): REDD+ projects claimed about three times more offsets than they generated, i.e. this evidence cuts against the argument. Listed so the speaker can pre-empt it.","verified":false}],"routes":[{"type":"deny","say":"The best study of forest credits found most expected credits came from projects that barely reduced deforestation, if at all. A buyer paying for nothing keeps emitting."},{"type":"reframe","say":"Better standards means a regulator setting and auditing them. The fix they want is policy, and Verra's private standard is exactly what West audited."},{"type":"outweigh","say":"Concede that private payments can finance conservation. A capped market set by law, the EU's trading system, avoided about 1.2 billion tonnes (OW07)."},{"type":"fallacy","say":"Paying for a tonne is not avoiding one. They assume the credit does what it says, which is the question West answered against them."}]},{"id":"CV01","side":"for","kind":"argument","angle":"legitimacy","strength":3,"title":"Values move first: Blue Planet to straw ban","claim":"Policy is downstream of culture. Blue Planet II aired in late 2017; Waitrose found 88 percent of viewers changed how they use single-use plastic, retailers dropped straws, and only then did England ban plastic straws, in October 2020. The public moved three years before the law did, so the norm shift is the cause and the ban is the paperwork.","say":"A controlled test found Blue Planet changed what people knew, not what they picked. The straw ban covers 4.7 billion straws a year by law. Conscience moved opinion. The rule moved the plastic.","detail":"Dunn, Mills and Veríssimo (Imperial and Oxford, Conservation Science and Practice, 2020) ran a 150-person randomised test: watching Blue Planet II raised knowledge scores but produced no significant change in choosing paper over plastic packaging. The 88 percent is self-report from a Waitrose survey of 2,000 people, not measured purchases (F1). England's ban on straws, stirrers and cotton buds took effect 1 October 2020, and the government's own estimate is 4.7 billion straws a year. Ireland's bag levy cut bag use about 90 percent within a year, which no documentary has matched (OW15). Opinion opens the door; the measured drop walks through it only once a rule is written (F2, F6).","if_they_push":"If they say the ban would never have passed without the public mood, agree, and note that the mood became tonnes only through a law, which is our side of the motion (F3). Ask for one measured fall in plastic use from the documentary alone.","comeback":"Dunn's sample was 150 people in a lab. Waitrose surveyed 2,000 real shoppers, and retailers dropped straws before any law required it.","weak":false,"tags":["blue planet","attenborough","straws","plastic","norms","values","culture","downstream","public opinion","waitrose","overton window","retailers","straw ban","viewers","f1","f2","f3","f6"],"phrasings":["Policy is downstream of culture. People changed first and the law caught up.","After Blue Planet, 88 percent of viewers changed their plastic habits before any ban existed.","Governments only ban what the public has already given up.","The 2020 straw ban just formalised what consumers had already done.","Norms shift, then politicians follow the polls."],"frames":["F1","F2","F3","F6"],"uses":["OW15"],"notes":"Re-fetched 8 Nov 2026: Imperial release (150 participants, no significant change in packaging choice), gov.uk ban page (1 October 2020, 4.7 billion straws), Convenience Store (88 percent, 2,000 respondents; OnePoll is not named on the page, so the detail now says 'a Waitrose survey'). The Wiley journal page returns 403. The Dunn study is small; lead with it but do not oversell it. The Irish 90 percent in the outweigh route rests on OW15, verified there. Close to existing cards B7 (policy follows people), TC10 (policy is a stamp on a shift already won) and BH02 (norms shifted first); this card adds the controlled test, so keep it and cross-read those.","sources":[{"title":"'Blue Planet II' may not have caused a change in plastic preference","publisher":"Imperial College London (news release on Dunn, Mills and Veríssimo, Conservation Science and Practice)","year":2020,"url":"https://www.imperial.ac.uk/news/205253/blue-planet-ii-have-caused-changed/","finding":"Re-fetched. 150 participants in two groups, one shown the 2001 Blue Planet and one Blue Planet II; understanding of marine conservation rose markedly, but there was 'no significant difference in the choices people made between plastic and paper-packaged snacks' before and after viewing.","verified":true},{"title":"Evaluating the impact of the documentary series Blue Planet II on viewers' plastic consumption behaviors","publisher":"Conservation Science and Practice (Wiley)","year":2020,"url":"https://conbio.onlinelibrary.wiley.com/doi/full/10.1111/csp2.280","finding":"Journal page returned 403; findings taken from the Imperial release above.","verified":false},{"title":"Start of ban on plastic straws, stirrers and cotton buds","publisher":"UK Government (Defra)","year":2020,"url":"https://www.gov.uk/government/news/start-of-ban-on-plastic-straws-stirrers-and-cotton-buds","finding":"Fetched. Ban in force 1 October 2020; 4.7 billion straws a year in England.","verified":true}],"their_sources":[{"title":"Major behavioural change since Blue Planet plastic warning (Waitrose & Partners Food and Drink Report 2018)","publisher":"Convenience Store, reporting Waitrose and OnePoll","year":2018,"url":"https://www.conveniencestore.co.uk/your-business/major-behavioural-change-since-blue-planet-plastic-warning/573355.article","finding":"Re-fetched. 'Nearly nine in 10 (88%) people who watched the final episode of Blue Planet II have changed their behaviour' on single-use plastic; 2,000 respondents; dated 1 November 2018. The page credits Waitrose research and does not name OnePoll.","verified":true},{"title":"Start of ban on plastic straws, stirrers and cotton buds","publisher":"UK Government (Defra)","year":2020,"url":"https://www.gov.uk/government/news/start-of-ban-on-plastic-straws-stirrers-and-cotton-buds","finding":"Fetched. Ban on supply took effect 1 October 2020 in England; the page estimates England uses 4.7 billion plastic straws, 316 million stirrers and 1.8 billion cotton buds a year.","verified":true}],"routes":[{"type":"deny","say":"The 88 percent is a self-reported survey. The only controlled test of Blue Planet viewers found no change in what they actually picked up."},{"type":"reframe","say":"Their story ends with a ban. If the norm shift only counts once a government writes it down, the impact is policy's."},{"type":"outweigh","say":"Grant the mood. Ireland's bag levy cut bag use about 90 percent within a year. No documentary has a measured number like that."},{"type":"fallacy","say":"After does not mean because. The ban came three years after the programme, through a consultation, a law and a date, and they credit the television."}]},{"id":"CV02","side":"for","kind":"argument","angle":"legitimacy","strength":4,"title":"Policy without buy-in gets repealed","claim":"Carbon taxes imposed without consent collapse. France froze its carbon tax at 44.60 euros a tonne after the gilets jaunes in December 2018; Australia repealed its carbon price in July 2014 after one election; Canada zeroed its consumer carbon price on 1 April 2025. Only changes people choose for themselves survive a change of government, so durable impact is individual.","say":"Each repeal took the consumer-facing piece and left the rest. Canada kept the industrial price, which Ottawa calls its largest emissions policy. France froze its tax, it did not scrap it. Repeal needs a law.","detail":"France's carbon component rose from 7 euros in 2014 to 44.60 in 2018 and has been frozen there since, so the tax still prices carbon at the 2018 level. Canada's Finance Department zeroed the consumer fuel charge on 1 April 2025 and in the same notice said the price on large emitters will continue to be a pillar of the plan and is the single largest contributor to its targets; the Canadian Climate Institute projects the industrial systems deliver 20 to 48 percent of 2030 reductions against 8 to 14 for the consumer price (M4). Australia's carbon price ran 1 July 2012 to 1 July 2014; electricity emissions fell during it and, per Pitt & Sherry, rose again in the two months after repeal, which the consultancy tied to higher demand and lower renewable output, so the lever moved things in both directions (A3). Sweden's carbon tax has run since 1991 and cut transport emissions by 6 to 11 percent (OW08); Ontario's coal ban and the Montreal Protocol are still in force (M1, M2). Repeal is itself a policy act: it takes a legislature to undo a law.","if_they_push":"If they say backlash proves people decide: yes, through elections, which is the definition trap (F3). Durable rules exist: Sweden since 1991, Montreal since 1987, the Clean Air Act since 1970. The question is design, not whether policy works.","comeback":"Three repeals in three democracies in seven years show that whatever survives is the part voters never see. The moment the public feels a policy, it dies.","weak":false,"tags":["backlash","repeal","gilets jaunes","yellow vests","carbon tax","australia","abbott","canada","carney","poilievre","axe the tax","buy-in","consent","durable","reversible","f3","f1"],"phrasings":["The yellow vests killed Macron's carbon tax in weeks.","Australia repealed its carbon tax after two years. Canada axed its carbon tax in 2025.","Policy without buy-in triggers backlash and gets repealed.","Only change people choose for themselves lasts.","Every carbon tax gets voted out; habits do not."],"frames":["F3","F1"],"uses":["M4","M1","M2","OW08","A3"],"notes":"Re-fetched 8 Nov 2026: all four claim sources and all four rebuttal sources loaded and the figures are on the pages. The old say line's 'about three times the reductions' was Guilbeault's phrase and sits on no source on this card (M4 carries the Climate Institute ranges, two of its sources partial), so it is replaced with the Finance Canada page's own words, 'single largest contribution'. The Australian post-repeal rise is small (0.8 percent annualised over two months) and Scientific American links it to demand and lower renewable output rather than stating the repeal caused it; Wikipedia records Frontier Economics disputing that the price caused the earlier fall. Say 'rose again', not a big number. A judge may find the France point thin: a frozen tax is still a backlash win for them. Duplicates the claim on existing card A3 (policy is fragile and reversible); this card adds France and Australia.","sources":[{"title":"Removing the consumer carbon price, effective April 1, 2025","publisher":"Department of Finance Canada","year":2025,"url":"https://www.canada.ca/en/department-finance/news/2025/03/removing-the-consumer-carbon-price-effective-april-1-2025.html","finding":"Re-fetched. Fuel charge rates set to zero after 31 March 2025. 'A price on pollution for large emitters will continue to be a pillar of Canada's plan'; industrial carbon pricing called 'the climate policy with the single largest contribution to achieving our climate targets'. No 'three times' figure on the page.","verified":true},{"title":"A Low Ineffective French Carbon Tax Lies Frozen at 2018 Level","publisher":"Climate Scorecard","year":2020,"url":"https://www.climatescorecard.org/2020/03/the-dysfunctional-french-carbon-tax-is-frozen-at-2018-level/","finding":"Fetched. Tax frozen at 44.60 euros since 2018, not abolished.","verified":true},{"title":"Carbon Tax Repeal Boosts Australian Pollution","publisher":"Scientific American (Climatewire)","year":2014,"url":"https://www.scientificamerican.com/article/carbon-tax-repeal-boosts-australian-pollution/","finding":"Fetched. Pitt & Sherry: electricity emissions rose at a 0.8 percent annualised rate in the two months after the July 2014 repeal, 'bucking a nearly six-year long trend of decline'. Dated 3 September 2014.","verified":true},{"title":"Carbon pricing in Australia","publisher":"Wikipedia","year":2024,"url":"https://en.wikipedia.org/wiki/Carbon_pricing_in_Australia","finding":"Fetched. Electricity generator emissions down 9 percent six months after introduction; after repeal emissions resumed pre-tax growth.","verified":true}],"their_sources":[{"title":"France suspends fuel tax hikes amid 'yellow vest' protests","publisher":"Al Jazeera","year":2018,"url":"https://www.aljazeera.com/news/2018/12/4/france-suspends-fuel-tax-hikes-amid-yellow-vest-protests","finding":"Fetched. On 4 December 2018 PM Philippe announced a six-month moratorium on the planned fuel tax increases after three weeks of protests; Macron had framed the diesel tax as a climate measure.","verified":true},{"title":"A Low Ineffective French Carbon Tax Lies Frozen at 2018 Level","publisher":"Climate Scorecard","year":2020,"url":"https://www.climatescorecard.org/2020/03/the-dysfunctional-french-carbon-tax-is-frozen-at-2018-level/","finding":"Fetched. Rate rose from 7 euros (2014) to 44.60 (2018); the planned rise to 86.20 by 2022 was dropped after the yellow vests and the tax has been frozen at 44.60 since.","verified":true},{"title":"Carbon pricing in Australia","publisher":"Wikipedia","year":2024,"url":"https://en.wikipedia.org/wiki/Carbon_pricing_in_Australia","finding":"Fetched. Clean Energy Act 2011 took effect 1 July 2012; repeal received Royal Assent 17 July 2014, backdated to 1 July 2014.","verified":true},{"title":"Removing the consumer carbon price, effective April 1, 2025","publisher":"Department of Finance Canada","year":2025,"url":"https://www.canada.ca/en/department-finance/news/2025/03/removing-the-consumer-carbon-price-effective-april-1-2025.html","finding":"Fetched. Federal fuel charge rates set to zero after 31 March 2025; requirement for provinces to have a consumer-facing price removed.","verified":true}],"routes":[{"type":"deny","say":"France did not repeal its carbon tax, it froze it at the 2018 rate. Canada kept the industrial price. Two of their three examples are partial."},{"type":"turn","say":"Australia's electricity emissions fell under the price and rose within two months of repeal. The repeal proves the policy was doing the work."},{"type":"outweigh","say":"Grant three repeals. Montreal since 1987, the Clean Air Act since 1970, Sweden's carbon tax since 1991. Durable policy is the norm, repeal the exception."},{"type":"reframe","say":"Repeal is a law passed by a government. Their examples are policy changing policy, not individuals replacing it."}]},{"id":"CV03","side":"for","kind":"argument","angle":"legitimacy","strength":4,"title":"Lobbying captures governments, so citizens must act","claim":"Stigler showed regulation is acquired by the industry it governs. Oil and gas spent 137 million dollars lobbying Washington in 2023 and 72 million in the first half of 2024, against 16 million by environmental groups, and 2,456 fossil fuel lobbyists had passes at COP28, more than the ten most climate-vulnerable countries combined. A captured state cannot be the lever, so individuals must act directly.","say":"Lobbyists spend because the law decides. Nobody lobbies a household. With every lobbyist in the room, the Clean Air Act still cut common air pollutants 78 percent.","detail":"CL2: lobbying is proof of where the power sits. Oil and gas spent 137 million dollars on federal lobbying in 2023 because one rule binds every firm at once; no one spends that to change a shopper's mind. Capture is real and partial: the Acid Rain Program still cut power-plant SO2 96 percent (OW04), the Clean Air Act cut the six common pollutants 78 percent (M3), Montreal removed 99 percent of ozone-depleting substances (M2), and the EU ETS avoided about 1.2 billion tonnes (OW07). Stigler's thesis is that regulation is worth capturing because it has force; his examples were industries using the state to control entry and slow new firms, not pollution standards. The 2,456 lobbyists came to COP28 because treaty text sets markets. The remedy for capture is disclosure rules, courts and elections, which are policy (PL06). Individuals who want to beat the lobby organise to change the law, which is F3.","if_they_push":"If they say industry advertises to households more than it lobbies: advertising sells a product inside the rules, lobbying writes the rule that binds every product, and BP's footprint campaign was aimed at steering people away from policy (FR01). If they say capture makes policy weaker than it could be: agree, and weaker-than-possible is still larger than any measured individual effect (F1). Ask what a boycott does about a lobbyist.","comeback":"Industry spends far more advertising to households than lobbying Congress, so it fears the consumer more. And the lobby still blocked a US carbon price for thirty years and gutted the IRA in 2025.","weak":false,"tags":["lobbying","regulatory capture","stigler","revolving door","big oil","cop28","lobbyists","opensecrets","influence","corruption","exxon","api","captured","trust government","f1","f3"],"phrasings":["Governments are captured by the industries they regulate.","There were more fossil fuel lobbyists at COP28 than delegates from the most vulnerable countries.","Big oil spends more on lobbying than every green group combined.","You cannot trust governments to act when they are bought, so it is up to us.","Regulatory capture means policy serves polluters."],"frames":["F1","F3"],"uses":["CL2","M3","M2","OW04","OW07","PL06","FR01"],"notes":"Re-fetched 8 Nov 2026: InDepthNH (137 and 72 million, 16.3 million) and Down To Earth (2,456; 636; 503; 1,509) confirmed. OpenSecrets itself is blocked and the full-year 2024 total was not found. The Wikipedia capture page carries the Stigler quote and the entry-control point but does not attribute price regulation to him, so that source is now partial and the detail says 'control entry'. The 78 and 96 percent figures in the say and deny route rest on M3 and OW04, verified there. 'With every lobbyist in the room' is an inference, not a fetched fact; do not claim specific campaigns against the 1990 Amendments. The for_comeback is now the advertising point, because it hits 'nobody lobbies a household' directly; if_they_push answers it with FR01. Close to existing cards PF06 (captured policy calls gas green) and PL06 (courts as the remedy).","sources":[{"title":"Electric vehicle policy drives up federal lobbying spending in first half of 2024 (OpenSecrets data)","publisher":"InDepthNH, republishing OpenSecrets","year":2024,"url":"https://indepthnh.org/?p=4201988","finding":"Fetched. 137 million dollars oil and gas federal lobbying in 2023; the money is spent on Congress and agencies.","verified":true},{"title":"In whose interest? Close to 2,500 fossil fuel lobbyists present at COP28 climate talks","publisher":"Down To Earth, reporting Kick Big Polluters Out","year":2023,"url":"https://www.downtoearth.org.in/news/climate-change/in-whose-interest-close-to-2-500-fossil-fuel-lobbyists-present-at-cop28-climate-talks-reveals-analysis-93235","finding":"Fetched. Lobbyists registered for the negotiations, which is where rules are written.","verified":true},{"title":"Regulatory capture","publisher":"Wikipedia","year":2024,"url":"https://en.wikipedia.org/wiki/Regulatory_capture","finding":"Re-fetched. Stigler quote present: 'as a rule, regulation is acquired by the industry and is designed and operated primarily for its benefit', and 'every industry ... will seek to control entry'. The page does not tie Stigler's theory to price regulation; the price example (trucking, taxis) is in the history section and not attributed to him.","verified":"partial"}],"their_sources":[{"title":"Electric vehicle policy drives up federal lobbying spending in first half of 2024 (OpenSecrets data)","publisher":"InDepthNH, republishing OpenSecrets","year":2024,"url":"https://indepthnh.org/?p=4201988","finding":"Fetched. Oil and gas spent 72 million dollars on federal lobbying in the first half of 2024, on track to pass the 2023 total of 137 million; environmental groups spent 16.3 million in the same half.","verified":true},{"title":"In whose interest? Close to 2,500 fossil fuel lobbyists present at COP28 climate talks","publisher":"Down To Earth, reporting Kick Big Polluters Out","year":2023,"url":"https://www.downtoearth.org.in/news/climate-change/in-whose-interest-close-to-2-500-fossil-fuel-lobbyists-present-at-cop28-climate-talks-reveals-analysis-93235","finding":"Fetched. 2,456 fossil fuel lobbyists on the provisional list, up from 636 at COP27 and 503 at COP26; the ten most climate-vulnerable countries had 1,509 passes combined. 6 December 2023.","verified":true},{"title":"Regulatory capture (Stigler, The Theory of Economic Regulation, 1971)","publisher":"Wikipedia","year":2024,"url":"https://en.wikipedia.org/wiki/Regulatory_capture","finding":"Fetched. Quotes Stigler: 'as a rule, regulation is acquired by the industry and is designed and operated primarily for its benefit'.","verified":true}],"routes":[{"type":"turn","say":"Lobbying is the strongest evidence for our side. Industry spends 137 million dollars a year on Congress because one rule moves every firm. It does not lobby shoppers."},{"type":"deny","say":"Capture is partial, not total. The Acid Rain Program cut power plant sulfur dioxide 96 percent with the utility lobby in the room."},{"type":"reframe","say":"Their fix for capture is disclosure, courts and campaign finance rules. All of those are policy. They are arguing for better government, not for none."},{"type":"fallacy","say":"Some policy is captured, so no policy can work. That is one bad case standing in for every case."}]},{"id":"CV04","side":"for","kind":"argument","angle":"legitimacy","strength":3,"title":"China's clean air is authoritarian, not a model","claim":"The Against side's biggest air-quality win is China's 2013 action plan, PM2.5 down 42 percent. It was done by decree: in winter 2017 Hebei ordered 1.8 million households off coal before gas arrived, villages froze and children had lessons outdoors until the ministry let 28 cities burn coal again. Democracies cannot and should not govern that way, so the honest democratic lever is the individual.","say":"Legitimacy matters and it is not the motion. The motion is impact. Our measured wins are democratic: Ontario, the Clean Air Act, Montreal. Estonia, a democracy, leads the 2024 Environmental Performance Index.","detail":"Concede the Hebei winter as Caixin reported it: 1.8 million households scheduled, 700,000 more missed, stoves removed before gas arrived, 11 of 300 Quyang schools unheated, and a ministry notice letting 28 cities burn coal again. That is a failure of sequencing, not evidence that rules do not cut pollution: PM2.5 still fell 42 percent (OW10). Every other measured win we run is democratic: Ontario's legislated coal exit (M1), the Clean Air Act (M3, OW02), the Acid Rain Program (OW04), Norway's EV taxes (OW09), London's ULEZ (OW11), Ireland's bag levy (OW15). The 2024 EPI press release puts Estonia first after a 40 percent fall in emissions over a decade, and the US 34th. Povitkina (Environmental Politics, 2018, 144 countries) finds more democracy goes with lower CO2 where corruption is low. Our definition (F5) already requires a stable, legitimate government, so the authoritarian case is outside it.","if_they_push":"If they say only coercion gets China-scale results: Ontario cut power-sector emissions from 32.9 to 5.4 megatonnes with elections in between (M1). If they say democracies are too slow: that is an argument about design, and it concedes the lever.","comeback":"Your two biggest numbers, China's smog and Montreal, were imposed from the top. The democracies that priced carbon got repealed. Legitimacy and durability are the same problem.","weak":false,"tags":["china","authoritarian","legitimacy","democracy","hebei","coal to gas","decree","pm2.5","air pollution","environmental authoritarianism","coercion","freezing","top-down","beijing","f5","f1"],"phrasings":["Your best example is China, a dictatorship. Is that the model?","China cut smog by ripping coal stoves out of villages in winter. That is not policy, that is coercion.","Authoritarian environmental policy is not legitimate.","Democracies cannot do what Beijing did, so we need people to act.","Top-down environmentalism only works without consent."],"frames":["F5","F1"],"uses":["OW10","M1","M3","OW04","OW09","OW11","OW15"],"notes":"Re-fetched 8 Nov 2026: Caixin (1.8 million, 700,000, Zhuozhou, 11 of 300 schools, 28 cities, a family reinstalling its coal stove), AQLI (42.3 percent, 2.2 years), the EurekAlert EPI release (Estonia first with a 40 percent fall, Denmark 10th, US 34th, India 176th, no China rank) and the Povitkina abstract (144 countries, 1970 to 2011) all confirmed. The turn route used to say 'within weeks'; Caixin gives one household's month of idle gas and the ministry letter, so it now says 'when the gas failed and the ministry relented'. Povitkina cuts both ways: democracy helps only where corruption is low. Our F5 definition excludes authoritarian states, which a judge may see as convenient; lead with the democratic wins. No close duplicate in the corpus; OW10 is our own China card.","sources":[{"title":"Rural Farmers Freeze as Coal Cleanup Campaign Backfires","publisher":"Caixin Global","year":2017,"url":"https://www.caixinglobal.com/2017-12-07/rural-farmers-freeze-as-coal-cleanup-campaign-backfires-101182005.html","finding":"Fetched. Families whose gas supply failed reinstalled coal stoves; the ministry allowed 28 cities to resume coal where the switch was incomplete.","verified":true},{"title":"2024 Environmental Performance Index news release","publisher":"EurekAlert (Yale Center for Environmental Law and Policy)","year":2024,"url":"https://www.eurekalert.org/news-releases/1046877","finding":"Fetched. Estonia leads the 2024 rankings after a 40 percent fall in GHG over the decade; Denmark 10th; US ranked 34th; India 176th; China's emissions still rising (rank not given on the page).","verified":true},{"title":"The limits of democracy in tackling climate change","publisher":"Environmental Politics (Marina Povitkina), via Semantic Scholar record","year":2018,"url":"https://api.semanticscholar.org/graph/v1/paper/DOI:10.1080/09644016.2018.1444723?fields=title,abstract,year,authors,venue","finding":"Fetched abstract. 144 countries, 1970 to 2011: 'more democracy is only associated with lower CO2 emissions in low-corruption contexts'; where corruption is high, democracies do no better than authoritarian regimes.","verified":true},{"title":"China's National Air Quality Action Plan 2013","publisher":"Air Quality Life Index, EPIC, University of Chicago","year":2023,"url":"https://aqli.epic.uchicago.edu/post/china-national-air-quality-action-plan-2013","finding":"Fetched. 42.3 percent PM2.5 fall; 2.2 years of life expectancy if sustained.","verified":true}],"their_sources":[{"title":"China's National Air Quality Action Plan 2013","publisher":"Air Quality Life Index, EPIC, University of Chicago","year":2023,"url":"https://aqli.epic.uchicago.edu/post/china-national-air-quality-action-plan-2013","finding":"Fetched. PM2.5 exposure fell 42.3 percent 2013 to 2021; measures included bans on new coal plants in target regions, forced cuts or fuel switching, car number limits and a 5,000-station monitoring network.","verified":true},{"title":"Rural Farmers Freeze as Coal Cleanup Campaign Backfires","publisher":"Caixin Global","year":2017,"url":"https://www.caixinglobal.com/2017-12-07/rural-farmers-freeze-as-coal-cleanup-campaign-backfires-101182005.html","finding":"Fetched. Hebei planned to switch 1.8 million households off coal, missing about 700,000 more; in a Zhuozhou village only half the homes ordered to remove stoves had gas installed; 11 of 300 schools in Quyang unheated on 5 December; the environment ministry told 28 northern cities residents could keep burning coal where conversion was incomplete.","verified":true}],"routes":[{"type":"reframe","say":"The motion compares impact, not legitimacy. Our definition already requires a legitimate government, and our measured wins come from democracies."},{"type":"deny","say":"China is not our case. Ontario, the United States, Norway, Ireland and the EU are. Every one is a democracy that cut pollution by rule."},{"type":"outweigh","say":"Grant the Hebei winter. The same plan cut PM2.5 42 percent across China. A badly sequenced rule still outperformed any voluntary campaign on record."},{"type":"turn","say":"When the gas failed and the ministry relented, Hebei households went straight back to coal. Behaviour followed the rule in both directions."}]},{"id":"CV05","side":"for","kind":"argument","angle":"legitimacy","strength":2,"title":"Every policy begins with one person","claim":"Politicians, judges and authors are individuals. Rachel Carson wrote Silent Spring in 1962 and DDT was cancelled in 1972; Gaylord Nelson, one senator, called the first Earth Day and the EPA followed in December 1970; one minister signed the UK's net zero law in June 2019. Policy is just the name for what individuals do once they hold power, so individual action is logically prior and bigger.","say":"If signing a law is individual action, both sides of the motion are the same thing and there is nothing to debate. Carson's book came a decade before the ban, which came from an agency.","detail":"F3 and F5: our opening defined individual action as a single person acting without an organisation, and government as the institution with executive and legislative power. A minister signs because an office exists, and the signature binds because a statute says so. EPA's own history: Silent Spring (1962) stimulated public concern; the Department of Agriculture restricted some DDT uses in the late 1950s and 1960s; EPA, created December 1970, cancelled DDT in 1972. Bald eagles went from 417 pairs to over 71,000 after the ban and legal protection (OW16); the order did that, not the book. The UK's 2050 target moved from 80 to 100 percent by a statutory instrument made 26 June 2019 under the Climate Change Act 2008: an individual signed, an Act gave the signature force. If every official act is individual action, the motion collapses into 'individuals acting through government beat individuals acting alone', which is our case (F6).","if_they_push":"Ask them to apply the definition consistently: if a minister's signature is individual action, so is a lobbyist's cheque and a dictator's decree, and their legitimacy argument collapses. Then ask what Carson's book cut before 1972.","comeback":"Offices do not act, people do. Without Carson there is no public concern and without Nelson no EPA. You cannot name the policy without naming the person.","weak":false,"tags":["politicians are individuals","definition","rachel carson","silent spring","gaylord nelson","earth day","skidmore","one person","leader","begins with","signature","epa","ddt","semantics","f3","f5","f6"],"phrasings":["Every policy you name began with one person deciding to act.","Politicians are individuals too. A minister signing a law is individual action.","Rachel Carson, one woman with a book, got DDT banned.","Without Gaylord Nelson there is no Earth Day and no EPA.","Government is just individuals with titles."],"frames":["F3","F5","F6"],"uses":["OW16"],"notes":"Re-fetched 8 Nov 2026: EPA DDT history (Silent Spring 1962, USDA actions in the late 1950s and 1960s, EPA cancellation 1972), EPA origins (Reorganization Plan July 1970, Ruckelshaus confirmed 2 December 1970, Nelson not mentioned), gov.uk net zero release (27 June 2019, Skidmore) and SI 2019/1056 (made 26 June 2019, 80 to 100 percent) all confirmed. The say line had two numbers (1962 and 'a decade'); it now carries one. The Gaylord Nelson link to Earth Day is on the EPA Earth Day page cited on GL05, not on the pages here. The eagle figures rest on OW16. A definitional move; the answer is F3, and a judge who accepts their broad definition will see the debate as a wash rather than a For win. Duplicates existing cards BH06 (policy is made of individuals) and TC01 (engineers and voters are individuals too); also overlaps GL05 on Carson.","sources":[{"title":"DDT: A Brief History and Status","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/ingredients-used-pesticide-products/ddt-brief-history-and-status","finding":"Fetched. USDA restricted uses in the late 1950s and 1960s; EPA cancelled DDT in 1972, ten years after Silent Spring.","verified":true},{"title":"The Origins of EPA","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/history/origins-epa","finding":"Fetched. EPA created by a presidential reorganization plan approved by Congress; first Administrator confirmed 2 December 1970.","verified":true},{"title":"The Climate Change Act 2008 (2050 Target Amendment) Order 2019","publisher":"legislation.gov.uk","year":2019,"url":"https://www.legislation.gov.uk/uksi/2019/1056/made","finding":"Fetched. SI 2019/1056, made 26 June 2019, substitutes 100 percent for 80 percent in section 1(1) of the Climate Change Act 2008.","verified":true}],"their_sources":[{"title":"DDT: A Brief History and Status","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/ingredients-used-pesticide-products/ddt-brief-history-and-status","finding":"Fetched. Carson published Silent Spring in 1962, which 'stimulated widespread public concern'; EPA cancelled DDT in 1972.","verified":true},{"title":"The Origins of EPA","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/history/origins-epa","finding":"Fetched. Nixon's reorganization plan July 1970; Ruckelshaus confirmed 2 December 1970; Silent Spring 1962 named. Page does not mention Gaylord Nelson.","verified":true},{"title":"UK becomes first major economy to pass net zero emissions law","publisher":"UK Government (BEIS)","year":2019,"url":"https://www.gov.uk/government/news/uk-becomes-first-major-economy-to-pass-net-zero-emissions-law","finding":"Fetched. 27 June 2019; Chris Skidmore signed legislation committing the UK to net zero by 2050, replacing the 80 percent target, on the Committee on Climate Change's recommendation.","verified":true}],"routes":[{"type":"reframe","say":"A definition that makes every law an individual act leaves nothing on the other side of the motion. The signature binds because the statute exists."},{"type":"deny","say":"Carson did not ban DDT. The Agriculture Department restricted it, then EPA cancelled it in 1972, a decade after the book."},{"type":"fallacy","say":"They are swapping the person for the office. The impact came from the power of the office, so crediting the person proves nothing about individuals without one."},{"type":"turn","say":"Carson, Nelson and Skidmore all reached for the state. Their examples are individuals concluding that only policy would work."}]},{"id":"CV06","side":"for","kind":"argument","angle":"legitimacy","strength":3,"title":"Local democracy beats national policy","claim":"The people closest to a problem govern it best. Porto Alegre's participatory budgeting, where residents vote the budget, took water and sewer connections from 75 to 98 percent of households between 1988 and 1997, and Gonçalves found Brazilian municipalities with participatory budgets shifted spending to sanitation and health and saw infant mortality fall. More than 2,700 governments have copied it. Citizens deciding directly outperform distant ministries.","say":"Participatory budgeting is a city government spending a city budget. Our definition counts municipal policy as policy. The residents voted; the city, funded by tax, laid the pipe to 98 percent of homes.","detail":"F5 defines government as municipal, provincial or federal, so Porto Alegre's budget process is government policy by our opening's terms, and a good one. WRI reports connections rose from about 75 to 98 percent by 1997, health and education budgets from 13 to about 40 percent, and participation from under 1,000 to about 40,000 people. The Workers' Party administration ran it from 1989; a new administration suspended it in 2017, which is policy switching off (A3 logic). Gonçalves (World Development, 2014) finds the mechanism is the municipal budget: PB cities spent more on sanitation and health and infant mortality fell. On Ostrom, use MK07: her principles include monitoring, graduated sanctions and recognition by higher authorities, and the atmosphere has no local user group (FR03). Local democracy is a design for policy, not a substitute for it (CL1).","if_they_push":"If they say the citizens, not the council, made the decision: the decision bound only because the council adopted it and the treasury paid. If they say local beats national: Ontario's coal exit and the Clean Air Act were provincial and federal, and no city could have done either (M1, M3).","comeback":"You are calling citizens voting on their own money 'government'. By that logic any group of people who organise is a government, and your side has no content left.","weak":false,"tags":["participatory budgeting","porto alegre","local democracy","subsidiarity","community","grassroots","ostrom","municipal","citizens assembly","deliberative","town hall","bottom-up","sanitation","brazil","f5","f2"],"phrasings":["Porto Alegre let citizens set the budget and sewer coverage went from 75 to 98 percent.","Local, participatory democracy outperforms national policy every time.","When people decide for themselves, the money goes where it is needed.","Thousands of cities copied participatory budgeting because it works better than ministries.","Decisions made by the community beat decisions made in the capital."],"frames":["F5","F2"],"uses":["MK07","FR03","CL1","M1","M3"],"notes":"Re-fetched 8 Nov 2026: WRI confirms 75 to 98 percent by 1997, 13 to about 40 percent for health and education (no year given), under 1,000 to about 40,000 participants (1990 to 1999), more than 2,700 governments, Workers' Party 1989, PSDB suspension for two years in 2017 citing lack of resources. RePEc abstract confirms 1990 to 2004, larger shares to sanitation and health, lower infant mortality, no effect sizes. The World Bank primary document was not opened and the '46 to 98 percent sewer' figure sometimes quoted is unconfirmed, so the card uses 75 to 98. The 27 megatonnes in the outweigh route is 32.9 minus 5.4 from M1. Close to existing card MK07 (Ostrom); expect them paired, and route four points there.","sources":[{"title":"What If Citizens Set City Budgets?","publisher":"World Resources Institute","year":2018,"url":"https://www.wri.org/insights/what-if-citizens-set-city-budgets-experiment-captivated-world-participatory-budgeting","finding":"Fetched. PB was introduced by the Workers' Party city administration in 1989; the PSDB administration suspended it for two years in 2017 citing lack of resources.","verified":true},{"title":"The Effects of Participatory Budgeting on Municipal Expenditures and Infant Mortality in Brazil","publisher":"World Development 53 (Gonçalves), via IDEAS/RePEc","year":2014,"url":"https://ideas.repec.org/a/eee/wdevel/v53y2014icp94-110.html","finding":"Fetched abstract. The effect runs through municipal spending on sanitation and health.","verified":true}],"their_sources":[{"title":"What If Citizens Set City Budgets? An Experiment That Captivated the World, Participatory Budgeting, Might Be Abandoned in its Birthplace","publisher":"World Resources Institute","year":2018,"url":"https://www.wri.org/insights/what-if-citizens-set-city-budgets-experiment-captivated-world-participatory-budgeting","finding":"Fetched. Sewer and water connections rose from about 75 to 98 percent by 1997; health and education budgets from 13 to about 40 percent; participation from under 1,000 (1990) to about 40,000 (1999); adopted by more than 2,700 governments; Porto Alegre suspended PB in 2017.","verified":true},{"title":"The Effects of Participatory Budgeting on Municipal Expenditures and Infant Mortality in Brazil","publisher":"World Development 53 (Sónia Gonçalves), via IDEAS/RePEc","year":2014,"url":"https://ideas.repec.org/a/eee/wdevel/v53y2014icp94-110.html","finding":"Fetched abstract. Brazilian municipalities 1990 to 2004 using PB directed a larger share of budgets to sanitation and health, and infant mortality fell.","verified":true}],"routes":[{"type":"reframe","say":"A participatory budget is a government budget with a different voting rule. By our definitions, that is municipal policy, and we are glad to claim it."},{"type":"turn","say":"Porto Alegre suspended the programme in 2017 when a new administration came in. The gains lived and died with city policy."},{"type":"outweigh","say":"Grant the pipes. A city cannot close a coal fleet or set a car standard; Ontario's provincial coal ban cut power-sector emissions by about 27 megatonnes a year."},{"type":"deny","say":"Ostrom's commons were fisheries and irrigation with known users. She said durable rules need monitoring, sanctions and a higher authority that lets the group organise."}]},{"id":"CV07","side":"for","kind":"argument","angle":"legitimacy","strength":2,"title":"Government is itself a top polluter","claim":"The US Department of Defense emitted 59 million tonnes of CO2 equivalent in 2017, more than Portugal, Sweden or Denmark, ranking 55th among countries, per Crawford's Costs of War study. The institution asked to save the environment is one of its largest single polluters. You cannot expect the arsonist to run the fire brigade, so cut your own footprint instead.","say":"The Pentagon's emissions are about one percent of the US total, and they fell from their peak because the department set fuel goals. Only a budget vote can cut them further. No household can.","detail":"Crawford (Boston University, Costs of War, 2019) gives 59 million tonnes CO2e for DoD in 2017, down from a peak of 85 million in 2004, and ranks it 55th if it were a country. EPA's inventory puts total gross US emissions in 2017 at about 6,457 million tonnes, so DoD is about 0.9 percent. Crawford credits the fall to renewable purchases, weatherised buildings, less aircraft idling and Mattis's goal of unleashing the force from fuel; her prescription is for Congress and the president to reconsider missions. Every one of those is a policy decision. Concede that governments pollute, then note that this is a reason to vote budgets, not to change light bulbs (CL2, FR06). The For side cannot name an individual action that reduces a military's fuel burn.","if_they_push":"If they say a hypocrite cannot lead: hypocrisy is about who deserves credit, not about what works. The same government that fuels the Pentagon cut the six common pollutants 78 percent (M3).","comeback":"One percent of US emissions is still more than most countries emit, and you have just admitted the government is the one actor nobody can vote out of its own fuel.","weak":false,"tags":["pentagon","military","department of defense","dod","government polluter","hypocrisy","crawford","costs of war","jets","bases","fuel","state emissions","public sector","arsonist","f1","f6"],"phrasings":["The Pentagon emits more than Sweden. Government is the polluter.","The US military is the biggest institutional consumer of fossil fuels on earth.","How can the state be the solution when it is one of the largest polluters?","Governments pollute more than any household ever could.","If the Pentagon were a country it would rank in the top sixty emitters."],"frames":["F1","F6"],"uses":["CL2","FR06","M3"],"notes":"Re-fetched 8 Nov 2026: Crawford's figures (59 million tonnes 2017, 85 million peak 2004, 55th, ahead of Portugal, Sweden and Denmark; fall credited to renewables, weatherisation, less idling and Mattis's fuel goal; call on Congress and the president) confirmed on the DeSmog copy of her Conversation article. The Watson PDF returns 410. The EPA inventory PDF was downloaded and the 6,456.7 MMT sentence read in the extracted text, so that source is now verified true; 59 of 6,457 is 0.9 percent. The 'about 30 percent' fall is 85 to 59, computed. Duplicates existing cards PF07 (governments are the biggest polluters) and FL11 (tu quoque); PF07 runs the Carbon Majors version, this one the Pentagon version.","sources":[{"title":"The Defense Department Is Worried About Climate Change, and Also a Huge Carbon Emitter","publisher":"DeSmog, republishing Neta Crawford in The Conversation","year":2019,"url":"https://www.desmog.com/2019/06/17/defense-department-worried-climate-change-huge-carbon-emitter","finding":"Fetched. Peak 85 million tonnes (2004) to 59 million (2017); fall credited to renewables, weatherisation, reduced idling and Mattis's fuel goal; Crawford calls on Congress and the president to reconsider missions.","verified":true},{"title":"Inventory of U.S. Greenhouse Gas Emissions and Sinks 1990-2017, Chapter 2 Trends","publisher":"US EPA","year":2019,"url":"https://19january2021snapshot.epa.gov/sites/static/files/2019-04/documents/us-ghg-inventory-2019-chapter-2-trends.pdf","finding":"Re-fetched and read with pdftotext. 'In 2017, total gross U.S. greenhouse gas emissions were 6,456.7 MMT, or million metric tons, carbon dioxide (CO2) Eq.' The trends table repeats 6,456.7 for 2017.","verified":true}],"their_sources":[{"title":"The Defense Department Is Worried About Climate Change, and Also a Huge Carbon Emitter","publisher":"DeSmog, republishing Neta Crawford in The Conversation","year":2019,"url":"https://www.desmog.com/2019/06/17/defense-department-worried-climate-change-huge-carbon-emitter","finding":"Fetched. DoD emitted over 59 million tonnes CO2e in 2017, down from a peak of 85 million in 2004; as a country it would rank 55th, ahead of Portugal, Sweden and Denmark.","verified":true},{"title":"Pentagon Fuel Use, Climate Change, and the Costs of War","publisher":"Watson Institute, Brown University (Neta Crawford)","year":2019,"url":"https://watson.brown.edu/costsofwar/files/cow/imce/papers/Pentagon%20Fuel%20Use%2C%20Climate%20Change%20and%20the%20Costs%20of%20War%20Revised%20November%202019%20Crawford.pdf","finding":"PDF link returned 410 Gone; figures taken from Crawford's own article above.","verified":false}],"routes":[{"type":"outweigh","say":"Grant 59 million tonnes. It is under one percent of US emissions. Power generation and industry, which rules govern, are the bulk of the rest."},{"type":"turn","say":"The Pentagon's emissions fell by about 30 percent from the 2004 peak because the department set fuel targets. A government polluter cut itself by policy."},{"type":"reframe","say":"Who pollutes is not the motion. The motion asks which lever cuts more. Only an appropriations bill can cut a military's fuel burn; no household can."},{"type":"fallacy","say":"That the messenger pollutes says nothing about whether the rule works. Attacking the source is not an answer to the measured cuts."}]},{"id":"CV08","side":"for","kind":"argument","angle":"legitimacy","strength":1,"title":"Votes are rare, choices are daily","claim":"You vote once every four years, one ballot among millions, and in 2025 Canadians could not even vote to keep a carbon price. Meanwhile, by Wansink's count, you make about 226 food decisions every day. Daily choices are continuous, individual and yours; the ballot is occasional and diluted, so lifestyle is where the impact lives.","say":"Hundreds of small choices, all inside a menu someone else wrote. One vote helps write the menu for everyone. And their food decisions figure comes from a researcher Cornell found committed misconduct.","detail":"F2 and F4: the daily choices are made from options that policy set, which grid, which transit, which products are legal (FR04). Wansink and Sobal's 226 decisions a day comes from 139 Cornell staff and students; Cornell concluded in September 2018 that Wansink committed academic misconduct, and Retraction Watch counted 17 retractions by December 2018. That paper was not retracted, but it is not a number to rest a case on. Infrequency is not weakness: Canada's one 2025 decision moved the consumer price for every household at once, which is exactly our point about scale (CL1). Continuous but unpriced behaviour produced no measured national fall; a 15 cent levy cut Irish bag use about 90 percent in a year (OW15).","if_they_push":"If they say votes are diluted: so is one shopper among 40 million. The difference is that the vote aggregates into a rule that binds everyone, and the shopping does not (FR03).","comeback":"Even if Wansink is unreliable, nobody disputes that people make far more consumption decisions than ballots. The point stands without the number.","weak":false,"tags":["voting","ballot","every four years","daily choices","226 decisions","wansink","food decisions","diluted","one vote","continuous","every day","consumer","habits","turnout","f2","f4"],"phrasings":["You vote once every four years but you eat three times a day.","People make over 200 food decisions a day. That is where the impact is.","One vote in millions changes nothing; your daily choices are all yours.","Elections are rare and diluted; consumption is constant.","You cannot vote for the climate every day, but you can choose every day."],"frames":["F2","F4"],"uses":["FR04","FR03","CL1","OW15"],"notes":"Re-fetched 8 Nov 2026: BPS digest confirms 226 decisions against an estimate of 14 from 139 participants (the page does not say who they were); Retraction Watch confirms 17 retractions and Cornell's 27 September 2018 letter that Wansink 'committed academic misconduct in his research and scholarship'. The Sage journal page returns 403. Jab only. The 2007 paper itself has not been retracted; say 'a researcher Cornell found committed misconduct', not 'a retracted study'. The Canadian 2025 point is on CV02 and M4. Close to existing card C5 (voting is individual action), which argues the opposite framing of the ballot; read both.","sources":[{"title":"The Joy of Cooking, vindicated: journal retracts two more Brian Wansink papers","publisher":"Retraction Watch","year":2018,"url":"https://retractionwatch.com/2018/12/05/the-joy-of-cooking-vindicated-journal-retracts-two-more-brian-wansink-papers","finding":"Fetched. Total retraction count 17, one paper retracted twice; Cornell's 27 September 2018 letter concluded Wansink 'committed academic misconduct in his research and scholarship'.","verified":true},{"title":"Mindless eating: the food decisions we don't realise we're making","publisher":"British Psychological Society Research Digest","year":2007,"url":"https://www.bps.org.uk/research-digest/mindless-eating-food-decisions-we-dont-realise-were-making","finding":"Fetched. The 226 figure rests on 139 participants' self-reports.","verified":true}],"their_sources":[{"title":"Mindless eating: the food decisions we don't realise we're making","publisher":"British Psychological Society Research Digest, reporting Wansink and Sobal, Environment and Behavior 39(1), 2007","year":2007,"url":"https://www.bps.org.uk/research-digest/mindless-eating-food-decisions-we-dont-realise-were-making","finding":"Fetched. Participants averaged 226 food decisions a day against an estimate of 14; 139 participants asked the estimate question.","verified":true},{"title":"Mindless Eating: The 200 Daily Food Decisions We Overlook","publisher":"Environment and Behavior 39(1) (Wansink and Sobal)","year":2007,"url":"https://journals.sagepub.com/doi/10.1177/0013916506295573","finding":"Publisher page returned 403 and the abstract was not readable; figure taken from the BPS digest.","verified":false}],"routes":[{"type":"deny","say":"The food decisions number comes from a researcher Cornell found committed misconduct, with 17 retractions. Do not rest a case on it."},{"type":"reframe","say":"Daily choices are made from a menu. The vote they dismiss is how the menu gets written, which concedes that policy sets the options."},{"type":"turn","say":"They are right that a vote is rare, and it still moved Canada's carbon price for every household at once. That is scale, and it is our side."}]},{"id":"CV09","side":"for","kind":"argument","angle":"legitimacy","strength":4,"title":"Civil disobedience changed the law","claim":"Direct action moves governments that lobbying cannot. Extinction Rebellion shut central London in April 2019 with 1,130 arrests; within a week the Commons declared a climate emergency and within two months the UK legislated net zero by 2050. The Hambach forest occupation and Ende Gelände forced Germany's coal exit and saved the forest. Standing Rock put Indigenous land rights on the map. Individuals in the road did what ministers would not.","say":"Each of their wins is a law. The emergency motion was non-binding; the thing that bound was a statutory instrument. Hambach was saved by the coal exit act. Dakota Access has pumped oil since 2017.","detail":"F3: protest that succeeds does so by producing policy, and the tonnes are the policy's. The 1 May 2019 Commons motion was an Opposition Day motion that passed unopposed; Reuters called it non-binding with no direct consequences for policy. The binding change was the Climate Change Act 2008 (2050 Target Amendment) Order 2019, made 26 June 2019, substituting 100 percent for 80 percent on the Committee on Climate Change's recommendation; the government's release does not mention the protests. Germany's Bundestag passed the coal exit law on 3 July 2020, ending lignite by 2038 at the latest with 2.6 billion euros to RWE, and RWE's own release says the Hambach forest stays. Standing Rock: the Army Corps granted the easement in February 2017, the pipeline has operated since, a 2020 shutdown order was stayed, and the Corps signed a new record of decision in May 2026 keeping it open. Protest can change a government's mind (B7, C2); the environment changes only when the government then acts. Under F5, XR is an organisation, not an individual.","if_they_push":"If they say the law would not exist without the protest: perhaps, and the protest would have cut nothing without the law. Causation runs through the state, which is the motion's comparison. Ask them what Standing Rock stopped.","comeback":"Name one policy that cut emissions without a movement pushing it first. The law is the receipt; the people are the purchase.","weak":false,"tags":["extinction rebellion","xr","civil disobedience","direct action","protest","standing rock","dapl","ende gelande","hambach","arrests","climate emergency","net zero","blockade","occupation","movement","f3","f5","f1"],"phrasings":["Extinction Rebellion got the UK to declare a climate emergency and pass net zero within weeks.","Over a thousand people got arrested and Parliament moved. That is individual action.","The Hambach forest was saved by people sitting in trees, not by politicians.","Standing Rock showed that ordinary people can stand up to a pipeline.","Civil disobedience works where lobbying and voting fail."],"frames":["F3","F5","F1"],"uses":["B7","C2","M5"],"notes":"Re-fetched 8 Nov 2026: all seven sources loaded. XR statement (more than 1,130 arrests, 25 May 2019), climateemergencydeclaration (1 May 2019, Reuters 'no direct consequences for policy'), gov.uk release (CCC recommendation, no mention of protests), SI 2019/1056 (26 June 2019), RWE (3 July 2020, 2038, 2.6 billion euros, 'der Hambacher Forst bleibt erhalten'), Tagesspiegel (26 January 2019, 'wünschenswert', court halt, law still needed), Harvard tracker (easement 8 February 2017, shutdown order stayed August 2020 and reversed January 2021, record of decision 21 May 2026, new suit October 2026). The 314 to 237 Bundestag tally was from search excerpts and is removed from the detail; 'passed without a division' is not on the page and now reads 'passed unopposed'. The Hambach clearing was also halted by a 2018 court order, itself state action. Strong card for them because the UK timeline is tight; our answer depends on the judge accepting F3. Close to existing cards C2 (Greta and the strikes) and B7.","sources":[{"title":"United Kingdom: Bipartisan UK Parliament declares a climate emergency","publisher":"climateemergencydeclaration.org","year":2019,"url":"https://climateemergencydeclaration.org/united-kingdom-bipartisan-uk-parliament-declares-a-climate-emergency/","finding":"Fetched. Describes the motion as non-binding with 'no direct consequences for policy' (quoting Reuters).","verified":true},{"title":"UK becomes first major economy to pass net zero emissions law","publisher":"UK Government (BEIS)","year":2019,"url":"https://www.gov.uk/government/news/uk-becomes-first-major-economy-to-pass-net-zero-emissions-law","finding":"Fetched. 27 June 2019 release attributes the target to the Committee on Climate Change's recommendation; no mention of protests or Extinction Rebellion.","verified":true},{"title":"The Climate Change Act 2008 (2050 Target Amendment) Order 2019","publisher":"legislation.gov.uk","year":2019,"url":"https://www.legislation.gov.uk/uksi/2019/1056/made","finding":"Fetched. The binding instrument, made 26 June 2019.","verified":true},{"title":"Kohleausstieg nach zwei Jahren gesetzlich geregelt","publisher":"RWE AG press release","year":2020,"url":"https://www.rwe.com/presse/rwe-ag/2020-07-03-kohleausstieg-nach-zwei-jahren-gesetzlich-geregelt/","finding":"Fetched. The forest's preservation is written into the 3 July 2020 law and RWE's settlement.","verified":true},{"title":"Dakota Access Pipeline regulatory tracker","publisher":"Harvard Law School Environmental & Energy Law Program","year":2026,"url":"https://eelp.law.harvard.edu/tracker/dakota-access-pipeline/","finding":"Fetched. Operating since 2017; record of decision 21 May 2026 keeps it running; new tribal suit filed October 2026.","verified":true},{"title":"Der Hambacher Wald ist gerettet","publisher":"Tagesspiegel","year":2019,"url":"https://www.tagesspiegel.de/politik/der-hambacher-wald-ist-gerettet-5541646.html","finding":"Fetched. The commission's wording was only that preservation is 'desirable'; the law had to follow.","verified":true}],"their_sources":[{"title":"Extinction Rebellion statement on Met police call for 1,130 protesters to be charged","publisher":"Extinction Rebellion UK","year":2019,"url":"https://extinctionrebellion.uk/?p=4720","finding":"Fetched. More than 1,130 people arrested during non-violent civil disobedience in London in April 2019; statement dated 25 May 2019.","verified":true},{"title":"United Kingdom: Bipartisan UK Parliament declares a climate emergency","publisher":"climateemergencydeclaration.org","year":2019,"url":"https://climateemergencydeclaration.org/united-kingdom-bipartisan-uk-parliament-declares-a-climate-emergency/","finding":"Re-fetched. Motion moved 1 May 2019; the page quotes Reuters calling it non-binding with 'no direct consequences for policy'; a Daily Mail excerpt calls forcing the vote one of XR's key demands; Corbyn praised XR's activism. The page does not say whether a division was held.","verified":true},{"title":"The Climate Change Act 2008 (2050 Target Amendment) Order 2019","publisher":"legislation.gov.uk","year":2019,"url":"https://www.legislation.gov.uk/uksi/2019/1056/made","finding":"Fetched. Made 26 June 2019; 80 percent to 100 percent.","verified":true},{"title":"Kohleausstieg nach zwei Jahren gesetzlich geregelt","publisher":"RWE AG press release","year":2020,"url":"https://www.rwe.com/presse/rwe-ag/2020-07-03-kohleausstieg-nach-zwei-jahren-gesetzlich-geregelt/","finding":"Fetched. Law passed 3 July 2020; lignite out by 2038 at the latest; 2.6 billion euros compensation to RWE; 'der Hambacher Forst bleibt erhalten'.","verified":true},{"title":"Der Hambacher Wald ist gerettet","publisher":"Tagesspiegel","year":2019,"url":"https://www.tagesspiegel.de/politik/der-hambacher-wald-ist-gerettet-5541646.html","finding":"Fetched. Coal commission compromise of 26 January 2019 called preserving the forest 'desirable'; protests and a court order had halted clearing; a law still had to implement it.","verified":true},{"title":"Dakota Access Pipeline regulatory tracker","publisher":"Harvard Law School Environmental & Energy Law Program","year":2026,"url":"https://eelp.law.harvard.edu/tracker/dakota-access-pipeline/","finding":"Fetched. Easement approved 8 February 2017; pipeline operating since 2017; 2020 shutdown order stayed and reversed; Corps record of decision 21 May 2026 keeps it operating with conditions.","verified":true}],"routes":[{"type":"reframe","say":"Each example ends with a statute or a court order. Protest is the input; policy is the output; the tonnes belong to the output."},{"type":"deny","say":"The Commons declaration was non-binding and the net zero order followed the climate committee's advice; the government's release never mentions the protest. Dakota Access is still pumping."},{"type":"turn","say":"Protesters demanded a law, got a law and called it victory. Their best evidence that policy matters is that they fought for it."},{"type":"fallacy","say":"After the protest, therefore because of it. The 2050 target came from a climate committee report, and the forest from a coal commission compromise."}]},{"id":"CV10","side":"for","kind":"argument","angle":"legitimacy","strength":3,"title":"Philanthropy outpaces government","claim":"Private individuals now out-deliver states. Jeff Bezos pledged 10 billion dollars to the Earth Fund and has granted 2.4 billion. Michael Bloomberg's Beyond Coal campaign, launched with his 50 million dollars in 2011, claims about 390 of 530 US coal plants retired or committed to retire, more than any federal rule achieved. One rich person's chequebook moved faster than Congress.","say":"Beyond Coal's lawyers win at utility commissions and in court. That is policy enforcement with a donor's cheque. Climate philanthropy is a rounding error next to clean energy investment of two trillion dollars a year.","detail":"Canary Media (December 2025) reports Beyond Coal's 390-plant count and describes how it works: campaign lawyers argue before state utility commissions on ratepayer cost, as in Oklahoma, where they won at the state Supreme Court in 2018 though the utility proceeded anyway, and worked with Minnesota regulators to redirect Xcel's plans. Those are regulatory proceedings, so the mechanism is policy and the donor pays for access to it (F3, CL2). EIA attributes coal retirements to an ageing fleet and competition from gas and renewables, and the Mercury and Air Toxics Standards, finalised February 2012, hit the same fleet, so the campaign's count includes plants closing for other reasons. The Bezos Earth Fund has granted 2.4 billion dollars against a 10 billion pledge. ClimateWorks puts all climate giving at about 2.1 percent of global philanthropy in 2024, with mitigation funding about 6 billion dollars, while IEA puts clean energy investment at about 2 trillion dollars in 2024, much of it steered by tariffs, mandates and credits (OW14, OW18). Under F5 a foundation is an organisation, not an individual.","if_they_push":"If they say the two trillion is private capital: it flows where mandates, tariffs and credits point it, which is why solar got cheap in Germany and China first (OW14, OW18). If they say Bloomberg bought outcomes governments would not deliver: he bought lawyers to make regulators deliver them, which is policy working. If they say money is money: CBO scored the IRA's energy and climate provisions at roughly 400 bill
