 and just below 4 C at Paris adoption. The gap is still large, but the reduction came from governments, not household choices.","tags":["climate action tracker","paris agreement","warming projection","current policies","unep","emissions gap","ndc","2.6c","2100"],"best_against":["policy is failing","we are on track for 4 degrees anyway","government action is too slow to matter"],"notes":"UNEP site returned 403; the UNEP figures were verified via PBL (Dutch agency) and other summaries. Caveat: CAT attributes the fall to the Paris Agreement as a whole; some decline reflects cheaper renewables. Also expect For side to say the gap remains and warming outlook has been flat for four years.","sources":[{"title":"Global Update COP30 release","publisher":"Climate Action Tracker","year":2025,"url":"https://climateactiontracker.org/press/release-global-update-2025/","finding":"Current policies 2.6 C; in 2015 3.6 C; reduced by roughly 1 C.","verified":true},{"title":"Emissions Gap Report 2025","publisher":"UNEP","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Current policies up to 2.8 C; earlier just below 4 C at Paris.","verified":true}],"their_sources":[]},{"id":"OW18","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"US IRA: a large projected cut, then rollback","say":"Independent modelling put the 2022 Inflation Reduction Act at roughly 31 to 44 percent below 2005 emissions by 2030, and analysts say the 2025 repeal of its credits stalls that progress, showing policy sets the trajectory.","detail":"Rhodium Group's preliminary 2022 analysis found 31 to 44 percent below 2005 levels by 2030 with the IRA, against about 24 to 35 without. In 2025 the One Big Beautiful Bill Act substantially repealed IRA credits and Princeton REPEAT estimated it adds about 190 million tonnes of emissions in 2030 and about 470 million in 2035 relative to prior executive actions.","tags":["inflation reduction act","ira","rhodium","repeat project","princeton","tax credits","repeal","2025","united states","policy reversal"],"best_against":["policy gets repealed","policy is not durable","US policy does not matter"],"notes":"NOT verified: I found only secondary summaries; no primary Rhodium number for the post-repeal outcome. The 'policy gets repealed' attack is double-edged: a rollback proves policy moves emissions. Check Rhodium and REPEAT PDFs before using any number. Corrected detail after verification: 'early analyses from Princeton REPEAT and Rhodium said it effectively stops the emissions decline' -> 'Princeton REPEAT estimated it adds about 190 million tonnes of emissions in 2030 and about 470 million in 2035 relative to prior executive actions'.","sources":[{"title":"A Congressional Climate Deal: Emissions Effects of the Inflation Reduction Act","publisher":"Rhodium Group","year":2022,"url":"https://rhg.com/research/inflation-reduction-act","finding":"With IRA: 31% to 44% below 2005 levels in 2030 (central 40%); without: 24% to 35%; labelled preliminary.","verified":true,"note":"Fetched Rhodium page. Rhodium's later full report revised this to 32-42%."},{"title":"REPEAT: Zero Lab on the OBBB","publisher":"Princeton ZERO Lab / REPEAT Project","year":2025,"url":"https://zenodo.org/records/15801701","finding":"REPEAT summary (3 July 2025): the bill adds about 190 Mt/yr of US emissions in 2030 and about 470 Mt in 2035 vs administration executive actions (about 2% and 7% of 2005 emissions).","verified":"partial","note":"Fetched Zenodo record. It does not use the wording 'effectively stops the emissions decline', and no Rhodium OBBB analysis was checked."}],"their_sources":[]},{"id":"FR01","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"BP popularised the personal carbon footprint","say":"The idea that you should measure your own carbon footprint was pushed by BP's 2004 Ogilvy campaign, which launched a footprint calculator, reporting 278,000 uses that year. Individual blame was an oil company marketing frame.","detail":"Ogilvy created the 'carbon footprint' for BP's Beyond Petroleum campaign. Mashable's Mark Kaufman and Julie Doyle's analysis of archived BP pages argue the framing assigned responsibility to individuals. BP itself says it cannot document why it built the calculator, so claim 'popularised', not 'invented to deflect'.","tags":["carbon footprint","bp","ogilvy","2004","framing","responsibility","calculator","greenwashing","marketing","kaufman"],"best_against":["individual responsibility is the root of the problem","everyone should cut their carbon footprint first"],"notes":"The Mashable article is dated July 2020, not 2021, and is by Kaufman; it is not Supran & Oreskes (they wrote on ExxonMobil), so do not cite Supran & Oreskes for this. I could not open the Mashable page; the details come from search summaries. Safe wording: 'popularised'. Carbon footprint concept was around before BP (ecological footprint, 1990s); do not say 'invented'.","sources":[{"title":"The carbon footprint sham","publisher":"Mashable (Mark Kaufman)","year":2020,"url":"https://mashable.com/feature/carbon-footprint-pr-campaign-sham","finding":"BP hired Ogilvy & Mather; calculator unveiled 2004; 'In 2004 alone, 278,000 people calculated their footprints'; Doyle concludes BP assigns responsibility to the individual.","verified":true,"note":"Got the article HTML via plain curl. Article does not contain a BP statement that it cannot document why it built the calculator; that detail is unsourced here."},{"title":"Ogilvy (profile)","publisher":"DeSmog","year":2020,"url":"https://www.desmog.com/ogilvy/","finding":"'BP reported that in 2004, 278,000 people calculated their carbon footprint using the tool on its website'; Ogilvy created the carbon footprint concept for BP's Beyond Petroleum campaign in 2004.","verified":true,"note":"Fetched DeSmog Ogilvy profile (first 100k of 133k characters)."}],"their_sources":[]},{"id":"FR02","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Individual-action talk crowds out policy support","say":"Two Nature Climate Change papers find that promoting personal action reduces support for carbon taxes. In Werfel's Japan experiments reporting energy-saving made people about 13 percent less likely to back one.","detail":"Werfel (2017) surveyed over 14,000 Japanese respondents; those asked to report energy-saving after Fukushima were less likely to support a carbon tax. Hagmann, Ho and Loewenstein (2019) ran six experiments where a green default nudge cut support for the tax, for example 70 to 55 percent in one summary. Effects are small to moderate and do not erase support.","tags":["crowding out","nudges","carbon tax","werfel","hagmann","loewenstein","nature climate change","policy support","moral licensing","public opinion"],"best_against":["individual action inspires policy change","personal action creates a movement","nudges are a cheap complement"],"notes":"Werfel is in Nature Climate Change (2017, vol 7, 512-515), not PNAS; paywalled and unfetched, details from secondary summaries including Raimi's comment 'effects are small'. Hagmann 70 to 55 is from a secondary summary (tabledebates); the PDF was unreadable. Authors Ho and Loewenstein say nudges are complements; expect For to quote that.","sources":[{"title":"Household behaviour crowds out support for climate change policy when sufficient progress is perceived","publisher":"Nature Climate Change 7","year":2017,"url":"https://www.sciencedaily.com/releases/2017/06/170613130052.htm","finding":"ScienceDaily: those given the energy-saving checklist were 'about 13 percent less likely to support the government tax'; a separate recycling item gave 15%.","verified":"partial","note":"Nature page redirects to login. 13% confirmed on fetched press coverage; 14,000 respondents from search summary; Hagmann 2019 part not checked."},{"title":"Nudging out support for a carbon tax","publisher":"Nature Climate Change 9","year":2019,"url":"https://www.cmu.edu/dietrich/sds/docs/loewenstein/nudgingcarbontax.pdf","finding":"Green energy default nudge reduced carbon tax support across six experiments.","verified":true}],"their_sources":[]},{"id":"FR03","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Voluntary action cannot beat a collective-action problem","say":"Garrett Hardin's tragedy of the commons shows each person gains from emitting while the cost is shared, so voluntary restraint unravels. Even Ostrom, who showed communities can govern commons, found it takes rules and enforcement.","detail":"Hardin (Science, 1968): herders capture the full gain of an extra animal and share the loss. Ostrom (Nobel 2009, Governing the Commons, 1990) found durable commons governance needs design principles such as monitoring and graduated sanctions. The atmosphere is a global commons with no local community able to monitor it.","tags":["collective action","tragedy of the commons","hardin","ostrom","free rider","commons","enforcement","public goods","governance","nobel"],"best_against":["people will do the right thing voluntarily","communities self-organise","moral persuasion is enough"],"notes":"Citations are well known, but the pages were not fetched this session. The Ostrom point cuts both ways (shows voluntary governance can work at community scale); frame as 'needs rules, not goodwill'. Hardin's own coercive population solutions are widely criticised; use only the logic.","sources":[{"title":"The Tragedy of the Commons","publisher":"Science 162","year":1968,"url":"https://dlc.dlib.indiana.edu/dlc/items/873da5c8-6a7c-4071-a358-1b5b74e87332/full","finding":"Abstract: herder 'gains all the profit from that addition, while bearing only a fraction of its costs in overgrazing, which are shared by all'; leads to ruin; 'mutual coercion mutually agreed upon'.","verified":true,"note":"science.org returned 403; read the Indiana University repository copy of the 1968 paper."},{"title":"Governing the Commons","publisher":"Cambridge University Press (Elinor Ostrom)","year":1990,"url":"https://www.nobelprize.org/prizes/economic-sciences/2009/ostrom/facts/","finding":"Nobel 2009 'for her analysis of economic governance, especially the commons' (search excerpt from nobelprize.org); laureate page says users establish rules over time to use resources sustainably.","verified":"partial","note":"Nobel pages returned 403 on fetch, so only search excerpts. The design principles (monitoring, graduated sanctions) were not seen on any page I fetched."}],"their_sources":[]},{"id":"FR04","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"You cannot buy a clean grid","say":"An electric car cuts lifecycle emissions by 66 to 69 percent in Europe but only 19 to 34 percent in India, per the ICCT. The buyer's choice is the same; the grid, set by policy, decides the result.","detail":"ICCT's 2021 lifecycle study of medium-sized cars registered in 2021 finds lifetime emissions lower by 66-69 percent in Europe, 60-68 in the US, 37-45 in China and 19-34 in India relative to gasoline cars. The gap widens as grids decarbonise. Consumers choose among vehicles and tariffs that regulators and utilities make available.","tags":["grid mix","electric vehicles","icct","lifecycle","choice architecture","infrastructure","policy","india","europe","options available"],"best_against":["consumer choices drive emissions","buy an EV and you are done","green consumerism is enough"],"notes":"Ranges confirmed in search snippet quoting the ICCT paper; the ICCT page was not fetched. A November 2022 correction changed some European country values, not the headline ranges.","sources":[{"title":"A global comparison of the life-cycle GHG emissions of combustion engine and electric passenger cars","publisher":"ICCT (Bieker)","year":2021,"url":"https://theicct.org/publication/a-global-comparison-of-the-life-cycle-greenhouse-gas-emissions-of-combustion-engine-and-electric-passenger-cars/","finding":"BEV lifetime emissions 66-69% lower (Europe), 60-68% (US), 37-45% (China), 19-34% (India).","verified":true}],"their_sources":[]},{"id":"FR05","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"IPCC: demand-side potential needs enabling policy","say":"The IPCC's 2022 report finds demand-side strategies could cut emissions in buildings, land transport and food by 40 to 70 percent by 2050 relative to baseline scenarios, but it ties that to infrastructure, policy and system change, not to people simply trying harder.","detail":"Chapter 5 of Working Group III (Creutzig et al.) uses Avoid-Shift-Improve and gives the 40-70 percent potential. The potential is conditional on cities, buildings, transport systems and incentives that make low-carbon options available and normal. So the best 'individual' lever depends on the choice architecture set by governments.","tags":["ipcc","ar6","demand-side","avoid shift improve","infrastructure","enabling conditions","40-70%","lifestyle","policy","chapter 5"],"best_against":["IPCC says individuals can cut 40-70 percent","demand-side changes are individual","lifestyle change is the largest lever"],"notes":"IPCC pages returned 403. 40-70% by 2050 is confirmed via ORF and other secondary coverage; the second order draft said 50-80%, cite final. The exact enabling-conditions wording was NOT retrieved: check SPM C.10 and Ch5 executive summary before saying 'requires'. Expect For to quote the 40-70% as 'individual action'; answer that the report says it is enabled by policy and infrastructure. Corrected say after verification: 'demand-side measures could cut end-use emissions 40 to 70 percent by 2050' -> 'demand-side strategies could cut emissions in buildings, land transport and food by 40 to 70 percent by 2050 relative to baseline scenarios'.","sources":[{"title":"AR6 WGIII Chapter 5: Demand, services and social aspects of mitigation","publisher":"IPCC","year":2022,"url":"https://www.ipcc.ch/report/ar6/wg3/chapter/chapter-5/","finding":"Chapter 5: indicative potential of demand-side strategies in three end-use sectors (buildings, land transport, food) is 40-70% globally by 2050 (high confidence); SPM: relative to baseline scenarios.","verified":true,"note":"ipcc.ch fetches returned 403; quoted text came from ipcc.ch-domain search excerpts (chapter page, SPM, errata). Wording is three sectors, not all end-use emissions."}],"their_sources":[]},{"id":"FR06","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Most emissions sit in power and industry","say":"Power generation is about 38 percent of global CO2, industry about 29, and aviation only about 2 percent in commonly cited estimates. The big levers are systems individuals do not control.","detail":"Secondary summaries of IEA data put power at roughly 38 percent of 2023 CO2, industry at roughly 29 percent and ground transport 19 to 21 percent. Aviation is about 2 percent of energy CO2. Flying less matters personally but cannot move the global sectoral totals the way a grid or steel decision does.","tags":["iea","sectors","power sector","industry","aviation","transport","emissions share","co2 2023","energy","systems"],"best_against":["flying less, eating less meat, driving less are the main levers","individual lifestyle is where emissions come from"],"notes":"Weak verification: percentages came from secondary sites (Statista-type), not the IEA page, and definitions differ (transport 18.6 vs 21%). Household consumption drives final demand, so For will say all sectors serve consumers. Check IEA Emissions data explorer; do not cite shares until confirmed. Corrected say after verification: 'and aviation only about 2 percent in IEA-based figures' -> 'and aviation only about 2 percent in commonly cited estimates'.","sources":[{"title":"CO2 Emissions in 2023","publisher":"IEA","year":2024,"url":"https://www.iea.org/reports/co2-emissions-in-2023","finding":"IEA page gives only the headline (global energy CO2 +1.1% in 2023); sector shares of about 38% power, 29% industry, 21% transport appear in Statista and a secondary site, not on the fetched IEA page.","verified":"partial","note":"Fetched IEA page, no sector breakdown. WebSearch found Statista (power ~38%, transport just over 21%) and a green-tech site (38.4% power, 29% industry, ground transport 18.6%). Aviation 2% not found as a share of energy CO2 (a Statista 2% is a share of transport GHG)."}],"their_sources":[]},{"id":"FR07","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Wynes and Nicholas's 'one fewer child' is contested","say":"The widely cited claim that one fewer child saves 58.6 tonnes a year multiplies by descendants' emissions, and published critiques say it counts them multiple times. Their own car-free and flight figures are about 2.4 and 1.6 tonnes.","detail":"Wynes and Nicholas (2017, Environmental Research Letters) reviewed 39 sources and ranked 'one fewer child' first. van Basshuysen and Brandstedt (ERL 2018) argued multiple counting and ignoring net-zero trajectories; Pedersen and Lam (2018) argued the paper ignored collective and professional-sphere action. Use it to show that the biggest personal levers are the least accountable.","tags":["wynes","nicholas","environmental research letters","one fewer child","car-free","flights","critique","van basshuysen","accounting","personal footprint"],"best_against":["individuals can cut 58 tonnes by one choice","personal choices are the biggest lever","IPCC-type individual actions dominate"],"notes":"Critique existence confirmed in search; the original ERL page was not fetched and 58.6 is from the user prompt. Individual values: 2.4 t (car-free), 1.6 t (one transatlantic flight avoided) per secondary blog. Use carefully: it also shows that the paper's top lifestyle actions are large per person. Do not call the paper wrong; say 'contested accounting'.","sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters 12","year":2017,"url":"https://iopscience.iop.org/article/10.1088/1748-9326/aa7541","finding":"Wynes and Nicholas 2017: one fewer child 58.6 tCO2e/yr, car-free 2.4 tCO2e/yr, avoiding a transatlantic round-trip flight 1.6 tCO2e per flight; 39 sources, 148 scenarios.","verified":true,"note":"Fetched the IOP page; figures stated. The critiques (van Basshuysen and Brandstedt; Pedersen and Lam) were not checked."},{"title":"Comment on 'The climate mitigation gap'","publisher":"Environmental Research Letters 13 (van Basshuysen & Brandstedt)","year":2018,"url":"https://ui.adsabs.harvard.edu/abs/2018ERL....13f9501V/abstract","finding":"Argues the child figure involves multiple counting and ignores net-zero scenarios.","verified":true}],"their_sources":[]},{"id":"FR08","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Carbon Majors: use the 71% honestly","say":"CDP's 2017 Carbon Majors report links 100 fossil fuel producers to 71 percent of industrial emissions since 1988. It counts the fuel's combustion by customers, so the point is that supply is governed by policy, not that consumers are blameless.","detail":"The Carbon Majors figure includes scope 3, meaning emissions from burning the fuel they sell, and 59 percent is attributed to state-owned producers. That is why the lever is energy policy on extraction, subsidies and standards. Concede that consumers burn the fuel; argue that they cannot shift a supply system without rules.","tags":["carbon majors","cdp","71%","100 companies","scope 3","state-owned","fossil fuel producers","supply side","accountability","1988"],"best_against":["blaming companies is just deflection","consumers are responsible for the demand","corporate emissions are just consumer emissions"],"notes":"CDP figures confirmed via search results quoting the release (page not fetched). Explicit caveat: scope 3 includes consumers' combustion; a critic notes cumulative accounting is a political choice. Do not say '100 companies cause 71% of emissions' without 'linked to', 'since 1988', 'including the fuel sold'. The 2024 update (78 entities, 1854-2022) is a different version.","sources":[{"title":"New report shows just 100 companies are source of over 70% of emissions","publisher":"CDP","year":2017,"url":"https://www.cdp.net/press-releases/new-report-shows-just-100-companies-are-source-of-over-70-of-emissions","finding":"100 active fossil fuel producers linked to 71% of industrial GHG emissions since 1988.","verified":true},{"title":"The Carbon Majors Database: Launch Report","publisher":"InfluenceMap","year":2024,"url":"https://carbonmajors.org/briefing/The-Carbon-Majors-Database-26913","finding":"Over 70% of historical CO2 traced to 78 entities in the 2024 update.","verified":true}],"their_sources":[]},{"id":"FR10","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Both matter, but policy is the multiplier","say":"We do not say individuals do nothing. We say policy sets the options, prices and defaults for hundreds of millions of people at once, which is why every measured success we have shown was a policy.","detail":"One household's choice changes one household. A standard, tax or ban changes every purchase in a jurisdiction: Norway's tax rules moved a whole car market to 89 percent EVs, Ontario's coal closures cut sector emissions from 32.9 to 5.4 Mt. Hagmann and colleagues also frame nudges as complements to, not substitutes for, standard policy.","tags":["multiplier","scale","policy","defaults","norway","ontario","complement","measured position","closing","framing"],"best_against":["it is not either/or","both are needed","individuals set the culture that policy follows"],"notes":"A summary frame resting on other entries, with sources reused. The 'multiplier' framing is argument, not a measured statistic. The Ho/Loewenstein complement point comes from a Fordham interview in search results, not from the paper.","sources":[{"title":"Norway achieves 89 per cent EV share in 2024","publisher":"electrive (citing OFV)","year":2025,"url":"https://www.electrive.com/2025/01/02/norway-achieves-89-per-cent-ev-share-in-2024","finding":"88.9% of new cars electric in 2024.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2015,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG from 32.9 Mt to 5.4 Mt, 2005 to 2014.","verified":true}],"their_sources":[]},{"id":"FP02","side":"for","kind":"argument","angle":"consumption","strength":5,"title":"Rich individuals' choices dominate emissions","claim":"The top 10% of people emit about 48% of global emissions and the bottom half about 12%. Impact is concentrated in a small number of individuals whose discretionary choices (flying, big homes, SUVs, investments) swing the total, so individual action by high emitters outweighs any average policy effect.","say":"Agreed, emissions are concentrated at the top. That is the case for policy aimed at the top: a flight levy or a progressive carbon price reaches the top 10 percent in a way volunteering does not.","detail":"Chancel reports the top 10 percent emitting about 48 percent of the global total in 2019 and the bottom half about 12. We concede the fact. Concentration means a rule on high-emission activities (flying, large vehicles, investment) captures a large share with few levers, while appeals to individual conscience must reach each person. Nielsen et al. also list high-status people as citizens and organisational participants, i.e. acting through institutions.","if_they_push":"Concentration tells you where to aim, not what aims. Ask for one group of top emitters that cut voluntarily at scale; a levy reaches all of them at once. If they say policy has not reached them either, that is a reason to pull the lever, not to ask nicely (F1).","comeback":"If the top 10 percent cause half the emissions, their own choices are the decision, and no government has ever touched them.","weak":true,"tags":["top 10 percent","top 1 percent","carbon inequality","chancel","oxfam","rich","wealthy","concentration","frequent flyers","private jets","investors","bottom 50","f1"],"phrasings":["the top 1% is the problem, so the rich need to change","10% of people cause half of emissions","it's not everyone, it's the wealthy flyers"],"frames":["F1"],"uses":[],"notes":"Replaced the sweeping 'nothing voluntary has ever reached the top 10 percent' with a challenge they must answer. Weak because we concede their premise and have no measured example of a policy aimed at top emitters; a judge may hear that as policy not yet working.","sources":[{"title":"Global carbon inequality over 1990-2019","publisher":"Nature Sustainability / WID.world (Chancel)","year":2022,"url":"https://wid.world/document/global-carbon-inequality-1990-2019-wid-world-working-paper-2021-22","finding":"2019: top 10% about 48% of emissions, bottom 50% about 12%.","verified":true},{"title":"The role of high-socioeconomic-status people in locking in or rapidly reducing energy-driven GHG emissions","publisher":"Nature Energy (Nielsen et al.)","year":2021,"url":"https://doi.org/10.1038/s41560-021-00900-y","finding":"High-status people act as consumers, investors, role models, organisational participants and citizens. Abstract confirmed via search only.","verified":true}],"their_sources":[{"title":"Global carbon inequality over 1990-2019","publisher":"Nature Sustainability / WID.world working paper (Chancel)","year":2022,"url":"https://wid.world/document/global-carbon-inequality-1990-2019-wid-world-working-paper-2021-22","finding":"In 2019 the top 10% emitted about 48% of global emissions and the bottom 50% about 12% (WIR 2022 gives 47.6% and 12%). Figures confirmed via search results; page itself not fetched.","verified":true},{"title":"Confronting Carbon Inequality","publisher":"Oxfam / Stockholm Environment Institute","year":2020,"url":"https://www.oxfam.de/system/files/documents/20200921-confronting-carbon-inequality.pdf","finding":"1990-2015 cumulative emissions: richest 10% 52%, richest 1% about 15%, poorest 50% 7%. Confirmed via search summary.","verified":true},{"title":"The role of high-socioeconomic-status people in locking in or rapidly reducing energy-driven GHG emissions","publisher":"Nature Energy (Nielsen, Nicholas, Creutzig, Dietz, Stern)","year":2021,"url":"https://doi.org/10.1038/s41560-021-00900-y","finding":"High-status people act as consumers, investors, role models, organisational participants and citizens; disproportionate leverage on emissions. Abstract confirmed via search only.","verified":true}],"routes":[{"type":"reframe","say":"Their own source lists high-status people acting as citizens, investors and organisational participants, through institutions. That influence runs through policy and firms, not personal consumption (F3)."},{"type":"outweigh","say":"Grant the concentration, then ask for a group of top emitters that cut voluntarily at scale. Ontario cut about 27 megatonnes a year without asking anyone (M1)."},{"type":"turn","say":"Concentration is the case for policy: a flight levy or progressive carbon price reaches the top 10 percent at once; appeals to conscience must persuade each of them."},{"type":"fallacy","say":"Knowing where emissions sit tells you where to aim, not what aims. They have assumed the top emitters will volunteer because they could."}]},{"id":"FP03","side":"for","kind":"argument","angle":"consumption","strength":4,"title":"Diet is the biggest lever you control","claim":"Poore and Nemecek's analysis of about 38,700 farms found that dropping animal products could cut an individual's food footprint by up to 73% and, applied globally, cut farmland by about 3.1 billion hectares. Beef emissions range tenfold between producers, so what a person chooses to eat matters more than any plausible agricultural regulation.","say":"A scenario, not a result: that is what one person could save if they did it. The same paper argues for producer monitoring, targets and labels, so it is policy as much as plates.","detail":"Poore and Nemecek (about 38,700 farms) show what a diet shift would do if made. Our World in Data, drawing on the same work, says three-quarters of agricultural land is used for livestock, which gives 18 percent of calories (earlier draft said 'about half', which was wrong). The paper also argues for producer monitoring, flexible targets and consumer labelling, but it ranks dietary change as the largest single individual lever, so do not claim the paper is mainly about policy. A diet shift also depends on a menu that policy shapes, such as prices and labels (F2). We have not verified the exact 73 percent figure from the paper, so we do not quote it.","if_they_push":"Ask how many people have actually made the full shift, and for the measured drop in national meat emissions; we will show Ontario's measured coal result (M1). Their number is what one person could do; ours is what a province did (F1).","comeback":"Even this policy-minded paper concludes that avoiding animal products is the single biggest thing an individual can do, and you can start tonight.","weak":false,"tags":["diet","vegan","plant based","meat","dairy","beef","poore","nemecek","land use","food emissions","73 percent","3.1 billion hectares","what we eat","f1","f2"],"phrasings":["going vegan cuts your footprint by 73%","meat is the single biggest thing you can change","diet beats any farm policy"],"frames":["F1","F2"],"uses":["M1","A4"],"notes":"Corrected OWID: livestock use three-quarters of farmland, not about half. Rewrote say to carry no unverified number and to avoid overstating what the paper concludes; corrected 38,000 to 38,700 farms.","sources":[{"title":"Reducing food's environmental impacts through producers and consumers","publisher":"Science (Poore & Nemecek)","year":2018,"url":"https://doi.org/10.1126/science.aaq0216","finding":"Poore and Nemecek: 38,700 farms, about 50-fold impact variation among producers, authors argue producer monitoring and labelling; 73% and 3.1bn ha not found.","verified":"partial","note":"Science page 403 and PubMed cookie wall. Confirmed via WebSearch result excerpts from mirrors, not the publisher page. Source finding says about 38,000; mirrors say 38,700, matching the detail."},{"title":"Environmental impacts of food production","publisher":"Our World in Data","year":2022,"url":"https://ourworldindata.org/environmental-impacts-of-food","finding":"Three-quarters of agricultural land is used for livestock, which provide 18% of global calories and 37% of protein. Page fetched and confirmed.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG 32.9 Mt (2005) to 5.4 Mt (2014); coal banned by the Ending Coal for Cleaner Air Act, 2015.","verified":true}],"their_sources":[{"title":"Reducing food's environmental impacts through producers and consumers","publisher":"Science (Poore & Nemecek)","year":2018,"url":"https://doi.org/10.1126/science.aaq0216","finding":"Largest meta-analysis of food systems; avoiding animal products is the single biggest way to reduce an individual's impact (up to 73% lower footprint; about 3.1 billion ha less land). The 49% global emissions and 76% land-use figures usually quoted from the abstract could not be confirmed here (Science page returned 403), so quote 73% and 3.1bn ha only.","verified":false},{"title":"Environmental impacts of food production","publisher":"Our World in Data","year":2022,"url":"https://ourworldindata.org/environmental-impacts-of-food","finding":"Livestock use about half of agricultural land yet give just 18% of calories and 37% of protein; beef ranges 9 to 105 kg CO2e per 100 g protein. Page fetched and confirmed.","verified":true}],"routes":[{"type":"deny","say":"A scenario: what a single eater could save if they did it. Ask how many made the full shift, and for the measured drop in national meat emissions (F1)."},{"type":"reframe","say":"The same paper calls for producer monitoring, flexible targets and labelling. Plates sit inside prices, labels and farm rules that policy writes (F2)."},{"type":"outweigh","say":"Grant the plate. Their figure is an eater's potential; Ontario's coal phase-out is a province's measured result, about 27 megatonnes a year (M1)."},{"type":"fallacy","say":"Beef varying tenfold between producers is a producer fact, not a consumer fact. A shopper cannot see which farm it came from without a label, and labels are policy."}]},{"id":"FP05","side":"for","kind":"argument","angle":"consumption","strength":4,"title":"Policy fails unless people comply","claim":"Every policy is implemented through individual behaviour. California's 2015 mandatory 25% urban water cut delivered 96% of its target, about 1.19 million acre-feet, only because residents actually cut lawn watering. When households do not comply, the policy has zero effect, so individual action is the binding constraint on policy impact, not the reverse.","say":"That is a policy result. The state set the target, tracked it monthly, and the Water Board reports it hit 96 percent of that target. The earlier voluntary call fell well short.","detail":"California's 2015 order cut urban water use by about 1.19 million acre-feet against a 1.24 goal, 96 percent, June 2015 to February 2016 (cumulative saving 23.9 percent against the 25 percent mandate). Households did the actual watering less, but the target, the monthly tracking and the fines (up to $500 a day, authorised July 2014) are policy. The Governor's 2014 voluntary 20 percent call was running near 7 percent in January 2015 per an AP follow-up of state figures, and the Board's own survey showed a 1 percent rise in May 2014 (sources differ; do not quote 9 percent). If compliance is the binding constraint, enforcement is the policy lever. It is also a water case, not an emissions one, and the 25 percent order was relaxed in 2016.","if_they_push":"Every policy runs through people, as every purchase runs through a shop. The 2014 voluntary call asked and got under half its target; the 2015 order set the rule and got 96 percent (F2, F4).","comeback":"The mandate achieved nothing until millions of households actually changed how they water, so individual compliance is the binding constraint on any policy.","weak":false,"tags":["compliance","enforcement","water ban","drought","california","behaviour","implementation","speed limits","recycling rates","policy depends","adoption","residents","f2"],"phrasings":["a law nobody follows saves nothing","policy is just a request that people have to act on","the water ban only worked because households cut back"],"frames":["F2"],"uses":[],"notes":"Cut say to one number and added the voluntary-versus-mandate contrast, which answers the comeback. Added that the saving was 23.9 percent against 25 and that the voluntary-call figure is unverified. Corrected detail after verification: 'reached about 9 percent by January 2015 (SWRCB, per search summaries; sources differ)' -> 'was running near 7 percent in January 2015 per an AP follow-up of state figures, and the Board's own survey showed a 1 percent rise in May 2014 (sources differ; do not quote 9 percent)'.","sources":[{"title":"California water conservation: 25 percent mandate results","publisher":"California State Water Resources Control Board","year":2016,"url":"https://www.waterboards.ca.gov/press_room/press_releases/2015/pr060215_water_conservation.pdf","finding":"About 1.19 maf saved June 2015 to Feb 2016, 96% of the 1.24 maf goal; 23.9% cumulative vs 25% mandate. Confirmed via several news reports of the April 2016 Board announcement; PDF not opened.","verified":true},{"title":"California voluntary 2014 conservation call vs 2015 mandate","publisher":"SWRCB figures via news summaries","year":2015,"url":"https://www.waterboards.ca.gov/conservation/docs/factsheet/assessing_compliance.pdf","finding":"State report: June 2015 to Feb 2016 cumulative savings 23.9% vs 25% mandate; about 1.19 million acre-feet against 1.24 million goal = 96%. Voluntary 2014 call: about 7% in January 2015 per AP; 8.8% or 9% not found.","verified":"partial","note":"Cited SWRCB PDF 404; fact sheet PDF unreadable (compressed). WebSearch excerpts give 96%, 1.19, 1.24, 23.9% and the Feb 29 2016 end date, but one WaterWorld piece ties 23.9% to June 2015 to March 2016, so the period is not fully pinned. $500/day fines approved July 15 2014 confirmed by NPR/KPBS/CSM."}],"their_sources":[{"title":"California water conservation: 25 percent mandate results","publisher":"California State Water Resources Control Board (press releases 2015-2016)","year":2016,"url":"https://www.waterboards.ca.gov/press_room/press_releases/2015/pr060215_water_conservation.pdf","finding":"Savings of about 1.19 million acre-feet June 2015 to Feb 2016, 96% of the 1.24 maf goal; savings varied month to month (December 2015 saw 18.3% vs the 25% target). Figures confirmed via search summary; PDF not opened.","verified":true},{"title":"One drop at a time: California surpasses water conservation target","publisher":"Christian Science Monitor","year":2015,"url":"https://csmonitor.com/Environment/2015/0730/One-drop-at-a-time-California-surpasses-water-conservation-target","finding":"June 2015 use fell 27%, above the target, showing household response drives the outcome.","verified":true},{"title":"Speed-limit and recycling-participation compliance data","publisher":"not sourced","year":2026,"url":"","finding":"No verified statistic found for speed-limit non-compliance or recycling participation rates; keep the argument conceptual and do not quote a number.","verified":false}],"routes":[{"type":"deny","say":"Compliance was not spontaneous: the earlier voluntary call was running near 7 percent, far short; the mandate with fines got most of the way to target."},{"type":"reframe","say":"Compare the two Californian asks: a voluntary request and a mandate with fines. Same households, different instrument, very different result. The instrument is policy (F6)."},{"type":"turn","say":"That is a policy result: the state set the target, tracked it monthly, fined non-compliance, and hit most of its goal. The voluntary call before it fell short."},{"type":"fallacy","say":"Every policy runs through people, as every purchase runs through a shop. That people are the channel does not make them the cause (F2)."}]},{"id":"FP06","side":"for","kind":"argument","angle":"consumption","strength":4,"title":"A behavioural wedge needs no new law","claim":"Dietz et al. found that 17 household actions, using only interventions that already worked and no new regulation, could cut US household direct emissions by about 20%, 123 million tonnes of carbon per year by year 10, equal to about 7.4% of national emissions. That is bigger than most single federal climate programs, achieved purely through household behaviour.","say":"Dietz's own abstract says the interventions behind that 7.4 percent 'typically combine several policy tools and strong social marketing'. It is also a potential, not a measured result.","detail":"Dietz et al. estimate 123 Mt carbon a year by year 10, about 20 percent of household direct emissions and 7.4 percent of US emissions, as a 'reasonably achievable potential' based on interventions that 'typically combine several policy tools and strong social marketing' (abstract, fetched). The abstract does not say the programs needed no regulation; that was the For side's gloss, so do not repeat it. So the wedge is what programs could achieve at national scale; it is not a claim that households would do it unprompted (F1).","if_they_push":"Then compare like with like: show us a US year in which household actions were measured delivering 7.4 percent. Ontario's coal phase-out was measured at about 27.5 Mt a year (M1); the Clean Air Act's 78 percent (M3) is a different pollutant but the same kind of evidence (F1).","comeback":"Dietz's wedge shows household action alone is worth 7.4 percent of US emissions, more than most single climate programs.","weak":false,"tags":["behavioral wedge","dietz","household actions","7.4 percent","123 million tonnes","us emissions","no regulation","habits","efficiency behaviour","adoption","stern","f1"],"phrasings":["you don't need Congress to cut 7% of US emissions","household actions alone are a fifth of household emissions","the behavioural wedge is bigger than most laws"],"frames":["F1"],"uses":["M3"],"notes":"Dietz quotes verified from the fetched abstract. Removed unsupported 'none needed new regulation' and 'delivered through utilities, incentives and campaigns'; made if_they_push compare like with like since the Clean Air Act covers other pollutants.","sources":[{"title":"Household actions can provide a behavioral wedge to rapidly reduce US carbon emissions","publisher":"PNAS (Dietz et al.)","year":2009,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2767367/","finding":"Abstract (fetched): 123 Mt carbon/yr in year 10, about 20% of household direct emissions, 7.4% of national; based on interventions that 'typically combine several policy tools and strong social marketing'; a 'reasonably achievable potential'.","verified":true}],"their_sources":[{"title":"Household actions can provide a behavioral wedge to rapidly reduce US carbon emissions","publisher":"PNAS (Dietz, Gardner, Gilligan, Stern, Vandenbergh)","year":2009,"url":"https://pmc.ncbi.nlm.nih.gov/articles/2767367/","finding":"National implementation could save an estimated 123 Mt carbon per year in year 10: about 20% of household direct emissions, 7.4% of national emissions, with little loss of well-being. Confirmed via search of abstract; paper not opened (PNAS 403).","verified":true}],"routes":[{"type":"deny","say":"Dietz's abstract says those interventions typically combine several policy tools and strong social marketing. The claim that no regulation was needed is their gloss, not the paper's."},{"type":"reframe","say":"A wedge delivered by programs that combine policy tools is policy. The household is where the saving appears; the program is why it appears (F2)."},{"type":"outweigh","say":"Grant the potential, then ask for a year in which household action measurably delivered it. The Clean Air Act's cut in the six common pollutants is measured, not modelled (M3)."},{"type":"fallacy","say":"It is a reasonably achievable potential, in the authors' words, not a measured result. Potential is being presented as delivery (F1)."}]},{"id":"FP07","side":"for","kind":"argument","angle":"consumption","strength":3,"title":"Household food waste is 60% of all waste","claim":"UNEP's Food Waste Index says the world wasted about 1.05 billion tonnes of food in 2022 and households were responsible for 631 million tonnes, 60%, averaging 79 kg per person. Food loss and waste is responsible for roughly 8 to 10% of global greenhouse gas emissions, and the single biggest slice is in your fridge.","say":"Fair fact. But that counts tonnes of food wasted, not emissions avoided, and the emissions figure they quote covers the whole chain. Ask what has measurably cut household waste, and by what.","detail":"UNEP's Food Waste Index 2024: 1.05 billion tonnes wasted in 2022, households 631 Mt (60 percent), food service 290 Mt, retail 131 Mt. The 8 to 10 percent emissions figure is for all food loss and waste, farm to fork. Do not claim the household share of those emissions is small: waste at the fridge carries all upstream emissions, so it could be large; the figure is not broken out here. We concede households waste a lot; whether packaging, date labels and collection rules shape that is our argument (F2), and we have no measured figure on it.","if_they_push":"Waste mass is not measured avoided emissions: ask what reduction has been realised and by what, and compare with a regulation that has been (F1, M1).","comeback":"Household waste is 60 percent of the tonnes and sits at the end of the chain, so each tonne carries the whole upstream footprint, and only households can stop binning food.","weak":true,"tags":["food waste","households","unep","631 million tonnes","60 percent","79 kg","fridge","8 to 10 percent","wasting food","consumer","supply chain","f1","f2"],"phrasings":["households waste 60% of all food","wasted food is 8 to 10% of emissions","stop binning food and you've cut emissions"],"frames":["F1","F2"],"uses":[],"notes":"Dropped the two-number say and the claim that the household share of emissions is smaller than 8 to 10 percent (misleading, since late-stage waste carries upstream emissions). Weak because we concede the fact and have no measured policy example on food waste.","sources":[{"title":"Food Waste Index Report 2024","publisher":"UNEP / WRAP","year":2024,"url":"https://www.unep.org/resources/publication/food-waste-index-report-2024","finding":"2022: 1.05 bn t wasted; households 631 Mt (60%), food service 290 Mt, retail 131 Mt. Confirmed via search summaries.","verified":true},{"title":"Food Waste Index 2024 key messages","publisher":"UNEP","year":2024,"url":"https://wedocs.unep.org/bitstream/handle/20.500.11822/45275/Food-Waste-Index-2024-key-messages.pdf","finding":"Food loss and waste generates an estimated 8-10% of global GHG emissions (whole chain).","verified":true}],"their_sources":[{"title":"Food Waste Index Report 2024","publisher":"UNEP / WRAP","year":2024,"url":"https://www.unep.org/resources/publication/food-waste-index-report-2024","finding":"2022: 1.05 bn t wasted (19% of food available); households 631 Mt (60%), food service 290 Mt, retail 131 Mt; 79 kg per capita. Confirmed via search summaries; UNEP page itself returned 403 on fetch.","verified":true},{"title":"Food Waste Index 2024 key messages","publisher":"UNEP","year":2024,"url":"https://wedocs.unep.org/bitstream/handle/20.500.11822/45275/Food-Waste-Index-2024-key-messages.pdf","finding":"Food loss and waste generates an estimated 8-10% of global GHG emissions (summary figure; report coverage says up to 10%).","verified":true}],"routes":[{"type":"deny","say":"That counts tonnes of food, not emissions avoided, and the emissions share they quote is for all food loss and waste along the whole chain."},{"type":"reframe","say":"Ask what has measurably cut household waste, and by what. Date labels, packaging and collection rules are the levers, and those are policy (F2)."},{"type":"outweigh","say":"Concede the fridge. Where a habit changed overnight it was a levy that did it: Ireland's bag charge cut use about 90 percent (OW15)."},{"type":"fallacy","say":"A share of waste is being read as a share of impact, and both as controllable by households. Each step is a separate claim they have not made."}]},{"id":"FP08","side":"for","kind":"argument","angle":"consumption","strength":3,"title":"Rebound effects hit policy, not choices","claim":"Efficiency regulation makes energy cheaper to use, and people spend the savings on more consumption. Sorrell, Gatersleben and Druckman show rebounds can erode a large share of expected savings from efficiency, whereas a person who simply uses less of something, skips the flight or the second car, has no rebound on that behaviour. Sufficiency beats efficiency mandates.","say":"Their own source cuts the other way. Sorrell and colleagues review rebound and spillovers from behaviour change and conclude sufficiency actions have limited effect. Rebound is a reason to design the policy well, not to skip it.","detail":"Sorrell, Gatersleben and Druckman (2020) title their paper 'The limits of energy sufficiency': rebounds and negative spillovers also follow voluntary behavioural change, because savings in money, moral credit and time get spent elsewhere, and the authors find sufficiency actions have only a very limited effect on aggregate energy use. A skipped flight can fund another purchase. Do not deny that efficiency rules rebound too (the For side is right); concede it and move to net outcomes: rebound is a known risk that policy can price in, for instance with a carbon price that covers the substitute. We confirmed the direction from abstract mirrors, not exact rebound magnitudes.","if_they_push":"Both policy and personal choices have rebounds; the realized measure is net emissions, and the measured net falls are policy ones (M1, M5).","comeback":"Rebound hits efficiency mandates too, and skipping a flight has no rebound on that flight, so sufficiency still beats efficiency rules.","weak":false,"tags":["rebound","jevons","efficiency","sufficiency","policy fails","spending savings","moral licensing","fuel economy","behaviour change","sorrell","cheaper energy","f1"],"phrasings":["efficiency standards just make you drive more","Jevons paradox kills fuel economy rules","if you don't buy it there's nothing to rebound"],"frames":["F1"],"uses":["M1","M5"],"notes":"Corrected the DOI (erss.2020, not 2019) and added the paper's own conclusion on limited aggregate effect. Added a note to concede that efficiency rules also rebound and argue on net outcomes.","sources":[{"title":"The limits of energy sufficiency: A review of the evidence for rebound effects and negative spillovers from behavioural change","publisher":"Energy Research & Social Science (Sorrell et al.)","year":2020,"url":"https://doi.org/10.1016/j.erss.2020.101439","finding":"Reviews rebound and spillover from behavioural change; authors conclude sufficiency has only a very limited effect on aggregate energy use and emissions. DOI corrected to erss.2020.101439. Confirmed from abstract mirrors (CUSP, CREDS); full text not read.","verified":true}],"their_sources":[{"title":"The limits of energy sufficiency: A review of the evidence for rebound effects and negative spillovers from behavioural change","publisher":"Energy Research & Social Science (Sorrell, Gatersleben, Druckman)","year":2020,"url":"https://doi.org/10.1016/j.erss.2020.101439","finding":"Rebounds from sufficiency can also be large (indirect rebounds up to 14-300% in a Swedish study, per a slide deck). Cuts both ways: this paper actually argues sufficiency actions have limited aggregate effect, so the opponent can cite the same source. Abstract confirmed via search only.","verified":true}],"routes":[{"type":"reframe","say":"Rebound is a design problem for policy, and policy can price the substitute with a carbon price. A household has no instrument to close its own leak."},{"type":"outweigh","say":"Both leak; count net emissions. The measured net falls are policy ones: Ontario's coal exit and the UK's grid from about 40 percent coal to none (M1, M5)."},{"type":"turn","say":"Their own source is titled The limits of energy sufficiency and finds sufficiency actions have very limited effect on aggregate energy use. Rebound hits personal cuts too."},{"type":"fallacy","say":"They apply rebound to efficiency rules and exempt personal cuts from the same mechanism, though savings in money, time and moral credit get spent elsewhere. Same leak, different standard."}]},{"id":"FP09","side":"for","kind":"argument","angle":"consumption","strength":3,"title":"EVs and heat pumps cut lifetime emissions","claim":"A medium EV bought in Europe in 2021 emits 66 to 69% less over its lifetime than a petrol car even with battery production, and a 59-region study found EVs and heat pumps beat petrol cars and fossil boilers in 53 of 59 regions. Buying them is something a household can do in a week, and it locks in the cut for 15 years.","say":"Same EV, different result: ICCT finds a medium EV cuts lifetime emissions by about two thirds in Europe but far less in India. The buyer's choice is identical; the grid, largely set by policy, decides.","detail":"ICCT's 2021 study compares medium cars registered in 2021 over their lifetimes: 66 to 69 percent lower in Europe, 60 to 68 in the US, 37 to 45 in China, 19 to 34 in India. The spread tracks grid carbon intensity, which a buyer mostly cannot choose. Norway's 88.9 percent EV share of new cars in 2024 came with VAT and registration-tax exemptions (OW09), and European heat-pump sales fell 22 percent in 2024 (EHPA, 19 countries) after support changes (A3), so these purchases follow incentives. 'A week to buy' is true only inside a menu policy built (F2). Concede the EV still cuts emissions in India.","if_they_push":"Yes, an EV cuts emissions everywhere; the size of the cut is set by the grid, and the choice exists only where someone built chargers and made it affordable. Norway's EV share followed tax exemptions, not conscience (F2).","comeback":"Even in India the EV cuts emissions by 19 to 34 percent, so the buyer's choice cuts emissions on any grid without waiting for a law.","weak":false,"tags":["electric vehicle","ev","heat pump","home energy","lifecycle","66 to 69 percent","73 percent","boiler","knobloch","icct","buy","retrofit","lock in","f2"],"phrasings":["an EV cuts two thirds of emissions over its life","switch to a heat pump and be done","I can go electric tomorrow without waiting for a law"],"frames":["F2"],"uses":["OW09","FR04","A3"],"notes":"Said numbers cut to none in say (two ranges before). Rewrote if_they_push to concede the EV still helps everywhere, which answers the comeback; added EHPA 22 percent scope. ICCT figures confirmed only from secondary reports.","sources":[{"title":"A global comparison of the life-cycle GHG emissions of combustion engine and electric passenger cars","publisher":"ICCT (Bieker)","year":2021,"url":"https://theicct.org/publication/a-global-comparison-of-the-life-cycle-greenhouse-gas-emissions-of-combustion-engine-and-electric-passenger-cars/","finding":"BEV lifetime emissions 66-69% lower in Europe, 60-68% US, 37-45% China, 19-34% India versus gasoline, medium cars registered 2021. Figures match several secondary reports (Electrek, Autocar Pro, ZEMO); ICCT white paper itself not fetched.","verified":true},{"title":"Norway achieves 89 per cent EV share in 2024","publisher":"electrive (citing OFV)","year":2025,"url":"https://www.electrive.com/2025/01/02/norway-achieves-89-per-cent-ev-share-in-2024","finding":"88.9% of 128,691 new registrations were electric.","verified":true}],"their_sources":[{"title":"A global comparison of the life-cycle greenhouse gas emissions of combustion engine and electric passenger cars","publisher":"ICCT","year":2021,"url":"https://theicct.org/publication/a-global-comparison-of-the-life-cycle-greenhouse-gas-emissions-of-combustion-engine-and-electric-passenger-cars/","finding":"Europe, cars registered 2021: medium BEV lifetime emissions 66-69% lower than gasoline equivalent. URL not fetched; figure confirmed via secondary summary and later update citing 73%.","verified":false},{"title":"Net emission reductions from electric cars and heat pumps in 59 world regions over time","publisher":"Nature Sustainability (Knobloch et al.)","year":2020,"url":"https://doi.org/10.1038/s41893-020-0488-7","finding":"Life-cycle emissions of EVs and heat pumps are lower than new petrol cars and fossil boilers in 53 of 59 regions. Confirmed via search summary only.","verified":true}],"routes":[{"type":"deny","say":"A week to buy is true only where someone built the chargers, set the rebate and ran the grid. The menu was built first (F2)."},{"type":"reframe","say":"Same car, different result: an EV cuts about two thirds in Europe but far less in India, because the grid, set by policy, decides the saving (FR04)."},{"type":"turn","say":"Where the policy changed, the purchases changed: Norway's EV share followed tax exemptions, and European heat-pump sales fell about 22 percent when support weakened (OW09, A3)."},{"type":"fallacy","say":"They credit the buyer with the full lifetime saving, but the size of that saving is set by a grid the buyer did not choose. The effect is misattributed."}]},{"id":"FP10","side":"for","kind":"argument","angle":"consumption","strength":3,"title":"Frequent flyers are 1% of people, half of aviation","claim":"Only about 11% of the world flew in 2018 and at most 1% account for more than half of passenger aviation CO2. Aviation is largely outside binding policy agreements, so a small number of flyers deciding to stay on the ground has more effect than treaties that do not cover it.","say":"Agreed, and it argues for policy. A tiny group driving most flying emissions is exactly what a frequent-flyer levy reaches. Gossling's own paper says aviation is mostly outside policy agreements.","detail":"Gossling and Humpe estimate that at most 1 percent of the population likely accounts for more than half of passenger aviation emissions, with 11 percent flying in 2018 (confirmed from the abstract and Lund University release). The authors also note a large share of aviation emissions is not covered by policy agreements. A gap in policy is not evidence that individuals are a better lever, only that the lever has not been pulled. Appeals to flight shame have to persuade the 1 percent; a price or limit simply applies.","if_they_push":"A concentrated problem is the easiest one for a rule to reach, and the hardest for voluntary restraint, which only works on the willing. And 'outside policy' means policy has not tried yet, not that it cannot (F1).","comeback":"Aviation has stayed outside binding agreements for decades, so the only lever that exists today is those few people choosing to stay on the ground.","weak":false,"tags":["flying","aviation","frequent flyers","1 percent","half of emissions","gossling","private jets","flight shame","11 percent flew","not covered by policy","f1"],"phrasings":["1% of people cause half of flying emissions","just don't fly","aviation isn't regulated, individuals are the only lever"],"frames":["F1"],"uses":[],"notes":"Removed numbers from say (had 'one percent' and 'over half'). Gossling figures confirmed from several summaries and wording is hedged ('at most', 'likely'). Added 'has not tried yet' to if_they_push to meet the decades-of-no-policy comeback.","sources":[{"title":"The global scale, distribution and growth of aviation: Implications for climate change","publisher":"Global Environmental Change (Gossling & Humpe)","year":2020,"url":"https://doi.org/10.1016/j.gloenvcha.2020.102194","finding":"At most 1% of people likely account for more than half of passenger-aviation CO2 (2018); a large share of aviation emissions is outside policy agreements. Hedged ('likely', 'at most') in the authors' wording.","verified":true}],"their_sources":[{"title":"The global scale, distribution and growth of aviation: Implications for climate change","publisher":"Global Environmental Change (Gössling & Humpe)","year":2020,"url":"https://doi.org/10.1016/j.gloenvcha.2020.102194","finding":"At most 1% of the population likely accounts for more than half of passenger air travel emissions; 11% flew in 2018, at most 4% internationally; a large share of aviation emissions is outside policy agreements. Confirmed via abstract summary.","verified":true}],"routes":[{"type":"deny","say":"Their own paper hedges the figure with 'at most' and 'likely'. And shame has to persuade each flyer; a price simply applies."},{"type":"reframe","say":"Voluntary restraint works only on the willing, and the frequent flyers they describe are the least willing. The unwilling are reached by rules (FR03)."},{"type":"turn","say":"A tiny group causing most flying emissions is exactly what a frequent-flyer levy reaches at once. Concentration argues for a rule, not a plea."},{"type":"fallacy","say":"Aviation being outside policy agreements means the lever has not been pulled, not that it does not exist. A gap in policy is not evidence for individuals (F1)."}]},{"id":"FP11","side":"for","kind":"argument","angle":"consumption","strength":2,"title":"Having one fewer child saves 58.6 tonnes","claim":"Wynes and Nicholas estimate that one fewer child in a developed country saves about 58.6 tCO2e per year, over 70 times a plant-based diet's 0.8 t. Reproductive choice is the single largest individual lever on lifetime emissions.","say":"That 58.6 tonnes is a multi-generation attribution, and a published comment argues it counts future generations' emissions more than once. We do not rest a motion on contested accounting.","detail":"Wynes and Nicholas's abstract gives 58.6 tCO2e per year for one fewer child in a developed country. Van Basshuysen and Brandstedt (ERL 2018) argue the attribution relies on multiple counting of future generations' emissions and excludes net-zero scenarios; per search summaries, Wynes and Nicholas replied that attribution has methodological problems and called for more research. A second comment (Pedersen and Lam) exists but we did not read it, so do not describe its content. Even a favourable reading attributes decades of future choices to a parent, which is a model, not a measured reduction (F1). Under a decarbonising grid those future emissions shrink, and grids are policy.","if_they_push":"Their strongest number is also their least accountable, and the authors accepted the attribution is contested. Even halved, it is a projection about people not yet born, not a measured reduction (F1).","comeback":"Even with the contested accounting trimmed, a child's lifetime emissions dwarf every other personal choice, and that choice is entirely the parent's.","weak":false,"tags":["fewer children","58.6 tonnes","family size","reproduction","carbon legacy","population","murtaugh schlax","wynes","largest lever","procreation","f1"],"phrasings":["one fewer child is 58 tonnes a year","the biggest thing you can do is not have a kid","per-year number looks huge but it's a multi-generation total"],"frames":["F1"],"uses":["FR07"],"notes":"Removed 'spread over one lifetime' (unsupported) and the claim about what Pedersen and Lam argued (not read). Kept multiple-counting critique, which the comment's abstract states.","sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://doi.org/10.1088/1748-9326/aa7541","finding":"Abstract: car-free 2.4 tCO2e/yr, one transatlantic return flight 1.6, plant-based diet 0.8, one fewer child 58.6 (developed-country average). Discussion proposes policies such as a food carbon tax and compact urban growth for structural barriers.","verified":true},{"title":"Comment on 'The climate mitigation gap'","publisher":"Environmental Research Letters (van Basshuysen & Brandstedt)","year":2018,"url":"https://ui.adsabs.harvard.edu/abs/2018ERL....13f9501V/abstract","finding":"Abstract: the authors argue the child figure relies on multiple counting of future generations' emissions and excludes net-zero emission scenarios. Abstract confirmed via search; full text not read.","verified":true}],"their_sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://doi.org/10.1088/1748-9326/aa7541","finding":"Abstract (fetched): one fewer child reduces about 58.6 tCO2e per year (developed-country average).","verified":true},{"title":"Critiques: second comment on the climate mitigation gap (Pedersen & Lam) and BYU critique","publisher":"Environmental Research Letters / Leuphana","year":2018,"url":"https://fis.leuphana.de/en/publications/second-comment-on-the-climate-mitigation-gap-education-and-govern/","finding":"Critics say the 58.6 t figure is a multi-generation total spread over one lifetime, attributes distant future emissions to the parent, and ignores collective action; a 2018 corrigendum followed. Expect this rebuttal; weakest FOR argument. Full text of comments not retrieved.","verified":true}],"routes":[{"type":"deny","say":"The 58.6 tonnes is a multi-generation attribution, and a published comment argues it counts descendants' emissions more than once. The authors conceded the method is contested (FR07)."},{"type":"reframe","say":"Those future emissions depend on the grid the child grows up with, and grids are policy. A decarbonised grid shrinks their number without anyone forgoing a child (F2)."},{"type":"fallacy","say":"Attributing decades of unborn people's choices to a parent today is a model, not a measurement. Projection is being presented as impact (F1)."}]},{"id":"FP12","side":"for","kind":"argument","angle":"consumption","strength":2,"title":"Fast fashion is a consumer choice","claim":"Clothing production has roughly doubled since 2000 while the average garment is worn far less, and less than 1% of used clothing is recycled into new clothing. Buying less and wearing longer is entirely in the shopper's hands and no law has stopped the trend.","say":"Production doubled while shoppers were free to buy less, and it went the wrong way. Nobody shows a measured cut from buying less. What bends a curve is a standard or a price.","detail":"The Ellen MacArthur Foundation report says clothing production roughly doubled between 2000 and 2015 while garment utilisation fell (36 percent, per secondary reports), and under 1 percent of clothing is recycled into new clothes (closed-loop). Rising incomes, falling prices and a business model built on volume drove that as much as shopper choice, so do not blame shoppers alone. They offer no realised reduction, only what wearing garments longer could do (F1). We could not confirm the CO2 tonnage figure, so we do not quote it.","if_they_push":"If buying less worked we would see it in the production curve; what bends curves is a standard or a price (M5). Concede it is a hard case for us: no fashion-specific policy result is shown here.","comeback":"A doubling of clothing production is individual action having enormous impact; the resolution asks which has more impact, not which is better.","weak":true,"tags":["fast fashion","clothing","textiles","overconsumption","wear longer","buy less","ellen macarthur","less than 1 percent recycled","second hand","garment","f1"],"phrasings":["don't buy clothes you don't need","fast fashion is worth 1.2 billion tonnes","just wear it longer"],"frames":["F1"],"uses":["M5"],"notes":"Removed the awkward 'no tonnes of fashion cut are shown' line and the one-sided blame of shoppers. Weak because the doubling arguably proves their point about impact and we have no fashion policy measured result; concede quickly and move on.","sources":[{"title":"A New Textiles Economy: Redesigning fashion's future","publisher":"Ellen MacArthur Foundation","year":2017,"url":"https://emf.org/a-new-textiles-economy","finding":"Clothing production roughly doubled 2000-2015; utilisation down 36% vs 15 years earlier; under 1% recycled into new clothes (closed-loop). Confirmed via secondary reports (Adweek, Business Insider); report itself not fetched. The 1.2 bn t CO2e figure remains unconfirmed.","verified":true}],"their_sources":[{"title":"A New Textiles Economy: Redesigning fashion's future","publisher":"Ellen MacArthur Foundation","year":2017,"url":"https://emf.org/a-new-textiles-economy","finding":"Report found clothing production doubled in 15 years while use per garment fell, less than 1% recycled into new clothes, a truck of textiles landfilled or burned every second. The specific 1.2 bn t CO2e and 36% utilisation figures were not confirmed here; do not quote them.","verified":false}],"routes":[{"type":"reframe","say":"Rising incomes, falling prices and a business model built on volume drove the doubling. Firms and prices, not conscience, shaped what shoppers bought (F5)."},{"type":"outweigh","say":"Concede that no fashion rule has bent the curve. Where a price was set, the curve bent: the UK took coal from about 40 percent of electricity to none (M5)."},{"type":"turn","say":"Production doubled while shoppers were free to buy less, and it went the wrong way. The freedom they praise produced the curve they deplore."},{"type":"fallacy","say":"Impact in this motion means moving the outcome. A harm that nobody has moved down by choosing differently is not evidence that choosing differently has impact (F1)."}]},{"id":"FP13","side":"for","kind":"argument","angle":"consumption","strength":2,"title":"recycling and bags add up","claim":"Millions of people sorting their waste and carrying reusable bags create the demand signal that justifies municipal recycling and plastic-bag programs. Small acts also build the social norm that makes bigger action possible, so personal habits are the foundation, not a distraction.","say":"Their own source ranks comprehensive recycling well below the big actions. And where bag habits really changed, in Ireland, a levy did it, not conscience.","detail":"Wynes and Nicholas's abstract says comprehensive recycling is four times less effective than a plant-based diet and changing lightbulbs eight times less (abstract fetched). Ireland's 2002 levy took per-capita bag use from an estimated 328 to 21 (Irish government figures via Wicklow Council; an estimate, and use later crept back to about 31 and the levy was raised in 2007), which shows a price holds a habit only if it is kept up (OW15). Norms are real, but a norm that never becomes a rule cuts no tonnes (F3).","if_they_push":"Bags are tiny for climate; the point is that where a habit changed overnight, a price did it (OW15).","comeback":"Bag levies barely touch emissions, so Ireland proves nothing about climate, and norms from small habits are what let politicians pass the big rules.","weak":false,"tags":["recycling","reusable bags","plastic bags","small actions","social norms","habits","waste sorting","everyday","cumulative","gateway","signalling","f1","f3"],"phrasings":["every bit counts","if everyone recycled it would add up","small habits lead to big change"],"frames":["F1","F3"],"uses":["OW15"],"notes":"Said now has no numbers (previously three). Confirmed the recycling ratio from the fetched abstract and added that Ireland's 328-to-21 is an estimate that partly rebounded.","sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://doi.org/10.1088/1748-9326/aa7541","finding":"Abstract (fetched): comprehensive recycling four times less effective than a plant-based diet; changing lightbulbs eight times less. Authors recommend policy such as a food carbon tax and compact urban growth for structural barriers.","verified":true},{"title":"Plastic Bag Levy","publisher":"Wicklow County Council","year":2023,"url":"https://wicklow.ie/Living/Services/Environment/Recycling-Waste-Management/Recycling-Reduction-Reuse/Plastic-Bag-Levy","finding":"Per capita use fell overnight from an estimated 328 to 21 bags after the March 2002 levy (Irish government estimate). Later reports: rose to about 31 by 2007, levy raised that year.","verified":true}],"their_sources":[{"title":"The climate mitigation gap (comprehensive recycling comparison)","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://doi.org/10.1088/1748-9326/aa7541","finding":"Opponent's best evidence: this same paper ranks comprehensive recycling about four times less effective than a plant-based diet and lightbulb changes about eight times less; the weak arguments are small by the For side's own source. Ratios from search summary of the paper.","verified":true}],"routes":[{"type":"deny","say":"Their own source ranks comprehensive recycling about four times less effective than a plant-based diet, and lightbulbs lower still. Small acts are small by their own evidence."},{"type":"reframe","say":"Norms that never become rules cut no tonnes. If small habits build the norm that lets politicians pass big rules, the impact is the rule's (F3)."},{"type":"turn","say":"Where bag habits actually changed, in Ireland, a levy did it overnight, and use crept back until the levy was raised. The price held the habit (OW15)."},{"type":"fallacy","say":"Foundations are not impact. Saying habits make bigger action possible admits the bigger action is where the impact is, and that action is policy."}]},{"id":"PL01","side":"for","kind":"argument","angle":"policy fragility","strength":5,"title":"Paris pledges leave a huge implementation gap","claim":"After a decade of Paris, governments' own pledges still land at 2.3 to 2.5 C if fully delivered, and current policies at up to 2.8 C; UNEP says the 2025 round of new pledges barely moved the needle, and most countries are not even on track for their 2030 targets. Policy is a promise; emissions are what individuals and firms actually do.","say":"The gap is policy that is too weak, not proof that individuals could have closed it. Climate Action Tracker has current policies about a degree lower than in 2015, and that movement is government action.","detail":"UNEP 2025 puts current policies at up to 2.8 C and full NDC delivery at 2.3 to 2.5 C. Climate Action Tracker (our OW17) had its current-policies projection at 3.6 C in 2015 and about 2.6 C now, roughly a degree lower, and credits the Paris Agreement; CAT says its latest 0.1 C step was mostly a methodology change for China, so use the 2015 to 2025 comparison, not the yearly one. The For side's own source measures the distance between what governments have done and what they promised; nothing in it measures what households could have done. Concede the gap, turn it: it is the size of the job policy has not finished.","if_they_push":"Do not lean on the 3.1 to 2.8 drop: UNEP says 0.1 C of it is methodology and the US withdrawal cancels another 0.1 C. If they say a projection is not a measurement, agree, and move to measured cases (M1, M5); F1 applies to their scenarios and to ours. A record-high year indicts their lever too (B6).","comeback":"Your degree of progress is a model projection, and a decade after Paris emissions are still at record highs, so policy has under-delivered.","weak":false,"tags":["paris","ndc","unep","emissions gap","2.8 degrees","pledges","implementation gap","overshoot","promises","1.5","f1","f2"],"phrasings":["But the Paris targets are improving, the projection fell from 3.1 to 2.8 C.","The gap shows we need stronger policy, not less policy.","Pledges aren't the same as policy; actual regulations bind."],"frames":["F1","F2"],"uses":["OW17"],"notes":"CAT 3.6 to 2.6 C confirmed on its release. Fixed if_they_push, which said UNEP credits the drop to methodology and US withdrawal; UNEP says methodology adds 0.1 C of improvement and US withdrawal cancels 0.1 C. Added the point that a projection is a scenario, which F1 would also bar us from leaning on.","sources":[{"title":"UNEP Emissions Gap Report 2025: Off target (PBL summary)","publisher":"UNEP via PBL","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Current policies up to 2.8 C (3.1 C in the 2024 report); full NDCs 2.3-2.5 C; new pledges barely moved the outlook.","verified":true},{"title":"Global Update COP30 release","publisher":"Climate Action Tracker","year":2025,"url":"https://climateactiontracker.org/press/release-global-update-2025/","finding":"Current-policies projection 3.6 C in 2015, 2.6 C now (via ours.json OW17).","verified":true}],"their_sources":[{"title":"Emissions Gap Report 2025: Off target (summary by PBL)","publisher":"UNEP via PBL Netherlands Environmental Assessment Agency","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Full NDC implementation gives 2.3-2.5 C this century; current policies up to 2.8 C; only 0.1 C of the improvement from methodology and 0.1 C from US withdrawal, otherwise new NDCs barely changed the outlook.","verified":true},{"title":"UNEP Emissions Gap Report 2025 press statement","publisher":"UNEP","year":2025,"url":"https://www.unep.org/en/news-and-stories/statements/emissions-gap-report-2025-executive-director-press-statement","finding":"Official UNEP statement on the 2025 report (page returned 403 to the fetch tool; content cross-checked via search summaries of UNEP report: only 60 Parties covering 63% of emissions had submitted new 2035 NDCs by 30 Sept 2025).","verified":false}],"routes":[{"type":"reframe","say":"Emissions are what individuals and firms do inside prices, grids and standards that governments set. The gap is the size of the job policy has not finished (F2)."},{"type":"outweigh","say":"Concede the gap. Climate Action Tracker's current-policies projection has fallen about a degree since Paris, and it credits governments for that (OW17)."},{"type":"turn","say":"Their source measures the distance between what governments did and what they promised. Nothing in it measures what households could have done. The gap is unfinished policy."},{"type":"fallacy","say":"A target missed is not a lever that failed. Measuring policy against its own promise and individuals against nothing is not a comparison."}]},{"id":"PL04","side":"for","kind":"argument","angle":"policy fragility","strength":4,"title":"Kyoto: binding treaty, rising emissions, Canada walked","claim":"Kyoto bound Canada to 6 percent below 1990 levels by 2012. By 2010 Canada's emissions were about 17.5 percent above 1990, and in December 2011 Canada became the first country to formally withdraw rather than pay penalties. The strongest international treaty ever signed was ignored by the people it was meant to bind.","say":"Canada missed because it never delivered the policy, then walked out. That is policy absent, not policy failing. Every party that stayed in ended compliant, though much of that was Soviet-era surplus.","detail":"Concede the Canada facts: 17.5 percent above 1990 against a promise of 6 percent below, and formal withdrawal in December 2011. Canada failed because it did not deliver the policy, which is policy absent, not evidence that policy is weak. I4CE's final-data study finds all Annex B parties ended in compliance once flexibility mechanisms are counted, but only nine of 36 fully participating countries beat their targets domestically; surplus Soviet-era allowances ('hot air') and land-use accounting explain much of the overachievement. UNFCCC's headline of 22.6 percent below 1990 against about 5 percent promised is dominated by the post-Soviet collapse and could not be opened, so do not say it aloud.","if_they_push":"Concede the hot-air caveat openly: only nine of 36 met their targets from domestic cuts, the rest used credits, sinks and trading. Then hold the narrow claim: the US never ratified and Canada left, so the failure was participation, a political choice, not proof that binding rules cannot move emissions. Pivot to measured cases where the rule bound and held (M1, M2).","comeback":"Kyoto was binding on paper, riddled with loopholes, the US never joined, Canada ignored it, and most of the compliance was Soviet hot air.","weak":true,"tags":["kyoto","canada","withdrawal","2011","binding","treaty","oil sands","17 percent","1990","durban","enforcement","f1"],"phrasings":["Kyoto's EU parties largely met their targets.","Canada's failure is one country, not proof policy fails.","Emissions fell 6.5 percent from 2005 by 2010."],"frames":["F1"],"uses":[],"notes":"Removed the 22.6 percent claim from say: it is unverified and misleading without the hot-air context. Fixed if_they_push, which said 27 of 36 met targets domestically; I4CE says only nine did and the rest used flexibility mechanisms. Best available but Kyoto is a poor example for us.","sources":[{"title":"Developed Countries Enter Final Phase of Kyoto Protocol 1st Period","publisher":"UNFCCC","year":2015,"url":"https://unfccc.int/news/developed-countries-enter-final-phase-of-kyoto-protocol-1st-period","finding":"UNFCCC page fetched but gives no percentages; the 22.6% figure appears now
