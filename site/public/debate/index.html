<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Rebuttal Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Same system as aditbhargava.me: black on white, system sans, one rule colour, square text buttons,
   three type sizes (small, body, lede). Two columns on wide screens, three tabs on a phone. */
:root{
  --text:#111111; --bg:#ffffff; --muted:#5c5c5c; --rule:#d4d4d4; --code-bg:#f3f3f3; --red:#c8102e;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --small:.85rem; --lede:1.15rem; --gutter:16px;
  --gl:max(var(--gutter),env(safe-area-inset-left,0px)); --gr:max(var(--gutter),env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--text:#e8e8e8;--bg:#121212;--muted:#a3a3a3;--rule:#3a3a3a;--code-bg:#1e1e1e;--red:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--text:#e8e8e8;--bg:#121212;--muted:#a3a3a3;--rule:#3a3a3a;--code-bg:#1e1e1e;--red:#ff6b6b;color-scheme:dark}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.5 var(--sans);overflow-wrap:break-word;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
a{color:inherit;text-decoration:underline;text-underline-offset:.15em;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25;font-size:1rem}
p{margin:0}
.small{font-size:var(--small)} .lede{font-size:var(--lede);line-height:1.4} .muted{color:var(--muted)} .red{color:var(--red)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.spacer{flex:1}
/* Buttons: plain text in a 1 px rule, square. Links-as-buttons: underlined text. */
.btn{font-size:var(--small);color:var(--text);background:var(--bg);border:1px solid var(--rule);border-radius:0;padding:.25rem .6rem;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--text)} .btn:disabled{color:var(--muted);cursor:default;border-color:var(--rule)}
.btn.on{border-color:var(--text);background:var(--text);color:var(--bg)}
.lnk{background:none;border:0;padding:0;cursor:pointer;font-size:var(--small);color:var(--muted);text-decoration:underline;text-underline-offset:.15em}
.lnk:hover{color:var(--text)} .lnk:disabled{text-decoration:none;cursor:default}
.lnk.on{color:var(--text)}
input.txt,textarea.txt,select.txt{border:0;border-bottom:1px solid var(--rule);background:transparent;border-radius:0;padding:.2rem 0}
input.txt:focus,textarea.txt:focus{outline:0;border-bottom-color:var(--text)}
.row{display:flex;gap:.75rem;align-items:baseline;flex-wrap:wrap}
.label{font-size:var(--small);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.rule{border:0;border-top:1px solid var(--rule);margin:1.25rem 0}

#app{height:100%;display:flex;flex-direction:column;min-height:0}
header.top{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;padding:.9rem var(--gr) .7rem var(--gl);border-bottom:1px solid var(--rule);font-size:var(--small)}
header.top h1{font-size:1rem}
header.top .st{color:var(--muted);font-family:var(--mono);display:flex;gap:1rem;min-width:0;overflow:hidden;white-space:nowrap}
header.top input{width:9ch;font-size:var(--small)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
section.col{min-width:0;min-height:0;display:flex;flex-direction:column}
section.col+section.col{border-left:1px solid var(--rule)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:1rem var(--gr) 2rem var(--gl)}
.tabs{display:flex;gap:1rem;padding:.7rem var(--gr) .6rem var(--gl);border-bottom:1px solid var(--rule);font-size:var(--small);align-items:baseline;flex-wrap:wrap}
.tabs [role=tab]{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);text-decoration:none}
.tabs [role=tab][aria-selected="true"]{color:var(--text);text-decoration:underline;text-underline-offset:.3em}
.tabs input[type=search]{flex:1;min-width:10ch}
.seg{display:flex;gap:.75rem}
.seg button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-size:var(--small)}
.seg button[aria-pressed="true"]{color:var(--text);text-decoration:underline;text-underline-offset:.3em}

form.log{padding:1rem var(--gr) .75rem var(--gl);border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:.5rem}
form.log textarea{width:100%;resize:none;min-height:3.2rem;font-size:var(--lede);line-height:1.4}

.point{padding:.9rem 0 .8rem;border-bottom:1px solid var(--rule)}
.point .ptext{font-size:var(--lede);line-height:1.4}
.point .meta{display:flex;gap:.75rem;align-items:baseline;flex-wrap:wrap;font-size:var(--small);color:var(--muted);margin-top:.15rem}
.point .meta .mono{font-size:.8rem}
.matches{margin-top:.5rem;display:flex;flex-direction:column}
.link-line{font-size:var(--small);color:var(--muted);font-style:italic;margin-bottom:.3rem}
.att{font-size:var(--small);margin-top:.35rem;display:flex;gap:.5rem;align-items:baseline}
.attform{display:flex;gap:.75rem;margin-top:.4rem;align-items:baseline}
.attform input{flex:1;min-width:8ch;font-size:var(--small)}

.card{padding:.45rem 0 .5rem;border-top:1px solid var(--rule)}
.card:first-child{border-top:0}
.card .head{display:flex;gap:.6rem;align-items:baseline;cursor:pointer;flex-wrap:wrap}
.card .head .id{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:4ch}
.card .head .title{font-weight:600}
.card .head .flag{font-size:var(--small);color:var(--red)}
.card .say{margin-top:.1rem}
.card .more{margin-top:.4rem;display:flex;flex-direction:column;gap:.35rem;font-size:var(--small)}
.card .k{color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;margin-right:.4rem}
.card .src{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.15rem;color:var(--muted)}
.card .src .v{font-family:var(--mono);margin-right:.3rem}
.card.chosen .head .title::after{content:" · using";color:var(--muted);font-weight:400;font-size:var(--small)}
.group-h{font-size:var(--small);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:1.25rem 0 .25rem}
.group-h:first-child{margin-top:0}

/* Strategy */
.strat{display:flex;flex-direction:column;gap:1.5rem}
.strat h2{font-size:var(--small);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:.4rem}
.case .pt{padding:.55rem 0;border-top:1px solid var(--rule)}
.case .pt:first-child{border-top:0}
.case .pt .t{display:flex;gap:.6rem;align-items:baseline}
.case .pt .t .n{font-family:var(--mono);font-size:.8rem;color:var(--muted);min-width:3ch}
.roles{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.25rem;font-size:var(--small)}
.roles button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:.15em}
.roles button[aria-pressed="true"]{color:var(--text);font-weight:600;text-decoration:none}
.gap{padding:.6rem 0;border-top:1px solid var(--rule)}
.gap:first-child{border-top:0}
.draft{margin-top:.4rem;padding-left:.75rem;border-left:1px solid var(--rule)}
.counter textarea{width:100%;font-size:var(--lede);line-height:1.4;resize:none;min-height:2.6rem}
.beat{display:grid;grid-template-columns:4ch 1fr auto;gap:.1rem .75rem;padding:.6rem 0;border-top:1px solid var(--rule)}
.beat:first-child{border-top:0}
.beat .t{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding-top:.2rem}
.beat .ans{font-size:var(--small);color:var(--muted)}
.beat .say{font-size:var(--lede);line-height:1.4}
.beat .cite{font-size:var(--small);color:var(--muted)}
.beat .ctl{display:flex;flex-direction:column;gap:.1rem;align-items:flex-end}
.beat .ctl button{background:none;border:0;padding:0 .2rem;cursor:pointer;color:var(--muted);font-size:var(--small)}
.beat .ctl button:hover{color:var(--text)}
.proposal{padding-left:.75rem;border-left:1px solid var(--rule);display:flex;flex-direction:column;gap:.35rem;font-size:var(--small)}
.empty{color:var(--muted);font-size:var(--small);max-width:52ch}
pre.plain{white-space:pre-wrap;font:var(--small)/1.5 var(--mono);background:var(--code-bg);padding:.75rem 1rem;max-height:40vh;overflow:auto;margin:.5rem 0 0}

.drawer{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;justify-content:flex-end;z-index:20}
.drawer .panel{width:min(420px,100%);background:var(--bg);height:100%;overflow:auto;padding:1rem max(1.25rem,env(safe-area-inset-right,0px)) 2rem 1.25rem;display:flex;flex-direction:column;gap:1rem;border-left:1px solid var(--rule);font-size:var(--small)}
.drawer h2{font-size:var(--small);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.drawer .field{display:flex;gap:.75rem;align-items:baseline}
.drawer .field input{flex:1}
.drawer dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem}
.drawer dt{color:var(--muted)} .drawer dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.4rem .75rem;font-size:var(--small);z-index:30;max-width:90vw}

nav.bottom{display:none}
@media (max-width:860px){
  main{grid-template-columns:minmax(0,1fr)}
  section.col+section.col{border-left:0}
  section.col[data-hide]{display:none}
  nav.bottom{display:flex;gap:1.5rem;padding:.7rem var(--gr) calc(.7rem + env(safe-area-inset-bottom,0px)) var(--gl);border-top:1px solid var(--rule);font-size:var(--small)}
  nav.bottom button{background:none;border:0;padding:0;cursor:pointer;color:var(--muted)}
  nav.bottom button[aria-selected="true"]{color:var(--text);text-decoration:underline;text-underline-offset:.3em}
  header.top .st .hide-sm{display:none}
  .tabs .desk{display:none}
}
</style>

<div id="app">
  <header class="top">
    <h1>Rebuttal Board</h1>
    <div class="st"><span id="syncText">starting</span><span id="aiText" class="hide-sm">keyword only</span></div>
    <div class="spacer"></div>
    <input class="txt" id="nameInput" maxlength="24" placeholder="your name" aria-label="Your name" autocomplete="off">
    <button class="lnk" id="settingsBtn" aria-label="Session and settings">Session</button>
  </header>

  <main>
    <section class="col" id="colLog">
      <form class="log" id="logForm" autocomplete="off">
        <textarea class="txt" id="logText" rows="2" placeholder="What did they just say? Enter logs it." aria-label="Opponent's point"></textarea>
        <div class="row"><span class="small muted" id="logHint"></span><span class="spacer"></span><button class="btn" type="submit">Log</button></div>
      </form>
      <div class="scroll" id="logList"></div>
    </section>

    <section class="col" id="colRight">
      <div class="tabs">
        <span class="desk" style="display:flex;gap:1rem"><button role="tab" data-view="board" aria-selected="true">Corpus</button><button role="tab" data-view="strategy" aria-selected="false">Strategy</button></span>
        <span id="boardFilters" style="display:contents">
          <input class="txt" type="search" id="q" placeholder="Search" aria-label="Search the corpus">
          <span class="seg" id="sideSeg" role="group" aria-label="Side"><button data-side="all" aria-pressed="true">All</button><button data-side="for" aria-pressed="false">They'll say</button><button data-side="ours" aria-pressed="false">Ours</button></span>
        </span>
      </div>
      <div class="scroll" id="boardWrap"><div id="board"></div></div>
      <div class="scroll" id="strategyWrap" hidden><div class="strat" id="strategy"></div></div>
    </section>
  </main>

  <nav class="bottom" role="tablist">
    <button role="tab" data-mview="log" aria-selected="true">Log</button>
    <button role="tab" data-mview="board" aria-selected="false">Corpus</button>
    <button role="tab" data-mview="strategy" aria-selected="false">Strategy</button>
  </nav>
</div>

<script type="application/json" id="corpus-data">{"built":"2026-11-08","source":"corpus.json","items":[{"id":"F1","side":"ours","kind":"frame","angle":"frames","title":"Potential vs measured","say":"Their numbers are mostly scenarios: “could cut”, “if everyone”. Ours are realized reductions. Ask: did that happen, or could it happen?","detail":"Use on any projection, model result or per-person estimate. Follow with one measured example from M1 to M5.","tags":["potential","scenario","could","if everyone","measured","realized","projection","model"],"best_against":["any 'could cut X%' figure","IPCC demand-side 40-70%","Wynes & Nicholas tonnes per person","back-of-envelope calculations"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"F2","side":"ours","kind":"frame","angle":"frames","title":"Policy builds the menu","say":"Individual choices exist inside systems that policy creates: transit, grid, codes, standards, subsidies. You can't take a bus that was never funded.","detail":"Every lifestyle choice they praise is only available where policy built the option: the grid mix behind an EV, the transit behind car-free living, the codes behind an efficient home, the rebate behind a heat pump.","tags":["menu","systems","transit","grid","codes","standards","subsidies","infrastructure","enabling"],"best_against":["car-free living","EV adoption","household consumption share","rooftop solar","heat pumps"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"F3","side":"ours","kind":"frame","angle":"frames","title":"Definition trap","say":"If they count voting, protest or lawsuits as individual action, the impact arrives through policy, so it's policy's impact. If they exclude those, their activism and “policy follows people” examples drop out. Make them pick one.","detail":"Ask them directly which definition they are running. Either answer concedes the motion or removes half their examples.","tags":["definition","voting","protest","lawsuits","activism","policy follows people","Greta","strike","Urgenda","definitional trap","civic action","lobbying","policy channel","motion","rebuttal"],"best_against":["voting is individual action","protest and climate strikes","climate litigation wins","policy follows public opinion","voting and protest are individual action","individuals drive policy change","activism is people power"],"sources":[{"title":"Nudging out support for a carbon tax","publisher":"Nature Climate Change 9","year":2019,"url":"https://www.cmu.edu/dietrich/sds/docs/loewenstein/nudgingcarbontax.pdf","finding":"Personal-action framing can reduce the civic behaviour (policy support) that matters.","verified":true},{"title":"Household behaviour crowds out support for climate change policy","publisher":"Nature Climate Change 7","year":2017,"url":"https://ideas.repec.org/a/nat/natcli/v7y2017i7d10.1038_nclimate3316.html","finding":"Werfel 2017 abstract: household behaviour may crowd out public support for government action by creating perception of sufficient progress; subjects reporting energy-saving actions were less likely to support a carbon tax increase (Japan, >14,000 respondents).","verified":true,"note":"nature.com redirected to a login (303); abstract read on the RePEc/IDEAS record of the same paper. ScienceDaily (fetched) adds about 13 percent less likely to support the tax."}],"their_sources":[],"phrasings":[],"alt_say":"If their best individual action is voting, protesting or lobbying, its impact comes entirely through government policy. That is our side of the motion, not theirs."},{"id":"F4","side":"ours","kind":"frame","angle":"frames","title":"Take-away line","say":"Individuals choose from the menu. Government writes the menu.","detail":"The one line to end every speech on. Rubric rewards one clear take-away.","tags":["take-away","closing","menu","one line"],"best_against":["closing","summary"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"M1","side":"ours","kind":"win","angle":"policy wins","strength":5,"title":"Ontario coal phase-out","say":"Ontario's electricity-sector GHG fell from 32.9 megatonnes in 2005 to 5.4 in 2014. Coal went from about a quarter of supply to zero, and future coal power is banned by law.","detail":"Ending Coal for Cleaner Air Act, 2015. About 27.5 Mt a year is roughly 11 million people going car-free at 2.4 t each. No individual could shut Nanticoke. Local to Toronto, so the judges know it.","tags":["ontario","coal","phase-out","nanticoke","smog","toronto","megatonnes","legislated","ban","coal phase-out","smog days","so2","nox","provincial policy","electricity","canada","local","grid","capacity","3940 mw","individual limits"],"best_against":["car-free living","governments are too slow","policy gets repealed","households are 60%","what can one person do vs a coal plant","policy has no local impact","provinces cannot lead","what can one person do about big infrastructure","households drive power demand","local examples do not scale"],"sources":[{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Fetched. Electricity-sector GHG 32.9 Mt (2005) to 5.4 Mt (2014); Ending Coal for Cleaner Air Act, 2015 bars future coal generation; coal supplied about 25% of Ontario electricity in 2003.","verified":true},{"title":"The climate mitigation gap (Wynes & Nicholas)","publisher":"Environmental Research Letters","year":2017,"url":"https://iopscience.iop.org/article/10.1088/1748-9326/aa7541","finding":"Fetched. Living car-free: 2.4 tCO2e saved per year. 27.5 Mt / 2.4 t = about 11.5 million people.","verified":true},{"title":"Coal phase-out improved Ontario's air quality","publisher":"Pembina Institute","year":2015,"url":"https://www.pembina.org/op-ed/coal-phase-out-improved-ontarios-air-quality","finding":"53 smog days in 2005, none in 2014.","verified":true}],"notes":"All figures confirmed. The ~25% coal share is the page's 2003 figure, not 2005; say text does not give a year, so no change. 27.5 Mt = 32.9 - 5.4 (arithmetic).","their_sources":[],"phrasings":[],"alt_say":"Nanticoke was one of the world's largest coal plants. No household could switch it off, but Ontario's government did, and smog days fell from 53 in 2005 to zero in 2014."},{"id":"M2","side":"ours","kind":"win","angle":"policy wins","strength":5,"title":"Montreal Protocol","say":"About 99 percent of controlled ozone-depleting substances have been phased out. 198 parties; the first UN treaty ratified by every country. Antarctic ozone is expected to recover around 2066.","detail":"A treaty did what no consumer campaign could: it covered refrigeration, foam and solvents, not just spray cans, and it held for four decades.","tags":["montreal","ozone","cfc","treaty","aerosols","1987","universal ratification","montreal protocol","unep","wmo","kigali","hfc","global","regulation"],"best_against":["consumers stopped CFCs before the ban","governments can't cooperate","policy gets repealed","governments are too slow","international agreements never work","only individuals can change behaviour"],"sources":[{"title":"Facts and figures on ozone protection","publisher":"UNEP Ozone Secretariat","year":2025,"url":"https://ozone.unep.org/facts-and-figures-ozone-protection","finding":"Fetched. Vienna Convention and Montreal Protocol reached universal ratification, 198 parties; about 99% of ozone-depleting substances eliminated (remaining 1% mainly HCFCs); Antarctic total column ozone projected to return to 1980 levels around 2066 if compliance continues.","verified":true},{"title":"International treaties and cooperation about the protection of the stratospheric ozone layer","publisher":"US EPA","year":2024,"url":"https://ozone.unep.org/facts-and-figures-ozone-protection","finding":"UNEP Ozone Secretariat: Vienna Convention and Montreal Protocol have universal ratification, with 198 Parties; phase-out of 99 per cent of ODSs; total column ozone back to 1980 levels around 2066 in the Antarctic.","verified":true,"note":"EPA page does not carry these; confirmed on UNEP's own facts-and-figures page (fetched). Cite UNEP instead of EPA."},{"title":"Scientific Assessment of Ozone Depletion: 2022","publisher":"WMO / UNEP","year":2022,"url":"https://www.unep.org/resources/publication/scientific-assessment-ozone-layer-depletion-2022","finding":"About 99% of controlled ODS phased out; recovery to 1980 values about 2040 / 2045 / 2066.","verified":true},{"title":"Ozone layer on track to recover within decades, UN report finds","publisher":"ITV News (reporting the 2022 assessment)","year":2023,"url":"https://itv.com/news/2023-01-09/ozone-layer-on-track-to-recover-within-decades-un-report-finds","finding":"Secondary report of recovery dates and avoided warming.","verified":true}],"notes":"CHANGED 197 -> 198 parties (UNEP current count; 197 was the count in UNEP's 2014 release, 198 now includes the EU). 99% and 2066 confirmed. 'First UN treaty ratified by every country' not confirmed in that wording: UNEP/UN sources say first (and only) global environmental treaties with universal ratification; safer: 'first treaties of their kind with universal ratification'. 2066 is Antarctic recovery to 1980 levels, conditional on continued compliance.","their_sources":[],"phrasings":[],"alt_say":"The Montreal Protocol has phased out about 99 percent of ozone-depleting substances. The 2022 WMO and UNEP assessment says the ozone layer returns to 1980 levels around 2040 globally, 2045 over the Arctic, and 2066 over Antarctica."},{"id":"M3","side":"ours","kind":"win","angle":"policy wins","strength":5,"title":"US Clean Air Act","say":"The six common pollutants fell 78 percent from 1970 to 2023 while the economy grew. That is the Clean Air Act, not a lifestyle trend.","detail":"EPA Air Trends 2024. Lead, SO2, NOx, CO, particulates and ozone all fell under federal standards while GDP, population and vehicle miles rose.","tags":["clean air act","epa","pollutants","78%","1970","lead","smog","air quality"],"best_against":["governments are too slow","regulation hurts the economy","policy gets repealed"],"sources":[{"title":"Our Nation's Air: Trends Through 2023","publisher":"US EPA","year":2024,"url":"https://gispub.epa.gov/air/trendsreport/2024/","finding":"Fetched. Combined emissions of the six common pollutants fell 78% between 1970 and 2023; page cites a 292% rise in US GDP over the same period.","verified":true}],"notes":"Confirmed. Population and vehicle-miles claim in detail not checked on the page (GDP is).","their_sources":[],"phrasings":[]},{"id":"M4","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Canada's industrial carbon price","say":"The industrial carbon price survived when the consumer price was cut, and the Canadian Climate Institute projects it delivers 20 to 48 percent of 2030 reductions, against 8 to 14 percent for the consumer price.","detail":"Then-environment minister Guilbeault said industrial pricing delivered about three times the reductions of the consumer price. The policy they say was repealed was the small half.","tags":["carbon tax","carney","repeal","industrial","consumer","canada","climate institute","guilbeault"],"best_against":["the carbon tax was repealed","policy is fragile","Canada abandoned carbon pricing"],"sources":[{"title":"Industrial carbon pricing the top driver of emissions reductions, new analysis shows","publisher":"Canadian Climate Institute","year":2024,"url":"https://climateinstitute.ca/news/industrial-carbon-pricing-the-top-driver-of-emissions-reductions-new-analysis-shows/","finding":"Fetched. Large-emitter trading systems deliver between 20 and 48 per cent of expected reductions from the Emissions Reductions Plan; separately 23 to 39 per cent of avoided emissions from all policies implemented to date. Page does not mention the consumer charge.","verified":true},{"title":"Industrial carbon price emissions (Climate Institute analysis)","publisher":"Global News","year":2024,"url":"https://www.cbc.ca/lite/story/1.7152663","finding":"CBC (New Brunswick story, via search excerpt): modelling shows industrial pricing responsible for 20 to 48 per cent of 2030 reductions and consumer price 8 to 14 per cent.","verified":"partial","note":"Global News page not re-fetched; Climate Institute own pages not found with these numbers. Caution: the Institute's March 2024 framing reported by CBC/CP is 23 to 39 per cent (53 to 90 Mt) industrial vs 8 to 9 per cent (19 to 22 Mt) consumer, so ranges differ by framing; keep the quoted range attributed to the Institute via CBC."},{"title":"Industrial carbon pricing has three times the impact on emissions as consumer carbon tax: report","publisher":"CBC News","year":2024,"url":"https://www.pressreader.com/canada/medicine-hat-news/20240322/281509346179282","finding":"Canadian Press/CBC headline: industrial carbon price cuts three times the emissions of consumer levy; Institute figures 53 to 90 Mt industrial vs 19 to 22 Mt consumer by 2030.","verified":"partial","note":"CBC 403; CTV page fetched but body empty (headline only). Ratio and Mt figures seen in search-result excerpts only."},{"title":"Environment minister open to replacing carbon tax if Canada can still meet its climate goals","publisher":"CBC News","year":2025,"url":"https://www.cp24.com/news/canada/2025/01/22/trudeaus-environment-minister-says-hes-forced-to-recognize-carbon-tax-very-unpopular/","finding":"Guilbeault (22 Jan 2025, then environment minister): industrial side gives us about three times more pollution reduction than the consumer one.","verified":true,"note":"CBC 403; quote read on fetched CP/CP24 story of the same date. He softened the remark next day. Industrial price stayed after consumer price ended March 2025."}],"notes":"CHANGED '23 to 48' -> '20 to 48': the Institute's range is 20-48% of expected reductions; 23-39% is a different measure (share of avoided emissions from policies to date), so 23-48 spliced two ranges. 8-14% consumer share confirmed only via Global News. Guilbeault 'about three times' not seen as a direct quote (CBC 403). Consumer price: fuel charge rate set to zero from 1 April 2025 by order, the statute was not repealed (per search results from news and law-firm pages).","their_sources":[],"phrasings":[]},{"id":"M5","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"UK coal power to zero","say":"Coal was about 40 percent of UK electricity in 2012. The last coal plant closed on September 30, 2024. A carbon price floor did that in twelve years.","detail":"The 2013 carbon price floor made coal uneconomic against gas and renewables; no consumer could choose a coal-free grid until policy made one.","tags":["uk","coal","carbon price floor","ratcliffe","2024","grid","electricity","united kingdom","phase-out","ratcliffe-on-soar","offshore wind","g7"],"best_against":["governments are too slow","carbon pricing doesn't work","individuals drive the energy transition","coal cannot be phased out","carbon pricing does not work"],"sources":[{"title":"The end of an era: Britain's last coal-fired power plant shuts down","publisher":"Grist (republishing The Guardian)","year":2024,"url":"https://grist.org/energy/the-end-of-an-era-britains-last-coal-fired-power-plant-shuts-down","finding":"Fetched. Coal supplied 40 percent of UK electricity in 2012; Ratcliffe-on-Soar generated for the last time on 30 Sept 2024 (date from the Guardian original and Uniper via search).","verified":true},{"title":"How the UK phased out coal in 12 years","publisher":"Euronews","year":2024,"url":"https://www.euronews.com/2024/10/01/how-the-uk-phased-out-coal-in-12-years-by-nudging-mines-to-close-and-boosting-renewables","finding":"Coal 39% of generation in 2012; last plant disconnected 30 Sept 2024; policies listed.","verified":true}],"notes":"Original Euronews URL returned 404; replaced with the Grist republication, which says 40 percent (captain's finding said 39%). Closure 30 Sept 2024 confirmed by Uniper/news results. 2013 carbon price floor not checked.","their_sources":[],"phrasings":[],"alt_say":"Coal was 39 percent of UK electricity in 2012. After carbon pricing and a phase-out date, the last coal plant closed on 30 September 2024, the first G7 country to end coal power."},{"id":"A1","side":"for","angle":"consumption","strength":5,"title":"Households drive 60% of emissions","claim":"Household consumption accounts for over 60 percent of global emissions (Ivanova 2016), so individual demand is the biggest lever there is.","say":"That's an accounting convention, not control. It assigns every supply-chain tonne to the final buyer, including the grid and the codes people live under.","detail":"Ivanova et al. 2016, J. Ind. Ecol., uses 2007 data and states the goal of guiding policy. Statistics Canada's household share is about two-fifths of Canada's emissions. No one chooses their province's grid mix. If they push: F2. Ontario households' electricity footprint collapsed because of M1, not because of any choice they made.","tags":["household","consumption","60%","ivanova","consumption-based","demand","supply chain","accounting","60 percent","footprint","hertwich","demand side","spending","emissions","final demand","mobility shelter food","f2"],"phrasings":["households are responsible for 60 percent of emissions","consumption-based accounting shows individuals drive it","it's our demand that causes emissions","households cause 60% of emissions so the choice is yours","emissions are just consumption by another name","governments don't emit, people do","Policy does not emit anything; people do. Tracing supply chains, household consumption accounts for more than 60% of global greenhouse gas emissions and 50 to 80% of land, material and water use. Every government target is ultimately a target on what households buy, eat, drive and heat, so the household is the unit where impact is decided."],"frames":["F2"],"uses":["M1"],"sources":[{"title":"Environmental Impact Assessment of Household Consumption","publisher":"Journal of Industrial Ecology (Ivanova et al.)","year":2016,"url":"https://doi.org/10.1111/jiec.12371","finding":"Abstract read at research.ou.nl (Wiley page 403): household consumption contributes 'more than 60%' of global GHG emissions; EXIOBASE supply chains for 2007.","verified":true},{"title":"Greenhouse gas emissions attributable to Canadian households, 2021","publisher":"Statistics Canada","year":2025,"url":"https://www150.statcan.gc.ca/n1/pub/11-627-m/11-627-m2025027-eng.htm","finding":"Fetched. Household consumption responsible for 'nearly two-fifths' of Canada's GHG emissions (38.5%, 2021); direct plus indirect.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Page's table: electricity-sector GHG 32.9 Mt (2005), 5.4 Mt (2014); coal about 25% of supply in 2003, 0% in 2014; Ending Coal for Cleaner Air Act passed 2015 (bans future coal generation). Fetched and confirmed. The phase-out itself was a government program through 2014; the Act locked it in.","verified":true}],"notes":"Source finding corrected from '~65%' to 'more than 60%' (abstract). 2007 data confirmed. StatCan: direct household emissions alone are about 15% (2023); two-fifths is the consumption-based figure; Adit's detail is right but be ready for that distinction.","their_sources":[{"title":"Environmental Impact Assessment of Household Consumption","publisher":"Journal of Industrial Ecology (Ivanova, Stadler, Steen-Olsen, Wood, Vita, Tukker, Hertwich)","year":2016,"url":"https://doi.org/10.1111/jiec.12371","finding":"Abstract: household consumption contributes more than 60% of global GHG emissions and 50-80% of land, material and water use (EXIOBASE 2.2, year 2007). Confirmed via search of abstract; publisher page not fetched directly.","verified":true},{"title":"Carbon Footprint of Nations: A Global, Trade-Linked Analysis","publisher":"Environmental Science & Technology (Hertwich & Peters)","year":2009,"url":"https://doi.org/10.1021/es803496a","finding":"Cross-national expenditure elasticity of CO2 of 0.81: more spending means proportionally more emissions. Confirmed via abstract fragment only.","verified":true},{"title":"Quantifying the potential for climate change mitigation of consumption options","publisher":"Environmental Research Letters (Ivanova et al.)","year":2020,"url":"https://doi.org/10.1088/1748-9326/ab8589","finding":"Around two-thirds of global GHG emissions are directly and indirectly linked to household consumption; top 10 consumption options average 9.2 tCO2e per capita mitigation potential.","verified":true}],"alt_say":"That is accounting, not control. Consumption accounting charges the final buyer for every supply-chain tonne, including the grid and the codes they live under. Ivanova's count is over 60 percent.","if_they_push":"Concede some tonnes are discretionary (flights, car size, diet). But the share a household is charged with is not the share it can change, and nobody has measured the discretionary slice; Ontario's 27.5 Mt a year was measured (F2, F1).","comeback":"Mobility, shelter and food are the biggest footprint categories, and households choose what to drive, eat and heat, so the choices behind that 60 percent are theirs."},{"id":"A2","side":"for","angle":"consumption","strength":5,"title":"IPCC: demand-side cuts 40 to 70 percent","claim":"The IPCC says demand-side measures and behaviour change could cut emissions 40 to 70 percent by 2050. That is individual action at scale.","say":"The same IPCC chapter says, with high confidence, that individual behavioural change is insufficient unless embedded in structural and cultural change.","detail":"IPCC AR6 WGIII Ch.5. The 40 to 70 percent is measured against baseline scenarios and includes infrastructure and technology. A commentary on the figure notes few people make such changes spontaneously. If they push: F1. It's a potential, and it is conditional on policy.","tags":["ipcc","demand-side","40-70%","2050","behaviour change","ar6","potential"],"phrasings":["the IPCC says behaviour change can cut emissions by up to 70 percent","demand-side mitigation is the biggest lever"],"frames":["F1","F2"],"sources":[{"title":"AR6 WGIII Chapter 5: Demand, services and social aspects of mitigation","publisher":"IPCC","year":2022,"url":"https://www.ipcc.ch/report/ar6/wg3/chapter/chapter-5/","finding":"Executive summary text read on a plain-text mirror (plaintextipcc.com; ipcc.ch returned 403) and quoted in ipcc.ch search results: 'The indicative potential of demand-side strategies across all sectors to reduce emissions is 40-70% by 2050 (high confidence)'; 'Individual behavioural change is insufficient for climate change mitigation unless embedded in structural and cultural change.'","verified":true}],"notes":"Wording confirmed. Nuance: the 'insufficient' sentence carries no confidence label of its own; it sits under the lead statement 'Demand-side solutions require both motivation and capacity for change (high confidence)'. 'With high confidence' in say is therefore a slight stretch; drop it if challenged. 40-70% is called 'indicative potential'.","their_sources":[]},{"id":"A3","side":"for","angle":"policy fragility","strength":5,"title":"Policy is fragile and reversible","claim":"Canada scrapped its carbon tax, the US left Paris twice. Policy gets repealed the moment a government changes, so it can't be the durable lever.","say":"They're quoting one consumer-facing policy. The industrial price stayed, and it did most of the work. Montreal (1987), the Clean Air Act (1970) and Ontario's legislated coal ban are still in force.","detail":"M2, M3, M4. Behaviour is what rebounds: fossil CO2 fell about 7 percent in 2020, and Le Quéré called it forced behaviour, not structural (Carbon Brief). European heat-pump sales fell 22 percent in 2024 (19 countries), which EHPA ties to reduced subsidy schemes and weak confidence (EHPA 2025). If they push: repeal is itself policy acting. Policy is the lever that moves things, in both directions.","tags":["carbon tax","repealed","carney","paris","withdrawal","trump","fragile","reversible","durability","rebound","repeal","australia","ontario","cap and trade","canada","paris withdrawal","reversal","election","f1","f3"],"phrasings":["the carbon tax got axed","Trump pulled out of Paris again","policy changes with every election","Australia's tax was replaced by other measures and had a short life; it proves little.","Reversals show we need more durable policy, not that policy is weaker than individuals.","Canada still prices industrial carbon.","Policy is only as durable as the next election. Australia repealed its carbon price in July 2014 and power-sector emissions, which had fallen for years, started rising within two months. Ontario cancelled cap-and-trade in 2018, Canada ended its consumer carbon price on 1 April 2025, and the US announced Paris withdrawal again in January 2025 (effective January 2026). Policy cannot be the reliable lever if a change of government erases it."],"frames":["F1"],"uses":["M2","M3","M4"],"sources":[{"title":"Global Carbon Project: coronavirus causes record fall in fossil-fuel emissions in 2020","publisher":"Carbon Brief","year":2020,"url":"https://www.carbonbrief.org/global-carbon-project-coronavirus-causes-record-fall-in-fossil-fuel-emissions-in-2020/","finding":"Fetched. Fossil CO2 expected to drop 7% in 2020; Le Quere: cuts 'were not a structural decrease, but forced changes in behaviour'.","verified":true},{"title":"Euro heat pump sales down 22% in 2024","publisher":"Cooling Post (reporting EHPA)","year":2025,"url":"https://www.coolingpost.com/world-news/euro-heat-pump-sales-down-22-in-2024/","finding":"EHPA via Cooling Post: 2.31 million heat pumps sold across 19 countries in 2024, a drop of 22% on 2023.","verified":"partial","note":"Fetched Cooling Post; search results corroborate EHPA 2025 market report (2.31m, 19 countries, -22%). EHPA PDF unreadable via fetch. Cause is broader than subsidy cuts: reduced support schemes plus weak consumer confidence, cheap subsidised gas, sluggish economy."},{"title":"Appearance before the Standing Committee on Finance, October 2025 (Bill C-4 briefing)","publisher":"Environment and Climate Change Canada","year":2025,"url":"https://www.canada.ca/en/environment-climate-change/corporate/transparency/briefing-materials/appearance-before-the-standing-committee-finance-october-2025.html","finding":"Fuel charge set to zero from 1 April 2025 (SOR/2025-107); repeal bill does not touch Part 2, the output-based system; federal minimum stringency for industrial pricing continues. Seen via search summary.","verified":true},{"title":"Carbon Tax Repeal Boosts Australian Pollution","publisher":"Scientific American","year":2014,"url":"https://www.scientificamerican.com/article/carbon-tax-repeal-boosts-australian-pollution","finding":"Emissions rose within two months of repeal, reversing a near six-year fall in power-sector emissions.","verified":true},{"title":"Carbon price helped curb emissions, ANU study finds","publisher":"Eco-Business reporting ANU","year":2015,"url":"https://www.eco-business.com/news/carbon-price-helped-curb-emissions-anu-study-finds/","finding":"ANU Centre for Climate Economics and Policy (Jotzo, O'Gorman) estimates the carbon price cut electricity-sector emissions by as much as 17 Mt.","verified":"partial","note":"Press report of ANU study fetched; no percentage on the page. Primary study not opened. The A3 text does not actually cite this figure."},{"title":"Legislation to make life more affordable receives Royal Assent","publisher":"Department of Finance Canada","year":2026,"url":"https://www.canada.ca/en/department-finance/news/2026/03/legislation-to-make-life-more-affordable-receives-royal-assent.html","finding":"Bill C-4 received Royal Assent on 12 March 2026; removes the consumer carbon price from federal law while keeping industrial pricing; provincial consumer-price requirement removed as of 1 April 2025.","verified":true},{"title":"Industrial carbon pricing has three times the impact on emissions as consumer carbon tax: report","publisher":"CBC News (Canadian Climate Institute)","year":2024,"url":"https://www.cbc.ca/1.7151139","finding":"Industrial pricing about three times the reductions of the consumer price by 2030; percentage ranges differ between CBC stories, so the 23-48 versus 8-14 pairing in canon M4 mixes two figures. Seen via search summary.","verified":true}],"notes":"7% and Le Quere quote confirmed on Carbon Brief (a projection in Dec 2020 coverage). 22% confirmed only via trade press quoting EHPA, and applies to 19 countries; EHPA's earlier release said 21% (14 countries), so say 'about 22 percent in 19 countries' if pressed. 'Subsidy cuts' is trade-press framing of 'changes and reductions in government support', and other causes were cited. Corrected detail after verification: 'EU heat-pump sales fell 22 percent in 2024 after subsidy cuts' -> 'European heat-pump sales fell 22 percent in 2024 (19 countries), which EHPA ties to reduced subsidy schemes and weak confidence'.","their_sources":[{"title":"Carbon Tax Repeal Boosts Australian Pollution","publisher":"Scientific American","year":2014,"url":"https://www.scientificamerican.com/article/carbon-tax-repeal-boosts-australian-pollution","finding":"Emissions and electricity demand rose in the two months after repeal, reversing a nearly six-year downward trend in electricity-sector emissions (Pitt & Sherry).","verified":true},{"title":"Government moves to purge consumer carbon pricing from law","publisher":"CTV News","year":2025,"url":"https://www.ctvnews.ca/politics/article/government-moves-to-purge-consumer-carbon-pricing-from-law/","finding":"Carney signed a decision note on 14 March 2025 to eliminate the consumer carbon price; effective date of 1 April 2025 confirmed by multiple search results (article body not retrievable).","verified":false},{"title":"Ontario Government Introduces Bill Repealing Cap and Trade","publisher":"Torys LLP","year":2018,"url":"https://www.torys.com/insights/publications/2018/07/ontario-government-introduces-bill-repealing-cap-and-trade","finding":"Ontario withdrew from the Ontario-Quebec-California market in July 2018 and tabled a bill to repeal cap-and-trade (passed Oct 2018). Not fetched directly.","verified":false},{"title":"Executive Order 14162: Putting America First in International Environmental Agreements","publisher":"US Federal Register / govinfo","year":2025,"url":"https://www.govinfo.gov/link/cpd/executiveorder/14162","finding":"20 Jan 2025 order directing formal notice of withdrawal from the Paris Agreement; withdrawal effective 27 Jan 2026 per search results. First Trump withdrawal announcement (June 2017) not separately sourced.","verified":false}],"alt_say":"Repeal is policy acting, in both directions. Canada's industrial carbon price stayed, and the Climate Institute projects it delivers several times what the consumer price did. Montreal, the Clean Air Act and Ontario's coal ban are all still in force.","if_they_push":"Repeal is itself policy acting: someone has to pass a law to undo a law. If they say habits and norms persist, ask which: EU heat-pump sales fell 22 percent in 2024 after subsidies were cut (A3, EHPA, unverified), so behaviour followed policy in both directions. Do not use the 2020 CO2 fall as 'forced behaviour': it came from government lockdowns, which are policy.","comeback":"Repeal proves policy is unreliable, while habits and norms persist; and Ottawa is now watering down the industrial price as well."},{"id":"A4","side":"for","angle":"consumption","strength":5,"title":"Car-free, flight-free, plant-based","claim":"Wynes and Nicholas show living car-free saves 2.4 tonnes a year, skipping one flight 1.6, a plant-based diet 0.8. These dwarf what most policies deliver per person.","say":"That's per person, per year, if they do it. Matching Ontario's coal phase-out alone would take about 11 million people going car-free.","detail":"Wynes & Nicholas 2017 (ERL) cite structural barriers such as sprawl and recommend policy themselves. M1. If they push: F2. Car-free living is only possible where policy funded transit.","tags":["car-free","flights","plant-based","diet","wynes","nicholas","tonnes per person","lifestyle","footprint","car free","flying","transatlantic flight","high impact actions","2.4 tonnes","1.6 tonnes","plant based","individual","mitigation gap","textbooks","f1","f2"],"phrasings":["going car-free saves 2.4 tonnes a year","the four high-impact actions","Wynes and Nicholas 2017","skip one flight and you save more than a year of recycling","go car-free, it's 2.4 tonnes a year","the big four actions are all personal","Wynes and Nicholas found that living car-free saves about 2.4 tCO2e a year, one transatlantic return flight about 1.6 t, and a plant-based diet about 0.8 t, each many times a typical household's marginal actions. The largest individual actions are in your hands today, with no legislative process."],"frames":["F1","F2"],"uses":["M1"],"sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://iopscience.iop.org/article/10.1088/1748-9326/aa7541","finding":"Fetched. Car-free 2.4 tCO2e saved per year; one roundtrip transatlantic flight avoided 1.6; plant-based diet 0.8 per year; authors note cultural norms or structural barriers and sprawling neighbourhoods.","verified":true},{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://doi.org/10.1088/1748-9326/aa7541","finding":"Abstract: car-free 2.4 tCO2e/yr, one transatlantic return flight 1.6, plant-based diet 0.8, one fewer child 58.6 (developed-country average). Discussion proposes policies such as a food carbon tax and compact urban growth for structural barriers.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG 32.9 Mt (2005) to 5.4 Mt (2014); coal banned by the Ending Coal for Cleaner Air Act, 2015.","verified":true}],"notes":"All three numbers confirmed. The 1.6 t is per roundtrip transatlantic flight, as in the claim. 11 million car-free = 27.5 Mt / 2.4 t (M1 arithmetic).","their_sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters (Wynes & Nicholas)","year":2017,"url":"https://doi.org/10.1088/1748-9326/aa7541","finding":"Abstract (fetched): car-free 2.4 tCO2e/yr, avoiding one return transatlantic flight 1.6 t, plant-based diet 0.8 t, one fewer child 58.6 t/yr; 148 scenarios from 39 sources.","verified":true},{"title":"Quantifying the potential for climate change mitigation of consumption options","publisher":"Environmental Research Letters (Ivanova et al.)","year":2020,"url":"https://doi.org/10.1088/1748-9326/ab8589","finding":"Meta-review of 53 studies: living car-free, switching to a BEV and cutting a long return flight are the highest-potential transport options; vegan diet about 0.8-0.9 tCO2e per capita.","verified":true}],"alt_say":"That is per person, per year, if they do it. Matching Ontario's coal phase-out alone would take about 11 million people going car-free. And Wynes and Nicholas themselves point to policy for the structural barriers.","if_they_push":"Their numbers are tonnes per willing person; ours are tonnes per year already removed (F1), and the willing person still needs a bus someone funded (F2).","comeback":"Ontario's drop is one province's grid, but 2.4 tonnes per person is available in any city today with no decade-long legislative process."},{"id":"A5","side":"for","angle":"consumption","strength":4,"title":"Back-of-envelope: one in ten beats the regulation","claim":"If one in ten Canadians went EV or car-free, the megatonnes saved would exceed what the Clean Electricity Regulations are projected to deliver.","say":"They compared a hypothetical uptake to one projection. Compare measured to measured: Ontario's phase-out delivered about 27 megatonnes a year, realized.","detail":"M1. EV uptake is driven by rebates and mandates, so those tonnes belong to policy. If they push: F1.","tags":["back-of-envelope","one in ten","clean electricity regulations","megatonnes","calculation","hypothetical"],"phrasings":["if just ten percent of us did this","our calculation shows"],"frames":["F1"],"uses":["M1"],"sources":[{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Fetched. 32.9 Mt (2005) to 5.4 Mt (2014) = 27.5 Mt a year, the 'about 27 megatonnes' in say.","verified":true}],"notes":"Only number is the Ontario 27 Mt, derived from M1's source. Clean Electricity Regulations projection not checked.","their_sources":[]},{"id":"B1","side":"for","angle":"markets","strength":4,"title":"Consumers beat CFCs before the ban","claim":"US aerosol CFC sales collapsed in the mid-1970s because consumers stopped buying spray cans, years before the 1978 ban. Consumers led, regulators followed.","say":"The ban did the heavy lifting, and only a treaty finished the job.","detail":"The EPA credits the pre-ban drop to manufacturers switching propellants, alongside an Oregon ban (1975), FDA labels (1977) and an announced phase-out. The 1978 ban cut aerosol CFC use about 95 percent. CFC use then grew in refrigeration and foam, and by 1985 US use exceeded pre-1974 levels. If they push: consumer action without a treaty meant the problem moved, not that it got solved.","tags":["cfc","aerosol","ozone","1978 ban","spray cans","consumers","boycott","montreal","montreal protocol","consumer choice","1978","johnson","precedent","before the ban","rowland molina","f1","f2"],"phrasings":["consumers stopped buying spray cans before any law","the aerosol boycott worked","The aerosol drop was a reaction to the science and the looming regulation, not spontaneous consumer virtue.","The US was only 15 percent of world CFC use; the Montreal Protocol, a treaty, is what saved the ozone layer.","Before any US law touched CFCs, ordinary shoppers walked away from aerosol sprays: consumer choice alone cut yearly aerosol releases by an estimated 38 to 41 percent between 1973 and 1977. S.C. Johnson dropped CFCs worldwide in June 1975 and Oregon moved the same month; the federal ban in March 1978 only formalised a market that individuals had already shifted."],"frames":["F1"],"uses":["M2"],"sources":[{"title":"Protection of Stratospheric Ozone; final rule, 58 FR 4768 (archived on EPA site)","publisher":"US EPA","year":1993,"url":"https://webarchive.library.unt.edu/eot2008/20080918005442/http://epa.gov/Ozone/fedregstr/58fr4768.html","finding":"Search excerpt of EPA 58 FR 4768 (15 Jan 1993): 1978 ban reduced aerosol CFC use approximately 95 percent, eliminating nearly half of US CFC consumption; by 1985 US CFC use had surpassed pre-1974 levels.","verified":"partial","note":"Fetch returned empty, but the quoted text appeared in a search excerpt tied to this 4768 URL (archived EPA copy). Oregon 1975 and EPA crediting manufacturers' propellant switch not confirmed on it. EPA regulatory history page confirms only the March 1978 EPA/CPSC/FDA ban."},{"title":"Protection of Stratospheric Ozone; proposed rule, 58 FR 50464 (archived on EPA site)","publisher":"US EPA","year":1993,"url":"https://webarchive.library.unt.edu/eot2008/20080918005442/http://epa.gov/Ozone/fedregstr/58fr4768.html","finding":"The 95 percent and 1985 sentences were found attributed to 58 FR 4768, not 58 FR 50464.","verified":"partial","note":"50464 page loads empty and no excerpt tied to it was seen; recommend citing 4768 for these figures."},{"title":"CPSC/FDA/EPA announce phase-out of chlorofluorocarbons","publisher":"US CPSC","year":1977,"url":"https://www.cpsc.gov/Newsroom/News-Releases/1977/CPSCFDAEPA-Announce-Phase-Out-Of-Chlorofluorocarbons","finding":"April 1977 joint release: FDA requires ozone-depletion warning labels on aerosols shipped after October 1977; proposed steps end CFC aerosol manufacture 15 Oct 1978 and interstate sale 15 Apr 1979.","verified":true,"note":"Fetched. Oregon 1975 not on this page (secondary sources say June 1975, first state to ban CFC aerosols). The claim that EPA credits the pre-ban drop to propellant switching is not on this page."},{"title":"Chlorofluorocarbons are banned in the United States (Research Starter)","publisher":"EBSCO","year":2023,"url":"https://www.ebsco.com/research-starters/politics-and-government/chlorofluorocarbons-are-banned-united-states","finding":"Their own source: aerosol releases fell an estimated 38 to 41 percent 1973 to 1977; ban announced 17 March 1978.","verified":true},{"title":"Protection of Stratospheric Ozone; final rule","publisher":"US EPA, 58 FR 4768","year":1993,"url":"https://www.federalregister.gov/","finding":"Search excerpts of the EPA 1993 ozone rulemaking confirm: the 1978 ban cut aerosol CFC use about 95%; aerosols were over 50% of US CFC use in the mid-1970s; US CFC use passed pre-1974 levels by 1985 (29% of world use). The rule page itself did not load in fetch. The pre-ban 'propellant switching' point comes from EPA's 1978 release, not the 1993 rule.","verified":true},{"title":"Scientific Assessment of Ozone Depletion: 2022","publisher":"WMO / UNEP","year":2022,"url":"https://www.unep.org/resources/publication/scientific-assessment-ozone-layer-depletion-2022","finding":"About 99% of controlled ozone-depleting substances phased out; recovery to 1980 values about 2040 / 2045 / 2066. (From ours.json OW01; UNEP page 403 to fetcher, confirmed in snippets.)","verified":true},{"title":"Government Ban on Fluorocarbon Gases in Aerosol Products Begins October 15 [1978]","publisher":"US EPA (archive)","year":1978,"url":"https://www.epa.gov/archive/epa/aboutepa/government-ban-fluorocarbon-gases-aerosol-products-begins-october-15-1978.html","finding":"Via search excerpt: many aerosol producers had already switched to other propellants or mechanical pumps; fluorocarbon releases from aerosols fell from 511 million pounds (1973) to about 300 million (1977). Page not opened.","verified":true},{"title":"Chlorofluorocarbons and ozone (Research Starter)","publisher":"EBSCO","year":2023,"url":"https://www.ebsco.com/research-starters/earth-and-atmospheric-sciences/chlorofluorocarbons-and-ozone","finding":"Via search excerpt: Oregon was first US state to ban CFC aerosols (1975); S.C. Johnson announced a corporate phase-out in 1975 (EPA timeline). No source found describing a consumer boycott as the cause.","verified":true}],"notes":"UNVERIFIED on the pages. 95% and the 1985 point appear to come from 58 FR 50464 (Sept 1993), not 4768; neither page would load. Oregon 1975 and 'EPA credits manufacturers switching propellants' not confirmed. EPA's regulatory history page (March 1978 ban) does not carry these figures. Use 'about 95 percent' only with the 50464 cite or drop the cite.","their_sources":[{"title":"Chlorofluorocarbons are banned in the United States (Research Starter)","publisher":"EBSCO","year":2023,"url":"https://www.ebsco.com/research-starters/politics-and-government/chlorofluorocarbons-are-banned-united-states","finding":"Fetched: consumer preferences alone reportedly cut yearly aerosol releases by an estimated 38 to 41 percent in 1973-1977; ban announced 17 March 1978; CFCs were in about 97% of aerosols at the time.","verified":true},{"title":"CPSC/FDA/EPA Announce Phase Out of Chlorofluorocarbons","publisher":"US Consumer Product Safety Commission","year":1977,"url":"https://www.cpsc.gov/Newsroom/News-Releases/1977/CPSCFDAEPA-Announce-Phase-Out-Of-Chlorofluorocarbons","finding":"Appeared in search results as the 1977 federal announcement of the phase-out; page not fetched, so the dating of agency action relative to consumer shift is not independently confirmed here.","verified":false}],"alt_say":"That drop came with Oregon's ban and producers switching propellants ahead of a federal phase-out. The ban then cut aerosol CFC use about 95 percent, and only a treaty reached refrigeration and foam.","if_they_push":"A shopper can see a spray can; nobody chose the CFCs inside a fridge or foam. Consumer action without a treaty moved the problem to other uses; it did not solve it.","comeback":"Producers and Oregon only moved because shoppers were already walking away, the federal ban just formalised it, and that US precedent is what carried into the Montreal Protocol."},{"id":"B2","side":"for","angle":"markets","strength":3,"title":"Solar spreads neighbour to neighbour","claim":"Rooftop solar is contagious: Bollinger and Gillingham show each installation raises the chance a neighbour installs. Peer effects, not policy, drive adoption.","say":"That data comes from inside California's $3.3 billion solar rebate program. The peer effect sat on top of a subsidy.","detail":"Bollinger & Gillingham 2012, Marketing Science (data 2001 to 2011, including the California Solar Initiative period from 2006).","tags":["solar","peer effects","neighbours","contagious","bollinger","gillingham","rooftop"],"phrasings":["solar is contagious","your neighbour's panels make you install"],"frames":["F2"],"sources":[{"title":"Peer Effects in the Diffusion of Solar Photovoltaic Panels","publisher":"Marketing Science (Bollinger & Gillingham)","year":2012,"url":"https://econpapers.repec.org/RePEc:inm:ormksc:v:31:y:2012:i:6:p:900-912","finding":"Abstract: PV diffusion in California; one additional installation raises zip-code adoption probability by 0.78 percentage points.","verified":"partial","note":"Abstract does not name CSI or data years. Press coverage gives Jan 2001 to Dec 2011; CSI was created Jan 2006 as a $3.3 billion, 10-year rebate program, so 2001 to 2005 predates it."},{"title":"California Solar Initiative (CSI)","publisher":"California Public Utilities Commission","year":2025,"url":"https://www.cpuc.ca.gov/industries-and-topics/electrical-energy/demand-side-management/california-solar-initiative","finding":"Fetched. Statewide Go Solar California effort (which includes the CSI) had a statewide budget of $3.3 billion and a 3,000 MW goal; effort commenced in 2006.","verified":true}],"notes":"$3.3 billion is the statewide Go Solar California budget (CSI plus other programs); CPUC's own CSI share was later put at about $2.2 billion in CPUC documents. Say and detail unchanged but 'California Solar Initiative' and $3.3B are not strictly the same thing; safer: 'California's $3.3 billion solar program'. Bollinger-Gillingham data window not confirmed on a primary page. Corrected detail after verification: '(data 2001 to 2011, during the California Solar Initiative)' -> '(data 2001 to 2011, including the California Solar Initiative period from 2006)'.","their_sources":[]},{"id":"B3","side":"for","angle":"markets","strength":3,"title":"80% of impact decided at design","claim":"Eighty percent of a product's environmental impact is decided at the design stage. Engineers, individuals, decide that, not governments.","say":"Engineers design to standards, codes and markets that policy sets. The European Commission used that 80 percent figure to justify ecodesign regulation.","detail":"EU Circular Economy Action Plan 2020. The figure's evidence base is thin.","tags":["design","80%","engineers","ecodesign","product","life cycle"],"phrasings":["80 percent of impact is locked in at design","engineers decide the footprint"],"frames":["F2"],"sources":[{"title":"A new Circular Economy Action Plan","publisher":"European Commission","year":2020,"url":"https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=COM:2020:98:FIN","finding":"Fetched. Section 2.1: 'While up to 80% of products' environmental impacts are determined at the design phase'.","verified":true}],"notes":"Confirmed; the Commission says 'up to 80%', not 80%. Say already attributes the figure to the Commission.","their_sources":[]},{"id":"B4","side":"for","angle":"policy fragility","strength":3,"title":"Dieselgate: engineers beat regulation","claim":"Volkswagen cheated emissions tests for years under the strictest regulations in the world. Regulation is only as good as the individuals who comply with it.","say":"Who caught it? An ICCT-funded road test, then the EPA and CARB, who forced the recall. Individuals caused the harm; regulation fixed it.","detail":"The WVU/ICCT 2014 study found the Jetta at 15 to 35 times and the Passat at 5 to 20 times the NOx limit. The EPA/CARB 2015 notice of violation covered roughly 499,000 US cars; 11 million is Volkswagen's own worldwide count.","tags":["volkswagen","dieselgate","defeat device","enforcement","cheating","regulation","nox","epa","icct","wvu","11 million","eu","whistleblower","f2"],"phrasings":["Volkswagen shows regulation doesn't work","engineers got around the rules","Dieselgate was caught and VW paid billions; enforcement worked.","That is an argument for better testing, not for individual action.","ICCT is itself an institution, not individuals.","The EU had some of the world's strictest NOx rules, yet Volkswagen fitted defeat devices to millions of diesels; the EPA found NOx up to 10 to 40 times standards, and it was a university team (WVU) and ICCT, not the regulator, that caught it. Rules only work if someone checks, and in practice outside individuals did."],"frames":["F2"],"sources":[{"title":"EPA's notice of violation of the Clean Air Act to Volkswagen: press statement (WVU/ICCT study)","publisher":"ICCT","year":2015,"url":"https://theicct.org/?p=1823","finding":"Search result from ICCT: Jetta real-world NOx exceeded the US standard by 15 to 35 times across five routes, Passat 5 to 20 times; BMW X5 passed. Study report PDF returned 403.","verified":true},{"title":"Learn About Volkswagen Violations","publisher":"US EPA","year":2015,"url":"https://www.epa.gov/vw/learn-about-volkswagen-violations","finding":"EPA NOV 18 Sept 2015 (2.0L diesels MY2009-2015); second NOV 2 Nov 2015 (3.0L); settlement covers about 590,000 vehicles.","verified":"partial","note":"Fetched. 480,000 and 11 million not on page; no recall mentioned (EPA says emissions modifications). EPA's Sept 2015 release (fetched) says roughly 499,000 cars; DieselNet says 482,000."},{"title":"In-Use Emissions Testing of Light-Duty Diesel Vehicles in the United States","publisher":"West Virginia University / ICCT","year":2014,"url":"https://theicct.org/epas-notice-of-violation-of-the-clean-air-act-to-volkswagen-press-statement","finding":"WVU/ICCT 2014: Jetta NOx exceeded US Tier2-Bin5 standard by a factor of 15 to 35; Passat by 5 to 20; BMW X5 at or below standard.","verified":"partial","note":"ICCT pages 403; figures seen in search excerpts quoting the report. 15 to 35 applies to the Jetta only."},{"title":"EPA, California notify Volkswagen of Clean Air Act violations","publisher":"US EPA archive","year":2015,"url":"https://www.epa.gov/archive/epa/newsreleases/epa-california-notify-volkswagen-clean-air-act-violations-carmaker-allegedly-used.html","finding":"EPA and CARB notice of violation 18 Sept 2015, roughly 499,000 diesel cars since 2008; EPA says it is incumbent on VW to initiate the process to fix the emissions systems.","verified":"partial","note":"Fetched. NOV confirmed; page does not say recall was forced."}],"notes":"15-35x applies to the Jetta only (Passat 5-20x). '11 million cars' is Volkswagen's own worldwide figure from Sept 2015, not in the EPA/CARB NOV, which covered roughly 480,000 US cars (about 590,000 in the full settlement); not verified on a fetched page. 'Forced the recall' unconfirmed: DOJ material said recall talks had not produced an acceptable way forward; a buyback settlement followed in 2016. Corrected detail after verification: 'covered about 480,000 US cars' -> 'covered roughly 499,000 US cars'. Corrected detail after verification: 'found 15 to 35 times the NOx limit' -> 'found the Jetta at 15 to 35 times and the Passat at 5 to 20 times the NOx limit'.","their_sources":[{"title":"EPA, California notify Volkswagen of Clean Air Act violations","publisher":"US EPA archive","year":2015,"url":"https://www.epa.gov/archive/epa/newsreleases/epa-california-notify-volkswagen-clean-air-act-violations-carmaker-allegedly-used.html","finding":"Notice of violation for cheat software; NOx 10 to 40 times above standard depending on cycle (figure from search summary; page not fetched).","verified":false},{"title":"How ICCT research unearthed the Dieselgate emissions scandal","publisher":"International Council on Clean Transportation","year":2015,"url":"https://theicct.org/dieselgate-emissions-scandal/","finding":"ICCT-commissioned WVU tests exposed gaps; ICCT cites NOx 5 to 35 times limits. 403 on fetch; claim from search summary. VW's 11 million figure from VW statement per search results.","verified":false}],"alt_say":"Who caught it? A university road test commissioned by the ICCT, then the EPA and California, who forced the recall. Engineers cheated; the rule is what made it cheating.","if_they_push":"That is an argument for better testing, which is more policy; the ICCT is an institution that informs regulators, not a consumer making a purchase. If they say the regulator did not catch it: the regulator is what acted on it and imposed the recall, and a cheat only counts as a cheat because a rule exists.","comeback":"The regulators missed it for years and a university team and an NGO caught it, so individual outsiders did what policy could not."},{"id":"B5","side":"for","angle":"markets","strength":3,"title":"Dolphin-safe tuna boycott","claim":"A consumer boycott forced StarKist and the industry to go dolphin-safe in 1990, before any law required it.","say":"Dolphin deaths were already regulated under the 1972 Marine Mammal Protection Act, and a voluntary pledge needs enforcement. That's what the 1990 labelling law did.","detail":"Dolphin Protection Consumer Information Act, 1990. The pledge became binding only through the label standard and its enforcement.","tags":["tuna","dolphin-safe","boycott","starkist","label","consumer","nestle","kit kat","greenpeace","palm oil","sinar mas","corporate pledge","deforestation","brand risk","unilever","consumer pressure","f1","f3"],"phrasings":["the tuna boycott worked","dolphin-safe came from consumers","Nestlé still got Sinar Mas oil through other suppliers; pledges were not enforced and deforestation continued.","The RSPO and EU deforestation rules, not pledges, are what created traceability.","In March 2010 Greenpeace's Kit Kat video, a campaign aimed at consumers, got Nestlé to drop Sinar Mas as a palm oil supplier within weeks; Unilever and Kraft had already cancelled the same supplier. Brands treat shoppers' attention as a hard constraint, which makes consumer pressure faster than any rule on Indonesian forestry."],"frames":["F3"],"sources":[{"title":"Dolphin Safe","publisher":"NOAA Fisheries","year":2025,"url":"https://www.fisheries.noaa.gov/national/marine-mammal-protection/dolphin-safe","finding":"NOAA: DPCIA was passed in 1990, sets conditions for the dolphin-safe label, implemented in 50 CFR part 216 subpart H; Tuna Tracking and Verification Program audits canneries and spot-checks labels.","verified":true,"note":"Fetched. MMPA enactment 21 Dec 1972 confirmed on NOAA's MMPA page (fisheries.noaa.gov/national/marine-mammal-protection/marine-mammal-protection-act), which also covers ETP purse-seine yellowfin tuna."},{"title":"Palm Oil Giant Sinar Mas Continues to Break Environmental Commitments","publisher":"Greenpeace","year":2010,"url":"https://www.greenpeace.org/usa/news/palm-oil-giant-sinar-mas-conti-2/","finding":"Greenpeace reported that after cancelling its direct contract, Nestle still bought Sinar Mas palm oil indirectly through suppliers such as Cargill. Advocacy source, from a search summary.","verified":true},{"title":"Protection for Paradise Forests in Indonesia","publisher":"Greenpeace","year":2010,"url":"https://www.greenpeace.org/usa/victories/protection-for-paradise-forests-in-indonesia/","finding":"Nestle's May 2010 policy committed to exclude suppliers linked to deforestation. Advocacy source, search summary.","verified":true},{"title":"Palm news: Sinar Mas cleared by independent study (Bloomberg, republished)","publisher":"Malaysian Palm Oil Board","year":2010,"url":"https://prestasisawit.mpob.gov.my/ms/palmnews/news/7213","finding":"PT SMART said Nestle accounted for 0.2 percent of Sinar Mas palm oil sales; Control Union and BSI study cleared the group; Nestle, Unilever stopped buying after Greenpeace claims.","verified":"partial","note":"Fetched. Statements are company-attributed, and Nestle resuming purchases is not on the page. This is a palm-oil source filed under the dolphin-safe tuna card, so it likely belongs to a different card."}],"notes":"1990 Act confirmed. MMPA 1972 and the StarKist 1990 pledge not confirmed on a fetched page (NOAA MMPA page only references 21 Dec 1972 pre-act determinations).","their_sources":[{"title":"Nestle drives rainforest destruction pushing orang-utans to brink of extinction","publisher":"Greenpeace","year":2010,"url":"https://www.greenpeace.org/usa/news/nestle-drives-rainforest-destr/","finding":"Per search summary: March 2010 'Caught Red-Handed' report and Kit Kat parody; Nestlé said it replaced Sinar Mas for further shipments. Advocacy source, page not fetched.","verified":false},{"title":"Kit Kat spat","publisher":"Covalence","year":2010,"url":"https://www.covalence.ch/index.php/2010/03/17/kit-kat-spat/","finding":"Per search summary: Unilever cancelled a $30m annual Sinar Mas contract in 2009 and Kraft cancelled in February 2010. Page not fetched.","verified":false}],"alt_say":"Fast, yes. But Nestlé dropped one supplier, and Greenpeace itself reported it kept buying Sinar Mas oil indirectly through Cargill. A pledge has no inspector. Tuna needed a label law before dolphin-safe meant anything.","if_they_push":"Fast is not the same as lasting: a brand pledge has no inspector, a rule does.","comeback":"Within weeks the campaign made Nestle write a zero-deforestation policy and Greenpeace called it off, which is faster than any Indonesian forestry rule has ever moved."},{"id":"B6","side":"for","angle":"policy fragility","strength":3,"title":"Record emissions after a decade of Paris","claim":"Global emissions hit a record in 2025 after ten years of Paris. A decade of policy has failed.","say":"That indicts their lever too: if households drive 60 percent, they also failed. Where policy was strongest, emissions fell.","detail":"Global Carbon Budget 2025 attributes the 2025 drop in land-use emissions mainly to the end of El Nino conditions, not policy; 35 countries cut emissions while growing their economies. Le Quéré et al. 2019 found renewable-energy and efficiency policies associated with the emissions cuts in the 18 countries (correlation, not proof). Re-check against the 2026 Global Carbon Budget (out mid-November).","tags":["record emissions","global carbon project","paris failed","decade","policy failed"],"phrasings":["emissions are at a record high","ten years of Paris and nothing"],"frames":["F1"],"sources":[{"title":"Global Carbon Budget 2025","publisher":"Global Carbon Project","year":2025,"url":"https://essd.copernicus.org/articles/18/3211/2026/","finding":"GCB 2025 (ESSD): fossil CO2 decreased in 35 economies with growing GDP over 2015-2024, 27 percent of world fossil emissions; fossil emissions projected up 1.1 percent in 2025, a record high (globalcarbonbudget.org).","verified":"partial","note":"35 countries confirmed on the ESSD paper. Policy credit for land-use drop not found: search excerpt attributes the 2025 land-use decline mainly to the end of El Nino conditions; CSIRO also does not credit policy."},{"title":"Global Carbon Budget 2025 (CSIRO, from The Conversation)","publisher":"CSIRO","year":2025,"url":"https://www.csiro.au/en/news/all/articles/2025/november/global-carbon-budget-2025","finding":"Page says net carbon emissions from land-use change have declined over the past decade and names 35 countries that reduced fossil emissions over the past decade; it gives no cause for the land-use drop.","verified":"partial","note":"Fetched CSIRO page. 35-countries figure confirmed; the claim that GCB 2025 credits environmental policy for the land-use drop is not on the page."},{"title":"Drivers of declining CO2 emissions in 18 developed economies","publisher":"Nature Climate Change (Le Quere et al.)","year":2019,"url":"https://ueaeprints.uea.ac.uk/id/eprint/70189/","finding":"Abstract: policies on renewable energy are supporting emissions reductions and displacing fossil fuels in these 18 countries; energy-efficiency policies support lower energy use. Correlation only.","verified":"partial","note":"Fetched UEA repository abstract (Le Quere et al, Nat Clim Change 9:213). The 'most policies, largest decreases' phrasing appeared only in a Future Earth press-release excerpt in search, not on a page I fetched."}],"notes":"Record 2025 fossil emissions and 35 countries confirmed (35 on CSIRO's GCB summary, not on the GCP page). Not confirmed: that the GCB credits environmental policy for the land-use drop (search summaries attribute it to less deforestation and fires in South America); that line in detail should be softened. Le Quere 2019 'most policies' wording from press release only. Corrected detail after verification: 'Global Carbon Budget 2025 credits environmental policy for the drop in land-use emissions' -> 'Global Carbon Budget 2025 attributes the 2025 drop in land-use emissions mainly to the end of El Nino conditions, not policy'. Corrected detail after verification: 'Le Quéré et al. 2019 found the largest decreases in countries with the most policies' -> 'Le Quéré et al. 2019 found renewable-energy and efficiency policies associated with the emissions cuts in the 18 countries (correlation, not proof)'.","their_sources":[]},{"id":"B7","side":"for","angle":"movements","strength":4,"title":"Policy follows people","claim":"Governments only act when public opinion forces them. Norms change first; policy follows. So the individual norm shift is the real cause.","say":"Opinion only changes the environment once it becomes policy. That concedes policy is the delivery mechanism.","detail":"F3. Swiss voters rejected a CO2 law in 2021 (51.6 percent), and Canadian opinion killed the consumer price. Public sentiment cuts both ways; policy is what locks gains in.","tags":["policy follows people","public opinion","norms","governments respond","social tipping","otto","values","chenoweth","3.5 percent","movements","abolition","contagion","upstream","civil society","f3","f1"],"phrasings":["governments only move when people demand it","the norm changed first","Chenoweth's data are about regime change, not climate policy.","The 3.5 percent rule is correlation with selection bias.","Otto et al. recommend policy interventions like removing subsidies.","Laws that stick follow shifts in what ordinary people accept: abolition, suffrage and clean air all began as movements. Otto et al. in PNAS identify norms and values as one of six social tipping elements for decarbonization, and Chenoweth's work on 323 campaigns found no nonviolent campaign that reached 3.5 percent participation failed. Change individual norms and the policy comes free."],"frames":["F3"],"sources":[{"title":"Strong turnout influenced rejection of key environmental law","publisher":"Swissinfo (SRG)","year":2021,"url":"https://www.swissinfo.ch/eng/strong-turnout-influenced-rejection-of-key-environmental-law/46829490","finding":"\"On June 13, 51.6% of Swiss voters rejected the CO2 law.\"","verified":true,"note":"Fetched page; exact figure stated."},{"title":"Social tipping intervention strategies for rapid decarbonization need to consider how change happens","publisher":"PNAS (Smith, Christie, Willis)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7245064","finding":"Transformation begins with civil society and ends in government intervention.","verified":true},{"title":"Questions, answers and some cautionary updates regarding the 3.5% rule","publisher":"Harvard Kennedy School Carr Center (Chenoweth)","year":2020,"url":"https://www.hks.harvard.edu/centers/carr/publications/questions-answers-and-some-cautionary-updates-regarding-35-rule","finding":"323 campaigns 1900-2006, none that reached 3.5 percent failed; descriptive, not a guarantee; failures above the threshold exist (Bahrain). Seen via search summary.","verified":true},{"title":"Swiss referendum on the CO2 Act, 13 June 2021","publisher":"Swiss Federal Chancellery","year":2021,"url":"https://www.uvek.admin.ch/uvek/de/home/uvek/abstimmungen/co2-gesetz.html","finding":"Federal result summary (via search excerpt, uvek.admin.ch): Abgelehnt, 51.6% Nein, 48.4% Ja; BFS lists turnout 59.7%, 21 cantons against.","verified":"partial","note":"bk.admin.ch homepage is generic and the Chancellery results URLs I tried 404 or were blocked. Fetched UVEK page confirms rejection on 13 June 2021 but its percentages came only from a search excerpt. Swissinfo (B7 idx0) fetched with 51.6%."}],"notes":"Figure and date confirmed by Swissinfo and many outlets; Federal Chancellery/admin.ch page could not be loaded (404), hence verified:false under the publisher rule.","their_sources":[{"title":"Social tipping dynamics for stabilizing Earth's climate by 2050","publisher":"PNAS (Otto et al.), doi:10.1073/pnas.1900577117","year":2020,"url":"https://doi.org/10.1073/pnas.1900577117","finding":"Names six social t
