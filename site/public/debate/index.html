hes them from here. No shopper can see that tonne.","detail":"The paper puts the overseas share at 16.4 percent in 1995 rising to a peak of 20.4 percent in 2006; 'one fifth' is the peak year, and the abstract calls it a peak. The emissions happen inside other countries' grids and factories, so they are governed by their policy: China's air pollution campaign cut PM2.5 about 42 percent (OW10). Jurisdictional limits are an argument for international and trade policy, the EU's border carbon adjustment and the Montreal Protocol (M2), not for individual action, because a consumer has no information about where a shirt's tonnes were emitted. Read alongside A1 for the accounting point.","if_they_push":"Concede that a national cap misses imported emissions. Then ask what an individual does about them. Nothing measurable. Governments can, through border adjustments and treaties, and have.","comeback":"A border carbon price is still years away for most goods; meanwhile the only lever on an imported tonne is whether someone buys the product.","weak":false,"tags":["one fifth","20%","overseas","offshored","imports","clothing","electronics","supply chain","jurisdiction","policy limited to borders","us households","carbon leakage","song","f2","cl1"],"phrasings":["Policy is also often limited to emissions within the city/province/country, not accounting for emissions from other countries that consumers individually contribute to.","Roughly one fifth of the total carbon footprint of the US household consumption is attributed to overseas carbon footprint, such as clothing and electronics expenditure.","This means a distinct portion of household consumption emissions occur in other countries from the upper supply chain.","Governments cannot regulate the emissions behind imported clothing and electronics."],"frames":["F2","CL1"],"uses":["M2","OW10"],"notes":"Abstract refetched via the Semantic Scholar API this pass: 16.4 percent (1995), peak 20.4 percent (2006), period 1995 to 2014 all confirmed, so their 'roughly one fifth' is a fair reading of the peak. The destination countries (China first) are not in the abstract and are not asserted anywhere on this card now. ScienceDirect pages return 403.","sources":[{"title":"Scale, distribution and variations of global greenhouse gas emissions driven by U.S. households (Song et al.)","publisher":"Environment International, via Semantic Scholar record","year":2019,"url":"https://api.semanticscholar.org/graph/v1/paper/DOI:10.1016/j.envint.2019.105137?fields=title,abstract,year,venue,authors","finding":"16.4 percent (1995) to a 20.4 percent peak (2006); housing and transport 53 to 66 percent of the domestic footprint; the abstract names no destination country.","verified":true}],"their_sources":[{"title":"Scale, distribution and variations of global greenhouse gas emissions driven by U.S. households (Song et al.)","publisher":"Environment International, via Semantic Scholar record","year":2019,"url":"https://api.semanticscholar.org/graph/v1/paper/DOI:10.1016/j.envint.2019.105137?fields=title,abstract,year,venue,authors","finding":"Abstract: overseas footprint rose 'from 16.4% of the total carbon footprint in 1995 to the peak of 20.4% in 2006'; study period 1995 to 2014. Refetched this pass.","verified":true}],"routes":[{"type":"deny","say":"Their own paper says the overseas share peaked at about a fifth in 2006. It is a peak year in a 1995 to 2014 series, not a standing fact."},{"type":"reframe","say":"An overseas tonne is not an ungoverned tonne. It sits in another country's grid, under that government's rules, and those rules have moved it."},{"type":"turn","say":"If a shopper cannot see where a shirt's tonnes were emitted, the shopper cannot act on them. Only a treaty or a border carbon price reaches them."},{"type":"fallacy","say":"A limit on one country's policy is an argument for international policy, not for individual action. The conclusion does not follow from the gap."}]},{"id":"TC08","side":"for","kind":"argument","angle":"their case","strength":4,"title":"Earth Day 1970 created the EPA","claim":"Individual action is the driving force behind environmental policy. About 20 million Americans took part in the first Earth Day in 1970. Before that there was no environmental agency and no Clean Air Act; environmental issues were not on the federal radar. Citizens pressured the government, the issue went onto the national agenda, and the EPA was established in December 1970.","say":"Twenty million people marched, and what changed the air was the law they marched for. Their source says a Senator created Earth Day and Congress authorized the EPA. The Clean Air Act did the cutting.","detail":"Their EPA page says Senator Gaylord Nelson created Earth Day and that Congress authorized the EPA; EPA's origins page says Nixon sent Congress Reorganization Plan No. 3 in July 1970, the House and Senate approved it, and the agency's birth date is 2 December 1970; the Clean Air Act was signed 31 December 1970. The page's 'no Clean Air Act before 1970' is loose: EPA's own history says the Clean Air Act of 1963 'was the first federal legislation regarding air pollution control' and the Air Quality Act was enacted in 1967. The march lasted a day; the statute cut the six common pollutants 78 percent while GDP grew (M3, OP1) and the 1990 amendments cut power plant sulphur dioxide 96 percent (OW04). Their argument is that individuals produce policy, which concedes that policy is the thing that produces impact (F3). Read alongside B7 and C5.","if_they_push":"Grant that the movement mattered. Ask what Earth Day would have changed with no Act and no agency: the same smokestacks the next morning. The demand was for law because law is what works.","comeback":"Without the 20 million there is no Act to point to; you are crediting the pen and ignoring the hand that forced it to write.","weak":false,"tags":["earth day","1970","20 million","epa","environmental protection agency","december 1970","public pressure","citizens pressured","national agenda","clean air act","driving force","nixon","gaylord nelson","april 22","f3","f1"],"phrasings":["Individual action is the driving force behind environmental policy: public pressure can push governments to act on environmental problems they might otherwise overlook.","Approximately 20 million Americans participated in the first Earth Day in 1970.","Before that, there was no Environmental Agency, no Clean Air Act. Environmental issues were not on the federal government's radar.","Citizens pressured the government to take action on the increasing pollution and waste. This helped bring environmental issues onto the national political agenda.","The US EPA was established later that year, in December 1970."],"frames":["F3","F1"],"uses":["M3","OW04","OP1"],"notes":"All four EPA pages refetched this pass. Their numbers are right (20 million, December 1970) and match the EPA page they cite. The 'no Clean Air Act before 1970' line is on the EPA Earth Day page itself, so attack it gently: the 1963 and 1967 laws were weak, the 1970 one had teeth.","sources":[{"title":"EPA History: Earth Day","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/history/epa-history-earth-day","finding":"Senator Gaylord Nelson created Earth Day; Congress authorized the new agency in December 1970. Refetched this pass.","verified":true},{"title":"The Origins of EPA","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/history/origins-epa","finding":"Nixon signed Reorganization Plan No. 3 in July 1970 after sending Congress a plan to consolidate environmental responsibilities, which the House and Senate approved; Ruckelshaus confirmed 2 December 1970, 'the traditional date we use as the birth of the agency'; Nixon's 37-point environmental message to Congress. Refetched this pass.","verified":true},{"title":"40th Anniversary of the Clean Air Act","publisher":"US EPA","year":2010,"url":"https://www.epa.gov/node/85961","finding":"'The Clean Air Act was signed by President Richard Nixon on December 31, 1970.' Refetched this pass.","verified":true},{"title":"Evolution of the Clean Air Act","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/clean-air-act-overview/evolution-clean-air-act","finding":"'The Clean Air Act of 1963 was the first federal legislation regarding air pollution control'; 'In 1967, the Air Quality Act was enacted'; the 1970 Act 'resulted in a major shift in the federal government's role'; 1990 amendments authorized acid rain controls. Refetched this pass.","verified":true}],"their_sources":[{"title":"EPA History: Earth Day","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/history/epa-history-earth-day","finding":"'Twenty million Americans demonstrated in different U.S. cities'; 'In spring 1970, Senator Gaylord Nelson created Earth Day as a way to force this issue onto the national agenda'; 'In December 1970, Congress authorized the creation of a new federal agency'; before 1970 'there was no EPA, no Clean Air Act, no Clean Water Act'. Their numbers match the page. Refetched this pass.","verified":true}],"routes":[{"type":"turn","say":"Their best example of individual action is a crowd demanding a statute, and a Senator organised it. The movement itself agreed that policy is where impact comes from."},{"type":"reframe","say":"If protest counts as individual action, its impact arrives through the law it wins, so the impact is policy's. If protest does not count, Earth Day leaves their case."},{"type":"deny","say":"There was a Clean Air Act before 1970, in 1963, and an Air Quality Act in 1967. The 1970 law gave them teeth, which is the point."},{"type":"outweigh","say":"A one-day march against fifty years of a statute: the six common pollutants down 78 percent while the economy grew. The Act is the measured effect."}]},{"id":"TC09","side":"for","kind":"argument","angle":"their case","strength":3,"title":"Policies still leave us at 2.8 degrees","claim":"Having the authority to regulate does not guarantee environmental improvement. UNEP's latest emissions report says existing government policies still put the world on course for 2.8 degrees of warming this century, almost double the 1.5 degree goal established under the Paris Agreement.","say":"Their own report says the current-policies projection has fallen from at least three degrees at Paris. That movement is governments acting. The gap left is policy still owed, not proof that individuals could close it.","detail":"UNEP's 2025 report, as summarised by PBL, puts current policies at up to 2.8 C, down from 3.1 C in the 2024 report, and says that 'since the adoption of the Paris Agreement ten years ago, temperature predictions have fallen from 3-3.5°C'; full NDC delivery would give 2.3 to 2.5 C. Climate Action Tracker's own series went from 3.6 C in 2015 to 2.6 C now and credits the Paris Agreement (OW17). Do not oversell the latest 0.3 C step: PBL says 0.1 C is methodology and the US withdrawal cancels another 0.1 C. The report measures the distance between what governments have done and what they promised; it contains no estimate of what households could have closed. Read alongside PL01, which has the full handling, and PL13.","if_they_push":"Agree the gap is real and dangerous. Then ask which individual action they would put against it with a measured figure. The report has none, because there is none.","comeback":"A model projection is not a measured cut, and after a decade of Paris global emissions are still at record highs; the fall in the projection is pledges, not tonnes.","weak":false,"tags":["unep","2.8","2.8 degrees","1.5","paris","emissions gap","current policies","almost double","warming","authority doesn't guarantee","unfccc","f1"],"phrasings":["Having the authority to introduce regulations doesn't automatically guarantee environmental improvements.","Looking at UNEP's latest emissions report, existing government policies still put the world on a 2.8 degrees of warming over this century, which is almost double the goal of 1.5 degrees established by the UN.","Existing government policies still put the world on 2.8 degrees of warming over this century.","Governments have had the power for decades and we are still heading for nearly three degrees."],"frames":["F1"],"uses":["OW17"],"notes":"PBL page refetched this pass; the 2.8 C is right and so is their 'almost double' arithmetic (2.8 over 1.5 is 1.87). UNEP's own pages (unep.org, wedocs) returned 403, so cite PBL aloud. Their UNFCCC link returned an empty page; it only establishes the 1.5 C goal and is not contested. Existing card PL01 covers the same ground with the CAT figures; this card exists to match their exact 2.8 and 'almost double' wording.","sources":[{"title":"UNEP Emissions Gap Report 2025 (PBL summary)","publisher":"PBL Netherlands Environmental Assessment Agency","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Up to 2.8 C under current policies, down from 3.1 C last year; 'temperature predictions have fallen from 3-3.5°C' since Paris; 'methodological updates account for 0.1°C of the improvement'; US withdrawal 'will cancel another 0.1°C'. Refetched this pass.","verified":true}],"their_sources":[{"title":"UNEP Emissions Gap Report 2025 (PBL summary)","publisher":"PBL Netherlands Environmental Assessment Agency","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"'Implementing only current policies would lead to up to 2.8°C of warming, compared to 3.1°C last year'; NDCs fully implemented 2.3 to 2.5 C; 1.5 C likely exceeded within the next decade. Their 2.8 is right. Refetched this pass.","verified":true},{"title":"Emissions Gap Report 2025: Off Target","publisher":"UNEP","year":2025,"url":"https://www.unep.org/resources/emissions-gap-report-2025","finding":"Released 4 November 2025; current policies up to 2.8 C per UNEP's press release (seen in search results). Page returned 403 to our fetch.","verified":false}],"routes":[{"type":"turn","say":"Their source says the projection fell from three degrees or more at Paris to 2.8 now. The movement in that number is government policy."},{"type":"reframe","say":"An emissions gap is the size of the policy not yet passed. It is an argument for more policy, not evidence that individuals could have done it."},{"type":"fallacy","say":"A tool that has not finished the job is not shown to be weaker than a tool with no measured result. Incomplete is not the same as ineffective."},{"type":"outweigh","say":"Climate Action Tracker puts current policies about a degree lower than in 2015. No study puts a degree against household choices."}]},{"id":"TC10","side":"for","kind":"argument","angle":"their case","strength":3,"title":"Policy is a stamp on a shift already won","claim":"Politicians rarely lead on environmental issues; they follow public opinion. Individual activism, lifestyle changes and consumer choices create the political momentum that makes government action possible. In a democracy policy is almost always reactive: a policy is simply the official stamp placed on a cultural shift that individual citizens have already fought for and won. Without 20 million people showing up on April 22, 1970, the legal framework that protects our air, water and wildlife would likely not exist.","say":"The stamp is what changed the tonnes. Earth Day did not cut a pound of sulphur dioxide. The Clean Air Act did, and the marchers knew it. A law is what they asked for.","detail":"Their closing concedes the mechanism. If opinion only reaches the environment once it becomes policy, then policy is the delivery system and the motion is ours (F3, B7). Their own example runs the same way: Earth Day was organised by a Senator, Congress authorized the EPA and Nixon signed the Clean Air Act within the year (TC08); the measured results are the Act's, 78 percent down on the six common pollutants (M3) and 96 percent on power plant sulphur dioxide under the 1990 amendments (OW04). 'Reactive' also cuts both ways: Swiss voters rejected a CO2 law in 2021 and Canadian opinion killed the consumer carbon price, so public opinion is not a reliable green lever, and policy is what locks a gain in (B7, A3). Finally, 'whatever comes first gets the credit' is a reasoning error: the pollution came before the movement, and nobody credits the pollution. Read alongside B7 and C5.","if_they_push":"Ask for one measured reduction that a cultural shift produced without passing through a standard, a price or a ban. Then offer ours, which all passed through one.","comeback":"You are describing the receipt and calling it the purchase; the stamp records a decision the public had already made, and no Act passes without the votes behind it.","weak":false,"tags":["stamp","rubber stamp","reactive","politicians follow","public opinion","cultural shift","momentum","activism","closing","april 22 1970","20 million","democracy","legal framework","policy follows people","f3","f6","f4"],"phrasings":["Politicians rarely lead on environmental issues, they follow public opinion.","Individual activism, lifestyle changes, and consumer choices create the political momentum that makes government action possible.","In a democracy, government policy is rarely proactive; it is almost always reactive.","A policy is simply the official stamp placed on a cultural shift that individual citizens have already fought for and won.","Without the individual decision of 20 million people to show up on April 22, 1970, the legal framework that protects our air, water, and wildlife today would likely not exist."],"frames":["F3","F6","F4"],"uses":["M3","OW04"],"notes":"This is their closing line, so expect it in their last speech when we cannot reply at length; PE3 in team2.json is our pre-written version. EPA Earth Day page and power plant progress report refetched this pass. Swiss 2021 and Canadian consumer price facts are on B7 and A3; not refetched.","sources":[{"title":"EPA History: Earth Day","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/history/epa-history-earth-day","finding":"Senator Gaylord Nelson created Earth Day; Congress authorized the new agency in December 1970. Refetched this pass.","verified":true},{"title":"Power Plant Emissions Reductions (Progress Report)","publisher":"US EPA","year":2024,"url":"https://19january2025snapshot.epa.gov/power-sector/progress-report-emissions-reductions/index.html","finding":"Sources in the CSAPR SO2 annual programs and the ARP 'reduced SO2 emissions by 15.1 million tons (96 percent) from 1990 levels'; latest data year 2023. Refetched this pass.","verified":true}],"their_sources":[],"routes":[{"type":"reframe","say":"If opinion only changes the environment once it becomes policy, policy is the delivery mechanism. That is our motion in their words."},{"type":"turn","say":"The marchers were asking for a law, and the law is what cut the pollution. Their best example says policy is where impact lives."},{"type":"deny","say":"Opinion is not reliably green. Swiss voters rejected a CO2 law in 2021 and Canadian opinion killed the consumer carbon price. Policy holds a gain when opinion moves on."},{"type":"fallacy","say":"Coming first is not doing the work. The smog came before the movement and nobody credits the smog. The thing that changed the tonnes is the statute."}]},{"id":"TC11","side":"for","kind":"argument","angle":"their case","strength":2,"title":"Toronto: 25% of recycling is contaminated","claim":"Laws are only effective when individuals follow them. Toronto's public areas have separate litter and recycling bins, yet a City of Toronto report found 25% of items placed in recycling bins were non-recyclable, contaminating the bins. A government can introduce recycling policies but cannot ensure every person recycles, so individual action controls the effectiveness of policy.","say":"Since Ontario moved recycling to producers, Toronto's public blue bins go to landfill whatever you put in them. A March 2026 council motion says so. The regulation decides what the sorter's effort is worth.","detail":"The published City figure is the residential blue bin contamination rate: about 26 percent in 2017 (the City's own letter to residents, reported by Global News), 22 percent in 2015 and 30 percent in 2019 (Spacing). We found no City report giving 25 percent for public bins. Public bins are worse: a notice of motion to Toronto council for 25 to 27 March 2026 states that about 15,000 public Blue Bins are no longer collected as recycling under the provincial takeover of the Blue Box program (O. Reg. 391/21); their contents 'are collected as solid waste and combined with garbage for disposal in landfill sites'. So whether a Torontonian's can gets recycled is set by a provincial regulation, not by the Torontonian. The 2017 episode also shows the compliance lever is policy: the City inspected bins, tagged failures and refused collection on a second failure. And where a policy was designed to make the individual act unnecessary, it worked: Ireland's bag levy cut bag use about 90 percent (OW15). Read alongside FP05 and MK05.","if_they_push":"Agree that no law makes every person sort correctly. The fix is to design around it: deposit returns, producer responsibility, enforcement. Each is policy, and that is why contamination is a policy problem with policy answers.","comeback":"A regulation that sends public recycling to landfill proves our point: government had the power and used it badly, while individuals who carry their recycling home still divert it.","weak":false,"tags":["toronto","recycling","contamination","25%","25 percent","blue bin","litter bins","public areas","non-recyclable","compliance","laws only effective when followed","city of toronto report","landfill","f2","f6"],"phrasings":["Although governments can create laws, those laws are only effective when individuals follow them.","Many public areas in Toronto have separate litter and recycling bins to encourage recycling, however, a city of Toronto report found that 25% of the items placed in the recycling bins were non-recyclable materials, creating contaminated bins.","A government can introduce recycling policies, but it cannot ensure that every person recycles, proving that individual action has more impact by being in control over the effectiveness of government policy.","A City of Toronto report found that 25% of the items placed in the recycling bins were non-recyclable materials."],"frames":["F2","F6"],"uses":["OW15","OP4"],"notes":"No City report with exactly 25% for public bins was found in this pass either; residential rates on record are 22% (2015, Spacing), 26% (2017, Global News quoting the City's letter), 30% (2019, Spacing). Their 25% is unconfirmed and within the residential range, so do not call it wrong aloud; say what the published figure measures. The March 2026 motion PDF was downloaded and its text extracted; the council record page that shows it as adopted returned 403, so the say line says 'motion'. OW15 figure not refetched.","sources":[{"title":"Notice of Motion MM39.45: Addressing Recycling in Public Spaces (Cheng, Fletcher)","publisher":"City of Toronto, City Council, 25 to 27 March 2026","year":2026,"url":"https://www.toronto.ca/legdocs/mmis/2026/mm/bgrd/backgroundfile-285331.pdf","finding":"'Approximately 15,000 recycling receptacles (Blue Bins) are located in public spaces'; under the provincial takeover 'the contents are collected as solid waste and combined with garbage for disposal in landfill sites'; 'Toronto also has high contamination rates in these receptacles'; no percentage given; asks staff to consider litter-only bins and report back in 2027; asks the Province to re-introduce public space recycling obligations within O. Reg 391/21. PDF downloaded and text extracted this pass.","verified":true},{"title":"Agenda Item History 2026.MM39.45","publisher":"City of Toronto","year":2026,"url":"https://secure.toronto.ca/council/agenda-item.do?item=2026.MM39.45","finding":"Search result summary of the council record: item adopted at the 25 to 26 March 2026 meeting, recommendations 1 and 2 carried 22 to 4. Page returned 403 to our fetch, so say 'motion', not 'decision', aloud.","verified":false},{"title":"City of Toronto cracking down on recycling contamination with bin inspections","publisher":"Global News","year":2017,"url":"https://globalnews.ca/news/3913286/toronto-recycling-contamination-bin-inspections","finding":"26 per cent residential contamination; inspections, tagging, non-collection on second failure. Refetched this pass.","verified":true}],"their_sources":[{"title":"City of Toronto cracking down on recycling contamination with bin inspections","publisher":"Global News","year":2017,"url":"https://globalnews.ca/news/3913286/toronto-recycling-contamination-bin-inspections","finding":"12 December 2017: 'Roughly 26 per cent of what gets put in recycling bins is actually garbage'; 'more than 52,000 tonnes of non-recyclable materials were incorrectly put in blue bins last year'; each percentage point costs $600,000 to $1 million a year; the story is about residents' blue bins at homes, not public bins. Refetched this pass.","verified":true},{"title":"Toronto's recycling problem is a Blue Bin problem","publisher":"Spacing Toronto (from Spacing #52, fall 2019)","year":2020,"url":"https://spacing.ca/toronto/?p=62531","finding":"'In Toronto, the contamination rate has edged consistently upwards, from 22% in 2015 to 30% in 2019'; the City's processing contract covers residential Blue Bins; multi-residential buildings contaminate more than houses. Fetched this pass.","verified":true}],"routes":[{"type":"deny","say":"The City figure on record is the residential blue bin rate, about 26 percent in 2017. We found no City report giving 25 percent for public bins."},{"type":"turn","say":"Toronto's public recycling bins now go to landfill because a provincial regulation left them out. The individual sorts, the rule decides. Their example is ours."},{"type":"reframe","say":"Compliance is a policy lever. In 2017 the City inspected bins, tagged failures and refused pickup. Enforcement is what turns a rule into behaviour."},{"type":"outweigh","say":"Where policy removed the need to comply, Ireland's bag levy, use fell about 90 percent. Design beats exhortation."}]},{"id":"TC12","side":"for","kind":"argument","angle":"their case","strength":3,"title":"Cap took four years; EVs could cut 7 to 10% in one","claim":"Policies take years to pass and implement while individuals can change immediately. Canada's oil and gas emissions cap was announced in 2022 and only implemented in 2026, four years to start, and it will take more years to affect the environment. Personal driving is about 7 to 10% of global GHG emissions; electric vehicles cut those emissions by about 70%, so if enough people switched this 7 to 10% could drop in a single year. Personal and commercial driving is the largest use of fuel in the world at 49.2% of all oil consumed.","say":"The cap never came into force. Announced in Glasgow, drafted, and last November Ottawa said it will not implement it. A shelved policy is not a slow one. Fleets take a decade to turn over.","detail":"Timeline from the Canada Gazette and government pages: the Prime Minister committed to the cap at COP26 in Glasgow (31 October to 13 November 2021); the Emissions Reduction Plan carried it in March 2022; a discussion document came 18 July 2022; the Regulatory Framework 7 December 2023; draft regulations in the Canada Gazette on 9 November 2024 with final rules targeted for 2025 and a first compliance period of 2030 to 2032 at 27 percent below 2026 levels. Budget 2025, tabled 4 November 2025, said effective carbon markets, methane rules and carbon capture 'would create the circumstances whereby the oil and gas emissions cap would no longer be required as it would have marginal value in reducing emissions'. The Canada-Alberta MOU of 27 November 2025 states 'Canada will not implement the Oil and Gas Emissions Cap, which has not yet been put into effect'. ECCC's 2025 progress report says no decision has been finalized but excludes the cap from its projections in light of the MOU, estimating it would have added 3 Mt in 2030. So 'implemented in 2026' is false; the cap was never in force. Their 'announced in 2022' has a basis (the March 2022 plan), so do not fight it; the commitment was 2021. On cars: the IEA puts cars and vans at about 10 percent of energy-related CO2, which matches their range, but the 70 percent saving is Europe's grid; it is 19 to 34 percent in India (FR04), so the cut is set by electricity policy. 'In one year' is impossible: US light vehicles average 12.6 years old and 286 million are on the road, so even if every new car sold were electric the fleet takes over a decade to turn. Where a fleet did flip fast, Norway at 89 percent electric new cars, it was tax policy (OW09). Their 49.2 percent is Statista's OECD statistic, not a global one, and the current page gives 46 percent for 2024; the IEA puts road transport at about 45 percent of global oil demand. Read alongside PL13 and FP09.","if_they_push":"Grant that a cap can be shelved. It was shelved for a higher industrial carbon price, which the Climate Institute ranks first among Canada's policies (M4), and the three-year fight shows the cap had teeth. And an EV buyer's saving is set by the grid, which is policy.","comeback":"Ottawa's own report says no final decision is taken: the cap is delayed, not dead. Four years of drafting then a shelf is our point. An EV buyer acts today.","weak":false,"tags":["oil and gas cap","emissions cap","2022","2026","four years","slow","speed","immediately","driving","7-10%","7 to 10 percent","electric vehicles","ev","70%","one year","49.2%","oil consumption","fuel","f1","f2"],"phrasings":["Although government policies have the ability to enforce large-scale change, they take a very long time to be passed and implemented, whereas individual action can create change immediately.","Canada's oil and gas emission cap was first announced in 2022 but only finally implemented in 2026. It took four years to just start this policy, meaning it will still take several more years to take effect on the environment.","Personal driving accounts for about 7-10% of global GHG emission, which is significant.","Electric vehicles reduce these emissions by about 70%, meaning if a significant amount of people were to switch to electric vehicles this 7-10% could drop in just 1 year.","Personal and commercial driving are the largest use of fuel in the world, accounting for 49.2% of all oil consumed globally.","Government policies take a very long time to put in place while individuals can make changes immediately."],"frames":["F1","F2"],"uses":["OW09","M4"],"notes":"Verified at primary sources this pass: COP26 commitment in 2021 (Gazette, canada.ca), Gazette draft 9 November 2024, Budget 2025 'no longer be required' wording (budget.canada.ca, 4 November 2025), MOU 'will not implement' (pm.gc.ca, 27 November 2025), ECCC progress report 'no decision has been finalized' but excluded from projections. So 'implemented in 2026' is false; the cap was never in force. Their 'announced 2022' matches the March 2022 ERP, so do not call it wrong; the commitment was 2021. The exact 1 November 2021 speech date is from a CBC headline, not a fetched page; say 'at COP26' or 'in Glasgow'. Their 7 to 10 percent is right for cars and vans (IEA, 10 percent, fetched). Their 49.2 percent: the Statista statistic at that number is OECD-only (fetched, 46 percent for 2024); the 2022 vintage of 49.24 is from a search excerpt and is unconfirmed, so say 'OECD figure' and give the IEA 45 percent, not the vintage. 'Could drop in one year' is their arithmetic with no source. Expect them to pivot to A3 (policy is fragile) when the cap collapse is pointed out; answer with M4.","sources":[{"title":"Canada Gazette, Part I, Vol. 158, No. 45: Oil and Gas Sector Greenhouse Gas Emissions Cap Regulations (proposed)","publisher":"Government of Canada","year":2024,"url":"https://gazette.gc.ca/rp-pr/p1/2024/2024-11-09/html/reg1-eng.html","finding":"Published 9 November 2024; 'At the 2021 United Nations Climate Change Conference (COP26), the Prime Minister committed to cap and cut GHG emissions'; ERP 'published in March 2022'; discussion document 18 July 2022; Regulatory Framework 7 December 2023; 'final regulations would target 2025'; first compliance period 1 January 2030 to 31 December 2032; cap '27% below emissions levels reported for 2026'. Refetched this pass.","verified":true},{"title":"Canada's Achievements at COP26","publisher":"Government of Canada","year":2021,"url":"https://www.canada.ca/en/services/environment/weather/climatechange/canada-international-action/un-climate-change-conference/cop26-summit/achievements-at-cop26.html","finding":"COP26 'took place in Glasgow between October 31 and November 13, 2021'; the Prime Minister 'committed to cap Canada's oil and gas emissions at the pace and scale needed to get to net zero by 2050', the first major oil-producing nation to do so. Fetched this pass.","verified":true},{"title":"Canada will put a cap on oil and gas sector emissions, Trudeau tells COP26 summit","publisher":"CBC News","year":2021,"url":"https://www.cbc.ca/news/politics/trudeau-cop26-cao-oil-and-gas-1.6232639","finding":"Headline and search excerpt date the announcement to the COP26 leaders' summit speech on 1 November 2021; page returned 403 to our fetch.","verified":false},{"title":"Budget 2025, Chapter 1: Building a stronger Canadian economy, 'Update on the Oil and Gas Emissions Cap'","publisher":"Government of Canada, Department of Finance","year":2025,"url":"https://budget.canada.ca/2025/report-rapport/chap1-en.html","finding":"'Effective carbon markets, enhanced oil and gas methane regulations, and the deployment at scale of technologies such as carbon capture and storage would create the circumstances whereby the oil and gas emissions cap would no longer be required as it would have marginal value in reducing emissions.' Budget tabled 4 November 2025. Fetched this pass.","verified":true},{"title":"Canada-Alberta Memorandum of Understanding (backgrounder)","publisher":"Prime Minister of Canada","year":2025,"url":"https://www.pm.gc.ca/en/news/backgrounders/2025/11/27/canada-alberta-memorandum-understanding","finding":"27 November 2025: 'In consideration for the mutual commitments agreed to in this MOU, Canada will not implement the Oil and Gas Emissions Cap, which has not yet been put into effect'; Clean Electricity Regulations in Alberta suspended pending a carbon pricing agreement by 1 April 2026; 'The TIER system will ramp up to a minimum effective credit price of $130/tonne.' Fetched this pass.","verified":true},{"title":"2025 Progress Report on the 2030 Emissions Reduction Plan","publisher":"Environment and Climate Change Canada","year":2025,"url":"https://www.canada.ca/en/services/environment/weather/climatechange/climate-plan/climate-plan-overview/emissions-reduction-2030/2025-progress-report.html","finding":"'While no decision has been finalized on the previously announced oil and gas emissions cap (OGEC), in light of the announcement in the Canada–Alberta MOU to not implement OGEC ... for modelling purposes, OGEC is excluded'; 'If OGEC were included, it is estimated to deliver an additional 3 Mt of reductions in 2030.' Fetched this pass.","verified":true},{"title":"Canada set to scrap oil and gas emissions cap","publisher":"Argus Media","year":2025,"url":"https://www.argusmedia.com/en/news-and-insights/latest-market-news/2750001-canada-set-to-scrap-oil-and-gas-emissions-cap","finding":"4 November 2025: Budget 2025 says the cap 'would no longer be required as it would have marginal value in reducing emissions'; the proposed cap targeted 35 percent below 2019 with compliance 2030 to 2032. Refetched this pass.","verified":true},{"title":"Canada and Alberta sign MOU that rolls back risk in Canadian energy","publisher":"Legal 500 (Mondaq republication)","year":2025,"url":"https://www.legal500.com/intelligence/canada/energy-and-natural-resources/canada-and-alberta-sign-mou-that-rolls-back-risk-in-canadian-energy-and-commits-to-broad-new-energy-accord","finding":"27 November 2025, Carney and Smith: 'Canada will not implement the Oil and Gas Emissions Cap'; CER suspended in Alberta; carbon price for industrial emitters ramping to $130 a tonne. Refetched this pass.","verified":true},{"title":"Average Age of Vehicles in the US Continues to Rise: 12.6 years in 2024","publisher":"S&P Global Mobility","year":2024,"url":"https://press.spglobal.com/2024-05-22-Average-Age-of-Vehicles-in-the-US-Continues-to-Rise-12-6-years-in-2024%2C-according-to-S-P-Global-Mobility","finding":"22 May 2024: cars and light trucks a record 12.6 years average; 286 million vehicles in operation. Verified in the wave 2 pass, not refetched.","verified":true},{"title":"Sheltering from oil shocks: road transport fuels","publisher":"IEA","year":2026,"url":"https://www.iea.org/reports/sheltering-from-oil-shocks/road-transport-fuels","finding":"'Road transport accounts for around 45% of global oil demand'; in advanced economies passenger cars are about 60 percent of road energy use. Refetched this pass.","verified":true},{"title":"Oil demand share in the OECD by sector","publisher":"Statista","year":2025,"url":"https://www.statista.com/statistics/307194/top-oil-consuming-sectors-worldwide","finding":"'In 2024, 46 percent of all oil consumed in the OECD was related to motor vehicle usage'; OECD only; 49.2 not on the current page. Refetched this pass.","verified":true},{"title":"A global comparison of the life-cycle GHG emissions of combustion engine and electric passenger cars","publisher":"ICCT","year":2021,"url":"https://theicct.org/publication/a-global-comparison-of-the-life-cycle-greenhouse-gas-emissions-of-combustion-engine-and-electric-passenger-cars/","finding":"BEV lifetime emissions 66 to 69 percent lower in Europe, 19 to 34 percent in India; held verified on FR04, returned 403 this pass.","verified":false}],"their_sources":[{"title":"Transport (Energy Efficiency Policy Toolkit)","publisher":"IEA","year":2025,"url":"https://www.iea.org/reports/energy-efficiency-policy-toolkit/transport","finding":"'Private cars and vans were responsible for more than 25% of global oil use' and 'around 10% of energy-related CO2-emissions in 2023'. Their 7 to 10 percent for personal driving is consistent with this. Fetched this pass.","verified":true},{"title":"Oil demand share in the OECD by sector","publisher":"Statista","year":2025,"url":"https://www.statista.com/statistics/307194/top-oil-consuming-sectors-worldwide","finding":"Current page: 'In 2024, 46 percent of all oil consumed in the OECD was related to motor vehicle usage.' The statistic is OECD-only. Neither 49.2 nor 49.24 appears on the current page; a search excerpt of an earlier version of the same statistic gives 49.24 percent for the OECD in 2022. Refetched this pass.","verified":"partial"}],"routes":[{"type":"deny","say":"The cap never came into force. In November 2025 Ottawa said it will not implement it. A policy that did not happen is not evidence that policy is slow."},{"type":"reframe","say":"Fleets do not switch in a year. The average US car is over twelve years old. The one fast fleet switch on record, Norway, was done with tax exemptions."},{"type":"turn","say":"Their 70 percent saving is Europe's clean grid. The same car saves a fraction of that in India. Same buyer, same choice; the grid, which is policy, sets the result."},{"type":"outweigh","say":"Their driving share is Statista's OECD figure, not a global one. The IEA puts road transport near 45 percent of world oil demand. Power and industry are the bigger levers."}]},{"id":"FL01","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Composition: what one could do, counted as if everyone will","say":"The arithmetic is fine. The assumption carrying it is that everyone does it. Nothing on their side makes everyone, and the one thing that makes everyone is a rule.","detail":"Composition infers a property of the whole from a property of each part. Here the per-person figure is sound (2.4 tonnes for one car-free person is on A4) and multiplying it by a population is sound arithmetic, but the step from 'each person could' to 'the population will' smuggles in universal uptake, which no voluntary mechanism delivers. It shows up in C3 ('if everyone did it'), A5 ('one in ten Canadians'), A4 and FP03 (per-person savings presented as if available at scale), FP06 (a national wedge from household actions), FP13 ('it adds up') and, in their draft, TC12 ('if a significant amount of people were to switch to electric vehicles this 7 to 10 percent could drop in just one year'). BH06 runs it in reverse: a government is 'just individuals', so it can have no power its members lack, when a law binds people who never agreed to it. Name it as a missing premise, not a blunder: 'the number is per willing person; the motion asks about the population, and they have not shown how the population gets there' (F1, C3 rebuttal). Then give the mechanism that does make everyone: Ireland's levy (OW15), Norway's tax rules (OW09).","avoid":"Our Ontario comparison, 'about 11 million people going car-free' (M1, A4), is the same arithmetic in reverse. Present it as a scale comparison, not a prediction: 'to match what one phase-out delivered, you would need eleven million people to give up their cars, every year'. Never say individuals 'cannot' add up; say no mechanism on their side makes them add up.","tags":["composition","if everyone","scale","uptake","multiply","per person","population","voluntary","hypothetical","one in ten","adds up","assumption"],"phrasings":["if everyone did their part","if just ten percent of us switched","if a significant amount of people were to switch to electric vehicles this 7 to 10 percent could drop in just one year","it all adds up","the sum of billions of small acts is an enormous number","imagine every household did this","government is just individuals with titles"],"best_against":["C3","A5","A4","FP03","FP06","FP13","TC12","BH06"],"notes":"","sources":[{"title":"Fallacies","publisher":"Stanford Encyclopedia of Philosophy (Hans Hansen)","year":2024,"url":"https://plato.stanford.edu/entries/fallacies/","finding":"Fetched. Composition is where 'the properties of parts and composites are mistakenly thought to be transferable from one to the other'; the inference from parts to whole may fail.","verified":true},{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Composition: assuming that what is true of the parts is true of the whole; example, each cell is lightweight so a human made of cells is lightweight.","verified":true}],"their_sources":[]},{"id":"FL02","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Anecdote and survivorship: the one who planted a forest, the one who sued","say":"One case is one case. We hear about the campaign that won. Nobody counts the ones that did not, and the motion asks what moves the environment on average.","detail":"Anecdotal evidence generalises from a story that is an inadequate sample; survivorship is the version where the sample is the cases that succeeded, because failures leave no record. A vivid case also gets weighed above the statistics that contradict it. It shows up in C2 (Greta), PL06 (Urgenda, Held, KlimaSeniorinnen), MK13 (Musk), MK08 (Tompkins), B5 (tuna, Kit Kat), MK02 (Pakistan), and in the new set GL04 (Payeng, Maathai, Knepp), CV09 (Extinction Rebellion, Hambach, Standing Rock, where their own third case lost and the pipeline still runs), CV10 (Bloomberg, Bezos), CV01 (Blue Planet, an 88 percent self-report from one poll) and GL05 (Carson, Muir). Name it gently: 'that is one case, and a remarkable one; how many boycotts, lawsuits and founders did not get there, and what is the measured result across all of them?' Then move to results that were measured across a whole jurisdiction with a counterfactual (OW07, OW08, OW02).","avoid":"Our wins are also cases. The difference to state aloud: each is a measured outcome for a whole jurisdiction, several have a formal counterfactual (synthetic control in OW07 and OW08, with-and-without in OW02), and the pattern repeats across countries and pollutants. Say 'measured, repeated, across jurisdictions', not 'our examples are better than yours'.","tags":["anecdote","survivorship","sample","one person","story","vivid","hero","greta","lawsuit","founder","boycott","selection"],"phrasings":["one teenager started a movement of millions","one man in Assam planted a forest bigger than Central Park, alone","a group of grandmothers beat Switzerland in court","Bloomberg's money shut down two-thirds of America's coal plants","Extinction Rebellion got the UK to pass net zero within weeks","Rachel Carson wrote a book and the EPA banned DDT","look what one boycott did to StarKist"],"best_against":["C2","PL06","MK13","MK08","B5","MK02","GL04","CV09","CV10","CV01","GL05"],"notes":"","sources":[{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Anecdotal Evidence: 'fallacious generalizing on the basis of some story that provides an inadequate sample'. Misleading Vividness: a vivid anecdote given too much weight relative to statistics. Unrepresentative Sample: generalising from a sample collected in a way likely to make it unrepresentative; size does not overcome sampling bias.","verified":true},{"title":"Abraham Wald's Work on Aircraft Survivability","publisher":"Journal of the American Statistical Association 79(386)","year":1984,"url":"https://doi.org/10.1080/01621459.1984.10478038","finding":"Not fetched: the DOI redirects to tandfonline.com, which returns 403 (checked 2026-11-08). Cited for the standard origin of survivorship bias: damage on returning aircraft is a biased sample because downed aircraft are not observed. Do not quote details from it aloud.","verified":false}],"their_sources":[]},{"id":"FL03","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Measured against perfect: Paris missed, so policy fails","say":"They measure policy against perfect. The motion measures it against individual action. Falling short of a target is not the same as doing less than the alternative.","detail":"The perfectionist, or nirvana, approach compares a real arrangement with an ideal and calls the real one a failure because a gap exists; the fair comparison is between real alternatives. The For side runs it on every target missed: PL01 (the Paris gap), B6 (record emissions after Paris), PL04 (Kyoto), PL13 (too slow for the budget), PL14 (targets diluted), A3 (repeal) and, in their draft, TC09 ('existing policies still put the world on 2.8 degrees, almost double the 1.5 goal'), TC05 (the CSRD was narrowed, so 'ineffective'), TC11 (25 percent contamination, so a policy 'cannot ensure every person recycles'), PF01 (illegal logging persists, so 'a law that is not obeyed has no impact') and PF10 (the 100 billion arrived late). Their own opening says policy is to be judged 'by the outcomes it actually achieves' (TC01, PE4); hold them to outcomes against the alternative, not against the target. Name it as a standard problem: 'the question is not whether policy solved it, it is whether policy or individual action moved more; on their own source the current-policies projection is about a degree lower than in 2015, and that movement is governments (OW17)'. Then ask for the individual-action equivalent measured against the same gap.","avoid":"Do not run the mirror image: 'individual action has not solved it either' is the same error. Our claim is comparative: 'measured against each other, the realised reductions are policy's'. When we cite OW17 we say it is a projection and lead with measured cases (M1, M3, M5).","tags":["nirvana","perfectionist","paris","target","gap","failed","standard","comparison","alternative","kyoto","too slow","shortfall"],"phrasings":["existing government policies still put the world on 2.8 degrees of warming","ten years of Paris and emissions are at a record","Kyoto was binding and emissions rose anyway","even the EU had to walk back its own sustainability reporting rules","they promised 100 billion a year and never paid it","most tropical logging is illegal, so policy clearly isn't working","governments are too slow for the carbon budget"],"best_against":["PL01","B6","PL04","PL13","PL14","A3","TC09","TC05","TC11","PF01","PF10"],"notes":"","sources":[{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Perfectionist Fallacy: rejecting a proposal only because it does not solve the problem perfectly, when perfection is not required.","verified":true},{"title":"Harold Demsetz (biography)","publisher":"Econlib, The Concise Encyclopedia of Economics","year":2008,"url":"https://www.econlib.org/library/Enc/bios/Demsetz.html","finding":"Fetched. Demsetz's 1969 paper 'Information and Efficiency: Another Viewpoint' accused Arrow of the 'nirvana approach': 'those who adopt the nirvana viewpoint seek to discover discrepancies between the ideal and the real'; he recommended a 'comparative institutions approach' instead. The page notes economists now call this the nirvana fallacy.","verified":true}],"their_sources":[]},{"id":"FL04","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"False dilemma: individuals or government, when one sits inside the other","say":"They treat the two as rivals for credit. Individuals choose; policy decides what there is to choose from. One sits inside the other, so the credit is not either or.","detail":"A false dilemma presents two options as exhaustive and exclusive when they are not. The For side's version is subtler than 'either individuals or government': it treats every household choice as evidence against policy, as if a choice made inside a subsidy, a tariff, a cap or a lockdown could not also be policy's result. It shows up in FP05 and MK05 ('the policy only worked because people complied'), B7 ('norms first, so the norm is the cause'), FP09 and MK04 (people bought the EV, the panel), C5, and in the new set TC11 ('laws are only effective when individuals follow them, so individual action has more impact'), GL06 (Cape Town residents complied with a 50 litre cap, punitive tariffs and pressure cuts), GL07 (setsuden under a legal order with fines) and PF08 (the 2020 drop under confinement orders in 69 countries). The comeback 'policy opened the door, people walked through' (BH05, MK04) is the same move. Name it as a nesting, not a contradiction: 'both are true at once; the question is which one sets the size of the outcome, and that is the one that wrote the menu' (F2, FR04, OP2). Give the same buyer, different grid example from FR04.","avoid":"We are exposed to the plain version if anyone on our side says individuals do nothing or do not matter. Never say it. The agreed line is FR10 and F6: 'We do not say individuals do nothing. We say policy sets the options, prices and defaults for everyone at once, which is why every measured success we have shown was a policy.' Our F3 'make them pick one' is a genuine dichotomy (either civic action counts as individual action or it does not), so state why there is no third option when we use it.","tags":["false dilemma","either or","both","nested","menu","credit","compliance","uptake","choice","rivals","individuals do nothing"],"phrasings":["laws are only effective when individuals follow them","a government can introduce recycling policies, but it cannot ensure that every person recycles","the water ban only worked because households cut back","Cape Town halved its water use because people changed their habits","COVID proved it: people stayed home and emissions fell 17 percent","policy opened the door, people walked through","the subsidy existed but households chose to act"],"best_against":["FP05","MK05","B7","FP09","MK04","C5","TC11","GL06","GL07","PF08"],"notes":"","sources":[{"title":"Logical Fallacies","publisher":"Purdue Online Writing Lab, Purdue University","year":2024,"url":"https://owl.purdue.edu/owl/general_writing/academic_writing/logic_in_argumentative_writing/fallacies.html","finding":"Fetched. Either/Or: reduces a complex issue to two options when others exist; example, either stop using cars or destroy the earth, ignoring cleaner technology and car-sharing.","verified":true},{"title":"Fallacies","publisher":"The Writing Center, University of North Carolina at Chapel Hill","year":2024,"url":"https://writingcenter.unc.edu/tips-and-tools/fallacies/","finding":"Fetched. False dichotomy: presenting only two options when more exist, then choosing one by eliminating the other; tip, look for other alternatives and explain why you dismiss them.","verified":true},{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. False Dilemma: unfairly presenting too few choices and implying one must be picked from that short menu.","verified":true}],"their_sources":[]},{"id":"FL05","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Sequence read as cause: emissions fell after people changed, so people did it","say":"The fall came after people switched, so they credit the people. Ask what moved the price they were responding to. Usually a tax, a tariff or a ban came first.","detail":"The error infers cause from sequence: B followed A, so A caused B. Correlation in time is evidence, so the error is in the leap, not in noticing. The For side runs it on markets and on norms: B1 (spray-can sales fell before the 1978 ban, when Oregon's ban, labels and an announced phase-out came first), MK02 and MK04 (households bought solar, when tariffs, net metering and certificates set the price), MK06 (EV sales rose, inside purchase-tax exemptions), B2 (peer effects measured inside a rebate programme), C4, MK03, GL08 (pay-as-you-go solar under a VAT exemption), and in the new set CV01 (Blue Planet aired in 2017, the straw ban came in 2020, so the public 'moved first'), BH02 (smoking norms shifted before bans, when Levy puts over sixty percent of the policy effect on price) and TC10 (their closing: politicians 'follow public opinion', so the opinion is the cause). Name it by asking for the mechanism: 'what changed the price or the rule just before people moved?' Then supply it from the card (B1 detail, MK02 detail, OW09, OW14). On TC10, add that the pollution also came before the movement and nobody credits the pollution.","avoid":"We risk it too: 'the Clean Air Act passed in 1970 and pollutants fell' is sequence. Prefer the cards with a counterfactual: EU ETS against a synthetic control (OW07), Sweden's carbon tax against a synthetic control (OW08), EPA's with-and-without study (OW02), ULEZ modelled against no-ULEZ (OW11). Say 'measured against what would have happened without it', and say 'modelled' where it is modelled (OW11, OW17).","tags":["post hoc","sequence","after","correlation","cause","consumers led","before the ban","market","solar boom","ev sales","mechanism","price"],"phrasings":["consumers stopped buying spray cans before any law","people changed first and the law caught up","after Blue Planet, 88 percent of viewers changed their plastic habits before any ban existed","smoking became uncool before it became illegal","politicians rarely lead on environmental issues, they follow public opinion","households did the arithmetic and bought panels","the market moved before the regulators did"],"best_against":["B1","MK02","MK04","MK06","B2","C4","MK03","GL08","CV01","BH02","TC10"],"notes":"","sources":[{"title":"Logical Fallacies","publisher":"Purdue Online Writing Lab, Purdue University","year":2024,"url":"https://owl.purdue.edu/owl/general_writing/academic_writing/logic_in_argumentative_writing/fallacies.html","finding":"Fetched. Post Hoc Ergo Propter Hoc: assumes that because B followed A, A caused B; example, blaming bottled water for an illness without considering other causes.","verified":true},{"title":"Fallacies","publisher":"The Writing Center, University of North Carolina at Chapel Hill","year":2024,"url":"https://writingcenter.unc.edu/tips-and-tools/fallacies/","finding":"Fetched. Post hoc (false cause): timing alone does not establish causation; tip, explain how A produces B rather than relying on A coming first.","verified":true},{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Post Hoc: noticing that A is followed by B and hastily concluding A caused B; correlation can be good evidence, the error is the hasty leap.","verified":true}],"their_sources":[]},{"id":"FL06","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Equivocation on 'individual action': voting, suing and striking","say":"They used individual action in two senses: lifestyle choices, then votes and lawsuits. In the second sense the effect arrives through government, which is the policy side of the motion.","detail":"Equivocation uses one term in two senses within an argument so that a conclusion follows only if the senses are confused. The For side's own definition does it in one sentence: individual action is 'decisions made by people as consumers, professionals such as engineers, and as citizens, voting and demanding change' (TC01). They open with consumption (A1, A4, TC02, TC03) and, when pressed, widen to votes (C5), lawsuits (PL06), strikes and arrests (C2, CV09), opinion (B7, TC10), divestment (MK10), Earth Day (TC08, GL05), ministers and senators (CV05), 'government is just individuals' (BH06) and citizens voting a city budget (CV06). In the second sense the effect on the environment is delivered by a court order, a statute or a budget, which is policy by their own account. Name it as a request for one meaning: 'which sense are they running? If civic action counts, the tonnes arrive through policy. If it does not, half their examples leave' (F3, C5 rebuttal, PE4). Ask, do not assert.","avoid":"We can equivocate on 'policy' by stretching it to cover a company pledge, a village rule (MK07) or a brand standard. Hold to F5: government means a municipal, provincial or federal body with legislative and executive power. Concede that Ostrom's commons rules are communal, and argue the atmosphere point instead (MK07 rebuttal).","tags":["equivocation","definition","individual action","voting","lawsuit","strike","protest","civic","two meanings","policy channel","f3","which sense"],"phrasings":["individual action: decisions made by people as consumers, professionals such as engineers, and as citizens, voting and demanding change","individual action controls policy through voting","voting is the ultimate individual action","politicians are individuals too, a minister signing a law is individual action","approximately 20 million Americans participated in the first Earth Day and the EPA was established later that year","over a thousand people got arrested and Parliament moved, that is individual action","governments are just individuals in suits"],"best_against":["C5","PL06","B7","C2","MK10","TC01","TC08","TC10","CV05","CV09","BH06","GL05","CV06"],"notes":"","sources":[{"title":"Fallacies","publisher":"Stanford Encyclopedia of Philosophy (Hans Hansen)","year":2024,"url":"https://plato.stanford.edu/entries/fallacies/","finding":"Fetched. Equivocation: 'an argument which exploits the ambiguity of a term or phrase which has occurred at least twice in an argument', so that its meaning shifts between uses.","verified":true},{"title":"Fallacies","publisher":"The Writing Center, University of North Carolina at Chapel Hill","year":2024,"url":"https://writingcenter.unc.edu/tips-and-tools/fallacies/","finding":"Fetched. Equivocation: shifting between two meanings of a key word or phrase within an argument; tip, identify the central terms and use each with one consistent meaning.","verified":true},{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. 'Equivocation is the illegitimate switching of the meaning of a term that occurs twice during the reasoning.'","verified":true}],"their_sources":[]},{"id":"FL07","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Appeal to nature and to virtue: what feels right against what is measured","say":"Those actions are admirable. The motion does not ask which is admirable. It asks which has more impact, and impact is what changed, measured.","detail":"The appeal to nature treats 'natural' or 'wholesome' as a reason to think something good or effective; the related move treats the moral worth or legitimacy of an act as evidence of its effect. Both substitute a value judgement for a measurement, which is an error of relevance, not of fact. The For side runs it on small acts and clean living, FP13 (recycling and bags build the norm), C6 (shrink your footprint), C3 (small acts), FP12 (buy less, wear longer), MK14 (pay to fix it), parts of FP03 (eating right), and in the new set on conscience and legitimacy: BH03 (Kant, 'you cannot outsource virtue'), GL09 (a billion consciences), BH10 (personal action as the cure for despair), CV04 (China's result is illegitimate, so the honest lever is the individual) and GL04's 'governments plant announcements'. Name it without a sneer: 'we agree these are good things to do, and legitimacy matters; their own source ranks recycling far below the big actions (FP13 detail), and the motion asks for measured impact, so that is the standard we should both hold to' (F1). On CV04, add that every other win we run is democratic (CV04 rebuttal).","avoid":"Do not sneer at virtue, and do not run the reverse: policy is not better because it is large or official. Our standard is measured physical change, said at the start (F1, F6), and we hold ourselves to it by leading with realised results (M1, M3, M5), not with the size of governments.","tags":["appeal to nature","virtue","feels right","wholesome","recycling","tote bag","small acts","moral","measured","impact","footprint","clean living"],"phrasings":["every bit counts","it is just the right thing to do","you cannot outsource your conscience to a politician","change starts with you","your best example is China, a dictatorship, is that the model","the Pope did more for climate opinion than a decade of policy","individuals plant trees, governments plant announcements","individual action is what keeps people from despair"],"best_against":["FP13","C6","C3","FP12","MK14","FP03","BH03","GL09","BH10","CV04"],"notes":"","sources":[{"title":"A Common Sense Introduction to Logic, section 1.4 Moral Fallacies","publisher":"Manifold at CUNY (Logic and Moral Reasoning project)","year":2023,"url":"https://cuny.manifoldapp.org/read/a-common-sense-introduction-to-logic/section/d2e54b73-842e-4656-b2f1-1fb8afd906b3","finding":"Fetched. Defines the 'appeal to nature fallacy', sometimes called the is-ought fallacy: treating something as good or required because it is natural; example, 'People shouldn't go vegetarian, it's just unnatural'. Author not named on the page; CC BY-NC-ND.","verified":true},{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Naturalistic Fallacy: on a broad reading, arguing from what 'is' to what 'ought' to be; the entry notes philosophers disagree about its scope. No separate 'appeal to nature' entry.","verified":true}],"their_sources":[]},{"id":"FL08","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Potential treated as actual: 'could cut 40 to 70 percent' read as achieved","say":"'Could' is a scenario with conditions attached. Ask what the conditions are and whether they have been met. Then ask what has happened, not what could.","detail":"The error drops a qualification: a claim true under stated conditions ('could, by 2050, given enabling infrastructure and policy') is used as if true without them. Classical logic calls the general form ignoring a qualification; the modal version slides from 'possible' to 'actual'. It shows up in A2 and FP06 (IPCC and Dietz potentials read as results), FP03 (a diet scenario), A5 (a hypothetical uptake set against a projection), A4 and FP11 (per-person estimates, one of them contested), and in their draft TC12 ('electric vehicles reduce these emissions by about 70 percent, so this 7 to 10 percent could drop in just one year', when the 70 percent is Europe's grid and a fleet averaging over twelve years old cannot turn over in one), BH08 ('real tonnes a person can remove tomorrow'), PL13 and FP09 ('individuals can change today', 'in a week'). Name it as a question, not a charge: 'is that a measured reduction or a modelled potential, and what did the authors say it depends on?' (F1, FR05, PE4). Then put one realised reduction beside it (M1, M5).","avoid":"We carry projections of our own: M4 (Climate Institute projects 20 to 48 percent), OW17 (Climate Action Tracker projection), OW18 (Rhodium modelling). Label them 'projection' or 'modelled' every time, lead with realised cases, and never quote a projection in a say line as if it were a result. If they turn F1 on us, agree and go to measured cases (PL01 if_they_push).","tags":["potential","could","scenario","projection","modelled","actual","realised","measured","ipcc","40-70","qualification","conditions","f1"],"phrasings":["the IPCC says behaviour change can cut emissions by up to 70 percent","electric vehicles reduce these emissions by about 70 percent, so this 7 to 10 percent could drop in just one year","household actions alone are worth 7 percent of US emissions","going vegan cuts your footprint by 73 percent","those are real tonnes a person can remove tomorrow","I can go electric tomorrow without waiting for a law","if one in ten went car-free it beats the regulation"],"best_against":["A2","FP06","FP03","A5","A4","FP11","TC12","BH08","PL13","FP09"],"notes":"","sources":[{"title":"Fallacies","publisher":"Stanford Encyclopedia of Philosophy (Hans Hansen)","year":2024,"url":"https://plato.stanford.edu/entries/fallacies/","finding":"Fetched. Secundum quid 'comes about from failing to appreciate the distinction between using words absolutely and using them with qualification'; the entry's example is spruce trees being green in their foliage, not absolutely.","verified":true},{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Modal Fallacy: treating a modal qualifier as applying only to the consequent of a conditional when it applies to the whole conditional. The mapping to 'could' read as 'did' is ours; IEP does not discuss possibility versus actuality directly.","verified":true}],"their_sources":[]},{"id":"FL09","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Motte and bailey: from 'more impact' to 'also matters'","say":"Their claim was that individual action has more impact. Under pressure it became that individuals matter too. We agree with the second. The motion is the first.","detail":"A motte and bailey doctrine pairs an ambitious claim that is hard to defend (the bailey) with a modest one that is easy to defend (the motte); the speaker advances the first and retreats to the second when challenged, then returns. The For side's bailey is 'more impact than government policy'; the motte is 'individuals matter', 'it is not either or', 'policy needs people' (C3, B7, FP05, MK05, FP13, C5). Their draft builds the motte in: 'individual activism, lifestyle changes and consumer choices create the political momentum that makes government action possible' (TC10), 'individual action controls policy' (TC01), 'policy is individual action at scale' (BH06) and 'you cannot have a movement of people who do nothing' (BH10). Each is a claim about input to policy, not about impact larger than policy. Name it by holding them to the wording: 'we have never disputed that individuals matter; the motion says more impact than policy, and that is the claim we are still waiting for evidence on'. Say it once, calmly, and return to the comparison (FR10, PE4).","avoid":"Our own motte is F6, 'policy sets the conditions', which a judge could hear as a retreat from 'policy has more impact'. Make F6 the thesis from the opening and connect the two in one sentence: 'the conditions decide the size of the outcome, which is why the realised reductions are policy's'. Do not retreat to 'both matter' (FR10) without finishing the sentence with the multiplier.","tags":["motte and bailey","retreat","also matters","both matter","not either or","more impact","wording","motion","burden","shift"],"phrasings":["nobody is saying government does nothing","it is not either or, both are needed","individual activism, lifestyle changes and consumer choices create the political momentum that makes government action possible","policy needs people to work","you cannot have a movement of people who do nothing","policy is individual action at scale","all we are saying is it starts with individuals"],"best_against":["C3","B7","FP05","MK05","FP13","C5","TC10","TC01","BH06","BH10"],"notes":"","sources":[{"title":"Motte and Bailey Doctrines","publisher":"Practical Ethics blog, University of Oxford (Nicholas Shackel, Cardiff University)","year":2014,"url":"https://blog.practicalethics.ox.ac.uk/2014/09/motte-and-bailey-doctrines/","finding":"Fetched. The motte 'represents the defensible but undesired propositions to which one retreats when hard pressed'; the bailey is 'desirable to their proponents but only lightly defensible'. Refers to Shackel's 2005 paper 'The Vacuity of Postmodernist Methodology' (Metaphilosophy; journal name not on the page).","verified":true}],"their_sources":[]},{"id":"FL10","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Base-rate error: a large share of a small slice","say":"That is a large share of a small slice. Ask what share of the whole it is, and what reaches those people. A rule reaches them all at once.","detail":"The base-rate error weighs a vivid specific figure and ignores the prevalence it sits inside; the everyday form is a percentage quoted without its denominator. 'One percent of people make half of aviation emissions' (FP10) is striking, but aviation is a small share of global CO2 (FR06), and concentration in a few hands is the easiest case for a rule to reach and the hardest for voluntary restraint. The same shape appears in FP02 (the top ten percent), FP11 (one choice, a huge number), and in the new set TC04 (75 percent of 'a company's footprint' is an average across CDP respondents in high-impact sectors, a share of a share), GL03 (pickers handle 89 percent of what Brazil recycles, and Brazil recycles about 4 percent), TC11 (25 percent of what is in a bin, in one city), CV07 (the Pentagon's 59 million tonnes is under one percent of the US total) and TC07 ('one fifth' is the peak year of a share that has since fallen). Name it as two questions: 'what is the denominator, and what reaches those people?' Then: a levy applies to all of them; an appeal has to persuade each one.","avoid":"We make the same slip when we lead with a large percentage of a small category: Ireland's bags fell about ninety percent (OW15), and bags are trivial for climate (FP13 comeback). State the share honestly and say what the example is for: 'a small category, but it shows a price changing a habit overnight that appeals did not'.","tags":["base rate","denominator","one percent","frequent flyers","aviation","share","concentration","top ten percent","levy","slots","kerosene","rich"],"phrasings":["one percent of people cause half of flying emissions","ten percent of people cause half of all emissions, so it is their choice","scope 3 emissions make up 75 percent of a company's carbon footprint on average","Brazil's catadores are responsible for ninety percent of what the country recycles","25 percent of the items placed in the recycling bins were non-recyclable","the Pentagon emits more than Sweden","roughly one fifth of the US household footprint is overseas"],"best_against":["FP10","FP02","FP11","TC04","GL03","TC11","CV07","TC07"],"notes":"","sources":[{"title":"Evidential impact of base rates (chapter 10 of Judgment under Uncertainty: Heuristics and Biases, eds Kahneman, Slovic, Tversky)","publisher":"Cambridge University Press (Amos Tversky and Daniel Kahneman)","year":1982,"url":"https://www.cambridge.org/core/books/judgment-under-uncertainty/evidential-impact-of-base-rates/CC35C9E390727085713C4E6D0D1D4633","finding":"Fetched (chapter summary page). Reports clinical examples in which 'base-rate information was not taken into account', and experiments where 'posterior probability judgments were determined primarily by the degree to which the description was similar' to a stereotype.","verified":true}],"their_sources":[]},{"id":"FL11","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Hypocrisy as refutation: COP jets, subsidies and the Pentagon","say":"A delegate's flight says nothing about what the treaty did. Judge the policy by its measured result, not by the people in the room.","detail":"Rejecting a claim because the person or institution making it does not live by it is a form of attacking the arguer instead of the argument; the classical name is tu quoque, which is not for saying aloud. The For side runs it against governments as a class: politicians promise and dilute (PL14), governments subsidise the problem they regulate (PL07), Canada walked out of Kyoto (PL04), and in the new set leaders fly private jets to COP28 (BH07), the Pentagon emits more than Sweden (CV07), states own two thirds of fossil emissions, so 'you cannot ask the arsonist to put out the fire' (PF07), governments are bought (CV03) and Brussels called gas green, 'so why trust policy at all' (PF06). Name it as a change of subject: 'that is about the people, and the motion is about the instrument; the Montreal Protocol phased out ninety-nine percent of the substances it covered whoever flew to sign it (M2)'. Then turn PL07, CV03 and PF06 with CL2 (lobbying shows where the power sits) and PF07 with its own numbers: an actor that owns two thirds of the emissions is the largest lever by construction (PF07 rebuttal).","avoid":"FR01 and C6 (BP popularised the carbon footprint) are the same move in our hands: where a frame came from says nothing about whether it is true. Keep it as a labelled jab, never load-bearing, and do not attack the For speakers' own lifestyles, ever.","tags":["tu quoque","hypocrisy","private jets","cop","politicians","subsidies","walked out","ad hominem","people vs instrument","credibility"],"phrasings":["they fly private jets to climate summits and expect us to listen","governments subsidise fossil fuels and lecture us","you can't ask the arsonist to put out the fire","the Pentagon emits more than Sweden, government is the polluter","you cannot trust governments to act when they are bought","the EU literally voted to call gas sustainable, why trust policy at all","Canada signed Kyoto and walked away","nobody trusts a policy from a hypocrite"],"best_against":["PL14","PL07","PL04","BH07","CV07","PF07","CV03","PF06"],"notes":"","sources":[{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Tu Quoque: concluding that someone's argument against an act is faulty because the arguer has performed that act, or that a preacher's advice is wrong because the preacher does not follow it; a kind of Ad Hominem Circumstantial.","verified":true},{"title":"Fallacies","publisher":"The Writing Center, University of North Carolina at Chapel Hill","year":2024,"url":"https://writingcenter.unc.edu/tips-and-tools/fallacies/","finding":"Fetched. Tu quoque dismisses an argument because the person has done what they criticise; tip, focus on the opponent's reasoning.","verified":true},{"title":"Fallacies","publisher":"Stanford Encyclopedia of Philosophy (Hans Hansen)","year":2024,"url":"https://plato.stanford.edu/entries/fallacies/","finding":"Fetched. Ad hominem is 'bringing negative aspects of an arguer, or their situation, to bear on the view they are advancing'; tu quoque is rejecting a view because its espouser does not follow it.","verified":true}],"their_sources":[]},{"id":"FL12","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Cherry-picked baselines: policy failure measured from the wrong year","say":"Pick the year and you pick the verdict. Compare the path we are on with the path projected before the policy, not with last year.","detail":"Cherry-picking leaves out the evidence that would change the picture, here by choosing the start point, the window or the measure that makes a policy look worst. 'Record emissions after a decade of Paris' (B6) compares a global total with the year before, not with the trajectory projected in 2015, about a degree hotter (OW17). 'The Paris gap' (PL01) and '2.8 degrees, almost double 1.5' (TC09) measure policy against its target, not against the 3 to 3.5 degrees projected when Paris was signed. 'Kyoto failed' (PL04) picks Canada and ignores the parties that stayed. 'Policy gets repealed' (A3, CV02) picks the consumer price and leaves out the industrial one that stayed (M4). Their draft's 'announced in 2022, implemented in 2026' (TC12) has both dates wrong: announced 2021, dropped November 2025 (PE5). 'Half the UK footprint is imported' (GL10, PF02) picks the import share, which rose because domestic emissions fell faster, over the consumption footprint, which is down 29 percent. 'People cut emissions 17 percent' (PF08) picks one day in April 2020 under lockdown orders. Name it as a baseline question: 'measured from when, and against what?' Then give the fuller comparison from the card.","avoid":"Our windows are also chosen: Ontario 2005 to 2014 (M1), UK coal from 2012 (M5), the Clean Air Act from 1970 (M3). Use the source's own window, say the window aloud, and be ready to say why it starts there (the policy start). On OW17, do not quote the yearly 3.1 to 2.8 step, which UNEP partly attributes to methodology (PL01 if_they_push); use 2015 to 2025.","tags":["cherry picking","baseline","start year","record emissions","comparison","trajectory","suppressed evidence","selective","kyoto","paris","repeal"],"phrasings":["emissions hit a record this year, so Paris failed","existing policies still put the world on 2.8 degrees, almost double the 1.5 goal","Canada's oil and gas cap was announced in 2022 and only implemented in 2026","Britain didn't cut emissions, it exported them to China","half the UK's footprint is now imported, so the policy cuts are fake","the biggest emissions drop in history came from behaviour in April 2020","every carbon tax gets voted out","the carbon tax got axed, policy is fragile"],"best_against":["B6","PL01","PL04","A3","PL13","TC09","TC12","GL10","PF02","PF
