08","CV02"],"notes":"","sources":[{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Suppressed Evidence: intentionally leaving out relevant, significant information, usually information that counts against one's own conclusion; when inadvertent, also called Incomplete Evidence or Cherry-Picking.","verified":true},{"title":"Fallacies","publisher":"The Writing Center, University of North Carolina at Chapel Hill","year":2024,"url":"https://writingcenter.unc.edu/tips-and-tools/fallacies/","finding":"Fetched. Missing the point: the premises support one conclusion but the arguer draws a stronger one they do not support; tip, ask what conclusion a neutral reader would draw from the evidence.","verified":true}],"their_sources":[]},{"id":"FL13","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Appeal to authority on the IPCC and the EPA","say":"We are not asking you to trust the EPA because it is the EPA. Here is what it measured, how, and the independent studies that found the same direction.","detail":"An appeal to authority is reasonable when the source is a genuine expert in the field, says what is claimed, is reliable, agrees with other experts and rests on evidence; it fails when the name does the work the evidence should. Our exposure: 'the IPCC says' (FR05), EPA's own evaluation of its own Act (M3, OP1, OW02, OW04), Canada's own inventory crediting its own coal phase-out and methane rules (PE1, PE2), Climate Action Tracker crediting Paris (OW17) and the Climate Institute's projection for the industrial price (M4). The For side cites the IPCC too (A2), so the authority is shared and the fight is over what the chapter says, which is why we quote the conditions (FR05). On the EPA, say 'EPA's own study' openly, give the method (with and without the 1990 Amendments, OW02), and pair it with independent, peer-reviewed estimates that used a control: Bayer and Aklin in PNAS (OW07), Andersson in AEJ (OW08). On PE1, note that their own 61 percent figure comes from the same ministry.","avoid":"Say: 'This is EPA's own assessment, so take it with that in mind. Here is how it was done, with and without the Act, and here are two independent studies, in PNAS and the American Economic Journal, that found the same direction.' For Canada's inventory: 'This is the government's own inventory, which is also where their electricity figure comes from.' Never answer a challenge with 'it is the IPCC'; answer with what it measured and what it said the result depends on.","tags":["appeal to authority","ipcc","epa","expert","trust","method","independent","peer review","own study","self assessment","critical questions"],"phrasings":["the EPA grading its own homework","the IPCC is political","you are just citing government agencies","of course the government says its policy worked","that is the ministry's own inventory","appeal to authority"],"best_against":["FR05","M3","OP1","OW02","OW04","PE1","PE2","OW17","M4"],"notes":"","sources":[{"title":"Expert Authority and Ad Verecundiam Arguments (ISSA Proceedings 2010), quoting Walton's scheme and six critical questions","publisher":"Rozenberg Quarterly (Gabor Kutrovatz, Eotvos University Budapest)","year":2010,"url":"https://rozenbergquarterly.com/?p=7207","finding":"Fetched. Quotes Walton's six critical questions for appeal to expert opinion: expertise, field, opinion, trustworthiness, consistency with other experts, backup evidence; an appeal is inappropriate when the premises fail or when it replaces an argument or dodges the burden of proof.","verified":true},{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Appeal to Authority is fallacious when the authority is not a real expert on the subject, cannot be trusted, is misquoted, or when experts disagree; most such reasoning is proper and much knowledge rightly comes from authorities.","verified":true},{"title":"Fallacies","publisher":"The Writing Center, University of North Carolina at Chapel Hill","year":2024,"url":"https://writingcenter.unc.edu/tips-and-tools/fallacies/","finding":"Fetched. Appeal to authority: relying on status instead of reasoning; tip, cite experts in the relevant field, explain their reasoning, prefer sources seen as fair.","verified":true}],"their_sources":[]},{"id":"FL14","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"The definitional trap read as a word game: make 'policy builds the menu' a causal claim","say":"This is not a definition, it is a test. Take the policy away and ask what the individual can still do. Same buyer, different grid, different result.","detail":"A persuasive or question-begging definition settles a contested point by fixing the meaning of a term so the conclusion follows. A judge may hear F3 ('if votes and lawsuits count, the impact is policy's'), F2 ('policy builds the menu'), PE3 ('the stamp is what changed the tonnes') and PE4 ('by their yardstick, we win') as that: everything becomes policy by stipulation. The same exposure sits in our F5 answers to GL01 (forest user groups are legal bodies), CV06 (participatory budgeting is a city government), GL08 (M-KOPA is a company), CV09 and CV10 (XR and a foundation are organisations) and OP4 (a city cleanup is policy); their ready comeback is 'by that logic any group of people who organise is a government' (CV06). The fix is to state each as a counterfactual that could fail. For F2: the same EV cuts lifetime emissions by two thirds in Europe and by a fraction of that in India, because the grid differs (FR04); Americans emit about three times the transport CO2 of Germans because of what is built (OP2); Norway's EV share followed tax rules and is being unwound as they go (OW09). For F3: 'remove the court order and the Dutch cut does not happen (PL06); remove the statute and the vote changes nothing (C5)'. For F5: the definitions were set in the opening and the For side had the chance to contest them; use them as agreed ground, not as a trump card.","avoid":"Say: 'This is not a definition, it is a test. Remove the policy and ask what the individual could still do. Same buyer, different grid, different result.' For GL01, CV06 and GL08: 'We are not relabelling them. The forest group holds its forest under a 1993 Act, the budget binds because a council adopted it, and M-KOPA is a company. Each is real, and each works through a rule.' When using F3, ask the question and let them answer; the trap works because either answer is theirs, not ours. Never say 'that counts as policy by definition'.","tags":["definition","semantic","word game","persuasive definition","causal","counterfactual","menu","f2","f3","f5","test","remove the policy","stipulation"],"phrasings":["you are redefining the resolution to win it","by your definition everything is policy","that is semantics","you have defined individual action out of existence","a court order is still people acting","you are calling citizens voting on their own money government","by that logic any group of people who organise is a government"],"best_against":["F3","F2","F5","PE3","PE4","OP4","CL2"],"notes":"","sources":[{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Definist Fallacy: defining a term unfairly so a controversial position is easier to defend; stated to be the same as Persuasive Definition. Begging the Question: 'a form of circular reasoning in which a conclusion is derived from premises that presuppose the conclusion'.","verified":true},{"title":"Is Every Definition Persuasive? Douglas Walton on Persuasiveness of Definition","publisher":"Informal Logic 42(1), University of Windsor (Jakub Prus and Andrew Aberdein)","year":2022,"url":"https://www.erudit.org/en/journals/informallogic/2022-v42-n1-informallogic06950/1088458ar/","finding":"Fetched (abstract page). Draws on Walton's work on the argumentative potential of definition; 'the persuasiveness lies not in syntactic or semantic properties, but the context'; the authors offer rules for analysing and evaluating persuasive definitions. The rules themselves are in the PDF, which we could not read.","verified":true},{"title":"Fallacies","publisher":"Stanford Encyclopedia of Philosophy (Hans Hansen)","year":2024,"url":"https://plato.stanford.edu/entries/fallacies/","finding":"Fetched. Begging the question: 'the premise and conclusion are the very same proposition'; a variant involves settling a contested key term in advance.","verified":true}],"their_sources":[]},{"id":"FL15","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Cherry-picking our wins when they can name policy failures","say":"We do not say every policy works. Germany's nuclear exit raised emissions. What moved that grid, either way, was policy. Name an individual action that did.","detail":"Cherry-picking is choosing the cases that fit and leaving out the ones that do not. Our set is Montreal, the Clean Air Act, Ontario, the UK (M1 to M5, OW02 to OW18), and the For side has a ready list of failures: biofuel mandates (PL09), the nuclear exit (PL10), Kyoto (PL04), rebound (PL12), subsidies (PL07), and in the new set corn ethanol, diesel and HFCs (PF04), paper credits (PF03), National Sword (PF09), the CSRD rollback (TC05) and the cap that was dropped (PE5). Several of our own wins carry a reversal in their detail: Brazil's clearing rose again (OW12), the IRA credits were repealed (OW18), Norway is phasing its perks back (OW09), Costa Rica's payments are only part of the story (OW13), Germany's causal share in solar costs is debated (OW14) and OW17 is a projection. If we never mention them, the judge hears selection. Concede them first and reframe: a bad policy that moved a national grid is evidence of the lever's size, not of its absence (PL10 rebuttal); a mandate that backfired was found and corrected by a policy review (PL09, PF04 rebuttals); repeal is policy acting in reverse (A3 if_they_push). Then set the rule we can defend: every measured national reduction we can find ran through a standard, a price or a ban (B7 if_they_push).","avoid":"Say, early in the first speech: 'Policy can be badly designed, and we will say so when it was: Germany's nuclear exit, the EU's palm oil mandate, the UN's paper credits. What we have not found is a measured national reduction that did not run through a standard, a price or a ban.' Do not claim policy always works or that the failures were small.","tags":["cherry picking","selection","policy failures","nuclear exit","biofuels","kyoto","rebound","concede","both directions","lever","pre-empt"],"phrasings":["you only mention the policies that worked","what about Germany's coal after nuclear","the EU biofuel mandate burned the rainforest","for every Montreal there is a Kyoto","corn ethanol is worse than gasoline and the government mandated it","Brazil's enforcement collapsed in four years","the IRA got gutted and Norway is phasing the perks back"],"best_against":["M1","M2","M4","OW09","OW12","OW13","OW14","OW17","OW18","PE5","CL1"],"notes":"","sources":[{"title":"Fallacies","publisher":"Internet Encyclopedia of Philosophy (Bradley Dowden, CSU Sacramento)","year":2024,"url":"https://iep.utm.edu/fallacy/","finding":"Fetched. Suppressed Evidence: leaving out relevant, significant information that counts against one's own conclusion; also called Cherry-Picking when inadvertent. Confirmation Bias: seeking evidence for a favoured hypothesis while ignoring or underweighting disconfirming evidence.","verified":true},{"title":"Fallacies","publisher":"The Writing Center, University of North Carolina at Chapel Hill","year":2024,"url":"https://writingcenter.unc.edu/tips-and-tools/fallacies/","finding":"Fetched. Hasty generalisation: drawing a broad conclusion from a sample that is too small or unrepresentative; tip, check what the sample is and make a more modest claim if it is thin.","verified":true}],"their_sources":[]},{"id":"FL16","side":"ours","kind":"fallacy","angle":"fallacies","strength":0,"title":"Begging the question by defining 'impact' as measured tonnes","say":"We are not assuming our standard. The motion says impact on the environment, and the environment is physical. Physical change is measured. We accept any measured change they show.","detail":"Begging the question assumes what is to be proved, often by a premise that only someone who already accepts the conclusion would grant. F1 ('potential versus measured') and PE4 ('by their yardstick, we win') can be heard that way: if only realised tonnes count, a side whose case is partly about norms, attention, conscience and agency (C2, B7, C1, GL09, BH10) loses by stipulation, and BH08 ('impact means what you can control') and BH04 ('the environment is more than climate') are their attempts to contest the standard. The repair is to argue for the standard from the motion's own words and to offer it symmetrically: 'has more impact on the environment' is present tense and about a physical system, so the measure is physical change of any kind, birds and water included (OW16, GL06); our projections are held to the same test (FL08 avoid); and we will accept a measured norm-driven reduction if they can show one that did not pass through a standard, a price or a ban (B7 if_they_push). Their own opening accepted the test, 'outcomes it actually achieves, not targets or pledges' (TC01), so say that it is theirs as much as ours.","avoid":"Say in the opening: 'We propose one test for both sides: what changed in the air, the water or the land, and by how much. We will accept any measured change they show, birds and water included.' Never say 'attention is not impact' as a bare assertion; say 'attention becomes
