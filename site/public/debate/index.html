; the line is that the duty they do have points at policy. If they go to 'policy came from people', hand to F3. Overlaps C3 (if everyone did it) and FL01 (composition) in the corpus; this card is the ethics version and is kept.","sources":[{"title":"Summary of Sinnott-Armstrong, 'It's Not My Fault: Global Warming and Individual Moral Obligations' (2005)","publisher":"N. Hettinger course notes, College of Charleston","year":2012,"url":"https://hettingern.people.charleston.edu/Env_Phil_Fall_2012/SinnottArmstrong_Its_Not_My_Fault_Global_Warming.htm","finding":"Individuals have no moral obligation to avoid wasteful driving, but do have a real obligation to work to get governments to carry out their obligations, for example by working for candidates who would change policy.","verified":true},{"title":"It's Not My Fault: Global Warming and Individual Moral Obligations","publisher":"Perspectives on Climate Change 5, 285 to 307 (Duke Scholars record)","year":2005,"url":"https://scholars.duke.edu/publication/997554","finding":"Publication record only: 2005, vol 5, pp 285 to 307, DOI 10.1016/S1569-3740(05)05013-3. No abstract on the page.","verified":"partial"},{"title":"What's Wrong with Joyguzzling?","publisher":"Ethical Theory and Moral Practice 21 (Kingston and Sinnott-Armstrong)","year":2018,"url":"https://link.springer.com/article/10.1007/s10677-017-9859-1","finding":"Abstract: 'there is no moral requirement to refrain from emitting reasonable amounts of greenhouse gases'; reviews objections including that joyguzzling 'undermines political duties'; concludes 'no good reason has yet been proposed that shows why joyguzzling violates a moral requirement'. Re-fetched.","verified":true}],"their_sources":[{"title":"Kant's Moral Philosophy","publisher":"Stanford Encyclopedia of Philosophy","year":2022,"url":"https://plato.stanford.edu/entries/kant-moral/","finding":"Formula of Universal Law: 'act only in accordance with that maxim through which you can at the same time will that it become a universal law' (G 4:421).","verified":true},{"title":"Summary of Sinnott-Armstrong, 'It's Not My Fault: Global Warming and Individual Moral Obligations'","publisher":"N. Hettinger course notes, College of Charleston","year":2012,"url":"https://hettingern.people.charleston.edu/Env_Phil_Fall_2012/SinnottArmstrong_Its_Not_My_Fault_Global_Warming.htm","finding":"The For side would cite the view it attacks: Sinnott-Armstrong argues a wasteful Sunday drive is not immoral, though abstaining is better and praiseworthy.","verified":true}],"routes":[{"type":"reframe","say":"They have swapped the question. Kant asks what you may do. The motion asks what works. Virtue is not impact."},{"type":"turn","say":"Sinnott-Armstrong, the standard paper on this, concludes the individual's obligation is to make governments act. Their ethics lands on our side."},{"type":"fallacy","say":"This argues from how people ought to feel to what changes the environment. Moral worth and measured effect are different things."},{"type":"deny","say":"No one says wait. The Montreal Protocol was people acting, through the one channel that bound every country. That is action."}]},{"id":"BH04","side":"for","kind":"argument","angle":"norms and ethics","strength":4,"title":"The environment is more than climate","claim":"Climate is one slice of the environment. Litter, gardens, pollinators, invasive species, water in a drought and what a pet does at night are decided by individuals. Free-ranging cats kill 1.3 to 4 billion birds a year in the United States, likely the largest human-linked cause of bird death, and in Australia each roaming pet cat kills about 110 native animals a year. No act of parliament keeps your cat in, plants your garden for bees or picks up your wrapper. On the environment as a whole, the individual is the decisive actor.","say":"Take their own examples. The cat study ends by calling for policy intervention. Canberra requires every cat born after July 2022 to be kept in. Where a local harm got fixed, a rule fixed it.","detail":"Loss, Will and Marra close their abstract with 'scientifically sound conservation and policy intervention is needed to reduce this impact', and attribute most deaths to un-owned cats no owner controls. In Australia 71 percent of pet cats were still allowed to roam after decades of advice, so the ACT legislated that every cat born after 1 July 2022 be kept on its owner's premises at all times. Pollinators: the EU banned all outdoor use of three neonicotinoids in 2018 on EFSA's risk findings, which no gardener could do for farm fields. Litter: Ireland's 15 cent levy cut bag use about 90 percent and visibly reduced littering (Convery 2007; OW15). Water: California's drought target reached 96 percent compliance only once it was mandated (FP05). Birds: the DDT ban took bald eagles from 417 pairs to 71,000 (OW16). Toronto's cleanups are a City campaign (OP4). Conceding the environment is wider helps us: the pattern repeats in every domain.","if_they_push":"Yes, you keep your own cat in. The 2.7 million Australian cats still roaming belong to people who heard the advice and did not. That is why there is now a law.","comeback":"A law that bans a pesticide still needs a gardener to plant the flowers. Containment laws work only if owners comply. The hands are individual.","weak":false,"tags":["cats","birds","litter","gardens","pollinators","bees","invasive species","water","drought","lawn","pets","wildlife","loss marra","legge","wider environment","not just climate","local","f2","f6","fr03"],"phrasings":["the environment is not only carbon","cats kill billions of birds and no law stops that","your garden, your litter, your lawn, your pet, all individual","individuals decide the local environment","most environmental damage is small and personal"],"frames":["F2","F6","FR03"],"uses":["OW15","OW16","OP4","FP05"],"notes":"Checker re-fetched Loss et al (1.3 to 4.0 billion birds, un-owned cats cause the majority, closing call for policy intervention), the NESP release (110 per cat, 71 percent roaming), the Commission neonicotinoid page (30 May 2018 regulations, outdoor ban, greenhouses only) and the Convery abstract (90 percent, littering). The ACT City Services page returned 403, so the containment source is now the ACT Hansard debate page, which confirms the born-after-1-July-2022 rule as 'at all times'; do not say '24 hours' as a quote from the law. Penalties were not read, so do not quote a fine. Loss's bird range is 1.3 to 4.0 billion; stick to the abstract. If they say the compliance point, hand to FP05 and MK05. No duplicate in the corpus.","sources":[{"title":"The impact of free-ranging domestic cats on wildlife of the United States","publisher":"Nature Communications 4 (Loss, Will, Marra)","year":2013,"url":"https://www.nature.com/articles/ncomms2380","finding":"'Un-owned cats, as opposed to owned pets, cause the majority of this mortality'; 'Scientifically sound conservation and policy intervention is needed to reduce this impact'; TNR colonies' effectiveness not supported by peer-reviewed studies.","verified":true},{"title":"Domestic Animals (Cat Containment) Amendment Bill debate, Week 1 page 220","publisher":"ACT Legislative Assembly Hansard, 10 February 2022","year":2022,"url":"https://www.hansard.act.gov.au/hansard/10th-assembly/2022/HTML/week01/220.htm","finding":"The bill requires cats born after 1 July 2022 to be kept on their owner's premises 'at all times'; cats born before that date may roam unless they live in a declared containment suburb. (The City Services containment page returned 403 to the checker; the Hansard page is the substitute.)","verified":true},{"title":"Each roaming pet cat kills 110 native animals per year on average","publisher":"NESP Threatened Species Recovery Hub","year":2020,"url":"https://www.nespthreatenedspecies.edu.au/news-and-media/media-releases/each-roaming-pet-cat-kills-110-native-animals-per-year-on-average","finding":"2.7 million of 3.8 million pet cats (71 percent) allowed to roam; 'the only way to keep wildlife safe is to keep cats contained 24 hours per day'.","verified":true},{"title":"Neonicotinoids","publisher":"European Commission, DG SANTE","year":2018,"url":"https://food.ec.europa.eu/plants/pesticides/approval-active-substances/renewal-approval/neonicotinoids_en","finding":"2013 restrictions on clothianidin, imidacloprid and thiamethoxam; after EFSA's February 2018 conclusions, member states backed a ban on 27 April 2018 and regulations published 30 May 2018: all outdoor uses banned, only permanent greenhouses remain.","verified":true},{"title":"The most popular tax in Europe? Lessons from the Irish plastic bags levy","publisher":"Environmental and Resource Economics 38 (Convery, McDonnell, Ferreira)","year":2007,"url":"https://link.springer.com/article/10.1007/s10640-006-9059-2","finding":"Abstract: 15 euro cent tax on plastic shopping bags from 2002; 'a reduction in use in the order of 90%'; 'reduced littering and negative landscape effects'; administration about 3 percent of revenues. Re-fetched.","verified":true}],"their_sources":[{"title":"The impact of free-ranging domestic cats on wildlife of the United States","publisher":"Nature Communications 4 (Loss, Will, Marra)","year":2013,"url":"https://www.nature.com/articles/ncomms2380","finding":"Abstract: free-ranging cats kill 1.3 to 4.0 billion birds and 6.3 to 22.3 billion mammals a year in the US; un-owned cats cause most of it; likely the single greatest source of anthropogenic mortality for US birds and mammals.","verified":true},{"title":"Each roaming pet cat kills 110 native animals per year on average","publisher":"National Environmental Science Program, Threatened Species Recovery Hub (Legge et al., Wildlife Research 2020)","year":2020,"url":"https://www.nespthreatenedspecies.edu.au/news-and-media/media-releases/each-roaming-pet-cat-kills-110-native-animals-per-year-on-average","finding":"110 native animals per roaming pet cat per year (40 reptiles, 38 birds, 32 mammals); 390 million animals a year nationally; 3.8 million pet cats, 2.7 million (71 percent) allowed to roam.","verified":true}],"routes":[{"type":"turn","say":"Their cat paper's last sentence is 'policy intervention is needed'. Their own evidence asks for our side."},{"type":"outweigh","say":"Advice left most Australian pet cats roaming. Canberra legislated containment for every cat born after July 2022. Voluntary first, law when it mattered."},{"type":"reframe","say":"Pollinators, litter, water, eagles: the EU neonic ban, Ireland's bag levy, California's mandate, the DDT ban. Each local harm they name was moved by a rule."},{"type":"deny","say":"Most of those bird deaths are from un-owned cats. No pet owner's choice reaches a feral colony. Only a management programme does."}]},{"id":"BH05","side":"for","kind":"argument","angle":"norms and ethics","strength":3,"title":"Demand drives production, firms follow consumers","claim":"Companies answer to customers, not regulators. Patagonia's founder gave the company away in 2022 so that 98 percent of it funds environmental work, and it gives 1 percent of sales to grassroots groups, because its customers demanded it. Over 11,000 companies in 106 countries have paid to be certified B Corps to win those customers. Plant-based milk went from a niche to about 13 to 15 percent of US milk sales with no mandate. When demand moves, supply chains move, and demand is nothing but individuals choosing.","say":"Look at the trend. Plant-based milk's US share is 13 percent and shrinking after decades of consumer demand. Norway's car market went electric because of a tax rule, not a trend.","detail":"GFI's own 2025 figures show plant-based milk at 13 percent of dollar sales, down from almost 15 percent in 2023, with unit sales down 5 percent. Thirty years of consumer demand plateaued; Norway's VAT and registration exemptions took EVs to 88.9 percent of new cars in 2024 (OW09). B Lab's own 2024 report counts about 9,400 certified companies worldwide against tens of millions of small businesses in the United States alone, so for scale it is a sliver of the economy. By our definitions Patagonia and B Lab are a company and an organisation, not individuals (F5). And no shopper can buy a cleaner grid or a steel mill's furnace; the ICCT shows the same EV cuts 66 percent in Europe and 19 percent in India because of the grid, which is policy (FR04).","if_they_push":"Demand matters where a substitute sits on the shelf. Who puts the substitute on the shelf, at a price that wins, is the question, and in every big case we have it was a standard, a tax or a tariff.","comeback":"Thirteen percent of a staple from zero, with no subsidy, is enormous. And Norway's buyers still had to choose the car. Policy opened the door, people walked through.","weak":false,"tags":["demand","consumers","patagonia","chouinard","b corp","b lab","plant-based milk","oat milk","market share","firms follow","supply chain","consumer power","vote with your wallet","ethical consumer","f2","f5","fr04"],"phrasings":["companies respond to customers faster than to regulators","Patagonia proves business follows conscience","plant milk took 15 percent of the market without any law","vote with your wallet","thousands of B Corps exist because consumers demanded it"],"frames":["F2","F5","FR04"],"uses":["OW09","OW14","M2"],"notes":"Checker re-fetched GFI (13 percent, dollars down 2, units down 5), AgFunderNews (almost 15 percent in 2023, now verified), Patagonia NZ ownership page (98/2, 1 percent of sales). B Lab's home page and the SBA FAQ both returned 403, so those two sources are marked false and their numbers (11,195; 34.75 million) are out of the detail; the B Corp count now rests on B Lab's 2024 annual report summary (9,368), which did load. The old turn route quoted B Lab's 'compliance with upcoming regulations' pitch, which could not be verified, so it was replaced. The turn is inference from the ownership page (profits to the Holdfast Collective, which funds environmental work); say it as a reading, not a quote. Norway's 89 percent is OW09's number. Overlaps C4 (sustainable products winning market share) and MK06 (EV buyers); this card is the demand-drives-firms version and is kept.","sources":[{"title":"Market research: plant-based milk","publisher":"Good Food Institute","year":2026,"url":"https://gfi.org/marketresearch/","finding":"2025: plant-based milk 2.7 billion dollars, about 13 percent of total milk dollar sales, dollar sales down 2 percent and unit sales down 5 percent.","verified":true},{"title":"B Lab Global home page","publisher":"B Lab","year":2026,"url":"https://www.bcorporation.net/en-us/","finding":"Home page returned 403 to the checker; the counter and the 'compliance with upcoming regulations' line could not be confirmed. B Lab's 2024 annual report summary gives 9,368 certified B Corps.","verified":false},{"title":"Frequently Asked Questions About Small Business, 2024","publisher":"US Small Business Administration, Office of Advocacy","year":2024,"url":"https://advocacy.sba.gov/2024/07/23/frequently-asked-questions-about-small-business-2024/","finding":"Page and PDF returned 403 to the checker. The Office of Advocacy's November 2024 release is titled with 34.8 million small businesses; not loaded.","verified":false},{"title":"US retail sales of plant-based milk by numbers","publisher":"AgFunderNews (reporting GFI/SPINS)","year":2024,"url":"https://agfundernews.com/us-retail-sales-of-plant-based-milk-by-numbers-coconut-is-up-almond-is-down-soy-and-oat-are-flat","finding":"Plant-based milk accounted for almost 15 percent of US retail milk dollar sales in 2023, citing GFI. Re-fetched.","verified":true}],"their_sources":[{"title":"Ownership","publisher":"Patagonia","year":2022,"url":"https://www.patagonia.co.nz/pages/ownership","finding":"Holdfast Collective owns 98 percent of the company and all nonvoting stock; Patagonia Purpose Trust owns 2 percent and all voting stock; profits after reinvestment go to the Collective as a dividend; Patagonia continues to donate 1 percent of sales to grassroots environmental nonprofits.","verified":true},{"title":"B Lab Global home page","publisher":"B Lab","year":2026,"url":"https://www.bcorporation.net/en-us/","finding":"Home page returned 403 to the checker. B Lab's own 2024 annual report summary (usca.bcorporation.net) gives 9,368 certified B Corps; its May 2026 press release is reported as over 10,700 in 104 countries but could not be loaded.","verified":false},{"title":"Market research: plant-based milk","publisher":"Good Food Institute","year":2026,"url":"https://gfi.org/marketresearch/","finding":"2025 US retail plant-based milk 2.7 billion dollars, about 13 percent of total milk category dollar sales; dollar sales down 2 percent, units down 5 percent to 684 million.","verified":true}],"routes":[{"type":"deny","say":"GFI reports plant-based milk's share of US milk sales fell to 13 percent last year, with units down too. Consumer demand has peaked without a policy push."},{"type":"outweigh","say":"Norway's tax exemptions took electric cars to 89 percent of new sales. No consumer market anywhere has matched that without the rule."},{"type":"reframe","say":"Patagonia is a company and B Lab is a certifier. By the definitions set at the opening, that is not individual action."},{"type":"turn","say":"Patagonia's owner now routes its profits to environmental groups. The founder's judgement was that the money does most good pushing on the system, not in the shopping basket."}]},{"id":"BH06","side":"for","kind":"argument","angle":"norms and ethics","strength":4,"title":"Policy is made of individuals, the distinction is false","claim":"Governments do not act; people in them do. A minister signs, an official drafts, a voter elects, a scientist testifies, a citizen sues. Every policy win the other side lists is a chain of individual decisions. So the motion's contrast is empty: policy is individual action with a letterhead, and crediting 'government' is crediting individuals by another name. If the distinction is false, the side defending individuals wins by definition.","say":"The motion itself puts individual action and government policy on opposite sides. Collapse them and there is no debate. A law binds millions who never chose it. That is policy, not a person.","detail":"Our opening defined individual action as action by a single person who then gathers others, and government as an institution with legislative and executive power (F5). The difference is not who holds the pen but what the signature does: Ontario's coal law bound every generator in the province, including those who opposed it (M1); a treaty bound 198 parties (M2). No individual act has that property. Saying a government is 'only individuals' is the composition error: a parliament has powers none of its members has alone, as a brick wall holds a roof no brick could. If they insist the distinction is false, then every policy win we list is theirs and every lifestyle example is ours, and the motion is unjudgeable; a judge will not reward that. If they say the vote or the lawsuit is the individual act, then the impact arrives through policy (F3).","if_they_push":"Ask which it is. If a minister's signature is individual action, then so is the Clean Air Act, and they have conceded that the biggest individual actions are policies.","comeback":"Composition cuts both ways: you cannot credit 'government' with an outcome either. Every outcome you cite was decided by named people with names and votes.","weak":false,"tags":["definition","false distinction","governments are people","ministers","officials","voters","letterhead","composition","semantic","definitional","collapse","f3","f5","motion wording","f6"],"phrasings":["governments are just individuals in suits","every policy was written by a person","there is no such thing as government action, only people acting","your distinction is artificial","policy is individual action at scale"],"frames":["F3","F5","F6"],"uses":["M1","M2","FR03"],"notes":"Checker re-fetched SEP: composition is 'the properties of parts and composites are mistakenly thought to be transferable from one to the other'. Purely definitional, no number, so one source is enough. The Hardin line is FR03's verified finding; the 198 parties is M2's figure. Risk: a judge may hear this as semantics on both sides; the two-horn question in if_they_push is the whole card, so rehearse it. Overlaps TC01 (engineers and voters are individuals too), FL01 (composition) and FL06 (equivocation on individual action); keep this as the definitional answer and send the speaker to F3 and F5.","sources":[{"title":"Fallacies","publisher":"Stanford Encyclopedia of Philosophy","year":2024,"url":"https://plato.stanford.edu/entries/fallacies/","finding":"Composition fallacy defined: properties of parts mistakenly transferred to the whole, or the reverse.","verified":true}],"their_sources":[{"title":"Fallacies","publisher":"Stanford Encyclopedia of Philosophy","year":2024,"url":"https://plato.stanford.edu/entries/fallacies/","finding":"The For side would not cite this; it is the entry we use. Composition: 'the properties of parts and composites are mistakenly thought to be transferable from one to the other'.","verified":true}],"routes":[{"type":"fallacy","say":"That is the error of composition. A parliament has powers no member has alone. Being made of people does not make a law a personal choice."},{"type":"reframe","say":"If government action is individual action, they have conceded our mechanism. Every win they would claim arrives through law."},{"type":"deny","say":"A law binds millions who never agreed to it, including the coal plant that lobbied against it. No individual act does that."},{"type":"turn","say":"Hardin's answer to the commons was mutual coercion mutually agreed upon. Individuals chose rules precisely because individual choice could not do the job."}]},{"id":"BH07","side":"for","kind":"argument","angle":"norms and ethics","strength":3,"title":"Hypocrisy kills policy, credibility is the lever","claim":"Policy only works if people believe the people making it. Leaders fly private jets to climate summits: Gössling's 2024 study tracked hundreds of private flights to COP28 and found private aviation emitted 15.6 million tonnes in 2023, up 46 percent since 2019. Attari's experiments show a climate researcher with a large footprint loses credibility and his audience's support for the policies he advocates. So the lever that makes policy possible is personal: the credible individual who lives the change.","say":"Their lever ends in a law. Attari measured credibility by how far it moved policy support, and Sparkman found a very green advocate no more persuasive than a moderately green one.","detail":"Rejecting a measure because its advocate does not live by it is the tu quoque form of the ad hominem (SEP). Gössling's abstract ends: 'Regulation is needed to address the sector's growing climate impact'; private aviation is 1.7 to 1.8 percent of commercial aviation's CO2, so the hypocrisy is real and small, and the fix they propose is a rule. Attari's 2019 study measured credibility as a lever on support for policy, and found the penalty is 'greatly reduced' once the communicator reforms; Sparkman and Attari also found highly sustainable advocates were no more persuasive than moderately sustainable ones. So credibility is instrumental: it works when it moves law (F3). The Montreal Protocol phased out 99 percent of controlled substances regardless of how delegates travelled to Montreal (M2).","if_they_push":"Agreed, leaders should fly less, and we would regulate private jets; notice the remedy is a rule. Credibility is instrumental: Attari scores it by the policy support it unlocks, so even on their evidence the impact arrives as policy. A negotiator's seat class is not the treaty's effect.","comeback":"Calling it a fallacy does not make voters trust the minister. Attari shows the footprint changes real support for real policy. Credibility is the bottleneck and it is personal.","weak":false,"tags":["hypocrisy","private jets","cop28","cop26","leaders","credibility","attari","footprint","practice what you preach","gössling","trust","messenger","walk the talk","elites","f3","fr10"],"phrasings":["they fly private jets to climate summits and expect us to listen","nobody trusts a policy from a hypocrite","credibility comes from living it","leaders' footprints undermine their own policies","Attari showed a big footprint destroys a scientist's credibility"],"frames":["F3","FR10"],"uses":["M2","OW17"],"notes":"Checker re-fetched Gössling (abstract: 15.6 Mt, 46 percent, 'Regulation is needed'; conclusions: 1.7 to 1.8 percent; text: 404 aircraft at COP28, so the For source is now verified with that count), Attari 2016 abstract, Attari 2019 PDF text (reform quote), the Sparkman summary page and SEP (tu quoque). The old say led with 'that is attacking the speaker', which answers a weaker version of the claim: they are not attacking a policy, they are saying personal credibility is the causal lever that makes policy possible. The new say meets that version: Attari measures credibility by policy support, and Sparkman shows personal perfection is not the bottleneck. The fallacy route stays for when they do use the jets to dismiss a measure. The '99 percent' in the outweigh route is M2's verified figure. Duplicates FL11 (tu quoque) in the corpus; keep this card as the evidence version.","sources":[{"title":"Private aviation is making a growing contribution to climate change","publisher":"Communications Earth and Environment 5","year":2024,"url":"https://www.nature.com/articles/s43247-024-01775-z","finding":"Abstract ends 'Regulation is needed to address the sector's growing climate impact'; the conclusions say direct emissions 'amount to 1.7% to 1.8% of commercial aviation's CO2 emissions'. Re-fetched.","verified":true},{"title":"Climate change communicators' carbon footprints affect their audience's policy support","publisher":"Climatic Change 154 (Attari, Krantz, Weber)","year":2019,"url":"https://elke-u-weber.com/media/2019_climaticchange_attari.pdf","finding":"PDF text: 'the negative effects of a large carbon footprint on credibility are greatly reduced if the communicator reforms their behavior'; the paper frames footprint criticism as an ad hominem argument and measures policy support as an outcome. Re-fetched.","verified":true},{"title":"New work: Ad hominem attacks or do-gooder derogation? (Sparkman and Attari 2020 summary)","publisher":"szattari.com","year":2019,"url":"https://www.szattari.com/news/2019/9/27/new-work-ad-hominem-or-do-gooder-derogation","finding":"Inconsistency hurts credibility, much more for experts; 'highly sustainable advocates were not more influential than somewhat sustainable ones', marginally worse.","verified":true},{"title":"Fallacies","publisher":"Stanford Encyclopedia of Philosophy","year":2024,"url":"https://plato.stanford.edu/entries/fallacies/","finding":"Tu quoque as a version of ad hominem: 'not accepting a view or a recommendation because the espouser him- or herself does not follow it'.","verified":true}],"their_sources":[{"title":"Private aviation is making a growing contribution to climate change","publisher":"Communications Earth and Environment 5 (Gössling, Humpe, Cardoso Leitão)","year":2024,"url":"https://www.nature.com/articles/s43247-024-01775-z","finding":"Abstract: at least 15.6 Mt CO2 in 2023; emissions up 46 percent 2019 to 2023; 'Regulation is needed to address the sector's growing climate impact'. The text says 'Of the 404 aircraft at COP28, 96 also appeared at the FIFA World Cup', so a COP28 aircraft count of 404 is on the page; press counts of 291 or 644 flights are not. Re-fetched.","verified":true},{"title":"Statements about climate researchers' carbon footprints affect their credibility and the impact of their advice","publisher":"Climatic Change 138 (Attari, Krantz, Weber)","year":2016,"url":"https://link.springer.com/article/10.1007/s10584-016-1713-2","finding":"Abstract: two large online surveys, 18 vignettes; alleged large footprints 'can greatly reduce the researcher's credibility' and strongly affect intentions to change energy use, for believers and sceptics alike.","verified":true},{"title":"Climate change communicators' carbon footprints affect their audience's policy support","publisher":"Climatic Change 154 (Attari, Krantz, Weber)","year":2019,"url":"https://elke-u-weber.com/media/2019_climaticchange_attari.pdf","finding":"A communicator's footprint also affects audience support for the public policies the communicator advocates.","verified":true}],"routes":[{"type":"fallacy","say":"Dismissing a policy because its advocate flies is attacking the person, not the policy. The treaty's effect does not depend on the delegate's seat class."},{"type":"turn","say":"Their private-jet study concludes 'regulation is needed'. The authors of their evidence prescribe our side."},{"type":"reframe","say":"Attari measured credibility by its effect on support for policy. Credibility is a lever on law. The impact still arrives as policy."},{"type":"outweigh","say":"Private aviation is under two percent of commercial aviation's CO2. The Montreal Protocol removed nearly all ozone-depleting substances whatever the delegates flew."}]},{"id":"BH08","side":"for","kind":"argument","angle":"norms and ethics","strength":3,"title":"Impact means what you can control","claim":"A person cannot pass a law. The only impact anyone actually has is the marginal effect of the choices within their control. Wynes and Nicholas put living car-free at 2.4 tonnes a year, one fewer transatlantic flight at 1.6, a plant-based diet at 0.8, and one fewer child at 58.6. Those are real tonnes a person can remove tomorrow. 'Policy has more impact' is like saying the weather has more impact: true and useless, because nobody in this room controls it.","say":"They have redefined impact as control. The motion compares effects. By their own table, going car-free saves 2.4 tonnes a year. Ontario's coal law saved the equivalent of millions of people doing that.","detail":"'Has more impact' is a comparison of outcomes, and F1 asks for measured ones. Their list is scenario tonnes per person; our set is realised megatonnes (M1 to M5). Ontario's 27.5 Mt cut equals about 11 million people living car-free at Wynes and Nicholas's 2.4 t (M1's arithmetic). Their largest controllable lever, 58.6 t for one fewer child, is contested accounting (FR07, FP11), and the next is 2.4 t. Control is also wider than they say: voting, organising and lobbying are within a person's control and work through policy (F3, C5). And Wynes and Nicholas's own title is about what governments and textbooks recommend, which is a finding about public communication, a policy lever. The weather line fails because policy is the one large thing people do steer.","if_they_push":"If impact meant only what one person controls, a motion comparing it to government policy would make no sense. The motion assumes both can be measured, so measure them.","comeback":"The eleven million is a thought experiment too. Nobody here can close Nanticoke, but every one of us can stop flying this year. Reachable impact is the honest measure.","weak":false,"tags":["control","marginal","agency","wynes nicholas","car-free","flight","plant-based","fewer child","tonnes","what you can do","locus of control","definition of impact","useless comparison","controllable","f1","f3","fr07"],"phrasings":["impact only means what you can actually change","you cannot pass a law but you can stop flying","policy is like the weather, big and out of your hands","the only tonnes that count are the ones you control","Wynes and Nicholas list what one person saves"],"frames":["F1","F3","FR07"],"uses":["M1","M5","FP11"],"notes":"Checker re-fetched Wynes and Nicholas (58.6, 2.4, 1.6, 0.8; high-impact actions are 4 percent of textbook recommendations). The 27.5 Mt and 11 million are M1's arithmetic (32.9 minus 5.4, divided by 2.4). The two-meanings point is strong but the control argument is intuitive; keep it short and move to M1. Overlaps A4 (car-free, flight-free, plant-based), FR07 and FP11 on the same table; this card is the 'impact means control' framing and is kept.","sources":[{"title":"The climate mitigation gap","publisher":"Environmental Research Letters 12 (Wynes and Nicholas)","year":2017,"url":"https://iopscience.iop.org/article/10.1088/1748-9326/aa7541","finding":"Car-free 2.4 tCO2e per year; one fewer child 58.6; title and abstract address government recommendations and textbooks (high-impact actions were 4 percent of textbook recommendations).","verified":true}],"their_sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters 12 (Wynes and Nicholas)","year":2017,"url":"https://iopscience.iop.org/article/10.1088/1748-9326/aa7541","finding":"Abstract: one fewer child 58.6 tCO2e per year (developed countries), car-free 2.4, one transatlantic round trip 1.6, plant-based diet 0.8; government resources and textbooks focus on lower-impact actions.","verified":true},{"title":"What's Wrong with Joyguzzling?","publisher":"Ethical Theory and Moral Practice 21 (Kingston and Sinnott-Armstrong)","year":2018,"url":"https://link.springer.com/article/10.1007/s10677-017-9859-1","finding":"Abstract: reviews the 'negative expected value' and 'fair share' arguments about individual emissions.","verified":true}],"routes":[{"type":"reframe","say":"They swapped impact for control. The motion asks which lever changed the environment more. Measure the outcome, not the steering wheel."},{"type":"outweigh","say":"On their own table, going car-free saves 2.4 tonnes a year. Ontario's coal ban saved what millions of people doing that would. One law."},{"type":"turn","say":"Wynes and Nicholas's title is about government recommendations and textbooks missing the best actions. Their fix is better public policy on advice."},{"type":"fallacy","say":"Two meanings of one word. Impact as effect, impact as agency. The argument only works by sliding from one to the other."}]},{"id":"BH09","side":"for","kind":"argument","angle":"norms and ethics","strength":1,"title":"Children change households","claim":"Kids teach parents. Lawson's 2019 field experiment in North Carolina found parents of children taught a climate curriculum became more concerned, with the biggest shifts among fathers and conservative parents, the groups least reachable by campaigns. Every household recycles because a child brought the habit home. Change flows from the kitchen table, person to person, not from the statute book.","say":"That curriculum was taught in public schools by teachers, aligned to state science standards, built with the State Climate Office. It measured concern, not a single tonne. School is policy.","detail":"Lawson's team randomly assigned 15 teachers in public middle schools; the curriculum was built with the North Carolina State Climate Office and aligned to state standards. What children bring home is what the curriculum, a public programme, put in the classroom (F2). The outcome was a concern score, 4.29 points on a 16 point scale, in parents from 238 families in one region; no behaviour or emissions were measured. The recycling habit children bring home exists because Ontario and a packaging coalition part-funded municipal Blue Box programmes from 1986, the province legislated municipal curbside recycling in 1994, and the box now reaches 95 percent of Ontarians; the box, the truck and the contract are municipal policy. Individuals carry the habit; policy created it.","if_they_push":"We like the study. It shows a state school curriculum moving parents. That is government reaching households through children, which is our conditions line.","comeback":"The teachers did not change the parents, the children did. The transmission was a family one and it reached the people no policy campaign reaches.","weak":false,"tags":["children","kids","parents","intergenerational","lawson","education","recycling","household","kitchen table","school","teach parents","conservative fathers","blue box","f1","f2","f6"],"phrasings":["kids teach their parents to recycle","children change their parents' minds about climate","the study showed conservative dads moved when their kids learned","change starts at home","education of children spreads through families"],"frames":["F1","F2","F6"],"uses":["OP4","OW15"],"notes":"Checker re-fetched the Nature abstract and the author PDF text (15 teachers, State Climate Office, standards, 238 families, 4.29 points; the 292 appears as the parent degrees of freedom). The Canadian Encyclopedia page would not load, so the Blue Box facts now rest on the Stewardship Ontario history eBook and the Region of Waterloo history PDF, both fetched: 1986 province and industry part-funding, 1994 legislation requiring municipal curbside programmes, 95 percent of Ontarians reached. Say '95 percent of Ontarians', not households. No duplicate in the corpus.","sources":[{"title":"Children can foster climate change concern among their parents (author PDF)","publisher":"Nature Climate Change 9","year":2019,"url":"https://faculty.cnr.ncsu.edu/nilspeterson/wp-content/uploads/sites/17/2019/09/Lawson-et-al.-2019-IGL-NCC.pdf","finding":"PDF text: 'randomly assigned 15 participating teachers to treatment and control'; curriculum 'created through an iterative process with the State Climate Office' and 'aligns with both North Carolina science standards and Next Generation Science Standards'; 238 families; treatment parents '4.29 points more' concern (P = 0.006). Re-fetched.","verified":true},{"title":"The Story of Ontario's Blue Box (history eBook)","publisher":"Stewardship Ontario","year":2013,"url":"https://stewardshipontario.ca/wp-content/uploads/2013/02/Blue-Box-History-eBook-FINAL-022513.pdf","finding":"PDF text: Kitchener 1981; a coalition of soft drink companies and packaging suppliers proposes a province-wide network and the Ontario government creates the Recycling Advisory Committee; 80 percent of households had access by the early nineties, 94 percent later; 'The Blue Box reaches 95 per cent of the 13 million people who live in Ontario'. (The Canadian Encyclopedia page returned 403 and a truncated body to the checker.)","verified":true},{"title":"History of the Blue Box","publisher":"Region of Waterloo","year":2022,"url":"https://www.regionofwaterloo.ca/media/xqag2x2t/history-of-the-blue-box-2022-access-1.pdf","finding":"PDF text: pilot in Kitchener 17 September 1981; 'In 1986, an initiative between the province and a soft drink and packaging coalition helped establish and partially-fund municipalities in starting Blue Box programs'; 'In 1994, Ontario had new legislation requiring municipal curbside Blue Box programs'.","verified":true}],"their_sources":[{"title":"Children can foster climate change concern among their parents","publisher":"Nature Climate Change 9 (Lawson, Stevenson, Peterson, Carrier, Strnad, Seekamp)","year":2019,"url":"https://www.nature.com/articles/s41558-019-0463-3","finding":"Abstract: parents of treatment children expressed higher climate concern than control parents; effects strongest among male and conservative parents; daughters especially effective.","verified":true},{"title":"Children can foster climate change concern among their parents (author PDF)","publisher":"Nature Climate Change 9, author copy at NC State","year":2019,"url":"https://faculty.cnr.ncsu.edu/nilspeterson/wp-content/uploads/sites/17/2019/09/Lawson-et-al.-2019-IGL-NCC.pdf","finding":"292 parents from 238 families; treatment parents gained an average 4.29 points more concern than controls (scale minus 8 to plus 8).","verified":true}],"routes":[{"type":"reframe","say":"A state-standards curriculum taught by public school teachers is a policy instrument. The child is the messenger, not the source."},{"type":"deny","say":"The study measured concern on a questionnaire, 292 parents in one region. No behaviour, no tonnes. Concern is not impact."},{"type":"turn","say":"The recycling your child brought home came in a Blue Box Ontario funded, then required by law, now reaching 95 percent of Ontarians. The habit rides on a programme."}]},{"id":"BH10","side":"for","kind":"argument","angle":"norms and ethics","strength":2,"title":"Individual action sustains the movement","claim":"Policy needs a movement behind it, and movements run on people who feel they can do something. Hickman's 10,000-person survey found 59 percent of young people very or extremely worried and over 45 percent saying climate feelings hurt their daily functioning. Personal action is the antidote to that paralysis: it gives agency, keeps people engaged and builds the constituency without which no policy passes or survives. Take away individual action and you take away the people who demand policy.","say":"Hickman's survey found distress tracks a perceived failure by governments. Schwartz found collective action buffered depression and individual action did not. The relief they describe is politics, which is our side.","detail":"Hickman's abstract: respondents 'rated governmental responses to climate change negatively and reported greater feelings of betrayal than of reassurance', and 'a perceived failure by governments to respond to the climate crisis is associated with increased distress'. The cause of the anxiety they cite is policy failure, so its remedy is policy. Schwartz and colleagues (284 US students) found that 'engaging in collective action, but not individual action, significantly attenuated the association' between climate anxiety and depressive symptoms, and that participants perceived their individual actions as insignificant against the scale of the problem. Collective action aimed at governments is the policy channel (F3). And Werfel and Hagmann show personal-action framing can lower support for a carbon tax (FR02), so the movement they want is fed by politics, not by private habits. Feeling better is also not an environmental impact; the motion asks about the environment.","if_they_push":"We want people engaged. The evidence says the engagement that helps is collective and political, which is the engagement that produces policy; if they now call collective action individual, that is F3 and F5. And feeling better is not a change in the environment.","comeback":"Collective action is individuals acting together; that is still not government. And a movement cannot wait for the betrayal to end, it has to give people something to do today.","weak":false,"tags":["mental health","eco-anxiety","climate anxiety","agency","hickman","young people","movement","sustain","burnout","hope","engagement","paralysis","constituency","schwartz","f3","fr02"],"phrasings":["individual action is what keeps people from despair","you cannot have a movement of people who do nothing","personal action gives people agency and that builds the political will","eco-anxiety is solved by doing something yourself","the movement that makes policy runs on individuals acting"],"frames":["F3","FR02"],"uses":["OW17"],"notes":"Checker re-fetched the Bath abstract (59 percent, over 45 percent, betrayal over reassurance, perceived government failure associated with distress) and the PMC full text of Schwartz (284 students aged 18 to 35, collective but not individual action attenuated the association, cross-sectional). Schwartz is cross-sectional with self-selected students, so say 'found an association'. The Avaaz funding is from search results only. If they define collective action as individual, hand to F5 and BH06. No duplicate in the corpus.","sources":[{"title":"Climate anxiety in children and young people and their beliefs about government responses to climate change","publisher":"The Lancet Planetary Health 5 (Hickman et al.), Bath research portal","year":2021,"url":"https://researchportal.bath.ac.uk/en/publications/climate-anxiety-in-children-and-young-people-and-their-beliefs-ab/","finding":"'Rated governmental responses to climate change negatively and reported greater feelings of betrayal than of reassurance'; 'a perceived failure by governments to respond to the climate crisis is associated with increased distress'.","verified":true},{"title":"Climate change anxiety and mental health: Environmental activism as buffer","publisher":"Current Psychology, PMC copy (Schwartz et al.)","year":2022,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8883014/","finding":"N = 284 US students aged 18 to 35; 'engaging in collective action, but not individual action, significantly attenuated the association between CCA cognitive emotional impairment and MDD symptoms'; open responses showed a perception of the insignificance of their actions; cross-sectional.","verified":true}],"their_sources":[{"title":"Climate anxiety in children and young people and their beliefs about government responses to climate change: a global survey","publisher":"The Lancet Planetary Health 5 (Hickman et al.)","year":2021,"url":"https://researchportal.bath.ac.uk/en/publications/climate-anxiety-in-children-and-young-people-and-their-beliefs-ab/","finding":"10,000 people aged 16 to 25 in 10 countries; 59 percent very or extremely worried, 84 percent at least moderately; more than 45 percent said feelings about climate change negatively affected daily life and functioning.","verified":true},{"title":"Climate change anxiety and mental health: Environmental activism as buffer","publisher":"Current Psychology (Schwartz, Benoit, Clayton, Parnes, Swenson, Lowe)","year":2022,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8883014/","finding":"The For side would cite it for action buffering distress; see rebuttal for what it actually found.","verified":true}],"routes":[{"type":"turn","say":"Hickman's own finding is that distress rises with perceived government failure. The young are anxious because policy is lacking, not because they recycle too little."},{"type":"deny","say":"Schwartz found individual action did not buffer depressive symptoms. Collective action did. Their mental-health evidence points away from private habits."},{"type":"reframe","say":"Collective action aimed at governments is the policy route. If that is what sustains the movement, the movement is about policy."},{"type":"fallacy","say":"Feeling better is a reason to act, not a measure of environmental impact. The motion asks what changed the environment, not who felt agency."}]},{"id":"TC01","side":"for","kind":"argument","angle":"their case","strength":4,"title":"Engineers and voters are individuals too","claim":"Individual action means decisions made by people as consumers, as professionals such as engineers, and as citizens who vote and demand change. Government policy is laws, regulations, taxes, subsidies and standards, and we measure policy by the outcomes it actually achieves, not by targets or pledges. The power that causes the harm is the power that reduces it, and individual action controls policy through voting.","say":"An engineer designs to a code and a voter acts through a legislature. Both reach the environment through an institution. That is the contrast the motion draws, and they have put both on our side.","detail":"Their definition folds professionals and voters into individual action. An engineer's design decision is bounded by building codes, emission standards and procurement rules; the standard decides what the design may emit (F2). A vote changes nothing until a legislature turns it into a law, so the tonnes arrive through policy (F3, C5). Their yardstick, outcomes rather than pledges, is our F1: measured reductions, not scenarios. Hold them to it: every number in their case is a footprint share or a projection, and every measured cut we show is a law (M1, M3, OW04). Read alongside C5 and F3.","if_they_push":"Ask which definition they are running. If voting and engineering under standards count as individual action, then every policy is individual action and the motion compares a thing with itself. If they drop those, their Earth Day and voting arguments drop with them.","comeback":"Institutions are made of individuals. A standard is an engineer's judgement written down and a law is votes counted; take the people out and nothing happens.","weak":false,"tags":["definition","definitions","engineers","professionals","consumers","citizens","voting","demanding change","outcomes not pledges","design decisions","individual action controls policy","opening","f1","f3","f2"],"phrasings":["Individual action: decisions made by people as consumers, professionals (such as engineers), and as citizens (voting, demanding change).","Government policy: laws, regulations, taxes, subsidies, and standards enacted by governments intended to change environmental outcomes.","We are measuring policy by the outcomes it actually achieves, not by their targets or pledges.","Individuals have the greatest power over outcomes, as the power that causes the harm is also what reduces it (design decisions, consumption shifts, voting).","Individual action controls policy (voting).","The other side can say our argument is that individuals mostly cause harm and policy is the solution."],"frames":["F1","F3","F2"],"uses":["M3","OW04"],"notes":"No number in the say line. The definition move is their strongest structural point because it lets them claim voting and Earth Day; the answer is F3, make them pick. Judges may find the 'definition swallows both sides' point abstract, so lead with the engineer-and-code example. Likely_phrasings now carry their draft's definition sentences verbatim.","sources":[{"title":"40th Anniversary of the Clean Air Act","publisher":"US EPA","year":2010,"url":"https://www.epa.gov/node/85961","finding":"'The Clean Air Act was signed by President Richard Nixon on December 31, 1970', i.e. the 1970 output was a statute. Refetched this pass.","verified":true}],"their_sources":[],"routes":[{"type":"reframe","say":"They define individual action to include voting and engineering to standards. Both act through institutions. That is the contrast the motion draws, and they have conceded it."},{"type":"turn","say":"Outcomes, not pledges, is our test too. Their numbers are footprint shares and projections. Ours are measured reductions written in law."},{"type":"fallacy","say":"If every vote, design and purchase is individual action, then policy is individual action too and the motion has nothing to compare. A definition that swallows both sides proves neither."},{"type":"deny","say":"An engineer does not choose the emission limit. The standard does. Dieselgate was engineers breaking a standard, and a regulator caught it."}]},{"id":"TC02","side":"for","kind":"argument","angle":"their case","strength":5,"title":"Households drive more than 60% of emissions","claim":"Household consumption contributes to more than 60% of global GHG emissions and between 50 and 80% of total land, material and water use. Consumption drives emissions, and policy mostly does not regulate consumption.","say":"That is an accounting choice. The study traces every supply-chain tonne to the final buyer, with 2007 data. It charges the grid and the factory to the household. It never says the household controls them.","detail":"Ivanova et al. 2016 is an environmentally extended multiregional input-output study: it allocates upstream emissions from power plants, steel mills and freight to the household that buys the end product, so 'contributes to' means 'is the end of the chain for', not 'decides'. The same accounting puts Ontario's coal plants inside Toronto households' footprints, and that footprint fell when the province closed the plants, 32.9 to 5.4 megatonnes between 2005 and 2014, not when anyone changed a purchase (M1, F2). The abstract states no policy conclusion. Read alongside A1, which carries the Statistics Canada two-fifths figure. Their next line, that policy does not regulate consumption, is wrong on its own terms: fuel economy standards, building codes, carbon prices and appliance standards all regulate what a household consumes and how much it emits.","if_they_push":"Concede that mobility, diet and heating are partly discretionary. Then ask for the measured number: how much of the 60 percent has any population changed by choice? Nobody has measured it. Ontario's 27.5 megatonnes a year is measured (F1, M1).","comeback":"The paper itself names food, mobility and shelter as the biggest categories, and households choose what they eat, drive and heat; the accounting follows real decisions.","weak":false,"tags":["households","household consumption","60%","60 percent","50-80%","land","material","water use","ivanova","consumption drives emissions","research.ou.nl","footprint","f2","f1"],"phrasings":["Household consumption contributes to more than 60% of global GHG emissions and between 50-80% of total land, material, and water use.","Household consumption contributes to more than 60% of global GHG emissions.","Consumption drives emissions, and policy mostly doesn't regulate consumption.","Over 60 percent of emissions come from what households consume."],"frames":["F2","F1"],"uses":["M1"],"notes":"Fetched the research.ou.nl abstract this pass: the 60% and 50-80% are there, word for word as they quote; EXIOBASE 2.2, 43 countries, 2007 confirmed. Ontario End of Coal page refetched: 32.9 and 5.4 Mt confirmed (table is labelled as a forecast for 2014 on the page). Their second sentence (policy does not regulate consumption) is unsourced and easy to deny with standards and codes.","sources":[{"title":"Environmental Impact Assessment of Household Consumption (Ivanova et al.)","publisher":"Journal of Industrial Ecology 20(3), via Open Universiteit research portal","year":2016,"url":"https://research.ou.nl/en/publications/environmental-impact-assessment-of-household-consumption/","finding":"Method is EE-MRIO (EXIOBASE 2.2), 2007 supply chains; impacts attributed to final household consumption wherever produced; food, mobility and shelter the largest categories; abstract makes no policy statement.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG 32.9 Mt CO2e (2005) to 5.4 Mt (2014); coal about 25 percent of supply in 2003, 0 percent in 2014; Ending Coal for Cleaner Air Act (2015). Refetched this pass.","verified":true}],"their_sources":[{"title":"Environmental Impact Assessment of Household Consumption (Ivanova et al.)","publisher":"Journal of Industrial Ecology 20(3), via Open Universiteit research portal","year":2016,"url":"https://research.ou.nl/en/publications/environmental-impact-assessment-of-household-consumption/","finding":"Abstract: households contribute 'more than 60% of global GHG emissions' and 'between 50% and 80% of total land, material, and water use'; EXIOBASE 2.2 multiregional input-output database, 43 countries plus five rest-of-world regions, global supply chains for 2007. Their quote is exact. Refetched this pass.","verified":true}],"routes":[{"type":"reframe","say":"Consumption-based accounting assigns upstream tonnes to the final buyer. It is a bookkeeping rule about where to write the tonne, not a finding about who can remove it."},{"type":"deny","say":"The data are from 2007 and the word is 'contributing', through global supply chains. Nothing in the paper measures what households could change."},{"type":"outweigh","say":"Ontario households' electricity footprint collapsed when the province closed coal plants. Same households, same habits, 27 megatonnes gone by law."},{"type":"turn","say":"Households carry 60 percent because the grid and the factories are charged to them. Changing the grid and the factories is how that share falls, and that is policy."}]},{"id":"TC03","side":"for","kind":"argument","angle":"their case","strength":5,"title":"Households responsible for 72% of emissions","claim":"Through consumption behaviour, households are responsible for 72% of global GHG emissions. The major components of household footprints are car and plane mobility, diet, meaning meat and dairy, and heating, all of which are choices individuals make about where to live, how to travel and what to eat.","say":"Read the end of their abstract. Dubois and colleagues conclude that voluntary efforts will not be sufficient and that households need a regulatory framework. Their 72 percent source argues for policy.","detail":"The paper's title is 'It starts at home? Climate policies targeting household consumption', and its abstract ends: short term voluntary efforts will not be sufficient by themselves to reach the reductions needed for 1.5 C; households need a regulatory framework supporting their behavioural changes. The 72 percent is the same consumption-based footprint accounting as the 60 percent (TC02, A1): it is the share of global tonnes that end at a household, not the share a household can remove. The paper also finds that household living situation shapes reduction potential more than the person's city or country does, which is to say the housing stock and the infrastructure, both policy products (F2). Read alongside A1 and FR05.","if_they_push":"Agree that mobility, diet and heating are the big categories. Then ask what moved them anywhere at scale: Norway's car fleet moved on tax exemptions (OW09), heating moved on building codes and grid rules, and no population has changed its diet by exhortation.","comeback":"The paper still says households are responsible for 72 percent; a regulatory framework that supports behaviour change is scaffolding, and behaviour change is still what does the work.","weak":false,"tags":["72%","72 percent","households responsible","dubois","consumption behaviour","car","plane","mobility","meat","dairy","heating","where to live","how to travel","what to eat","sciencedirect","f2","f1"],"phrasings":["Through consumption behaviour, households are responsible for 72% of global GHG emissions.","Major components of household footprints are car and plane mobility, diet (meat and dairy consumption), and heating, all of which are choices individuals make about where to live, how to travel, and what to eat.","These are all choices individuals make about where to live, how to travel, and what to eat.","72 percent of emissions come down to household behaviour."],"frames":["F2","F1"],"uses":["OW09"],"notes":"Abstract verified word for word on the Vestlandsforsking record this pass, including the regulatory-framework conclusion; year 2019 and journal confirmed on the Semantic Scholar record. Their ScienceDirect link returned 403. The Sussex press page from the earlier pass returned 404 and has been dropped.","sources":[{"title":"It starts at home? (Dubois et al.) publication record with abstract","publisher":"Vestlandsforsking","year":2019,"url":"https://vestforsk.dev05.ovh.ramsalt.com/nn/publication/it-starts-home-climate-policies-targeting-household-consumption-and-behavioral","finding":"Abstract conclusion: 'short term voluntary efforts will not be sufficient by themselves' and 'households need a regulatory framework supporting their behavioral changes'. Refetched this pass.","verified":true}],"their_sources":[{"title":"It starts at home? Climate policies targeting household consumption and behavioral decisions are key to low-carbon futures (Dubois, Sovacool, Aall et al.)","publisher":"Energy Research & Social Science, via Vestlandsforsking publication record","year":2019,"url":"https://vestforsk.dev05.ovh.ramsalt.com/nn/publication/it-starts-home-climate-policies-targeting-household-consumption-and-behavioral","finding":"Abstract: 'Through their consumption behavior, households are responsible for 72% of global greenhouse gas emissions'; car and plane mobility, meat and dairy, heating named as the largest components. Their quote is exact. Refetched this pass.","verified":true},{"title":"Semantic Scholar record, DOI 10.1016/j.erss.2019.02.001","publisher":"Semantic Scholar","year":2019,"url":"https://api.semanticscholar.org/graph/v1/paper/DOI:10.1016/j.erss.2019.02.001?fields=title,abstract,year,venue,journal,authors","finding":"Title and venue Energy Research & Social Science confirmed, year 2019; abstract opens 'Through their consumption behavior, households are responsible for 72% of global greenhouse gas emissions.' Fetched this pass.","verified":true},{"title":"ScienceDirect article page S2214629618310314","publisher":"Elsevier","year":2019,"url":"https://www.sciencedirect.com/science/article/pii/S2214629618310314","finding":"Their cited URL; returned 403 to our fetch, abstract confirmed via the two records above.","verified":false}],"routes":[{"type":"turn","say":"Their own source concludes that voluntary efforts will not be sufficient and households need a regulatory framework. They have cited a paper that argues our motion."},{"type":"reframe","say":"Seventy-two percent is footprint accounting: tonnes traced to the final consumer, including the power plant and the steel mill. It measures where tonnes end, not who can remove them."},{"type":"fallacy","say":"They quoted the paper's first number and skipped its conclusion. Taking the headline and leaving the finding is not evidence, it is selection."},{"type":"outweigh","say":"Where mobility did change at scale, Norway at 89 percent electric new cars, it was tax policy, not a nation of volunteers."}]},{"id":"TC04","side":"for","kind":"argument","angle":"their case","strength":4,"title":"Scope 3 is 75% and policy never caps it","claim":"Scope 1 and 2 emissions are the easiest to control; scope 3 covers indirect activities outside a company's direct control, like suppliers and customer use. According to CDP, scope 3 makes up 75% of a company's carbon footprint on average, so that is where most emissions sit, and it is driven by what consumers choose to buy. Governments increasingly require reporting of scope 3 but rarely cap or tax it.","say":"Every scope 3 tonne is somebody else's direct emission. The fuel a customer burns is taxed at the pump and limited by fuel standards. Policy catches the tonne where it is emitted.","detail":"The CDP note is about which reporting categories matter; its 75 percent is the average across a sample of CDP respondents in high-impact sectors, using 2021 response data, not a law of nature about 'a company's footprint'. Scope 3 is an accounting layer: an oil company's largest scope 3 category is use of sold products, which is the driver's scope 1 and is the tonne a carbon price, a fuel standard or an EU ETS allowance hits (OW07, OW08). A supplier's emissions are the supplier's scope 1 and sit under the supplier's jurisdiction's rules. So 'policy does not cap scope 3' is true only of the label; the tonnes themselves are capped and priced in the places they occur. Consumers cannot see a product's scope 3 at all; the only reason anyone knows the number is that disclosure was mandated (FR08 for the same point on Carbon Majors).","if_they_push":"Ask them to name a scope 3 tonne that no government anywhere regulates at its source. Shipping and aviation are the honest answers, and both are being brought under ICAO and IMO rules, which is policy.","comeback":"Whatever you call the tonne, it exists because a customer bought the product, and a price at the pump has not stopped people driving.","weak":false,"tags":["scope 3","scope 1","scope 2","75%","75 percent","cdp","carbon disclosure project","supply chain","suppliers","customer use","reporting not caps","consumers choose to buy","company footprint","f2"],"phrasings":["Scope 1 and 2 emissions are the easiest to control, while scope 3 emissions are much more complex because it involves indirect activities outside a company's direct control (like suppliers and customer use).","According to the Carbon Disclosure Project, scope 3 emissions make up 75% of a company's carbon footprint on average.","Scope 3 emissions is where most emissions sit, and it is driven by what consumers choose to buy.","While government policies are increasingly requiring the reporting of scope 3 emissions, they less frequently mandate direct caps or taxes specifically controlling them."],"frames":["F2"],"uses":["OW07","OW08"],"notes":"PDF downloaded and text extracted with pdftotext this pass; the 75% sentence refers to 'the sample' of 2021 CDP responses from high-impact sectors. Their phrase 'a company's carbon footprint on average' is a loose paraphrase but not wrong in spirit, so do not call it wrong; say what the sample is. The ETS 1.2 billion tonnes figure is OW07's and is not re-verified here; say it only if OW07 is in hand.","sources":[{"title":"CDP Technical Note: Relevance of Scope 3 Categories by Sector (v3.0)","publisher":"CDP","year":2024,"url":"https://cdn.cdp.net/cdp-production/cms/guidance_docs/pdfs/000/003/504/original/CDP-technical-note-scope-3-relevance-by-sector.pdf","finding":"'Scope 3 emissions account on average for 75% of total Scope 1+2+3 emissions in the sample'; the note's purpose is to identify relevant reporting categories per high-impact sector from 2021 CDP responses; it names 'use of sold products' as the dominant scope 3 category for fuel sectors.","verified":true}],"their_sources":[{"title":"CDP Technical Note: Relevance of Scope 3 Categories by Sector (v3.0)","publisher":"CDP","year":2024,"url":"https://cdn.cdp.net/cdp-production/cms/guidance_docs/pdfs/000/003/504/original/CDP-technical-note-scope-3-relevance-by-sector.pdf","finding":"Exact wording: 'across all sectors Scope 3 emissions account on average for 75% of total Scope 1+2+3 emissions in the sample'; based on 'analysis of 2021 CDP response data' for CDP's high-impact sectors. Version table: 1.0 April 11, 2022; 2.0 January 25, 2023; 3.0 June 28, 2024. PDF downloaded and text extracted this pass.","verified":true}],"routes":[{"type":"deny","say":"The 75 percent is the average of a sample of CDP respondents in high-impact sectors, with 2021 data, as the note says. A reporting statistic, not a company's footprint."},{"type":"reframe","say":"Scope 3 is double counting by design. The customer's fuel is the oil company's scope 3 and the driver's scope 1, and the carbon price hits it there."},{"type":"turn","say":"No consumer can see a product's scope 3. The number exists because governments and investors made companies disclose it. Visibility itself is policy."},{"type":"outweigh","say":"The EU carbon market, a cap on the smokestack side of those supply chains, is credited with about 1.2 billion tonnes avoided. Name a consumer choice measured like that."}]},{"id":"TC05","side":"for","kind":"argument","angle":"their case","strength":2,"title":"Even the CSRD had to be rolled back","claim":"The EU's Corporate Sustainability Reporting Directive was implemented to hold companies accountable for their environmental impacts and work toward climate neutrality, but it did not necessarily reduce scope 3 emissions. Even this proved ineffective for governments: a directive was recently enforced on the CSRD to protect the European economy, because scope 3 reporting was so complex and labour-intensive that it put European corporations at a severe disadvantage against international competitors.","say":"The Omnibus narrowed the CSRD, it did not end it. Companies above a thousand employees still report, value chain included. And a rule that industry lobbied to escape is a rule that was binding.","detail":"The facts: the Commission's Omnibus proposal came in 2025; a stop-the-clock directive approved by the Council on 14 April 2025 delayed the second and third waves by two years; Directive (EU) 2026/470 was agreed on 9 December 2025 and entered into force on 18 March 2026, limiting mandatory scope to EU companies with over 1,000 employees and over 450 million euros turnover, with first application to financial years from 1 January 2027. Large companies keep reporting, including value chain data, with a cap on what they may demand from suppliers under 1,000 employees. So reporting continues for the firms that hold most of the tonnes. Two further points: the CSRD was never an emissions cap, the EU's cap is the ETS (OW07), so 'it did not reduce scope 3' attacks a tool for a job it was not given; and a rollback forced by lobbying shows where the power sits (CL2, A3). Nothing in this episode says anything about individuals doing more.","if_they_push":"Grant that the EU weakened a reporting rule under competitiveness pressure. Then ask what that shows about individual action. Nothing. It shows policy is contested because it bites.","comeback":"Ninety percent of companies dropped out of scope; a rule that covers a tenth of the firms it used to is a retreat whatever you call it.","weak":false,"tags":["csrd","corporate sustainability reporting directive","omnibus","eu","europe","scope 3 reporting","rolled back","scaled back","protect the european economy","competitiveness","labour-intensive","climate neutrality","disadvantage","cl2","f1"],"phrasings":["The European Union's Corporate Sustainability Reporting Directive (CSRD) was implemented in Europe to hold companies accountable for their environmental impacts and work towards Europe's goal to achieve climate neutrality, not necessarily resulting in a decrease in scope 3 emissions.","Even this proved to not be very effective for governments, as a directive was recently enforced on the CSRD to protect the European economy.","The reporting of scope 3 emissions was a very complex and labour-intensive process, putting European corporations at a severe disadvantage compared to international competitors who do not face the same strict regulations.","Even the EU had to walk back its own sustainability reporting rules."],"frames":["CL2","F1"],"uses":["OW07"],"notes":"Not in the fact-check pass's primary-source list; sources held from the wave 2 pass. Their draft is vague ('a directive was recently enforced'). Dates and thresholds rest on three secondary legal and advisory pages; the Official Journal text itself was not fetched. The February 2025 proposal date is not from a fetched page, so say 'in 2025'. A&O Shearman's 'around 90 percent' fewer entities is their estimate.","sources":[{"title":"Agreement on the CSRD/CS3D Omnibus Package: key changes and implications","publisher":"A&O Shearman","year":2025,"url":"https://www.aoshearman.com/en/insights/agreement-on-the-csrd-cs3d-omnibus-package-key-changes-and-implications","finding":"Trilogue deal 9 December 2025, Parliament plenary 16 December 2025; scope narrowed to EU undertakings with over 1,000 employees and net turnover of at least EUR 450 million, about 90 percent fewer entities; CSRD amendments apply to financial years from 1 January 2027; value chain information requests capped for entities under 1,000 employees; large companies remain in scope. Verified in the wave 2 pass, not refetched.","verified":true},{"title":"CSRD After the Omnibus Became Law: The New Waves, Thresholds and Timeline","publisher":"Spectreco","year":2026,"url":"https://www.spectreco.com/blog/csrd-omnibus-timeline-waves-thresholds-2026","finding":"Stop-the-clock approved by Council 14 April 2025 (two-year delay, no scope change); Directive (EU) 2026/470 adopted 24 February 2026, in force 18 March 2026, transposition by 19 March 2027; in-scope companies still complete their own disclosures including Scope 3 and supplier data. Verified in the wave 2 pass, not refetched.","verified":true},{"title":"CSRD under Omnibus: updated scope, timelines, and what companies should do in 2026","publisher":"Coolset","year":2026,"url":"https://www.coolset.com/academy/csrd-under-omnibus-updated-scope-timelines-and-what-companies-should-do-in-2026","finding":"Wave 1 remains unchanged and reported FY2024 in 2025; wave 2 first report moves two years; thresholds 1,000 employees and EUR 450m. Verified in the wave 2 pass, not refetched.","verified":true}],"their_sources":[],"routes":[{"type":"deny","say":"The Omnibus narrowed scope and delayed waves. It did not end reporting. The largest companies still report under the directive in force since March 2026."},{"type":"turn","say":"Industry fought to be released from the CSRD because it bound them. Lobbying is proof of where the power sits, and the power sits with the rule."},{"type":"reframe","say":"A reporting directive was never meant to cut tonnes on its own. The EU's cap is its carbon market, and that market has a measured record."},{"type":"fallacy","say":"A policy being weakened tells you nothing about individuals doing more. They have shown a policy fight, not an individual result."}]},{"id":"TC06","side":"for","kind":"argument","angle":"their case","strength":3,"title":"Jevons: transport emissions rose despite 30% better fuel economy","claim":"Jevons paradox means that increasing the efficiency of using a resource can increase total consumption rather than reduce it. According to a peer-reviewed Environment International paper, transportation emissions per capita and per household have continued to rise despite reductions in tailpipe emissions and a nearly 30% improvement in car fuel economy, because consumers want to travel more and own more household vehicles.","say":"Who drove more and bought the second car? Individuals. Their Jevons example is households spending an efficiency gain on more driving. Rebound is the individual leak, and the fix is a price, which is policy.","detail":"The paper is Song et al. 2019, a household footprint study for 1995 to 2014; the quoted sentence comes from the authors' article about it. It says fuel economy rose about 30 percent and transport emissions still rose because people travelled more and owned more vehicles. Every verb in that sentence belongs to individuals. Rebound is partial, not backfire: the standard review finds little evidence that efficiency gains are fully eaten (PL12). And the policy answer to rebound is to price the fuel: Sweden's carbon tax cut transport CO2 about 11 percent (OW08). Note too that the fuel economy gain they cite came in the period of tightened standards: EPA's trends report shows new-vehicle fuel economy up 41 percent since 2004. Read alongside PL12 and FP08.","if_they_push":"Agree that efficiency alone invites more use. That is the case for pairing standards with a carbon price and transit, all policy. A household that saves money also rebounds, and nothing holds its saving in place.","comeback":"Whoever drives the extra miles, the point stands: the efficiency mandate did not deliver its promised cut, so the mandate is weaker than it looks.","weak":false,"tags":["jevons","jevons paradox","rebound","efficiency","fuel economy","30%","30 percent","transportation emissions","environment international","per capita","per household","more vehicles","travel more","tailpipe","f2"],"phrasings":["A phenomenon known as Jevons paradox often occurs, which is when increasing the efficiency of using a resource can actually increase total consumption and its effects rather than reducing it.","According to the Environment International peer reviewed journal, transportation emissions (both per capita and per household) have continued to rise over time despite reductions in tailpipe emissions and nearly 30% improvement in fuel economy of cars.","This is due to consumers wanting to travel more and being more likely to own more household vehicles.","Efficiency standards backfire because people just drive more."],"frames":["F2"],"uses":["OW08"],"notes":"Their quote matches the authors' popular article, not the journal abstract; the abstract was refetched this pass, the article was not. 'Fuel economy gain came from standards' is our inference; the EPA highlights page credits mix and technology, not CAFE, so phrase it as 'the period of tightened standards' rather than a measured attribution. Their 'nearly 30%' is right as quoted from the authors' article.","sources":[{"title":"How household goods and activities drive up greenhouse gas emissions","publisher":"Green Building Advisor (The Conversation)","year":2019,"url":"https://www.greenbuildingadvisor.com/article/how-household-goods-and-activities-drive-up-greenhouse-gas-emissions","finding":"The rise is attributed to people wanting to travel more and owning more household vehicles, i.e. consumer behaviour. Verified in the wave 2 pass, not refetched.","verified":true},{"title":"Highlights of the Automotive Trends Report","publisher":"US EPA","year":2025,"url":"https://www.epa.gov/automotive-trends/highlights-automotive-trends-report","finding":"Model year 2024 new-vehicle real-world fuel economy a record 27.2 mpg, up 41 percent since model year 2004; page credits vehicle mix and technology including electrified vehicles, does not itself name the standards. Verified in the wave 2 pass, not refetched.","verified":true}],"their_sources":[{"title":"How household goods and activities drive up greenhouse gas emissions (Taiebat and Xu, summarising Song et al. 2019)","publisher":"Green Building Advisor, republished from The Conversation","year":2019,"url":"https://www.greenbuildingadvisor.com/article/how-household-goods-and-activities-drive-up-greenhouse-gas-emissions","finding":"Their sentence is here nearly verbatim: 'Transportation emissions, both per capita and per household, have continued to rise over time' despite 'nearly 30% improvement in fuel economy of cars in this period'; 'People want to travel more and are more likely to own more household vehicles.' Period 1995 to 2014; journal Environment International. Verified in the wave 2 pass, not refetched.","verified":true},{"title":"Scale, distribution and variations of global greenhouse gas emissions driven by U.S. households (Song, Qu, Taiebat, Liang, Xu)","publisher":"Environment International, via Semantic Scholar record","year":2019,"url":"https://api.semanticscholar.org/graph/v1/paper/DOI:10.1016/j.envint.2019.105137?fields=title,abstract,year,venue,authors","finding":"Abstract covers 1995 to 2014 US household footprints of 17.7 to 20.6 tCO2e per capita; the transport-versus-fuel-economy sentence is not in the abstract, it is in the authors' popular article. Refetched this pass.","verified":true}],"routes":[{"type":"turn","say":"The paper says emissions rose because people travelled more and bought more cars. Those are individual choices eating a policy gain. Their Jevons case indicts their lever."},{"type":"reframe","say":"Jevons is the argument for a fuel price. If efficiency alone invites more use, you tax the use. That is what Sweden did, and transport CO2 fell."},{"type":"deny","say":"Jevons paradox means total use rises above where it started. Their source shows a partial rebound in one period, not backfire, and reviews find little support for backfire."},{"type":"outweigh","say":"The fuel economy gain they cite came in the period of tightened standards. Without them the baseline would be worse and the extra driving would have cost more tonnes."}]},{"id":"TC07","side":"for","kind":"argument","angle":"their case","strength":2,"title":"One fifth of the US footprint is overseas","claim":"Policy is limited to emissions within the city, province or country, and does not account for emissions in other countries that consumers individually contribute to. Roughly one fifth of the total carbon footprint of US household consumption is overseas, from spending such as clothing and electronics, so a distinct portion of household emissions occurs in other countries up the supply chain.","say":"Those overseas tonnes are under a government too, just not ours. A foreign factory's emissions follow that country's power policy, and a border carbon price reac
