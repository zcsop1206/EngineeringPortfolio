,"verified":true},{"title":"Global Electricity Review 2025: The Big Picture","publisher":"Ember","year":2025,"url":"https://ember-energy.org/latest-insights/global-electricity-review-2025/the-big-picture/","finding":"Fetched: Australia solar share 18% in 2024, up from 7% in 2019.","verified":true}]},{"id":"MK05","side":"for","kind":"argument","angle":"markets","strength":3,"title":"Policy is only as good as individual uptake","claim":"Government can fund a heat pump scheme but only households can fit the heat pumps: the UK Boiler Upgrade Scheme missed its first-year target and the National Audit Office said it had underperformed, leaving the UK well off track for 600,000 installs a year by 2028. A policy with no individual action behind it has an impact of zero, so individual action is the binding constraint.","say":"Agreed, a voluntary voucher needs takers, which is why our best cases don't ask. Ontario shut its coal plants by law and power-sector emissions fell about 84 percent. No household uptake needed.","detail":"The NAO's March 2024 report said the Boiler Upgrade Scheme installed 18,900 heat pumps from May 2022 to December 2023 against 50,000 expected, that installations were less than half of projections, that demand and supply assumptions were optimistic, and that running and installation costs were the key obstacle. DESNZ had also delayed rebalancing gas and electricity prices, a policy lever. This is a failure of one voluntary design, not of policy as a class: DESNZ then raised the grant to 7,500 pounds and applications rose nearly 40 percent year on year, which is policy moving uptake. Standards, caps and closures bind whether or not anyone is enthusiastic: Ontario's Ending Coal for Cleaner Air Act (M1), where electricity-sector emissions fell from 32.9 to 5.4 megatonnes between 2005 and 2014, and the US Acid Rain Program, which cut power-plant SO2 96 percent with a cap on plants (OW04). Where people must act, policy can mandate, price or default.","if_they_push":"Low uptake of a rebate tells you to design a better policy, not to hand the problem to individuals who already declined. When the grant was raised, applications rose.","comeback":"The subsidy existed and individuals declined it, which proves that individual choice is what decides whether any policy has an effect.","weak":false,"tags":["boiler upgrade scheme","heat pump","uk","uptake","implementation","nao","underspend","household decisions","binding constraint","policy needs people","600000","f1","f2"],"phrasings":["Low uptake means the policy was badly designed, not that individuals matter more; mandates and regulation work without anyone's enthusiasm.","The scheme was undersubscribed because of installer shortages and running-cost rules the government set."],"frames":["F1","F2"],"uses":["M1","OW04"],"notes":"Corrected the source: the NAO findings are March 2024, now verified at the NAO page, and the BusinessGreen link dropped. Removed the '(Ontario)' parenthetical, cut the second number from the say, and added the grant-increase evidence that policy design moves uptake.","sources":[{"title":"Low heat pump uptake slowing progress on decarbonising home heating","publisher":"National Audit Office","year":2024,"url":"https://nao.org.uk/press-releases/low-heat-pump-uptake-slowing-progress-on-decarbonising-home-heating","finding":"Fetched this session (press release, 18 March 2024): 18,900 heat pumps installed May 2022 to Dec 2023 vs 50,000 expected; installations less than half of projections; government demand and supply assumptions optimistic; cost a key obstacle; target 600,000 a year by 2028; grant raised to 7,500 pounds, January 2024 applications up nearly 40%. Correction: the NAO report is 2024, not 2025.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG 32.9 Mt (2005) to 5.4 Mt (2014); coal banned by the Ending Coal for Cleaner Air Act, 2015 (canon M1).","verified":true}],"their_sources":[{"title":"'Slower than expected': National Audit Office raises alarm over heat pump rollout","publisher":"BusinessGreen","year":2025,"url":"https://businessgreen.com/news/4186094/slower-expected-national-audit-office-raises-alarm-heat-pump-rollout","finding":"Per search summary: NAO judged the scheme to have underperformed, leaving the UK off track for 600,000 heat pumps a year by 2028. Page not fetched; check NAO report for exact wording.","verified":false},{"title":"Boiler Upgrade Scheme only hits half its first year targets","publisher":"Homebuilding & Renovating","year":2023,"url":"https://www.homebuilding.co.uk/news/boiler-upgrade-scheme-only-hits-half-its-first-year-targets","finding":"Per search summary: scheme delivered about half its first-year target; Lords committee found low take-up and underspend. Page not fetched.","verified":false}]},{"id":"MK06","side":"for","kind":"argument","angle":"markets","strength":3,"title":"EV buyers made electric cars a mass market","claim":"Global electric car sales passed 17 million in 2024, over 20 percent of all new cars, and China's almost-half share came from consumers choosing the product. The first buyers of a $100,000 Roadster were individuals who paid a premium so the technology could reach scale; the market they created is now the main driver of battery demand.","say":"Buyers chose the cars, but China's purchase-tax exemption and Norway's tax rules built the market. Norway reached 88.9 percent electric with VAT exemptions, not volunteers.","detail":"IEA's 17 million electric cars in 2024 is accepted; we did not open the page this session. China's purchase-tax exemption on new-energy vehicles has been extended to the end of 2027, so the demand they cite was incentivised. Norway exempted EVs from 25 percent VAT and the registration tax while taxing fossil cars, and is now phasing the perks back (OW09). Same car, different result by grid: ICCT puts lifetime EV savings at 66 to 69 percent in Europe and 19 to 34 percent in India (FR04), so the buyer's choice is not the outcome. Check on the push line: Kelley Blue Book (Cox Automotive) data reported by electrive has US Q4 2025 EV sales down 36 percent, to 234,171 after the credit ended; we have not opened the source.","if_they_push":"Where the credit ended, uptake fell: the US federal credit expired on 30 September 2025 and fourth-quarter EV sales dropped about a third, per Cox Automotive. Premium buyers held up better, so grant them that the cars have a pull of their own.","comeback":"People bought EVs because they are now better and cheaper to run, and China's share kept climbing as the tax break phased down, so the product, not the subsidy, is doing the work.","weak":false,"tags":["ev","electric vehicles","tesla","early adopters","17 million","20 percent","iea","global ev outlook","china","consumer demand","battery","f2"],"phrasings":["China's EV boom is industrial policy, purchase tax exemptions and subsidies, not consumer taste.","Where there were no EV incentives, adoption stalled."],"frames":["F2"],"uses":["OW09","FR04"],"notes":"Say and numbers hold (88.9 percent verified). The old if_they_push, 'adoption stalled where incentives never existed', was unsupported; replaced with the US credit expiry, noted as a search-summary figure. IEA 17 million figure still not opened. Corrected detail after verification: 'Cox Automotive data in search summaries has US Q4 2025 EV sales down 36 percent' -> 'Kelley Blue Book (Cox Automotive) data reported by electrive has US Q4 2025 EV sales down 36 percent, to 234,171'.","sources":[{"title":"Global EV Outlook 2025: Executive summary","publisher":"International Energy Agency","year":2025,"url":"https://www.iea.org/reports/global-ev-outlook-2025/executive-summary","finding":"Electric car sales 'exceeded 17 million globally in 2024', share above 20%; China almost half of its car sales (over 11 million).","verified":true,"note":"Fetched IEA page. It does not mention China's purchase-tax exemption (and says Chinese incentives decreased in 2024), so the exemption claim needs a different source."},{"title":"China Extends NEV Tax Reduction and Exemption Policy to 2027","publisher":"China Briefing","year":2025,"url":"https://china-briefing.com/news/china-extends-nev-tax-reduction-and-exemption-policy-to-2027","finding":"China's NEV purchase-tax exemption extended to end of 2027 (full exemption capped per vehicle through 2025, halved 2026 to 2027).","verified":true},{"title":"Norway achieves 89 per cent EV share in 2024","publisher":"electrive (citing OFV)","year":2025,"url":"https://www.electrive.com/2025/01/02/norway-achieves-89-per-cent-ev-share-in-2024","finding":"88.9% of new cars electric in 2024. (ours.json OW09)","verified":true},{"title":"A global comparison of the life-cycle GHG emissions of combustion engine and electric passenger cars","publisher":"ICCT (Bieker)","year":2021,"url":"https://theicct.org/publication/a-global-comparison-of-the-life-cycle-greenhouse-gas-emissions-of-combustion-engine-and-electric-passenger-cars/","finding":"BEV lifetime emissions 66-69% lower (Europe), 19-34% (India). (ours.json FR04)","verified":true},{"title":"EV sales in the US plummet - as expected","publisher":"electrive (citing Cox Automotive)","year":2026,"url":"https://www.electrive.com/2026/01/14/ev-sales-in-the-us-plummet-as-expected","finding":"US Q4 2025 battery-EV sales fell 36% (365,830 to 234,171) per Kelley Blue Book; federal credit ended end of September 2025.","verified":"partial","note":"Fetched electrive. Source is Kelley Blue Book (a Cox Automotive brand). Tesla about 59% share not stated; article gives Tesla 46.2% for full-year 2025."}],"their_sources":[{"title":"Global EV Outlook 2025: Executive summary","publisher":"International Energy Agency","year":2025,"url":"https://www.iea.org/reports/global-ev-outlook-2025/executive-summary","finding":"Per search summary: over 17 million electric cars sold in 2024, more than 20% of global sales; China almost half of its car sales with 11 million-plus. Page not fetched directly.","verified":false}]},{"id":"MK07","side":"for","kind":"argument","angle":"markets","strength":3,"title":"Ostrom showed local users govern commons best","claim":"Elinor Ostrom won the 2009 Nobel in economics for showing that communities of ordinary users build durable rules that sustain forests, fisheries and irrigation without a central regulator or privatisation. Her polycentric governance finding means the unit that matters is the local group of people acting, with government as one layer rather than the engine.","say":"Ostrom's groups survive on monitoring and sanctions, and her principles include outside authorities recognising their right to organise. The atmosphere has no local group to do either.","detail":"Ostrom's design principles include user monitoring, graduated sanctions, nested enterprises and minimal recognition by external authorities of the right to organise (principle seven in most summaries). So her own work says self-governing groups work when rules bind and a higher authority leaves them room. Cox and colleagues' review of 91 studies supports the principles only probabilistically. A forest or irrigation system has identifiable users; the atmosphere has none, so the enforcing layer must be larger (FR03). Expect the push that Ostrom herself argued for a polycentric approach to climate, many scales instead of one treaty (from memory, not verified). Agree that there are many layers, and note that cities, provinces and national law are among them. Under F3 a village rule is government at small scale, but a judge may not accept that stretch, so lead with the atmosphere point.","if_they_push":"Polycentric means many layers of rules including the top one, and the top one is the part individuals cannot supply.","comeback":"Ostrom showed ordinary users make and enforce their own rules without a state, and she argued the same polycentric logic applies to climate, so the unit that matters is the group.","weak":true,"tags":["ostrom","commons","polycentric","governing the commons","nobel 2009","community forests","local governance","bottom-up","design principles","tragedy of the commons","self-governance","f2","f3"],"phrasings":["Ostrom's cases are small local commons; climate is a global atmosphere with no excludable users.","Ostrom herself said polycentric systems need nested, state-backed rules and enforcement."],"frames":["F2","F3"],"uses":["FR03"],"notes":"Dropped the claim 'that is policy at local scale', which is contestable since Ostrom's rules are communal, and replaced 'government recognition' with 'outside authorities', which is closer to principle seven. The Nobel and Cox sources remain search-summary only. Best argument is the atmosphere has no excludable users.","sources":[{"title":"Ostrom's eight commons governance design principles","publisher":"P2P Foundation wiki (summarising Ostrom 1990)","year":2020,"url":"https://wiki.p2pfoundation.net/Elinor_Ostrom%E2%80%99s_Eight_Commons_Governance_Design_Principles","finding":"Principles include monitoring by users or accountable monitors, graduated sanctions, recognition of the right to organise by government, and nested enterprises. Several summaries agree; the book itself was not opened.","verified":true},{"title":"A review of design principles for community-based natural resource management","publisher":"Ecology and Society (Cox, Arnold & Villamayor Tomas)","year":2010,"url":"https://www.ecologyandsociety.org/vol15/iss4/art38/","finding":"Cox, Arnold and Villamayor Tomas 2010: reviewed 91 studies; principles well supported empirically, probabilistic not deterministic reading.","verified":"partial","note":"Landing page and PDF fetched but abstract unreadable (frameset and compressed). 91 studies and probabilistic reading from WebSearch excerpts and commentary."}],"their_sources":[{"title":"Elinor Ostrom - Facts","publisher":"Nobel Prize","year":2009,"url":"https://www.nobelprize.org/prizes/economic-sciences/2009/ostrom/facts/","finding":"Official Nobel page for the 2009 prize in economic sciences shared with Oliver Williamson; fetch returned 403, confirmed only through search summaries.","verified":false},{"title":"Polycentric systems and forested social-ecological systems (Nagendra and Ostrom)","publisher":"Ecology and Society","year":2012,"url":"https://doaj.org/article/b644eda5b5f6421390289fb2f281a3a3","finding":"Per search summary: polycentric institutions help sustain diverse forested social-ecological systems. Listing page only.","verified":false}]},{"id":"MK08","side":"for","kind":"argument","angle":"markets","strength":3,"title":"Private land trusts outrun parks agencies","claim":"American land trusts have voluntarily conserved about 61 million acres of private land, an increase of more than 15 million acres since 2010, more than all the national parks combined. Doug and Kris Tompkins bought and rewilded roughly 14 to 15 million acres in Chile and Argentina and then donated it to become national parks, the largest private land donation in history.","say":"Land trusts are real, and many lean on the federal easement tax deduction. The Tompkins land was handed to the state to become parks. Under Brazil's enforcement plan, Amazon clearing fell 84 percent.","detail":"Land Trust Alliance reports 61 million acres conserved by end of 2020; accepted, though their line that this exceeds all national parks combined looks wrong: the National Park Service manages roughly 85 million acres (not verified here). A donated perpetual conservation easement can be deducted from federal income tax under section 170(h), and search summaries say the enhanced deduction was made permanent in 2015; we could not find what share of land-trust acres relies on it, so we say 'many', not 'much'. Tompkins's land became national parks, so the protection is state park status, and the Chilean state had to accept the donation. For scale and measured effect, Brazil's enforcement plan coincided with Legal Amazon clearing falling from 27,772 to 4,571 square kilometres 2004 to 2012 (OW12); attribution is partly confounded by commodity prices and exchange rates, so we say under, not only because.","if_they_push":"Conserved acres are a stock; policy is what keeps them conserved after the donor is gone, by law.","comeback":"Donors, not the tax code, chose to give up the land, and a land trust protects an acre for good with a legal easement and no agency required.","weak":false,"tags":["land trust","conservation","61 million acres","tompkins","rewilding","patagonia","private land","national parks","donation","voluntary","biodiversity","f2"],"phrasings":["Land trusts rely on government tax deductions and conservation easement incentives.","Tompkins land was handed to the state, so state park status did the protecting."],"frames":["F2"],"uses":["OW12"],"notes":"Removed 'enforcement alone' from the say, which overclaimed given the commodity-price confound, and 'much of it' became 'many lean on'. Flagged that the For claim of more than all national parks combined looks false (NPS about 85 million acres). Tompkins and LTA figures remain search-summary only.","sources":[{"title":"61 million acres voluntarily conserved in America: 2020 National Land Trust Census","publisher":"Land Trust Alliance","year":2021,"url":"https://landtrustalliance.org/newsroom/press-releases/61-million-acres-voluntarily-conserved-in-america-2020-national-land-trust-census-report-reveals","finding":"61 million acres conserved by land trusts by end of 2020. Confirmed via search summary.","verified":true},{"title":"26 U.S. Code 170 (charitable deduction, subsection (h) conservation easements)","publisher":"Legal Information Institute, Cornell","year":2024,"url":"https://www.law.cornell.edu/uscode/text/26/170","finding":"Section 170(b)(1)(E) gives qualified conservation contributions a 50% limit with 15-year carryforward, farmers 100%; permanent since the PATH Act 2015 (secondary).","verified":"partial","note":"Fetched Cornell LII; saw the (b)(1)(E) conservation provisions, but subsection (h) text was in a truncated portion. Permanence confirmed only by secondary sources (CPA Practice Advisor, Kahn Litwin, Forest Society)."},{"title":"How an unprecedented gift built a legacy of conservation in Patagonia","publisher":"National Geographic","year":2020,"url":"https://www.nationalgeographic.com/magazine/2020/05/how-an-unprecedented-gift-built-a-legacy-of-conservation-in-patagonia-feature.html","finding":"Tompkins land became national parks (Pumalin; March 2019 deal: 1 million acres of Tompkins land with 10 million of government land, five new parks).","verified":true,"note":"Fetched NatGeo. 'Largest private land donation' not stated in the fetched text; only that such a donation was unusual."},{"title":"PPCDAm and Amazon deforestation 2004-2012 (INPE data)","publisher":"Climate Policy Initiative / INPE","year":2021,"url":"https://www.climatepolicyinitiative.org/id/?p=34486","finding":"Legal Amazon deforestation fell from 27,772 km2 (2004) to 4,571 km2 (2012). Commodity prices also played a part (West & Fearnside 2021).","verified":true}],"their_sources":[{"title":"61 million acres voluntarily conserved in America: 2020 National Land Trust Census","publisher":"Land Trust Alliance","year":2021,"url":"https://landtrustalliance.org/newsroom/press-releases/61-million-acres-voluntarily-conserved-in-america-2020-national-land-trust-census-report-reveals","finding":"Per search summary: 61 million acres conserved by land trusts by end of 2020, up more than 15 million since 2010. Fetch returned 403; confirmed via search.","verified":true},{"title":"How an unprecedented gift built a legacy of conservation in Patagonia","publisher":"National Geographic","year":2020,"url":"https://www.nationalgeographic.com/magazine/2020/05/how-an-unprecedented-gift-built-a-legacy-of-conservation-in-patagonia-feature.html","finding":"Per search summary: Tompkins land helped create national parks; acreage ranges 14.2 to 14.8 million depending on source; the 2019 handover was described as the largest private land donation. Page not fetched.","verified":false}]},{"id":"MK10","side":"for","kind":"argument","angle":"markets","strength":2,"title":"Divestment moved $39 trillion of pledges","claim":"By October 2021 some 1,485 institutions with $39.2 trillion in assets had committed to divest from fossil fuels, a movement that began with student activists. The Oxford Smith School called stigmatisation, not the selling itself, the real threat to fossil fuel companies: individuals reshaped what a respectable portfolio looks like.","say":"Pledges are not emissions cuts. Berk and van Binsbergen find divestment moves the cost of capital by under half a basis point, because someone else buys the shares.","detail":"Stand.earth's $39.2 trillion is the total assets of institutions that pledged some form of divestment, not money moved. Berk and van Binsbergen, in the Journal of Financial Economics, estimate about 0.44 basis points at current implementation (an earlier draft said 0.35, and a Stanford interview quotes a larger 8 basis points under another estimate that the authors still judged too small to matter), and found no detectable effect from index entries and exits. They say socially responsible investors would need to account for over 80 percent of the market for divestment to have a significant effect. Oxford's Smith School itself says direct share-price impact is limited and locates the threat in stigma. We concede stigma; Oxford offers no measure of it, and a company is hurt by stigma only when it shows up in prices, laws or customers.","if_they_push":"The authors say direct investment in primary markets, or using voting rights to engage companies, has much greater impact than selling. That is governance by large holders, not a personal choice.","comeback":"Divestment is about stigma and signalling, which Oxford itself says is the real threat, and a movement that shifted 39 trillion dollars of pledges has changed what respectable investors do.","weak":false,"tags":["divestment","fossil free","39 trillion","stand.earth","stigma","oxford","ansar","pension funds","students","investors","stranded assets","f1"],"phrasings":["Berk and van Binsbergen estimate divestment changes the cost of capital by well under a basis point; someone else just buys the shares.","Pledges are not emissions cuts, and $39 trillion is total AUM of signatories, not money moved."],"frames":["F1"],"uses":[],"notes":"Number and source verified against the Harvard forum summary. Replaced the 'more than 1 percent' threshold, which no summary states, with the quoted 'over 80 percent of the market', and tightened if_they_push so it addresses the shareholder-engagement rejoinder.","sources":[{"title":"The Impact of Impact Investing","publisher":"Journal of Financial Economics (Berk & van Binsbergen)","year":2025,"url":"https://papers.ssrn.com/abstract=3909166","finding":"Harvard Corporate Governance forum summary fetched this session: divestment at current levels changes the cost of capital by 'only 0.44 basis points'; over 80% of the market would have to be socially responsible for a significant effect; authors favour direct investment in primary markets and engagement via voting rights. Full text not opened.","verified":true},{"title":"1,485 institutions with assets over $39.2 trillion have committed to divest from fossil fuels","publisher":"Stand.earth","year":2021,"url":"https://stand.earth/insights/1485-institutions-with-assets-over-39-2-trillion-have-committed-to-divest-from-fossil-fuels/","finding":"Pledges of some form of divestment, total assets of signatories; not money moved.","verified":true},{"title":"Stranded assets and the fossil fuel divestment campaign","publisher":"Smith School, University of Oxford","year":2013,"url":"https://ora.ox.ac.uk/objects/uuid:f04181bc-8c4f-4cc1-8f01-cafce57975ae","finding":"ORA abstract only says the report tests whether divestment could affect fossil assets; Commons Library summary: authors argue a direct effect on valuations is unlikely.","verified":"partial","note":"ORA record has no findings. Limited-direct-effect claim from Commons Library secondary; stigma as the greater threat not confirmed (report has a stigmatisation section). Full PDF at smithschool.ox.ac.uk not opened."}],"their_sources":[{"title":"1,485 institutions with assets over $39.2 trillion have committed to divest from fossil fuels","publisher":"Stand.earth","year":2021,"url":"https://stand.earth/insights/1485-institutions-with-assets-over-39-2-trillion-have-committed-to-divest-from-fossil-fuels/","finding":"Per search summary: 1,485 institutions, $39.2 trillion in assets committed to some form of fossil divestment (pledges, not completed divestments). Fetch returned 403.","verified":true},{"title":"Stranded assets and the fossil fuel divestment campaign","publisher":"Smith School, University of Oxford","year":2013,"url":"https://ora.ox.ac.uk/objects/uuid:f04181bc-8c4f-4cc1-8f01-cafce57975ae","finding":"Per search summary: direct impact on share prices limited; stigmatisation is the greater threat to fossil fuel companies. Repository record only.","verified":false}]},{"id":"MK11","side":"for","kind":"argument","angle":"markets","strength":2,"title":"Citizen scientists supply the biodiversity data","claim":"Citizen science platforms are the backbone of conservation data: eBird alone makes up more than 40 percent of the biodiversity records in the Global Biodiversity Information Facility, all supplied by volunteers. Policy cannot protect what has not been counted, and individuals do the counting.","say":"Counting birds is not cutting emissions. Citizen data is an input; what changes the environment is the protected-area decision or the rule that uses it. We concede the data and ask what happened after.","detail":"eBird is the largest single dataset in GBIF (about 561 million of roughly 1.3 billion occurrences in 2019, our own arithmetic, about 43 percent); we have no publisher statement of the share. The motion asks which has more impact on the environment. Monitoring tells you what to protect, it does not protect it. Measured protection in our cases came from enforcement: Brazil's clearing fell 84 percent after a state plan built on satellite monitoring (OW12), and bald eagles went from 417 nesting pairs in 1963 to over 71,000 after the DDT ban and decades of legal protection, though the counting method changed (OW16).","if_they_push":"If birders' records feed government decisions, the impact is realised through the decision, which is F3 again.","comeback":"Policy cannot protect what has not been counted, and it was volunteer bird counts that revealed the DDT declines in the first place.","weak":false,"tags":["ebird","inaturalist","citizen science","gbif","biodiversity data","volunteers","monitoring","conservation","observations","cornell","evidence base","f1","f3"],"phrasings":["Counting birds is not cutting emissions; data without regulation changes nothing.","Citizen data feeds government protected-area decisions, so policy still does the work."],"frames":["F1","F3"],"uses":["OW12","OW16"],"notes":"Say contains no number and concedes the 40 percent eBird figure. Added that the eagle count mixes methods and credits law as well as the DDT ban. The eBird figure itself is search-summary only. Corrected detail after verification: 'eBird is reported to make up more than 40 percent of GBIF biodiversity records; accepted, though only a search summary supports it.' -> 'eBird is the largest single dataset in GBIF (about 561 million of roughly 1.3 billion occurrences in 2019, our own arithmetic, about 43 percent); we have no publisher statement of the share.'.","sources":[{"title":"eBird 2019 - Year in review","publisher":"Cornell Lab of Ornithology (eBird)","year":2019,"url":"https://ebird.org/canada/news/ebird-2019-year-in-review","finding":"Not found: no source states eBird is more than 40% of GBIF. GBIF news: 2019 eBird 561M occurrences vs about 1.3bn in GBIF (about 43%, our arithmetic).","verified":false,"note":"eBird page behind a bot check. Card already hedges; safer wording given."},{"title":"PPCDAm and Amazon deforestation 2004-2012 (INPE data)","publisher":"Climate Policy Initiative / INPE","year":2021,"url":"https://www.climatepolicyinitiative.org/id/?p=34486","finding":"Legal Amazon deforestation fell from 27,772 km2 (2004) to 4,571 km2 (2012). Commodity prices also played a part (West & Fearnside 2021).","verified":true}],"their_sources":[{"title":"eBird 2019 - Year in review","publisher":"Cornell Lab of Ornithology (eBird)","year":2019,"url":"https://ebird.org/canada/news/ebird-2019-year-in-review","finding":"Per search summary: eBird contributions make up more than 40% of GBIF biodiversity data. Page not fetched; I could not verify per-year observation counts or any iNaturalist totals.","verified":false}]},{"id":"MK12","side":"for","kind":"argument","angle":"markets","strength":2,"title":"Germans own the energy transition themselves","claim":"Bürgerenergie, citizen-owned energy, meant that about 51 percent of Germany's renewable capacity in 2010 was owned by farmers and private individuals, and roughly a third of installed capacity was still privately owned in 2019, with solar PV about 48 percent privately owned. Germany's transition was financed on kitchen tables and in village co-operatives, not by utilities.","say":"Citizens invested because the EEG law guaranteed fixed payments. Clean Energy Wire reports their share then fell to about a third as the system moved to auctions. The law, not kitchen tables, set the terms.","detail":"The EEG took effect on 1 April 2000 with grid access, priority dispatch and a 20-year tariff (OW14). Clean Energy Wire reports citizen-generated energy fell to about a third by 2021 as payments expired and the 2014 reform replaced tariffs with auctions. Aurora argues industry professionalisation also squeezed small players, so the cause is mixed; we say the policy built it and the policy change coincided with the decline. Citizen ownership is who held the asset, which says nothing about why the asset was built.","if_they_push":"Ownership by citizens is a financing detail; the guaranteed return is the reason there was anything to own.","comeback":"The law offered a return to everyone, but it was farmers and families who took it up and built the capacity, and the state would not have built it by itself.","weak":false,"tags":["germany","burgerenergie","citizen energy","cooperatives","community energy","energiewende","51 percent","private owners","farmers","solar","trend research","f2"],"phrasings":["The Energiewende was built on the EEG feed-in tariff, a law; citizens only invested because the law guaranteed returns.","Your own sources show the citizen share falling to a third as big investors took over."],"frames":["F2"],"uses":["OW14"],"notes":"Clean Energy Wire and EEG sources are verified and support the say; the one number (about a third) is backed. The detail already hedges that professionalisation also squeezed small players. Left unchanged.","sources":[{"title":"Share of citizen energy projects declines as funding runs out and big investors take over","publisher":"Clean Energy Wire","year":2021,"url":"https://www.cleanenergywire.org/news/share-citizen-energy-projects-decline-funding-runs-out-and-big-investors-take-over","finding":"Citizen-generated share fell to about a third by early 2021; EEG's 20-year fixed payments underpinned early citizen projects and began expiring; 2014 reform moved from feed-in tariffs to auctions; Aurora argues industry professionalisation is also a cause.","verified":true},{"title":"German Renewable Energy Sources Act","publisher":"Wikipedia","year":2024,"url":"https://en.wikipedia.org/wiki/German_Renewable_Energy_Sources_Act","finding":"EEG in force 1 April 2000; guaranteed connection, priority dispatch, 20-year tariff.","verified":true}],"their_sources":[{"title":"Share of private individuals involved in renewables production falls in Germany","publisher":"Clean Energy Wire","year":2021,"url":"https://www.cleanenergywire.org/news/share-private-individuals-involved-renewables-production-falls-germany","finding":"Per search summary: trend:research for AEE found almost one third of capacity privately owned in 2019; solar PV about 48%; share is falling. Page not fetched.","verified":false},{"title":"Citizens own half of German renewables","publisher":"Energy Transition (Heinrich Boell Foundation)","year":2013,"url":"https://energytransition.org/2013/10/citizens-own-half-of-german-renewables/","finding":"Per search summary: about 51% of >50,000 MW owned by farmers and individuals in 2010; the article itself questions how Bürgerenergie is defined. Page not fetched.","verified":false}]},{"id":"MK13","side":"for","kind":"argument","angle":"markets","strength":1,"title":"Entrepreneurs like Musk beat governments","claim":"One company, Tesla, did more to move the global car industry toward electric than any single national EV programme, and SpaceX-style private risk-taking shows individual founders can out-deliver agencies. The argument is that individual ambition, not committees, produces step changes.","say":"Tesla grew on a $465 million Department of Energy loan and on regulatory credits that rules created. China's purchase-tax exemption built the biggest EV market, not one firm. Tesla worked inside policy, not above it.","detail":"The loan came through the DOE's Advanced Technology Vehicle Manufacturing program and was repaid in May 2013; an analyst noted then that Tesla also receives state regulatory credits. We concede Tesla repaid early and was a real innovator. Do not say Tesla still gets federal purchase tax credits: the US 7,500 dollar credit ended on 30 September 2025. The remaining claim, that Musk did more than any national programme, is an assertion with no source in their file, and IEA's EV Outlook does not attribute the market to one person. China's NEV purchase-tax exemption has run through 2025 and is extended to 2027 at half the cap. Expect: Tesla still held about 59 percent of US EV sales in Q4 2025 after the credit ended (search summary).","if_they_push":"Even granting Tesla led, it led in markets that loans, credits and mandates created, and a loan repaid is still a loan that was offered first.","comeback":"Governments gave loans to many firms, but only Tesla turned one into a mass-market electric car, and it kept selling after the US credit ended.","weak":false,"tags":["musk","tesla","entrepreneur","founder","innovation","ev","private sector","step change","disruption","individual","great man","f2"],"phrasings":["Tesla relied on a $465 million DOE loan, zero-emission vehicle credits and EV tax credits.","BYD and Chinese state policy, not Tesla, account for most EVs."],"frames":["F2"],"uses":["OW09"],"notes":"Removed 'still gets tax credits', which is stale since the federal credit ended in September 2025, and substituted regulatory credits. Added the repaid-loan and post-credit sales pushback. Weak ground for the side but the remaining claim is genuinely unsourced.","sources":[{"title":"Tesla pays back $465M DOE loan, Musk says 'I hope we did you proud'","publisher":"Autoblog","year":2013,"url":"https://www.autoblog.com/2013/05/22/tesla-pays-back-465m-doe-loan-early/","finding":"$465 million loan awarded in 2010 under the DOE Advanced Technology Vehicle Manufacturing program, repaid in May 2013; an analyst notes Tesla still receives tax credits and state regulatory credits.","verified":true},{"title":"China Extends NEV Tax Reduction and Exemption Policy to 2027","publisher":"China Briefing","year":2025,"url":"https://china-briefing.com/news/china-extends-nev-tax-reduction-and-exemption-policy-to-2027","finding":"China's NEV purchase-tax exemption extended to end of 2027 (full exemption capped per vehicle through 2025, halved 2026 to 2027).","verified":true},{"title":"Global EV Outlook 2025: Executive summary","publisher":"International Energy Agency","year":2025,"url":"https://www.iea.org/reports/global-ev-outlook-2025/executive-summary","finding":"Electric car sales 'exceeded 17 million globally in 2024', share above 20%.","verified":true,"note":"Fetched IEA page. It does not attribute the market to one firm; the China incentive claim is not on this page."}],"their_sources":[{"title":"Global EV Outlook 2025: Executive summary","publisher":"International Energy Agency","year":2025,"url":"https://www.iea.org/reports/global-ev-outlook-2025/executive-summary","finding":"Shows scale of the EV market (17 million sales in 2024) but does not attribute it to any individual; the 'Musk did more than governments' claim is an unverified assertion, and Tesla received US loans and tax credits.","verified":false}]},{"id":"MK14","side":"for","kind":"argument","angle":"markets","strength":1,"title":"Carbon offsets let individuals fix it","claim":"Voluntary carbon markets let any individual pay to fund a tonne of avoided emissions today, without waiting for legislation. Even critics accept the principle that private payments can finance conservation; the live question is quality control, which the market can fix with better standards.","say":"Even the best study of these credits cuts against them. West et al. in Science found most expected credits came from projects that barely reduced deforestation. Capped compliance markets, set by law, do work.","detail":"West and colleagues studied 18 REDD+ projects in five countries and found about 68 percent of the 89 million credits expected by 2020 came from projects that barely reduced deforestation, if at all, with only about 6 percent tied to additional reductions in press coverage. Verra and Mitchard's group dispute the method and the comparison sites, which we should say before they do     catch (err) { aiFailed(err, 'Haiku'); }
  };
  el('exportBtn').onclick = () => { const out = el('exportOut'); out.hidden = false; out.textContent = JSON.stringify({session: S.session, exported: new Date().toISOString(), events: [...S.events.values()]}, null, 1); };
  el('clearLocal').onclick = () => { LS.del('rb:ev:' + S.session); LS.del('rb:out:' + S.session); S.events = new Map(); S.outbox = []; render(); toast('Local copy cleared'); };
}

// ───────────────────────── wiring ─────────────────────────
function wire() {
  el('nameInput').addEventListener('change', e => { S.name = e.target.value.trim().slice(0, 24); LS.set('rb:name', S.name); });
  el('logForm').addEventListener('submit', e => { e.preventDefault(); const ta = el('logText'); const text = ta.value.trim(); if (!text) return; const p = emit({k: 'point', text}); ta.value = ''; rerankPoint({id: p.id, text: p.text}); });
  el('logText').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el('logForm').requestSubmit(); } });
  el('settingsBtn').onclick = openDrawer;
  document.querySelectorAll('.tabs [role=tab]').forEach(b => b.onclick = () => { S.view = b.dataset.view; renderViews(); });
  document.querySelectorAll('nav.bottom [role=tab]').forEach(b => b.onclick = () => { S.mview = b.dataset.mview; renderViews(); });
  el('q').addEventListener('input', e => { S.q = e.target.value; renderBoard(); });
  document.querySelectorAll('#sideSeg button').forEach(b => b.onclick = () => { S.side = b.dataset.side; document.querySelectorAll('#sideSeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderBoard(); });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-toggle],[data-rerank],[data-pin],[data-more],[data-att],[data-del],[data-delatt],[data-copy],[data-build],[data-role],[data-research],[data-askresearch],[data-rcheck],[data-gapflag],[data-addbeat],[data-mv],[data-rm],[data-swap],[data-applyprop]');
    if (!t) return; const d = t.dataset; const {points} = derive(); const find = id => points.find(x => x.id === id);
    if (d.toggle) { const inBoard = !!t.closest('#board'); const key = inBoard ? 'b:' + d.toggle : (t.closest('.point') ? t.closest('.point').dataset.pid + ':' + d.toggle : 'b:' + d.toggle); S.open.has(key) ? S.open.delete(key) : S.open.add(key); inBoard ? renderBoard() : renderLog(); }
    else if (d.rerank) { const p = find(d.rerank); if (p) rerankPoint(p); }
    else if (d.pin) emit({k: 'pin', pid: d.pin, cid: d.cid});
    else if (d.more) { S.openPts.has(d.more) ? S.openPts.delete(d.more) : S.openPts.add(d.more); renderLog(); }
    else if (d.att) { S.attOpen.has(d.att) ? S.attOpen.delete(d.att) : S.attOpen.add(d.att); renderLog(); renderStrategy(); const f = document.querySelector(`form[data-attach="${d.att}"] input`); if (f) f.focus(); }
    else if (d.del) { if (d.confirm) emit({k: 'del', pid: d.del}); else { d.confirm = '1'; t.textContent = 'Remove for everyone?'; setTimeout(() => { if (t.isConnected) { delete d.confirm; t.textContent = 'Remove'; } }, 3000); } }
    else if (d.delatt) emit({k: 'del', aid: d.delatt});
    else if (d.copy) copyText(outlineText(d.copy));
    else if (d.build) buildOutline(d.build);
    else if (d.role) emit({k: 'tag', pid: d.role, role: d.r});
    else if (d.research) { const p = find(d.research); if (p) researchPoint(p); }
    else if (d.askresearch) { emit({k: 'ask', what: 'research', pid: d.askresearch}); toast('Asked ' + S.ai.via + "'s device to research it."); }
    else if (d.rcheck) emit({k: 'rcheck', pid: d.rcheck, ok: d.ok === '1'});
    else if (d.gapflag) emit({k: 'gapflag', pid: d.gapflag, on: d.on === '1'});
    else if (d.addbeat) { const p = find(d.addbeat); if (p) editOutline('rebuttal', o => { if (o.some(b => b.pid === p.id)) return o; o.push({pid: p.id, ids: chosenFor(p).slice(0, 1)}); return o; }); }
    else if (d.mv) { const [type, i, dir] = d.mv.split(':'); const a = +i, b = a + (+dir); editOutline(type, o => { if (b < 0 || b >= o.length) return o; [o[a], o[b]] = [o[b], o[a]]; return o; }); }
    else if (d.rm) { const [type, i] = d.rm.split(':'); editOutline(type, o => { o.splice(+i, 1); return o; }); }
    else if (d.swap) { const [type, i] = d.swap.split(':'); editOutline(type, o => { const b = o[+i]; const p = b && b.pid ? find(b.pid) : null; if (!p) return o; const alt = chosenFor(p); const cur = alt.indexOf(b.ids[0]); b.ids = [alt[(cur + 1) % alt.length]]; return o; }); }
    else if (d.applyprop) { const pr = latestProposal(); if (pr) applyProposal(pr); }
  });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-toggle]')) { e.preventDefault(); e.target.click(); } });
  document.addEventListener('submit', e => { const f = e.target.closest('form[data-attach]'); if (!f) return; e.preventDefault(); const text = f.text.value.trim(), url = f.url.value.trim(); if (!text && !url) return; S.attOpen.delete(f.dataset.attach); emit({k: 'attach', pid: f.dataset.attach, text: text || url, url: /^https?:\/\//i.test(url) ? url : ''}); });
  window.addEventListener('hashchange', () => { const h = sessionFromHash(); if (h && h !== S.session) setSession(h, true); });
  matchMedia('(max-width:860px)').addEventListener('change', renderViews);
  setInterval(renderLog, 60000);
}

// ───────────────────────── boot ─────────────────────────
pickSession(); loadMirror(); wire(); renderName(); render();
initSync(); initAI();
})();
</script>
