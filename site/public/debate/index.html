here in searches.","verified":false,"note":"Page returns a fragment only; search found no 22.6%. Collective target was at least 5% below 1990 for 2008 to 2012. Card already says do not say it aloud; keep that."},{"title":"Compliance of Parties with the Kyoto Protocol in the first period (2008-2012)","publisher":"I4CE (Shishlov, Morel, Bellassen)","year":2016,"url":"https://i4ce.org/?p=13508","finding":"Only nine of 36 fully participating countries exceeded their commitment domestically; after flexibility mechanisms all were in compliance; surplus allowances and land use explain much of the overachievement. Seen via search summary.","verified":true},{"title":"Canada cuts CO2 emissions, but misses target","publisher":"Phys.org (AFP)","year":2012,"url":"https://phys.org/news/2012-04-canada-co2-emissions.html","finding":"Canada 17.5 percent above 1990 (692 Mt in 2010) against a 6 percent cut promise.","verified":true}],"their_sources":[{"title":"Canada cuts CO2 emissions, but misses target","publisher":"Phys.org (AFP)","year":2012,"url":"https://phys.org/news/2012-04-canada-co2-emissions.html","finding":"Emissions 17.5 percent above 1990 levels (692 Mt in 2010) against a Kyoto commitment of 6 percent below 1990 by 2012.","verified":true},{"title":"Canada quits Kyoto climate protocol","publisher":"Al Jazeera","year":2011,"url":"https://www.aljazeera.com/news/2011/12/13/canada-quits-kyoto-climate-protocol","finding":"Environment Minister Peter Kent announced Canada's withdrawal on 12 Dec 2011; first country to formally withdraw (not fetched directly; confirmed via search results).","verified":false}],"routes":[{"type":"reframe","say":"Canada never delivered the policy, then walked out. That is policy absent, not policy failing, and participation was a political choice."},{"type":"outweigh","say":"Concede Kyoto's loopholes. The Montreal Protocol bound every country, held for decades and removed about 99 percent of controlled substances (M2)."},{"type":"turn","say":"Where the rule bound and the country stayed in, parties ended compliant. Where a government opted out, emissions rose. Their example shows policy is the variable."},{"type":"fallacy","say":"A government ignoring a treaty does not show treaties cannot move emissions, only that this one was not enforced. A law unenforced is not a law tested."}]},{"id":"PL06","side":"for","kind":"argument","angle":"movements","strength":4,"title":"Individuals sue and force governments to act","claim":"Policy itself changed because individuals went to court. Urgenda, a citizens' foundation, won at the Dutch Supreme Court in December 2019 forcing a 25 percent cut by end of 2020; Montana youth won Held v. Montana, upheld 6-1 on 18 December 2024; and the ECHR Grand Chamber held on 9 April 2024 that Switzerland violated its duties after a group of older women sued. Citizens are the enforcement mechanism for government policy.","say":"A court order is government acting, so the impact is policy's. Urgenda won an order against the Dutch state; the remedy was state policy. In KlimaSeniorinnen the association won and the four individual applicants were thrown out.","detail":"Urgenda is a foundation, not an individual, and the Dutch Supreme Court (20 December 2019) ordered the state to cut at least 25 percent below 1990 by the end of 2020, leaving the measures to the state (IDEA). In KlimaSeniorinnen (9 April 2024) the Grand Chamber found Switzerland violated Article 8 and Article 6(1), the latter on access to court; the association had standing and the four individual applicants were inadmissible for lack of victim status. Held v. Montana, 18 December 2024, 6 to 1 (Justice Rice dissenting on standing), struck down a statutory bar on considering greenhouse gases in permitting, which is a rule changing a rule and does not itself cut a tonne. Litigation is the route; the output is a policy (F3).","if_they_push":"If they say individuals brought the cases: yes, and what changed the environment was the order on the state, so the tonnes are policy's (F3). The successful litigants were organisations; the private individuals lost on standing in Europe. A lawsuit that wins is a mechanism for making governments act; citizens enforcing policy is our side of the motion.","comeback":"A lawsuit is one citizen forcing a whole government to act, the clearest case of individual action beating policy.","weak":false,"tags":["urgenda","held v montana","klimaseniorinnen","echr","litigation","youth","courts","citizens","supreme court","25 percent","human rights","standing","f3"],"phrasings":["A court order is government action; that is policy winning.","Held applies only to Montana's permitting statute and does not cut emissions directly.","Urgenda was a foundation, and the four KlimaSeniorinnen individuals lost."],"frames":["F3"],"uses":[],"notes":"All three case facts confirmed (Urgenda 25 percent; Held 6-1 on 18 Dec 2024; KlimaSeniorinnen individuals inadmissible, association standing). Added dates, the Article 6 detail and the dissent; if_they_push now answers the 'individuals brought the case' comeback.","sources":[{"title":"Urgenda Foundation v. State of the Netherlands (Supreme Court, 2019)","publisher":"International IDEA","year":2019,"url":"https://www.idea.int/cases/urgenda-foundation-v-state-netherlands-supreme-court-2019","finding":"Dutch Supreme Court: at least 25 percent below 1990 by 31 Dec 2020; measures left to the state.","verified":true},{"title":"KlimaSeniorinnen v Switzerland (ECtHR Grand Chamber, 2024)","publisher":"International IDEA","year":2024,"url":"https://www.idea.int/cases/klimaseniorinnen-v-switzerland-european-court-human-rights-2024","finding":"Association had standing; the four individual applicants were inadmissible; Article 8 violated.","verified":true},{"title":"Montana Supreme Court holds state constitution includes protections against climate change (Held v. Montana)","publisher":"Jones Day","year":2025,"url":"https://www.jonesday.com/de/insights/2025/03/montana-supreme-court-holds-state-constitution-includes-protections-against-climate-change","finding":"18 Dec 2024, 6-1: MEPA bar on considering greenhouse gases violated the clean and healthful environment right.","verified":true}],"their_sources":[{"title":"Urgenda Foundation v. State of the Netherlands (Supreme Court, 2019)","publisher":"International IDEA","year":2019,"url":"https://www.idea.int/cases/urgenda-foundation-v-state-netherlands-supreme-court-2019","finding":"Dutch Supreme Court held Articles 2 and 8 ECHR require at least 25 percent cut below 1990 by 31 Dec 2020; measures left to the state.","verified":true},{"title":"Montana Supreme Court holds state constitution includes protections against climate change (Held v. Montana)","publisher":"Jones Day","year":2025,"url":"https://www.jonesday.com/de/insights/2025/03/montana-supreme-court-holds-state-constitution-includes-protections-against-climate-change","finding":"On 18 Dec 2024 Montana Supreme Court, 6-1, held MEPA's bar on considering greenhouse gases violated the right to a clean and healthful environment.","verified":true},{"title":"KlimaSeniorinnen v Switzerland (ECtHR Grand Chamber, 2024)","publisher":"International IDEA","year":2024,"url":"https://www.idea.int/cases/klimaseniorinnen-v-switzerland-european-court-human-rights-2024","finding":"Grand Chamber, 9 Apr 2024: Switzerland violated Article 8 and Article 6(1); the association had standing, the four individual applicants were inadmissible.","verified":true}],"routes":[{"type":"deny","say":"Urgenda is a foundation and KlimaSeniorinnen an association; the four individual applicants were thrown out for lack of standing. Organisations won, not individuals (F5)."},{"type":"reframe","say":"Held v. Montana struck down a rule about rules; it did not itself cut a tonne. Litigation is the route, the output is policy (F3)."},{"type":"turn","say":"A court order against the state is government acting. The remedy in Urgenda was state policy; citizens enforcing policy is our side of the motion (F3)."},{"type":"fallacy","say":"They count the plaintiff and ignore the court, the constitution and the state that carried out the order. Crediting the trigger with the whole effect misreads the mechanism."}]},{"id":"PL07","side":"for","kind":"argument","angle":"policy fragility","strength":4,"title":"Governments subsidise the problem: $7 trillion","claim":"The IMF counts $7 trillion in fossil fuel subsidies in 2022, 7.1 percent of global GDP; for 2024 it is $0.73 trillion explicit plus $6.7 trillion implicit. Even if you debate the implicit part, governments actively underwrite emissions, so policy cannot be the net force for the environment.","say":"Subsidies are policy, so reform is the lever. And per the IMF, most of that 7 trillion dollars is unpriced harm, not payments, which a carbon price fixes. That is the policy fight we are asking for.","detail":"The IMF's 2022 figure of about 7 trillion dollars (7.1 percent of GDP) is 18 percent explicit subsidies; for 2024 it is 0.73 trillion explicit and 6.7 trillion implicit. Implicit means undercharging: environmental and health costs left unpriced plus fuel taxes below the standard consumption-tax rate, which is a missing policy, not a payment. Concede that governments do subsidise fossil fuel, and turn it: when explicit subsidies end, no household has to act, and where carbon was priced, emissions fell (UK coal M5; EU ETS about 1.2 billion tonnes, OW07). Capture shows policy matters enough to lobby for.","if_they_push":"Subsidy reform is exactly the policy lever; nobody on their side can point to a consumer campaign that removed a subsidy.","comeback":"Governments spend trillions making the problem worse, so policy is a net negative and reform is only hypothetical.","weak":false,"tags":["subsidies","imf","fossil fuel","7 trillion","implicit","explicit","capture","lobbying","gdp","externalities","undercharging","f2"],"phrasings":["Implicit subsidies are unpriced externalities, not government payments.","Only explicit subsidies, about $0.7 trillion, are real money.","Subsidy reform is exactly the policy lever we propose."],"frames":["F2"],"uses":["M5","OW07"],"notes":"IMF figures confirmed: about 7 trillion in 2022 with 18 percent explicit; 2024 split 0.73 trillion explicit and 6.7 trillion implicit. Clarified in detail that implicit includes undercharged consumption tax, not only harm. The 2022 and 2024 totals come from different IMF updates, so never mix them in one sentence.","sources":[{"title":"IMF Fossil Fuel Subsidies Data: 2023 Update","publisher":"International Monetary Fund","year":2023,"url":"https://www.imf.org/en/Publications/WP/Issues/2023/08/22/IMF-Fossil-Fuel-Subsidies-Data-2023-Update-537281","finding":"About 7 trillion dollars in 2022, 7.1 percent of GDP; explicit subsidies 18 percent of the total.","verified":true},{"title":"IMF Energy Subsidies topic page","publisher":"International Monetary Fund","year":2025,"url":"https://www.imf.org/en/Topics/climate-change/energy-subsidies","finding":"2024: explicit 0.73 trillion, implicit 6.7 trillion.","verified":true}],"their_sources":[{"title":"IMF Fossil Fuel Subsidies Data: 2023 Update","publisher":"International Monetary Fund","year":2023,"url":"https://www.imf.org/en/Publications/WP/Issues/2023/08/22/IMF-Fossil-Fuel-Subsidies-Data-2023-Update-537281","finding":"Fossil fuel subsidies about $7 trillion in 2022, 7.1 percent of global GDP; explicit subsidies were 18 percent of the total.","verified":true},{"title":"IMF Energy Subsidies topic page","publisher":"International Monetary Fund","year":2025,"url":"https://www.imf.org/en/Topics/climate-change/energy-subsidies","finding":"In 2024 explicit subsidies were $0.73 trillion (0.6 percent of GDP) and implicit $6.7 trillion (5.8 percent of GDP).","verified":true}],"routes":[{"type":"deny","say":"Most of that figure is implicit: unpriced harm and fuel taxed below standard rates, not cheques. Explicit subsidies were under a fifth of the total."},{"type":"outweigh","say":"Concede the subsidies. Where carbon was priced instead, emissions fell: the EU's trading system avoided about 1.2 billion tonnes even at low prices (OW07)."},{"type":"turn","say":"Subsidies are policy, so subsidy reform is the lever, and capture shows policy matters enough to lobby for. Their number is the size of our lever (CL2)."},{"type":"fallacy","say":"A government doing harm shows government has power over the outcome. They have proved the size of the lever and then argued the lever does not matter (CL2)."}]},{"id":"PL09","side":"for","kind":"argument","angle":"policy fragility","strength":3,"title":"EU biofuel mandates drove palm oil deforestation","claim":"The EU's renewable fuel mandates pushed palm oil into diesel: 51 percent of the palm oil Europe uses went into biodiesel, and a 2016 Commission-commissioned study (Globiom) found palm biodiesel has about three times the climate impact of fossil diesel once land-use change is counted. A policy meant to cut emissions raised them.","say":"True, and policy corrected it: the EU's RED II phases high-risk palm biodiesel out by 2030. A bad rule fixed by a rule shows policy is the lever, and no household could have unpicked palm oil from diesel.","detail":"Their own Transport and Environment source says 51 percent of Europe's palm oil goes into biodiesel and that the Commission's Globiom study found palm biodiesel about three times fossil diesel's climate impact once land-use change is counted. The same source reports RED II phases high-ILUC fuels to zero by 2030. T&E is an advocacy group relaying a Commission modelling study; concede that and still note that the finding came from a policy review that changed the policy. One mandate that backfired is design failure, and policy has the means to correct it.","if_they_push":"Ask them for the individual-action example that corrected itself at the scale of a continent's fuel market.","comeback":"Policy created the palm-oil demand in the first place and took years to notice, which is exactly why policy can't be trusted as the lever.","weak":false,"tags":["biofuels","palm oil","eu","deforestation","iluc","renewable energy directive","perverse","mandate","globiom","soy","unintended consequences","f2"],"phrasings":["The EU then fixed it via RED II, so policy corrected itself.","T&E is an NGO; Globiom is a modelling result.","One bad mandate does not make all policy bad."],"frames":["F2"],"uses":[],"notes":"51 percent, Globiom 3x and RED II phase-out to zero by 2030 all match the T&E page as reported. Understated and self-contained; no change beyond the check.","sources":[{"title":"Palm oil and soy oil for biofuels linked to high rates of deforestation","publisher":"Transport & Environment","year":2019,"url":"https://www.transportenvironment.org/articles/palm-oil-and-soy-oil-biofuels-linked-high-rates-deforestation-new-study","finding":"51 percent of Europe's palm oil goes to biodiesel; Globiom 2016 about 3x fossil diesel; RED II phases high-ILUC fuels to zero by 2030.","verified":true}],"their_sources":[{"title":"Palm oil and soy oil for biofuels linked to high rates of deforestation","publisher":"Transport & Environment","year":2019,"url":"https://www.transportenvironment.org/articles/palm-oil-and-soy-oil-biofuels-linked-high-rates-deforestation-new-study","finding":"51 percent of palm oil used in Europe goes into biodiesel; Globiom 2016: palm biodiesel about 3x fossil diesel impact; RED II phases high-ILUC fuels to 0 percent by 2030. Advocacy group, relays the Commission's Globiom study.","verified":true}],"routes":[{"type":"deny","say":"Their source is an advocacy group relaying a Commission modelling study, and that study was a policy review that changed the policy. The system reviewed itself."},{"type":"reframe","say":"Ask for the individual action that corrected itself at the scale of a continent's fuel market. No household could unpick palm oil from diesel at the pump."},{"type":"turn","say":"A bad rule corrected by a rule: RED II phases high-risk palm biodiesel out by 2030. Policy created the problem and policy is removing it; households could not (F2)."},{"type":"fallacy","say":"A mandate that backfired is a design failure, not proof the instrument is weak. The exception is being used to condemn the class."}]},{"id":"PL10","side":"for","kind":"argument","angle":"policy fragility","strength":3,"title":"Germany's nuclear exit pushed coal up","claim":"Germany's post-Fukushima nuclear phase-out, a politically popular policy, was mainly replaced by coal and imports. Jarvis, Deschenes and Jha estimate a social cost of 3 to 8 billion euros a year, mostly from air-pollution mortality. Policy driven by public fear, not outcomes, raised emissions and killed people.","say":"A bad policy still moved a national grid and measurable deaths, and no household choice moves a grid. Policy is the lever in both directions: Germany shows the cost of pulling it badly, Ontario the benefit of pulling it well.","detail":"Jarvis, Deschenes and Jha estimate a social cost of 3 to 8 billion euros a year in the published 2022 version (the 2019 working paper said 12 billion dollars), mostly from air-pollution mortality, because lost nuclear output was replaced mainly by coal and net imports. Concede the facts. The point is the size: a single political decision changed national electricity supply and its health outcomes. We do not claim every policy is wise; we claim policy is the lever, in both directions. Ontario shows the good direction: coal out and smog days down (M1, M1).","if_they_push":"The counterfactual is contested, but it shows design, not that individuals could do better; ask what individual action moved a grid by that much. If they say public fear drove it, that is F3: the fear became emissions only through a law.","comeback":"The phase-out followed public fear after Fukushima, so individuals drove it, and it made emissions and deaths worse.","weak":true,"tags":["germany","nuclear","phase-out","coal","energiewende","fukushima","mortality","jarvis","air pollution","social cost","unintended","f2","f1"],"phrasings":["Germany's renewables share rose; this was one policy and has since been reversed by the market.","The study's counterfactual is contested.","This shows policy needs to be well designed, not that individuals do better."],"frames":["F2","F1"],"uses":["M1"],"notes":"Rewrote say, which wrongly spoke of a national fleet and began with a concession. The cost figure is the 2022 published range of 3 to 8 billion euros; the earlier 12 billion was dollars from a working paper. Weak because the argument concedes policy killed people and a judge may read 'impact' as net benefit.","sources":[{"title":"The Private and External Costs of Germany's Nuclear Phase-Out","publisher":"Journal of the European Economic Association 20(3):1311-1346 (Jarvis, Deschenes, Jha)","year":2022,"url":"https://econpapers.repec.org/RePEc:oup:jeurec:v:20:y:2022:i:3:p:1311-1346.","finding":"Social cost 3-8 billion euros a year, mostly mortality from local air pollution; lost nuclear output replaced mainly by coal and net imports.","verified":true}],"their_sources":[{"title":"The Private and External Costs of Germany's Nuclear Phase-Out","publisher":"Journal of the European Economic Association 20(3): 1311-1346","year":2022,"url":"https://econpapers.repec.org/RePEc:oup:jeurec:v:20:y:2022:i:3:p:1311-1346.","finding":"Social cost 3 to 8 billion euros per year, mostly mortality from local air pollution; lost nuclear output offset mainly by coal and net imports. DOI 10.1093/jeea/jvac007.","verified":true}],"routes":[{"type":"reframe","say":"They say public fear drove it. Fear became coal only through a law; the norm reached the atmosphere through policy, which is our side (F3)."},{"type":"outweigh","say":"Concede Germany's cost. Ontario pulled the same lever the other way: coal out, electricity-sector emissions down about 84 percent, smog days gone (M1)."},{"type":"turn","say":"A bad policy still moved a national grid and measurable deaths. Nothing a household does moves a grid; their example proves the size of the lever (F2)."},{"type":"fallacy","say":"The motion asks which has more impact, not which is always wise. A harmful policy is still a large impact; they have swapped size for sign."}]},{"id":"PL12","side":"for","kind":"argument","angle":"policy fragility","strength":2,"title":"Efficiency policy backfires through rebound","claim":"Efficiency standards promise savings, but cheaper energy services invite more use; the idea goes back to Jevons in 1865. The result is that engineered savings are partly eaten, which is why the individual choice to consume less matters more than the efficiency mandate.","say":"Rebound is partial, not backfire. The standard review, Gillingham, Rapson and Wagner, finds little support for backfire, so efficiency standards still save energy. And a household that cuts its bill rebounds too.","detail":"The review says backfire is theoretically possible but not supported by the evidence, and treats rebound as partial; macro rebound is more uncertain. A rebound of even 30 percent leaves 70 percent of the savings. Households rebound too: money saved on fuel is spent on something else, and voluntary cuts have no mechanism to hold them. The authors' blog summary puts the plausible upper bound of total rebound near 60 percent; that is not confirmed in the paper text, so do not say the figure aloud.","if_they_push":"If rebound is the problem, the fix is a price on carbon, which is policy.","comeback":"Even at 30 percent rebound you lose a third of the savings, while a personal cut in consumption has no such leak.","weak":false,"tags":["jevons","rebound","efficiency","backfire","energy standards","consumption","sufficiency","rebound effect","paradox","appliances","f1"],"phrasings":["Gillingham et al. say backfire is not supported by evidence.","Rebound of 30 percent still leaves 70 percent savings.","Individuals rebound too, when they save on fuel and fly more."],"frames":["F1"],"uses":[],"notes":"Removed the 60 percent number from say because it was confirmed only in a blog summary, and removed the 2020 CO2 example (a lockdown, i.e. policy) and an unsupported welfare line. Replaced 'their own source' with 'the standard review'.","sources":[{"title":"The Rebound Effect and Energy Efficiency Policy","publisher":"Review of Environmental Economics and Policy 10(1):68-88 (Gillingham, Rapson, Wagner)","year":2016,"url":"https://econpapers.repec.org/RePEc:oup:renvpo:v:10:y:2016:i:1:p:68-88.","finding":"Abstract: existing research provides little support for the so-called backfire hypothesis; macro rebound understanding is limited.","verified":true,"note":"Fetched the RePEc abstract; no rebound percentage given, so the 60% bound stays unverified (card already says not to say it)."},{"title":"Global Carbon Project analysis of the 2020 emissions fall","publisher":"Carbon Brief","year":2020,"url":"https://www.carbonbrief.org/global-carbon-project-coronavirus-causes-record-fall-in-fossil-fuel-emissions-in-2020/","finding":"Fossil CO2 projected to fall about 7% in 2020 (2.4 GtCO2); Le Quere: surface transport cuts were 'not a structural decrease, but forced changes in behaviour'.","verified":true,"note":"Fetched Carbon Brief page. It was a projection at the time (Dec 2020)."}],"their_sources":[{"title":"The Rebound Effect and Energy Efficiency Policy","publisher":"Review of Environmental Economics and Policy 10(1): 68-88 (Gillingham, Rapson, Wagner)","year":2016,"url":"https://econpapers.repec.org/RePEc:oup:renvpo:v:10:y:2016:i:1:p:68-88.","finding":"Concedes rebound exists (macro rebound plausibly up to about 60 percent) but evidence does not support full backfire. Weakens this argument: honest framing is partial rebound, not Jevons backfire.","verified":false}],"routes":[{"type":"deny","say":"Rebound is partial, not backfire. The standard review finds little support for backfire, so efficiency standards still save most of what they promise."},{"type":"reframe","say":"If rebound is the problem, the fix is a price on carbon that covers the substitute. That is policy, so the objection ends in our lever."},{"type":"turn","say":"A household that cuts its bill rebounds too: the money goes elsewhere, and a voluntary cut has no mechanism to hold it. Their leak is on both sides."},{"type":"fallacy","say":"Losing part of a saving is not losing the saving. At their own 30 percent rebound, most of the cut survives; partial is being argued as if it were total."}]},{"id":"PL13","side":"for","kind":"argument","angle":"policy fragility","strength":2,"title":"Governments are too slow for the carbon budget","claim":"The carbon budget is measured in a few years while legislation is measured in electoral cycles and treaty rounds. UNEP shows the world heading for overshoot of 1.5 C within the next decade; individuals can change today.","say":"Individuals are slow too. Policy switched the UK grid from 39 percent coal to none, by price and by phase-out date. Overshoot is a reason for faster policy, not for less.","detail":"UNEP says warming will exceed 1.5 C, very likely within the next decade; that is an argument about pace. Policy delivered coal phase-outs at grid scale: the UK in twelve years (M5, M5), Ontario from 32.9 Mt to 5.4 Mt in nine (M1). Voluntary adoption takes longer: a household acts only when it can afford and access the option. Speed is not impact, but the fast cuts in our measured examples are legislated.","if_they_push":"Ask which individual action moved national emissions faster than a ban or a price; none of their examples is measured at that scale. Twelve years for a grid is slow against a carbon budget, so concede that and answer: the remedy is faster policy.","comeback":"Twelve years to retire one grid is slower than the carbon budget allows, while a household can switch its heating this winter.","weak":false,"tags":["too slow","speed","timing","carbon budget","overshoot","election cycle","urgency","bureaucracy","1.5","individuals act now","f1","f2"],"phrasings":["Individuals are slow too; adoption of EVs took a decade.","Policy can switch whole grids in one decision.","Speed is not impact."],"frames":["F1","F2"],"uses":["M1","M5"],"notes":"Cut the say to one number; removed 'in one decision' (the UK phase-out took twelve years) and narrowed the 'only measured fast cuts' claim to our own examples. Euronews and Ontario figures check out.","sources":[{"title":"UK closes its last coal power plant","publisher":"Euronews","year":2024,"url":"https://www.euronews.com/green/2024/09/30/uk-closes-last-coal-power-plant-after-142-years","finding":"Coal 39 percent of UK generation in 2012; last plant closed 30 Sept 2024.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG 32.9 Mt (2005) to 5.4 Mt (2014).","verified":true},{"title":"UNEP Emissions Gap Report 2025 (PBL summary)","publisher":"UNEP via PBL","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Warming will exceed 1.5 C, very likely within the next decade.","verified":true}],"their_sources":[{"title":"Emissions Gap Report 2025 (summary by PBL)","publisher":"UNEP via PBL","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Policy trajectory still up to 2.8 C; overshoot of 1.5 C expected (overshoot claim from search summary).","verified":true}],"routes":[{"type":"deny","say":"Individuals are slow too: a household acts only when it can afford and reach the option, and voluntary adoption has no deadline. Overshoot indicts both paces."},{"type":"outweigh","say":"Concede a decade is slow against a carbon budget. Nothing voluntary has moved a grid at any speed; the UK's went from about 39 percent coal to none (M5)."},{"type":"turn","say":"A short budget is the case for faster policy, not less: Ontario shut coal in under a decade by law, and no household could have done it at all (M1)."},{"type":"fallacy","say":"Speed is not impact. A household switching its heating this winter is fast and small; a legislated coal exit is slower and province-wide. They measure the wrong axis."}]},{"id":"PL14","side":"for","kind":"argument","angle":"policy fragility","strength":1,"title":"Politicians promise and then dilute","claim":"Politicians campaign on climate and govern on re-election: targets are set for 2050, long after the term ends, and are routinely weakened once costs show up. Individuals who actually bear costs follow through because the choice is theirs.","say":"Dilution is a reason to make the law bind, not to drop it. Where policy was strongest, emissions tended to fall most, in Le Quere's study of developed economies.","detail":"The For side's only evidence is Canada's Kyoto miss, which their own file calls an anecdote. Le Quere et al. (2019) studied 18 developed economies and associated the largest declines with the countries that had the most energy and climate policies; those countries were selected for already falling emissions, so it is an association, not a clean test, and the paper was not opened. Individuals also fail their stated intentions, and unlike a statute, a personal pledge has no enforcement. Dilution after costs show up is the argument for constraints that bind, such as ban dates and legislated phase-outs (M1, M2).","if_they_push":"Concede that politicians dilute targets; the remedy is binding law, and the For side offers no equivalent mechanism for personal pledges. Do not claim causation from Le Quere; say 'tended to'.","comeback":"Those 18 countries were picked because emissions fell, and policy correlating with falls doesn't show policy caused them.","weak":true,"tags":["politicians lie","promises","greenwash","short-termism","targets 2050","re-election","dilute","credibility","trust","net zero","f1","f3"],"phrasings":["That is anecdote, not evidence about all governments.","Individuals say they care and don't act either (attitude-behaviour gap).","Weak governments are a reason to vote better, which is policy."],"frames":["F1","F3"],"uses":["M1","M2"],"notes":"Dropped 'vote better, which is policy again' from the lead because it invites 'voting is individual action', and dropped the number 18 since the source is unverified. Selection and causation are the real weakness; low-strength item.","sources":[{"title":"Drivers of declining CO2 emissions in 18 developed economies","publisher":"Nature Climate Change (Le Quere et al.)","year":2019,"url":"https://www.pbl.nl/en/publications/drivers-of-declining-co2-emissions-in-18-developed-economies","finding":"18 developed economies cut CO2 2005 to 2015; renewable and efficiency policies linked to emissions reductions; summaries say largest declines where most energy and climate policies.","verified":"partial","note":"Nature page blocked (login redirect). PBL abstract confirms 18 economies and the policy association; the largest-declines-with-most-policies line comes from Future Earth and phys.org summaries. Association only."},{"title":"Canada cuts CO2 emissions, but misses target","publisher":"Phys.org (AFP)","year":2012,"url":"https://phys.org/news/2012-04-canada-co2-emissions.html","finding":"Kyoto promise 6 percent below 1990, delivered 17.5 percent above; an anecdote.","verified":true}],"their_sources":[{"title":"Canada cuts CO2 emissions, but misses target","publisher":"Phys.org (AFP)","year":2012,"url":"https://phys.org/news/2012-04-canada-co2-emissions.html","finding":"Illustrates promise-vs-delivery: committed to -6 percent vs 1990, delivered +17.5 percent. Anecdote, not systematic evidence of lying.","verified":true}],"routes":[{"type":"deny","say":"Their evidence is Canada's Kyoto miss, which their own file calls an anecdote. An anecdote is not a pattern."},{"type":"reframe","say":"If politicians dilute targets under pressure, that pressure is individuals acting through politics, and the result arrives as policy. Even their mechanism runs through law (F3)."},{"type":"turn","say":"Dilution is the case for law that binds: ban dates and legislated phase-outs. Ontario's coal ban and the Montreal Protocol were not diluted; they held (M1, M2)."},{"type":"fallacy","say":"Individuals also fail their stated intentions, and a personal pledge has no enforcement at all. They hold statutes to a standard pledges would fail worse."}]},{"id":"MK02","side":"for","kind":"argument","angle":"markets","strength":4,"title":"Pakistan's households out-built its government","claim":"Pakistan imported about 17 GW of solar panels in 2024, double 2023, and Ember says it happened without sweeping government mandates or international green finance: households and farmers simply did the arithmetic on grid prices. By 2025 about 18% of Pakistani households had solar and 61% of agricultural tubewells were solar.","say":"Households did the buying, yes. But Ember's own report lists a generous net-metering policy and a tax regime that kept import costs low among the drivers. They answered prices and rules that policy had set.","detail":"Ember's Pakistan report names a generous net-metering policy that rewarded early adopters and a tax regime that kept import costs low among the drivers, alongside rising grid prices. Industry was pushed by IMF-mandated levies on gas for captive power, and solar tubewells grew through a mix of private forces and government schemes, with subsidies and lending. When Pakistan moved to net billing, Ember says the advantage fell and adopters turn toward batteries. Expect the hard push: only about 300,000 connections are net-metered (NEPRA figure from a search summary, unverified) while tens of gigawatts were imported, much of it behind the meter or off-grid, so net metering alone does not explain the surge. Our answer is that the grid price people were escaping, the treatment of imports and the levies are all government instruments. We have not verified the actual duty or sales-tax rates. Panels were also cheap partly because of demand policy elsewhere (OW14), though the attribution is debated. Households chose from a menu that tariffs, taxes and levies wrote.","if_they_push":"Most of it was not net-metered, they will say. Fine: the grid price people were escaping is a regulated price, and import taxes and levies are policy too. The household was the channel; the cause was a set of rules.","comeback":"Most of Pakistan's solar is not net-metered and went in because grid power got too expensive, so households acted on arithmetic, not on a government programme.","weak":true,"tags":["pakistan","solar","rooftop","17 gw","ember","households","no mandate","grid prices","tubewells","bottom-up","imports","f2"],"phrasings":["Pakistan's boom was a reaction to government-set grid tariffs and a favourable import tax regime and net metering, so it is policy.","Chinese customs data is an upper bound; official capacity figures are far lower, so how much was actually installed?"],"frames":["F2"],"uses":["OW14"],"notes":"Facts hold against the fetched Ember page, but net metering covers only a small share of installs, so I removed the implication that it explains the surge and added the grid-price and levy answer. A judge may still see this as households responding to prices.","sources":[{"title":"The solarisation of Pakistan's energy economy","publisher":"Ember","year":2026,"url":"https://ember-energy.org/latest-insights/the-solarisation-of-pakistans-energy-economy/","finding":"Fetched this session: lists a generous net-metering policy that rewarded early adopters and a tax regime that kept import costs low; rising grid prices; IMF-mandated levies on gas for captive power; solar tubewells grew via private forces and government schemes; net billing has reduced the net-metering advantage. Gives no duty or tax rates. 18% of households (7 of 40 million), 61% of tubewells.","verified":true},{"title":"Renewable Power Generation Costs in 2020","publisher":"IRENA","year":2021,"url":"https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2021/Jun/IRENA_Power_Generation_Costs_2020.pdf","finding":"Utility-scale solar PV cost down 85% 2010 to 2020. IRENA does not itself credit Germany's tariff; the link is from learning-curve literature, so it is hedged in detail.","verified":true}],"their_sources":[{"title":"Global Electricity Review 2025: The Big Picture","publisher":"Ember","year":2025,"url":"https://ember-energy.org/latest-insights/global-electricity-review-2025/the-big-picture/","finding":"Fetched: Pakistan imported 17 GW of solar panels in 2024, double the prior year; one of the world's largest new solar markets; rooftop installs soared as homes and businesses sought cheaper power.","verified":true},{"title":"The solarisation of Pakistan's energy economy","publisher":"Ember","year":2026,"url":"https://ember-energy.org/latest-insights/the-solarisation-of-pakistans-energy-economy/","finding":"Fetched: 18% of Pakistani households have solar; residential 44% of FY25 deployment; solar tubewells 61% of tubewells by 2025; 47 GW cumulative exports to Pakistan by June 2025. Also notes generous net metering and a tax regime that kept import costs low, so government policy was not absent.","verified":true}],"routes":[{"type":"reframe","say":"The grid price people were escaping is a regulated price, and import taxes and levies are policy. Households were the channel; the rules were the cause (F2)."},{"type":"outweigh","say":"Grant that households bought the panels. The panels were cheap because demand policy elsewhere helped drive utility-scale solar costs down about 85 percent in a decade (OW14)."},{"type":"turn","say":"When Pakistan moved from net metering to net billing, Ember says the advantage fell and adopters turned to batteries. Behaviour tracked the rule, in both directions."},{"type":"fallacy","say":"Doing the arithmetic on prices is responding to prices, and the prices were set by tariffs, taxes and levies. Rational response to policy is not independence from it."}]},{"id":"MK03","side":"for","kind":"argument","angle":"markets","strength":4,"title":"Early adopters pushed solar and batteries down the curve","claim":"Solar module prices fell about 20 percent with every doubling of cumulative capacity, from $106 per watt in 1976 to $0.38 in 2019, a 99.6 percent drop; lithium-ion cells fell from about $9,200 per kWh in 1991 to about $78 in 2024, roughly 19 percent per doubling. Every doubling was bought by individuals and firms who paid more than the technology was worth; their purchases are what moved the curve for everyone after them.","say":"The curve is real. But policy bought much of the volume: Germany's feed-in tariff guaranteed solar buyers a return, and Nemet finds experience alone only weakly explains the main cost drivers. Early adopters bought a guarantee.","detail":"We accept OWID's 20 percent per doubling. The question is who paid for the doublings. Germany's 2000 feed-in tariff guaranteed grid access, priority dispatch and a fixed 20-year tariff, and Germany had roughly five times Japan's PV capacity in 2010 (OW14; that ratio is from memory of IEA PVPS data and not fetched, so keep it out of the speech). Nemet's 2006 abstract says learning from experience only weakly explains plant size, module efficiency and silicon cost, and points to demand and industry structure; his data end before the EEG had effect, so it supports the point about demand, not about Germany. IRENA records an 85 percent fall in utility-scale solar cost 2010 to 2020 and does not itself credit Germany, so we say helped, not caused. Concede that the first decades, 1976 to 2000, ran largely on research funding, space and off-grid buyers, not feed-in tariffs. Early adopters in the large markets were buying into a guaranteed return, not paying a premium on principle.","if_they_push":"Once policy had pulled the price down, individuals rode the curve, as in Pakistan. Riding a curve that policy built is the menu point, not individual impact.","comeback":"Subsidies helped, but the 99.6 percent drop came from buyers choosing panels in market after market, including unsubsidised ones like Pakistan, and from Chinese firms competing on price.","weak":true,"tags":["wright's law","learning curve","solar","batteries","lithium-ion","early adopters","cost decline","20 percent","doubling","demand pull","plant-based milk","f2"],"phrasings":["Subsidies in Germany, Japan and China created that early demand, not consumer virtue.","Learning curves are driven by manufacturing scale and R&D funding, much of it state-backed."],"frames":["F2"],"uses":["OW14"],"notes":"Softened 'policy bought the volume' to 'much of', limited Nemet to the drivers he studied, and flagged that the 1976-2000 doublings predate the EEG. Replaced the if_they_push, which merely restated our point. Best available but a judge may split the credit.","sources":[{"title":"Why did solar panel prices fall so much? (Learning curve)","publisher":"Our World in Data","year":2024,"url":"https://ourworldindata.org/learning-curve","finding":"Solar PV learning rate 20% per doubling; module price $106 to $0.38 per watt (1976 to 2019).","verified":true},{"title":"Beyond the learning curve: factors influencing cost reductions in photovoltaics","publisher":"Energy Policy 34(17) (Nemet)","year":2006,"url":"https://econpapers.repec.org/RePEc:eee:enepol:v:34:y:2006:i:17:p:3218-3232","finding":"Abstract: learning from experience only weakly explains change in plant size, module efficiency and silicon cost; points to technical barriers, industry structure and characteristics of demand. Covers the period before the 2000 EEG took effect; Germany/Japan detail not checked.","verified":true},{"title":"Renewable Power Generation Costs in 2020","publisher":"IRENA","year":2021,"url":"https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2021/Jun/IRENA_Power_Generation_Costs_2020.pdf","finding":"Utility-scale solar PV cost down 85% 2010 to 2020. IRENA does not itself credit Germany's tariff; the link is from learning-curve literature.","verified":true},{"title":"German Renewable Energy Sources Act","publisher":"Wikipedia","year":2024,"url":"https://en.wikipedia.org/wiki/German_Renewable_Energy_Sources_Act","finding":"EEG in force 1 April 2000; guaranteed connection, priority dispatch, 20-year tariff.","verified":true}],"their_sources":[{"title":"Why did solar panel prices fall so much? (Learning curve)","publisher":"Our World in Data","year":2024,"url":"https://ourworldindata.org/learning-curve","finding":"Fetched: solar PV learning rate 20% per doubling; module price fell from $106 to $0.38 per watt, a 99.6% decline (1976 to 2019 data).","verified":true},{"title":"Battery price decline","publisher":"Our World in Data","year":2025,"url":"https://ourworldindata.org/battery-price-decline","finding":"Fetched: lithium-ion cell price about $9,200/kWh in 1991 to about $78 in 2024; about 19% fall per doubling of cumulative production since 1998.","verified":true},{"title":"US retail sales of plant-based milk by numbers","publisher":"AgFunder News (GFI data)","year":2024,"url":"https://agfundernews.com/us-retail-sales-of-plant-based-milk-by-numbers-coconut-is-up-almond-is-down-soy-and-oat-are-flat","finding":"Per search summary: plant-based milk was almost 15% of US retail milk dollar sales in 2023 (GFI/SPINS). Page not fetched.","verified":false}],"routes":[{"type":"deny","say":"Nemet finds experience alone only weakly explains the main cost drivers; demand and industry structure did the work, and the big demand was guaranteed by feed-in tariffs (OW14)."},{"type":"reframe","say":"Early adopters in the large markets bought a guaranteed return: Germany's law fixed grid access, priority dispatch and a twenty-year tariff. Nobody paid a premium on principle (OW14)."},{"type":"turn","say":"Riding a price curve that policy built, as in Pakistan, is choosing from the menu, not writing it (F2, F4)."},{"type":"fallacy","say":"Being the buyer at each doubling does not mean the buyer caused the doubling. Who paid is not who made paying worthwhile."}]},{"id":"MK04","side":"for","kind":"argument","angle":"markets","strength":3,"title":"Australians put solar on millions of roofs","claim":"Australian households have installed over 4.5 million rooftop solar systems, around 31 GW, and added 247,000 more already in 2026; rooftop PV is a leading contributor to the grid, with solar at 18 percent of national electricity in 2024, up from 7 percent in 2019. That is millions of separate household decisions, each paid for by the household, now larger than any single power station program.","say":"Millions of households, yes. But Australia's federal Small-scale Renewable Energy Scheme cuts the upfront price of every eligible system through tradeable certificates. The scheme set the price they responded to.","detail":"The Clean Energy Regulator counts 4,562,198 small-scale installations, about 30.9 GW, and Ember has solar at 18 percent of Australian electricity in 2024 (that figure covers all solar, not only rooftop). The same regulator runs the SRES, whose tradeable certificates lower the upfront price of small solar systems; owners usually assign them to an installer for a discount or delayed payment. The regulator's page gives no discount size, so do not quote the roughly 30 percent that Wikipedia reports. Same pattern as California, where the peer effects were measured inside a rebate program (B2). On share of homes: a search summary suggests roughly one in three to two in five households now, so do not argue the old 20 percent figure. Households chose; the scheme wrote the price.","if_they_push":"We concede the number of roofs. A rebate that makes a roof pay back is policy producing the tonnes; take it away and the menu changes.","comeback":"The subsidy existed, but 4.5 million households chose to act on it, and Australians installed far more than the scheme required; markets moved faster than any mandate.","weak":false,"tags":["australia","rooftop solar","households","4.5 million","31 gw","installations","behind the meter","solar share","18 percent","clean energy regulator","bottom-up","f2"],"phrasings":["Australian rooftop solar is driven by the federal Small-scale Renewable Energy Scheme and state feed-in tariffs; it is a policy success.","You said over 30 percent of homes; the regulator's own table gives about 20 percent of all dwellings."],"frames":["F2"],"uses":[],"notes":"Removed the unsupported 30 percent discount and the awkward 'each was paid to by' phrasing; say now has no number. Also noted the 'over 30 percent of homes' dispute should not be argued from the old 20 percent figure.","sources":[{"title":"Postcode data for small-scale installations","publisher":"Clean Energy Regulator (Australia)","year":2026,"url":"https://cer.gov.au/RET/Forms-and-resources/Postcode-data-for-small-scale-installations","finding":"As at 30 Sep 2026, 4,562,198 small-scale solar PV installations, about 30.9 GW.","verified":true},{"title":"What is the Small-scale Renewable Energy Scheme?","publisher":"Clean Energy Regulator (Australia)","year":2024,"url":"https://www.cleanenergyregulator.gov.au/node/2291","finding":"SRES gives tradeable certificates that lower the purchase price of small solar systems, heat pumps and solar water heaters. Re-fetched this session: system owners often assign certificates to an agent for a discount or delayed cash payment; page states no discount percentage and no share of homes.","verified":true},{"title":"Small-scale Renewable Energy Scheme","publisher":"Wikipedia (citing the Clean Energy Regulator)","year":2026,"url":"https://en.wikipedia.org/wiki/Small-scale_Renewable_Energy_Scheme","finding":"Wikipedia: 'The Clean Energy Regulator estimates this discount reduces installation costs by approximately 30%.'","verified":true,"note":"Fetched Wikipedia; confirms the source finding. The regulator's own page was not re-opened; the card rightly avoids quoting it."},{"title":"Global Electricity Review 2025: The Big Picture","publisher":"Ember","year":2025,"url":"https://ember-energy.org/latest-insights/global-electricity-review-2025/the-big-picture/","finding":"Australia solar share 18% in 2024, up from 7% in 2019.","verified":true},{"title":"Peer Effects in the Diffusion of Solar Photovoltaic Panels","publisher":"Marketing Science (Bollinger & Gillingham)","year":2012,"url":"https://doi.org/10.1287/mksc.1120.0727","finding":"Not opened: INFORMS page returned 403.","verified":false,"note":"DOI redirects to pubsonline.informs.org which blocked access; no mirror tried. Peer-effect finding remains unverified here."}],"their_sources":[{"title":"Postcode data for small-scale installations","publisher":"Clean Energy Regulator (Australia)","year":2026,"url":"https://cer.gov.au/RET/Forms-and-resources/Postcode-data-for-small-scale-installations","finding":"Fetched: as at 30 Sep 2026, 4,562,198 small-scale solar PV installations totalling about 30.9 GW. The page does not give a percent of dwellings, so the '30% of homes' claim is not confirmed here.","verified":true},{"title":"Global Electricity Review 2025: The Big Picture","publisher":"Ember","year":2025,"url":"https://ember-energy.org/latest-insights/global-electricity-review-2025/the-big-picture/","finding":"Fetched: Australia solar share 18% in 2024, up from 7% in 2019.","verified":true}],"routes":[{"type":"deny","say":"Eighteen percent of electricity from solar counts all solar, not only rooftops. Their headline mixes utility-scale plants into a household story."},{"type":"reframe","say":"Australia's Small-scale Renewable Energy Scheme cuts the upfront price of every eligible system through tradeable certificates. The scheme set the price households responded to (F2)."},{"type":"turn","say":"Same pattern as California, where the peer effects were measured inside a rebate program. Households chose; the scheme wrote the price."},{"type":"fallacy","say":"Millions of decisions made under the same rebate are a single policy acting millions of times. Counting the roofs counts the policy's reach."}]},{"id":"MK05","side":"for","kind":"argument","angle":"markets","strength":3,"title":"Policy is only as good as individual uptake","claim":"Government can fund a heat pump scheme but only households can fit the heat pumps: the UK Boiler Upgrade Scheme missed its first-year target and the National Audit Office said it had underperformed, leaving the UK well off track for 600,000 installs a year by 2028. A policy with no individual action behind it has an impact of zero, so individual action is the binding constraint.","say":"Agreed, a voluntary voucher needs takers, which is why our best cases don't ask. Ontario shut its coal plants by law and power-sector emissions fell about 84 percent. No household uptake needed.","detail":"The NAO's March 2024 report said the Boiler Upgrade Scheme installed 18,900 heat pumps from May 2022 to December 2023 against 50,000 expected, that installations were less than half of projections, that demand and supply assumptions were optimistic, and that running and installation costs were the key obstacle. DESNZ had also delayed rebalancing gas and electricity prices, a policy lever. This is a failure of one voluntary design, not of policy as a class: DESNZ then raised the grant to 7,500 pounds and applications rose nearly 40 percent year on year, which is policy moving uptake. Standards, caps and closures bind whether or not anyone is enthusiastic: Ontario's Ending Coal for Cleaner Air Act (M1), where electricity-sector emissions fell from 32.9 to 5.4 megatonnes between 2005 and 2014, and the US Acid Rain Program, which cut power-plant SO2 96 percent with a cap on plants (OW04). Where people must act, policy can mandate, price or default.","if_they_push":"Low uptake of a rebate tells you to design a better policy, not to hand the problem to individuals who already declined. When the grant was raised, applications rose.","comeback":"The subsidy existed and individuals declined it, which proves that individual choice is what decides whether any policy has an effect.","weak":false,"tags":["boiler upgrade scheme","heat pump","uk","uptake","implementation","nao","underspend","household decisions","binding constraint","policy needs people","600000","f1","f2"],"phrasings":["Low uptake means the policy was badly designed, not that individuals matter more; mandates and regulation work without anyone's enthusiasm.","The scheme was undersubscribed because of installer shortages and running-cost rules the government set."],"frames":["F1","F2"],"uses":["M1","OW04"],"notes":"Corrected the source: the NAO findings are March 2024, now verified at the NAO page, and the BusinessGreen link dropped. Removed the '(Ontario)' parenthetical, cut the second number from the say, and added the grant-increase evidence that policy design moves uptake.","sources":[{"title":"Low heat pump uptake slowing progress on decarbonising home heating","publisher":"National Audit Office","year":2024,"url":"https://nao.org.uk/press-releases/low-heat-pump-uptake-slowing-progress-on-decarbonising-home-heating","finding":"Fetched this session (press release, 18 March 2024): 18,900 heat pumps installed May 2022 to Dec 2023 vs 50,000 expected; installations less than half of projections; government demand and supply assumptions optimistic; cost a key obstacle; target 600,000 a year by 2028; grant raised to 7,500 pounds, January 2024 applications up nearly 40%. Correction: the NAO report is 2024, not 2025.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG 32.9 Mt (2005) to 5.4 Mt (2014); coal banned by the Ending Coal for Cleaner Air Act, 2015 (canon M1).","verified":true}],"their_sources":[{"title":"'Slower than expected': National Audit Office raises alarm over heat pump rollout","publisher":"BusinessGreen","year":2025,"url":"https://businessgreen.com/news/4186094/slower-expected-national-audit-office-raises-alarm-heat-pump-rollout","finding":"Per search summary: NAO judged the scheme to have underperformed, leaving the UK off track for 600,000 heat pumps a year by 2028. Page not fetched; check NAO report for exact wording.","verified":false},{"title":"Boiler Upgrade Scheme only hits half its first year targets","publisher":"Homebuilding & Renovating","year":2023,"url":"https://www.homebuilding.co.uk/news/boiler-upgrade-scheme-only-hits-half-its-first-year-targets","finding":"Per search summary: scheme delivered about half its first-year target; Lords committee found low take-up and underspend. Page not fetched.","verified":false}],"routes":[{"type":"deny","say":"The NAO blamed optimistic assumptions and running costs, and a delayed rebalancing of gas and electricity prices, a policy lever. The failure sits in design, not in households."},{"type":"reframe","say":"A voluntary voucher needs takers, which is why our best cases do not ask. Ontario closed coal by law and emissions fell with no household uptake needed (M1)."},{"type":"turn","say":"When the government raised the grant, applications rose nearly 40 percent year on year. Uptake followed the policy, which is our point."},{"type":"fallacy","say":"Low uptake of a single voluntary scheme is being read as a verdict on policy as a class. Standards, caps and closures bind whether or not anyone is enthusiastic (OW04)."}]},{"id":"MK06","side":"for","kind":"argument","angle":"markets","strength":3,"title":"EV buyers made electric cars a mass market","claim":"Global electric car sales passed 17 million in 2024, over 20 percent of all new cars, and China's almost-half share came from consumers choosing the product. The first buyers of a $100,000 Roadster were individuals who paid a premium so the technology could reach scale; the market they created is now the main driver of battery demand.","say":"Buyers chose the cars, but China's purchase-tax exemption and Norway's tax rules built the market. Norway reached 88.9 percent electric with VAT exemptions, not volunteers.","detail":"IEA's 17 million electric cars in 2024 is accepted; we did not open the page this session. China's purchase-tax exemption on new-energy vehicles has been extended to the end of 2027, so the demand they cite was incentivised. Norway exempted EVs from 25 percent VAT and the registration tax while taxing fossil cars, and is now phasing the perks back (OW09). Same car, different result by grid: ICCT puts lifetime EV savings at 66 to 69 percent in Europe and 19 to 34 percent in India (FR04), so the buyer's choice is not the outcome. Check on the push line: Kelley Blue Book (Cox Automotive) data reported by electrive has US Q4 2025 EV sales down 36 percent, to 234,171 after the credit ended; we have not opened the source.","if_they_push":"Where the credit ended, uptake fell: the US federal credit expired on 30 September 2025 and fourth-quarter EV sales dropped about a third, per Cox Automotive. Premium buyers held up better, so grant them that the cars have a pull of their own.","comeback":"People bought EVs because they are now better and cheaper to run, and China's share kept climbing as the tax break phased down, so the product, not the subsidy, is doing the work.","weak":false,"tags":["ev","electric vehicles","tesla","early adopters","17 million","20 percent","iea","global ev outlook","china","consumer demand","battery","f2"],"phrasings":["China's EV boom is industrial policy, purchase tax exemptions and subsidies, not consumer taste.","Where there were no EV incentives, adoption stalled."],"frames":["F2"],"uses":["OW09","FR04"],"notes":"Say and numbers hold (88.9 percent verified). The old if_they_push, 'adoption stalled where incentives never existed', was unsupported; replaced with the US credit expiry, noted as a search-summary figure. IEA 17 million figure still not opened. Corrected detail after verification: 'Cox Automotive data in search summaries has US Q4 2025 EV sales down 36 percent' -> 'Kelley Blue Book (Cox Automotive) data reported by electrive has US Q4 2025 EV sales down 36 percent, to 234,171'.","sources":[{"title":"Global EV Outlook 2025: Executive summary","publisher":"International Energy Agency","year":2025,"url":"https://www.iea.org/reports/global-ev-outlook-2025/executive-summary","finding":"Electric car sales 'exceeded 17 million globally in 2024', share above 20%; China almost half of its car sales (over 11 million).","verified":true,"note":"Fetched IEA page. It does not mention China's purchase-tax exemption (and says Chinese incentives decreased in 2024), so the exemption claim needs a different source."},{"title":"China Extends NEV Tax Reduction and Exemption Policy to 2027","publisher":"China Briefing","year":2025,"url":"https://china-briefing.com/news/china-extends-nev-tax-reduction-and-exemption-policy-to-2027","finding":"China's NEV purchase-tax exemption extended to end of 2027 (full exemption capped per vehicle through 2025, halved 2026 to 2027).","verified":true},{"title":"Norway achieves 89 per cent EV share in 2024","publisher":"electrive (citing OFV)","year":2025,"url":"https://www.electrive.com/2025/01/02/norway-achieves-89-per-cent-ev-share-in-2024","finding":"88.9% of new cars electric in 2024. (ours.json OW09)","verified":true},{"title":"A global comparison of the life-cycle GHG emissions of combustion engine and electric passenger cars","publisher":"ICCT (Bieker)","year":2021,"url":"https://theicct.org/publication/a-global-comparison-of-the-life-cycle-greenhouse-gas-emissions-of-combustion-engine-and-electric-passenger-cars/","finding":"BEV lifetime emissions 66-69% lower (Europe), 19-34% (India). (ours.json FR04)","verified":true},{"title":"EV sales in the US plummet - as expected","publisher":"electrive (citing Cox Automotive)","year":2026,"url":"https://www.electrive.com/2026/01/14/ev-sales-in-the-us-plummet-as-expected","finding":"US Q4 2025 battery-EV sales fell 36% (365,830 to 234,171) per Kelley Blue Book; federal credit ended end of September 2025.","verified":"partial","note":"Fetched electrive. Source is Kelley Blue Book (a Cox Automotive brand). Tesla about 59% share not stated; article gives Tesla 46.2% for full-year 2025."}],"their_sources":[{"title":"Global EV Outlook 2025: Executive summary","publisher":"International Energy Agency","year":2025,"url":"https://www.iea.org/reports/global-ev-outlook-2025/executive-summary","finding":"Per search summary: over 17 million electric cars sold in 2024, more than 20% of global sales; China almost half of its car sales with 11 million-plus. Page not fetched directly.","verified":false}],"routes":[{"type":"deny","say":"Same car, different result: an EV's lifetime saving is about two thirds in Europe and far smaller in India, because the grid, not the buyer, sets it (FR04)."},{"type":"reframe","say":"China's purchase-tax exemption and Norway's tax rules built those markets. Norway reached about 89 percent electric with VAT exemptions, not volunteers (OW09)."},{"type":"turn","say":"Where the credit ended, uptake fell: US battery-EV sales dropped by about a third once the federal credit expired. Buyers followed the incentive."},{"type":"fallacy","say":"Buying a car that rules made cheap and chargeable is choosing from the menu. Crediting the buyer with the market confuses the choice with the conditions (F4)."}]},{"id":"MK07","side":"for","kind":"argument","angle":"markets","strength":3,"title":"Ostrom showed local users govern commons best","claim":"Elinor Ostrom won the 2009 Nobel in economics for showing that communities of ordinary users build durable rules that sustain forests, fisheries and irrigation without a central regulator or privatisation. Her polycentric governance finding means the unit that matters is the local group of people acting, with government as one layer rather than the engine.","say":"Ostrom's groups survive on monitoring and sanctions, and her principles include outside authorities recognising their right to organise. The atmosphere has no local group to do either.","detail":"Ostrom's design principles include user monitoring, graduated sanctions, nested enterprises and minimal recognition by external authorities of the right to organise (principle seven in most summaries). So her own work says self-governing groups work when rules bind and a higher authority leaves them room. Cox and colleagues' review of 91 studies supports the principles only probabilistically. A forest or irrigation system has identifiable users; the atmosphere has none, so the enforcing layer must be larger (FR03). Expect the push that Ostrom herself argued for a polycentric approach to climate, many scales instead of one treaty (from memory, not verified). Agree that there are many layers, and note that cities, provinces and national law are among them. Under F3 a village rule is government at small scale, but a judge may not accept that stretch, so lead with the atmosphere point.","if_they_push":"Polycentric means many layers of rules including the top one, and the top one is the part individuals cannot supply.","comeback":"Ostrom showed ordinary users make and enforce their own rules without a state, and she argued the same polycentric logic applies to climate, so the unit that matters is the group.","weak":true,"tags":["ostrom","commons","polycentric","governing the commons","nobel 2009","community forests","local governance","bottom-up","design principles","tragedy of the commons","self-governance","f2","f3"],"phrasings":["Ostrom's cases are small local commons; climate is a global atmosphere with no excludable users.","Ostrom herself said polycentric systems need nested, state-backed rules and enforcement."],"frames":["F2","F3"],"uses":["FR03"],"notes":"Dropped the claim 'that is policy at local scale', which is contestable since Ostrom's rules are communal, and replaced 'government recognition' with 'outside authorities', which is closer to principle seven. The Nobel and Cox sources remain search-summary only. Best argument is the atmosphere has no excludable users.","sources":[{"title":"Ostrom's eight commons governance design principles","publisher":"P2P Foundation wiki (summarising Ostrom 1990)","year":2020,"url":"https://wiki.p2pfoundation.net/Elinor_Ostrom%E2%80%99s_Eight_Commons_Governance_Design_Principles","finding":"Principles include monitoring by users or accountable monitors, graduated sanctions, recognition of the right to organise by government, and nested enterprises. Several summaries agree; the book itself was not opened.","verified":true},{"title":"A review of design principles for community-based natural resource management","publisher":"Ecology and Society (Cox, Arnold & Villamayor Tomas)","year":2010,"url":"https://www.ecologyandsociety.org/vol15/iss4/art38/","finding":"Cox, Arnold and Villamayor Tomas 2010: reviewed 91 studies; principles well supported empirically, probabilistic not deterministic reading.","verified":"partial","note":"Landing page and PDF fetched but abstract unreadable (frameset and compressed). 91 studies and probabilistic reading from WebSearch excerpts and commentary."}],"their_sources":[{"title":"Elinor Ostrom - Facts","publisher":"Nobel Prize","year":2009,"url":"https://www.nobelprize.org/prizes/economic-sciences/2009/ostrom/facts/","finding":"Official Nobel page for the 2009 prize in economic sciences shared with Oliver Williamson; fetch returned 403, confirmed only through search summaries.","verified":false},{"title":"Polycentric systems and forested social-ecological systems (Nagendra and Ostrom)","publisher":"Ecology and Society","year":2012,"url":"https://doaj.org/article/b644eda5b5f6421390289fb2f281a3a3","finding":"Per search summary: polycentric institutions help sustain diverse forested social-ecological systems. Listing page only.","verified":false}],"routes":[{"type":"deny","say":"Ostrom's groups survive on monitoring, graduated sanctions and recognition by outside authorities of their right to organise. Rules and enforcement, not goodwill (FR03)."},{"type":"reframe","say":"Polycentric means many layers of rules, including the top layer, and that is the part individuals cannot supply."},{"type":"turn","say":"Ostrom's lesson is that commons need rules that bind and sanctions that bite. That is a description of government, scaled to the resource (F3)."},{"type":"fallacy","say":"A forest or irrigation system has identifiable users who can watch each other. The atmosphere has none, so the finding does not transfer to the case at hand."}]},{"id":"MK08","side":"for","kind":"argument","angle":"markets","strength":3,"title":"Private land trusts outrun parks agencies","claim":"American land trusts have voluntarily conserved about 61 million acres of private land, an increase of more than 15 million acres since 2010, more than all the national parks combined. Doug and Kris Tompkins bought and rewilded roughly 14 to 15 million acres in Chile and Argentina and then donated it to become national parks, the largest private land donation in history.","say":"Land trusts are real, and many lean on the federal easement tax deduction. The Tompkins land was handed to the state to become parks. Under Brazil's enforcement plan, Amazon clearing fell 84 percent.","detail":"Land Trust Alliance reports 61 million acres conserved by end of 2020; accepted, though their line that this exceeds all national parks combined looks wrong: the National Park Service manages roughly 85 million acres (not verified here). A donated perpetual conservation easement can be deducted from federal income tax under section 170(h), and search summaries say the enhanced deduction was made permanent in 2015; we could not find what share of land-trust acres relies on it, so we say 'many', not 'much'. Tompkins's land became national parks, so the protection is state park status, and the Chilean state had to accept the donation. For scale and measured effect, Brazil's enforcement plan coincided with Legal Amazon clearing falling from 27,772 to 4,571 square kilometres 2004 to 2012 (OW12); attribution is partly confounded by commodity prices and exchange rates, so we say under, not only because.","if_they_push":"Conserved acres are a stock; policy is what keeps them conserved after the donor is gone, by law.","comeback":"Donors, not the tax code, chose to give up the land, and a land trust protects an acre for good with a legal easement and no agency required.","weak":false,"tags":["land trust","conservation","61 million acres","tompkins","rewilding","patagonia","private land","national parks","donation","voluntary","biodiversity","f2"],"phrasings":["Land trusts rely on government tax deductions and conservation easement incentives.","Tompkins land was handed to the state, so state park status did the protecting."],"frames":["F2"],"uses":["OW12"],"notes":"Removed 'enforcement alone' from the say, which overclaimed given the commodity-price confound, and 'much of it' became 'many lean on'. Flagged that the For claim of more than all national parks combined looks false (NPS about 85 million acres). Tompkins and LTA figures remain search-summary only.","sources":[{"title":"61 million acres voluntarily conserved in America: 2020 National Land Trust Census","publisher":"Land Trust Alliance","year":2021,"url":"https://landtrustalliance.org/newsroom/press-releases/61-million-acres-voluntarily-conserved-in-america-2020-national-land-trust-census-report-reveals","finding":"61 million acres conserved by land trusts by end of 2020. Confirmed via search summary.","verified":true},{"title":"26 U.S. Code 170 (charitable deduction, subsection (h) conservation easements)","publisher":"Legal Information Institute, Cornell","year":2024,"url":"https://www.law.cornell.edu/uscode/text/26/170","finding":"Section 170(b)(1)(E) gives qualified conservation contributions a 50% limit with 15-year carryforward, farmers 100%; permanent since the PATH Act 2015 (secondary).","verified":"partial","note":"Fetched Cornell LII; saw the (b)(1)(E) conservation provisions, but subsection (h) text was in a truncated portion. Permanence confirmed only by secondary sources (CPA Practice Advisor, Kahn Litwin, Forest Society)."},{"title":"How an unprecedented gift built a legacy of conservation in Patagonia","publisher":"National Geographic","year":2020,"url":"https://www.nationalgeographic.com/magazine/2020/05/how-an-unprecedented-gift-built-a-legacy-of-conservation-in-patagonia-feature.html","finding":"Tompkins land became national parks (Pumalin; March 2019 deal: 1 million acres of Tompkins land with 10 million of government land, five new parks).","verified":true,"note":"Fetched NatGeo. 'Largest private land donation' not stated in the fetched text; only that such a donation was unusual."},{"title":"PPCDAm and Amazon deforestation 2004-2012 (INPE data)","publisher":"Climate Policy Initiative / INPE","year":2021,"url":"https://www.climatepolicyinitiative.org/id/?p=34486","finding":"Legal Amazon deforestation fell from 27,772 km2 (2004) to 4,571 km2 (2012). Commodity prices also played a part (West & Fearnside 2021).","verified":true}],"their_sources":[{"title":"61 million acres voluntarily conserved in America: 2020 National Land Trust Census","publisher":"Land Trust Alliance","year":2021,"url":"https://landtrustalliance.org/newsroom/press-releases/61-million-acres-voluntarily-conserved-in-america-2020-national-land-trust-census-report-reveals","finding":"Per search summary: 61 million acres conserved by land trusts by end of 2020, up more than 15 million since 2010. Fetch returned 403; confirmed via search.","verified":true},{"title":"How an unprecedented gift built a legacy of conservation in Patagonia","publisher":"National Geographic","year":2020,"url":"https://www.nationalgeographic.com/magazine/2020/05/how-an-unprecedented-gift-built-a-legacy-of-conservation-in-patagonia-feature.html","finding":"Per search summary: Tompkins land helped create national parks; acreage ranges 14.2 to 14.8 million depending on source; the 2019 handover was described as the largest private land donation. Page not fetched.","verified":false}],"routes":[{"type":"reframe","say":"Many land trusts lean on the federal conservation easement deduction, and the Tompkins land was handed to the state to become national parks. The protection is state status (F2)."},{"type":"outweigh","say":"Grant the acres. Under Brazil's enforcement plan Amazon clearing fell about 84 percent, a scale no donor has matched (OW12)."},{"type":"turn","say":"The Tompkins gift became national parks only because the Chilean state accepted it. The largest private donation in history needed a government to mean anything."},{"type":"fallacy","say":"Conserved acres are a stock. What keeps them conserved after the donor is gone is an easement enforced by law, so permanence is policy's work."}]},{"id":"MK10","side":"for","kind":"argument","angle":"markets","strength":2,"title":"Divestment moved $39 trillion of pledges","claim":"By October 2021 some 1,485 institutions with $39.2 trillion in assets had committed to divest from fossil fuels, a movement that began with student activists. The Oxford Smith School called stigmatisation, not the selling itself, the real threat to fossil fuel companies: individuals reshaped what a respectable portfolio looks like.","say":"Pledges are not emissions cuts. Berk and van Binsbergen find divestment moves the cost of capital by under half a basis point, because someone else buys the shares.","detail":"Stand.earth's $39.2 trillion is the total assets of institutions that pledged some form of divestment, not money moved. Berk and van Binsbergen, in the Journal of Financial Economics, estimate about 0.44 basis points at current implementation (an earlier draft said 0.35, and a Stanford interview quotes a larger 8 basis points under another estimate that the authors still judged too small to matter), and found no detectable effect from index entries and exits. They say socially responsible investors would need to account for over 80 percent of the market for divestment to have a significant effect. Oxford's Smith School itself says direct share-price impact is limited and locates the threat in stigma. We concede stigma; Oxford offers no measure of it, and a company is hurt by stigma only when it shows up in prices, laws or customers.","if_they_push":"The authors say direct investment in primary markets, or using voting rights to engage companies, has much greater impact than selling. That is governance by large holders, not a personal choice.","comeback":"Divestment is about stigma and signalling, which Oxford itself says is the real threat, and a movement that shifted 39 trillion dollars of pledges has changed what respectable investors do.","weak":false,"tags":["divestment","fossil free","39 trillion","stand.earth","stigma","oxford","ansar","pension funds","students","investors","stranded assets","f1"],"phrasings":["Berk and van Binsbergen estimate divestment changes the cost of capital by well under a basis point; someone else just buys the shares.","Pledges are not emissions cuts, and $39 trillion is total AUM of signatories, not money moved."],"frames":["F1"],"uses":[],"notes":"Number and source verified against the Harvard forum summary. Replaced the 'more than 1 percent' threshold, which no summary states, with the quoted 'over 80 percent of the market', and tightened if_they_push so it addresses the shareholder-engagement rejoinder.","sources":[{"title":"The Impact of Impact Investing","publisher":"Journal of Financial Economics (Berk & van Binsbergen)","year":2025,"url":"https://papers.ssrn.com/abstract=3909166","finding":"Harvard Corporate Governance forum summary fetched this session: divestment at current levels changes the cost of capital by 'only 0.44 basis points'; over 80% of the market would have to be socially responsible for a significant effect; authors favour direct investment in primary markets and engagement via voting rights. Full text not opened.","verified":true},{"title":"1,485 institutions with assets over $39.2 trillion have committed to divest from fossil fuels","publisher":"Stand.earth","year":2021,"url":"https://stand.earth/insights/1485-institutions-with-assets-over-39-2-trillion-have-committed-to-divest-from-fossil-fuels/","finding":"Pledges of some form of divestment, total assets of signatories; not money moved.","verified":true},{"title":"Stranded assets and the fossil fuel divestment campaign","publisher":"Smith School, University of Oxford","year":2013,"url":"https://ora.ox.ac.uk/objects/uuid:f04181bc-8c4f-4cc1-8f01-cafce57975ae","finding":"ORA abstract only says the report tests whether divestment could affect fossil assets; Commons Library summary: authors argue a direct effect on valuations is unlikely.","verified":"partial","note":"ORA record has no findings. Limited-direct-effect claim from Commons Library secondary; stigma as the greater threat not confirmed (report has a stigmatisation section). Full PDF at smithschool.ox.ac.uk not opened."}],"their_sources":[{"title":"1,485 institutions with assets over $39.2 trillion have committed to divest from fossil fuels","publisher":"Stand.earth","year":2021,"url":"https://stand.earth/insights/1485-institutions-with-assets-over-39-2-trillion-have-committed-to-divest-from-fossil-fuels/","finding":"Per search summary: 1,485 institutions, $39.2 trillion in assets committed to some form of fossil divestment (pledges, not completed divestments). Fetch returned 403.","verified":true},{"title":"Stranded assets and the fossil fuel divestment campaign","publisher":"Smith School, University of Oxford","year":2013,"url":"https://ora.ox.ac.uk/objects/uuid:f04181bc-8c4f-4cc1-8f01-cafce57975ae","finding":"Per search summary: direct impact on share prices limited; stigmatisation is the greater threat to fossil fuel companies. Repository record only.","verified":false}],"routes":[{"type":"deny","say":"Pledges are not emissions cuts, and the 39 trillion dollars is the assets of institutions that pledged something, not money moved."},{"type":"reframe","say":"Berk and van Binsbergen find divestment barely moves the cost of capital, under half a basis point, because someone else buys the shares. The signal has no price."},{"type":"turn","say":"Their own authors say engagement through voting rights and primary-market investment do far more than selling. That is governance by large holders, not personal choice (F5)."},{"type":"fallacy","say":"Stigma counts only when it shows up in prices, laws or customers. Oxford offers no measure of it, so an unmeasured mechanism is doing all the work (F1)."}]},{"id":"MK11","side":"for","kind":"argument","angle":"markets","strength":2,"title":"Citizen scientists supply the biodiversity data","claim":"Citizen science platforms are the backbone of conservation data: eBird alone makes up more than 40 percent of the biodiversity records in the Global Biodiversity Information Facility, all supplied by volunteers. Policy cannot protect what has not been counted, and individuals do the counting.","say":"Counting birds is not cutting emissions. Citizen data is an input; what changes the environment is the protected-area decision or the rule that uses it. We concede the data and ask what happened after.","detail":"eBird is the largest single dataset in GBIF (about 561 million of roughly 1.3 billion occurrences in 2019, our own arithmetic, about 43 percent); we have no publisher statement of the share. The motion asks which has more impact on the environment. Monitoring tells you what to protect, it does not protect it. Measured protection in our cases came from enforcement: Brazil's clearing fell 84 percent af
