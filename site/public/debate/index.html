y to the end of El Nino conditions, not policy; 35 countries cut emissions while growing their economies. Le Quéré et al. 2019 found renewable-energy and efficiency policies associated with the emissions cuts in the 18 countries (correlation, not proof). Re-check against the 2026 Global Carbon Budget (out mid-November).","tags":["record emissions","global carbon project","paris failed","decade","policy failed"],"phrasings":["emissions are at a record high","ten years of Paris and nothing"],"frames":["F1"],"sources":[{"title":"Global Carbon Budget 2025","publisher":"Global Carbon Project","year":2025,"url":"https://essd.copernicus.org/articles/18/3211/2026/","finding":"GCB 2025 (ESSD): fossil CO2 decreased in 35 economies with growing GDP over 2015-2024, 27 percent of world fossil emissions; fossil emissions projected up 1.1 percent in 2025, a record high (globalcarbonbudget.org).","verified":"partial","note":"35 countries confirmed on the ESSD paper. Policy credit for land-use drop not found: search excerpt attributes the 2025 land-use decline mainly to the end of El Nino conditions; CSIRO also does not credit policy."},{"title":"Global Carbon Budget 2025 (CSIRO, from The Conversation)","publisher":"CSIRO","year":2025,"url":"https://www.csiro.au/en/news/all/articles/2025/november/global-carbon-budget-2025","finding":"Page says net carbon emissions from land-use change have declined over the past decade and names 35 countries that reduced fossil emissions over the past decade; it gives no cause for the land-use drop.","verified":"partial","note":"Fetched CSIRO page. 35-countries figure confirmed; the claim that GCB 2025 credits environmental policy for the land-use drop is not on the page."},{"title":"Drivers of declining CO2 emissions in 18 developed economies","publisher":"Nature Climate Change (Le Quere et al.)","year":2019,"url":"https://ueaeprints.uea.ac.uk/id/eprint/70189/","finding":"Abstract: policies on renewable energy are supporting emissions reductions and displacing fossil fuels in these 18 countries; energy-efficiency policies support lower energy use. Correlation only.","verified":"partial","note":"Fetched UEA repository abstract (Le Quere et al, Nat Clim Change 9:213). The 'most policies, largest decreases' phrasing appeared only in a Future Earth press-release excerpt in search, not on a page I fetched."}],"notes":"Record 2025 fossil emissions and 35 countries confirmed (35 on CSIRO's GCB summary, not on the GCP page). Not confirmed: that the GCB credits environmental policy for the land-use drop (search summaries attribute it to less deforestation and fires in South America); that line in detail should be softened. Le Quere 2019 'most policies' wording from press release only. Corrected detail after verification: 'Global Carbon Budget 2025 credits environmental policy for the drop in land-use emissions' -> 'Global Carbon Budget 2025 attributes the 2025 drop in land-use emissions mainly to the end of El Nino conditions, not policy'. Corrected detail after verification: 'Le Quéré et al. 2019 found the largest decreases in countries with the most policies' -> 'Le Quéré et al. 2019 found renewable-energy and efficiency policies associated with the emissions cuts in the 18 countries (correlation, not proof)'.","their_sources":[],"routes":[{"type":"deny","say":"Emissions did not rise everywhere. Fossil CO2 fell in 35 economies with growing GDP, and renewable and efficiency policies were associated with those cuts."},{"type":"outweigh","say":"Concede the record. Where a rule bound, emissions fell by a measured amount: Ontario's coal phase-out, about 27 megatonnes a year (M1)."},{"type":"turn","say":"If a decade of policy failed, so did a decade of their lever: the households they say drive most emissions failed too. The record indicts both, or neither."},{"type":"fallacy","say":"Emissions rising while policy exists does not mean policy did nothing. The question is what they would have been without it, and that projection is higher (OW17)."}]},{"id":"B7","side":"for","angle":"movements","strength":4,"title":"Policy follows people","claim":"Governments only act when public opinion forces them. Norms change first; policy follows. So the individual norm shift is the real cause.","say":"Opinion only changes the environment once it becomes policy. That concedes policy is the delivery mechanism.","detail":"F3. Swiss voters rejected a CO2 law in 2021 (51.6 percent), and Canadian opinion killed the consumer price. Public sentiment cuts both ways; policy is what locks gains in.","tags":["policy follows people","public opinion","norms","governments respond","social tipping","otto","values","chenoweth","3.5 percent","movements","abolition","contagion","upstream","civil society","f3","f1"],"phrasings":["governments only move when people demand it","the norm changed first","Chenoweth's data are about regime change, not climate policy.","The 3.5 percent rule is correlation with selection bias.","Otto et al. recommend policy interventions like removing subsidies.","Laws that stick follow shifts in what ordinary people accept: abolition, suffrage and clean air all began as movements. Otto et al. in PNAS identify norms and values as one of six social tipping elements for decarbonization, and Chenoweth's work on 323 campaigns found no nonviolent campaign that reached 3.5 percent participation failed. Change individual norms and the policy comes free."],"frames":["F3"],"sources":[{"title":"Strong turnout influenced rejection of key environmental law","publisher":"Swissinfo (SRG)","year":2021,"url":"https://www.swissinfo.ch/eng/strong-turnout-influenced-rejection-of-key-environmental-law/46829490","finding":"\"On June 13, 51.6% of Swiss voters rejected the CO2 law.\"","verified":true,"note":"Fetched page; exact figure stated."},{"title":"Social tipping intervention strategies for rapid decarbonization need to consider how change happens","publisher":"PNAS (Smith, Christie, Willis)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7245064","finding":"Transformation begins with civil society and ends in government intervention.","verified":true},{"title":"Questions, answers and some cautionary updates regarding the 3.5% rule","publisher":"Harvard Kennedy School Carr Center (Chenoweth)","year":2020,"url":"https://www.hks.harvard.edu/centers/carr/publications/questions-answers-and-some-cautionary-updates-regarding-35-rule","finding":"323 campaigns 1900-2006, none that reached 3.5 percent failed; descriptive, not a guarantee; failures above the threshold exist (Bahrain). Seen via search summary.","verified":true},{"title":"Swiss referendum on the CO2 Act, 13 June 2021","publisher":"Swiss Federal Chancellery","year":2021,"url":"https://www.uvek.admin.ch/uvek/de/home/uvek/abstimmungen/co2-gesetz.html","finding":"Federal result summary (via search excerpt, uvek.admin.ch): Abgelehnt, 51.6% Nein, 48.4% Ja; BFS lists turnout 59.7%, 21 cantons against.","verified":"partial","note":"bk.admin.ch homepage is generic and the Chancellery results URLs I tried 404 or were blocked. Fetched UVEK page confirms rejection on 13 June 2021 but its percentages came only from a search excerpt. Swissinfo (B7 idx0) fetched with 51.6%."}],"notes":"Figure and date confirmed by Swissinfo and many outlets; Federal Chancellery/admin.ch page could not be loaded (404), hence verified:false under the publisher rule.","their_sources":[{"title":"Social tipping dynamics for stabilizing Earth's climate by 2050","publisher":"PNAS (Otto et al.), doi:10.1073/pnas.1900577117","year":2020,"url":"https://doi.org/10.1073/pnas.1900577117","finding":"Names six social tipping elements (energy, settlements, finance, norms and values, education, information feedbacks); rapid decarbonization depends on contagious social change. Fetch returned 403; confirmed through search and the PNAS commentary.","verified":false},{"title":"Social tipping intervention strategies... need to consider how change happens","publisher":"PNAS (Smith, Christie, Willis)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7245064","finding":"Transformation begins with civil society and ends in government intervention, with norms and values shaped by movements.","verified":true},{"title":"The 3.5% rule: How a small minority can change the world","publisher":"BBC Future (summarising Chenoweth and Stephan, Why Civil Resistance Works, 2011)","year":2019,"url":"https://www.bbc.com/future/article/20190513-it-only-takes-35-of-people-to-change-the-world","finding":"323 campaigns 1900-2006; none that reached 3.5 percent participation failed. BBC blocked fetch; relies on search summaries. Chenoweth calls it a rule of thumb, and critics note falling success rates.","verified":false}],"alt_say":"Opinion only changes the environment once it becomes policy, which concedes policy is the delivery mechanism. And Chenoweth's data are about toppling regimes, not tonnes of carbon.","if_they_push":"Even if norms move first, norms become tonnes only through rules; ask them for one measured norm-driven reduction that did not pass through a standard, a price or a ban.","comeback":"Policy follows norms, so the norm shift is the real cause and the law is only the receipt.","routes":[{"type":"deny","say":"Opinion does not reliably produce policy: Swiss voters rejected a CO2 law in 2021 and Canadian opinion killed the consumer carbon price. Sentiment cuts both ways."},{"type":"reframe","say":"Ask what the norm shift did alone. Name a measured reduction that passed through no standard, price or ban. If none, the norm needed policy (F3)."},{"type":"turn","say":"Their own source says transformation begins with civil society and ends in government intervention. The ending is where the tonnes are counted."},{"type":"fallacy","say":"Coming first is not causing. Chenoweth's 3.5 percent data is about toppling regimes, not cutting tonnes, and preceding a law is not producing its effect."}]},{"id":"C1","side":"for","angle":"movements","strength":2,"title":"25% tipping point","claim":"Centola showed a committed 25 percent minority can tip a whole society's norms. Individuals tip the system.","say":"That was a lab game with 20 to 30 people paid to agree. Published estimates range from 10 to 40 percent. Tipping a norm isn't cutting a tonne.","detail":"Centola et al. 2018, Science: online coordination game with groups of about 20. The 25% result is specific to that design.","tags":["25%","tipping point","centola","committed minority","norms"],"phrasings":["you only need 25 percent","the tipping point is 25 percent"],"frames":["F1"],"sources":[{"title":"Research finds tipping point for large-scale social change","publisher":"University of Pennsylvania Annenberg School","year":2018,"url":"https://www.asc.upenn.edu/news-events/news/research-finds-tipping-point-large-scale-social-change","finding":"Fetched. Ten cohorts of 20 people each earned money for agreeing on a language convention; paid confederates acted as the committed minority; threshold about 25%; authors say it can shift with circumstances.","verified":true},{"title":"Experimental evidence for tipping points in social convention","publisher":"Science (Centola et al.)","year":2018,"url":"https://www.asc.upenn.edu/sites/default/files/2021-03/Experimental%20evidence%20for%20tipping%20points%20in%20social%20convention.pdf","finding":"Paper: 10 online groups of 20 to 30 people, paid for coordinating; largest unsuccessful minority 21%, smallest successful 25%; prior literature range 10% to 40%.","verified":true,"note":"Fetched the Science paper PDF (Penn-hosted) and read text with pdftotext. Group size and the 10-43 range differ slightly from the card."},{"title":"The Pareto effect in tipping social networks: from minority to majority","publisher":"Earth System Dynamics (Everall et al.)","year":2025,"url":"https://esd.copernicus.org/articles/16/189/2025/","finding":"Fetched abstract: 'a range of critical masses where social tipping is possible; these values lie between 10 % and 43 %'.","verified":true}],"notes":"Design confirmed: ~20-person groups, participants paid per coordination, 25% minority were paid confederates. 10-43% is one review's range (Everall et al. 2025, ESD), not a consensus; say 'range from 10 to 43 percent in one review'. Corrected say after verification: '20 people paid to agree. Real-world estimates range from 10 to 43 percent' -> '20 to 30 people paid to agree. Published estimates range from 10 to 40 percent'.","their_sources":[],"routes":[{"type":"deny","say":"That was an online game with groups of about 20 people paid to agree, and the committed minority were paid confederates. Published estimates range widely."},{"type":"reframe","say":"Tipping a convention is not cutting a tonne. Even if a minority flips a norm, the norm reaches the atmosphere only through rules (F3)."},{"type":"fallacy","say":"A result from a lab coordination game is being generalised to whole societies and to emissions. The authors themselves say the threshold shifts with circumstances."}]},{"id":"C2","side":"for","angle":"movements","strength":3,"title":"Greta and the climate strikes","claim":"One teenager started a movement of millions. Fridays for Future changed the global conversation.","say":"What did she ask for? Government action.","detail":"F3. The strikes demanded policy; their impact is measured in policy adopted.","tags":["greta","thunberg","climate strike","fridays for future","protest","millions","greta thunberg","school strike","attention","cop","agenda setting","46 countries","google search","activism","youth","f3","f1"],"phrasings":["Greta Thunberg changed the world","millions marched","Attention is not emissions; marches did not cut a tonne of carbon.","The authors credit media coverage, not the individual.","Greta's movement ended up demanding policy.","A teenager with a sign did more to raise global climate attention than decades of summits. Sisco et al. found that climate activist events in 46 countries raised climate search attention more than UN climate conferences or temperature anomalies. Individuals set the agenda that policy then reacts to."],"frames":["F3"],"sources":[{"title":"Global climate marches sharply raise attention to climate change: Analysis of climate search behavior in 46 countries","publisher":"Journal of Environmental Psychology 75:101596 (Sisco et al.)","year":2021,"url":"https://iris.unibocconi.it/handle/11565/4038543","finding":"Climate marches drove search attention more than COPs or extreme temperatures. Confirmed through a 2024 Nature Communications paper that cites it; original not opened.","verified":true},{"title":"Climate protests and concern in Germany (Nature Communications)","publisher":"Nature Communications","year":2024,"url":"https://www.nature.com/articles/s41467-024-46477-4","finding":"Protest timing study of concern; cites Sisco et al.; measures concern, not emissions.","verified":true}],"their_sources":[{"title":"Global climate marches sharply raise attention to climate change","publisher":"Journal of Environmental Psychology 75:101596 (Sisco, Pianta, Weber, Bosetti), doi:10.1016/j.jenvp.2021.101596","year":2021,"url":"https://iris.unibocconi.it/handle/11565/4038543","finding":"Across 46 countries 2015-2019 climate activist events drove more attention than political events like COPs; media coverage helps explain it. Confirmed via search; page not fetched.","verified":false}],"alt_say":"What did she ask for? Government action. Sisco and colleagues measured search attention, not emissions. Attention that never becomes policy is not a tonne of carbon.","if_they_push":"Greta's movement ended up demanding legislation; the rubric question is what was delivered, and that is policy (F1, F3).","comeback":"Attention is what moves governments; the strikers set the agenda that every policy since has followed.","routes":[{"type":"deny","say":"The study they lean on measured search attention across countries, not emissions. Attention is not a tonne."},{"type":"reframe","say":"Fridays for Future is an organised movement, not a single person acting; by the definitions set in the opening that is not individual action (F5)."},{"type":"turn","say":"What did the strikes ask for? Government action. A movement whose demand is legislation is evidence that policy is where the impact lives (F3)."},{"type":"fallacy","say":"Changing the conversation is not changing the environment. They have swapped the thing to be measured, attention, for the thing the motion asks about."}]},{"id":"C3","side":"for","angle":"consumption","strength":2,"title":"If everyone did it","claim":"If everyone made these changes, the effect would be enormous. Every big change starts with individuals.","say":"The resolution is about impact, not intentions. “If everyone” is the one thing voluntary action can't guarantee and policy can.","detail":"F1. Policy is the mechanism that turns 'if everyone' into 'everyone'.","tags":["drop in the ocean","if everyone","collective","every big change","turn off lights","thermostat","standby power","unplug","small acts","free","immediate","household energy","multiplied","billions of people","no cost","f1"],"phrasings":["if everyone did their part","it all adds up","switch off the lights, it adds up","lower your thermostat by one degree","billions of small acts equal a big act","Turning off lights, lowering the thermostat and unplugging devices cost nothing and are available to every household immediately, multiplied across millions of homes. The sum of billions of small acts is an enormous number even if each is tiny."],"frames":["F1"],"sources":[{"title":"Household actions can provide a behavioral wedge to rapidly reduce US carbon emissions","publisher":"PNAS (Dietz et al.)","year":2009,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2767367/","finding":"Abstract (fetched): 123 Mt carbon/yr in year 10, about 20% of household direct emissions, 7.4% of national; based on interventions that 'typically combine several policy tools and strong social marketing'; a 'reasonably achievable potential'.","verified":true},{"title":"Plastic Bag Levy","publisher":"Wicklow County Council","year":2023,"url":"https://wicklow.ie/Living/Services/Environment/Recycling-Waste-Management/Recycling-Reduction-Reuse/Plastic-Bag-Levy","finding":"Per capita use fell overnight from 328 to 21 bags.","verified":true}],"their_sources":[{"title":"Household actions can provide a behavioral wedge (standby and thermostat actions are among the 17 modeled)","publisher":"PNAS (Dietz et al.)","year":2009,"url":"https://pmc.ncbi.nlm.nih.gov/articles/2767367/","finding":"Supports the principle that aggregated household actions are material; individual actions' size is not quantified here. Opponent can point to Wynes & Nicholas ranking lightbulbs at about one eighth of a plant-based diet (not verified for lights-off specifically).","verified":false}],"alt_say":"'If everyone' is the one thing voluntary action cannot guarantee and policy can. In Ireland a levy, not a plea, changed bag habits overnight.","if_they_push":"The resolution asks about impact, not intentions; 'if everyone' needs a mechanism that makes everyone, which is policy (C3). And no one has shown a measured national drop from lights-off alone (F1).","comeback":"Household energy is a big share of emissions, and lowering thermostats and cutting standby is free, immediate and needs no vote.","routes":[{"type":"deny","say":"Their own wedge source says those household savings depend on interventions that typically combine several policy tools and strong social marketing. Nothing spontaneous."},{"type":"reframe","say":"'If everyone' is a mechanism problem, and the mechanism that turns 'if everyone' into 'everyone' is a rule, a price or a default (F2)."},{"type":"outweigh","say":"Ireland did not wait for everyone: a levy at the till cut plastic bag use roughly 90 percent within a year (OW15)."},{"type":"fallacy","say":"Arguing from what would happen if everyone acted assumes the hard part is done. The motion asks what has impact, not what would (F1)."}]},{"id":"C4","side":"for","angle":"markets","strength":2,"title":"Sustainable products winning market share","claim":"NYU Stern finds sustainability-marketed products are growing far faster than conventional ones. Consumer demand is reshaping markets.","say":"That counts marketing labels, not measured impact. Greenwashing isn't emissions reduction.","detail":"The Stern index tracks products marketed as sustainable, by sales. It does not measure tonnes avoided.","tags":["sustainable products","market share","nyu stern","consumer demand","green brands","greenwashing"],"phrasings":["sustainable brands are growing twice as fast","consumers are voting with their wallets"],"frames":["F1"],"sources":[{"title":"Sustainable Market Share Index","publisher":"NYU Stern Center for Sustainable Business","year":2025,"url":"https://www.stern.nyu.edu/experience-stern/about/departments-centers-initiatives/centers-of-research/center-sustainable-business/research/csb-sustainable-market-share-index","finding":"Fetched. Tracks 'products marketed as sustainable' in 36 CPG categories by sales; 5-year CAGR 10.9% vs 2.2% for conventional; 25.4% of branded market. Does not measure environmental impact.","verified":true}],"notes":"Confirmed: index tracks marketed-as-sustainable sales, not tonnes. Year updated to the 2025 page.","their_sources":[],"routes":[{"type":"deny","say":"The index counts products marketed as sustainable, by sales. It does not measure a single tonne avoided; it measures labels."},{"type":"reframe","say":"Market share is a sales figure. The motion asks about impact on the environment, and sales of a labelled product are not an environmental outcome (F1)."},{"type":"fallacy","say":"Faster growth from a small base says little: a quarter of the branded market growing faster is still a marketing category, not a measured reduction."}]},{"id":"C5","side":"for","angle":"movements","strength":5,"title":"Voting is individual action","claim":"Voting is the ultimate individual action. Every policy you praise exists because individuals voted for it.","say":"Then they're arguing our side: a vote changes nothing until it becomes policy.","detail":"F3.","tags":["voting","individual","citizens","elections","definition","protest","civic action","lawsuit","donating","agency","upstream","democracy","individual action","policy is downstream","f3"],"phrasings":["voting is an individual action","individuals elected those governments","Voting is collective action, not individual action; one vote does nothing.","You are redefining the resolution to win it.","Individual action means personal consumption choices, not politics.","Government policy is not an independent force; it is the output of individuals voting, organizing, donating, lobbying and suing. If a citizen's vote or lawsuit changes a law, that impact belongs to individual action, so the resolution's comparison collapses in our favour: every policy is downstream of individuals."],"frames":["F3"],"sources":[{"title":"Social tipping intervention strategies for rapid decarbonization need to consider how change happens","publisher":"PNAS (Smith, Christie, Willis)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7245064","finding":"Social transformation begins with civil society and movements and results in government intervention.","verified":true}],"their_sources":[{"title":"Social tipping intervention strategies for rapid decarbonization need to consider how change happens (response to Otto et al.)","publisher":"PNAS (Smith, Christie, Willis)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7245064","finding":"Argues social transformation begins with civil society and movements and 'results in, rather than begins with' government intervention, citing the abolition movement.","verified":true}],"alt_say":"Then they are arguing our side: a vote, a protest or a lawsuit changes nothing until it becomes policy. If those count, the impact is policy's. If they do not, half their examples drop out. They have to pick one.","if_they_push":"Ask which definition they run. If votes and lawsuits count, the effect is the law's (F3), and the comparison is empty: if every policy is individual action then the two sides of the motion are the same thing. One vote moves nothing alone; it takes millions aggregated by an institution, and that is what policy is. If they mean personal consumption, their activism and litigation examples leave.","comeback":"Courts, votes and protests are individuals acting, so every policy you praise is individual action by another name.","routes":[{"type":"deny","say":"Their own source says transformation results in, rather than begins with, government intervention. The intervention is what acts on the environment."},{"type":"reframe","say":"If every policy is individual action because people voted for it, the sides of the motion collapse into each other and there is nothing to debate. Make them pick (F3)."},{"type":"turn","say":"Then they argue our side: a vote changes nothing until it becomes policy. If votes count as individual action, the impact still arrives by law (F3)."},{"type":"fallacy","say":"A vote moves nothing alone; it takes millions aggregated by an institution. Crediting the institution's output to each voter confuses the part with the whole."}]},{"id":"C6","side":"for","angle":"consumption","strength":1,"title":"Carbon footprint (jab only)","claim":"Everyone has a carbon footprint and everyone can shrink it.","say":"BP's marketing popularized the personal carbon footprint in the mid-2000s. Ask who benefits from focusing on individuals.","detail":"BP disputes this, so don't lean on it. Use as a one-line jab, not a load-bearing point.","tags":["carbon footprint","bp","ogilvy","marketing","jab"],"phrasings":["reduce your carbon footprint"],"frames":["F1"],"sources":[{"title":"The carbon footprint sham","publisher":"Mashable (Mark Kaufman)","year":2020,"url":"https://mashable.com/feature/carbon-footprint-pr-campaign-sham","finding":"Kaufman: BP hired Ogilvy & Mather; BP 'first promoted and soon successfully popularized the term carbon footprint in the early aughts'; calculator unveiled in 2004; 278,000 people used it in 2004.","verified":true,"note":"Got the article HTML (WebFetch blocked; plain curl returned the page). The article contains no BP rebuttal, so 'BP disputes this' is not sourced here."}],"notes":"Not verified at Mashable. Dates vary (2004 vs 2005) across secondary sources; say 'mid-2000s' stays safe. Keep as a jab.","their_sources":[],"routes":[{"type":"reframe","say":"Most of a footprint is the grid, the codes and the transport someone lives inside, and policy sets those (F2)."},{"type":"turn","say":"The personal carbon footprint was popularised by BP's marketing campaign in the mid-2000s. Ask who benefits when the conversation stays on individuals (FR01)."},{"type":"fallacy","say":"Everyone having a footprint says nothing about who can shrink it most. The size of a lever, not its existence, is the motion."}]},{"id":"F5","side":"ours","kind":"frame","angle":"frames","title":"Our definitions","say":"We defined individual action as action taken by a single person, who then has to reach out and gather others for their cause, and does not include a company or organization.","detail":"Government: municipal, provincial or federal, stable, legitimate, with real executive and legislative power. Government policy: laws, actions and practices adopted by a government. Use the definition whenever they credit a company, a charity, a cooperative or a movement with a formal organization: by the definitions set in the opening, that is not individual action.","tags":["definition","definitions","organization","company","charity","ngo","cooperative","single person","scope"],"best_against":["The Ocean Cleanup","cooperatives built the transition","companies and entrepreneurs","NGOs and campaigns","divestment funds"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"F6","side":"ours","kind":"frame","angle":"frames","title":"Conditions line","say":"Individual actions matter, but government policy determines the conditions under which those actions take place.","detail":"The opening's thesis sentence and the closing's last line. Say it the same way each time so the judges hear one claim.","tags":["conditions","thesis","impetus","constraint","closing","opening"],"best_against":["closing","any lifestyle example"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"CL1","side":"ours","kind":"frame","angle":"frames","title":"Governments have scale","say":"Governments have scale. They operate with resources most individuals cannot access: they fund research into sustainable initiatives, learn from pollution data, and use national media to inform people.","detail":"From the closing draft. Pair with one measured example (M1, M3 or M5) so scale is shown, not asserted.","tags":["scale","resources","funding","research","media","closing"],"best_against":["individuals fund and build things","philanthropy","citizen science"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"CL2","side":"ours","kind":"frame","angle":"frames","title":"Governments have power","say":"Governments have power. BP does not get to operate in Azerbaijan, or make its mistakes in Alaska, if a government does not allow it. Lobbyists exist because of the power that policy has.","detail":"From the closing draft. Governments control the products and infrastructure individuals get to use, and the information they receive. Policy is what allows individual actions to exist in the first place. Turn their capture and lobbying examples with this: lobbying is proof of where the power sits.","tags":["power","enforce","laws","lobbyists","lobbying","capture","bp","permits","authority","closing"],"best_against":["governments are captured by lobbyists","fossil fuel subsidies","companies pollute regardless"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"OP1","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Clean Air Act: 78% down while GDP grew 274%","say":"Between 1970 and 2020, emissions of the major air pollutants fell 78 percent while the US economy grew 282 percent.","detail":"Our opening's version of M3, pairing EPA's pollutant trend with World Bank GDP. Use when they say regulation costs growth.","tags":["clean air act","gdp","growth","economy","274%","78%","regulation","epa"],"best_against":["regulation hurts the economy","policy is too costly","growth versus environment"],"sources":[{"title":"Our Nation's Air: Trends Through 2023","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/air-trends/air-quality-national-summary","finding":"From 1970 to 2025, total emissions of the six principal air pollutants fell 78 percent; over the same period US GDP rose 349 percent.","verified":true,"note":"Fetched epa.gov page. 78% confirmed (current end year 2025; the 2024 trends report, which I could not load, covers through 2023). The 1970 to 2020 end year was not directly seen, so keep the 78% but say 'since 1970'."},{"title":"GDP (constant 2015 US$), United States","publisher":"World Bank","year":2024,"url":"https://data.worldbank.org/indicator/NY.GDP.MKTP.KD?locations=US","finding":"NY.GDP.MKTP.KD: 1970 = 5.174 trillion, 2020 = 19.740 trillion constant 2015 US$, growth 281.6 percent (274% is not right for this series).","verified":true,"note":"Values fetched from the World Bank API (api.worldbank.org v2) and growth computed."}],"their_sources":[],"phrasings":[],"notes":"Corrected say after verification: '274 percent' -> '282 percent'."},{"id":"OP2","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Germany vs US: 3.1 times the transport emissions","say":"A 2014 study by Ralph Buehler, using 2010 data, found the average American produced 3.1 times the passenger-transport CO2 emissions of the average German, because Germans make trips by means other than driving.","detail":"The infrastructure point from our opening: transit, cycling and walking networks are policy, and they decide what an individual's trip can be. The clearest evidence for F2.","tags":["germany","usa","transport","transit","cycling","walking","infrastructure","3.1","driving","car"],"best_against":["car-free living","lifestyle choices","individuals choose how to travel"],"sources":[{"title":"Comparison of transport CO2 emissions, Germany and the United States","publisher":"2014 study (to confirm)","year":2014,"url":"https://blogs.lse.ac.uk/usappblog/2015/07/17/the-u-s-can-learn-from-germanys-successful-transport-policies-to-reduce-its-co2-emissions-and-petroleum-dependence","finding":"In 2010 CO2 from ground passenger transport was 3.1 times higher per capita in the US than in Germany (also 2.1x per passenger-km, 2.4x per GDP).","verified":"partial","note":"Fetched the LSE USAPP blog (Ralph Buehler, July 2015) which quotes 3.1 per capita and names the TRR paper; 2014 year and the journal page itself not fetched. AICGS 2012 version says 3,800 vs 1,200 kg (about 3x). Data year is 2010."}],"their_sources":[],"phrasings":[],"notes":"Corrected say after verification: 'A 2014 study found the average American produced 3.1 times the transportation emissions of the average German' -> 'A 2014 study by Ralph Buehler, using 2010 data, found the average American produced 3.1 times the passenger-transport CO2 emissions of the average German'."},{"id":"OP3","side":"ours","kind":"win","angle":"policy wins","strength":3,"title":"Zero Emission Transit Fund, $2.75 billion","say":"In 2021 the Government of Canada created the Zero Emission Transit Fund with 2.75 billion dollars, so communities can buy zero-emission buses.","detail":"Our opening's funding example: capital no individual can match, spent on the option individuals then choose from.","tags":["canada","transit","buses","funding","zero emission","2.75 billion","infrastructure"],"best_against":["individuals fund the transition","entrepreneurs"],"sources":[{"title":"Zero Emission Transit Fund","publisher":"Infrastructure Canada","year":2021,"url":"https://www.canada.ca/en/housing-infrastructure-communities/news/2021/08/government-of-canada-targets-zero-emission-bus-transportation-with-launch-of-new-fund.html","finding":"$2.75 billion for infrastructure projects through the Zero Emission Transit Fund, a five-year national program allocated starting in 2021, to buy zero-emission transit and school buses plus associated infrastructure.","verified":true,"note":"Fetched canada.ca release (Aug 10, 2021). The team's housing-infrastructure.canada.ca URL failed a certificate check, so use this URL."}],"their_sources":[],"phrasings":[]},{"id":"OP4","side":"ours","kind":"win","angle":"policy wins","strength":3,"title":"Clean Toronto Together: 71,000 people, 9,775 tonnes","say":"For over 20 years the City of Toronto has run Clean Toronto Together. In 2024 it brought 71,000 people to more than 870 cleanups, and in spring 2025 City crews removed 1,111 truckloads, 9,775 tonnes of waste.","detail":"Our opening's example of government convening individuals: the city organized, informed and authorized; the people showed up. The impact is the campaign's, which is policy.","tags":["toronto","cleanup","clean toronto together","volunteers","convening","media","campaign","litter"],"best_against":["volunteers clean up","individuals organize"],"sources":[{"title":"Clean Toronto Together","publisher":"City of Toronto","year":2024,"url":"https://www.toronto.ca/news/city-of-toronto-launches-20th-annual-clean-toronto-together-spring-cleanup-campaign/","finding":"Release of April 25, 2025: 'Last year, 71,000 people participated in more than 870 cleanups' (2024 volunteers); City spring cleanup operations 'removed 1,111 truckloads of waste for a total of 9,775 metric tonnes' (2025, four weeks before the campaign, by City crews).","verified":true,"note":"Fetched toronto.ca release. The campaign page itself lacks these figures. The figures are from different years and different actors, so the card's one-spring sentence is wrong."}],"their_sources":[],"phrasings":[],"notes":"Corrected say after verification: 'One spring it brought 71,000 people to more than 870 cleanups and removed 9,775 tonnes of waste.' -> 'In 2024 it brought 71,000 people to more than 870 cleanups, and in spring 2025 City crews removed 1,111 truckloads, 9,775 tonnes of waste.'."},{"id":"PE1","side":"ours","kind":"win","angle":"pre-empt","strength":4,"title":"Canada's inventory: their numbers are right, and the inventory names the policy","say":"Canada's inventory says electricity emissions fell 61 percent this century and credits closing coal plants, which Ontario did by law. Oil and gas rose little on far more production; the inventory credits methane cuts.","detail":"Their draft's figures are right and come from Environment and Climate Change Canada's own indicator data table, base year 2000: electricity 128.4 Mt in 2000 to 49.6 Mt in 2024 (down 61 percent); oil and gas 179.1 to 207.6 Mt (up 16 percent); heavy industry 97.3 to 77.5 Mt (down 20 percent). ECCC's written text uses 2005 and 1990 as base years and gives: electricity down 66 Mt (57 percent) from 2005 to 2024 and down 47 percent from 1990; oil and gas up 10 Mt (5.1 percent) from 2005 and up 76 percent from 1990; heavy industry down 11 Mt (13 percent) from 2005 and down 21 percent (20 Mt) from 1990. Use whichever base year they use; every version points the same way. Attribution, in ECCC's words: the electricity fall was 'driven by the phase-out of coal-fired electricity generation' and 'Ontario's emissions decrease was primarily driven by the closure of coal-fired electricity generation plants' (Ontario's by law, 2005 to 2014, M1; then the federal 2030 phase-out). Oil and gas: 'Crude oil and natural gas production has also increased by 60%' from 2005 to 2024, oil sands growth of 59 Mt 'offset by methane emission reductions from conventional oil and gas activities (-43 Mt)', and fugitive emissions down 33 Mt (34 percent) since 2015. Methane is regulated federally since 2018 and provincially, and large emitters pay an industrial carbon price (M4); the ECCC pages name the methane cut, not the regulation, so say 'methane cuts' aloud and 'methane rules' only with M4 in hand. Their 67 percent production increase for 2000 to 2024 is unconfirmed: ECCC gives 60 percent for 2005 to 2024 and says crude production 'more than doubled' since 1990; do not contest it, it only strengthens the intensity point. National total: 685 Mt in 2024, 10 percent below 2005 (78 Mt) and 64 Mt below 2000 (749 Mt). Emissions per unit of GDP down 48 percent since 1990. The line to land: a cleaner barrel and a closed coal plant are regulations, not lifestyles.","tags":["canada","national inventory","eccc","electricity","61%","57%","coal phase-out","oil and gas","production","intensity","methane","oil sands","2000","2005","2024","16%","67%","20%","ontario"],"best_against":["Ontario coal was a one-off","oil and gas emissions rose so policy failed","emissions from oil and gas increased 16 percent","production grew 67 percent","electricity decreased 61 percent","between 2000 and 2024 emissions from electricity production decreased 61 percent"],"sources":[{"title":"Greenhouse gas emissions: Canadian Environmental Sustainability Indicators (with data table by economic sector, 1990 to 2024)","publisher":"Environment and Climate Change Canada","year":2026,"url":"https://www.canada.ca/en/environment-climate-change/services/environmental-indicators/greenhouse-gas-emissions.html","finding":"Data table, Mt CO2 eq: electricity 94.4 (1990), 128.4 (2000), 115.9 (2005), 75.2 (2014), 49.6 (2024); oil and gas 118.2, 179.1, 197.6, 229.7, 207.6; heavy industry 97.6, 97.3, 88.6, 83.0, 77.5; national 749 (2000), 685 (2024). Text: 1990 to 2024 electricity -47%, oil and gas +76% (89 Mt), heavy industry -21% (20 Mt); 2005 to 2024 electricity -57% (66 Mt), oil and gas +5%, heavy industry -13% (11 Mt); 'Ontario's emissions decrease was primarily driven by the closure of coal-fired electricity generation plants'; crude oil production 'more than doubled' 1990 to 2024. Fetched this pass; their 61, 16 and 20 percent reproduce from the 2000 and 2024 rows.","verified":true},{"title":"Executive summary: Greenhouse gas sources and sinks in Canada 2026 (1990 to 2024)","publisher":"Environment and Climate Change Canada","year":2026,"url":"https://www.canada.ca/en/environment-climate-change/services/climate-change/greenhouse-gas-emissions/sources-sinks-executive-summary-2026.html","finding":"'Emissions from Electricity decreased by 66 Mt (-57%)' 2005 to 2024, 'driven by the phase-out of coal-fired electricity generation'; 'Oil and gas emissions increased by 10 Mt (5.1%)', peak 230 Mt in 2014, 208 Mt in 2024; 'Crude oil and natural gas production has also increased by 60%'; 254 percent rise in bitumen and synthetic crude; oil sands growth 59 Mt 'offset by methane emission reductions from conventional oil and gas activities (-43 Mt)'; fugitive sources -33 Mt (-34%) since 2015; total 685 Mt, 78 Mt (10%) below 2005; intensity down 48 percent since 1990 and 37 percent since 2005. Fetched this pass.","verified":true},{"title":"Overview of Canada's Greenhouse gas emissions (1990 to 2024)","publisher":"Environment and Climate Change Canada","year":2026,"url":"https://www.canada.ca/en/environment-climate-change/services/climate-change/greenhouse-gas-emissions/inventory/preliminary-emissions-1990-2024.html","finding":"Sector table: electricity 116 (2005) to 50 Mt (2024); oil and gas 198 to 208; heavy industry 89 to 77; national totals 608 (1990), 749 (2000), 763 (2005), 685 (2024); electricity fall 'driven by the phase-out of coal-fired electricity generation'. Fetched this pass.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG 32.9 Mt (2005) to 5.4 Mt (2014); coal about 25 percent of supply in 2003, 0 percent in 2014; Ending Coal for Cleaner Air Act (2015). Fetched this pass.","verified":true}],"their_sources":[],"phrasings":[]},{"id":"PE2","side":"ours","kind":"win","angle":"pre-empt","strength":3,"title":"Heavy industry down while the economy grew: fuel switching and efficiency are policy","say":"Heavy industry emissions fell a fifth this century. The inventory credits falling emissions intensity to fuel switching, efficiency and modernised processes, which a carbon price and a standard buy. Industrial pricing is Canada's top-ranked policy.","detail":"Their figure is right: ECCC's indicator data table gives heavy industry 97.3 Mt in 2000 and 77.5 Mt in 2024, down 20 percent; the written text gives down 21 percent (20 Mt) from 1990 and down 13 percent (11 Mt) from 2005. Their 'despite an increase in output' is their claim; the ECCC pages give no output figure for heavy industry, so neither confirm nor contest it (the national economy grew, and emissions per dollar of GDP fell 48 percent since 1990, which makes the same point). ECCC attributes the fall in emissions per person and per unit of GDP to 'fuel switching, increases in efficiency, the modernization of industrial processes'; that is a national-intensity statement, so say 'the inventory credits falling intensity to', not 'credits heavy industry's fall to'. Within the sector, 2005 to 2024: manufacturing fuel emissions down 8.7 Mt (19 percent), aluminium process emissions down 28 percent, petroleum refining down 27 percent. The policy link: the Canadian Climate Institute finds large-emitter trading systems deliver 20 to 48 percent of the reductions expected from Canada's 2030 plan, more than any other policy (M4). No household choice reaches a smelter's fuel mix; a price and a performance standard do (F2, FR06).","tags":["heavy industry","industrial","20%","21%","20 Mt","fuel switching","efficiency","carbon price","industrial carbon pricing","output","intensity","aluminium","refining","manufacturing","climate institute","48%"],"best_against":["heavy industry down 20 percent despite more output","emissions from heavy industry have decreased by 20 percent","industry cleaned itself up","efficiency happens on its own","companies cut emissions for profit not policy"],"sources":[{"title":"Greenhouse gas emissions: Canadian Environmental Sustainability Indicators","publisher":"Environment and Climate Change Canada","year":2026,"url":"https://www.canada.ca/en/environment-climate-change/services/environmental-indicators/greenhouse-gas-emissions.html","finding":"Heavy industry data table 97.3 Mt (2000), 77.5 Mt (2024); text -21% (20 Mt) 1990 to 2024, -13% (11 Mt) 2005 to 2024; declines per person and per unit GDP attributed to 'fuel switching, increases in efficiency, the modernization of industrial processes'. No output figure for heavy industry. Fetched this pass.","verified":true},{"title":"Executive summary: Greenhouse gas sources and sinks in Canada 2026","publisher":"Environment and Climate Change Canada","year":2026,"url":"https://www.canada.ca/en/environment-climate-change/services/climate-change/greenhouse-gas-emissions/sources-sinks-executive-summary-2026.html","finding":"Heavy industry 89 Mt (2005) to 77 Mt (2024) in Table ES-2; 'GHG emissions from fuel consumption in Manufacturing Industries decreased by 8.7 Mt (19%) between 2005 and 2024'; emissions intensity -48% since 1990, -37% since 2005. The text has no heavy-industry sentence with both Mt and percent. Fetched this pass.","verified":true},{"title":"Industrial carbon pricing the top driver of emissions reductions, new analysis shows","publisher":"Canadian Climate Institute","year":2024,"url":"https://climateinstitute.ca/news/industrial-carbon-pricing-the-top-driver-of-emissions-reductions-new-analysis-shows/","finding":"21 March 2024: large-emitter trading systems deliver between 20 and 48 per cent of emissions reductions expected from the Emissions Reduction Plan, more than any other policy through 2030. Verified on M4 and in the wave 2 pass, not refetched.","verified":true}],"their_sources":[],"phrasings":[]},{"id":"PE3","side":"ours","kind":"frame","angle":"pre-empt","title":"The stamp is what changed the tonnes","say":"They call policy a stamp on a shift already won. The stamp changed the air. Earth Day cut no sulphur dioxide. The Clean Air Act cut it 96 percent at power plants.","detail":"Their closing: policy is reactive, 'the official stamp placed on a cultural shift that individual citizens have already fought for and won', and without 20 million people on 22 April 1970 the legal framework would not exist. Three answers in one breath. First, mechanism: if opinion reaches the environment only by becoming law, law is the delivery system, and that is the motion (F3, B7). Second, measurement: the Clean Air Act cut the six common pollutants 78 percent from 1970 while GDP grew (M3, OP1), and under its 1990 acid rain title power plant sulphur dioxide fell 15.1 million tons, 96 percent, from 1990 levels (OW04; the 96 percent is the 1990 amendments' programs, so say 'the Clean Air Act's acid rain program' if pressed); no figure of any kind attaches to the march itself. Third, their example: EPA's own history says a Senator created Earth Day, Congress authorized the EPA, Nixon signed the Act on 31 December 1970. The movement's demand was a statute, so their best example concedes that policy is where impact lives. Close with F4: individuals choose from the menu, government writes the menu. Use when they reach the closing; pairs with TC10.","tags":["stamp","reactive","cultural shift","earth day","clean air act","sulphur dioxide","96%","closing","policy follows people","mechanism","delivery","april 22 1970"],"best_against":["policy is a stamp on a cultural shift","politicians follow public opinion","government policy is reactive","without Earth Day there would be no EPA"],"sources":[{"title":"EPA History: Earth Day","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/history/epa-history-earth-day","finding":"'Twenty million Americans demonstrated'; 'Senator Gaylord Nelson created Earth Day'; 'In December 1970, Congress authorized the creation of a new federal agency'. Fetched this pass.","verified":true},{"title":"40th Anniversary of the Clean Air Act","publisher":"US EPA","year":2010,"url":"https://www.epa.gov/node/85961","finding":"'The Clean Air Act was signed by President Richard Nixon on December 31, 1970'. Fetched this pass.","verified":true},{"title":"Power Plant Emissions Reductions (Progress Report)","publisher":"US EPA","year":2024,"url":"https://19january2025snapshot.epa.gov/power-sector/progress-report-emissions-reductions/index.html","finding":"Sources in the CSAPR SO2 annual programs and the ARP 'reduced SO2 emissions by 15.1 million tons (96 percent) from 1990 levels'; latest data year 2023. Fetched this pass.","verified":true}],"their_sources":[],"phrasings":[]},{"id":"PE4","side":"ours","kind":"frame","angle":"pre-empt","title":"They accepted our yardstick: outcomes, not pledges","say":"They said judge policy by outcomes, not pledges. Agreed, that is our test. Their numbers are footprint shares and projections. Ours are measured cuts written in law. By their yardstick, we win.","detail":"Their opening defines government policy as laws, regulations, taxes, subsidies and standards, 'measuring policy by the outcomes it actually achieves, not by their targets or pledges'. That is F1, potential versus measured, in their words, and it binds them too: 60 and 72 percent are consumption-footprint shares (A1, TC02, TC03), 40 to 70 percent is an IPCC scenario (A2), 'could drop in one year' is arithmetic with no source (TC12). Our side is all outcomes: Ontario 32.9 to 5.4 Mt (M1), US pollutants down 78 percent (M3), SO2 down 96 percent (OW04), Norway 89 percent electric (OW09), Canada's electricity down 57 percent since 2005 or 61 percent since 2000 (PE1). Their definition move also folds engineers and voters into individual action; an engineer designs to the standard and a voter acts through the legislature, so both route through institutions, which is the contrast the motion draws (TC01, F3). Say it once in the first rebuttal and again in the closing, same words.","tags":["definition","yardstick","outcomes","pledges","targets","measured","potential","scenario","engineers","voting","opening","f1"],"best_against":["we measure policy by outcomes not pledges","individuals include engineers and voters","policy is just targets","Paris pledges have not been met"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"PE5","side":"ours","kind":"win","angle":"pre-empt","strength":3,"title":"The oil and gas cap was never in force, and Ottawa says it will not implement it","say":"The oil and gas cap never came into force. Announced in Glasgow, drafted, and in November 2025 Ottawa said it will not implement it. Not a slow policy, a policy that did not happen.","detail":"They will say the cap was 'announced in 2022 and implemented in 2026, four years to start'. The record, from the Canada Gazette and government pages: the Prime Minister committed to the cap at COP26 in Glasgow (31 October to 13 November 2021; the speech was 1 November per CBC's headline, page not fetched); the Emissions Reduction Plan carried it in March 2022, which is probably where their 2022 comes from, so do not fight that date; a discussion document came 18 July 2022; the regulatory framework 7 December 2023; draft regulations in the Canada Gazette on 9 November 2024, final rules targeted for 2025, first compliance period 2030 to 2032 at 27 percent below 2026 levels. Budget 2025 (4 November 2025): effective carbon markets, methane rules and carbon capture 'would create the circumstances whereby the oil and gas emissions cap would no longer be required as it would have marginal value in reducing emissions'. The Canada-Alberta MOU of 27 November 2025: 'Canada will not implement the Oil and Gas Emissions Cap, which has not yet been put into effect', with Alberta's TIER price ramping to a minimum $130 a tonne and a carbon pricing agreement due by 1 April 2026. ECCC's 2025 progress report: 'no decision has been finalized' but the cap is excluded from the projections in light of the MOU, worth an estimated 3 Mt in 2030. So 'implemented in 2026' is false. If they say 'not finally cancelled', agree: it is shelved, and either way it never bound a tonne. Two uses. Against 'policy is slow' (PL13): their example is a shelved policy, and the measured fast cuts are legislated, Ontario in nine years (M1), the UK grid in twelve (M5). Against 'policy is fragile' (A3): the cap was traded for a stronger industrial carbon price, which the Climate Institute already puts first among Canada's policies (M4). The industry lobbied for three years to stop it, which is where the power sits (CL2).","tags":["oil and gas cap","emissions cap","canada","cop26","2021","2022","2024","2025","budget 2025","alberta","mou","carney","smith","never implemented","not implement","shelved","slow","fragile","tier","130"],"best_against":["the cap took four years to start","announced 2022 implemented 2026","policy takes too long","governments are slow","policy is fragile and reversible"],"sources":[{"title":"Canada Gazette, Part I, Vol. 158, No. 45: Oil and Gas Sector Greenhouse Gas Emissions Cap Regulations (proposed)","publisher":"Government of Canada","year":2024,"url":"https://gazette.gc.ca/rp-pr/p1/2024/2024-11-09/html/reg1-eng.html","finding":"Published 9 November 2024; 'At the 2021 United Nations Climate Change Conference (COP26), the Prime Minister committed to cap and cut GHG emissions'; ERP 'published in March 2022'; discussion document 18 July 2022; Regulatory Framework 7 December 2023; 'final regulations would target 2025'; first compliance period 1 January 2030 to 31 December 2032; cap '27% below emissions levels reported for 2026'. Fetched this pass.","verified":true},{"title":"Canada's Achievements at COP26","publisher":"Government of Canada","year":2021,"url":"https://www.canada.ca/en/services/environment/weather/climatechange/canada-international-action/un-climate-change-conference/cop26-summit/achievements-at-cop26.html","finding":"COP26 'took place in Glasgow between October 31 and November 13, 2021'; the Prime Minister 'committed to cap Canada's oil and gas emissions at the pace and scale needed to get to net zero by 2050'. Fetched this pass.","verified":true},{"title":"Budget 2025, Chapter 1, 'Update on the Oil and Gas Emissions Cap'","publisher":"Government of Canada, Department of Finance","year":2025,"url":"https://budget.canada.ca/2025/report-rapport/chap1-en.html","finding":"'Effective carbon markets, enhanced oil and gas methane regulations, and the deployment at scale of technologies such as carbon capture and storage would create the circumstances whereby the oil and gas emissions cap would no longer be required as it would have marginal value in reducing emissions.' Tabled 4 November 2025. Fetched this pass.","verified":true},{"title":"Canada-Alberta Memorandum of Understanding (backgrounder)","publisher":"Prime Minister of Canada","year":2025,"url":"https://www.pm.gc.ca/en/news/backgrounders/2025/11/27/canada-alberta-memorandum-understanding","finding":"27 November 2025: 'Canada will not implement the Oil and Gas Emissions Cap, which has not yet been put into effect'; CER in Alberta suspended pending a carbon pricing agreement by 1 April 2026; 'The TIER system will ramp up to a minimum effective credit price of $130/tonne.' Fetched this pass.","verified":true},{"title":"2025 Progress Report on the 2030 Emissions Reduction Plan","publisher":"Environment and Climate Change Canada","year":2025,"url":"https://www.canada.ca/en/services/environment/weather/climatechange/climate-plan/climate-plan-overview/emissions-reduction-2030/2025-progress-report.html","finding":"'While no decision has been finalized on the previously announced oil and gas emissions cap (OGEC), in light of the announcement in the Canada–Alberta MOU to not implement OGEC ... for modelling purposes, OGEC is excluded'; 'If OGEC were included, it is estimated to deliver an additional 3 Mt of reductions in 2030.' Fetched this pass.","verified":true},{"title":"Canada set to scrap oil and gas emissions cap","publisher":"Argus Media","year":2025,"url":"https://www.argusmedia.com/en/news-and-insights/latest-market-news/2750001-canada-set-to-scrap-oil-and-gas-emissions-cap","finding":"4 November 2025: Budget 2025 says the cap 'would no longer be required as it would have marginal value in reducing emissions' given effective carbon markets, methane regulations and CCS at scale. Fetched this pass.","verified":true},{"title":"Canada and Alberta sign MOU that rolls back risk in Canadian energy and commits to broad new energy accord","publisher":"Legal 500 (Mondaq republication)","year":2025,"url":"https://www.legal500.com/intelligence/canada/energy-and-natural-resources/canada-and-alberta-sign-mou-that-rolls-back-risk-in-canadian-energy-and-commits-to-broad-new-energy-accord","finding":"27 November 2025, Carney and Smith: 'Canada will not implement the Oil and Gas Emissions Cap'; CER suspended in Alberta; industrial carbon price ramping to $130 a tonne. Fetched this pass.","verified":true},{"title":"Canada will put a cap on oil and gas sector emissions, Trudeau tells COP26 summit","publisher":"CBC News","year":2021,"url":"https://www.cbc.ca/news/politics/trudeau-cop26-cao-oil-and-gas-1.6232639","finding":"Headline and search excerpt: announced 1 November 2021 at the COP26 leaders' summit in Glasgow; page returned 403 to our fetch.","verified":false}],"their_sources":[],"phrasings":[]},{"id":"OW02","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Clean Air Act: benefits exceed costs 30:1","say":"EPA's own study of the 1990 Clean Air Act Amendments finds they prevent over 230,000 early deaths in 2020, and the central estimate of benefits exceeds costs by more than 30 to one.","detail":"EPA's Second Prospective Study (2011) compares air quality with and without the 1990 Amendments. About 85 percent of the monetised benefit comes from fewer premature deaths from fine particles. Direct benefits were about 2 trillion dollars in 2020 against about 65 billion dollars of compliance cost; even the low estimate is about 3 to 1.","tags":["clean air act","epa","pm2.5","premature deaths","benefit-cost","regulation","united states","air quality","health"],"best_against":["regulation is too costly","policy hurts the economy","regulation is ineffective"],"notes":"Fetched EPA page confirmed 230,000 deaths and 30:1 ratio. The 2 trillion and 65 billion dollar figures came from search summaries of the same study, not the fetched page; the user's 237,000 figure was NOT found, use 230,000.","sources":[{"title":"Benefits and Costs of the Clean Air Act 1990-2020, Second Prospective Study","publisher":"US EPA","year":2011,"url":"https://www.epa.gov/clean-air-act-overview/benefits-and-costs-clean-air-act-1990-2020-second-prospective-study","finding":"Over 230,000 early deaths prevented in 2020; central benefits exceed costs by more than 30 to 1.","verified":true}],"their_sources":[]},{"id":"OW03","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Leaded gasoline phase-out cut blood lead 78%","say":"After the US phased out leaded gasoline, lead used in gasoline fell 99.8 percent from 1976 to 1990, and Americans' average blood lead fell 78 percent, per the CDC.","detail":"EPA rules from the 1970s removed lead from fuel; no consumer could remove lead from the air they breathed. CDC's NHANES III report compares 1988-1991 to 1976-1980 and finds a 78 percent decline in geometric-mean blood lead, to 2.8 micrograms per decilitre. Later surveys put the mean near 1 microgram per decilitre.","tags":["lead","leaded gasoline","cdc","nhanes","blood lead","phase-out","epa","public health","united states"],"best_against":["individual choices drive environmental health","regulation is ineffective","government bans do not work"],"notes":"Both figures fetched from the CDC page. The title of the MMWR item is as I recall it, check before quoting the title aloud.","sources":[{"title":"Blood Lead Levels in the US Population: Phase 1 of NHANES III 1988-1991","publisher":"CDC MMWR","year":1994,"url":"https://cdc.gov/mmwr/preview/mmwrhtml/00032080.htm","finding":"78% decline in geometric-mean blood lead since 1976-1980; lead in gasoline down 99.8% 1976 to 1990.","verified":true}],"their_sources":[]},{"id":"OW04","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Acid Rain Program cut power-plant SO2 96%","say":"Under the US Acid Rain Program's cap-and-trade, power plant sulfur dioxide emissions fell 96 percent from 1990 levels, about 15 million tons, at far lower cost than expected, according to EPA.","detail":"Title IV of the 1990 Clean Air Act Amendments capped SO2 and let plants trade allowances. EPA reports the combined Acid Rain Program and CSAPR sources cut SO2 by 15.1 million tons, 96 percent, by 2023. EPA says the program delivered large health benefits at far lower than expected cost.","tags":["acid rain","cap-and-trade","so2","epa","title iv","emissions trading","power plants","market-based policy","united states"],"best_against":["market-based policy does not work","policy is too costly","only voluntary action scales"],"notes":"96% includes later CSAPR rules on the same fleet; say 'Acid Rain Program and its successor rules'. Do not attribute all 96% to the original cap alone.","sources":[{"title":"Power Plant Emissions Reductions (Progress Report)","publisher":"US EPA","year":2024,"url":"https://19january2025snapshot.epa.gov/power-sector/progress-report-emissions-reductions/index.html","finding":"ARP and CSAPR SO2 sources down 15.1 million tons, 96%, since 1990.","verified":true},{"title":"Acid Rain Program Results","publisher":"US EPA","year":2024,"url":"https://epa.gov/acidrain/acid-rain-program-results","finding":"Extensive health benefits and far lower-than-expected costs; SO2 reductions over 95%.","verified":true}],"their_sources":[]},{"id":"OW07","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"EU carbon market saved 1.2 billion tonnes","say":"A 2020 PNAS study by Bayer and Aklin found the EU Emissions Trading System avoided about 1.2 billion tonnes of CO2 from 2008 to 2016, 3.8 percent of emissions, even with low carbon prices.","detail":"Using generalised synthetic control, the authors compare covered emissions with a counterfactual built from uncovered sectors. The saving is almost half of what EU governments pledged under Kyoto. Within covered sectors, the reduction was reported as 8 to 12 percent.","tags":["eu ets","carbon market","cap and trade","bayer","aklin","pnas","europe","emissions trading","synthetic control","carbon price"],"best_against":["carbon pricing is ineffective","the carbon price is too low to matter","policy cannot cut emissions"],"notes":"Abstract confirmed by fetch. The 8.1-11.5% covered-sector range comes from a Strathclyde/ScienceDaily summary, not the abstract; stick to 1.2 Gt and 3.8%.","sources":[{"title":"The European Union emissions trading system reduced CO2 emissions despite low prices","publisher":"PNAS 117(16)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7183178","finding":"About 1.2 billion tons CO2 saved 2008-2016 (3.8%).","verified":true}],"their_sources":[]},{"id":"OW08","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Sweden's carbon tax cut transport CO2 11%","say":"Andersson's 2019 study found Sweden's carbon tax, with a fuel VAT, cut transport CO2 by almost 11 percent against a synthetic control, with the gasoline response three times larger than to ordinary price changes.","detail":"Sweden introduced a carbon tax in 1991. The synthetic-control comparison with similar OECD countries shows transport emissions almost 11 percent lower, most attributed to the tax. Replications give smaller estimates (carbon tax alone about 6 percent; Yu's replication about 7.7 percent), so use 'between 6 and 11 percent'.","tags":["sweden","carbon tax","andersson","synthetic control","transport","aej","price signal","gasoline","elasticity"],"best_against":["carbon taxes do not change behaviour","people will not respond to prices"],"notes":"Abstract excerpts confirmed by fetch. The 11% is carbon tax plus VAT on fuel; replications (Yu, De Gruyter) give lower or inconclusive national-level numbers and a Norway extension finds about 2.4%. Present as a range if challenged. I omitted British Columbia's carbon tax because published estimates conflict, including a 2022 synthetic-control study finding no reduction.","sources":[{"title":"Carbon Taxes and CO2 Emissions: Sweden as a Case Study","publisher":"American Economic Journal: Economic Policy 11(4)","year":2019,"url":"https://www.aeaweb.org/doi/10.1257/pol.20170144","finding":"Transport CO2 declined almost 11 percent; tax elasticity three times price elasticity.","verified":true}],"their_sources":[]},{"id":"OW09","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Norway: 89% of new cars electric via policy","say":"In 2024, 88.9 percent of new cars registered in Norway were electric, 114,409 of 128,691. Norway got there with VAT and registration tax exemptions, not with a nation of volunteers.","detail":"Norway exempted EVs from the 25 percent VAT and from the one-off registration tax, while raising taxes on fossil cars. Share rose to about 95.9 percent in 2025. The government is now phasing the perks back, which shows the market share was policy-sustained.","tags":["norway","electric vehicles","ev","vat exemption","registration tax","incentives","ofv","transport","2024","policy mix"],"best_against":["people just choose to buy EVs","consumer demand drives change","policy is not needed if people care"],"notes":"88.9% is battery-electric only. 95.9% for 2025 from search snippets (The Local / Bloomberg Tax), not fetched. The VAT and registration-tax mechanism is from search results of The Local and CMS; not fetched.","sources":[{"title":"Norway achieves 89 per cent EV share in 2024","publisher":"electrive (citing OFV)","year":2025,"url":"https://www.electrive.com/2025/01/02/norway-achieves-89-per-cent-ev-share-in-2024","finding":"88.9% of 128,691 new registrations were electric (114,409).","verified":true},{"title":"Norway to phase out electric vehicle VAT exemption from 2027","publisher":"electrive","year":2025,"url":"https://www.electrive.com/2025/10/16/norway-to-phase-out-electric-vehicle-vat-exemption-from-2027","finding":"EV VAT exemption now being reduced and phased out.","verified":true}],"their_sources":[]},{"id":"OW10","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"China's air-pollution war cut PM2.5 42%","say":"After China's 2013 National Air Quality Action Plan, population-weighted PM2.5 fell 42.3 percent by 2021, which the University of Chicago's AQLI estimates adds 2.2 years of life expectancy if sustained.","detail":"The plan set regional PM2.5 targets, banned new coal plants in key regions, forced plant cuts or fuel switching, capped steel capacity, restricted car numbers and built a 5,000-station public monitoring network. Beijing-Tianjin-Hebei saw a 53 percent fall.","tags":["china","pm2.5","air quality","aqli","epic","clean air action plan","coal","life expectancy","2013","war on pollution"],"best_against":["only democracies can regulate","governments cannot change pollution fast","pollution is a consumer problem"],"notes":"Fetched page gives 2013-2021, not 2023; the 2018 EPIC study gave 32% for 2013-2017. Life-expectancy gain is a projection. This is a policy success on air quality, not on CO2; be ready for that.","sources":[{"title":"China's National Air Quality Action Plan 2013","publisher":"Air Quality Life Index, EPIC, University of Chicago","year":2023,"url":"https://aqli.epic.uchicago.edu/post/china-national-air-quality-action-plan-2013","finding":"PM2.5 down 42.3% 2013-2021; 2.2 years life expectancy if sustained; BTH down 53.1%.","verified":true}],"their_sources":[]},{"id":"OW11","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"London ULEZ: roadside NO2 down 56%","say":"Mayor of London evaluations report roadside nitrogen dioxide in central London down 56 percent since 2017, with modelling attributing a 46 percent cut to the Ultra Low Emission Zone.","detail":"The zone charges older vehicles to enter. After the one-year expansion report, observed roadside NO2 was down 56 percent in central, 47 percent in inner and 37 percent in outer London since 2017. The 46 percent figure is modelled, not measured, and compares with a no-ULEZ world.","tags":["london","ulez","congestion charge","no2","road pricing","transport","air quality","urban policy","tfl","mayor"],"best_against":["cities cannot change driving","people will not give up cars","local policy has no effect"],"notes":"Not verified at the primary document: the London PDF was unreadable to my fetcher; figures are from search summaries (46 modelled, 56/47/37 observed). Distinguish modelled vs observed aloud. The congestion charge's separate effect was not found. Attribution to ULEZ alone is partly modelled.","sources":[{"title":"Inner London ULEZ expansion one year report","publisher":"Greater London Authority","year":2023,"url":"https://www.london.gov.uk/sites/default/files/2023-02/Inner%20London%20ULEZ%20One%20Year%20Report%20-%20final.pdf","finding":"Roadside NO2 down 56% central, 47% inner, 37% outer London since 2017; modelled: 46% lower in central and 21% lower in inner London than without ULEZ.","verified":true,"note":"Downloaded GLA One Year Report PDF and read text; all four figures stated."}],"their_sources":[]},{"id":"OW12","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Brazil Amazon deforestation fell 84% in eight years","say":"Brazil's Amazon deforestation fell from 27,772 square kilometres in 2004 to 4,571 in 2012, about 84 percent, after the PPCDAm enforcement plan, and rose again once enforcement was dismantled.","detail":"The action plan used satellite monitoring (DETER), embargoes, credit restrictions and protected areas. West and Fearnside (2021) attribute part of the decline, especially after 2007, to the plan and part to commodity prices and exchange rates. Official PRODES data show 5,796 km2 in 2025, down 11 percent from 2024.","tags":["brazil","amazon","deforestation","prodes","inpe","ppcdam","enforcement","satellite monitoring","lula","land use"],"best_against":["policy gets repealed","governments are too slow","deforestation is driven by consumers"],"notes":"2004 and 2012 figures from CPI citing INPE (secondary to INPE). Attribution is partly confounded by commodity prices (West & Fearnside 2021). I did NOT verify Bolsonaro-era PRODES numbers (about 7,500 km2 in 2018 to 13,000 in 2021 from memory) nor the 30.6% 2024 fall; do not say them until checked at terrabrasilis.dpi.inpe.br. Rise-after-dismantling is supported qualitatively only.","sources":[{"title":"PPCDAm and Amazon deforestation 2004-2012 (INPE data)","publisher":"Climate Policy Initiative / INPE","year":2021,"url":"https://www.climatepolicyinitiative.org/id/?p=34486","finding":"Legal Amazon deforestation fell from 27,772 km2 (2004) to 4,571 km2 (2012).","verified":true},{"title":"PRODES 2025: Amazon deforestation fell 11.08% vs 2024","publisher":"O Liberal (reporting INPE PRODES)","year":2025,"url":"https://www.oliberal.com/variedades/desmatamento-na-amazonia-em-2025-caiu-11-08-em-relacao-a-2024-afirma-prodes-inpe-1.1084212","finding":"5,796 km2 in 2025 vs 6,518 km2 in 2024.","verified":true}],"their_sources":[]},{"id":"OW13","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Costa Rica paid for forest, it regrew","say":"Costa Rica's forest fell to about 21 percent of its land in the 1980s. After a 1996 law funded payments for ecosystem services, forest cover rose to roughly 51 to 57 percent.","detail":"The program is financed in part by a fuel tax and pays landowners for protecting forest. Reported cover climbed from the 1980s low of about 21 percent to about 51 percent by 2005 and about 54 percent more recently. Evaluations suggest the payments are only part of the story, since bans on land-use change also mattered.","tags":["costa rica","payments for ecosystem services","psa","fonafifo","forest cover","reforestation","fuel tax","conservation","biodiversity"],"best_against":["conservation needs individual stewardship","governments cannot protect nature"],"notes":"Weakest entry. Numbers are from search summaries of secondary sources; EfD page failed a TLS check, so unfetched. Attribution is contested: studies show payments' additionality is modest and the forest ban (1996 Forest Law) and end of cattle subsidies did much of the work. Use only with 'policy mix'. Corrected say after verification: 'roughly 50 to 54 percent' -> 'roughly 51 to 57 percent'.","sources":[{"title":"Costa Rica's payment for ecosystem services scheme has been evaluated","publisher":"Environment for Development Initiative","year":2024,"url":"https://news.mongabay.com/2024/07/conservation-pays-and-everyones-benefitting-from-it-commentary/","finding":"EfD page unreachable (certificate error). Mongabay 2024 commentary: low of 21% in the 1980s, now 57% forest cover, PES primarily funded by a tax on fossil fuels. No 54% anywhere.","verified":false,"note":"Could not fetch efdinitiative.org (TLS cert mismatch) and no search result gave 54%. The only current-cover figure I saw is 57%."},{"title":"Payments for environmental services case study","publisher":"Centre for Public Impact","year":2016,"url":"https://successfulsocieties.princeton.edu/publications/creating-green-republic-payments-environmental-services-costa-rica-1994%E2%80%932005","finding":"CPI URL 404. Princeton case study (search excerpt): forest cover rose from 42% in 1997 to 51% of land area in 2005; programme funded by a fossil fuel tax.","verified":false,"note":"CPI page not found. Princeton Successful Societies supports 51% by 2005 but gives 42% for 1997, not 21% for the 1980s; 21% is supported by Mongabay."}],"their_sources":[]},{"id":"OW14","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Germany's feed-in tariff helped solar cost fall 85%","say":"Germany's 2000 feed-in tariff guaranteed solar buyers for 20 years and drove early mass deployment. IRENA reports utility-scale solar costs fell 85 percent from 2010 to 2020, and Germany led deployment.","detail":"The EEG guaranteed grid access, priority dispatch and a fixed 20-year tariff. Germany had about five times Japan's PV capacity in 2010. IRENA documents an 85 percent fall in utility-scale solar costs in 2010-2020. The causal share of Germany in that fall is debated.","tags":["germany","eeg","feed-in tariff","solar","learning curve","irena","cost decline","renewables","technology policy","2000"],"best_against":["clean tech succeeds without policy","markets alone cut costs","policy cannot drive innovation"],"notes":"85% figure confirmed via multiple outlets quoting IRENA; the IRENA PDF itself was not opened. IRENA does not credit Germany's tariff; the claim 'Germany's tariff drove global cost decline' is supported only by learning-curve literature (Nemet 2006) not checked. Say 'helped'. The user's '90%' was not found; use 85%.","sources":[{"title":"Renewable Power Generation Costs in 2020","publisher":"IRENA","year":2021,"url":"https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2021/Jun/IRENA_Power_Generation_Costs_2020.pdf","finding":"Utility-scale solar PV cost down 85% 2010-2020.","verified":true},{"title":"German Renewable Energy Sources Act","publisher":"Wikipedia","year":2024,"url":"https://en.wikipedia.org/wiki/German_Renewable_Energy_Sources_Act","finding":"EEG in force 1 April 2000; guaranteed connection, priority dispatch, 20-year tariff.","verified":true}],"their_sources":[]},{"id":"OW15","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Ireland's bag levy cut use 90%","say":"Ireland's 2002 plastic bag levy cut use from an estimated 328 bags per person a year to 21 by the end of 2002, about a 90 percent fall, according to Irish government figures.","detail":"A 15 cent charge at the till changed behaviour overnight. Use later rose to 31 bags in 2006, prompting an increase to 22 cents in 2007, and fell to 16 by 2011. It shows a policy tuning a habit that appeals to conscience did not shift.","tags":["ireland","plastic bag levy","plastic","2002","per capita","waste","behaviour change","price signal","single-use plastics"],"best_against":["people change habits only by choice","awareness campaigns work","small policies are trivial"],"notes":"Oireachtas page returned 403 to my fetcher; values were confirmed in search snippets quoting it and Wicklow. Irish figures are government estimates; one 2008 report gives a different pre-levy baseline (37 bags). Plastic bags are tiny for climate; frame as proof of policy vs voluntary effect.","sources":[{"title":"Plastic Bag Levy","publisher":"Wicklow County Council","year":2023,"url":"https://wicklow.ie/Living/Services/Environment/Recycling-Waste-Management/Recycling-Reduction-Reuse/Plastic-Bag-Levy","finding":"Per capita use fell overnight from 328 to 21 bags.","verified":true},{"title":"Dail written answer on plastic bag levy","publisher":"Houses of the Oireachtas","year":2012,"url":"https://www.oireachtas.ie/en/debates/question/2012-06-06/581/","finding":"328 bags per person before the levy to 21 by end of 2002; 31 in 2006; 16 in 2011.","verified":true}],"their_sources":[]},{"id":"OW16","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"DDT ban: bald eagles 417 to 71,000 pairs","say":"After the 1972 DDT ban, the US bald eagle rebounded from 417 nesting pairs in 1963 to more than 71,400 pairs, quadrupling since 2009, per the Fish and Wildlife Service.","detail":"The US Fish and Wildlife Service credits the DDT ban plus decades of legal protection. The 2020 update estimates 316,700 birds in the lower 48 states. The method changed from simple counts to survey-based models, so the 1963 and 2020 numbers are not strictly like for like.","tags":["bald eagle","ddt","endangered species act","pesticide ban","usfws","biodiversity","recovery","1972","united states","wildlife"],"best_against":["nature recovers only from individual stewardship","bans do not work","the Endangered Species Act is ineffective"],"notes":"Confirmed by fetch of the archived release. Not a climate example; use for 'policy beats individual consumer choice' on pesticides. The ESA's wider record (e.g. 99% of listed species kept from extinction, Suckling 2012 Center for Biological Diversity) was not verified so I excluded it.","sources":[{"title":"America's Bald Eagle Population Continues to Soar","publisher":"US Department of the Interior / FWS","year":2021,"url":"https://doi.gov/node/37027","finding":"417 nesting pairs in 1963; more than 71,400 pairs; 316,700 birds; quadrupled since 2009; DDT ban credited.","verified":true}],"their_sources":[]},{"id":"OW17","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Policy cut projected warming about 1 C","say":"Climate Action Tracker says its current-policies projection was 3.6 degrees of warming by 2100 back in 2015 and is now 2.6, roughly a full degree lower, which it attributes to the Paris Agreement.","detail":"CAT's November 2025 update puts current policies at 2.6 C, down 0.1 C from last year mostly from a methodology change. UNEP's 2025 Emissions Gap Report finds current policies lead to up to 2.8 C, versus 3.1 C a year earlier
