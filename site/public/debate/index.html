ipping elements (energy, settlements, finance, norms and values, education, information feedbacks); rapid decarbonization depends on contagious social change. Fetch returned 403; confirmed through search and the PNAS commentary.","verified":false},{"title":"Social tipping intervention strategies... need to consider how change happens","publisher":"PNAS (Smith, Christie, Willis)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7245064","finding":"Transformation begins with civil society and ends in government intervention, with norms and values shaped by movements.","verified":true},{"title":"The 3.5% rule: How a small minority can change the world","publisher":"BBC Future (summarising Chenoweth and Stephan, Why Civil Resistance Works, 2011)","year":2019,"url":"https://www.bbc.com/future/article/20190513-it-only-takes-35-of-people-to-change-the-world","finding":"323 campaigns 1900-2006; none that reached 3.5 percent participation failed. BBC blocked fetch; relies on search summaries. Chenoweth calls it a rule of thumb, and critics note falling success rates.","verified":false}],"alt_say":"Opinion only changes the environment once it becomes policy, which concedes policy is the delivery mechanism. And Chenoweth's data are about toppling regimes, not tonnes of carbon.","if_they_push":"Even if norms move first, norms become tonnes only through rules; ask them for one measured norm-driven reduction that did not pass through a standard, a price or a ban.","comeback":"Policy follows norms, so the norm shift is the real cause and the law is only the receipt."},{"id":"C1","side":"for","angle":"movements","strength":2,"title":"25% tipping point","claim":"Centola showed a committed 25 percent minority can tip a whole society's norms. Individuals tip the system.","say":"That was a lab game with 20 to 30 people paid to agree. Published estimates range from 10 to 40 percent. Tipping a norm isn't cutting a tonne.","detail":"Centola et al. 2018, Science: online coordination game with groups of about 20. The 25% result is specific to that design.","tags":["25%","tipping point","centola","committed minority","norms"],"phrasings":["you only need 25 percent","the tipping point is 25 percent"],"frames":["F1"],"sources":[{"title":"Research finds tipping point for large-scale social change","publisher":"University of Pennsylvania Annenberg School","year":2018,"url":"https://www.asc.upenn.edu/news-events/news/research-finds-tipping-point-large-scale-social-change","finding":"Fetched. Ten cohorts of 20 people each earned money for agreeing on a language convention; paid confederates acted as the committed minority; threshold about 25%; authors say it can shift with circumstances.","verified":true},{"title":"Experimental evidence for tipping points in social convention","publisher":"Science (Centola et al.)","year":2018,"url":"https://www.asc.upenn.edu/sites/default/files/2021-03/Experimental%20evidence%20for%20tipping%20points%20in%20social%20convention.pdf","finding":"Paper: 10 online groups of 20 to 30 people, paid for coordinating; largest unsuccessful minority 21%, smallest successful 25%; prior literature range 10% to 40%.","verified":true,"note":"Fetched the Science paper PDF (Penn-hosted) and read text with pdftotext. Group size and the 10-43 range differ slightly from the card."},{"title":"The Pareto effect in tipping social networks: from minority to majority","publisher":"Earth System Dynamics (Everall et al.)","year":2025,"url":"https://esd.copernicus.org/articles/16/189/2025/","finding":"Fetched abstract: 'a range of critical masses where social tipping is possible; these values lie between 10 % and 43 %'.","verified":true}],"notes":"Design confirmed: ~20-person groups, participants paid per coordination, 25% minority were paid confederates. 10-43% is one review's range (Everall et al. 2025, ESD), not a consensus; say 'range from 10 to 43 percent in one review'. Corrected say after verification: '20 people paid to agree. Real-world estimates range from 10 to 43 percent' -> '20 to 30 people paid to agree. Published estimates range from 10 to 40 percent'.","their_sources":[]},{"id":"C2","side":"for","angle":"movements","strength":3,"title":"Greta and the climate strikes","claim":"One teenager started a movement of millions. Fridays for Future changed the global conversation.","say":"What did she ask for? Government action.","detail":"F3. The strikes demanded policy; their impact is measured in policy adopted.","tags":["greta","thunberg","climate strike","fridays for future","protest","millions","greta thunberg","school strike","attention","cop","agenda setting","46 countries","google search","activism","youth","f3","f1"],"phrasings":["Greta Thunberg changed the world","millions marched","Attention is not emissions; marches did not cut a tonne of carbon.","The authors credit media coverage, not the individual.","Greta's movement ended up demanding policy.","A teenager with a sign did more to raise global climate attention than decades of summits. Sisco et al. found that climate activist events in 46 countries raised climate search attention more than UN climate conferences or temperature anomalies. Individuals set the agenda that policy then reacts to."],"frames":["F3"],"sources":[{"title":"Global climate marches sharply raise attention to climate change: Analysis of climate search behavior in 46 countries","publisher":"Journal of Environmental Psychology 75:101596 (Sisco et al.)","year":2021,"url":"https://iris.unibocconi.it/handle/11565/4038543","finding":"Climate marches drove search attention more than COPs or extreme temperatures. Confirmed through a 2024 Nature Communications paper that cites it; original not opened.","verified":true},{"title":"Climate protests and concern in Germany (Nature Communications)","publisher":"Nature Communications","year":2024,"url":"https://www.nature.com/articles/s41467-024-46477-4","finding":"Protest timing study of concern; cites Sisco et al.; measures concern, not emissions.","verified":true}],"their_sources":[{"title":"Global climate marches sharply raise attention to climate change","publisher":"Journal of Environmental Psychology 75:101596 (Sisco, Pianta, Weber, Bosetti), doi:10.1016/j.jenvp.2021.101596","year":2021,"url":"https://iris.unibocconi.it/handle/11565/4038543","finding":"Across 46 countries 2015-2019 climate activist events drove more attention than political events like COPs; media coverage helps explain it. Confirmed via search; page not fetched.","verified":false}],"alt_say":"What did she ask for? Government action. Sisco and colleagues measured search attention, not emissions. Attention that never becomes policy is not a tonne of carbon.","if_they_push":"Greta's movement ended up demanding legislation; the rubric question is what was delivered, and that is policy (F1, F3).","comeback":"Attention is what moves governments; the strikers set the agenda that every policy since has followed."},{"id":"C3","side":"for","angle":"consumption","strength":2,"title":"If everyone did it","claim":"If everyone made these changes, the effect would be enormous. Every big change starts with individuals.","say":"The resolution is about impact, not intentions. “If everyone” is the one thing voluntary action can't guarantee and policy can.","detail":"F1. Policy is the mechanism that turns 'if everyone' into 'everyone'.","tags":["drop in the ocean","if everyone","collective","every big change","turn off lights","thermostat","standby power","unplug","small acts","free","immediate","household energy","multiplied","billions of people","no cost","f1"],"phrasings":["if everyone did their part","it all adds up","switch off the lights, it adds up","lower your thermostat by one degree","billions of small acts equal a big act","Turning off lights, lowering the thermostat and unplugging devices cost nothing and are available to every household immediately, multiplied across millions of homes. The sum of billions of small acts is an enormous number even if each is tiny."],"frames":["F1"],"sources":[{"title":"Household actions can provide a behavioral wedge to rapidly reduce US carbon emissions","publisher":"PNAS (Dietz et al.)","year":2009,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC2767367/","finding":"Abstract (fetched): 123 Mt carbon/yr in year 10, about 20% of household direct emissions, 7.4% of national; based on interventions that 'typically combine several policy tools and strong social marketing'; a 'reasonably achievable potential'.","verified":true},{"title":"Plastic Bag Levy","publisher":"Wicklow County Council","year":2023,"url":"https://wicklow.ie/Living/Services/Environment/Recycling-Waste-Management/Recycling-Reduction-Reuse/Plastic-Bag-Levy","finding":"Per capita use fell overnight from 328 to 21 bags.","verified":true}],"their_sources":[{"title":"Household actions can provide a behavioral wedge (standby and thermostat actions are among the 17 modeled)","publisher":"PNAS (Dietz et al.)","year":2009,"url":"https://pmc.ncbi.nlm.nih.gov/articles/2767367/","finding":"Supports the principle that aggregated household actions are material; individual actions' size is not quantified here. Opponent can point to Wynes & Nicholas ranking lightbulbs at about one eighth of a plant-based diet (not verified for lights-off specifically).","verified":false}],"alt_say":"'If everyone' is the one thing voluntary action cannot guarantee and policy can. In Ireland a levy, not a plea, changed bag habits overnight.","if_they_push":"The resolution asks about impact, not intentions; 'if everyone' needs a mechanism that makes everyone, which is policy (C3). And no one has shown a measured national drop from lights-off alone (F1).","comeback":"Household energy is a big share of emissions, and lowering thermostats and cutting standby is free, immediate and needs no vote."},{"id":"C4","side":"for","angle":"markets","strength":2,"title":"Sustainable products winning market share","claim":"NYU Stern finds sustainability-marketed products are growing far faster than conventional ones. Consumer demand is reshaping markets.","say":"That counts marketing labels, not measured impact. Greenwashing isn't emissions reduction.","detail":"The Stern index tracks products marketed as sustainable, by sales. It does not measure tonnes avoided.","tags":["sustainable products","market share","nyu stern","consumer demand","green brands","greenwashing"],"phrasings":["sustainable brands are growing twice as fast","consumers are voting with their wallets"],"frames":["F1"],"sources":[{"title":"Sustainable Market Share Index","publisher":"NYU Stern Center for Sustainable Business","year":2025,"url":"https://www.stern.nyu.edu/experience-stern/about/departments-centers-initiatives/centers-of-research/center-sustainable-business/research/csb-sustainable-market-share-index","finding":"Fetched. Tracks 'products marketed as sustainable' in 36 CPG categories by sales; 5-year CAGR 10.9% vs 2.2% for conventional; 25.4% of branded market. Does not measure environmental impact.","verified":true}],"notes":"Confirmed: index tracks marketed-as-sustainable sales, not tonnes. Year updated to the 2025 page.","their_sources":[]},{"id":"C5","side":"for","angle":"movements","strength":5,"title":"Voting is individual action","claim":"Voting is the ultimate individual action. Every policy you praise exists because individuals voted for it.","say":"Then they're arguing our side: a vote changes nothing until it becomes policy.","detail":"F3.","tags":["voting","individual","citizens","elections","definition","protest","civic action","lawsuit","donating","agency","upstream","democracy","individual action","policy is downstream","f3"],"phrasings":["voting is an individual action","individuals elected those governments","Voting is collective action, not individual action; one vote does nothing.","You are redefining the resolution to win it.","Individual action means personal consumption choices, not politics.","Government policy is not an independent force; it is the output of individuals voting, organizing, donating, lobbying and suing. If a citizen's vote or lawsuit changes a law, that impact belongs to individual action, so the resolution's comparison collapses in our favour: every policy is downstream of individuals."],"frames":["F3"],"sources":[{"title":"Social tipping intervention strategies for rapid decarbonization need to consider how change happens","publisher":"PNAS (Smith, Christie, Willis)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7245064","finding":"Social transformation begins with civil society and movements and results in government intervention.","verified":true}],"their_sources":[{"title":"Social tipping intervention strategies for rapid decarbonization need to consider how change happens (response to Otto et al.)","publisher":"PNAS (Smith, Christie, Willis)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7245064","finding":"Argues social transformation begins with civil society and movements and 'results in, rather than begins with' government intervention, citing the abolition movement.","verified":true}],"alt_say":"Then they are arguing our side: a vote, a protest or a lawsuit changes nothing until it becomes policy. If those count, the impact is policy's. If they do not, half their examples drop out. They have to pick one.","if_they_push":"Ask which definition they run. If votes and lawsuits count, the effect is the law's (F3), and the comparison is empty: if every policy is individual action then the two sides of the motion are the same thing. One vote moves nothing alone; it takes millions aggregated by an institution, and that is what policy is. If they mean personal consumption, their activism and litigation examples leave.","comeback":"Courts, votes and protests are individuals acting, so every policy you praise is individual action by another name."},{"id":"C6","side":"for","angle":"consumption","strength":1,"title":"Carbon footprint (jab only)","claim":"Everyone has a carbon footprint and everyone can shrink it.","say":"BP's marketing popularized the personal carbon footprint in the mid-2000s. Ask who benefits from focusing on individuals.","detail":"BP disputes this, so don't lean on it. Use as a one-line jab, not a load-bearing point.","tags":["carbon footprint","bp","ogilvy","marketing","jab"],"phrasings":["reduce your carbon footprint"],"frames":["F1"],"sources":[{"title":"The carbon footprint sham","publisher":"Mashable (Mark Kaufman)","year":2020,"url":"https://mashable.com/feature/carbon-footprint-pr-campaign-sham","finding":"Kaufman: BP hired Ogilvy & Mather; BP 'first promoted and soon successfully popularized the term carbon footprint in the early aughts'; calculator unveiled in 2004; 278,000 people used it in 2004.","verified":true,"note":"Got the article HTML (WebFetch blocked; plain curl returned the page). The article contains no BP rebuttal, so 'BP disputes this' is not sourced here."}],"notes":"Not verified at Mashable. Dates vary (2004 vs 2005) across secondary sources; say 'mid-2000s' stays safe. Keep as a jab.","their_sources":[]},{"id":"F5","side":"ours","kind":"frame","angle":"frames","title":"Our definitions","say":"We defined individual action as action taken by a single person, who then has to reach out and gather others for their cause, and does not include a company or organization.","detail":"Government: municipal, provincial or federal, stable, legitimate, with real executive and legislative power. Government policy: laws, actions and practices adopted by a government. Use the definition whenever they credit a company, a charity, a cooperative or a movement with a formal organization: by the definitions set in the opening, that is not individual action.","tags":["definition","definitions","organization","company","charity","ngo","cooperative","single person","scope"],"best_against":["The Ocean Cleanup","cooperatives built the transition","companies and entrepreneurs","NGOs and campaigns","divestment funds"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"F6","side":"ours","kind":"frame","angle":"frames","title":"Conditions line","say":"Individual actions matter, but government policy determines the conditions under which those actions take place.","detail":"The opening's thesis sentence and the closing's last line. Say it the same way each time so the judges hear one claim.","tags":["conditions","thesis","impetus","constraint","closing","opening"],"best_against":["closing","any lifestyle example"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"CL1","side":"ours","kind":"frame","angle":"frames","title":"Governments have scale","say":"Governments have scale. They operate with resources most individuals cannot access: they fund research into sustainable initiatives, learn from pollution data, and use national media to inform people.","detail":"From the closing draft. Pair with one measured example (M1, M3 or OW20) so scale is shown, not asserted.","tags":["scale","resources","funding","research","media","closing"],"best_against":["individuals fund and build things","philanthropy","citizen science"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"CL2","side":"ours","kind":"frame","angle":"frames","title":"Governments have power","say":"Governments have power. BP does not get to operate in Azerbaijan, or make its mistakes in Alaska, if a government does not allow it. Lobbyists exist because of the power that policy has.","detail":"From the closing draft. Governments control the products and infrastructure individuals get to use, and the information they receive. Policy is what allows individual actions to exist in the first place. Turn their capture and lobbying examples with this: lobbying is proof of where the power sits.","tags":["power","enforce","laws","lobbyists","lobbying","capture","bp","permits","authority","closing"],"best_against":["governments are captured by lobbyists","fossil fuel subsidies","companies pollute regardless"],"sources":[],"their_sources":[],"phrasings":[]},{"id":"OP1","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Clean Air Act: 78% down while GDP grew 274%","say":"Between 1970 and 2020, emissions of the major air pollutants fell 78 percent while the US economy grew 282 percent.","detail":"Our opening's version of M3, pairing EPA's pollutant trend with World Bank GDP. Use when they say regulation costs growth.","tags":["clean air act","gdp","growth","economy","274%","78%","regulation","epa"],"best_against":["regulation hurts the economy","policy is too costly","growth versus environment"],"sources":[{"title":"Our Nation's Air: Trends Through 2023","publisher":"US EPA","year":2024,"url":"https://www.epa.gov/air-trends/air-quality-national-summary","finding":"From 1970 to 2025, total emissions of the six principal air pollutants fell 78 percent; over the same period US GDP rose 349 percent.","verified":true,"note":"Fetched epa.gov page. 78% confirmed (current end year 2025; the 2024 trends report, which I could not load, covers through 2023). The 1970 to 2020 end year was not directly seen, so keep the 78% but say 'since 1970'."},{"title":"GDP (constant 2015 US$), United States","publisher":"World Bank","year":2024,"url":"https://data.worldbank.org/indicator/NY.GDP.MKTP.KD?locations=US","finding":"NY.GDP.MKTP.KD: 1970 = 5.174 trillion, 2020 = 19.740 trillion constant 2015 US$, growth 281.6 percent (274% is not right for this series).","verified":true,"note":"Values fetched from the World Bank API (api.worldbank.org v2) and growth computed."}],"their_sources":[],"phrasings":[],"notes":"Corrected say after verification: '274 percent' -> '282 percent'."},{"id":"OP2","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Germany vs US: 3.1 times the transport emissions","say":"A 2014 study by Ralph Buehler, using 2010 data, found the average American produced 3.1 times the passenger-transport CO2 emissions of the average German, because Germans make trips by means other than driving.","detail":"The infrastructure point from our opening: transit, cycling and walking networks are policy, and they decide what an individual's trip can be. The clearest evidence for F2.","tags":["germany","usa","transport","transit","cycling","walking","infrastructure","3.1","driving","car"],"best_against":["car-free living","lifestyle choices","individuals choose how to travel"],"sources":[{"title":"Comparison of transport CO2 emissions, Germany and the United States","publisher":"2014 study (to confirm)","year":2014,"url":"https://blogs.lse.ac.uk/usappblog/2015/07/17/the-u-s-can-learn-from-germanys-successful-transport-policies-to-reduce-its-co2-emissions-and-petroleum-dependence","finding":"In 2010 CO2 from ground passenger transport was 3.1 times higher per capita in the US than in Germany (also 2.1x per passenger-km, 2.4x per GDP).","verified":"partial","note":"Fetched the LSE USAPP blog (Ralph Buehler, July 2015) which quotes 3.1 per capita and names the TRR paper; 2014 year and the journal page itself not fetched. AICGS 2012 version says 3,800 vs 1,200 kg (about 3x). Data year is 2010."}],"their_sources":[],"phrasings":[],"notes":"Corrected say after verification: 'A 2014 study found the average American produced 3.1 times the transportation emissions of the average German' -> 'A 2014 study by Ralph Buehler, using 2010 data, found the average American produced 3.1 times the passenger-transport CO2 emissions of the average German'."},{"id":"OP3","side":"ours","kind":"win","angle":"policy wins","strength":3,"title":"Zero Emission Transit Fund, $2.75 billion","say":"In 2021 the Government of Canada created the Zero Emission Transit Fund with 2.75 billion dollars, so communities can buy zero-emission buses.","detail":"Our opening's funding example: capital no individual can match, spent on the option individuals then choose from.","tags":["canada","transit","buses","funding","zero emission","2.75 billion","infrastructure"],"best_against":["individuals fund the transition","entrepreneurs"],"sources":[{"title":"Zero Emission Transit Fund","publisher":"Infrastructure Canada","year":2021,"url":"https://www.canada.ca/en/housing-infrastructure-communities/news/2021/08/government-of-canada-targets-zero-emission-bus-transportation-with-launch-of-new-fund.html","finding":"$2.75 billion for infrastructure projects through the Zero Emission Transit Fund, a five-year national program allocated starting in 2021, to buy zero-emission transit and school buses plus associated infrastructure.","verified":true,"note":"Fetched canada.ca release (Aug 10, 2021). The team's housing-infrastructure.canada.ca URL failed a certificate check, so use this URL."}],"their_sources":[],"phrasings":[]},{"id":"OP4","side":"ours","kind":"win","angle":"policy wins","strength":3,"title":"Clean Toronto Together: 71,000 people, 9,775 tonnes","say":"For over 20 years the City of Toronto has run Clean Toronto Together. In 2024 it brought 71,000 people to more than 870 cleanups, and in spring 2025 City crews removed 1,111 truckloads, 9,775 tonnes of waste.","detail":"Our opening's example of government convening individuals: the city organized, informed and authorized; the people showed up. The impact is the campaign's, which is policy.","tags":["toronto","cleanup","clean toronto together","volunteers","convening","media","campaign","litter"],"best_against":["volunteers clean up","individuals organize"],"sources":[{"title":"Clean Toronto Together","publisher":"City of Toronto","year":2024,"url":"https://www.toronto.ca/news/city-of-toronto-launches-20th-annual-clean-toronto-together-spring-cleanup-campaign/","finding":"Release of April 25, 2025: 'Last year, 71,000 people participated in more than 870 cleanups' (2024 volunteers); City spring cleanup operations 'removed 1,111 truckloads of waste for a total of 9,775 metric tonnes' (2025, four weeks before the campaign, by City crews).","verified":true,"note":"Fetched toronto.ca release. The campaign page itself lacks these figures. The figures are from different years and different actors, so the card's one-spring sentence is wrong."}],"their_sources":[],"phrasings":[],"notes":"Corrected say after verification: 'One spring it brought 71,000 people to more than 870 cleanups and removed 9,775 tonnes of waste.' -> 'In 2024 it brought 71,000 people to more than 870 cleanups, and in spring 2025 City crews removed 1,111 truckloads, 9,775 tonnes of waste.'."},{"id":"OW02","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Clean Air Act: benefits exceed costs 30:1","say":"EPA's own study of the 1990 Clean Air Act Amendments finds they prevent over 230,000 early deaths in 2020, and the central estimate of benefits exceeds costs by more than 30 to one.","detail":"EPA's Second Prospective Study (2011) compares air quality with and without the 1990 Amendments. About 85 percent of the monetised benefit comes from fewer premature deaths from fine particles. Direct benefits were about 2 trillion dollars in 2020 against about 65 billion dollars of compliance cost; even the low estimate is about 3 to 1.","tags":["clean air act","epa","pm2.5","premature deaths","benefit-cost","regulation","united states","air quality","health"],"best_against":["regulation is too costly","policy hurts the economy","regulation is ineffective"],"notes":"Fetched EPA page confirmed 230,000 deaths and 30:1 ratio. The 2 trillion and 65 billion dollar figures came from search summaries of the same study, not the fetched page; the user's 237,000 figure was NOT found, use 230,000.","sources":[{"title":"Benefits and Costs of the Clean Air Act 1990-2020, Second Prospective Study","publisher":"US EPA","year":2011,"url":"https://www.epa.gov/clean-air-act-overview/benefits-and-costs-clean-air-act-1990-2020-second-prospective-study","finding":"Over 230,000 early deaths prevented in 2020; central benefits exceed costs by more than 30 to 1.","verified":true}],"their_sources":[]},{"id":"OW03","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Leaded gasoline phase-out cut blood lead 78%","say":"After the US phased out leaded gasoline, lead used in gasoline fell 99.8 percent from 1976 to 1990, and Americans' average blood lead fell 78 percent, per the CDC.","detail":"EPA rules from the 1970s removed lead from fuel; no consumer could remove lead from the air they breathed. CDC's NHANES III report compares 1988-1991 to 1976-1980 and finds a 78 percent decline in geometric-mean blood lead, to 2.8 micrograms per decilitre. Later surveys put the mean near 1 microgram per decilitre.","tags":["lead","leaded gasoline","cdc","nhanes","blood lead","phase-out","epa","public health","united states"],"best_against":["individual choices drive environmental health","regulation is ineffective","government bans do not work"],"notes":"Both figures fetched from the CDC page. The title of the MMWR item is as I recall it, check before quoting the title aloud.","sources":[{"title":"Blood Lead Levels in the US Population: Phase 1 of NHANES III 1988-1991","publisher":"CDC MMWR","year":1994,"url":"https://cdc.gov/mmwr/preview/mmwrhtml/00032080.htm","finding":"78% decline in geometric-mean blood lead since 1976-1980; lead in gasoline down 99.8% 1976 to 1990.","verified":true}],"their_sources":[]},{"id":"OW04","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Acid Rain Program cut power-plant SO2 96%","say":"Under the US Acid Rain Program's cap-and-trade, power plant sulfur dioxide emissions fell 96 percent from 1990 levels, about 15 million tons, at far lower cost than expected, according to EPA.","detail":"Title IV of the 1990 Clean Air Act Amendments capped SO2 and let plants trade allowances. EPA reports the combined Acid Rain Program and CSAPR sources cut SO2 by 15.1 million tons, 96 percent, by 2023. EPA says the program delivered large health benefits at far lower than expected cost.","tags":["acid rain","cap-and-trade","so2","epa","title iv","emissions trading","power plants","market-based policy","united states"],"best_against":["market-based policy does not work","policy is too costly","only voluntary action scales"],"notes":"96% includes later CSAPR rules on the same fleet; say 'Acid Rain Program and its successor rules'. Do not attribute all 96% to the original cap alone.","sources":[{"title":"Power Plant Emissions Reductions (Progress Report)","publisher":"US EPA","year":2024,"url":"https://19january2025snapshot.epa.gov/power-sector/progress-report-emissions-reductions/index.html","finding":"ARP and CSAPR SO2 sources down 15.1 million tons, 96%, since 1990.","verified":true},{"title":"Acid Rain Program Results","publisher":"US EPA","year":2024,"url":"https://epa.gov/acidrain/acid-rain-program-results","finding":"Extensive health benefits and far lower-than-expected costs; SO2 reductions over 95%.","verified":true}],"their_sources":[]},{"id":"OW07","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"EU carbon market saved 1.2 billion tonnes","say":"A 2020 PNAS study by Bayer and Aklin found the EU Emissions Trading System avoided about 1.2 billion tonnes of CO2 from 2008 to 2016, 3.8 percent of emissions, even with low carbon prices.","detail":"Using generalised synthetic control, the authors compare covered emissions with a counterfactual built from uncovered sectors. The saving is almost half of what EU governments pledged under Kyoto. Within covered sectors, the reduction was reported as 8 to 12 percent.","tags":["eu ets","carbon market","cap and trade","bayer","aklin","pnas","europe","emissions trading","synthetic control","carbon price"],"best_against":["carbon pricing is ineffective","the carbon price is too low to matter","policy cannot cut emissions"],"notes":"Abstract confirmed by fetch. The 8.1-11.5% covered-sector range comes from a Strathclyde/ScienceDaily summary, not the abstract; stick to 1.2 Gt and 3.8%.","sources":[{"title":"The European Union emissions trading system reduced CO2 emissions despite low prices","publisher":"PNAS 117(16)","year":2020,"url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7183178","finding":"About 1.2 billion tons CO2 saved 2008-2016 (3.8%).","verified":true}],"their_sources":[]},{"id":"OW08","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Sweden's carbon tax cut transport CO2 11%","say":"Andersson's 2019 study found Sweden's carbon tax, with a fuel VAT, cut transport CO2 by almost 11 percent against a synthetic control, with the gasoline response three times larger than to ordinary price changes.","detail":"Sweden introduced a carbon tax in 1991. The synthetic-control comparison with similar OECD countries shows transport emissions almost 11 percent lower, most attributed to the tax. Replications give smaller estimates (carbon tax alone about 6 percent; Yu's replication about 7.7 percent), so use 'between 6 and 11 percent'.","tags":["sweden","carbon tax","andersson","synthetic control","transport","aej","price signal","gasoline","elasticity"],"best_against":["carbon taxes do not change behaviour","people will not respond to prices"],"notes":"Abstract excerpts confirmed by fetch. The 11% is carbon tax plus VAT on fuel; replications (Yu, De Gruyter) give lower or inconclusive national-level numbers and a Norway extension finds about 2.4%. Present as a range if challenged. I omitted British Columbia's carbon tax because published estimates conflict, including a 2022 synthetic-control study finding no reduction.","sources":[{"title":"Carbon Taxes and CO2 Emissions: Sweden as a Case Study","publisher":"American Economic Journal: Economic Policy 11(4)","year":2019,"url":"https://www.aeaweb.org/doi/10.1257/pol.20170144","finding":"Transport CO2 declined almost 11 percent; tax elasticity three times price elasticity.","verified":true}],"their_sources":[]},{"id":"OW09","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Norway: 89% of new cars electric via policy","say":"In 2024, 88.9 percent of new cars registered in Norway were electric, 114,409 of 128,691. Norway got there with VAT and registration tax exemptions, not with a nation of volunteers.","detail":"Norway exempted EVs from the 25 percent VAT and from the one-off registration tax, while raising taxes on fossil cars. Share rose to about 95.9 percent in 2025. The government is now phasing the perks back, which shows the market share was policy-sustained.","tags":["norway","electric vehicles","ev","vat exemption","registration tax","incentives","ofv","transport","2024","policy mix"],"best_against":["people just choose to buy EVs","consumer demand drives change","policy is not needed if people care"],"notes":"88.9% is battery-electric only. 95.9% for 2025 from search snippets (The Local / Bloomberg Tax), not fetched. The VAT and registration-tax mechanism is from search results of The Local and CMS; not fetched.","sources":[{"title":"Norway achieves 89 per cent EV share in 2024","publisher":"electrive (citing OFV)","year":2025,"url":"https://www.electrive.com/2025/01/02/norway-achieves-89-per-cent-ev-share-in-2024","finding":"88.9% of 128,691 new registrations were electric (114,409).","verified":true},{"title":"Norway to phase out electric vehicle VAT exemption from 2027","publisher":"electrive","year":2025,"url":"https://www.electrive.com/2025/10/16/norway-to-phase-out-electric-vehicle-vat-exemption-from-2027","finding":"EV VAT exemption now being reduced and phased out.","verified":true}],"their_sources":[]},{"id":"OW10","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"China's air-pollution war cut PM2.5 42%","say":"After China's 2013 National Air Quality Action Plan, population-weighted PM2.5 fell 42.3 percent by 2021, which the University of Chicago's AQLI estimates adds 2.2 years of life expectancy if sustained.","detail":"The plan set regional PM2.5 targets, banned new coal plants in key regions, forced plant cuts or fuel switching, capped steel capacity, restricted car numbers and built a 5,000-station public monitoring network. Beijing-Tianjin-Hebei saw a 53 percent fall.","tags":["china","pm2.5","air quality","aqli","epic","clean air action plan","coal","life expectancy","2013","war on pollution"],"best_against":["only democracies can regulate","governments cannot change pollution fast","pollution is a consumer problem"],"notes":"Fetched page gives 2013-2021, not 2023; the 2018 EPIC study gave 32% for 2013-2017. Life-expectancy gain is a projection. This is a policy success on air quality, not on CO2; be ready for that.","sources":[{"title":"China's National Air Quality Action Plan 2013","publisher":"Air Quality Life Index, EPIC, University of Chicago","year":2023,"url":"https://aqli.epic.uchicago.edu/post/china-national-air-quality-action-plan-2013","finding":"PM2.5 down 42.3% 2013-2021; 2.2 years life expectancy if sustained; BTH down 53.1%.","verified":true}],"their_sources":[]},{"id":"OW11","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"London ULEZ: roadside NO2 down 56%","say":"Mayor of London evaluations report roadside nitrogen dioxide in central London down 56 percent since 2017, with modelling attributing a 46 percent cut to the Ultra Low Emission Zone.","detail":"The zone charges older vehicles to enter. After the one-year expansion report, observed roadside NO2 was down 56 percent in central, 47 percent in inner and 37 percent in outer London since 2017. The 46 percent figure is modelled, not measured, and compares with a no-ULEZ world.","tags":["london","ulez","congestion charge","no2","road pricing","transport","air quality","urban policy","tfl","mayor"],"best_against":["cities cannot change driving","people will not give up cars","local policy has no effect"],"notes":"Not verified at the primary document: the London PDF was unreadable to my fetcher; figures are from search summaries (46 modelled, 56/47/37 observed). Distinguish modelled vs observed aloud. The congestion charge's separate effect was not found. Attribution to ULEZ alone is partly modelled.","sources":[{"title":"Inner London ULEZ expansion one year report","publisher":"Greater London Authority","year":2023,"url":"https://www.london.gov.uk/sites/default/files/2023-02/Inner%20London%20ULEZ%20One%20Year%20Report%20-%20final.pdf","finding":"Roadside NO2 down 56% central, 47% inner, 37% outer London since 2017; modelled: 46% lower in central and 21% lower in inner London than without ULEZ.","verified":true,"note":"Downloaded GLA One Year Report PDF and read text; all four figures stated."}],"their_sources":[]},{"id":"OW12","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Brazil Amazon deforestation fell 84% in eight years","say":"Brazil's Amazon deforestation fell from 27,772 square kilometres in 2004 to 4,571 in 2012, about 84 percent, after the PPCDAm enforcement plan, and rose again once enforcement was dismantled.","detail":"The action plan used satellite monitoring (DETER), embargoes, credit restrictions and protected areas. West and Fearnside (2021) attribute part of the decline, especially after 2007, to the plan and part to commodity prices and exchange rates. Official PRODES data show 5,796 km2 in 2025, down 11 percent from 2024.","tags":["brazil","amazon","deforestation","prodes","inpe","ppcdam","enforcement","satellite monitoring","lula","land use"],"best_against":["policy gets repealed","governments are too slow","deforestation is driven by consumers"],"notes":"2004 and 2012 figures from CPI citing INPE (secondary to INPE). Attribution is partly confounded by commodity prices (West & Fearnside 2021). I did NOT verify Bolsonaro-era PRODES numbers (about 7,500 km2 in 2018 to 13,000 in 2021 from memory) nor the 30.6% 2024 fall; do not say them until checked at terrabrasilis.dpi.inpe.br. Rise-after-dismantling is supported qualitatively only.","sources":[{"title":"PPCDAm and Amazon deforestation 2004-2012 (INPE data)","publisher":"Climate Policy Initiative / INPE","year":2021,"url":"https://www.climatepolicyinitiative.org/id/?p=34486","finding":"Legal Amazon deforestation fell from 27,772 km2 (2004) to 4,571 km2 (2012).","verified":true},{"title":"PRODES 2025: Amazon deforestation fell 11.08% vs 2024","publisher":"O Liberal (reporting INPE PRODES)","year":2025,"url":"https://www.oliberal.com/variedades/desmatamento-na-amazonia-em-2025-caiu-11-08-em-relacao-a-2024-afirma-prodes-inpe-1.1084212","finding":"5,796 km2 in 2025 vs 6,518 km2 in 2024.","verified":true}],"their_sources":[]},{"id":"OW13","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Costa Rica paid for forest, it regrew","say":"Costa Rica's forest fell to about 21 percent of its land in the 1980s. After a 1996 law funded payments for ecosystem services, forest cover rose to roughly 51 to 57 percent.","detail":"The program is financed in part by a fuel tax and pays landowners for protecting forest. Reported cover climbed from the 1980s low of about 21 percent to about 51 percent by 2005 and about 54 percent more recently. Evaluations suggest the payments are only part of the story, since bans on land-use change also mattered.","tags":["costa rica","payments for ecosystem services","psa","fonafifo","forest cover","reforestation","fuel tax","conservation","biodiversity"],"best_against":["conservation needs individual stewardship","governments cannot protect nature"],"notes":"Weakest entry. Numbers are from search summaries of secondary sources; EfD page failed a TLS check, so unfetched. Attribution is contested: studies show payments' additionality is modest and the forest ban (1996 Forest Law) and end of cattle subsidies did much of the work. Use only with 'policy mix'. Corrected say after verification: 'roughly 50 to 54 percent' -> 'roughly 51 to 57 percent'.","sources":[{"title":"Costa Rica's payment for ecosystem services scheme has been evaluated","publisher":"Environment for Development Initiative","year":2024,"url":"https://news.mongabay.com/2024/07/conservation-pays-and-everyones-benefitting-from-it-commentary/","finding":"EfD page unreachable (certificate error). Mongabay 2024 commentary: low of 21% in the 1980s, now 57% forest cover, PES primarily funded by a tax on fossil fuels. No 54% anywhere.","verified":false,"note":"Could not fetch efdinitiative.org (TLS cert mismatch) and no search result gave 54%. The only current-cover figure I saw is 57%."},{"title":"Payments for environmental services case study","publisher":"Centre for Public Impact","year":2016,"url":"https://successfulsocieties.princeton.edu/publications/creating-green-republic-payments-environmental-services-costa-rica-1994%E2%80%932005","finding":"CPI URL 404. Princeton case study (search excerpt): forest cover rose from 42% in 1997 to 51% of land area in 2005; programme funded by a fossil fuel tax.","verified":false,"note":"CPI page not found. Princeton Successful Societies supports 51% by 2005 but gives 42% for 1997, not 21% for the 1980s; 21% is supported by Mongabay."}],"their_sources":[]},{"id":"OW14","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Germany's feed-in tariff helped solar cost fall 85%","say":"Germany's 2000 feed-in tariff guaranteed solar buyers for 20 years and drove early mass deployment. IRENA reports utility-scale solar costs fell 85 percent from 2010 to 2020, and Germany led deployment.","detail":"The EEG guaranteed grid access, priority dispatch and a fixed 20-year tariff. Germany had about five times Japan's PV capacity in 2010. IRENA documents an 85 percent fall in utility-scale solar costs in 2010-2020. The causal share of Germany in that fall is debated.","tags":["germany","eeg","feed-in tariff","solar","learning curve","irena","cost decline","renewables","technology policy","2000"],"best_against":["clean tech succeeds without policy","markets alone cut costs","policy cannot drive innovation"],"notes":"85% figure confirmed via multiple outlets quoting IRENA; the IRENA PDF itself was not opened. IRENA does not credit Germany's tariff; the claim 'Germany's tariff drove global cost decline' is supported only by learning-curve literature (Nemet 2006) not checked. Say 'helped'. The user's '90%' was not found; use 85%.","sources":[{"title":"Renewable Power Generation Costs in 2020","publisher":"IRENA","year":2021,"url":"https://www.irena.org/-/media/Files/IRENA/Agency/Publication/2021/Jun/IRENA_Power_Generation_Costs_2020.pdf","finding":"Utility-scale solar PV cost down 85% 2010-2020.","verified":true},{"title":"German Renewable Energy Sources Act","publisher":"Wikipedia","year":2024,"url":"https://en.wikipedia.org/wiki/German_Renewable_Energy_Sources_Act","finding":"EEG in force 1 April 2000; guaranteed connection, priority dispatch, 20-year tariff.","verified":true}],"their_sources":[]},{"id":"OW15","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Ireland's bag levy cut use 90%","say":"Ireland's 2002 plastic bag levy cut use from an estimated 328 bags per person a year to 21 by the end of 2002, about a 90 percent fall, according to Irish government figures.","detail":"A 15 cent charge at the till changed behaviour overnight. Use later rose to 31 bags in 2006, prompting an increase to 22 cents in 2007, and fell to 16 by 2011. It shows a policy tuning a habit that appeals to conscience did not shift.","tags":["ireland","plastic bag levy","plastic","2002","per capita","waste","behaviour change","price signal","single-use plastics"],"best_against":["people change habits only by choice","awareness campaigns work","small policies are trivial"],"notes":"Oireachtas page returned 403 to my fetcher; values were confirmed in search snippets quoting it and Wicklow. Irish figures are government estimates; one 2008 report gives a different pre-levy baseline (37 bags). Plastic bags are tiny for climate; frame as proof of policy vs voluntary effect.","sources":[{"title":"Plastic Bag Levy","publisher":"Wicklow County Council","year":2023,"url":"https://wicklow.ie/Living/Services/Environment/Recycling-Waste-Management/Recycling-Reduction-Reuse/Plastic-Bag-Levy","finding":"Per capita use fell overnight from 328 to 21 bags.","verified":true},{"title":"Dail written answer on plastic bag levy","publisher":"Houses of the Oireachtas","year":2012,"url":"https://www.oireachtas.ie/en/debates/question/2012-06-06/581/","finding":"328 bags per person before the levy to 21 by end of 2002; 31 in 2006; 16 in 2011.","verified":true}],"their_sources":[]},{"id":"OW16","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"DDT ban: bald eagles 417 to 71,000 pairs","say":"After the 1972 DDT ban, the US bald eagle rebounded from 417 nesting pairs in 1963 to more than 71,400 pairs, quadrupling since 2009, per the Fish and Wildlife Service.","detail":"The US Fish and Wildlife Service credits the DDT ban plus decades of legal protection. The 2020 update estimates 316,700 birds in the lower 48 states. The method changed from simple counts to survey-based models, so the 1963 and 2020 numbers are not strictly like for like.","tags":["bald eagle","ddt","endangered species act","pesticide ban","usfws","biodiversity","recovery","1972","united states","wildlife"],"best_against":["nature recovers only from individual stewardship","bans do not work","the Endangered Species Act is ineffective"],"notes":"Confirmed by fetch of the archived release. Not a climate example; use for 'policy beats individual consumer choice' on pesticides. The ESA's wider record (e.g. 99% of listed species kept from extinction, Suckling 2012 Center for Biological Diversity) was not verified so I excluded it.","sources":[{"title":"America's Bald Eagle Population Continues to Soar","publisher":"US Department of the Interior / FWS","year":2021,"url":"https://doi.gov/node/37027","finding":"417 nesting pairs in 1963; more than 71,400 pairs; 316,700 birds; quadrupled since 2009; DDT ban credited.","verified":true}],"their_sources":[]},{"id":"OW17","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"Policy cut projected warming about 1 C","say":"Climate Action Tracker says its current-policies projection was 3.6 degrees of warming by 2100 back in 2015 and is now 2.6, roughly a full degree lower, which it attributes to the Paris Agreement.","detail":"CAT's November 2025 update puts current policies at 2.6 C, down 0.1 C from last year mostly from a methodology change. UNEP's 2025 Emissions Gap Report finds current policies lead to up to 2.8 C, versus 3.1 C a year earlier and just below 4 C at Paris adoption. The gap is still large, but the reduction came from governments, not household choices.","tags":["climate action tracker","paris agreement","warming projection","current policies","unep","emissions gap","ndc","2.6c","2100"],"best_against":["policy is failing","we are on track for 4 degrees anyway","government action is too slow to matter"],"notes":"UNEP site returned 403; the UNEP figures were verified via PBL (Dutch agency) and other summaries. Caveat: CAT attributes the fall to the Paris Agreement as a whole; some decline reflects cheaper renewables. Also expect For side to say the gap remains and warming outlook has been flat for four years.","sources":[{"title":"Global Update COP30 release","publisher":"Climate Action Tracker","year":2025,"url":"https://climateactiontracker.org/press/release-global-update-2025/","finding":"Current policies 2.6 C; in 2015 3.6 C; reduced by roughly 1 C.","verified":true},{"title":"Emissions Gap Report 2025","publisher":"UNEP","year":2025,"url":"https://www.pbl.nl/en/publications/unep-emissions-gap-report-2025","finding":"Current policies up to 2.8 C; earlier just below 4 C at Paris.","verified":true}],"their_sources":[]},{"id":"OW18","side":"ours","kind":"win","angle":"policy wins","strength":4,"title":"US IRA: a large projected cut, then rollback","say":"Independent modelling put the 2022 Inflation Reduction Act at roughly 31 to 44 percent below 2005 emissions by 2030, and analysts say the 2025 repeal of its credits stalls that progress, showing policy sets the trajectory.","detail":"Rhodium Group's preliminary 2022 analysis found 31 to 44 percent below 2005 levels by 2030 with the IRA, against about 24 to 35 without. In 2025 the One Big Beautiful Bill Act substantially repealed IRA credits and Princeton REPEAT estimated it adds about 190 million tonnes of emissions in 2030 and about 470 million in 2035 relative to prior executive actions.","tags":["inflation reduction act","ira","rhodium","repeat project","princeton","tax credits","repeal","2025","united states","policy reversal"],"best_against":["policy gets repealed","policy is not durable","US policy does not matter"],"notes":"NOT verified: I found only secondary summaries; no primary Rhodium number for the post-repeal outcome. The 'policy gets repealed' attack is double-edged: a rollback proves policy moves emissions. Check Rhodium and REPEAT PDFs before using any number. Corrected detail after verification: 'early analyses from Princeton REPEAT and Rhodium said it effectively stops the emissions decline' -> 'Princeton REPEAT estimated it adds about 190 million tonnes of emissions in 2030 and about 470 million in 2035 relative to prior executive actions'.","sources":[{"title":"A Congressional Climate Deal: Emissions Effects of the Inflation Reduction Act","publisher":"Rhodium Group","year":2022,"url":"https://rhg.com/research/inflation-reduction-act","finding":"With IRA: 31% to 44% below 2005 levels in 2030 (central 40%); without: 24% to 35%; labelled preliminary.","verified":true,"note":"Fetched Rhodium page. Rhodium's later full report revised this to 32-42%."},{"title":"REPEAT: Zero Lab on the OBBB","publisher":"Princeton ZERO Lab / REPEAT Project","year":2025,"url":"https://zenodo.org/records/15801701","finding":"REPEAT summary (3 July 2025): the bill adds about 190 Mt/yr of US emissions in 2030 and about 470 Mt in 2035 vs administration executive actions (about 2% and 7% of 2005 emissions).","verified":"partial","note":"Fetched Zenodo record. It does not use the wording 'effectively stops the emissions decline', and no Rhodium OBBB analysis was checked."}],"their_sources":[]},{"id":"FR01","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"BP popularised the personal carbon footprint","say":"The idea that you should measure your own carbon footprint was pushed by BP's 2004 Ogilvy campaign, which launched a footprint calculator, reporting 278,000 uses that year. Individual blame was an oil company marketing frame.","detail":"Ogilvy created the 'carbon footprint' for BP's Beyond Petroleum campaign. Mashable's Mark Kaufman and Julie Doyle's analysis of archived BP pages argue the framing assigned responsibility to individuals. BP itself says it cannot document why it built the calculator, so claim 'popularised', not 'invented to deflect'.","tags":["carbon footprint","bp","ogilvy","2004","framing","responsibility","calculator","greenwashing","marketing","kaufman"],"best_against":["individual responsibility is the root of the problem","everyone should cut their carbon footprint first"],"notes":"The Mashable article is dated July 2020, not 2021, and is by Kaufman; it is not Supran & Oreskes (they wrote on ExxonMobil), so do not cite Supran & Oreskes for this. I could not open the Mashable page; the details come from search summaries. Safe wording: 'popularised'. Carbon footprint concept was around before BP (ecological footprint, 1990s); do not say 'invented'.","sources":[{"title":"The carbon footprint sham","publisher":"Mashable (Mark Kaufman)","year":2020,"url":"https://mashable.com/feature/carbon-footprint-pr-campaign-sham","finding":"BP hired Ogilvy & Mather; calculator unveiled 2004; 'In 2004 alone, 278,000 people calculated their footprints'; Doyle concludes BP assigns responsibility to the individual.","verified":true,"note":"Got the article HTML via plain curl. Article does not contain a BP statement that it cannot document why it built the calculator; that detail is unsourced here."},{"title":"Ogilvy (profile)","publisher":"DeSmog","year":2020,"url":"https://www.desmog.com/ogilvy/","finding":"'BP reported that in 2004, 278,000 people calculated their carbon footprint using the tool on its website'; Ogilvy created the carbon footprint concept for BP's Beyond Petroleum campaign in 2004.","verified":true,"note":"Fetched DeSmog Ogilvy profile (first 100k of 133k characters)."}],"their_sources":[]},{"id":"FR02","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Individual-action talk crowds out policy support","say":"Two Nature Climate Change papers find that promoting personal action reduces support for carbon taxes. In Werfel's Japan experiments reporting energy-saving made people about 13 percent less likely to back one.","detail":"Werfel (2017) surveyed over 14,000 Japanese respondents; those asked to report energy-saving after Fukushima were less likely to support a carbon tax. Hagmann, Ho and Loewenstein (2019) ran six experiments where a green default nudge cut support for the tax, for example 70 to 55 percent in one summary. Effects are small to moderate and do not erase support.","tags":["crowding out","nudges","carbon tax","werfel","hagmann","loewenstein","nature climate change","policy support","moral licensing","public opinion"],"best_against":["individual action inspires policy change","personal action creates a movement","nudges are a cheap complement"],"notes":"Werfel is in Nature Climate Change (2017, vol 7, 512-515), not PNAS; paywalled and unfetched, details from secondary summaries including Raimi's comment 'effects are small'. Hagmann 70 to 55 is from a secondary summary (tabledebates); the PDF was unreadable. Authors Ho and Loewenstein say nudges are complements; expect For to quote that.","sources":[{"title":"Household behaviour crowds out support for climate change policy when sufficient progress is perceived","publisher":"Nature Climate Change 7","year":2017,"url":"https://www.sciencedaily.com/releases/2017/06/170613130052.htm","finding":"ScienceDaily: those given the energy-saving checklist were 'about 13 percent less likely to support the government tax'; a separate recycling item gave 15%.","verified":"partial","note":"Nature page redirects to login. 13% confirmed on fetched press coverage; 14,000 respondents from search summary; Hagmann 2019 part not checked."},{"title":"Nudging out support for a carbon tax","publisher":"Nature Climate Change 9","year":2019,"url":"https://www.cmu.edu/dietrich/sds/docs/loewenstein/nudgingcarbontax.pdf","finding":"Green energy default nudge reduced carbon tax support across six experiments.","verified":true}],"their_sources":[]},{"id":"FR03","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Voluntary action cannot beat a collective-action problem","say":"Garrett Hardin's tragedy of the commons shows each person gains from emitting while the cost is shared, so voluntary restraint unravels. Even Ostrom, who showed communities can govern commons, found it takes rules and enforcement.","detail":"Hardin (Science, 1968): herders capture the full gain of an extra animal and share the loss. Ostrom (Nobel 2009, Governing the Commons, 1990) found durable commons governance needs design principles such as monitoring and graduated sanctions. The atmosphere is a global commons with no local community able to monitor it.","tags":["collective action","tragedy of the commons","hardin","ostrom","free rider","commons","enforcement","public goods","governance","nobel"],"best_against":["people will do the right thing voluntarily","communities self-organise","moral persuasion is enough"],"notes":"Citations are well known, but the pages were not fetched this session. The Ostrom point cuts both ways (shows voluntary governance can work at community scale); frame as 'needs rules, not goodwill'. Hardin's own coercive population solutions are widely criticised; use only the logic.","sources":[{"title":"The Tragedy of the Commons","publisher":"Science 162","year":1968,"url":"https://dlc.dlib.indiana.edu/dlc/items/873da5c8-6a7c-4071-a358-1b5b74e87332/full","finding":"Abstract: herder 'gains all the profit from that addition, while bearing only a fraction of its costs in overgrazing, which are shared by all'; leads to ruin; 'mutual coercion mutually agreed upon'.","verified":true,"note":"science.org returned 403; read the Indiana University repository copy of the 1968 paper."},{"title":"Governing the Commons","publisher":"Cambridge University Press (Elinor Ostrom)","year":1990,"url":"https://www.nobelprize.org/prizes/economic-sciences/2009/ostrom/facts/","finding":"Nobel 2009 'for her analysis of economic governance, especially the commons' (search excerpt from nobelprize.org); laureate page says users establish rules over time to use resources sustainably.","verified":"partial","note":"Nobel pages returned 403 on fetch, so only search excerpts. The design principles (monitoring, graduated sanctions) were not seen on any page I fetched."}],"their_sources":[]},{"id":"FR04","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"You cannot buy a clean grid","say":"An electric car cuts lifecycle emissions by 66 to 69 percent in Europe but only 19 to 34 percent in India, per the ICCT. The buyer's choice is the same; the grid, set by policy, decides the result.","detail":"ICCT's 2021 lifecycle study of medium-sized cars registered in 2021 finds lifetime emissions lower by 66-69 percent in Europe, 60-68 in the US, 37-45 in China and 19-34 in India relative to gasoline cars. The gap widens as grids decarbonise. Consumers choose among vehicles and tariffs that regulators and utilities make available.","tags":["grid mix","electric vehicles","icct","lifecycle","choice architecture","infrastructure","policy","india","europe","options available"],"best_against":["consumer choices drive emissions","buy an EV and you are done","green consumerism is enough"],"notes":"Ranges confirmed in search snippet quoting the ICCT paper; the ICCT page was not fetched. A November 2022 correction changed some European country values, not the headline ranges.","sources":[{"title":"A global comparison of the life-cycle GHG emissions of combustion engine and electric passenger cars","publisher":"ICCT (Bieker)","year":2021,"url":"https://theicct.org/publication/a-global-comparison-of-the-life-cycle-greenhouse-gas-emissions-of-combustion-engine-and-electric-passenger-cars/","finding":"BEV lifetime emissions 66-69% lower (Europe), 60-68% (US), 37-45% (China), 19-34% (India).","verified":true}],"their_sources":[]},{"id":"FR05","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"IPCC: demand-side potential needs enabling policy","say":"The IPCC's 2022 report finds demand-side strategies could cut emissions in buildings, land transport and food by 40 to 70 percent by 2050 relative to baseline scenarios, but it ties that to infrastructure, policy and system change, not to people simply trying harder.","detail":"Chapter 5 of Working Group III (Creutzig et al.) uses Avoid-Shift-Improve and gives the 40-70 percent potential. The potential is conditional on cities, buildings, transport systems and incentives that make low-carbon options available and normal. So the best 'individual' lever depends on the choice architecture set by governments.","tags":["ipcc","ar6","demand-side","avoid shift improve","infrastructure","enabling conditions","40-70%","lifestyle","policy","chapter 5"],"best_against":["IPCC says individuals can cut 40-70 percent","demand-side changes are individual","lifestyle change is the largest lever"],"notes":"IPCC pages returned 403. 40-70% by 2050 is confirmed via ORF and other secondary coverage; the second order draft said 50-80%, cite final. The exact enabling-conditions wording was NOT retrieved: check SPM C.10 and Ch5 executive summary before saying 'requires'. Expect For to quote the 40-70% as 'individual action'; answer that the report says it is enabled by policy and infrastructure. Corrected say after verification: 'demand-side measures could cut end-use emissions 40 to 70 percent by 2050' -> 'demand-side strategies could cut emissions in buildings, land transport and food by 40 to 70 percent by 2050 relative to baseline scenarios'.","sources":[{"title":"AR6 WGIII Chapter 5: Demand, services and social aspects of mitigation","publisher":"IPCC","year":2022,"url":"https://www.ipcc.ch/report/ar6/wg3/chapter/chapter-5/","finding":"Chapter 5: indicative potential of demand-side strategies in three end-use sectors (buildings, land transport, food) is 40-70% globally by 2050 (high confidence); SPM: relative to baseline scenarios.","verified":true,"note":"ipcc.ch fetches returned 403; quoted text came from ipcc.ch-domain search excerpts (chapter page, SPM, errata). Wording is three sectors, not all end-use emissions."}],"their_sources":[]},{"id":"FR06","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Most emissions sit in power and industry","say":"Power generation is about 38 percent of global CO2, industry about 29, and aviation only about 2 percent in commonly cited estimates. The big levers are systems individuals do not control.","detail":"Secondary summaries of IEA data put power at roughly 38 percent of 2023 CO2, industry at roughly 29 percent and ground transport 19 to 21 percent. Aviation is about 2 percent of energy CO2. Flying less matters personally but cannot move the global sectoral totals the way a grid or steel decision does.","tags":["iea","sectors","power sector","industry","aviation","transport","emissions share","co2 2023","energy","systems"],"best_against":["flying less, eating less meat, driving less are the main levers","individual lifestyle is where emissions come from"],"notes":"Weak verification: percentages came from secondary sites (Statista-type), not the IEA page, and definitions differ (transport 18.6 vs 21%). Household consumption drives final demand, so For will say all sectors serve consumers. Check IEA Emissions data explorer; do not cite shares until confirmed. Corrected say after verification: 'and aviation only about 2 percent in IEA-based figures' -> 'and aviation only about 2 percent in commonly cited estimates'.","sources":[{"title":"CO2 Emissions in 2023","publisher":"IEA","year":2024,"url":"https://www.iea.org/reports/co2-emissions-in-2023","finding":"IEA page gives only the headline (global energy CO2 +1.1% in 2023); sector shares of about 38% power, 29% industry, 21% transport appear in Statista and a secondary site, not on the fetched IEA page.","verified":"partial","note":"Fetched IEA page, no sector breakdown. WebSearch found Statista (power ~38%, transport just over 21%) and a green-tech site (38.4% power, 29% industry, ground transport 18.6%). Aviation 2% not found as a share of energy CO2 (a Statista 2% is a share of transport GHG)."}],"their_sources":[]},{"id":"FR07","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Wynes and Nicholas's 'one fewer child' is contested","say":"The widely cited claim that one fewer child saves 58.6 tonnes a year multiplies by descendants' emissions, and published critiques say it counts them multiple times. Their own car-free and flight figures are about 2.4 and 1.6 tonnes.","detail":"Wynes and Nicholas (2017, Environmental Research Letters) reviewed 39 sources and ranked 'one fewer child' first. van Basshuysen and Brandstedt (ERL 2018) argued multiple counting and ignoring net-zero trajectories; Pedersen and Lam (2018) argued the paper ignored collective and professional-sphere action. Use it to show that the biggest personal levers are the least accountable.","tags":["wynes","nicholas","environmental research letters","one fewer child","car-free","flights","critique","van basshuysen","accounting","personal footprint"],"best_against":["individuals can cut 58 tonnes by one choice","personal choices are the biggest lever","IPCC-type individual actions dominate"],"notes":"Critique existence confirmed in search; the original ERL page was not fetched and 58.6 is from the user prompt. Individual values: 2.4 t (car-free), 1.6 t (one transatlantic flight avoided) per secondary blog. Use carefully: it also shows that the paper's top lifestyle actions are large per person. Do not call the paper wrong; say 'contested accounting'.","sources":[{"title":"The climate mitigation gap: education and government recommendations miss the most effective individual actions","publisher":"Environmental Research Letters 12","year":2017,"url":"https://iopscience.iop.org/article/10.1088/1748-9326/aa7541","finding":"Wynes and Nicholas 2017: one fewer child 58.6 tCO2e/yr, car-free 2.4 tCO2e/yr, avoiding a transatlantic round-trip flight 1.6 tCO2e per flight; 39 sources, 148 scenarios.","verified":true,"note":"Fetched the IOP page; figures stated. The critiques (van Basshuysen and Brandstedt; Pedersen and Lam) were not checked."},{"title":"Comment on 'The climate mitigation gap'","publisher":"Environmental Research Letters 13 (van Basshuysen & Brandstedt)","year":2018,"url":"https://ui.adsabs.harvard.edu/abs/2018ERL....13f9501V/abstract","finding":"Argues the child figure involves multiple counting and ignores net-zero scenarios.","verified":true}],"their_sources":[]},{"id":"FR08","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Carbon Majors: use the 71% honestly","say":"CDP's 2017 Carbon Majors report links 100 fossil fuel producers to 71 percent of industrial emissions since 1988. It counts the fuel's combustion by customers, so the point is that supply is governed by policy, not that consumers are blameless.","detail":"The Carbon Majors figure includes scope 3, meaning emissions from burning the fuel they sell, and 59 percent is attributed to state-owned producers. That is why the lever is energy policy on extraction, subsidies and standards. Concede that consumers burn the fuel; argue that they cannot shift a supply system without rules.","tags":["carbon majors","cdp","71%","100 companies","scope 3","state-owned","fossil fuel producers","supply side","accountability","1988"],"best_against":["blaming companies is just deflection","consumers are responsible for the demand","corporate emissions are just consumer emissions"],"notes":"CDP figures confirmed via search results quoting the release (page not fetched). Explicit caveat: scope 3 includes consumers' combustion; a critic notes cumulative accounting is a political choice. Do not say '100 companies cause 71% of emissions' without 'linked to', 'since 1988', 'including the fuel sold'. The 2024 update (78 entities, 1854-2022) is a different version.","sources":[{"title":"New report shows just 100 companies are source of over 70% of emissions","publisher":"CDP","year":2017,"url":"https://www.cdp.net/press-releases/new-report-shows-just-100-companies-are-source-of-over-70-of-emissions","finding":"100 active fossil fuel producers linked to 71% of industrial GHG emissions since 1988.","verified":true},{"title":"The Carbon Majors Database: Launch Report","publisher":"InfluenceMap","year":2024,"url":"https://carbonmajors.org/briefing/The-Carbon-Majors-Database-26913","finding":"Over 70% of historical CO2 traced to 78 entities in the 2024 update.","verified":true}],"their_sources":[]},{"id":"FR10","side":"ours","kind":"frame","angle":"frames","strength":0,"title":"Both matter, but policy is the multiplier","say":"We do not say individuals do nothing. We say policy sets the options, prices and defaults for hundreds of millions of people at once, which is why every measured success we have shown was a policy.","detail":"One household's choice changes one household. A standard, tax or ban changes every purchase in a jurisdiction: Norway's tax rules moved a whole car market to 89 percent EVs, Ontario's coal closures cut sector emissions from 32.9 to 5.4 Mt. Hagmann and colleagues also frame nudges as complements to, not substitutes for, standard policy.","tags":["multiplier","scale","policy","defaults","norway","ontario","complement","measured position","closing","framing"],"best_against":["it is not either/or","both are needed","individuals set the culture that policy follows"],"notes":"A summary frame resting on other entries, with sources reused. The 'multiplier' framing is argument, not a measured statistic. The Ho/Loewenstein complement point comes from a Fordham interview in search results, not from the paper.","sources":[{"title":"Norway achieves 89 per cent EV share in 2024","publisher":"electrive (citing OFV)","year":2025,"url":"https://www.electrive.com/2025/01/02/norway-achieves-89-per-cent-ev-share-in-2024","finding":"88.9% of new cars electric in 2024.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2015,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG from 32.9 Mt to 5.4 Mt, 2005 to 2014.","verified":true}],"their_sources":[]},{"id":"FP02","side":"for","kind":"argument","angle":"consumption","strength":5,"title":"Rich individuals' choices dominate emissions","claim":"The top 10% of people emit about 48% of global emissions and the bottom half about 12%. Impact is concentrated in a small number of individuals whose discretionary choices (flying, big homes, SUVs, investments) swing the total, so individual action by high emitters outweighs any average policy effect.","say":"Agreed, emissions are concentrated at the top. That is the case for policy aimed at the top: a flight levy or a progressive carbon price reaches the top 10 percent in a way volunteering does not.","detail":"Chancel reports the top 10 percent emitting about 48 percent of the global total in 2019 and the bottom half about 12. We concede the fact. Concentration means a rule on high-emission activities (flying, large vehicles, investment) captures a large share with few levers, while appeals to individual conscience must reach each person. Nielsen et al. also list high-status people as citizens and organisational participants, i.e. acting through institutions.","if_they_push":"Concentration tells you where to aim, not what aims. Ask for one group of top emitters that cut voluntarily at scale; a levy reaches all of them at once. If they say policy has not reached them either, that is a reason to pull the lever, not to ask nicely (F1).","comeback":"If the top 10 percent cause half the emissions, their own choices are the decision, and no government has ever touched them.","weak":true,"tags":["top 10 percent","top 1 percent","carbon inequality","chancel","oxfam","rich","wealthy","concentration","frequent flyers","private jets","investors","bottom 50","f1"],"phrasings":["the top 1% is the problem, so the rich need to change","10% of people cause half of emissions","it's not everyone, it's the wealthy flyers"],"frames":["F1"],"uses":[],"notes":"Replaced the sweeping 'nothing voluntary has ever reached the top 10 percent' with a challenge they must answer. Weak because we concede their premise and have no measured example of a policy aimed at top emitters; a judge may hear that as policy not yet working.","sources":[{"title":"Global carbon inequality over 1990-2019","publisher":"Nature Sustainability / WID.world (Chancel)","year":2022,"url":"https://wid.world/document/global-carbon-inequality-1990-2019-wid-world-working-paper-2021-22","finding":"2019: top 10% about 48% of emissions, bottom 50% about 12%.","verified":true},{"title":"The role of high-socioeconomic-status people in locking in or rapidly reducing energy-driven GHG emissions","publisher":"Nature Energy (Nielsen et al.)","year":2021,"url":"https://doi.org/10.1038/s41560-021-00900-y","finding":"High-status people act as consumers, investors, role models, organisational participants and citizens. Abstract confirmed via search only.","verified":true}],"their_sources":[{"title":"Global carbon inequality over 1990-2019","publisher":"Nature Sustainability / WID.world working paper (Chancel)","year":2022,"url":"https://wid.world/document/global-carbon-inequality-1990-2019-wid-world-working-paper-2021-22","finding":"In 2019 the top 10% emitted about 48% of global emissions and the bottom 50% about 12% (WIR 2022 gives 47.6% and 12%). Figures confirmed via search results; page itself not fetched.","verified":true},{"title":"Confronting Carbon Inequality","publisher":"Oxfam / Stockholm Environment Institute","year":2020,"url":"https://www.oxfam.de/system/files/documents/20200921-confronting-carbon-inequality.pdf","finding":"1990-2015 cumulative emissions: richest 10% 52%, richest 1% about 15%, poorest 50% 7%. Confirmed via search summary.","verified":true},{"title":"The role of high-socioeconomic-status people in locking in or rapidly reducing energy-driven GHG emissions","publisher":"Nature Energy (Nielsen, Nicholas, Creutzig, Dietz, Stern)","year":2021,"url":"https://doi.org/10.1038/s41560-021-00900-y","finding":"High-status people act as consumers, investors, role models, organisational participants and citizens; disproportionate leverage on emissions. Abstract confirmed via search only.","verified":true}]},{"id":"FP03","side":"for","kind":"argument","angle":"consumption","strength":4,"title":"Diet is the biggest lever you control","claim":"Poore and Nemecek's analysis of about 38,700 farms found that dropping animal products could cut an individual's food footprint by up to 73% and, applied globally, cut farmland by about 3.1 billion hectares. Beef emissions range tenfold between producers, so what a person chooses to eat matters more than any plausible agricultural regulation.","say":"A scenario, not a result: that is what one person could save if they did it. The same paper argues for producer monitoring, targets and labels, so it is policy as much as plates.","detail":"Poore and Nemecek (about 38,700 farms) show what a diet shift would do if made. Our World in Data, drawing on the same work, says three-quarters of agricultural land is used for livestock, which gives 18 percent of calories (earlier draft said 'about half', which was wrong). The paper also argues for producer monitoring, flexible targets and consumer labelling, but it ranks dietary change as the largest single individual lever, so do not claim the paper is mainly about policy. A diet shift also depends on a menu that policy shapes, such as prices and labels (F2). We have not verified the exact 73 percent figure from the paper, so we do not quote it.","if_they_push":"Ask how many people have actually made the full shift, and for the measured drop in national meat emissions; we will show Ontario's measured coal result (M1). Their number is what one person could do; ours is what a province did (F1).","comeback":"Even this policy-minded paper concludes that avoiding animal products is the single biggest thing an individual can do, and you can start tonight.","weak":false,"tags":["diet","vegan","plant based","meat","dairy","beef","poore","nemecek","land use","food emissions","73 percent","3.1 billion hectares","what we eat","f1","f2"],"phrasings":["going vegan cuts your footprint by 73%","meat is the single biggest thing you can change","diet beats any farm policy"],"frames":["F1","F2"],"uses":["M1","A4"],"notes":"Corrected OWID: livestock use three-quarters of farmland, not about half. Rewrote say to carry no unverified number and to avoid overstating what the paper concludes; corrected 38,000 to 38,700 farms.","sources":[{"title":"Reducing food's environmental impacts through producers and consumers","publisher":"Science (Poore & Nemecek)","year":2018,"url":"https://doi.org/10.1126/science.aaq0216","finding":"Poore and Nemecek: 38,700 farms, about 50-fold impact variation among producers, authors argue producer monitoring and labelling; 73% and 3.1bn ha not found.","verified":"partial","note":"Science page 403 and PubMed cookie wall. Confirmed via WebSearch result excerpts from mirrors, not the publisher page. Source finding says about 38,000; mirrors say 38,700, matching the detail."},{"title":"Environmental impacts of food production","publisher":"Our World in Data","year":2022,"url":"https://ourworldindata.org/environmental-impacts-of-food","finding":"Three-quarters of agricultural land is used for livestock, which provide 18% of global calories and 37% of protein. Page fetched and confirmed.","verified":true},{"title":"The End of Coal","publisher":"Government of Ontario","year":2017,"url":"https://www.ontario.ca/page/end-coal","finding":"Electricity-sector GHG 32.9 Mt (2005) to 5.4 Mt (2014); coal banned by the Ending Coal for Cleaner Air Act, 2015.","verified":true}],"their_sources":[{"title":"Reducing food's environmental impacts through producers and consumers","publisher":"Science (Poore & Nemecek)","year":2018,"url":"https://doi.org/10.1126/science.aaq0216","finding":"Largest meta-analysis of food systems; avoiding animal products is the single biggest way to reduce an individual's impact (up to 73% lower footprint; about 3.1 billion ha less land). The 49% global emissions and 76% land-use figures usually quoted from the abstract could not be confirmed here (Science page returned 403), so quote 73% and 3.1bn ha only.","verified":false},{"title":"Environmental impacts of food production","publisher":"Our World in Data","year":2022,"url":"https://ourworldindata.org/environmental-impacts-of-food","finding":"Livestock use about half of agricultural land yet give just 18% of calories and 37% of protein; beef ranges 9 to 105 kg CO2e per 100 g protein. Page fetched and confirmed.","verified":true}]},{"id":"FP05","side":"for","kind":"argument","angle":"consumption","strength":4,"title":"Policy fails unless people comply","claim":"Every policy is implemented through individual behaviour. California's 2015 mandatory 25% urban water cut delivered 96% of its target, about 1.19 million acre-feet, only because residents actually cut lawn watering. When households do not comply, the policy has zero effect, so individual action is the binding constraint on policy impact, not the reverse.","say":"That is a policy result. The state set the target, tracked it monthly, and the Water Board reports it hit 96 percent of that target. The earlier voluntary call fell well short.","detail":"California's 2015 order cut urban water use by about 1.19 million acre-feet against a 1.24 goal, 96 percent, June 2015 to February 2016 (cumulative saving 23.9 percent against the 25 percent mandate). Households did the actual watering less, but the target, the monthly tracking and the fines (up to $500 a day, authorised July 2014) are policy. The Governor's 2014 voluntary 20 percent call was running near 7 percent in January 2015 per an AP follow-up of state figures, and the Board's own survey showed a 1 percent rise in May 2014 (sources differ; do not quote 9 percent). If compliance is the binding constraint, enforcement is the policy lever. It is also a water case, not an emissions one, and the 25 percent order was relaxed in 2016.","if_they_push":"Every policy runs through people, as every purchase runs through a shop. The 2014 voluntary call asked and got under half its target; the 2015 order set the rule and got 96 percent (F2, F4).","comeback":"The mandate achieved nothing until millions of households actually changed how they water, so individual compliance is the binding constraint on any policy.","weak":false,"tags":["compliance","enforcement","water ban","drought","california","behaviour","implementation","speed limits","recycling rates","policy depends","adoption","residents","f2"],"phrasings":["a law nobody follows saves nothing","policy is just a request that people have to act on","the water ban only worked because households cut back"],"frames":["F2"],"uses":[],"notes":"Cut say to
