name: Deploy the site to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pull request builds get their own group, so they never replace a queued deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Guard against files that must not be published
        run: node scripts/guard.mjs

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Test
        run: npm test
        working-directory: site

      - name: Build the test fixture
        run: npm run build
        working-directory: site
        env:
          CONTENT_DIR: test/fixture-content

      - name: Build
        run: npm run build
        working-directory: site

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
